<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>꿀꿀 사주 — OG Card 1200x630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nanum+Myeongjo:wght@700;800&family=Jost:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+JP:wght@700;900&family=Noto+Serif+SC:wght@700;900&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     꿀꿀 사주 — 링크 공유 카드 (Open Graph 1200x630)

     구성: 좌측 = 꽃돼지 연이 단독 주인공(두 손을 볼에 모은 치비 연이)
           우측 = 호기심을 여는 헤드라인 + 한 줄 설명 + 무료 진입 칩
     캐릭터는 기존 자산 public/images/fortune-tea-house/flower-pig-cheer.webp 를 그대로 쓴다.
     로케일: ?lang=ko|en|ja|zh-CN|zh-TW (아래 COPY 사전). 브랜드 표기는 로케일 셸 SEO
     (scripts/sync-legacy-static-to-public.mjs LOCALE_SHELL_SEO)와 같다.
     출력: public/og/code-destiny-og-vvip.png(ko) 외 로케일별 — 파일명 영구 고정, render-og-card.mjs 참고
     ============================================================ */

  :root {
    /* 골드 램프 (유광 금속 시뮬레이션) */
    --gold-hi:      #fff4d2;
    --gold-light:   #f2dda6;
    --gold:         #e8c878;
    --gold-mid:     #c9993f;
    --gold-deep:    #8f6420;
    --gold-shadow:  #5c3f12;

    /* 벨벳 (연이 딥 플럼 계열) */
    --velvet-lit:   #4a1233;
    --velvet:       #340b22;
    --velvet-deep:  #1d0614;

    /* 배경 (네오 미드나잇) */
    --night-top:    #191243;
    --night:        #0e0a26;
    --night-deep:   #06040f;

    --engrave: 0 -1px 0 rgba(0,0,0,.75), 0 1px 0 rgba(255,238,190,.26);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #06040f;
  }

  /* ---------- 1. 밤하늘 무대 + 황금 가루 ---------- */
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    isolation: isolate;
    background:
      radial-gradient(78% 62% at 50% 6%,  rgba(84, 66, 178, .40), transparent 66%),
      radial-gradient(60% 52% at 88% 96%, rgba(122, 38, 92, .34), transparent 70%),
      radial-gradient(52% 46% at 6% 88%,  rgba(38, 52, 150, .30), transparent 72%),
      linear-gradient(168deg, var(--night-top) 0%, var(--night) 46%, var(--night-deep) 100%);
  }

  .dust {
    position: absolute;
    inset: 0;
    z-index: 1;
    background-image:
      radial-gradient(1.4px 1.4px at 18% 24%,  rgba(255, 226, 150, .90), transparent 62%),
      radial-gradient(1px 1px     at 72% 62%,  rgba(255, 236, 182, .72), transparent 62%),
      radial-gradient(1.7px 1.7px at 44% 88%,  rgba(238, 198, 120, .62), transparent 62%),
      radial-gradient(1.1px 1.1px at 88% 14%,  rgba(255, 244, 206, .58), transparent 62%),
      radial-gradient(2.4px 2.4px at 30% 52%,  rgba(232, 200, 120, .30), transparent 66%),
      radial-gradient(3.2px 3.2px at 66% 20%,  rgba(255, 226, 150, .16), transparent 70%);
    background-size:
      163px 131px, 211px 173px, 271px 199px,
      139px 241px, 397px 353px, 487px 421px;
    background-position:
      0 0, 41px 63px, 97px 17px,
      23px 109px, 151px 71px, 59px 187px;
  }

  .veil {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(46% 34% at 50% 0%, rgba(214, 198, 255, .16), transparent 68%),
      radial-gradient(120% 92% at 50% 50%, transparent 52%, rgba(0, 0, 0, .62) 100%);
  }

  /* ---------- 2. 카드 — 유광 골드 베젤 ---------- */
  .bezel {
    position: relative;
    z-index: 3;
    width: 1128px;
    height: 542px;
    margin-top: 30px;
    padding: 5px;
    border-radius: 30px;
    background: linear-gradient(
      128deg,
      var(--gold-hi)     0%,
      var(--gold-mid)   11%,
      var(--gold-deep)  20%,
      var(--gold-hi)    33%,
      var(--gold-light) 40%,
      var(--gold-mid)   52%,
      var(--gold-shadow)62%,
      var(--gold-light) 74%,
      var(--gold-hi)    82%,
      var(--gold-mid)   92%,
      var(--gold-deep) 100%
    );
    box-shadow:
      0 0 0 1px rgba(92, 63, 18, .85),
      0 30px 60px -18px rgba(0, 0, 0, .82),
      0 8px 22px rgba(0, 0, 0, .55),
      0 0 90px rgba(214, 168, 78, .17);
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 25px;
    overflow: hidden;
    background:
      radial-gradient(64% 74% at 26% -6%,  rgba(196, 60, 122, .34), transparent 66%),
      radial-gradient(52% 60% at 8% 104%,  rgba(120, 22, 68, .40), transparent 72%),
      radial-gradient(46% 56% at 96% 96%,  rgba(88, 14, 52, .46), transparent 74%),
      linear-gradient(158deg, var(--velvet-lit) 0%, var(--velvet) 44%, var(--velvet-deep) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 226, 240, .16),
      inset 0 -1px 0 rgba(0, 0, 0, .6),
      inset 0 0 70px rgba(0, 0, 0, .5);
  }

  .pile {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(46deg,  rgba(255, 228, 242, .022) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-46deg, rgba(0, 0, 0, .05)        0 1px, transparent 1px 4px);
    mix-blend-mode: overlay;
  }

  .damask {
    position: absolute;
    inset: 0;
    opacity: .07;
  }

  .sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(102deg,
      transparent 26%,
      rgba(255, 232, 246, .07) 42%,
      rgba(255, 240, 250, .11) 49%,
      rgba(255, 232, 246, .05) 56%,
      transparent 72%);
  }

  .frame { position: absolute; inset: 0; }

  /* ---------- 3. 좌측 — 연이 무대 ---------- */
  .hero {
    position: absolute;
    left: 40px;
    top: 42px;
    width: 460px;
    height: 428px;
    z-index: 4;
  }

  /* 연이 뒤 블러시 + 달빛 스포트라이트 */
  .hero::before {
    content: "";
    position: absolute;
    inset: -40px -30px -10px -30px;
    background:
      radial-gradient(50% 50% at 50% 46%, rgba(255, 190, 222, .30), transparent 70%),
      radial-gradient(34% 30% at 60% 22%, rgba(255, 236, 190, .22), transparent 72%);
    z-index: -1;
  }

  /* 바닥 금빛 그림자 받침 */
  .hero::after {
    content: "";
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: -6px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, .42), transparent 72%);
    z-index: -1;
  }

  /* 원본 512² 캔버스 안 인물 영역(327x408 @ 89,50)이 무대(460x428) 가운데 꽉 차도록 배율·오프셋을 맞춘다. */
  .hero__art {
    position: absolute;
    width: 527px;
    height: 527px;
    left: -30px;
    top: -46px;
    filter: drop-shadow(0 10px 18px rgba(20, 2, 12, .55));
  }

  /* ---------- 4. 우측 — 카피 ---------- */
  .copy {
    position: absolute;
    left: 540px;
    right: 64px;
    top: 74px;
    z-index: 4;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 600;
    font-size: 15px;
    line-height: 1;
    letter-spacing: .3em;
    color: rgba(246, 226, 176, .92);
    text-shadow: var(--engrave);
  }
  .eyebrow b {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: .14em;
    color: var(--gold-light);
  }
  .eyebrow i {
    width: 6px;
    height: 6px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, var(--gold-hi), var(--gold-mid));
    box-shadow: 0 0 8px rgba(232, 200, 120, .6);
  }

  .rule {
    width: 120px;
    height: 1px;
    margin: 26px 0 28px;
    background: linear-gradient(90deg, rgba(232, 200, 120, .8), transparent);
  }

  .headline {
    font-family: 'Nanum Myeongjo', 'Batang', serif;
    font-weight: 800;
    font-size: 54px;
    line-height: 1.24;
    letter-spacing: -.005em;
    color: var(--gold);
    text-shadow:
      0 1px 0 var(--gold-deep),
      0 2px 0 var(--gold-shadow),
      0 3px 1px rgba(0, 0, 0, .55),
      0 6px 14px rgba(0, 0, 0, .55),
      0 0 30px rgba(232, 200, 120, .22);
  }
  .headline em {
    font-style: normal;
    color: var(--gold-hi);
  }

  .sub {
    margin-top: 24px;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.55;
    color: rgba(255, 222, 238, .9);
    text-shadow: 0 -1px 0 rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .4);
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 30px;
    padding: 13px 26px 13px 22px;
    border-radius: 999px;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-weight: 500;
    font-size: 19px;
    line-height: 1;
    color: #2a0718;
    background: linear-gradient(128deg, var(--gold-hi) 0%, var(--gold) 38%, var(--gold-mid) 72%, var(--gold-light) 100%);
    box-shadow:
      0 0 0 1px rgba(92, 63, 18, .9),
      inset 0 1px 0 rgba(255, 255, 255, .55),
      0 8px 18px rgba(0, 0, 0, .45),
      0 0 28px rgba(232, 200, 120, .22);
  }
  .chip svg { width: 18px; height: 18px; display: block; }

  /* ---------- 5. 하단 각인 ---------- */
  .plate {
    position: absolute;
    left: 540px;
    right: 104px;
    bottom: 42px;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .plate .k {
    font-family: 'Jost', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .32em;
    color: rgba(226, 182, 208, .72);
  }
  .plate .issuer {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: .3em;
    color: rgba(240, 212, 154, .96);
    text-shadow: var(--engrave), 0 2px 6px rgba(0, 0, 0, .5);
  }

  /* ---------- 6. 카드 밖 도메인 ---------- */
  .domain {
    position: relative;
    z-index: 3;
    margin-top: 21px;
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 1;
    letter-spacing: .42em;
    text-indent: .42em;
    color: rgba(210, 190, 240, .78);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
  }

  /* ---------- 로케일 글꼴: 한글 명조/고딕에 없는 가나·한자를 같은 결의 Noto 로 ---------- */
  html[lang="en"] .headline { font-size: 46px; line-height: 1.2; }
  html[lang="en"] .sub { font-size: 20px; }
  html[lang="ja"] .headline, html[lang="ja"] .eyebrow b { font-family: 'Noto Serif JP', serif; font-weight: 900; }
  html[lang="zh-CN"] .headline, html[lang="zh-CN"] .eyebrow b { font-family: 'Noto Serif SC', serif; font-weight: 900; }
  html[lang="zh-TW"] .headline, html[lang="zh-TW"] .eyebrow b { font-family: 'Noto Serif TC', serif; font-weight: 900; }
  html[lang="ja"] :is(.sub, .chip) { font-family: 'Noto Sans JP', sans-serif; }
  html[lang="zh-CN"] :is(.sub, .chip) { font-family: 'Noto Sans SC', sans-serif; }
  html[lang="zh-TW"] :is(.sub, .chip) { font-family: 'Noto Sans TC', sans-serif; }
  html:is([lang="ja"], [lang="zh-CN"], [lang="zh-TW"]) .headline { font-size: 50px; }
  html:is([lang="ja"], [lang="zh-CN"], [lang="zh-TW"]) .sub { font-size: 20px; }
</style>
</head>
<body>
<div class="stage">
  <div class="dust"></div>
  <div class="veil"></div>

  <div class="bezel">
    <div class="card">
      <div class="pile"></div>

      <!-- 연꽃 잎맥 문양 -->
      <svg class="damask" viewBox="0 0 1118 532" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <pattern id="lotusScale" width="96" height="58" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#f0d494" stroke-width="1.2">
              <path d="M-48 58 A48 48 0 0 1 48 58"/>
              <path d="M48 58 A48 48 0 0 1 144 58"/>
              <path d="M0 29 A48 48 0 0 1 96 29"/>
              <path d="M0 58 V44 M96 58 V44 M48 29 V15"/>
            </g>
            <g fill="#f0d494" opacity=".55">
              <circle cx="0" cy="58" r="1.4"/>
              <circle cx="96" cy="58" r="1.4"/>
              <circle cx="48" cy="29" r="1.4"/>
            </g>
          </pattern>
        </defs>
        <rect width="1118" height="532" fill="url(#lotusScale)"/>
      </svg>

      <div class="sheen"></div>

      <!-- 각인 괘선 + 네 귀 연잎 장식 -->
      <svg class="frame" viewBox="0 0 1118 532" aria-hidden="true">
        <g fill="none" stroke="#e8c878">
          <rect x="24" y="24" width="1070" height="484" rx="14"
                stroke-opacity=".55" stroke-width="1.2"/>
          <rect x="31" y="31" width="1056" height="470" rx="9"
                stroke-opacity=".26" stroke-width="1"/>
        </g>
        <g id="cornerLeaf">
          <path d="M24 66 L24 40 A16 16 0 0 1 40 24 L66 24"
                fill="none" stroke="#f4dda6" stroke-opacity=".85" stroke-width="2.2"
                stroke-linecap="round"/>
          <path d="M40 40 C55 43 63 51 66 66 C51 63 43 55 40 40 Z"
                fill="#e8c878" fill-opacity=".5"
                stroke="#f4dda6" stroke-opacity=".7" stroke-width="1.1"/>
          <circle cx="76" cy="76" r="2" fill="#f4dda6" fill-opacity=".7"/>
        </g>
        <use href="#cornerLeaf" transform="translate(1118 0) scale(-1 1)"/>
        <use href="#cornerLeaf" transform="translate(0 532) scale(1 -1)"/>
        <use href="#cornerLeaf" transform="translate(1118 532) scale(-1 -1)"/>

        <!-- 연이 주변에 흩날리는 금가루 -->
        <g fill="#f4e0ae">
          <path d="M92 118 L94 123 L99 125 L94 127 L92 132 L90 127 L85 125 L90 123 Z" opacity=".62"/>
          <path d="M470 92 L471.6 96 L475.6 97.6 L471.6 99.2 L470 103.2 L468.4 99.2 L464.4 97.6 L468.4 96 Z" opacity=".5"/>
          <path d="M498 300 L499.2 303.2 L502.4 304.4 L499.2 305.6 L498 308.8 L496.8 305.6 L493.6 304.4 L496.8 303.2 Z" opacity=".38"/>
          <path d="M1040 120 L1041.4 123.6 L1045 125 L1041.4 126.4 L1040 130 L1038.6 126.4 L1035 125 L1038.6 123.6 Z" opacity=".42"/>
        </g>

        <!-- 카피와 연이 사이 세로 구분선 -->
        <line x1="512" y1="96" x2="512" y2="436" stroke="#e8c878" stroke-opacity=".28" stroke-width="1"/>
      </svg>

      <div class="hero">
        <img class="hero__art" alt="두 손을 볼에 모으고 활짝 웃는 꽃돼지 연이"
             src="../../public/images/fortune-tea-house/flower-pig-cheer.webp">
      </div>

      <div class="copy">
        <div class="eyebrow"><b data-k="brand">꿀꿀 사주</b><i></i>HONEY FORTUNE</div>
        <div class="rule"></div>
        <div class="headline" data-k="headline">당신이 태어난 날,<br><em>하늘이 남긴 한 줄</em></div>
        <div class="sub" data-k="sub">꽃돼지 연이가 사주 · 타로 · 별자리로<br>그 한 줄을 조용히 읽어 드려요</div>
        <div class="chip">
          <span data-k="chip">오늘의 운세 · 무료로 열어보기</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4 L13 10 L7 16" fill="none" stroke="#2a0718" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <div class="plate">
        <span class="k">PRIVATE DESTINY READING</span>
        <span class="issuer">CODE DESTINY</span>
      </div>
    </div>
  </div>

  <div class="domain">code-destiny.com</div>
</div>
<script>
  // 로케일 카피 — render-og-card.mjs 가 ?lang= 로 연다. 사전에 없는 값이면 한국어 그대로 둔다.
  const COPY = {
    en: { brand: "Ggulggul Fortune", alt: "Yeoni the flower pig, beaming with both hands on her cheeks",
          headline: "The day you were born,<br><em>the sky left you a line</em>",
          sub: "Yeoni the flower pig gently reads it<br>through Saju, tarot and the stars", chip: "Today's fortune · Open free" },
    ja: { brand: "ハニーピッグ占い", alt: "両手をほっぺに添えてにっこり笑う花豚ヨニ",
          headline: "あなたが生まれた日、<br><em>空が残した一行</em>",
          sub: "花豚ヨニが四柱推命・タロット・星占いで<br>その一行をそっと読み解きます", chip: "今日の運勢 · 無料でひらく" },
    "zh-CN": { brand: "蜜豚运势", alt: "双手捧着脸颊、笑得灿烂的花猪 Yeoni",
          headline: "你出生的那一天，<br><em>天空留下的一句话</em>",
          sub: "花猪 Yeoni 用八字 · 塔罗 · 星座<br>为你轻轻读出那句话", chip: "今日运势 · 免费打开" },
    "zh-TW": { brand: "蜜豚運勢", alt: "雙手捧著臉頰、笑得燦爛的花豬 Yeoni",
          headline: "你出生的那一天，<br><em>天空留下的一句話</em>",
          sub: "花豬 Yeoni 用八字 · 塔羅 · 星座<br>為你輕輕讀出那句話", chip: "今日運勢 · 免費打開" },
  };
  const lang = new URLSearchParams(location.search).get("lang");
  const copy = COPY[lang];
  if (copy) {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-k]")) el.innerHTML = copy[el.dataset.k];
    document.querySelector(".hero__art").alt = copy.alt;
  }
</script>
</body>
</html>
