<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Code Destiny — VVIP OG Card 1200x630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nanum+Myeongjo:wght@700;800&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Code Destiny — VVIP Membership Card (Open Graph 1200x630)
     딥 버건디 벨벳 + 유광 골드 베젤 + 꽃돼지 연이 골드 카메오
     캐릭터는 운명 찻집 R2 자산(꽃돼지3-Photoroom.webp)을 그대로 쓴다
     ============================================================ */

  :root {
    /* 골드 램프 (유광 금속 시뮬레이션) */
    --gold-hi:      #fff4d2;
    --gold-light:   #f2dda6;
    --gold:         #e8c878;
    --gold-mid:     #c9993f;
    --gold-deep:    #8f6420;
    --gold-shadow:  #5c3f12;

    /* 벨벳 (연이 딥 플럼 계열) */
    --velvet-lit:   #4a1233;
    --velvet:       #340b22;
    --velvet-deep:  #1d0614;

    /* 배경 (네오 미드나잇) */
    --night-top:    #191243;
    --night:        #0e0a26;
    --night-deep:   #06040f;

    --engrave: 0 -1px 0 rgba(0,0,0,.75), 0 1px 0 rgba(255,238,190,.26);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #06040f;
  }

  /* ---------- 1. 밤하늘 무대 + 황금 가루 ---------- */
  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    isolation: isolate;
    background:
      radial-gradient(78% 62% at 50% 6%,  rgba(84, 66, 178, .40), transparent 66%),
      radial-gradient(60% 52% at 88% 96%, rgba(122, 38, 92, .34), transparent 70%),
      radial-gradient(52% 46% at 6% 88%,  rgba(38, 52, 150, .30), transparent 72%),
      linear-gradient(168deg, var(--night-top) 0%, var(--night) 46%, var(--night-deep) 100%);
  }

  /* 황금 가루 — 크기가 다른 여섯 겹의 타일이 겹치며 불규칙한 산포를 만든다 */
  .dust {
    position: absolute;
    inset: 0;
    z-index: 1;
    background-image:
      radial-gradient(1.4px 1.4px at 18% 24%,  rgba(255, 226, 150, .90), transparent 62%),
      radial-gradient(1px 1px     at 72% 62%,  rgba(255, 236, 182, .72), transparent 62%),
      radial-gradient(1.7px 1.7px at 44% 88%,  rgba(238, 198, 120, .62), transparent 62%),
      radial-gradient(1.1px 1.1px at 88% 14%,  rgba(255, 244, 206, .58), transparent 62%),
      radial-gradient(2.4px 2.4px at 30% 52%,  rgba(232, 200, 120, .30), transparent 66%),
      radial-gradient(3.2px 3.2px at 66% 20%,  rgba(255, 226, 150, .16), transparent 70%);
    background-size:
      163px 131px, 211px 173px, 271px 199px,
      139px 241px, 397px 353px, 487px 421px;
    background-position:
      0 0, 41px 63px, 97px 17px,
      23px 109px, 151px 71px, 59px 187px;
  }

  /* 상단 달빛 헤일로 + 하단 비네트 */
  .veil {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      radial-gradient(46% 34% at 50% 0%, rgba(214, 198, 255, .16), transparent 68%),
      radial-gradient(120% 92% at 50% 50%, transparent 52%, rgba(0, 0, 0, .62) 100%);
  }

  /* ---------- 2. 카드 — 유광 골드 베젤 ---------- */
  .bezel {
    position: relative;
    z-index: 3;
    width: 1128px;
    height: 542px;
    margin-top: 30px;
    padding: 5px;
    border-radius: 30px;
    /* 유광 금속: 하이라이트/그림자 밴드를 반복해 광택을 만든다 */
    background: linear-gradient(
      128deg,
      var(--gold-hi)     0%,
      var(--gold-mid)   11%,
      var(--gold-deep)  20%,
      var(--gold-hi)    33%,
      var(--gold-light) 40%,
      var(--gold-mid)   52%,
      var(--gold-shadow)62%,
      var(--gold-light) 74%,
      var(--gold-hi)    82%,
      var(--gold-mid)   92%,
      var(--gold-deep) 100%
    );
    box-shadow:
      0 0 0 1px rgba(92, 63, 18, .85),
      0 30px 60px -18px rgba(0, 0, 0, .82),
      0 8px 22px rgba(0, 0, 0, .55),
      0 0 90px rgba(214, 168, 78, .17);
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 25px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* 벨벳: 결 방향 조명 + 깊이 */
    background:
      radial-gradient(64% 74% at 50% -6%,  rgba(196, 60, 122, .34), transparent 66%),
      radial-gradient(52% 60% at 8% 104%,  rgba(120, 22, 68, .40), transparent 72%),
      radial-gradient(46% 56% at 96% 96%,  rgba(88, 14, 52, .46), transparent 74%),
      linear-gradient(158deg, var(--velvet-lit) 0%, var(--velvet) 44%, var(--velvet-deep) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 226, 240, .16),
      inset 0 -1px 0 rgba(0, 0, 0, .6),
      inset 0 0 70px rgba(0, 0, 0, .5);
  }

  /* 벨벳 파일(pile) — 아주 미세한 이중 사선 결 */
  .pile {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(46deg,  rgba(255, 228, 242, .022) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-46deg, rgba(0, 0, 0, .05)        0 1px, transparent 1px 4px);
    mix-blend-mode: overlay;
  }

  /* 연꽃 잎맥 문양 — 카드 전면에 은은하게 */
  .damask {
    position: absolute;
    inset: 0;
    opacity: .075;
  }

  /* 벨벳 위 광택 스윕 */
  .sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(102deg,
      transparent 26%,
      rgba(255, 232, 246, .07) 42%,
      rgba(255, 240, 250, .11) 49%,
      rgba(255, 232, 246, .05) 56%,
      transparent 72%);
  }

  /* 각인된 이중 괘선 + 네 귀 연잎 장식 */
  .frame { position: absolute; inset: 0; }

  /* ---------- 3. 내용 ---------- */
  .content {
    position: relative;
    z-index: 4;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 96px 30px;
  }

  .sparkles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: -1;
  }

  /* 카메오 — 유광 골드 링 안에 크림 원판, 그 위에 꽃돼지 연이 */
  .cameo {
    position: relative;
    width: 212px;
    height: 212px;
    flex: none;
    padding: 6px;
    border-radius: 50%;
    background: linear-gradient(
      132deg,
      var(--gold-hi)     0%,
      var(--gold-mid)   12%,
      var(--gold-deep)  22%,
      var(--gold-hi)    36%,
      var(--gold-light) 44%,
      var(--gold-mid)   56%,
      var(--gold-shadow)66%,
      var(--gold-light) 78%,
      var(--gold-hi)    86%,
      var(--gold-mid)  100%
    );
    box-shadow:
      0 0 0 1px rgba(92, 63, 18, .9),
      0 14px 26px rgba(0, 0, 0, .58),
      0 0 46px rgba(255, 196, 224, .2),
      0 0 78px rgba(232, 200, 120, .16);
  }

  /* 카메오 뒤 은은한 블러시 스포트라이트 */
  .cameo::before {
    content: "";
    position: absolute;
    inset: -58px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 176, 214, .2), transparent 62%);
    z-index: -1;
  }

  .cameo__disc {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    /* 크림 원판 — 파스텔 캐릭터가 짙은 벨벳에 묻히지 않게 받쳐준다 */
    background: radial-gradient(circle at 42% 30%, #fffaf7 0%, #fff1f6 56%, #f6d8e4 100%);
    /* 골드 링과 크림 사이 딥플럼 헤어라인 (골드는 밝은 면에서 사라진다) */
    box-shadow:
      inset 0 0 0 2px rgba(45, 10, 30, .92),
      inset 0 -16px 26px rgba(196, 122, 158, .3),
      inset 0 8px 18px rgba(255, 255, 255, .6);
  }

  /* 계산: 캐릭터 실체는 원본의 세로 83.5%, 가로 중심이 1.2% 우측.
     전신이 다 들어오도록 잡고 3px 만 아래로 내려 바닥에 선 느낌을 준다. */
  .cameo__pig {
    position: absolute;
    width: 214px;
    height: 214px;
    left: -10px;
    top: -4px;
    object-fit: contain;
  }

  .title {
    margin-top: 8px;
    font-family: 'Nanum Myeongjo', 'CodeDestinySerifKR', 'Batang', 'Noto Serif KR', serif;
    font-weight: 800;
    font-size: 74px;
    line-height: 1;
    letter-spacing: .1em;
    text-indent: .1em; /* letter-spacing 로 생긴 우측 여백 보정 */
    color: var(--gold);
    /* 금박 스탬핑: 아래로 눌린 금속 단차 + 은은한 발광 */
    text-shadow:
      0 1px 0 var(--gold-deep),
      0 2px 0 var(--gold-shadow),
      0 3px 1px rgba(0, 0, 0, .55),
      0 6px 14px rgba(0, 0, 0, .55),
      0 0 28px rgba(232, 200, 120, .26);
  }

  .latin {
    margin-top: 12px;
    font-family: 'Cinzel', 'CodeDestinySerifLatin', Georgia, serif;
    font-weight: 600;
    font-size: 25px;
    line-height: 1;
    letter-spacing: .46em;
    text-indent: .46em;
    color: var(--gold-light);
    text-shadow: var(--engrave), 0 3px 10px rgba(0, 0, 0, .5);
  }

  /* 마름모를 낀 골드 세필 구분선 — 카드 폭을 가로질러 수평축을 잡는다 */
  .rule {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .rule i {
    display: block;
    width: 232px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232, 200, 120, .85) 62%, rgba(232, 200, 120, .95));
  }
  .rule i + b + i {
    background: linear-gradient(270deg, transparent, rgba(232, 200, 120, .85) 62%, rgba(232, 200, 120, .95));
  }
  .rule b {
    display: block;
    width: 8px;
    height: 8px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, var(--gold-hi), var(--gold-mid));
    box-shadow: 0 0 9px rgba(232, 200, 120, .6);
  }

  .tagline {
    margin-top: 17px;
    font-family: 'Jost', 'Pretendard', system-ui, sans-serif;
    font-weight: 500;
    font-size: 15px;
    line-height: 1;
    letter-spacing: .38em;
    text-indent: .38em;
    color: rgba(246, 226, 176, .96);
    text-shadow: var(--engrave);
  }

  .disciplines {
    margin-top: 12px;
    font-family: 'Nanum Myeongjo', 'CodeDestinySerifKR', 'Batang', serif;
    font-weight: 700;
    font-size: 16px;
    line-height: 1;
    letter-spacing: .3em;
    text-indent: .3em;
    color: rgba(255, 214, 232, .84);
    text-shadow: 0 -1px 0 rgba(0, 0, 0, .7);
  }

  /* 카드 하단 각인 — 회원번호 / 발행처 */
  .plate {
    position: absolute;
    left: 100px;
    right: 100px;
    bottom: 36px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    font-family: 'Jost', system-ui, sans-serif;
    font-feature-settings: 'tnum' 1;
  }
  .plate .k {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .3em;
    text-indent: .3em;
    color: rgba(226, 182, 208, .72);
    margin-bottom: 7px;
  }
  .plate .v {
    display: block;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: .2em;
    text-indent: .2em;
    color: rgba(240, 212, 154, .96);
    text-shadow: var(--engrave), 0 2px 6px rgba(0, 0, 0, .5);
  }
  .plate .issuer {
    text-align: right;
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: rgba(240, 212, 154, .96);
    text-shadow: var(--engrave), 0 2px 6px rgba(0, 0, 0, .5);
  }

  /* ---------- 4. 카드 밖 정보 영역 ---------- */
  .domain {
    position: relative;
    z-index: 3;
    margin-top: 21px;
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 1;
    letter-spacing: .42em;
    text-indent: .42em;
    color: rgba(210, 190, 240, .78);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="dust"></div>
  <div class="veil"></div>

  <div class="bezel">
    <div class="card">
      <div class="pile"></div>

      <!-- 연꽃 잎맥 문양 -->
      <svg class="damask" viewBox="0 0 1118 532" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <pattern id="lotusScale" width="96" height="58" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#f0d494" stroke-width="1.2">
              <path d="M-48 58 A48 48 0 0 1 48 58"/>
              <path d="M48 58 A48 48 0 0 1 144 58"/>
              <path d="M0 29 A48 48 0 0 1 96 29"/>
              <path d="M0 58 V44 M96 58 V44 M48 29 V15"/>
            </g>
            <g fill="#f0d494" opacity=".55">
              <circle cx="0" cy="58" r="1.4"/>
              <circle cx="96" cy="58" r="1.4"/>
              <circle cx="48" cy="29" r="1.4"/>
            </g>
          </pattern>
        </defs>
        <rect width="1118" height="532" fill="url(#lotusScale)"/>
      </svg>

      <div class="sheen"></div>

      <!-- 각인 괘선 + 네 귀 연잎 장식 -->
      <svg class="frame" viewBox="0 0 1118 532" aria-hidden="true">
        <g fill="none" stroke="#e8c878">
          <rect x="24" y="24" width="1070" height="484" rx="14"
                stroke-opacity=".55" stroke-width="1.2"/>
          <rect x="31" y="31" width="1056" height="470" rx="9"
                stroke-opacity=".26" stroke-width="1"/>
        </g>
        <g id="cornerLeaf">
          <path d="M24 66 L24 40 A16 16 0 0 1 40 24 L66 24"
                fill="none" stroke="#f4dda6" stroke-opacity=".85" stroke-width="2.2"
                stroke-linecap="round"/>
          <path d="M40 40 C55 43 63 51 66 66 C51 63 43 55 40 40 Z"
                fill="#e8c878" fill-opacity=".5"
                stroke="#f4dda6" stroke-opacity=".7" stroke-width="1.1"/>
          <circle cx="76" cy="76" r="2" fill="#f4dda6" fill-opacity=".7"/>
        </g>
        <use href="#cornerLeaf" transform="translate(1118 0) scale(-1 1)"/>
        <use href="#cornerLeaf" transform="translate(0 532) scale(1 -1)"/>
        <use href="#cornerLeaf" transform="translate(1118 532) scale(-1 -1)"/>
      </svg>

      <div class="content">
        <!-- 카메오 둘레의 금가루 반짝임 -->
        <svg class="sparkles" viewBox="0 0 1118 300" aria-hidden="true">
          <g fill="#f4e0ae">
            <path d="M408 97 L410 102 L415 104 L410 106 L408 111 L406 106 L401 104 L406 102 Z" opacity=".72"/>
            <path d="M706 82 L707.7 86.3 L712 88 L707.7 89.7 L706 94 L704.3 89.7 L700 88 L704.3 86.3 Z" opacity=".58"/>
            <path d="M688 187 L689.4 190.6 L693 192 L689.4 193.4 L688 197 L686.6 193.4 L683 192 L686.6 190.6 Z" opacity=".48"/>
            <path d="M430 181.5 L431.3 184.7 L434.5 186 L431.3 187.3 L430 190.5 L428.7 187.3 L425.5 186 L428.7 184.7 Z" opacity=".42"/>
          </g>
        </svg>

        <!-- ===== 꽃돼지 연이 카메오 ===== -->
        <div class="cameo">
          <div class="cameo__disc">
            <img class="cameo__pig" alt="연꽃 관을 쓴 꽃돼지 연이"
                 src="https://assets.code-destiny.com/DestinyCafe/nobackground/%EA%BD%83%EB%8F%BC%EC%A7%803-Photoroom.webp">
          </div>
        </div>

        <div class="title">꿀꿀 운세</div>
        <div class="latin">HONEY FORTUNE</div>

        <div class="rule"><i></i><b></b><i></i></div>

        <div class="tagline">PRIVATE DESTINY CONSULTATION</div>
        <div class="disciplines">사주 · 타로 · 자미두수 · 궁합</div>

        <div class="plate">
          <div>
            <span class="k">MEMBER No.</span>
            <span class="v">C-DE5TINY-001</span>
          </div>
          <div class="issuer">CODE DESTINY</div>
        </div>
      </div>
    </div>
  </div>

  <div class="domain">code-destiny.com</div>
</div>
</body>
</html>
