name: PSI Lighthouse Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Target URL"
        required: false
        default: "https://code-destiny.com"
      enforce_thresholds:
        description: "Fail when thresholds are violated"
        required: false
        default: "false"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  psi-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PSI_URL: ${{ github.event.inputs.url || 'https://code-destiny.com' }}
      PSI_ENFORCE_THRESHOLDS: ${{ github.event.inputs.enforce_thresholds || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run PSI Lighthouse Audit
        env:
          PAGESPEED_API_KEY: ${{ secrets.LIGHTHOUSE_KEY || secrets.PAGESPEED_API_KEY }}
        run: node scripts/psi-lighthouse-audit.mjs

      - name: Upload PSI reports
        uses: actions/upload-artifact@v4
        with:
          name: psi-lighthouse-audit
          path: |
            reports/psi-mobile.json
            reports/psi-desktop.json
            reports/psi-summary.md

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/psi-summary.md ]; then
            cat reports/psi-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
