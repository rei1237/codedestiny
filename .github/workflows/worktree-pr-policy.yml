name: Worktree PR Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  policy:
    name: Worktree / PR Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch latest main base
        run: git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags

      - name: Verify worktree and PR policy
        run: npm run verify:worktree-policy -- --mode=ci

      - name: Verify policy self-test
        run: npm run verify:worktree-policy -- --self-test
