name: AI Locale Gate

# AI 출력 로케일 파이프의 불변식 가드(scripts/verify-ai-locale-pipeline.mjs)를 PR 에서 돌린다.
#
# 🔴 왜 전용 워크플로인가 — 이 가드는 지금까지 **실질적으로 아무데서도 돌지 않았다.**
#    도달 경로가 `i18n:check` 체인 하나뿐인데 그 체인은 (a) 배포 워크플로의 `build:cf` 안에
#    있어 머지 **뒤에** 돌고 (b) `optional: true` 라 실패해도 빌드를 안 세우며 (c) 체인 첫
#    스텝(i18n-check.mjs)이 번역 커버리지로 먼저 멈추면 이 가드까지 오지도 못한다.
#    verify:guard-wiring 은 "도달 가능"만 보므로 초록이었다 — 배선됨 ≠ 지켜짐.
#
# 🔴 트리거는 좁게(2026-08-20 사용자 지시). 모든 PR 에서 도는 게이트를 하나 더 만들지 않는다.
#    대신 이 가드가 **실제로 읽는 파일**만 건다. 그 정합성은 손으로 지키지 않는다 —
#    가드 자신의 불변식 (14)가 자기가 연 파일이 아래 paths 에 전부 들어 있는지 대조하고,
#    하나라도 빠지면 실패한다(CLAUDE.md 원칙 10).
#
# 🔴 npm ci 를 돌리지 않는다 — 이 가드는 레포 파일과 node 내장 모듈만 쓴다. 러너 기동 +
#    체크아웃 + 실행으로 끝나므로 관련 PR 에서만 20초 남짓 든다.
on:
  pull_request:
    branches: [main]
    paths:
      # ── 로케일 정본 ───────────────────────────────────────
      - "lib/i18n/ai-locale.js"
      - "lib/i18n/locale-normalize.js"
      # ── 로케일을 실어 나르는 배관 ─────────────────────────
      - "worker/index.js"
      - "lib/llm-client.ts"
      - "lib/llm-text.js"
      - "app/_lib/auth-client.ts"
      # ── LLM 을 부르는 워커 코드 ───────────────────────────
      # 🔴 파일을 손으로 나열하지 않는다. 가드가 `git grep` 으로 LLM 호출 파일을 전수 발견하므로
      #    (2026-08-20 기준 worker/lib 7 + worker/routes 26 = 33개), 새 라우트가 같은 실수를
      #    해도 걸리려면 트리거도 디렉터리 단위여야 한다.
      - "worker/lib/**"
      - "worker/routes/**"
      # ── 게이트 자신 ───────────────────────────────────────
      - "scripts/verify-ai-locale-pipeline.mjs"
      - ".github/workflows/ai-locale-gate.yml"
  workflow_dispatch:

concurrency:
  group: ai-locale-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-locale-pipeline:
    name: AI locale pipeline invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 의존성이 필요 없는 순수 모듈이라 npm ci 를 돌리지 않는다.
      - name: Verify AI locale pipeline invariants
        run: npm run verify:ai-locale-pipeline
