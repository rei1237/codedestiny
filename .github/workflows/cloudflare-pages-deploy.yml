name: Deploy to Cloudflare (Worker + Pages)

on:
  push:
    branches:
      - main
  schedule:
    # 00:05 KST daily (UTC 15:05) - ensure daily deploy even without new push
    - cron: "5 15 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CODE_DESTINY_API_URL: ${{ vars.CODE_DESTINY_API_URL || 'https://code-destiny.com' }}
      NEXT_PUBLIC_CODE_DESTINY_API_URL: ${{ vars.NEXT_PUBLIC_CODE_DESTINY_API_URL || 'https://code-destiny.com' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://code-destiny.com' }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST }}
      AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL || vars.AUTH_API_BASE_URL || 'https://code-destiny.com' }}
      AUTH_FRONTEND_BASE_URL: ${{ secrets.AUTH_FRONTEND_BASE_URL }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      NAVER_OAUTH_CLIENT_ID: ${{ secrets.NAVER_OAUTH_CLIENT_ID }}
      NAVER_OAUTH_CLIENT_SECRET: ${{ secrets.NAVER_OAUTH_CLIENT_SECRET }}
      KAKAO_OAUTH_CLIENT_ID: ${{ secrets.KAKAO_OAUTH_CLIENT_ID }}
      KAKAO_OAUTH_CLIENT_SECRET: ${{ secrets.KAKAO_OAUTH_CLIENT_SECRET }}
      FLOWER_ADMIN_SECRET: ${{ secrets.FLOWER_ADMIN_SECRET }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME || 'code-destiny' }}
      CF_PAGES_BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker AI secrets
        run: |
          if [ -n "${MONGO_URI}" ]; then
            printf '%s\n' "${MONGO_URI}" | npx wrangler secret put MONGO_URI --config wrangler.json
          fi
          if [ -n "${MONGO_DB_NAME}" ]; then
            printf '%s\n' "${MONGO_DB_NAME}" | npx wrangler secret put MONGO_DB_NAME --config wrangler.json
          fi
          if [ -n "${JWT_SECRET}" ]; then
            printf '%s\n' "${JWT_SECRET}" | npx wrangler secret put JWT_SECRET --config wrangler.json
          fi
          if [ -n "${GOOGLE_API_KEY}" ]; then
            printf '%s\n' "${GOOGLE_API_KEY}" | npx wrangler secret put GOOGLE_API_KEY --config wrangler.json
          fi
          if [ -n "${GEMINI_API_KEY}" ]; then
            printf '%s\n' "${GEMINI_API_KEY}" | npx wrangler secret put GEMINI_API_KEY --config wrangler.json
          fi
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            printf '%s\n' "${ANTHROPIC_API_KEY}" | npx wrangler secret put ANTHROPIC_API_KEY --config wrangler.json
          fi
          if [ -n "${AUTH_API_BASE_URL}" ]; then
            printf '%s\n' "${AUTH_API_BASE_URL}" | npx wrangler secret put AUTH_API_BASE_URL --config wrangler.json
          fi
          if [ -n "${AUTH_URL}" ]; then
            printf '%s\n' "${AUTH_URL}" | npx wrangler secret put AUTH_URL --config wrangler.json
          fi
          if [ -n "${AUTH_TRUST_HOST}" ]; then
            printf '%s\n' "${AUTH_TRUST_HOST}" | npx wrangler secret put AUTH_TRUST_HOST --config wrangler.json
          fi
          if [ -n "${AUTH_FRONTEND_BASE_URL}" ]; then
            printf '%s\n' "${AUTH_FRONTEND_BASE_URL}" | npx wrangler secret put AUTH_FRONTEND_BASE_URL --config wrangler.json
          fi
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID}" ]; then
            printf '%s\n' "${GOOGLE_OAUTH_CLIENT_ID}" | npx wrangler secret put GOOGLE_OAUTH_CLIENT_ID --config wrangler.json
          fi
          if [ -n "${GOOGLE_OAUTH_CLIENT_SECRET}" ]; then
            printf '%s\n' "${GOOGLE_OAUTH_CLIENT_SECRET}" | npx wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET --config wrangler.json
          fi
          if [ -n "${NAVER_OAUTH_CLIENT_ID}" ]; then
            printf '%s\n' "${NAVER_OAUTH_CLIENT_ID}" | npx wrangler secret put NAVER_OAUTH_CLIENT_ID --config wrangler.json
          fi
          if [ -n "${NAVER_OAUTH_CLIENT_SECRET}" ]; then
            printf '%s\n' "${NAVER_OAUTH_CLIENT_SECRET}" | npx wrangler secret put NAVER_OAUTH_CLIENT_SECRET --config wrangler.json
          fi
          if [ -n "${KAKAO_OAUTH_CLIENT_ID}" ]; then
            printf '%s\n' "${KAKAO_OAUTH_CLIENT_ID}" | npx wrangler secret put KAKAO_OAUTH_CLIENT_ID --config wrangler.json
          fi
          if [ -n "${KAKAO_OAUTH_CLIENT_SECRET}" ]; then
            printf '%s\n' "${KAKAO_OAUTH_CLIENT_SECRET}" | npx wrangler secret put KAKAO_OAUTH_CLIENT_SECRET --config wrangler.json
          fi
          if [ -n "${FLOWER_ADMIN_SECRET}" ]; then
            printf '%s\n' "${FLOWER_ADMIN_SECRET}" | npx wrangler secret put FLOWER_ADMIN_SECRET --config wrangler.json
          fi

      # ────────────────────────────────────────────────────────────
      # Cloudflare Pages 시크릿 동기화
      # Worker secrets(wrangler secret put)와 Pages secrets는 별도 저장소임.
      # Pages 프로젝트에도 동일 시크릿을 주입해야 Pages Worker에서 process.env가 동작함.
      # ────────────────────────────────────────────────────────────
      - name: Sync secrets to Cloudflare Pages project
        run: |
          PAGES_PROJECT="${CF_PAGES_PROJECT_NAME:-code-destiny}"
          sync_pages_secret() {
            local key="$1" val="$2"
            if [ -n "${val}" ]; then
              printf '%s\n' "${val}" | npx wrangler pages secret put "${key}" --project-name "${PAGES_PROJECT}"
            fi
          }
          sync_pages_secret MONGO_URI         "${MONGO_URI}"
          sync_pages_secret MONGO_DB_NAME     "${MONGO_DB_NAME}"
          sync_pages_secret JWT_SECRET        "${JWT_SECRET}"
          sync_pages_secret GEMINI_API_KEY    "${GEMINI_API_KEY}"
          sync_pages_secret GOOGLE_API_KEY    "${GOOGLE_API_KEY}"
          sync_pages_secret ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY}"
          sync_pages_secret AUTH_URL "${AUTH_URL}"
          sync_pages_secret AUTH_TRUST_HOST "${AUTH_TRUST_HOST}"
          sync_pages_secret AUTH_API_BASE_URL "${AUTH_API_BASE_URL}"
          sync_pages_secret AUTH_FRONTEND_BASE_URL "${AUTH_FRONTEND_BASE_URL}"
          sync_pages_secret GOOGLE_OAUTH_CLIENT_ID     "${GOOGLE_OAUTH_CLIENT_ID}"
          sync_pages_secret GOOGLE_OAUTH_CLIENT_SECRET "${GOOGLE_OAUTH_CLIENT_SECRET}"
          sync_pages_secret NAVER_OAUTH_CLIENT_ID      "${NAVER_OAUTH_CLIENT_ID}"
          sync_pages_secret NAVER_OAUTH_CLIENT_SECRET  "${NAVER_OAUTH_CLIENT_SECRET}"
          sync_pages_secret KAKAO_OAUTH_CLIENT_ID      "${KAKAO_OAUTH_CLIENT_ID}"
          sync_pages_secret KAKAO_OAUTH_CLIENT_SECRET  "${KAKAO_OAUTH_CLIENT_SECRET}"
          sync_pages_secret FLOWER_ADMIN_SECRET        "${FLOWER_ADMIN_SECRET}"

      # .open-next is gitignored — deploy-worker must run build:cf when outputs are missing (see scripts/deploy-worker.mjs).
      - name: Build OpenNext (Next + Worker bundle + dist)
        run: npm run build:cf

      # Worker deploy may fail if the API token lacks Zone Workers Routes permission.
      # continue-on-error ensures Pages deploy always runs as the primary publish path.
      - name: Deploy OpenNext Worker (workers.dev + custom domain)
        continue-on-error: true
        run: npm run deploy:cf:worker

      - name: Deploy Cloudflare Pages (pages.dev parity, same build)
        run: node scripts/deploy-pages.mjs
