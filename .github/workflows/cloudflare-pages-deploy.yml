name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      CF_PAGES_BRANCH: ${{ github.ref_name }}
      CF_PAGES_FORCE_DIRECT_DEPLOY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing required secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sync public static artifacts
        run: npm run sync:public

      - name: Verify locale main sync
        run: npm run verify:locale-main-sync

      - name: Verify runtime cache sync
        run: npm run verify:runtime-cache-sync

      - name: Wrangler token preflight
        run: npx --no-install wrangler whoami

      - name: Sync Pages Gemini secrets
        env:
          GEMINIF_API_KEY1: ${{ secrets.GEMINIF_API_KEY1 }}
          GEMINIF_API_KEY2: ${{ secrets.GEMINIF_API_KEY2 }}
          GEMINIF_API_KEY3: ${{ secrets.GEMINIF_API_KEY3 }}
          GEMINIF_API_KEY4: ${{ secrets.GEMINIF_API_KEY4 }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GOOGLE_YOUTUBE_API_KEY: ${{ secrets.GOOGLE_YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PREMIUM_GEMINI_MODEL: ${{ vars.PREMIUM_GEMINI_MODEL }}
          LIFEBOOK_GEMINI_MODEL: ${{ vars.LIFEBOOK_GEMINI_MODEL }}
          LOVE_SECRET_GEMINI_MODEL: ${{ vars.LOVE_SECRET_GEMINI_MODEL }}
          PSYCHO_ANALYSIS_GEMINI_MODEL: ${{ vars.PSYCHO_ANALYSIS_GEMINI_MODEL }}
          SUKUYO_GEMINI_MODEL: ${{ vars.SUKUYO_GEMINI_MODEL }}
          ASTRO_GEMINI_MODEL: ${{ vars.ASTRO_GEMINI_MODEL }}
          VEDIC_GEMINI_MODEL: ${{ vars.VEDIC_GEMINI_MODEL }}
          ZIWEI_GEMINI_MODEL: ${{ vars.ZIWEI_GEMINI_MODEL }}
        run: npm run secrets:cf:pages -- --skip-empty

      - name: Deploy Cloudflare Pages
        run: npm run deploy:cf:pages
