name: Deploy to Cloudflare (Worker + Pages)

on:
  push:
    branches:
      - main
  schedule:
    # 00:05 KST daily (UTC 15:05) - ensure daily deploy even without new push
    - cron: "5 15 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME || 'code-destiny-web' }}
      CF_PAGES_BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .open-next is gitignored — deploy-worker must run build:cf when outputs are missing (see scripts/deploy-worker.mjs).
      - name: Build OpenNext (Next + Worker bundle + dist)
        run: npm run build:cf

      - name: Deploy OpenNext Worker (custom domain / workers.dev)
        run: npm run deploy:cf:worker

      # Worker 배포 완료 후 시크릿 동기화 (Worker가 존재해야 secret put 성공)
      - name: Sync Worker AI secrets
        run: |
          if [ -n "${GOOGLE_API_KEY}" ]; then
            printf '%s\n' "${GOOGLE_API_KEY}" | npx wrangler secret put GOOGLE_API_KEY --config wrangler.json
          fi
          if [ -n "${GEMINI_API_KEY}" ]; then
            printf '%s\n' "${GEMINI_API_KEY}" | npx wrangler secret put GEMINI_API_KEY --config wrangler.json
          fi
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            printf '%s\n' "${ANTHROPIC_API_KEY}" | npx wrangler secret put ANTHROPIC_API_KEY --config wrangler.json
          fi
      # Cloudflare Pages는 GitHub push 기반 자동 배포(pages_build_output_dir: dist)만 사용.
      # wrangler pages deploy를 여기서도 실행하면 자동 배포와 동시에 같은 프로젝트에
      # 업로드를 시도해 "APIError: Received a malformed response from the API" 발생.
      # ↳ Pages 배포는 Cloudflare Pages CI 단독 담당. 이 step 제거로 이중 배포 방지.
