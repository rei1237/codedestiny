name: Deploy Worker Then Pages

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - public/**
      - js/**
      - styles/**
      - css/**
      - worker/**
      - index.html
      - next.config.mjs
      - package.json
      - wrangler.toml
      - worker/wrangler.toml
      - scripts/deploy-worker.mjs
      - scripts/sync-legacy-static-to-public.mjs
      - scripts/promote-static-shell-to-root.mjs
      - scripts/deploy-pages.mjs
      - scripts/sync-cloudflare-worker-secrets.mjs
      - .github/workflows/cloudflare-pages-deploy.yml
      - .github/workflows/cloudflare-worker-deploy.yml
  workflow_dispatch:

concurrency:
  group: cloudflare-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: code-destiny-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync public static artifacts
        run: npm run sync:public

      - name: Verify style sync
        run: npm run verify:style-sync

      - name: Wrangler token preflight
        run: npx --no-install wrangler whoami

      - name: Sync Worker Gemini secrets
        env:
          GEMINIF_API_KEY1: ${{ secrets.GEMINIF_API_KEY1 }}
          GEMINIF_API_KEY2: ${{ secrets.GEMINIF_API_KEY2 }}
          GEMINIF_API_KEY3: ${{ secrets.GEMINIF_API_KEY3 }}
          GEMINIF_API_KEY4: ${{ secrets.GEMINIF_API_KEY4 }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GOOGLE_YOUTUBE_API_KEY: ${{ secrets.GOOGLE_YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PREMIUM_GEMINI_MODEL: ${{ vars.PREMIUM_GEMINI_MODEL }}
          LIFEBOOK_GEMINI_MODEL: ${{ vars.LIFEBOOK_GEMINI_MODEL }}
          LOVE_SECRET_GEMINI_MODEL: ${{ vars.LOVE_SECRET_GEMINI_MODEL }}
          PSYCHO_ANALYSIS_GEMINI_MODEL: ${{ vars.PSYCHO_ANALYSIS_GEMINI_MODEL }}
          SUKUYO_GEMINI_MODEL: ${{ vars.SUKUYO_GEMINI_MODEL }}
          ASTRO_GEMINI_MODEL: ${{ vars.ASTRO_GEMINI_MODEL }}
          VEDIC_GEMINI_MODEL: ${{ vars.VEDIC_GEMINI_MODEL }}
          ZIWEI_GEMINI_MODEL: ${{ vars.ZIWEI_GEMINI_MODEL }}
        run: npm run secrets:cf:worker -- --skip-empty

      - name: Worker preflight build (dry-run)
        run: npm run build:worker

      - name: Deploy Cloudflare Worker
        run: npm run deploy:cf:worker

  deploy-pages:
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Sync legacy static files to public
        run: node scripts/sync-legacy-static-to-public.mjs

      - name: Build Next.js static export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npm run deploy:cf:pages -- --branch main
