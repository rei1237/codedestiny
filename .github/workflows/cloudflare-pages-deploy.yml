name: Deploy Pages Frontend

on:
  push:
    branches:
      - main
    paths-ignore:
      - worker/**
      - scripts/deploy-worker.mjs
      - scripts/sync-cloudflare-worker-secrets.mjs
      - worker/wrangler.toml
      - .github/workflows/cloudflare-worker-deploy.yml
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: codedestiny
      CF_PAGES_BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:cf

      - name: Deploy Cloudflare Pages
        run: node scripts/deploy-pages.mjs
