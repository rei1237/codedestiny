name: Release Cloudflare Pages and Worker

# 🔴 프로덕션에 도달하는 유일한 경로다.
#
# feature 브랜치 → PR → PR CI 통과 → main 머지 → **스테이징 자동 배포**.
# 프로덕션은 사람이 Run workflow(mode=production)를 눌렀을 때만 나간다.
#
# 2026-08-20 컷오버로 push 의 의미가 뒤집혔다. 그 전에는 머지가 곧 프로덕션이라,
# 수정 하나마다 라이브가 갈리고 재방문자가 매번 "새 버전이 배포되었습니다" 배너를 봤다
# (app/components/AppVersionGuard.tsx). 이제 수정은 스테이징에 쌓이고, 사람이 묶어서 내보낸다.
#
# 로컬에서 wrangler 를 직접 부르는 길은 scripts/lib/production-deploy-guard.mjs 가 막는다.
#
# 배포 기준은 머지된 main 커밋의 정확한 SHA(`github.sha`) 하나이고, Pages 와 Worker 는 그 하나의
# 체크아웃에서 함께 나간다. 두 시스템이 서로 다른 코드를 가리키는 상태가 결제·인증 사고의
# 실제 원인이었기 때문에, 배포 후 양쪽 런타임에서 SHA 를 다시 읽어 대조한다.
#
# 🔴 schedule 이 붙어 있는 이유 — 머지가 **스테이징** 배포로 이어지지 않는 구간이 실제로 존재한다.
# concurrency 그룹은 실행 1 + 대기 1 만 유지하므로, 연속 머지 시 **대기 중이던 런이 취소된다**
# (최근 60런 중 8건). 취소된 런은 잡이 시작조차 안 해서 PR 코멘트도 메일도 없다.
# 2026-08-12 에는 8건 연속 머지 동안 성공한 배포가 0건이었고 프로덕션이 46분간 옛 SHA 에 머물렀다.
# 20분마다 "프로덕션이 main HEAD 인가"를 확인해 아니면 스스로 수렴한다. 취소·[skip ci]·
# 일시적 실패가 어떤 조합으로 오든 최대 20분 뒤에는 복구된다.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "production = code-destiny.com 승격. staging = staging.code-destiny.com 승격. preview = 빌드·스모크만. rollback = 지정 버전으로 되돌리기."
        type: choice
        options:
          - production
          - staging
          - preview
          - rollback
        default: preview
      pages_deployment_id:
        description: "rollback 전용: 되돌릴 Pages 배포 ID"
        type: string
        required: false
      worker_version_id:
        description: "rollback 전용: 되돌릴 Worker 버전 ID"
        type: string
        required: false
      allow_redeploy:
        description: "같은 SHA 를 다시 빌드해 배포한다. 일일 운세 재발행처럼 커밋은 그대로인데 산출물이 달라지는 릴리스 전용."
        type: boolean
        default: false
      pages_only:
        description: "mode=production 전용. Worker 를 건드리지 않고 Pages 만 승격한다. 워커 코드가 이미 라이브인 재발행 전용 — 라이브 Worker 가 이 커밋이 아니면 배포가 거부된다. staging 모드에서는 무시된다."
        type: boolean
        default: false
      target_sha:
        description: "mode=production + pages_only 전용. 비우면 main HEAD(github.sha)를 배포한다. 채우면 그 커밋을 대신 체크아웃한다 — 컷오버 이후 프로덕션이 main 보다 뒤처져 있을 때, 그 뒤처진 커밋을 그대로 다시 빌드해 날짜 등 산출물만 새로 고치는 용도(예: 일일 운세 재발행)."
        type: string
        required: false

# A release is an ordered Worker then Pages transaction. Never cancel a running
# deployment midway; newer merges queue behind it instead.
#
# 🔴 그룹은 **배포 대상별로** 가른다. 하나로 묶으면 안 되는 이유(2026-08-20 실사고):
#
#   GitHub 는 그룹당 **실행 1 + 대기 1** 만 유지하고, 대기 슬롯에 새 런이 들어오면 기존 대기 런을
#   **취소**한다. 한 그룹이면 20분마다 도는 스테이징 워치독(schedule)이 사람이 누른 프로덕션
#   dispatch 를 밀어낸다. 실제로 19:09 의 dispatch(mode=production)가 19:15 의 schedule(스테이징)에
#   밀려 cancelled 로 끝났고, 라이브는 그대로였다.
#
#   🔴 이 방향이 특히 나쁘다. push 가 밀리면 워치독이 20분 뒤 스스로 수렴하지만, 프로덕션
#   dispatch 가 밀리면 **아무도 고치지 않는다** — 워치독은 설계상 프로덕션을 보지 않는다
#   (아래 gate 잡: "여기서 프로덕션을 보면 안 된다"). 잡이 시작조차 안 해서 메일도 코멘트도
#   PR 알림도 없다. 증상은 "Run workflow 를 눌렀는데 라이브가 안 바뀐다" 하나뿐이고,
#   앞 런이 돌고 있을 확률은 **머지 직후에 가장 높다** = 가장 배포하고 싶은 순간에 가장 잘 실패한다.
#
#   직렬화가 필요한 것은 **같은 자원**에 대해서다. 프로덕션(code-destiny-web + 프로덕션 Pages)과
#   스테이징(code-destiny-web-staging + 스테이징 Pages)은 서로 다른 자원이라 동시에 나가도 된다.
#   preview 는 아무것도 배포하지 않으므로 어느 쪽에도 넣지 않는다 — 프로덕션 그룹에 넣으면
#   preview 빌드가 프로덕션 배포를 밀어내고, 스테이징 그룹에 넣으면 머지 배포를 밀어낸다.
#
#   🔴 mode 선택지를 늘리면 여기에 **명시적으로 분류**해야 한다. 분류를 빠뜨리면 새 mode 가 조용히
#   스테이징 그룹으로 떨어지므로, verify-worker-single-deploy-guard.mjs 가 inputs.mode.options 를
#   전수로 읽어 이 식에 없는 선택지를 실패시킨다(손으로 쓴 목록이 아니라 소스에서 발견한다).
#   마지막 fallback 은 inputs.mode 자체가 없는 push·schedule 용이며, 그 둘은 스테이징이다.
concurrency:
  # 🔴 이어지는 줄을 더 들여쓰지 말 것 — 접힘 블록은 더 깊은 들여쓰기를 만나면 개행을 보존한다.
  group: >-
    ${{
    (github.event_name == 'workflow_dispatch' && (inputs.mode == 'production' || inputs.mode == 'rollback')) && 'cloudflare-production-release'
    || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') && 'cloudflare-preview-build'
    || (github.event_name == 'workflow_dispatch' && inputs.mode == 'staging') && 'cloudflare-staging-release'
    || 'cloudflare-staging-release'
    }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  # 릴리스가 정말 필요한지 먼저 싼 값에 판정한다.
  #
  # 20분 주기가 매번 npm ci + build:cf 를 돌면 하루 72회의 낭비가 된다. 이 잡은 curl 2회와
  # git 만 쓰므로, 드리프트가 없으면 30초 안에 릴리스 전체를 건너뛴다.
  #
  # 🔴 판정 실패 시 방향이 이벤트마다 다르다.
  #   push·수동 실행 — 사람이 의도한 배포다. 판정하지 않고 통과시킨다(fail open).
  #                    여기서 막으면 정상 머지가 배포되지 않는, 고치려던 바로 그 문제가 된다.
  #   schedule       — 판정하지 못하면 배포하지 않는다(fail closed). 20분 뒤 다시 온다.
  gate:
    name: Resolve release necessity
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      # 🔴 스테이징 전용 출력. `proceed` 를 재사용하지 않는 이유는 두 가지다 —
      #   (1) verify-worker-single-deploy-guard 가 리터럴 `needs.gate.outputs.proceed == 'true'`
      #       를 매칭하므로 그 이름과 의미를 건드리면 릴리스와 PR CI 가 동시에 멈춘다.
      #   (2) 한 출력이 두 타깃을 뜻하면 표현식 오타 하나가 곧 프로덕션 배포다.
      proceed_staging: ${{ steps.decide.outputs.proceed_staging }}
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decide whether production needs this commit
        id: decide
        env:
          CD_STAGING_ORIGIN: ${{ vars.CD_STAGING_ORIGIN || 'https://staging.code-destiny.com' }}
          DISPATCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
        run: |
          set -uo pipefail
          # 🔴 두 판정을 변수에 모으고 **끝에서 한 번만** 쓴다. 갈래마다 echo 하면 갈래를
          #    하나 더할 때 한쪽 출력을 빠뜨리기 쉽고, 빠뜨린 출력은 빈 문자열이 되어
          #    "그 잡은 그냥 안 돈다"로 조용히 끝난다.
          PROCEED=false
          PROCEED_STAGING=false
          emit() {
            echo "proceed=${PROCEED}" >> "$GITHUB_OUTPUT"
            echo "proceed_staging=${PROCEED_STAGING}" >> "$GITHUB_OUTPUT"
          }
          # 🔴 프로덕션에 도달하는 갈래는 **workflow_dispatch 하나뿐**이다. 두 값이 동시에
          #    true 가 되는 갈래는 없어야 한다 — 있으면 스테이징을 골랐는데 프로덕션이 나간다.
          if [ "${DISPATCH_MODE}" = "staging" ]; then
            PROCEED_STAGING=true
            emit
            echo "::notice::스테이징 배포 요청 — 프로덕션은 건드리지 않습니다."
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PROCEED=true
            emit
            echo "::notice::수동 실행(mode=${DISPATCH_MODE}) — 프로덕션 경로로 갑니다."
            exit 0
          fi
          # 여기부터는 push·schedule 이고, 둘 다 **스테이징**이다.
          # 머지는 더 이상 프로덕션에 나가지 않는다 — 프로덕션은 사람이 dispatch 할 때만 갱신된다.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            PROCEED_STAGING=true
            emit
            echo "::notice::main 머지 — 스테이징에 반영합니다. 프로덕션은 수동 실행 전까지 그대로입니다."
            exit 0
          fi
          # schedule — 스테이징이 main HEAD 와 어긋났는지만 본다.
          # 🔴 여기서 프로덕션을 보면 안 된다. 새 체계에서 프로덕션은 **정상적으로** main 보다
          #    뒤처져 있으므로, 프로덕션 기준으로 판정하면 20분마다 영원히 프로덕션을 자동 배포한다.
          # 얕은 체크아웃이라 origin/main 이 없다. HEAD 가 곧 main tip 이다.
          #
          # 🔴 --soft 를 빼지 말 것. 이 스크립트는 드리프트를 critical 로 보고 exit 1 로 끝낸다.
          # 그러면 아래 `if !` 가 "드리프트 있음"을 "판정 실패"로 읽어 배포를 건너뛴다 —
          # 자가 수렴이 필요한 바로 그 순간에만 꺼지는, 방향이 뒤집힌 게이트가 된다.
          # (2026-08-19 20:47 릴리스 실패 뒤 스케줄 7주기 연속 skip, 프로덕션이 9시간 옛 SHA 에 머물렀다.
          #  컷오버 뒤에는 같은 함정이 스테이징에서 재현된다 — 대상만 바뀌고 원인은 그대로다.)
          # --soft 는 종료 코드만 낮춘다. 판정 결과는 그대로 아래 .drifted 로 읽는다.
          if ! OUT=$(node scripts/verify-merge-landed.mjs --check=drift --json --soft --base=HEAD --origin="${CD_STAGING_ORIGIN}"); then
            emit
            echo "::warning::스테이징 드리프트를 판정하지 못했습니다. 이번 주기는 건너뜁니다."
            exit 0
          fi
          DRIFTED=$(printf '%s' "$OUT" | jq -r '.drifted // "error"')
          if [ "${DRIFTED}" = "true" ]; then
            PROCEED_STAGING=true
            emit
            echo "::warning::스테이징이 main HEAD 와 다릅니다. 자동으로 재배포합니다."
          else
            emit
            echo "스테이징이 main HEAD 와 같습니다. 배포할 것이 없습니다."
          fi

  release:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 🔴 엣지에 캐시된 404 를 스스로 풀기 위한 자격.
      # Pages 전환 틈새에 나간 404 를 Cloudflare 가 max-age=172800(2일)로 캐시하면, 오리진에
      # 파일이 멀쩡해도 그 URL 만 이틀간 죽는다(bare=404 / ?cdcb=200). 그 상태에서는 프로덕션
      # 스모크가 실패해 릴리스가 통째로 롤백되는데, 롤백해도 오염은 풀리지 않아 다음 릴리스도
      # 같은 함정에 빠진다. scripts/verify-deployed-assets.mjs 는 오염된 URL 만 골라 퍼지하는
      # 기능을 이미 갖고 있었지만, 이 값이 잡 env 에 없어 "퍼지 자격 없음" 으로 건너뛰고 있었다
      # (레포 시크릿에 토큰이 있어도 워크플로가 전달하지 않으면 스텝에서는 보이지 않는다).
      # ZONE_ID 는 선택이다 — 토큰에 zone:read 가 있으면 스크립트가 호스트명으로 자동 조회한다.
      CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'code-destiny-web' }}
      # 🔴 target_sha 가 있으면 main HEAD(github.sha) 대신 그 커밋을 배포 대상으로 쓴다. 컷오버
      # 이후 프로덕션이 main 보다 뒤처져 있을 수 있고, pages_only 재발행은 "지금 라이브인 그
      # 커밋"을 그대로 다시 빌드해야 하기 때문이다(전제는 assertWorkerIsAlreadyLiveAt 가 검증).
      # 체크아웃·SHA 검증·빌드 산출물의 commit 표기가 전부 이 하나에서 파생돼야 서로 어긋나지
      # 않는다 — CF_PAGES_COMMIT_SHA 는 write-version-json.mjs 가 GITHUB_SHA 보다 먼저 읽는다.
      CD_DEPLOY_HEAD_SHA: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_sha) || github.sha }}
      CF_PAGES_COMMIT_SHA: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_sha) || github.sha }}
      # 릴리스는 브랜치 팁 전체를 다시 올린다. 변경 집합이 비어도 중단하지 않으며, 이 값이
      # 켜져 있으면 Pages 와 Worker 가 **항상 함께** 나간다(같은 SHA 보장의 근거).
      CD_ALLOW_EMPTY_CHANGESET: "true"
      CD_PRODUCTION_ORIGIN: ${{ vars.CD_PRODUCTION_ORIGIN || 'https://code-destiny.com' }}
      CD_WORKER_PREVIEW_ORIGIN: ${{ vars.CF_WORKER_PREVIEW_ORIGIN }}
      # 🔴 이 잡에는 workflow_dispatch 만 도달한다(gate 가 push·schedule 을 스테이징으로 보낸다).
      # 그래서 모드는 사람이 고른 값 하나뿐이고, 다른 이벤트에서 값이 새어 들어올 자리가 없다.
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
      # 🔴 deploy-safe 는 "HEAD 가 이미 라이브면 아무것도 하지 않는다"로 자기중단한다. 청크 이름만
      # 바뀌는 무의미한 재배포가 전환 틈새 404 를 만들기 때문이고, 그 판단은 **커밋이 같으면
      # 산출물도 같다**는 전제 위에 있다. 운세는 그 전제가 깨지는 유일한 축이다 — 날짜가 빌드
      # 시각에 굳으므로 같은 커밋이 KST 날마다 다른 HTML 을 낳는다.
      #
      # 2026-08-18 15:17Z 의 일일 발행이 정확히 여기서 죽었다. 디스패치도 릴리스도 초록불이었고
      # 배포 스텝만 2초 만에 "이미 라이브"로 빠져나가, KST 08-19 의 운세가 17시간 동안 08-18 로
      # 서빙됐다. 08-17 까지 안 보였던 이유는 머지가 잦아 SHA 가 늘 달랐기 때문이다.
      #
      # 그래서 예외는 **명시적으로 요청한 디스패치에만** 준다. push·schedule 은 여전히 자기중단한다.
      REDEPLOY_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_redeploy) && '--allow-redeploy' || '' }}

      # 🔴 발행을 서비스 릴리스에서 떼어내는 축이다.
      #
      # 일일 운세 재발행은 **같은 커밋**을 다시 빌드하는 릴리스다. 워커 코드는 이미 그 커밋으로
      # 떠 있으므로 재업로드·100% 재승격은 같은 것을 다시 올리는 쓰기일 뿐인데, 그 쓰기 하나 때문에
      # 결제·인증 워커가 매일 교체되고 발행이 실패하면 Pages 와 함께 롤백된다. 운세 발행이 서비스
      # 릴리스에 얹혀 있다는 뜻이고, 여기서 끊는다 — Pages 만 나가고 Worker 는 그대로 둔다.
      #
      # 전제("라이브 Worker == 이 커밋")는 deploy-safe 가 빌드 전에 fail-closed 로 단언한다.
      # 읽지 못하거나 커밋이 다르면 배포가 시작되지 않으므로, 이 플래그로 '새 클라이언트 + 옛 워커'
      # 상태가 만들어지는 경로는 없다.
      PAGES_ONLY_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.pages_only) && '--pages-only' || '' }}

    steps:
      # 🔴 push 이벤트에서 actions/checkout 은 github.sha 를 그대로 꺼낸다. 브랜치 이름이나
      # "최신 커밋"이 아니라 **머지된 그 커밋**이 배포 대상이라는 점이 이 파이프라인의 전제다.
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CD_DEPLOY_HEAD_SHA }}
          fetch-depth: 0

      - name: Record release context
        run: |
          {
            echo "## 🚀 Production Deployment"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Deployment SHA | \`${CD_DEPLOY_HEAD_SHA}\` |"
            echo "| Short SHA | \`${CD_DEPLOY_HEAD_SHA:0:7}\` |"
            echo "| Target SHA override | ${{ inputs.target_sha || '없음 (main HEAD)' }} |"
            echo "| Mode | ${RELEASE_MODE} |"
            echo "| Same-SHA redeploy | ${REDEPLOY_FLAG:-아니오 (이미 라이브면 자기중단)} |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Workflow run | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Triggered by | ${GITHUB_EVENT_NAME} |"
            echo "| Timestamp (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies once
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify release pipeline contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run verify:deploy-safe
          npm run verify:pages-single-deploy-guard
          npm run verify:worker-single-deploy
          npm run verify:worker-config-parity
          npm run verify:staging-noindex

      # Environment key mismatches only surface at runtime, long after the deploy
      # succeeds. This step runs before the build so a missing or drifted key stops
      # the release instead of reaching production.
      - name: Verify environment key parity
        run: npm run verify:env-parity:remote

      - name: Verify Pages Git deployments stay disabled
        run: npm run verify:pages-single-deploy

      - name: Scan for leaked secrets
        run: npm run verify:no-secret-leak

      - name: Verify release checkout content remains clean
        run: |
          git status --short
          # npm ci can leave a platform-specific end-of-line worktree diff.
          # Do not restore tracked files: real staged, untracked, mode, or
          # content changes must remain release-blocking.
          git diff --cached --check
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check
          if ! git diff --quiet; then
            # GitHub's checkout can normalize line endings after npm ci. Restore
            # only after every staged, untracked, and meaningful-diff guard passed.
            git diff --ignore-space-at-eol --exit-code
            git diff --name-only -z | xargs -0r git restore --worktree --
          fi
          test -z "$(git status --porcelain)"

      # 두 검사는 커밋된 트리를 그대로 읽는다. sync:public 을 먼저 돌리지 않는 것은
      # 의도적이다 — 정적 미러가 어긋난 상태를 "Verify locale main sync" 가 잡아야 한다.
      #
      # i18n 커버리지 지표는 여기 넣지 않는다. continue-on-error 래칫이라 한 번
      # 프로덕션 배포를 얼린 전력이 있다(2026-07-28).
      - name: Verify sitemap and locale mirrors
        run: |
          npm run verify:sitemap
          npm run verify:locale-main-sync

      - name: Preview and smoke the exact SHA
        if: env.RELEASE_MODE == 'preview'
        run: npm run deploy:safe -- --ci --preview-only

      # Worker → Pages 순서로 승격하고, 실패하면 그 역순(Pages → Worker)으로 자동 롤백한다.
      # 순서의 근거는 scripts/deploy-safe.mjs promote() 주석 참고 — 중간 상태에서
      # '옛 클라이언트 + 새 워커' 가 '새 클라이언트 + 옛 워커' 보다 안전하다.
      # 🔴 이벤트까지 못 박는다. `env.RELEASE_MODE == 'production'` 만으로는 부족하다 —
      # 표현식 오타 하나가 push 를 프로덕션으로 흘려보내는 경로가 되고, 그 실패는 조용하다.
      # 프로덕션은 사람이 Run workflow 를 눌렀을 때만 나간다.
      - name: Deploy Pages and Worker at the exact SHA
        if: env.RELEASE_MODE == 'production' && github.event_name == 'workflow_dispatch'
        run: npm run deploy:safe -- --ci --yes ${REDEPLOY_FLAG} ${PAGES_ONLY_FLAG}

      - name: Read deployment state
        id: state
        if: always() && env.RELEASE_MODE == 'production'
        continue-on-error: true
        run: node scripts/print-deploy-state.mjs

      # 🔴 배포 성공 여부와 "떠 있는 코드가 이번 커밋인가"는 다른 질문이다. Pages 와 Worker
      # 양쪽 런타임에서 SHA 를 직접 읽어 대조한다. 하나라도 다르면 릴리스는 실패다.
      #
      # 🔴 !cancelled() 인 이유: 승격이 실패하면 deploy-safe 가 Pages 와 Worker 를 자동
      # 롤백하는데, 이 스텝이 건너뛰어지면 **롤백 뒤 실제로 떠 있는 SHA 가 어디에도 기록되지
      # 않는다.** 그러면 다음 사람은 프로덕션이 어느 커밋인지 알 방법이 없다.
      # continue-on-error 를 붙이지 않는 것도 의도다 — 붙이면 "배포는 됐는데 다른 코드가 떠
      # 있다"를 통과시키게 된다. 실패 경로에서는 잡이 이미 빨간불이라 결과가 달라지지 않는다.
      - name: Verify deployed SHA on Pages and Worker
        if: ${{ !cancelled() && env.RELEASE_MODE == 'production' }}
        run: |
          # 🔴 --pages-only 릴리스에서는 워커 검사를 **건너뛰지 않는다**. 워커를 승격하지 않았을
          # 뿐, 떠 있어야 하는 커밋은 여전히 이 SHA 이고 그것이 바로 이 플래그의 전제다.
          # 여기서 함께 재면 배포 전 단언과 배포 후 실측이 같은 명제를 양쪽에서 잠근다.
          SKIP_WORKER=""
          if [ "${{ steps.state.outputs.worker_promoted }}" = "false" ] && [ -z "${PAGES_ONLY_FLAG}" ]; then
            SKIP_WORKER="--skip-worker"
          fi
          npm run verify:deployed-sha -- \
            --sha="${CD_DEPLOY_HEAD_SHA}" \
            --origin="${CD_PRODUCTION_ORIGIN}" \
            ${SKIP_WORKER}

      # 배포된 SHA 가 확인된 **뒤**에만 알린다 — 아직 안 뜬 URL 을 크롤하라고 부르면 404 를 학습시킨다.
      # 제출 대상은 sitemap.xml 에서 lastmod 가 오늘인 URL 뿐이다(델타). 변경이 없으면 그냥 건너뛴다.
      #
      # 🔴 continue-on-error 를 반드시 붙인다. IndexNow 는 외부 서비스이고 색인 신호는 부가 기능인데,
      # 이 스텝이 빨간불이 되면 deploy-safe 를 통해 **멀쩡한 배포가 롤백된다.** 붙이지 않으면
      # Bing 쪽 장애가 우리 릴리스를 되돌린다. verify:indexnow-wiring 이 이 플래그를 강제한다.
      #
      # 배선 가드를 제출 직전에 함께 돌린다 — 새 CI 게이트를 만들지 않으면서(CLAUDE.md CI gate scope)
      # 가드가 실제로 보호하는 순간에 돌게 하는 자리다. 키가 어긋났거나 제출 소스가 사이트맵이
      # 아니면 여기서 멈춰 잘못 제출하지 않는다.
      - name: Notify IndexNow of changed URLs
        if: ${{ success() && env.RELEASE_MODE == 'production' }}
        continue-on-error: true
        run: |
          npm run verify:indexnow-wiring
          npm run seo:indexnow

      - name: Summarize the result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PAGES_DEPLOYMENT_ID: ${{ steps.state.outputs.pages_deployment_id }}
          WORKER_VERSION_ID: ${{ steps.state.outputs.worker_version_id }}
          WORKER_PROMOTED: ${{ steps.state.outputs.worker_promoted }}
        run: |
          {
            echo "### 결과"
            echo ""
            echo "| 단계 | 상태 |"
            echo "|---|---|"
            if [ "${RELEASE_MODE}" = "preview" ]; then
              echo "| Preview build + smoke | ${JOB_STATUS} |"
              echo "| Production | 승격하지 않음 (preview 모드) |"
            else
              echo "| Pages deployment | ${PAGES_DEPLOYMENT_ID:-기록 없음} |"
              echo "| Worker deployment | ${WORKER_VERSION_ID:-기록 없음} (promoted=${WORKER_PROMOTED:-unknown}) |"
              echo "| Smoke test | 배포 스텝에 포함 |"
              echo "| SHA verification | 아래 단계 결과 참조 |"
              echo "| Overall | **${JOB_STATUS}** |"
            fi
            echo ""
            if [ "${JOB_STATUS}" != "success" ]; then
              echo "> ❌ 실패한 단계는 위 로그에서 확인하세요. 프로덕션 승격 중 실패했다면 deploy-safe 가 Pages 와 Worker 를 함께 자동 롤백합니다."
              echo ">"
              echo "> 수동 롤백: Actions → Release Cloudflare Pages and Worker → Run workflow → mode: rollback"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 머지된 PR 하나만 봐도 프로덕션 반영 상태를 알 수 있어야 한다.
      #
      # 🔴 조건이 `github.event_name == 'push'` 였다. 컷오버로 push 는 스테이징으로 가므로
      # 그대로 두면 이 스텝은 영원히 돌지 않는다 — 프로덕션 승격 기록이 통째로 사라지는데
      # 증상은 "코멘트가 안 달린다" 뿐이라 한참 모른다. 승격 자체를 조건으로 바꾼다.
      # (머지가 스테이징에 도달했는지는 landing-watchdog 이 스테이징 기준으로 본다.)
      #
      # 🔴 target_sha 릴리스는 제외한다. context.sha 는 여전히 디스패치 ref(main)의 팁이라,
      # 실제로 배포된 커밋(target_sha, main 보다 뒤처진 옛 커밋)과 다르다. 그대로 두면 이번
      # 배포와 무관한 최신 PR에 "Production Deployment ✅" 코멘트가 잘못 달린다.
      - name: Report deployment status on the merged PR
        if: always() && env.RELEASE_MODE == 'production' && !inputs.target_sha
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          PAGES_DEPLOYMENT_ID: ${{ steps.state.outputs.pages_deployment_id }}
          WORKER_VERSION_ID: ${{ steps.state.outputs.worker_version_id }}
        with:
          script: |
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = pulls[0];
            if (!pr) {
              core.info('이 커밋과 연결된 PR 이 없습니다. 코멘트를 건너뜁니다.');
              return;
            }
            const ok = process.env.JOB_STATUS === 'success';
            const mark = ok ? '✅' : '❌';
            const body = [
              '<!-- cd-production-deployment -->',
              `### ${mark} Production Deployment`,
              '',
              '| 항목 | 값 |',
              '|---|---|',
              `| SHA | \`${context.sha}\` |`,
              `| Pages | ${process.env.PAGES_DEPLOYMENT_ID || (ok ? '배포됨' : '실패 또는 미배포')} |`,
              `| Worker | ${process.env.WORKER_VERSION_ID || (ok ? '배포됨' : '실패 또는 미배포')} |`,
              `| Smoke test | ${mark} |`,
              `| SHA verification | ${mark} |`,
              `| Run | ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId} |`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

  # 스테이징 배포. 프로덕션과 **같은 파일·같은 흐름**에 두는 이유는 하나다 — 별도 워크플로로
  # 빼면 스테이징이 프로덕션의 리허설이기를 그만두고, "배포 경로는 하나"라는 명제가 규약에서
  # 관습으로 강등된다(verify-worker-single-deploy-guard 가 지키는 것이 그 명제다).
  #
  # 🔴 이 잡에는 CD_PRODUCTION_ORIGIN 을 두지 않는다. deploy-safe 의 targetOrigin 이 그 값을
  #    먼저 읽으므로, 새어 들어오면 스테이징 배포가 프로덕션을 스모크하고 초록불이 된다.
  staging:
    name: Deploy staging
    needs: gate
    if: needs.gate.outputs.proceed_staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 🔴 release 잡과 같은 이유로 스테이징에도 필요하다. staging.code-destiny.com 은 첫 배포
      # 전까지 모든 경로에 404 를 냈고 Cloudflare 가 그것을 max-age=172800 으로 캐시했다.
      # 그래서 첫 배포가 성공해도 오리진은 200 인데 엣지만 404 인 상태가 남고(bare=404 /
      # ?cdcb=200), 배포 후 스모크가 실패해 릴리스가 통째로 롤백된다 — 롤백해도 캐시 오염은
      # 풀리지 않아 다음 실행도 같은 자리에서 죽는다(2026-08-20 run 32353028401 실측: 5개 URL).
      # verify-deployed-assets.mjs 는 오염된 URL 만 골라 퍼지하는 기능을 이미 갖고 있고, 이
      # 자격이 잡 env 에 없으면 조용히 "퍼지 자격 없음" 으로 건너뛴다.
      # 존은 프로덕션과 같은 code-destiny.com 이므로 같은 시크릿을 그대로 쓴다.
      CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_STAGING_PAGES_PROJECT_NAME }}
      CF_STAGING_PAGES_PROJECT_NAME: ${{ vars.CF_STAGING_PAGES_PROJECT_NAME }}
      CF_STAGING_WORKER_NAME: ${{ vars.CF_STAGING_WORKER_NAME || 'code-destiny-web-staging' }}
      CD_STAGING_ORIGIN: ${{ vars.CD_STAGING_ORIGIN || 'https://staging.code-destiny.com' }}
      CD_DEPLOY_HEAD_SHA: ${{ github.sha }}
      CD_ALLOW_EMPTY_CHANGESET: "true"
      # 프론트가 자기 오리진의 /api 를 치게 한다. 안 세우면 next.config.mjs 가 NODE_ENV=production
      # 이라는 이유로 https://code-destiny.com 을 빌드에 인라인해, 스테이징 화면이 프로덕션 API 를
      # 호출하고 CSP(connect-src 'self')에도 걸린다.
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.CD_STAGING_ORIGIN || 'https://staging.code-destiny.com' }}
      # 🔴 NEXT_PUBLIC_SITE_URL 을 스테이징으로 세우지 말 것. 이 값은 SEO 메타 전용이고
      #    (lib/seo.v2.ts SEO_V2_SITE.siteUrl -> canonical·sitemap·robots host), 세우는 순간
      #    Next 가 만든 robots.txt 의 Sitemap 이 스테이징 주소가 되어 postbuild 의
      #    verify-adsense-readiness(프로덕션 오리진 고정)가 빌드를 세운다 — 2026-08-20 실측.
      #    게다가 승격되는 정적 셸(index.html)은 프로덕션 URL 을 그대로 들고 있어 산출물이
      #    반쪽만 스테이징이 된다. 스테이징 격리는 SEO 오리진이 아니라 apply-staging-noindex
      #    (전면 Disallow + noindex 메타 + X-Robots-Tag)가 담당한다.

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Fail fast when the staging project is unconfigured
        run: |
          set -euo pipefail
          test -n "${CF_STAGING_PAGES_PROJECT_NAME:-}" || {
            echo "::error::CF_STAGING_PAGES_PROJECT_NAME 레포 변수가 없습니다. Cloudflare 에 스테이징 Pages 프로젝트를 만든 뒤 변수를 등록하세요.";
            exit 1;
          }

      - name: Verify release pipeline contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run verify:deploy-safe
          npm run verify:pages-single-deploy-guard
          npm run verify:worker-single-deploy
          npm run verify:worker-config-parity
          npm run verify:staging-noindex

      - name: Verify environment key parity
        run: npm run verify:env-parity -- --remote --target=staging

      - name: Verify Pages Git deployments stay disabled
        run: npm run verify:pages-single-deploy

      - name: Scan for leaked secrets
        run: npm run verify:no-secret-leak

      - name: Deploy staging Pages and Worker at the exact SHA
        run: npm run deploy:staging -- --ci --yes

      - name: Verify deployed SHA on staging
        if: ${{ !cancelled() }}
        run: |
          npm run verify:deployed-sha -- \
            --sha="${GITHUB_SHA}" \
            --origin="${CD_STAGING_ORIGIN}"

      # 🔴 정적 가드는 배선을 지키고, 실제로 색인을 막는 것은 이 프로브다. 빌드 파이프라인의
      # 어떤 단계가 산출물을 다시 써서 메타가 사라져도 여기서 잡힌다. 실패하면 배포를 실패로
      # 남겨 다음 릴리스 전에 반드시 보게 한다.
      - name: Probe staging is not indexable
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ROBOTS=$(curl -fsS "${CD_STAGING_ORIGIN}/robots.txt")
          printf '%s\n' "$ROBOTS" | grep -qx 'Disallow: /' || {
            echo "::error::${CD_STAGING_ORIGIN}/robots.txt 에 전면 Disallow 가 없습니다. 스테이징이 색인될 수 있습니다.";
            printf '%s\n' "$ROBOTS";
            exit 1;
          }
          HEADERS=$(curl -fsSI "${CD_STAGING_ORIGIN}/")
          printf '%s\n' "$HEADERS" | grep -qi 'x-robots-tag:.*noindex' || {
            echo "::error::${CD_STAGING_ORIGIN} 응답에 X-Robots-Tag: noindex 가 없습니다.";
            printf '%s\n' "$HEADERS";
            exit 1;
          }
          echo "스테이징 색인 차단 확인: robots.txt 전면 Disallow + X-Robots-Tag noindex."

      - name: Summarize the staging result
        if: always()
        run: |
          {
            echo "### 스테이징 배포"
            echo ""
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- 오리진: ${CD_STAGING_ORIGIN}"
            echo "- 프로덕션은 이 실행에서 건드리지 않았습니다."
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'code-destiny-web' }}
      CD_PRODUCTION_ORIGIN: ${{ vars.CD_PRODUCTION_ORIGIN || 'https://code-destiny.com' }}
      CD_ALLOW_EMPTY_CHANGESET: "true"
      CD_DEPLOY_HEAD_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Require at least one rollback target
        run: |
          if [ -z "${{ inputs.pages_deployment_id }}" ] && [ -z "${{ inputs.worker_version_id }}" ]; then
            echo "::error::롤백하려면 pages_deployment_id 또는 worker_version_id 중 하나는 지정해야 합니다."
            echo "::error::대상 목록은 로컬에서 npm run deploy:rollback -- --list 로 확인할 수 있습니다(읽기 전용)."
            exit 1
          fi

      # 롤백도 끝난 뒤 프로덕션 스모크를 돌린다. 되돌린 상태를 확인하지 않으면 롤백이 두 번째 장애가 된다.
      #
      # --allow-dirty 는 여기서만 안전하다. 롤백은 워킹트리를 올리지 않고 Cloudflare 에 이미
      # 있는 배포본·버전을 가리키기만 하므로, npm ci 가 남긴 줄바꿈 차이 때문에 장애 대응이
      # 막히는 쪽이 훨씬 위험하다.
      - name: Roll back production
        run: |
          npm run deploy:rollback -- --ci --yes --allow-dirty \
            ${{ inputs.pages_deployment_id && format('--to={0}', inputs.pages_deployment_id) || '' }} \
            ${{ inputs.worker_version_id && format('--worker-version={0}', inputs.worker_version_id) || '' }}

      - name: Summarize the rollback
        if: always()
        run: |
          {
            echo "## ⏪ Production Rollback"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Pages deployment | ${{ inputs.pages_deployment_id || '변경 없음' }} |"
            echo "| Worker version | ${{ inputs.worker_version_id || '변경 없음' }} |"
            echo "| Status | ${{ job.status }} |"
            echo "| Run | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >> "$GITHUB_STEP_SUMMARY"
