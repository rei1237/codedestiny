name: Release Cloudflare Pages and Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

# A release is an ordered Worker then Pages transaction. Never cancel a running
# deployment midway; newer main commits queue behind it instead.
concurrency:
  group: cloudflare-production-release
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'code-destiny-web' }}
      CD_DEPLOY_BASE_SHA: ${{ github.event.before }}
      CD_DEPLOY_HEAD_SHA: ${{ github.sha }}
      CD_PRODUCTION_ORIGIN: ${{ vars.CD_PRODUCTION_ORIGIN || 'https://code-destiny.com' }}
      CD_WORKER_PREVIEW_ORIGIN: ${{ vars.CF_WORKER_PREVIEW_ORIGIN }}

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CI main deployment policy
        run: node scripts/verify-worktree-policy.mjs --mode=deploy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies once
        run: npm ci

      - name: Verify release pipeline contract
        run: |
          npm run verify:deploy-safe
          npm run verify:pages-single-deploy-guard
          npm run verify:worker-single-deploy

      - name: Verify Pages Git deployments stay disabled
        run: npm run verify:pages-single-deploy

      - name: Wait for required security and CI gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_GATE_CHECKS: gitleaks,Verify Cloudflare Pages automatic deployments are disabled
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/wait-for-ci-gates.mjs

      - name: Preview, smoke, and promote the exact SHA
        run: npm run deploy:safe -- --ci --yes
