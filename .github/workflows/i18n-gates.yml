name: i18n Gates

# 현지화 회귀 방지 게이트.
#
# 릴리스 워크플로에는 일부러 넣지 않았다. 번역 커버리지 같은 점진적 지표로 배포를 막으면
# 무관한 변경까지 함께 멈춘다(2026-07-28 에 실제로 프로덕션이 얼었다). PR 을 폐기한 뒤에는
# push 시점의 사후 회귀망으로 돈다 — 배포를 막지 않고 후퇴만 알린다.
#
# 세 게이트는 모두 ratchet(후퇴 금지) 방식이다. 절대치 0은 아직 불가능하지만
# (현지화 대상 약 206만 자) 되돌아가는 것은 막는다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 정적 셸 미러가 어긋나면 아래 검사들이 엉뚱한 파일을 보게 된다
      - name: Sync public static artifacts
        run: npm run sync:public

      # 사전 정합성 + ko 커버리지 + fallback ratchet + 런타임 준비
      # 하드코딩 한국어 ratchet(verify:i18n-no-hardcoded-korean)은 2026-07-29 체인에서 제외했다.
      # 사유는 scripts/verify-i18n-no-hardcoded-korean.mjs 헤더 참고.
      #
      # 🔴 continue-on-error: 현지화는 콘텐츠가 쌓이는 속도를 따라가는 점진 지표라, 새 한국어가
      # 늘 때마다 PR 이 빨간불이 되고 배포까지 함께 멈춘다(2026-07-28 프로덕션 배포 정지 사고).
      # 결과는 로그로 계속 보고하되 머지·배포를 막지는 않는다. 되돌리려면 이 줄만 지우면 된다.
      #
      # 래칫 3종(no-fallback / ko-coverage / no-hardcoded-korean)은 스크립트 자체도 기본
      # 경고 전용이다. 번역을 서비스 완성 단계에 한 번에 할 계획이라 기준선 증가로 빨간불이
      # 뜨지 않게 두었다. 다시 조일 때는 아래 env 한 줄만 켜면 세 개가 함께 하드 게이트가 된다.
      #   env:
      #     I18N_RATCHET: "on"
      - name: i18n check
        run: npm run i18n:check
        continue-on-error: true

      # 이건 번역 지표가 아니라 셸 미러 구조 정합성이라 blocking 을 유지한다.
      # 배포 워크플로에도 같은 검사가 있다(Release Cloudflare Pages and Worker 의
      # "Verify sitemap and locale mirrors"). 저위험 변경이 PR 없이 main 으로 나갈 수
      # 있게 된 뒤로, PR 에만 두면 그 경로에서 통째로 빠지기 때문이다.
      - name: Verify locale main sync
        run: npm run verify:locale-main-sync
