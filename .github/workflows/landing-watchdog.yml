name: Landing Watchdog

# main 에 올린 작업이 스테이징에 도달하지 못하는 두 가지 **조용한** 실패를 하나의 신호로 만든다.
#
#   ① 릴리스 런 취소 — concurrency 그룹당 실행 1 + 대기 1 만 유지되므로 연속 push 시
#      대기 런이 취소된다. 취소된 런은 잡이 시작조차 안 하고, GitHub 은 실패와 달리
#      취소에는 메일을 보내지 않는다.
#   ② 스테이징 드리프트 — 라이브 SHA 와 main HEAD 를 비교하는 장치가 없었다.
#
# 둘 다 "실패했는데 아무도 모른다"가 본질이라, 감지 자체보다 **한 곳만 보면 알 수 있게**
# 만드는 것이 이 워크플로의 목적이다. 결과는 이슈 하나에 모이고 제자리에서 갱신된다.
#
# 🔴 2026-09-12: "스택 PR 좌초" 축을 제거했다. 이 레포는 PR 을 쓰지 않고 main 에 직접
# 커밋하므로 고아 머지 커밋이 생길 경로 자체가 없다. 그에 딸린 PR 자동 최신화(update-branch)
# 와 좌초 PR 코멘트도 함께 사라졌다 — 그래서 이 워크플로는 더 이상 PR 을 읽거나 쓰지 않는다.
#
# pages-config-guard.yml 과 같은 형태의 예약 가드다. npm ci 를 돌리지 않는다 —
# 이 스크립트는 Node 내장 모듈 + git + gh 만 쓴다.
on:
  schedule:
    # 정시는 GitHub 크론이 가장 붐빈다. 기존 가드의 "17" 과 같은 이유로 어긋나게 둔다.
    - cron: "27 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 면 이슈·코멘트를 쓰지 않고 본문만 출력한다"
        type: boolean
        default: false

# 🔴 릴리스 그룹(cloudflare-production-release)과 절대 공유하지 않는다. 공유하면 워치독이
# 릴리스를 대기시키거나 취소해 감시 대상을 스스로 망가뜨린다.
#
# 여기서는 cancel-in-progress 가 안전하다 — 워치독은 매번 상태를 처음부터 다시 계산하므로
# 최신 런이 항상 옛 런을 대체한다. 릴리스에서 같은 설정이 위험한 것과 대비된다.
concurrency:
  group: landing-watchdog
  cancel-in-progress: true

permissions:
  contents: read # 체크아웃만 한다. 이 워치독은 더 이상 브랜치를 밀지 않는다.
  issues: write # 워치독 이슈 생성·갱신·종료
  actions: read # 릴리스 런 결론 조회

jobs:
  scope:
    name: Resolve staging watch scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    env:
      CD_STAGING_ORIGIN: ${{ vars.CD_STAGING_ORIGIN || 'https://staging.code-destiny.com' }}
    steps:
      # 파일명만 비교하므로 블롭은 받지 않는다. schedule/manual 은 현재 스테이징 SHA 이후의
      # 변경을 보고, push 는 방금 main 에 들어온 변경만 본다.
      - name: Check out history without blobs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether staging delivery needs monitoring
        id: scope
        env:
          STAGING_WATCH_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          STAGING_WATCH_HEAD: ${{ github.event_name == 'push' && github.sha || 'HEAD' }}
        run: |
          node scripts/lib/change-risk.mjs --self-test
          node scripts/dev/resolve-staging-watch.mjs --origin="${CD_STAGING_ORIGIN}"

  watch:
    name: Check that landed work reached staging
    needs: scope
    # 판정 실패는 감시 실행으로 닫는다. 명시적인 false 만 Quick Pass 로 건너뛴다.
    if: needs.scope.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      # 🔴 2026-08-20 컷오버 이후 감시 대상은 **스테이징**이다.
      # 프로덕션은 사람이 묶어서 내보내므로 main 보다 뒤처져 있는 것이 정상 상태다. 그대로
      # 프로덕션을 보게 두면 이 워치독이 영구 critical 이슈를 열어 진짜 신호를 덮는다.
      # "올린 작업이 도달하지 못하는 조용한 실패" 라는 명제는 이제 스테이징에 적용된다.
      CD_STAGING_ORIGIN: ${{ vars.CD_STAGING_ORIGIN || 'https://staging.code-destiny.com' }}

    steps:
      # main HEAD 의 SHA 와 커밋 시각만 있으면 된다. 블롭은 받지 않는다.
      - name: Check out history without blobs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 판정 로직을 네트워크 없이 먼저 검증한다. 가드가 스스로를 못 지키면 가드가 아니다.
      - name: Self-test the watchdog logic
        run: node scripts/verify-merge-landed.mjs --self-test

      # 🔴 --report 는 남긴다. 이슈 갱신이 이 워치독의 유일한 출력이고, 그걸 끄면 워치독 자신이
      # "실패했는데 아무도 모른다" 의 또 다른 사례가 된다. 이슈 쓰기는 PR 축이 아니다.
      - name: Check that landed work reached staging
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(--origin="${CD_STAGING_ORIGIN}")
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--report)
          fi
          node scripts/verify-merge-landed.mjs "${ARGS[@]}"
