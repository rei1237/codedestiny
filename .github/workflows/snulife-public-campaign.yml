name: Configure SNULIFE public campaign
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-release
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_MODE: production
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SNULIFE_BENEFIT_CODE: ${{ secrets.SNULIFE_BENEFIT_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure approved campaign
        run: node scripts/configure-snulife-public.mjs
