# 매주 토요일 21:05 KST, 영냥이 시즌 1의 새 회차가 실린 사이트를 다시 배포한다.
#
# 공개 게이트는 빌드 안에 있다 — prebuild:cf 의 scripts/publish-yeongnyangi-serial.mjs 가 빌드 시각에
# 공개된 회차(status ready + 컷·대체 텍스트·이미지 완비 + publishAt 경과)의 이미지만 public/ 으로 복사하고,
# app/yeongnyangi/season-1/[episode] 는 그 회차만 정적 경로로 만든다. 같은 커밋이라도 빌드 시각이
# 달라지면 산출물이 달라지므로, 이 워크플로는 fortune-daily-publish.yml 과 같은 방식으로
# **지금 라이브인 커밋**(/version.json)을 Pages 만 다시 빌드·배포한다(Worker·결제·인증은 건드리지 않는다).
#
# 미완성 회차는 일정이 지나도 공개되지 않는다(게이트가 보류). 이 워크플로는 보류 회차를 기다리지 않고
# "지금 공개돼야 할 회차"가 실제 URL 에서 200 으로 열리는지만 확인한다.
# 재실행 멱등 — 기대 회차가 이미 운영에서 열리면 재배포 없이 성공으로 끝난다.
# 과금 없음 — LLM·외부 API 호출이 없다.

name: Yeongnyangi weekly publish (Saturday 21:00 KST)

on:
  schedule:
    # 12:05 UTC 토요일 = 21:05 KST 토요일. 예약 실행 지연을 감안해 정각보다 5분 뒤에 뜬다.
    - cron: "5 12 * * 6"
  workflow_dispatch:

concurrency:
  group: yeongnyangi-weekly-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  publish:
    name: Publish and verify the latest episode
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 기대 회차는 main 이 아니라 **라이브 커밋**의 연재 데이터로 계산한다. 재배포되는 것이 그 커밋이기 때문이다.
      - name: Resolve the live commit and the episode that should be open now
        id: expect
        env:
          CD_PRODUCTION_ORIGIN: ${{ vars.CD_PRODUCTION_ORIGIN || 'https://code-destiny.com' }}
        run: |
          set -euo pipefail
          LIVE_SHA="$(curl -fsS "${CD_PRODUCTION_ORIGIN}/version.json" | jq -r '.commit // empty')"
          if [ -z "${LIVE_SHA}" ]; then echo "::error::라이브 커밋을 읽지 못했습니다."; exit 1; fi
          git checkout --quiet "${LIVE_SHA}"
          if [ ! -f lib/yeongnyangi/serial.mjs ]; then
            echo "::notice::라이브 커밋(${LIVE_SHA})에 연재 게이트가 없습니다. 발행할 회차가 없습니다."
            echo "live_sha=${LIVE_SHA}" >> "$GITHUB_OUTPUT"
            echo "href=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HREF="$(node --input-type=module -e "import { latestEpisode } from './lib/yeongnyangi/serial.mjs'; console.log(latestEpisode()?.href || '')")"
          node scripts/publish-yeongnyangi-serial.mjs --check
          echo "live_sha=${LIVE_SHA}" >> "$GITHUB_OUTPUT"
          echo "href=${HREF}" >> "$GITHUB_OUTPUT"
          echo "::notice::라이브 ${LIVE_SHA} 기준 지금 열려 있어야 할 최신 회차: ${HREF:-없음}"

      - name: Publish and verify (up to 2 attempts)
        id: publish
        if: steps.expect.outputs.href != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CD_PRODUCTION_ORIGIN: ${{ vars.CD_PRODUCTION_ORIGIN || 'https://code-destiny.com' }}
          LIVE_SHA: ${{ steps.expect.outputs.live_sha }}
          HREF: ${{ steps.expect.outputs.href }}
        run: |
          set -uo pipefail
          URL="${CD_PRODUCTION_ORIGIN}${HREF}"
          is_open() { [ "$(curl -s -o /dev/null -w '%{http_code}' "${URL}")" = "200" ]; }
          if is_open; then
            echo "::notice::${URL} 는 이미 열려 있습니다. 재배포하지 않습니다."
            echo "last_stage=already-live" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_STAGE="dispatch"; RUN_URL=""
          for ATTEMPT in 1 2; do
            DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            LAST_STAGE="dispatch"
            if ! gh workflow run cloudflare-pages-deploy.yml -R "${{ github.repository }}" --ref main -f mode=production -f allow_redeploy=true -f pages_only=true -f target_sha="${LIVE_SHA}"; then
              sleep 60; continue
            fi
            LAST_STAGE="resolve-run"; RELEASE_RUN_ID=""
            for _ in $(seq 1 24); do
              sleep 5
              RELEASE_RUN_ID="$(gh run list -R "${{ github.repository }}" --workflow=cloudflare-pages-deploy.yml --event=workflow_dispatch --limit=20 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"${DISPATCHED_AT}\")] | sort_by(.createdAt) | .[0].databaseId // empty")"
              [ -n "${RELEASE_RUN_ID}" ] && break
            done
            [ -z "${RELEASE_RUN_ID}" ] && { sleep 60; continue; }
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}"
            echo "릴리스 런: ${RUN_URL}"
            LAST_STAGE="release"
            if ! timeout 25m gh run watch "${RELEASE_RUN_ID}" --exit-status --interval 20; then sleep 60; continue; fi
            LAST_STAGE="verify"
            for _ in $(seq 1 10); do
              if is_open; then
                echo "::notice::${URL} 가 열렸습니다."
                { echo "last_stage=ok"; echo "run_url=${RUN_URL}"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 45
            done
          done
          { echo "last_stage=${LAST_STAGE}"; echo "run_url=${RUN_URL}"; } >> "$GITHUB_OUTPUT"
          echo "::error::${URL} 발행이 2회 시도 후에도 확인되지 않았습니다(마지막 단계: ${LAST_STAGE})."
          exit 1

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_STAGE: ${{ steps.publish.outputs.last_stage || 'expect' }}
          LIVE_SHA: ${{ steps.expect.outputs.live_sha }}
          HREF: ${{ steps.expect.outputs.href }}
          RELEASE_RUN_URL: ${{ steps.publish.outputs.run_url }}
        run: |
          set -uo pipefail
          MARKER='<!-- cd-yeongnyangi-weekly-publish -->'
          BODY_FILE="${RUNNER_TEMP}/yeongnyangi-weekly-failure.md"
          cat > "${BODY_FILE}" <<EOF
          ${MARKER}
          **영냥이 주간 회차 발행이 실패했습니다.** 운영에는 지난 회차까지만 열려 있습니다.

          | 항목 | 값 |
          |---|---|
          | 기대 회차 | \`${HREF:-계산 실패}\` |
          | 마지막으로 실패한 단계 | \`${LAST_STAGE}\` |
          | 재배포 대상 커밋(그때 라이브) | \`${LIVE_SHA:-읽지 못함}\` |
          | 이 발행 잡 | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |
          | 마지막 릴리스 런 | ${RELEASE_RUN_URL:-없음} |
          EOF
          NUM="$(gh issue list --state open --limit 50 --json number,body --jq "[.[] | select(.body | contains(\"${MARKER}\"))] | .[0].number // empty" || true)"
          if [ -n "${NUM}" ]; then gh issue comment "${NUM}" --body-file "${BODY_FILE}"
          else gh issue create --title "🐾 영냥이 주간 회차 발행 실패" --body-file "${BODY_FILE}"; fi
