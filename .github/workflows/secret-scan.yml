name: Secret Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# gitleaks 는 현재 main HEAD 에서 도달 가능한 전체 git 히스토리를 본다. fetch-depth: 0 checkout에는
# main과 무관한 원격 워크트리 ref도 들어올 수 있으므로 bare `gitleaks git`은 쓰지 않는다. 뒤에 온
# 런은 취소된 런이 볼 main 이력을 항상 포함하므로 겹친 런을 취소해도 스캔 구멍이 생기지 않는다.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # 지금까지 상한이 없었다. 중앙값 129s 이므로 15분은 정상 실행을 자르지 않으면서
    # 멈춘 런이 러너를 6시간 붙들고 있는 것만 막는다.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="8.24.2"
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          gh release download "v${VERSION}" \
            --repo gitleaks/gitleaks \
            --pattern "${ASSET}" \
            --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (git history)
        run: |
          set -euo pipefail
          gitleaks git --log-opts=HEAD --redact --verbose
