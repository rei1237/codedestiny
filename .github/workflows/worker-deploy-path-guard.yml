name: Worker Deploy Path Guard

# PR 이 없어졌으므로 push 시점의 사후 회귀망으로 돈다. 릴리스 자체를 막지는 않지만
# Cloudflare 대시보드에서 Worker Git 연동이 켜지면(= 외부 Workers Builds 체크가 생기면)
# 여기서 드러난다.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/deploy-worker.mjs"
      - "scripts/verify-worker-single-deploy-guard.mjs"
      - "package.json"
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  guard:
    name: No external Worker deployment path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify single Worker deployment path
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify:worker-single-deploy
