name: Canonical Host Check

# www → apex 301 이 살아있는지 하루 1회 실측한다.
#
# 2026-07-30, www.code-destiny.com 이 전 경로 522 였다(방문자에겐 사이트 전체 장애로 보임).
# 원인은 코드가 아니라 Cloudflare 설정이었다 — www 가 Pages 커스텀 도메인에도, Worker route 에도
# 없어서 그 호스트를 받아줄 서비스가 없었다. 수정도 대시보드의 Redirect Rule 이라 리포지토리에
# 커밋되지 않는다 ⇒ 누가 룰을 지우면 조용히 522 로 되돌아간다. 이 워크플로가 그걸 잡는다.
#
# 🔴 배포 워크플로(cloudflare-pages-deploy.yml)의 게이트로 옮기지 말 것. 빌드 산출물이 아니라
#    인프라 설정을 보는 라이브 네트워크 검사라, 일시적 네트워크 오류가 무관한 배포를 막는다.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

jobs:
  canonical-host:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 이 스크립트는 내장 fetch 만 쓴다 — npm ci 불필요.
      - name: Verify www → apex canonical redirect
        run: npm run verify:www-canonical
