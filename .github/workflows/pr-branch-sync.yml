name: Auto-update behind PR branches

# main 이 전진할 때마다, main을 대상으로 하는 열린 PR 중 뒤처진(BEHIND) 브랜치를 GitHub 네이티브
# "Update branch" API로 병합 동기화한다. 강제 push나 rebase(히스토리 재작성)는 하지 않는다 —
# 항상 origin/main을 병합 커밋으로 흡수하는 merge다.
#
# 목적은 delivery-admit.mjs의 "최신 main 반영" 판정을, PR 작성자가 매번 로컬에서 수동으로
# 리베이스하지 않아도 자연히 통과하게 만드는 것이다. 이 워크플로는 admit 판정 자체나
# required CI 구성을 바꾸지 않는다 — 후보 브랜치를 최신으로 유지만 한다.
#
# 충돌이 있는 PR은 건너뛰고 코멘트만 남긴다. 이 워크플로가 대신 해결하지 않는다.
#
# 2026-09-12: "최신 main 반영"은 더 이상 입장 조건이 아니다(ruleset·delivery-admit·ci-preflight 모두
# 충돌 + 파일 겹침 기준). main push 마다 모든 PR 을 갱신하면 CI 만 재실행되므로 수동 실행 전용으로 둔다.
on:
  workflow_dispatch:

concurrency:
  group: pr-branch-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Update behind PR branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find and update behind PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          PRS=$(gh pr list --repo "${REPO}" --base main --state open --json number,mergeStateStatus,isDraft,headRefName) || exit 1
          echo "${PRS}" | jq -c '.[] | select(.isDraft == false and .mergeStateStatus == "BEHIND")' | while read -r pr; do
            NUMBER=$(echo "${pr}" | jq -r '.number')
            BRANCH=$(echo "${pr}" | jq -r '.headRefName')
            echo "::notice::PR #${NUMBER} (${BRANCH})가 main보다 뒤처졌습니다. update-branch를 시도합니다."
            if gh api --method PUT "repos/${REPO}/pulls/${NUMBER}/update-branch" >/dev/null 2>&1; then
              echo "::notice::PR #${NUMBER} 동기화 완료."
            else
              echo "::warning::PR #${NUMBER} 자동 동기화 실패(충돌 가능성). 수동 확인이 필요합니다."
              gh pr comment "${NUMBER}" --repo "${REPO}" --body "main이 전진해 이 브랜치가 뒤처졌는데, 자동 동기화(update-branch)가 실패했습니다. 충돌이 있을 수 있으니 로컬에서 \`npm run delivery:sync -- --push\`로 수동 병합해주세요." || true
            fi
          done
