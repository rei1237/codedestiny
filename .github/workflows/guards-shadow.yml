name: Guards (shadow)

# 배선돼 있지 않은 검증기를 **관측만** 하는 워크플로다. 여기서 무엇이 실패해도 아무것도 막지 않는다.
#
# 🔴 차단력이 0인 근거 두 가지. 둘 다 유지해야 한다.
#    ① 이 잡은 `pr-ci.yml` 의 `ci-required` aggregate 의 `needs` 에 **없다**. 필수 체크는
#       "CI required" 하나이므로, 이 워크플로의 결과는 머지도 배포도 막을 수 없다.
#    ② 가드 스텝마다 `continue-on-error: true` 다. 하나가 실패해도 나머지 40개가 끝까지 돈다
#       — 10회 push 관측에는 매 push 마다 **전원**의 결과가 필요하다.
#
# 🔴 잡 레벨에는 `continue-on-error` 를 걸지 않는다. 걸면 `npm ci` 가 깨진 런도 초록으로 보여서
#    "40개 전부 통과" 와 "한 번도 안 돌았다" 가 구분되지 않는다 — 그게 이 워크플로가 만들어질 때
#    가장 경계한 실패 모양("안 도는 shadow")이다. 셋업이 깨지면 이 워크플로는 빨갛게 보이고,
#    그래도 막는 것은 없다(①).
#
# 🔴 `scripts/verify-guard-wiring.mjs` 의 `SHADOW_OBSERVING` 과 **쌍이다.** 한쪽만 바꾸면 감사가
#    실패한다: 여기서 지우면 "안 도는 shadow", 차단 게이트로 옮기면 "차단하는 척하는 shadow".
#
# 실 LLM·실결제 호출 0: 이 레포의 워크플로에는 LLM 시크릿이 하나도 주입되지 않는다(전수 확인).
# 그 위에 `LLM_DRY_RUN`·`WORKERS_AI_ENABLED` 를 명시해 둔다 — 나중에 누가 키를 추가해도 이 잡은
# dry-run 이다. `scripts/lib/mock-network-guard.cjs` 는 `NODE_OPTIONS` 로 넣지 않는다: 잡 레벨
# env 는 `actions/checkout`·`setup-node` 같은 JS 액션에도 적용돼서 체크아웃·노드 설치가 통째로
# 막힌다. 로컬 실측(2026-09-13)은 그 가드를 켠 채 41개 통과를 확인했다.
#
# 관측 집계: `gh run list --workflow=guards-shadow.yml -R <repo>` → `gh run view <id> --json jobs`
# 의 `steps[].conclusion` 을 센다.
#
# 차단 승격 조건(= 이 파일에서 나가는 조건): main push 10회 이상 관측 + 그 기간 오탐 0 +
# **사용자의 명시적 승인.** 게이트 추가는 승인 사항이다. 자세한 내용은
# docs/refactor/phase-plan.md 의 "shadow → 차단 승격 조건".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 커밋마다 독립 관측이다. 앞선 런을 취소하면 그 커밋의 관측이 영구히 비어 버린다.
  group: guards-shadow-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shadow:
    name: Unwired guards (observation only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_DRY_RUN: "true"
      WORKERS_AI_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      # pr-ci.yml 의 guards 잡과 같은 체크아웃이다 — 일부 가드가 git 을 부르므로 fetch-depth: 0 을
      # 유지하고 블롭만 지연 로딩한다. Playwright 는 설치하지 않는다(이 41개 중 브라우저 가드 0개).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 결제·인증 ──────────────────────────────────────────────────────────────
      # 아래 모든 스텝의 형식은 같다: continue-on-error 로 결과만 남기고, 한 개가 매달려도
      # 나머지 관측을 잡아먹지 않게 스텝마다 상한을 둔다(실측 최장 58초 / 2026-09-13).
      - name: verify:payment-service-boundary (결제 경계 정적 검사)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:payment-service-boundary

      - name: verify:payment-choice-single-instance (결제창 단일 인스턴스)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:payment-choice-single-instance

      - name: verify:pass-check-retry (이용권 재검사 재시도 계약)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:pass-check-retry

      - name: verify:payment-policy-md (결제 정책 문서 정합)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:payment-policy-md

      - name: verify:market-policy-registry (시장 정책 레지스트리)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:market-policy-registry

      - name: verify:app-no-portone (앱 PortOne 차단)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:app-no-portone

      - name: verify:auth-public-origin (OAuth 콜백 origin 고정)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:auth-public-origin

      - name: verify:password-policy (비밀번호 정책)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:password-policy

      - name: verify:admin-feedback-bug-reward (관리자 피드백 보상)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:admin-feedback-bug-reward

      # ── Worker·LLM 경계 ───────────────────────────────────────────────────────
      - name: verify:route-await-dispatch (라우트 await 디스패치)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:route-await-dispatch

      - name: verify:llm-client-timeout-budget (LLM 타임아웃 예산 · 정적)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:llm-client-timeout-budget

      - name: verify:guardian-fortune-failure (수호신 상담 실패 계약 · 정적)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:guardian-fortune-failure

      - name: verify:cf:migration (Worker 런타임 호환 · 필수 파일)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:cf:migration

      # ── 프로필·진입·UI ────────────────────────────────────────────────────────
      - name: verify:profile-client-first (프로필 클라이언트 우선 로드)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:profile-client-first

      - name: verify:profile-new-user (신규 사용자 프로필 초기화)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:profile-new-user

      - name: verify:profile-card-level (프로필 카드 등급 표시)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:profile-card-level

      - name: verify:auth-card-theme (로그인 카드 테마 대비)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:auth-card-theme

      - name: verify:hero-contrast (히어로 대비 3:1 게이트)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:hero-contrast

      - name: verify:rpt-preview-cta (리포트 프리뷰 CTA)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:rpt-preview-cta

      - name: verify:sun-recovery-copy (복구 안내 문구)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:sun-recovery-copy

      - name: verify:feature-marketing-schema (기능 마케팅 스키마)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:feature-marketing-schema

      - name: verify:static-asset-cache-keys (정적 자산 캐시 키)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:static-asset-cache-keys

      - name: verify:i18n-no-hardcoded-korean (하드코딩 한국어 스캔)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:i18n-no-hardcoded-korean

      # ── 운세·콘텐츠 결정성 ────────────────────────────────────────────────────
      - name: verify:physiognomy-report (관상 리포트 섹션 파서)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:physiognomy-report

      - name: verify:physiognomy-scoring (관상 점수 결정성)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:physiognomy-scoring

      - name: verify:animal-totem-render (동물 토템 렌더)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:animal-totem-render

      - name: verify:past-life-face (전생 얼굴 결정성)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:past-life-face

      - name: verify:numerology-tarot-flow (수비학 타로 플로우)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:numerology-tarot-flow

      - name: verify:tarot-love-flow (타로 연애 플로우)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:tarot-love-flow

      - name: verify:tarot-topic-lock (타로 주제 고정)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:tarot-topic-lock

      - name: verify:love-compat (궁합 결정성)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:love-compat

      - name: verify:ziwei-island (자미두수 아일랜드 청사진)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:ziwei-island

      - name: verify:destiny-compass (운명 나침반 결정성)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:destiny-compass

      - name: verify:pet-saju (반려동물 사주 결정성)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:pet-saju

      - name: verify:rpg-phase9 (RPG 페이즈9 계약)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:rpg-phase9

      - name: verify:fusion-fortune-reopen (융합 운세 재열람)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:fusion-fortune-reopen

      - name: verify:fusion-fortune-pdf (초융합 PDF 문서 구성)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:fusion-fortune-pdf

      - name: verify:cms-registry (CMS 레지스트리)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:cms-registry

      # ── 모바일 셸 ─────────────────────────────────────────────────────────────
      - name: verify:mobile-entry-actions (모바일 진입 액션 배선)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:mobile-entry-actions

      - name: verify:mobile-pricing-parity (모바일 가격 표기 정합)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:mobile-pricing-parity

      - name: verify:mobile-bottom-nav-sync (모바일 하단 내비 동기화)
        continue-on-error: true
        timeout-minutes: 5
        run: npm run verify:mobile-bottom-nav-sync
