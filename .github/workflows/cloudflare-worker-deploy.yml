name: Deploy Worker API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: code-destiny-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing required secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sync public static artifacts
        run: npm run sync:public

      - name: Verify style sync
        run: npm run verify:style-sync

      - name: Wrangler token preflight
        run: npx --no-install wrangler whoami

      - name: Sync Worker runtime secrets
        env:
          GEMINIF_API_KEY1: ${{ secrets.GEMINIF_API_KEY1 }}
          GEMINIF_API_KEY2: ${{ secrets.GEMINIF_API_KEY2 }}
          GEMINIF_API_KEY3: ${{ secrets.GEMINIF_API_KEY3 }}
          GEMINIF_API_KEY4: ${{ secrets.GEMINIF_API_KEY4 }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GOOGLE_YOUTUBE_API_KEY: ${{ secrets.GOOGLE_YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PREMIUM_GEMINI_MODEL: ${{ vars.PREMIUM_GEMINI_MODEL }}
          LIFEBOOK_GEMINI_MODEL: ${{ vars.LIFEBOOK_GEMINI_MODEL }}
          LOVE_SECRET_GEMINI_MODEL: ${{ vars.LOVE_SECRET_GEMINI_MODEL }}
          PSYCHO_ANALYSIS_GEMINI_MODEL: ${{ vars.PSYCHO_ANALYSIS_GEMINI_MODEL }}
          SUKUYO_GEMINI_MODEL: ${{ vars.SUKUYO_GEMINI_MODEL }}
          ASTRO_GEMINI_MODEL: ${{ vars.ASTRO_GEMINI_MODEL }}
          VEDIC_GEMINI_MODEL: ${{ vars.VEDIC_GEMINI_MODEL }}
          ZIWEI_GEMINI_MODEL: ${{ vars.ZIWEI_GEMINI_MODEL }}
          MONGO_URI: ${{ secrets.MONGO_URI || secrets.MONGODB_URI || secrets.MONGO_URL || secrets.DATABASE_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI || secrets.MONGO_URL || secrets.DATABASE_URL }}
          MONGO_URL: ${{ secrets.MONGO_URL || secrets.MONGO_URI || secrets.MONGODB_URI || secrets.DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.MONGO_URI || secrets.MONGODB_URI || secrets.MONGO_URL }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || vars.MONGODB_DB_NAME }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || vars.MONGO_DB_NAME }}
        run: npm run secrets:cf:worker -- --skip-empty

      - name: Worker preflight build (dry-run)
        run: npm run build:worker

      - name: Deploy Cloudflare Worker (retry transient API 5xx)
        run: |
          set -euo pipefail

          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "[deploy-worker] Attempt $attempt/$max_attempts"

            log_file="$(mktemp)"
            set +e
            npm run deploy:cf:worker 2>&1 | tee "$log_file"
            deploy_status=${PIPESTATUS[0]}
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            if grep -Eiq "Received a malformed response from the API|workers/subdomain -> 5[0-9]{2}" "$log_file"; then
              echo "[deploy-worker] Transient Cloudflare API error detected during workers/subdomain lookup."
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "[deploy-worker] Retrying in 20 seconds..."
                sleep 20
                rm -f "$log_file"
                attempt=$((attempt + 1))
                continue
              fi
            fi

            echo "[deploy-worker] Deploy failed with non-retryable error or max retries reached."
            rm -f "$log_file"
            exit "$deploy_status"
          done
