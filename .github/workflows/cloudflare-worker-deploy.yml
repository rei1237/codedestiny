name: Deploy Worker API

# 중복 배포 방지(CLOUDFLARE_PAGES_SETUP.md): Worker와 Pages는 각각 한 개의
# 공식 배포 워크플로우만 사용한다. Worker는 main 머지 push와 수동 실행을 지원한다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINIF_API_KEY: ${{ secrets.GEMINIF_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_GEMINI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_GEMINI_API_KEY || secrets.GEMINIF_API_KEY }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY || secrets.GEMINI_API_KEY || secrets.GEMINIF_API_KEY }}
      CF_WORKER_NAME: code-destiny-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment is from merged main
        run: node scripts/verify-worktree-policy.mjs --mode=deploy

      - name: Load local fallback env (optional)
        id: load-gemini-fallback
        run: |
          set -euo pipefail
          if [ ! -f .env.local ]; then
            exit 0
          fi

          fallback_gemini_key="$(node - <<'NODE'
          const fs = require("node:fs");

          const CANDIDATES = ["GEMINIF_API_KEY", "GEMINI_API_KEY", "GOOGLE_GEMINI_API_KEY"];
          const PLACEHOLDERS = ["CHANGE_ME", "PLEASE_CHANGE", "YOUR_", "EXAMPLE", "PUT_32_CHAR_RANDOM_HASH_HERE", "YOUR_SECRET", "YOUR_API_KEY"];

          function isUsable(value) {
            if (!value) return false;
            const trimmed = String(value).trim();
            if (!trimmed) return false;
            const upper = trimmed.toUpperCase();
            return !PLACEHOLDERS.some((marker) => upper.includes(marker));
          }

          function unquote(value) {
            const trimmed = String(value).trim();
            if (!trimmed) return "";
            if ((trimmed.startsWith("\"") && trimmed.endsWith("\"")) || (trimmed.startsWith("'") && trimmed.endsWith("'"))) {
              return trimmed.slice(1, -1).trim();
            }
            return trimmed;
          }

          try {
            const text = fs.readFileSync(".env.local", "utf8");
            const source = Object.create(null);

            for (const line of text.split(/\r?\n/)) {
              const match = line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$/);
              if (!match) continue;
              const key = match[1].trim().toUpperCase();
              const value = unquote(match[2]);
              if (!value || !isUsable(value)) continue;
              source[key] = value;
            }

            for (const key of CANDIDATES) {
              const value = source[key];
              if (value) {
                process.stdout.write(value);
                break;
              }
            }
          } catch (_error) {
            // ignore
          }
          NODE
          )"

          if [ -n "${fallback_gemini_key:-}" ]; then
            echo "gemini_api_key=${fallback_gemini_key}" >> "${GITHUB_OUTPUT}"
            {
              echo "GEMINIF_API_KEY=${fallback_gemini_key}"
              echo "GEMINI_API_KEY=${fallback_gemini_key}"
              echo "GOOGLE_GEMINI_API_KEY=${fallback_gemini_key}"
            } >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate required secrets
        run: |
          set -euo pipefail
          resolved_gemini_api_key="${GEMINIF_API_KEY:-${GEMINI_API_KEY:-${GOOGLE_GEMINI_API_KEY:-}}}"
          fallback_gemini_api_key="${{ steps.load-gemini-fallback.outputs.gemini_api_key || '' }}"
          if [ -z "${resolved_gemini_api_key:-}" ] && [ -n "${fallback_gemini_api_key}" ]; then
            resolved_gemini_api_key="${fallback_gemini_api_key}"
          fi
          has_job_env="$(if [ -n "${GEMINIF_API_KEY:-}" ] || [ -n "${GEMINI_API_KEY:-}" ] || [ -n "${GOOGLE_GEMINI_API_KEY:-}" ]; then echo "true"; else echo "false"; fi)"
          has_fallback="$(if [ -n "${fallback_gemini_api_key}" ]; then echo "true"; else echo "false"; fi)"
          echo "::notice::Gemini key source check: job_env=${has_job_env}, fallback_file=${has_fallback}"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing required secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing required secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "${resolved_gemini_api_key:-}" ]; then
            echo "::warning::No Gemini API key secret found."
            echo "::warning::Set one of: GEMINIF_API_KEY (or GEMINI_API_KEY / GOOGLE_GEMINI_API_KEY) in GitHub Secrets, or provide in .env.local as a non-placeholder key."
            echo "GEMINIF_API_KEY=" >> "$GITHUB_ENV"
            echo "GEMINI_API_KEY=" >> "$GITHUB_ENV"
            echo "GOOGLE_GEMINI_API_KEY=" >> "$GITHUB_ENV"
          else
            export GEMINIF_API_KEY="${resolved_gemini_api_key}"
            export GEMINI_API_KEY="${resolved_gemini_api_key}"
            export GOOGLE_GEMINI_API_KEY="${resolved_gemini_api_key}"
            echo "GEMINIF_API_KEY=${resolved_gemini_api_key}" >> "$GITHUB_ENV"
            echo "GEMINI_API_KEY=${resolved_gemini_api_key}" >> "$GITHUB_ENV"
            echo "GOOGLE_GEMINI_API_KEY=${resolved_gemini_api_key}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sync public static artifacts
        run: npm run sync:public

      - name: Verify style sync
        run: npm run verify:style-sync

      - name: Wrangler token preflight
        run: npx --no-install wrangler whoami

      - name: Sync Worker runtime secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GOOGLE_YOUTUBE_API_KEY: ${{ secrets.GOOGLE_YOUTUBE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PREMIUM_GEMINI_MODEL: ${{ vars.PREMIUM_GEMINI_MODEL }}
          LIFEBOOK_GEMINI_MODEL: ${{ vars.LIFEBOOK_GEMINI_MODEL }}
          LOVE_SECRET_GEMINI_MODEL: ${{ vars.LOVE_SECRET_GEMINI_MODEL }}
          PSYCHO_ANALYSIS_GEMINI_MODEL: ${{ vars.PSYCHO_ANALYSIS_GEMINI_MODEL }}
          SUKUYO_GEMINI_MODEL: ${{ vars.SUKUYO_GEMINI_MODEL }}
          ASTRO_GEMINI_MODEL: ${{ vars.ASTRO_GEMINI_MODEL }}
          VEDIC_GEMINI_MODEL: ${{ vars.VEDIC_GEMINI_MODEL }}
          ZIWEI_GEMINI_MODEL: ${{ vars.ZIWEI_GEMINI_MODEL }}
          MONGO_URI: ${{ secrets.MONGO_URI || secrets.MONGODB_URI || secrets.MONGO_URL || secrets.DATABASE_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URI || secrets.MONGO_URL || secrets.DATABASE_URL }}
          MONGO_URL: ${{ secrets.MONGO_URL || secrets.MONGO_URI || secrets.MONGODB_URI || secrets.DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.MONGO_URI || secrets.MONGODB_URI || secrets.MONGO_URL }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || vars.MONGODB_DB_NAME }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME || vars.MONGO_DB_NAME }}
        run: npm run secrets:cf:worker -- --skip-empty --continue-on-transient-api-error

      - name: Worker preflight build (dry-run)
        run: npm run build:worker

      - name: Deploy Cloudflare Worker (retry transient API 5xx)
        run: |
          set -euo pipefail

          max_attempts=3
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "[deploy-worker] Attempt $attempt/$max_attempts"

            log_file="$(mktemp)"
            set +e
            npm run deploy:cf:worker 2>&1 | tee "$log_file"
            deploy_status=${PIPESTATUS[0]}
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            if grep -Eiq "Received a malformed response from the API|workers/subdomain -> 5[0-9]{2}" "$log_file"; then
              echo "[deploy-worker] Transient Cloudflare API error detected during workers/subdomain lookup."
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "[deploy-worker] Retrying in 20 seconds..."
                sleep 20
                rm -f "$log_file"
                attempt=$((attempt + 1))
                continue
              fi
            fi

            echo "[deploy-worker] Deploy failed with non-retryable error or max retries reached."
            rm -f "$log_file"
            exit "$deploy_status"
          done
