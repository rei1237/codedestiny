name: Cloudflare Safe Preview Preparation

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-safe-auto-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  safe-release:
    name: Prepare and verify preview only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'code-destiny-web' }}
      CD_DEPLOY_BASE_SHA: ${{ github.event.before || github.sha }}
      CD_DEPLOY_HEAD_SHA: ${{ github.sha }}
      CD_WORKER_PREVIEW_ORIGIN: ${{ vars.CF_WORKER_PREVIEW_ORIGIN }}
      CD_PRODUCTION_ORIGIN: ${{ vars.CD_PRODUCTION_ORIGIN || 'https://code-destiny.com' }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Verify canonical CI deployment policy
        run: node scripts/verify-worktree-policy.mjs --mode=deploy

      - name: Sync Pages public configuration
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_AUTH_API_BASE_URL: ${{ vars.NEXT_PUBLIC_AUTH_API_BASE_URL || secrets.NEXT_PUBLIC_AUTH_API_BASE_URL }}
          NEXT_PUBLIC_ASSETS_BASE_URL: ${{ vars.NEXT_PUBLIC_ASSETS_BASE_URL || secrets.NEXT_PUBLIC_ASSETS_BASE_URL }}
          NEXT_PUBLIC_MUSIC_BASE_URL: ${{ vars.NEXT_PUBLIC_MUSIC_BASE_URL || secrets.NEXT_PUBLIC_MUSIC_BASE_URL }}
          NEXT_PUBLIC_PORTONE_IMP_CODE: ${{ vars.NEXT_PUBLIC_PORTONE_IMP_CODE || secrets.NEXT_PUBLIC_PORTONE_IMP_CODE }}
          NEXT_PUBLIC_PORTONE_STORE_ID: ${{ vars.NEXT_PUBLIC_PORTONE_STORE_ID || secrets.NEXT_PUBLIC_PORTONE_STORE_ID }}
          NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${{ vars.NEXT_PUBLIC_PORTONE_CHANNEL_KEY || secrets.NEXT_PUBLIC_PORTONE_CHANNEL_KEY }}
          NEXT_PUBLIC_PORTONE_TOSS_CHANNEL_KEY: ${{ vars.NEXT_PUBLIC_PORTONE_TOSS_CHANNEL_KEY || secrets.NEXT_PUBLIC_PORTONE_TOSS_CHANNEL_KEY }}
          NEXT_PUBLIC_PORTONE_PG_CARD: ${{ vars.NEXT_PUBLIC_PORTONE_PG_CARD || secrets.NEXT_PUBLIC_PORTONE_PG_CARD }}
          NEXT_PUBLIC_PORTONE_MOBILE_REDIRECT_PATH: ${{ vars.NEXT_PUBLIC_PORTONE_MOBILE_REDIRECT_PATH || secrets.NEXT_PUBLIC_PORTONE_MOBILE_REDIRECT_PATH }}
        run: npm run secrets:cf:pages -- --skip-empty

      - name: Run preview-only safe release
        run: npm run deploy:safe -- --ci --preview-only
