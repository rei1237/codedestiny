name: Paid Flow Gates

# 🔴 트리거 범위는 결제 · 로그인 · 운세 로직 셋으로 좁혀 둔다(2026-08-08 사용자 지시).
# 예전에는 worker/** · app/** · js/** · src/** · __tests__/** 처럼 사실상 모든 변경이 걸려
# CSS 한 줄만 고쳐도 36개 검증기 + 전체 테스트가 돌았다. 그 비용이 게이트의 가치보다 컸다.
#
# ⚠️ 대가: 여기 없는 경로만 바꾸면 이 게이트는 깨어나지 않는다. 공용 유틸을 고쳐 결제·인증에
#    간접적으로 영향이 가는 변경은 자동으로 잡히지 않으므로, 그럴 때는 workflow_dispatch 로 직접 돌린다.
# 🔴 트리거는 pull_request 다(2026-08-11). 예전에는 push:main 이었는데, PR 기반 배포로 바뀐
# 뒤로 push:main 은 "이미 배포가 시작된 뒤"라서 게이트가 아무것도 막지 못한다.
on:
  pull_request:
    branches: [main]
    paths:
      # ── 결제 ──────────────────────────────────────────────
      - "worker/routes/billing.js"
      - "worker/routes/payments.js"
      # 신규 결제 컨텍스트. 컷오버가 끝나면 결제의 정본이 되는 곳이라, 여기가 빠져 있으면
      # 정작 살아 있는 구현을 고칠 때 결제 게이트가 깨어나지 않는다.
      - "worker/payments/**"
      # 동결 매니페스트. 구 결제 코드를 고치려면 이 파일을 같은 커밋에 담아야 하는데,
      # 그 커밋이 게이트를 깨우지 않으면 트립와이어가 울려도 아무도 듣지 못한다.
      - "config/payment-freeze.json"
      - "worker/lib/paid-feature-registry.js"
      - "worker/lib/billing-policy.js"
      - "worker/lib/payment-refund.js"
      - "worker/lib/content-unlocks.js"
      - "worker/lib/profile-limits.js"
      - "worker/lib/portone.js"
      # 🔴 결제 **레인**이 사는 곳이다(2026-08-12 추가). connectPaymentDb(전용 소켓 풀) ·
      #    mongoPaymentAdmission(전용 admission 레인) · withMongoRetry 의 skipSharedConnect 가
      #    전부 여기 있고, worker/payments/** 는 이 셋 위에서만 동작한다. 그런데 정작 이 파일이
      #    트리거에 없어서, 결제가 죽고 살아나는 실제 원인 파일을 고칠 때 결제 게이트가 깨어나지
      #    않았다 — 정본(셸 인라인)이 빠져 있던 것과 같은 형태의 구멍이다.
      #    2026-08-12 하루에 난 결제 사고 3건이 전부 이 파일의 변경이었다:
      #      · 2c2a16205 부팅 폭풍이 결제 소켓을 굶김  · de8c65440 콜드 아이솔레이트 이중 핸드셰이크
      #      · bbea34aed admission 포화가 checkout 을 하드 503 으로
      - "worker/lib/db.js"
      - "worker/lib/nakshatra-paid-access.js"
      - "worker/lib/profile-card-mutation-policy.js"
      - "worker/routes/access.js"
      - "worker/routes/profile.js"
      - "app/_lib/billing-client.ts"
      - "app/hooks/useCoinGate.ts"
      - "lib/payment/**"
      - "js/core/access-store.js"
      - "js/core/pass-verdict.js"
      - "js/core/checkout-entry.js"
      - "js/core/payment-service.js"
      - "js/core/feature-pricing-store.js"
      - "js/destiny-profile.js"
      # 미러도 함께 건다 — verify:payment-choice-parity 가 이 사본을 실제로 열어 검사한다.
      - "public/js/destiny-profile.js"
      # 🔴 아래 셋은 cd:auth-changed 리스너를 갖고 있어 verify:auth-changed-coverage 의 스캔 대상이다.
      # 가드가 검사하는데 트리거에 없으면 "그 파일만 고친 PR 에서는 가드가 안 도는" 구멍이 된다
      # (index-inline-runtime 은 verify:auth-event-loop 가 이미 검사하고 있었는데도 빠져 있었다).
      # 그 정합성은 이제 verify:auth-changed-coverage 가 기계로 강제한다.
      # 🔴 유료 타일의 **진입 자체**를 좌우한다(2026-08-14 추가). 고스트 클릭 억제가
      #    상세 팝업 CTA 의 진입 클릭을 삼켜 유료 기능 13종이 전부 "눌러도 무반응"이었는데,
      #    이 파일이 트리거에 없어 결제 게이트가 깨어나지 않았다(PR #625).
      - "js/mobile-interaction-patch.js"
      - "js/core/index-inline-runtime.js"
      - "js/saju-engine.js"
      - "js/share.js"
      # ── 정적 셸 (결제수단 선택 모달 **정본**) ───────────────
      # 🔴 결제창 렌더러는 3종이지만 정본은 셸 인라인 하나다(`_cdChooseServicePaymentMode`,
      #    CSS 는 `_cdEnsureDirectPaymentStyles`). 나머지 두 렌더러(app/_lib/billing-client.ts ·
      #    js/destiny-profile.js)는 위에 이미 있는데 정작 정본이 빠져 있었다 — 셸에서 이용권
      #    카드를 지우거나 3옵션 문구를 바꿔도 verify:payment-choice-parity 가 깨어나지 않았다.
      #    change-risk 는 index.html 을 low 로 보므로(콘텐츠 셸이기도 하다) PR CI 티어는 fast 로
      #    남는다. 결제 검증만 여기서 따로 깨운다 — 셸 문구 한 줄에 전체 회귀를 돌리지 않기 위함이다.
      - "index.html"
      - "public/index.html"
      - "public/en/index.html"
      - "public/ja/index.html"
      - "public/zh/index.html"
      - "public/zh-tw/index.html"
      - "public/static/index.html"
      # ── 로그인 / 인증 ──────────────────────────────────────
      - "worker/routes/auth.js"
      - "worker/lib/auth.js"
      - "app/_lib/auth-client.ts"
      - "app/_lib/auth-store.ts"
      # 로그인·가입 UI. 가입 성공 시 프로필 카드용 1회성 힌트를 남기는 곳이라, 여기가 빠져 있으면
      # 힌트를 로그인 경로에 잘못 옮기거나 키를 바꿔도 verify:profile-fresh-signup 이 깨어나지 않는다.
      - "app/components/auth/AuthShell.tsx"
      # ── 운세 로직 ─────────────────────────────────────────
      - "worker/routes/fortune.js"
      - "worker/routes/*-ai.js"
      - "worker/lib/gemini.js"
      - "worker/lib/gemini-client.js"
      - "worker/lib/structured-consultation.js"
      - "worker/lib/llm-cache-store.js"
      - "lib/llm-client.ts"
      # ── 게이트 자신 ───────────────────────────────────────
      - "scripts/verify-*billing*.mjs"
      - "scripts/verify-*paid*.mjs"
      - "scripts/verify-*pass*.mjs"
      - "scripts/verify-*payment*.mjs"
      - "scripts/verify-*auth*.mjs"
      - "scripts/verify-profile-card-*.mjs"
      - "scripts/verify-security-hardening.mjs"
      - "scripts/verify-worker-security-guards.mjs"
      - ".github/workflows/paid-flow-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 🔴 경로 트리거만으로는 "결제를 실제로 건드렸는가"를 구분할 수 없다.
  #    index.html 은 결제창 정본이면서 홈 콘텐츠 셸이고, js/core/index-inline-runtime.js 는
  #    sync:public 이 캐시키만 재생성해도 변경으로 잡힌다 — 그래서 팝업 문구 한 줄에도
  #    36개 검증기가 통째로 돌았다(사용자 지적, 2026-08-14).
  #    판정은 diff 내용으로 하고, 재료는 전부 정본에서 가져온다(change-risk · 이 YAML 의 paths ·
  #    셸의 결제 모달 구간). 못 구하면 돌린다(fail-closed).
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Decide whether the paid gates are needed
        id: decide
        run: node scripts/resolve-paid-gate-scope.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

  paid-flow-gates:
    needs: scope
    # 값이 없거나 판정이 실패하면 돌린다 — 건너뛰는 것은 run=false 를 명시적으로 받았을 때뿐이다.
    if: needs.scope.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Verify security hardening (regression guard)
        run: npm run verify:security-hardening

      # cd:auth-changed 재검증 증폭 루프 재발 방지 — source 필터 하나만 빠져도
      # 이용권 확인마다 캐시가 전멸하고 홈이 다시 그려진다(증상이 "가끔 느리다"로만 보인다).
      - name: Verify auth event loop guard
        run: npm run verify:auth-event-loop

      # 위 가드는 "손으로 쓴 목록의 리스너에 필터가 있는가"를 본다. 목록에 없는 파일에 리스너가
      # 새로 생기면 못 본다 — 그래서 사고가 두 번 났다(G-3 셸 미러, G-7 프로필 카드 무한 로딩).
      # 이쪽은 소스에서 리스너를 전수 발견해 전부 filtered/benign 으로 분류돼 있는지 본다.
      # 분류되지 않은 새 리스너는 실패다 — 그게 이 가드의 존재 이유다.
      - name: Verify every cd:auth-changed listener is classified
        run: npm run verify:auth-changed-coverage

      # 형제 가드인데 여기 빠져 있어서, 하네스가 깨진 채로 방치됐다(auth-client 가 새 모듈을
      # import 하자 import 매핑 표에 없어 스크립트가 그냥 던졌다). 아무도 부르지 않는 가드는
      # 지키는 게 없으면서 지키는 것처럼 보인다.
      - name: Verify auth session stability
        run: npm run verify:auth-session-stability

      - name: Verify paid feature billing policy
        run: npm run verify:paid-feature-billing-policy

      - name: Verify AI prompt billing policy
        run: npm run verify:ai-prompt-billing-policy

      # 손금: 프로덕션 빌드가 output:"export" 라 app/api/** 가 통째로 빠진다는 사실 때문에
      # Gemini Vision 이 로컬에서만 돌고 실제 사용자는 정적 템플릿을 받고 있었다(2026-07 발견).
      # 워커에 LLM 이 배선돼 있는지 / 비전 호출이 Workers AI 폴백을 껐는지(폴백은 이미지를 버린다) /
      # 문양이 미검출 기본값인지 / 인증·본문 상한이 살아 있는지를 소스 수준에서 강제한다.
      - name: Verify palm reading flow
        run: npm run verify:palm-flow

      # 워커 라우터가 try/catch 안에서 await 없이 핸들러를 위임하면, 그 거부(rejection)는
      # catch 를 빠져나가 Cloudflare 1101(불투명 500, CORS 헤더 없음)이 된다.
      # 2026-08-01 작명 AI 가 이 상태였다 — 비로그인 401 조차 500 으로 나가 원인 추적이 오래 걸렸다.
      - name: Verify payment choice modal parity
        run: npm run verify:payment-choice-parity

      # 문자열 마커로는 "이용권 카드가 있다"까지만 본다. 2026-08 정책 전환으로 그 카드가
      # **이용권 검사 지점**이 됐으므로, jsdom 에서 실제로 눌러 두 갈래(커버→무료 통과 /
      # 미커버→상점 인계)가 갈라지는지와 앱에서 /points 로 새지 않는지를 실행으로 확인한다.
      - name: Verify checkout pass card behaviour (jsdom)
        run: npm run verify:checkout-pass-card

      # 홈 진입 팬아웃 계약. 진입에서 없앤 두 호출(/api/subscription/status 워밍 · POST /api/rpg/adopt)이
      # 되살아나면 콜드 아이솔레이트에서 공유 admission 레인이 다시 포화되고, 넘친 요청은
      # MongoOperationOverloadedError(재시도 **불가**) → 503 이 된다.
      # 결제 게이트에 두는 이유: 워밍이 채우던 것이 **이용권 스냅샷**이라, 이 계약이 깨지면
      # 결제창 fast-path 와 이용권 판정이 함께 흔들린다. 특히 auth/me 의 degraded 응답을
      # 스냅샷에 쓰면 tier:"free" 가 굳어 **이용권 보유자에게 결제창이 뜬다** — 돈 문제다.
      # 문자열 검사에 그치지 않고 판정 정본(js/core/pass-verdict.js)을 실제로 실행해 확인한다.
      - name: Verify home entry fan-out contract
        run: npm run verify:entry-fanout

      # 이용권 구제 경로(결제창에서 보유 이용권이 그 자리에서 적용되는 길)의 회귀 방지.
      # 과거 두 사고가 모두 "핸들러·소비자는 남고 진입점만 사라진" 형태라 이름 grep 으로는 정상으로
      # 보였다. 여기서는 함수 본문을 중괄호 균형으로 잘라, 확인 전 스냅샷 선삭제·402 로 인한 스냅샷
      # 폐기·확인 실패의 미커버 세탁을 3런타임 9소스에서 함께 막는다.
      - name: Verify membership pass recovery path
        run: npm run verify:pass-recovery-path

      # 재밌는 사주 콘텐츠 타일: 상세 팝업이 결제보다 먼저 뜨는지 + 해금 후 CTA 가 카드를
      # 열었다 닫지 않는지(이중 처리). 실제 클릭 재현은 verify:rpt-preview-cta(크롬 필요)가 맡고,
      # 여기서는 6미러 불변식만 본다.
      - name: Verify saju fun-content preview gate
        run: npm run verify:saju-fun-content-gate

      # 정적 마커로는 "캡처 리스너 둘이 같은 클릭을 각각 처리한다"를 못 잡는다(이번 회귀가 그 증거).
      # 실제 크롬으로 클릭을 쏴서 토글 호출 횟수를 센다. 러너 이미지에 Chrome 이 포함돼 있다.
      - name: Verify profile card is server-first
        run: npm run verify:profile-server-first

      # 가입 직후 프로필 카드가 /api/profile 왕복을 기다리지 않고 즉시 최종 상태로 뜨는지.
      # 힌트를 쓰는 쪽(AuthShell.tsx)과 읽는 쪽(js/destiny-profile.js)이 키·형식으로만 이어져
      # 있어서, 한쪽만 바뀌면 힌트가 조용히 무효가 된다 — 그 갈라짐까지 함께 단언한다.
      - name: Verify fresh-signup profile card renders without a roundtrip
        run: npm run verify:profile-fresh-signup

      # 이용권 갱신이 스스로 쏘는 cd:auth-changed 되울림에 프로필 카드가 로딩으로 되돌아가지
      # 않는지. verify:auth-event-loop 가 "필터가 소스에 있는가"를 본다면 이쪽은 "그래서 실제로
      # 카드가 안 흔들리는가"를 jsdom 에서 실행해 본다 — 필터가 있어도 배선이 어긋나면 무효다.
      - name: Verify profile card never falls back to infinite loading
        run: npm run verify:profile-loading-stability

      # 아래 두 가드는 package.json 에만 있고 어떤 워크플로에서도 실행되지 않아, 지금까지
      # PR 을 한 번도 막은 적이 없었다(paths 에 src/** 가 없어 트리거조차 되지 않았다).
      # 둘 다 "이용권 선검사 → 미커버 시에만 결제창" 순서를 소스 순서로 못박는 가드다.
      - name: Verify React paid gate ordering
        run: npm run verify:paid-gate-ui

      - name: Verify master love codex flow
        run: npm run verify:master-love-codex-flow

      # 배치 시간 예산 — 이게 없으면 /generate 가 엣지 100초 컷에 잘려 클라이언트가 JSON 대신
      # 게이트웨이 HTML 을 받고, 모든 실패가 같은 제네릭 문구 하나로 표면화된다.
      # LLM 을 호출하지 않는다(순수 함수·상수만 검증).
      - name: Verify master love codex batch budget
        run: npm run verify:master-love-codex-budget

      # 나크샤트라 결정판 — 27수 계산 결정성(크로스워크 앵커·파다·다샤)과
      # 심화 상담 계약(3덱 21섹션·분량 하한·배치 생성 락/재개·폴백 짧은 응답 차단).
      # 두 스크립트는 오래 고아 상태였다(package.json 미등록) — 여기서 CI 에 묶는다.
      - name: Verify nakshatra calculation flow
        run: npm run verify:nakshatra-flow

      - name: Verify nakshatra deep consultation flow
        run: npm run verify:nakshatra-ai-flow

      # 영구 해금 리포트 2종(지배성·다샤 인생지도) — 결정론 본문의 분량·무결성과
      # 결제 계약(해금 상태만 읽음·paymentMode 미지정·확인 실패를 미구매로 취급 금지).
      - name: Verify nakshatra premium unlock reports
        run: npm run verify:nakshatra-premium

      # 궁합 판정이 결정론을 잃거나 축 점수가 한쪽으로 쏠리면 20장이 모든 짝에게 같은 말을 한다.
      - name: Verify master love codex compat determinism
        run: npm run verify:master-love-codex-compat

      # 아래 11개도 같은 이유로 지금까지 한 번도 PR 을 막은 적이 없었다 — package.json 에만 있고
      # 어떤 워크플로에서도 실행되지 않았다. 실제로 그 공백 때문에 verify:saju-unlock-entitlement-regression
      # 은 결제창 문구가 재작성된 뒤 깨진 채로 방치됐고, 아무도 알아채지 못했다.
      # 전부 현재 통과함을 확인하고 배선한다(결제 정책 · 동시성 · 보안 · 원장 순).
      # 🔴 재작성 기간 한정 가드. worker/payments/ 로 결제를 옮기는 동안 구현이 두 벌 존재하는데,
      # 그때 가장 비싼 사고는 충돌이 아니라 **조용한 분기**다 — 구 코드에만 얹은 정책은 컷오버
      # 순간 소리 없이 사라진다. 이 레포에는 이미 그 흉터가 있다(결제창 렌더러 3벌의 TTL 이
      # 5분/15분으로 갈라진 채 배포됐고, 그걸 잡으려고 verify:payment-choice-parity 를 만들었다).
      # 막는 게 아니라 눈에 띄게 하는 장치라, 바꾸려면 매니페스트를 같은 커밋에 담기만 하면 된다.
      # 구 결제 코드가 전부 삭제되면 이 스텝도 함께 지운다.
      - name: Verify payment freeze manifest
        run: npm run verify:payment-freeze

      - name: Verify billing pass policy
        run: npm run verify:billing-pass-policy

      # 결제 POST(checkout·confirm)의 401 리프레시 복구 계약 — fetchJsonWithAuth 본문을 실제로
      # 구동해 같은 키·같은 body 1회 재전송(이중 주문 금지)과 coin-gate 제외, 확정 401 의
      # 로그인 모달 종단, PR #470 단일비행 바이패스 회귀까지 실행으로 확인한다.
      - name: Verify checkout auth recovery (executed harness)
        run: npm run verify:checkout-auth-recovery

      # 승인 후 복구 계약 — 복귀 티켓 수명(취소 분기·confirm 성공 뒤 2곳만 회수)과
      # 202 PENDING_CONFIRMATION 이 "결제가 완료되지 않았어요"(재결제 유도)로 세탁되지 않는 분기를
      # 브레이스 균형 슬라이스로 7셸+dp 에서 고정한다.
      - name: Verify direct confirm pending recovery
        run: npm run verify:direct-confirm-pending-recovery

      - name: Verify PortOne single payment regression
        run: npm run verify:portone-single-payment

      - name: Verify paid feature common flow
        run: npm run verify:paid-feature-common-flow

      - name: Verify static paid gate failsafe
        run: npm run verify:static-paid-gate-failsafe

      - name: Verify saju unlock entitlement regression
        run: npm run verify:saju-unlock-entitlement-regression

      - name: Verify profile card action policy
        run: npm run verify:profile-card-action-policy

      # 카드 보유자의 "추가" 진입점이 두 번 사라진 적이 있다(fd25c7cd9, #248). 마커로는 안 잡혀
      # jsdom 으로 실제 버튼 라벨과 편집 플래그 전이를 확인한다.
      - name: Verify profile card add entry point
        run: npm run verify:profile-card-add-entry

      # 카드 전환이 한 번에 나가고(중복 PATCH 금지), 일시 장애에 되돌아가지 않으며, 401 은 세션
      # 갱신 후 1회만 재시도하는지. 되돌림 회귀는 "카드를 눌러도 이전 프로필로 돌아간다"로 나타났다.
      - name: Verify profile current switch
        run: npm run verify:profile-current-switch

      # 🔴 명시 profileId 가 빠지면 서버가 destinyProfilesCurrentId 로 폴백해 **옛 카드에 결제**된다
      # ("이용권 있는데 결제창", "결제했는데 다른 카드에 해제"). 실제로 게이트를 열어 요청 body 를 본다.
      - name: Verify paid gate profile scope
        run: npm run verify:paid-gate-profile-scope

      # 캐시버스트 해시 merge driver 는 .gitattributes·.git/config·드라이버 스크립트 셋이 모두
      # 맞아야 돈다. 하나만 어긋나면 git 이 조용히 기본 병합으로 돌아가, 리베이스마다 해시 충돌이
      # 수백 건씩 쏟아진다(실측 240건 / 실제 내용 차이 0건).

      - name: Verify app store billing policy
        run: npm run verify:app-store-billing-policy

      - name: Verify payment concurrency guards
        run: npm run verify:payment-concurrency-guards

      - name: Verify monthly credit lots
        run: npm run verify:monthly-credit-lots

      - name: Verify worker security guards
        run: npm run verify:worker-security-guards

      # 배포 스테일 베이스 가드가 무력화되면 증상이 "배포가 그냥 잘 됨"이라 아무도 모르고,
      # 다음 사고는 남의 워커 커밋이 프로덕션에서 사라지는 형태로 온다.
      - name: Verify worker deploy base guard
        run: npm run verify:deploy-base-guard

      - name: Verify no secret leak
        run: npm run verify:no-secret-leak

      # AI 상담 가드는 어느 워크플로에도 걸려 있지 않아 조용히 낡았다 — 결제창 라벨이
      # 'AI 상담' → '전문가 상담' 으로 바뀐 뒤 ziwei·karma 가드가 오래 빨간불이었는데
      # CI 가 안 돌리니 아무도 몰랐다. 유료 상담 라우트의 가드이므로 여기서 함께 돌린다.
      - name: Verify LLM token accounting
        run: npm run verify:llm-token-usage

      - name: Verify LLM generation resilience
        run: npm run verify:llm-generation-resilience

      - name: Verify Workers AI fallback chain
        run: npm run verify:workers-ai-fallback

      - name: Verify analysis basis contract
        run: npm run verify:analysis-basis-contract

      - name: Verify astrology sectioned generation
        run: npm run verify:astrology-sectioned

      # 목록 정본은 package.json 의 verify:ai-consultation-flows 하나다. 여기에 다시 늘어놓으면
      # 배포 경로(deploy:critical)와 CI 가 서로 다른 목록을 갖게 되고, 그 드리프트가 곧
      # "CI 에서만 터지는 게이트"가 된다 — life-book 서명 가드가 정확히 그렇게 늦게 드러났다.
      - name: Verify AI consultation flows
        run: npm run verify:ai-consultation-flows

      # verify:all-paid-services-payment-flow 는 여기 넣지 않는다 — 코드 가드가 아니라 MONGO_URI
      # 실환경을 요구하는 라이브 점검이라, 시크릿 없는 PR 러너에서는 항상 실패한다.

      # 예전에는 여기서 파일 6개만 손으로 지목해 돌렸다. 그래서 나머지 48개 테스트 파일은
      # 어디서도 실행되지 않았고, ESM 목이 낡아 스위트가 통째로 죽어도(로그인 열거·무차별 대입,
      # 리프레시 재사용 탐지, 구독 자동갱신 동시성 등) 아무도 알지 못했다.
      # 전체 스위트는 26초면 끝난다 — 목록을 손으로 관리할 이유가 없다.
      - name: Run full test suite
        run: npm test
