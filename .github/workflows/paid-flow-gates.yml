name: Paid Flow Gates

# 🔴 트리거 범위는 결제 · 로그인 · 운세 로직 셋으로 좁혀 둔다(2026-08-08 사용자 지시).
# 예전에는 worker/** · app/** · js/** · src/** · __tests__/** 처럼 사실상 모든 변경이 걸려
# CSS 한 줄만 고쳐도 36개 검증기 + 전체 테스트가 돌았다. 그 비용이 게이트의 가치보다 컸다.
#
# ⚠️ 대가: 여기 없는 경로만 바꾸면 이 게이트는 깨어나지 않는다. 공용 유틸을 고쳐 결제·인증에
#    간접적으로 영향이 가는 변경은 자동으로 잡히지 않으므로, 그럴 때는 workflow_dispatch 로 직접 돌린다.
# 🔴 트리거는 pull_request 다(2026-08-11). 예전에는 push:main 이었는데, PR 기반 배포로 바뀐
# 뒤로 push:main 은 "이미 배포가 시작된 뒤"라서 게이트가 아무것도 막지 못한다.
on:
  pull_request:
    branches: [main]
    paths:
      # ── 결제 ──────────────────────────────────────────────
      - "worker/routes/billing.js"
      - "worker/routes/payments.js"
      # 신규 결제 컨텍스트. 컷오버가 끝나면 결제의 정본이 되는 곳이라, 여기가 빠져 있으면
      # 정작 살아 있는 구현을 고칠 때 결제 게이트가 깨어나지 않는다.
      - "worker/payments/**"
      # 동결 매니페스트. 구 결제 코드를 고치려면 이 파일을 같은 커밋에 담아야 하는데,
      # 그 커밋이 게이트를 깨우지 않으면 트립와이어가 울려도 아무도 듣지 못한다.
      - "config/payment-freeze.json"
      - "worker/lib/paid-feature-registry.js"
      - "worker/lib/billing-policy.js"
      # 🔴 서버가 실제로 가격을 푸는 함수(getBillingFeaturePricing)가 여기 산다. 가격표 자체가 아니라
      #    (categoryKey, subFeatureKey) → featureKey 매핑과 reason 해석 체인을 소유하는 파일이라,
      #    여기만 고치면 손금(categoryKey 로만 가격이 풀리는 유일한 React 경로)의 결제 금액이 바뀐다.
      #    그런데 트리거에 없어서 결제 게이트가 깨어나지 않았다 — 정본(셸 인라인)이 빠져 있던 것과
      #    같은 형태의 구멍이고, verify:paid-gate-price-coverage 가 이 파일을 import 해 실행한다.
      - "worker/lib/billing-feature-registry.js"
      # 위 파일이 import 하는 음원 해금 가격 정책. 같은 이유로 함께 건다.
      - "lib/music-access-policy.js"
      - "worker/lib/payment-refund.js"
      # 🔴 크론에서만 도는 **정산 실행자**다(2026-08-24 추가). reconcilePendingPayments 가
      #    settleSinglePaymentForReconcile 을 불러 실제 지급을 일으키는데, 게스트 스모크는 크론
      #    경로에 절대 도달하지 못한다. 그런데 트리거에 없어서 이 파일만 고치는 PR 은 결제 게이트가
      #    깨어나지 않았다 — billing-feature-registry 가 뒤늦게 추가된 자리와 같은 형태의 구멍이다.
      - "worker/lib/payment-reconcile-task.js"
      # 🔴 위 정산 실행자를 **부르는 곳**이다(2026-09-03 추가). scheduled() 안의 크론 분기가
      #    reconcilePendingPayments 와 runWebhookReconcileTask 를 잇고, verify:payment-reconcile 이
      #    이 파일을 열어 crons 배선과 10분 분기를 단언한다(scripts/verify-payment-reconcile.mjs:20).
      #    그런데 트리거에 없어서, 크론 배선만 고친 PR 은 결제 게이트가 깨어나지 않았다 —
      #    payment-reconcile-task.js 가 뒤늦게 추가된 자리와 같은 형태의 구멍이다.
      - "worker/index.js"
      - "worker/lib/content-unlocks.js"
      - "worker/lib/profile-limits.js"
      # 🔴 같은 구멍이 둘 더 있었다(2026-08-24 실측). verify:app-store-pricing 과 신규
      #    verify:pass-tier-policy 가 app-store-pricing.js 를 import 해 이용권 SKU 의 coinLimit 이
      #    웹 정본 PASS_LIMITS 와 같은지 대조하는데, 이 파일이 트리거에 없어 여기만 고친 PR 은
      #    게이트가 깨어나지 않았다. access-state.js 는 이용권 월 이용 한도 현황(passUsage)을
      #    스냅샷에 실어 화면이 읽는 값을 만든다 — 결제 판정과 같은 카운터를 읽는 파일이다.
      - "worker/lib/app-store-pricing.js"
      - "worker/lib/access-state.js"
      # 🔴 또 같은 짝 구멍이다(2026-08-31). access-state.js 는 위에 있는데 그 **TTL 저장소**를
      #    가른 leaf 와, 월정석 잔량 차감/복구 저장소가 빠져 있었다. verify:access-state-cache-order
      #    축 ④ 가 "잔량 캐시를 버리는 곳은 access-state 스냅샷도 버린다"를 이 두 파일에서 단언하므로,
      #    여기만 고친 PR 에서 게이트가 안 깨어나면 결제 직후 잠금 회귀가 그대로 통과한다.
      - "worker/lib/access-state-cache.js"
      - "worker/lib/monthly-credit-store.js"
      - "worker/lib/portone.js"
      # 🔴 결제 **레인**이 사는 곳이다(2026-08-12 추가). connectPaymentDb(전용 소켓 풀) ·
      #    mongoPaymentAdmission(전용 admission 레인) · withMongoRetry 의 skipSharedConnect 가
      #    전부 여기 있고, worker/payments/** 는 이 셋 위에서만 동작한다. 그런데 정작 이 파일이
      #    트리거에 없어서, 결제가 죽고 살아나는 실제 원인 파일을 고칠 때 결제 게이트가 깨어나지
      #    않았다 — 정본(셸 인라인)이 빠져 있던 것과 같은 형태의 구멍이다.
      #    2026-08-12 하루에 난 결제 사고 3건이 전부 이 파일의 변경이었다:
      #      · 2c2a16205 부팅 폭풍이 결제 소켓을 굶김  · de8c65440 콜드 아이솔레이트 이중 핸드셰이크
      #      · bbea34aed admission 포화가 checkout 을 하드 503 으로
      - "worker/lib/db.js"
      - "worker/lib/nakshatra-paid-access.js"
      # 🔴 유료 기능 접근 판정의 정본이다(canAccessPaidFeature). 논리가 여기 있는데 트리거에는
      #    없어서, 이 파일만 고친 PR 은 결제 게이트가 깨어나지 않았다 — content-unlocks.js ·
      #    access-state.js 는 이미 있는데 짝인 이것만 빠진 구멍이다(2026-08-25).
      #    verify:per-use-never-unlocks 가 이 파일을 열어 판정을 단언한다(원칙 10).
      - "worker/lib/paid-feature-access.js"
      - "worker/lib/profile-card-mutation-policy.js"
      - "worker/routes/access.js"
      # 🔴 또 같은 형태의 구멍이었다(2026-08-31). worker/lib/access-state.js 는 위에 있는데, 그
      #    스냅샷을 실제로 내보내는 라우트가 빠져 있었다. 이 라우트는 화면이 읽는 유료 판정
      #    (entitlement · passUsage · 해금 맵)의 배달 경로이고, 캐시 순서를 여기서 바꾸면 "결제했는데
      #    이용권이 안 붙는다" 가 나온다. 그런데도 이 파일만 고친 PR 은 결제 게이트가 안 깨어났다.
      - "worker/routes/access-state.js"
      - "worker/routes/profile.js"
      - "app/_lib/billing-client.ts"
      - "app/hooks/useCoinGate.ts"
      # 🔴 가격 배지 26곳이 공유하는 훅. verify:overseas-payment-notice 가 이 파일을 열어
      #    참고 개산가(formatReferenceAmount)가 결제 필드로 새지 않는지 단언한다 — 등재하지
      #    않으면 이 파일만 고친 PR 에서 해외 결제 고지 검증이 아예 돌지 않는다.
      - "app/hooks/useServerPrice.ts"
      # 🔴 이용권 상점 클라이언트. verify:billing-pass-policy 와 verify:portone-single-payment 이 이 파일을
      #    실제로 열어 검사하는데 트리거에는 없었다 — "가드가 보는 파일은 그 가드를 부르는 워크플로
      #    트리거 paths 에도 있어야 한다"(CLAUDE.md 원칙 10)를 그대로 어긴 구멍이다. 여기만 고친 PR 은
      #    이용권 결제 UI 를 바꿔도 결제 게이트가 깨어나지 않았다.
      - "app/points/PointsClient.tsx"
      # 🔴 결제용 휴대폰 번호 입력 모달의 React 렌더러. verify:payment-phone-consent 가 이 파일을
      #    열어 법정 고지(개인정보 보호법 제15조 제2항) 문구가 셸·독립 폴백과 글자 단위로 같은지
      #    단언하는데 트리거에는 없었다 — 여기만 고치면 사용자마다 다른 고지를 받게 된다.
      - "app/_lib/payment-phone-prompt.ts"
      # 🔴 같은 구멍이 하나 더 있었다(2026-08-16 실측). 이 파일은 verify:auth-session-stability 와
      #    verify:saju-unlock-entitlement-regression 이 열어 읽고 __tests__/ui/access-state-bootstrap.static.test.js
      #    가 단언하는데, 트리거에는 없어 `change-risk.mjs` 판정이 level=medium deepRequired=false 였다.
      #    짝인 js/core/access-store.js 는 아래에 있는데 이쪽만 빠져 있었다 — 둘은 같은
      #    /api/me/access-state 응답을 같은 store 로 흘려보내는 한 쌍이다.
      - "app/_lib/user-session-cache.ts"
      - "lib/payment/**"
      # 🔴 환불·청약철회 고지의 **정본**과 그 전제인 시장 정책 레지스트리.
      #    verify:payment-legal-copy 가 이 둘을 열어 읽는다 — 정본의 기한(7일)을 뽑아 사전 12벌과
      #    대조하고, "구독 해지권 없음" 전제가 뒤집히지 않았는지 확인한다. 여기가 빠져 있으면
      #    정본만 바꾼 PR 에서 게이트가 깨어나지 않아 화면과 계약이 조용히 갈라진다.
      - "lib/legal/**"
      - "lib/market-policy/**"
      - "js/core/access-store.js"
      - "js/core/pass-verdict.js"
      - "js/core/checkout-entry.js"
      # 🔴 나크샤트라 12로케일 가격 카피. verify:nakshatra-price-copy 가 이 사전과 각 화면의
      #    amountKRW 를 대조해 "화면 금액 != 승인 금액" 을 잡는다 — 카피만 고친 PR 에서
      #    가드가 안 깨어나면 그 대조가 통째로 빠진다.
      - "app/nakshatra/**"
      - "js/core/payment-service.js"
      - "js/core/feature-pricing-store.js"
      # 🔴 홈 탐색기(#cdFinder)가 만드는 추천 카드는 유료 기능으로 가는 두 번째 입구다.
      #    그 카드의 유료 표식(data-pvw-paid)과 featureKey 배선이 여기서 정해지는데, 두 파일이
      #    트리거에 없어 "finder 만 고친 PR" 은 결제 게이트를 하나도 깨우지 못했다(2026-09-01).
      #    표식을 잘못 붙이면 이용권 상점(/points) 앵커까지 가로채 앱에서 금지된 프로그래매틱
      #    이동이 된다 — verify:home-service-registry 가 그 대조를 갖고 있다.
      - "js/core/home-service-finder.js"
      - "js/core/service-registry.js"
      - "public/js/core/home-service-finder.js"
      - "public/js/core/service-registry.js"
      - "js/destiny-profile.js"
      # 미러도 함께 건다 — verify:payment-choice-parity 가 이 사본을 실제로 열어 검사한다.
      - "public/js/destiny-profile.js"
      # 🔴 verify:per-use-never-unlocks 가 여는 파일들(2026-08-25 추가). 그 가드는 결제 성공
      #    이벤트를 jsdom 에서 실제로 흘려 "회당 결제가 해금 맵에 들어가는가"를 전수로 본다.
      #    미러(public/js/core/payment-service.js)도 함께 검사하므로 정본만 걸어 두면 미러만
      #    어긋난 PR 에서 가드가 깨어나지 않는다 — destiny-profile 미러를 건 이유와 같다.
      - "public/js/core/payment-service.js"
      # 🔴 이집트 신탁의 결제 호출부. featureKey 를 넘기지 않으면 비한국어 로케일에서 빈 키가 되어
      #    가격·회당결제 판정이 통째로 어긋난다 — 위 가드가 이 파일을 열어 단언한다.
      - "js/oracle-kcg.js"
      - "public/js/oracle-kcg.js"
      # 🔴 아래 셋은 cd:auth-changed 리스너를 갖고 있어 verify:auth-changed-coverage 의 스캔 대상이다.
      # 가드가 검사하는데 트리거에 없으면 "그 파일만 고친 PR 에서는 가드가 안 도는" 구멍이 된다
      # (index-inline-runtime 은 verify:auth-event-loop 가 이미 검사하고 있었는데도 빠져 있었다).
      # 그 정합성은 이제 verify:auth-changed-coverage 가 기계로 강제한다.
      # 🔴 유료 타일의 **진입 자체**를 좌우한다(2026-08-14 추가). 고스트 클릭 억제가
      #    상세 팝업 CTA 의 진입 클릭을 삼켜 유료 기능 13종이 전부 "눌러도 무반응"이었는데,
      #    이 파일이 트리거에 없어 결제 게이트가 깨어나지 않았다(PR #625).
      - "js/mobile-interaction-patch.js"
      - "js/core/index-inline-runtime.js"
      - "js/saju-engine.js"
      - "js/share.js"
      # ── 정적 셸 (결제수단 선택 모달 **정본**) ───────────────
      # 🔴 결제창 렌더러는 3종이지만 정본은 셸 인라인 하나다(`_cdChooseServicePaymentMode`,
      #    CSS 는 `_cdEnsureDirectPaymentStyles`). 나머지 두 렌더러(app/_lib/billing-client.ts ·
      #    js/destiny-profile.js)는 위에 이미 있는데 정작 정본이 빠져 있었다 — 셸에서 이용권
      #    카드를 지우거나 3옵션 문구를 바꿔도 verify:payment-choice-parity 가 깨어나지 않았다.
      #    change-risk 는 index.html 을 low 로 보므로(콘텐츠 셸이기도 하다) PR CI 티어는 fast 로
      #    남는다. 결제 검증만 여기서 따로 깨운다 — 셸 문구 한 줄에 전체 회귀를 돌리지 않기 위함이다.
      - "index.html"
      - "public/index.html"
      - "public/en/index.html"
      - "public/ja/index.html"
      - "public/zh/index.html"
      - "public/zh-tw/index.html"
      - "public/static/index.html"
      # ── 결제창 문구 사전 ───────────────────────────────────
      # 🔴 verify:payment-choice-parity 는 결제창 키 39개가 12개 로케일 전부에 값이 있는지,
      #    그리고 각 렌더러의 ko 폴백이 ko.json 과 같은지를 이 파일들을 **열어서** 단언한다.
      #    여기가 빠져 있으면 사전에서 결제창 문구를 지우거나 바꿔도 게이트가 깨어나지 않는다
      #    — 정본 셸이 트리거에 없던 것과 같은 형태의 구멍이다.
      - "public/i18n/**"
      # ── 로그인 / 인증 ──────────────────────────────────────
      - "worker/routes/auth.js"
      - "worker/lib/auth.js"
      - "app/_lib/auth-client.ts"
      - "app/_lib/auth-store.ts"
      # 로그인·가입 UI. 가입 성공 시 프로필 카드용 1회성 힌트를 남기는 곳이라, 여기가 빠져 있으면
      # 힌트를 로그인 경로에 잘못 옮기거나 키를 바꿔도 verify:profile-fresh-signup 이 깨어나지 않는다.
      - "app/components/auth/AuthShell.tsx"
      # 앱 소셜 로그인 딥링크 계약(verify:oauth-app-handoff)이 읽는 4면. 가드가 보는 파일은
      # 트리거에도 있어야 한다(CLAUDE.md 원칙 10) — 없으면 스킴을 바꿔도 게이트가 안 깨어난다.
      - "scripts/app-native-bridge.js"
      - "apps/mobile/android/app/src/main/java/com/codedestiny/app/CodeDestinyNavigationPlugin.java"
      - "apps/mobile/android/app/src/main/AndroidManifest.xml"
      # ── 운세 로직 ─────────────────────────────────────────
      - "worker/routes/fortune.js"
      - "worker/routes/*-ai.js"
      # 🔴 출생 순간의 UTC 오프셋(서머타임 포함)을 여기서 푼다. 틀리면 상승궁·하우스가 통째로
      #    밀리는데 응답은 정상으로 보인다. __tests__/worker/astro-timezone-dst.test.js 가
      #    이 파일을 실행해 검사하므로 트리거에도 있어야 한다(CLAUDE.md 원칙 10).
      - "worker/routes/astro.js"
      # 🔴 자미두수 상담의 명반 계산·프롬프트 템플릿은 worker/lib 에 있는데 이 트리거에는
      #    worker/routes/*-ai.js 만 있었다. 궁간·대한사화·자화·소한처럼 상담 정확도를 결정하는
      #    값이 전부 ziwei-ai-chart.js 에서 나오므로, 그 파일만 고친 PR 이 이 게이트를
      #    (verify:ai-consultation-flows · verify:analysis-basis-contract ·
      #    verify:llm-generation-resilience) 통째로 못 깨우고 있었다(CLAUDE.md 원칙 10).
      - "worker/lib/ziwei-ai-*"
      - "lib/ziwei-minor-limit.js"
      - "lib/ziwei-fire-bell.js"
      - "worker/lib/gemini.js"
      - "worker/lib/gemini-client.js"
      - "worker/lib/structured-consultation.js"
      # 🔴 CMS 모델 파라미터 오버라이드의 클램프(verify:llm-generation-resilience 가 이 파일을 열고
      #    import 해서 밴드를 단언한다). 클램프가 풀리면 관리자 오타 한 번이 유료 생성을 잘린 결과나
      #    타임아웃으로 만드는데, 트리거에 없으면 이 파일만 고친 PR 에서 게이트가 안 깨어난다.
      - "worker/lib/cms-prompts.js"
      - "worker/lib/llm-cache-store.js"
      - "lib/llm-client.ts"
      # 🔴 verify:vedic-ai-flow 가 이 파일들을 열어 client contract(문구·aria-label·API 경로)를
      #    단언하는데 트리거에는 없었다(2026-08-21, PR #924 i18n 로케일화가 aria-label 을
      #    literal 문자열에서 copy.pdfButtonAriaLabel 참조로 바꾸면서 이 가드를 깨뜨렸는데, PR CI 는
      #    깨어나지 않고 main push 후에야 실패해 5개 후속 PR 의 Paid Flow Gates 를 연쇄로 물들였다).
      - "app/vedic-ai/**"
      # ── 융합운세(초융합 상담) — 유료 기능(fusion-fortune-consultation, 30,000원) ──
      # 🔴 2026-08-22 실측: PR #940(i18n)이 app/fusion-fortune/** 를 고쳤는데 트리거에 없어
      #    __tests__/ui/fusion-fortune.static.test.js 를 도는 npm test 가 PR 에서 스킵됐고,
      #    머지 후 push:main 건강신호에서만 실패가 드러났다 — 바로 위 vedic-ai(PR #924, 하루 전)와
      #    동일한 모양의 사고다. 게다가 이 실패는 deploy-safe.mjs 의 회귀 테스트 관문도
      #    같이 막아 스테이징 배포 자체가 BLOCKED 됐다(건강신호가 아니라 실제 배포 정지).
      - "app/fusion-fortune/**"
      - "worker/lib/fusion-fortune*.js"
      - "worker/routes/fusion-fortune.js"
      # ── 휴먼 디자인 — 유료 기능(human-design-chart, 10,000원) ──
      # 🔴 결정론 계산 자체가 상품이라 엔진·천체 어댑터·fixture 가 전부 게이트 대상이다.
      #    verify:human-design 이 이 파일들을 **열어서** 읽으므로(CLAUDE.md 원칙 10),
      #    여기 없으면 엔진만 고친 PR 에서 가드가 깨어나지 않는다.
      - "lib/human-design/**"
      - "worker/lib/human-design-*.js"
      - "worker/lib/iana-offset.js"
      # 🔴 정확 일치라 human-design-report.js 가 안 걸린다 — 글롭으로 둘 다 덮는다.
      - "worker/routes/human-design*.js"
      - "app/human-design/**"
      - "__tests__/fixtures/human-design/**"
      - "scripts/verify-human-design*.mjs"
      - "scripts/human-design-fixture-snapshot.mjs"
      # 🔴 조판 엔진(typeset-metrics/writer)은 휴먼 디자인 리포트와 초융합 PDF 가 함께 쓴다.
      #    verify:human-design-report 가 그 파일들을 **열어서** 초융합 공개 시그니처 유지와
      #    조판 규격 고정을 단언하므로, 여기 없으면 lib/pdf 만 고친 PR 에서 가드가 안 깨어난다.
      - "lib/pdf/**"
      # ── 타로 오라클 상담 — 유료 기능(카드 수 구간별 tarot-prompt-maker{,-standard,-deep,-master}, 회당 3,000~10,000원) ──
      # 🔴 2026-08-21 에 로컬 템플릿 빌더(buildOraclePrompt)에서 Gemini 실호출로 바뀌면서
      #    과금 유형이 영구 해금 → 회당으로 뒤집힌 기능이다. verify:oracle-consultation 이
      #    lib/tarot/oracle-consultation.mjs 를 **import 해서 실행**하므로 트리거에도 있어야
      #    한다(CLAUDE.md 원칙 10). 아래 scripts/verify-*paid*.mjs 등 와일드카드에는 이 검증기
      #    파일명이 걸리지 않으므로 따로 적는다.
      - "lib/tarot/**"
      - "worker/routes/tarot.js"
      - "app/tarot/prompt-maker/**"
      - "scripts/verify-oracle-consultation.mjs"
      #    verify:oracle-consultation-fallback 은 Workers AI 폴백 배선을 **실행해서** 본다.
      #    그래서 어댑터와 그 아래 정본 체인이 바뀌어도 이 잡이 깨어나야 한다.
      - "scripts/verify-oracle-consultation-fallback.mjs"
      - "worker/lib/tarot-oracle-llm.js"
      - "worker/lib/structured-consultation.js"
      - "worker/lib/gemini.js"
      - "lib/llm-client.ts"
      # ── 작명 AI — 유료 기능(premium-naming-prompt, 30,000원) ──
      # 🔴 verify:naming-prompt 를 2026-08-25 에 배선하면서 함께 넣는다(CLAUDE.md 원칙 10 —
      #    가드가 보는 파일은 그 가드를 부르는 워크플로 트리거 paths 에도 있어야 한다).
      #    그 가드는 worker/routes/naming-prompt.js 와 worker/lib/naming-*.js 를 열어 프롬프트
      #    배선·로케일 프로파일 전수를 단언하고, ko 프롬프트를 렌더해 골든 스냅샷과 바이트로
      #    대조한다. 아래 scripts/verify-*paid*.mjs 등 와일드카드에는 이 검증기 파일명이 걸리지
      #    않으므로 따로 적는다.
      - "worker/routes/naming-prompt.js"
      - "worker/lib/naming-*.js"
      - "app/naming-ai/**"
      - "__tests__/worker/__fixtures__/naming-prompt.ko.golden.txt"
      - "scripts/verify-naming-prompt-flow.mjs"
      # ── 연이 운명 상담(fortune-chat) — 무료 3회 이후 회당 5,000원 ──
      # verify:fortune-chat-reading 이 guardian-fortune-* 를 import 해 실제로 구동한다(mock 주입).
      - "worker/routes/fortune-chat.js"
      - "worker/lib/guardian-fortune*.js"
      - "scripts/verify-fortune-chat-reading.mjs"
      # ── 무료 베다점 해석 품질 ──
      # verify:vedic-basic-quality 가 이 셸의 인라인 엔진을 jsdom 으로 구동한다. app/vedic-ai/**
      # (유료 심화)와는 다른 파일이라 위 항목으로는 덮이지 않는다.
      - "vedic-astrology.html"
      - "public/vedic-astrology.html"
      - "scripts/verify-vedic-basic-quality.mjs"
      # ── 나크샤트라 심화 상담(nakshatra-ai) — 결과 PDF 배선 포함 ──
      # verify:nakshatra-ai-flow 의 파일명은 아래 와일드카드(*billing*·*paid* 등)에 걸리지
      # 않으므로 따로 적는다(CLAUDE.md 원칙 10). 가드가 읽는 app/nakshatra/** 와
      # worker/routes/*-ai.js 는 이미 위 항목들에 있다.
      - "scripts/verify-nakshatra-ai-flow.mjs"
      # ── 게이트 자신 ───────────────────────────────────────
      # 🔴 스위트 목록의 정본 파일. 여기가 빠져 있으면 목록에 가드를 더하거나 빼는 PR 이
      #    정작 이 게이트를 깨우지 않는다.
      # ── 유료 서비스 구조화 데이터(schema.org Offer) ──────────────────────
      # 🔴 Offer 의 가격은 검색결과에 그대로 실리는데 **화면 어디에도 증상이 없다** —
      #    결제창은 서버 가격을 쓰고 검색결과만 옛 값을 말해도 아무도 눈치채지 못한다.
      #    verify:paid-service-offer 가 이 파일들을 열어 featureKey↔결제 상수와 가격표를
      #    대조하므로 트리거에도 있어야 한다(CLAUDE.md 원칙 10).
      - "lib/seo/paid-offer.ts"
      - "lib/structured-data.ts"
      - "app/ziwei-ai/**"
      - "app/karma-destiny-ai/**"
      - "app/love-secret-ai/**"
      - "app/new-year-ai-consultation/**"
      - "app/sukuyo-compatibility-ai/**"
      - "app/naming-ai/**"
      - "app/master-love-codex/**"
      # 마스터 인연의 서는 결제 상수를 app/ 이 아니라 feature 모듈에 둔다. 가드가 그 파일을
      # 열어 Offer 의 featureKey 와 대조하므로 트리거에도 있어야 한다(CLAUDE.md 원칙 10).
      - "src/features/master-love-codex/constants.ts"
      - "scripts/run-paid-gate-suite.mjs"
      - "scripts/verify-fusion-fortune-quality.mjs"
      - "scripts/verify-fusion-fortune-delivery-floor.mjs"
      - "scripts/verify-fusion-fortune-retry-payload.mjs"
      - "lib/fusion-paid-request-store.js"
      # 🔴 아래 와일드카드(*billing*·*paid*·*pass*·*payment*·*auth*)에 이 파일명이 걸리지 않는다.
      - "scripts/verify-per-use-never-unlocks.mjs"
      - "scripts/verify-krw-copy-canonical.mjs"
      - "scripts/verify-*billing*.mjs"
      - "scripts/verify-*paid*.mjs"
      - "scripts/verify-*pass*.mjs"
      - "scripts/verify-*payment*.mjs"
      - "scripts/verify-*auth*.mjs"
      - "scripts/verify-profile-card-*.mjs"
      - "scripts/verify-security-hardening.mjs"
      - "scripts/verify-worker-security-guards.mjs"
      - ".github/workflows/paid-flow-gates.yml"
  # 🔴 main 건강 신호 (2026-08-16 추가). 게이트가 아니라 알림이다 — 배포를 막지 않는다.
  #    이 게이트의 가드는 트리거 paths 밖 파일도 읽는다(예: verify:nakshatra-premium 은 규약 문서를
  #    읽는다). 그래서 paths 에 안 걸리는 PR 이 가드를 깨뜨린 채 머지될 수 있고, 실제로 그렇게 됐다:
  #    PR #678(CLAUDE.md 분할)은 이 워크플로를 깨우지 않은 채 머지됐고, 80분 뒤 무관한 두 브랜치가
  #    같은 스텝에서 동시에 죽었다. paths 를 넓히면 2026-08-08 에 일부러 좁힌 트리거가 되살아나므로,
  #    넓히는 대신 **머지된 main 을 직접 한 번 본다.** 낡은 가드를 다음 PR 작성자가 아니라 머지한
  #    사람이 즉시 본다.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 🔴 경로 트리거만으로는 "결제를 실제로 건드렸는가"를 구분할 수 없다.
  #    index.html 은 결제창 정본이면서 홈 콘텐츠 셸이고, js/core/index-inline-runtime.js 는
  #    sync:public 이 캐시키만 재생성해도 변경으로 잡힌다 — 그래서 팝업 문구 한 줄에도
  #    36개 검증기가 통째로 돌았다(사용자 지적, 2026-08-14).
  #    판정은 diff 내용으로 하고, 재료는 전부 정본에서 가져온다(change-risk · 이 YAML 의 paths ·
  #    셸의 결제 모달 구간). 못 구하면 돌린다(fail-closed).
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Decide whether the paid gates are needed
        id: decide
        run: node scripts/resolve-paid-gate-scope.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

  paid-flow-gates:
    needs: scope
    # 값이 없거나 판정이 실패하면 돌린다 — 건너뛰는 것은 run=false 를 명시적으로 받았을 때뿐이다.
    if: needs.scope.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 🔴 귀책 판정용. 러너가 실패한 가드만 merge-base 워크트리에서 다시 돌려
          #    "main 이 이미 빨간불" 과 "이 PR 이 깨뜨렸다" 를 가른다. 얕은 체크아웃이면
          #    base 커밋이 없어 판정이 통째로 fail-closed(전부 이 PR 책임)로 접힌다.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 🔴 스위트 목록의 정본은 scripts/run-paid-gate-suite.mjs 한 벌이다. 여기에 스텝을 다시
      #    늘어놓지 않는다 — 예전에는 48개 스텝이 순차라 (a) 첫 실패에서 멈춰 깨진 가드가 2개면
      #    왕복이 2번이었고 (b) 실패가 이 PR 탓인지 main 탓인지 구분할 방법이 없었다.
      #    verify:guard-wiring 은 이 YAML → 러너 파일 → npm run 이름 순으로 간선을 따라가므로
      #    48개 가드의 배선은 그대로 계산된다.
      - name: Run paid flow gate suite
        run: node scripts/run-paid-gate-suite.mjs --base "${{ github.event.pull_request.base.sha }}"
