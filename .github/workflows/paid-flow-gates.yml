name: Paid Flow Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      # 테스트 전체를 돌리므로 테스트·러너 설정 변경도 트리거에 넣는다.
      # (예전엔 __tests__/worker/** 만 있어서, 다른 테스트가 죽어도 CI 가 깨어나지 않았다.)
      - "__tests__/**"
      - "jest.config.cjs"
      - "app/**"
      - "lib/**"
      - "index.html"
      - "public/index.html"
      - "public/en/index.html"
      - "public/ja/index.html"
      - "public/zh/index.html"
      - "public/static/index.html"
      # 결제 게이트 정합성 검증기가 읽는 프론트 소스 (destiny-profile·saju-engine·타로 경험 등)
      - "js/**"
      - "PhysiognomyUI.js"
      - "scripts/verify-runtime-cache-sync.mjs"
      - "scripts/verify-paid-feature-billing-policy.mjs"
      - "scripts/verify-ai-prompt-billing-policy.mjs"
      - "package.json"
      - ".github/workflows/paid-flow-gates.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      # 테스트 전체를 돌리므로 테스트·러너 설정 변경도 트리거에 넣는다.
      # (예전엔 __tests__/worker/** 만 있어서, 다른 테스트가 죽어도 CI 가 깨어나지 않았다.)
      - "__tests__/**"
      - "jest.config.cjs"
      - "app/**"
      - "lib/**"
      - "index.html"
      - "public/index.html"
      - "public/en/index.html"
      - "public/ja/index.html"
      - "public/zh/index.html"
      - "public/static/index.html"
      - "js/**"
      - "PhysiognomyUI.js"
      - "scripts/verify-runtime-cache-sync.mjs"
      - "scripts/verify-paid-feature-billing-policy.mjs"
      - "scripts/verify-ai-prompt-billing-policy.mjs"
      - "package.json"
      - ".github/workflows/paid-flow-gates.yml"

permissions:
  contents: read

jobs:
  paid-flow-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime cache sync
        run: npm run verify:runtime-cache-sync

      - name: Verify paid feature billing policy
        run: npm run verify:paid-feature-billing-policy

      - name: Verify AI prompt billing policy
        run: npm run verify:ai-prompt-billing-policy

      # 결제수단 선택창은 렌더러가 3종(정적 셸 6미러 / React / 독립 폴백)이라 한쪽만 고치면
      # 진입 경로에 따라 다른 결제창이 뜬다. 정본 CSS·구조 마커·3옵션 노출이 어긋나면 차단한다.
      - name: Verify payment choice modal parity
        run: npm run verify:payment-choice-parity

      # 재밌는 사주 콘텐츠 타일: 상세 팝업이 결제보다 먼저 뜨는지 + 해금 후 CTA 가 카드를
      # 열었다 닫지 않는지(이중 처리). 실제 클릭 재현은 verify:rpt-preview-cta(크롬 필요)가 맡고,
      # 여기서는 6미러 불변식만 본다.
      - name: Verify saju fun-content preview gate
        run: npm run verify:saju-fun-content-gate

      # 정적 마커로는 "캡처 리스너 둘이 같은 클릭을 각각 처리한다"를 못 잡는다(이번 회귀가 그 증거).
      # 실제 크롬으로 클릭을 쏴서 토글 호출 횟수를 센다. 러너 이미지에 Chrome 이 포함돼 있다.
      - name: Verify rpt preview CTA flow (real Chrome)
        run: npm run verify:rpt-preview-cta

      # 예전에는 여기서 파일 6개만 손으로 지목해 돌렸다. 그래서 나머지 48개 테스트 파일은
      # 어디서도 실행되지 않았고, ESM 목이 낡아 스위트가 통째로 죽어도(로그인 열거·무차별 대입,
      # 리프레시 재사용 탐지, 구독 자동갱신 동시성 등) 아무도 알지 못했다.
      # 전체 스위트는 26초면 끝난다 — 목록을 손으로 관리할 이유가 없다.
      - name: Run full test suite
        run: npm test
