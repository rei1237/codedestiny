      # 그대로 실리고 유명인 사주 서비스가 정규식으로 되받아 다듬기까지 해서, 조사가 틀어지면
      # 다듬기가 빗나가 원문이 노출된다. 엔진만 고치면 티어가 standard 라 critical 잡에 두면
