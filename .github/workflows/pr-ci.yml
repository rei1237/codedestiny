name: PR CI

# main 으로 가는 모든 변경이 통과해야 하는 관문이다. 프로덕션 배포는 이 워크플로가 아니라
# main 머지 이후 "Release Cloudflare Pages and Worker" 가 수행한다 — 여기서는 아무것도 배포하지 않는다.
#
# 🔴 검사 강도는 **변경된 파일 경로**로 정한다. 모든 PR 에 같은 검사를 돌리면 CSS 한 줄 고치는 데
#    전체 회귀를 기다리게 되고, 그러면 게이트를 우회할 방법을 찾게 된다. 반대로 전부 가볍게 하면
#    결제·인증이 무방비가 된다. 판정은 scripts/resolve-ci-tier.mjs 가 하고, 그 정본은
#    scripts/lib/change-risk.mjs 하나다(배포 파이프라인도 같은 모듈을 쓴다).
#
#      fast     — 문구·CSS·이미지·문서            → typecheck · lint
#      standard — 일반 프론트엔드(app/components/js) → + build
#      critical — 결제·인증·Worker·DB·배포설정      → + 전체 테스트 · 배포 가드 · 자동 Preview
#
# 🔴 세 잡 모두 **항상 실행**된다. 티어에 따라 건너뛰는 것은 잡이 아니라 그 안의 스텝이다.
#    잡 자체를 if 로 막으면 브랜치 룰셋의 필수 체크가 보고를 받지 못해 머지가 영영 막힌다.
#    건너뛴 잡은 30초 안에 끝나므로 비용은 사실상 러너 기동 시간뿐이다.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  classify:
    name: Risk tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      runs_build: ${{ steps.tier.outputs.runs_build }}
      runs_critical: ${{ steps.tier.outputs.runs_critical }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 의존성이 필요 없는 순수 모듈이라 npm ci 를 돌리지 않는다.
      #
      # CD_FORCE_CRITICAL 은 `full-ci` 라벨로 티어를 끌어올리는 탈출구다. 경로만으로는 안 잡히는
      # 변경(예: 정적 셸 index.html 안의 결제 모달 수정)을 사람이 알고 있을 때 쓴다. 라벨은
      # 올리는 방향으로만 작동한다 — 내리는 길을 만들면 게이트를 끄는 버튼이 된다.
      - name: Resolve verification tier from changed paths
        id: tier
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CD_FORCE_CRITICAL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          node scripts/lib/change-risk.mjs --self-test
          node scripts/resolve-ci-tier.mjs --self-test
          node scripts/resolve-ci-tier.mjs

  fast:
    name: Typecheck and lint
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  build:
    name: Build Pages and Worker
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Skip notice
        if: needs.classify.outputs.runs_build != 'true'
        run: echo "::notice::tier=${{ needs.classify.outputs.tier }} — 빌드를 건너뜁니다(문구·CSS·이미지·문서 변경)."

      - name: Checkout PR head
        if: needs.classify.outputs.runs_build == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.classify.outputs.runs_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.runs_build == 'true'
        run: npm ci

      # build:cf 의 postbuild 가 out/ 을 읽어 AdSense 콘텐츠 게이트를 돌린다. 빌드가 끝나야만
      # 도는 검사라 여기서 함께 잡는다 — 배포 직전에 처음 알게 되면 릴리스가 통째로 막힌다.
      - name: Build Cloudflare Pages output
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run build:cf

      # 번들 1MB 제한과 문법 오류를 업로드 없이 잡는다(--dry-run 은 아무것도 올리지 않는다).
      - name: Build Worker bundle (dry run)
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run build:worker

      - name: Verify Worker size budget
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:worker-size

  critical:
    name: Critical checks
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip notice
        if: needs.classify.outputs.runs_critical != 'true'
        run: echo "::notice::tier=${{ needs.classify.outputs.tier }} — 결제·인증·Worker·DB·배포설정 경로가 걸리지 않아 전체 테스트와 배포 가드를 건너뜁니다."

      - name: Checkout PR head
        if: needs.classify.outputs.runs_critical == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.classify.outputs.runs_critical == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm ci

      # 전체 스위트는 60초 안팎이다. 파일 목록을 손으로 관리하면 새 테스트가 조용히
      # 실행되지 않는 상태로 남는다(2026-08 에 48개 파일이 그랬다).
      - name: Test
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm test

      # 배포 파이프라인 자체의 회귀. 이 가드가 죽으면 증상이 "배포가 그냥 잘 됨"이라
      # 아무도 모르고, 다음 사고는 프로덕션에서 코드가 사라지는 형태로 온다.
      - name: Verify release pipeline contract
        if: needs.classify.outputs.runs_critical == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run verify:deploy-safe
          npm run verify:pages-single-deploy-guard
          npm run verify:worker-single-deploy
          npm run verify:pages-worker-parity-test
          npm run verify:deployed-sha -- --self-test

      - name: Verify ads.txt is present
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm run verify:ads-txt

      - name: Scan for leaked secrets
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm run verify:no-secret-leak
