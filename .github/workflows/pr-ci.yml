name: PR CI

# main 으로 가는 모든 변경이 통과해야 하는 관문이다. 프로덕션 배포는 이 워크플로가 아니라
# main 머지 이후 "Release Cloudflare Pages and Worker" 가 수행한다 — 여기서는 아무것도 배포하지 않는다.
#
# 🔴 검사 강도는 **변경된 파일 경로**로 정한다. 모든 PR 에 같은 검사를 돌리면 CSS 한 줄 고치는 데
#    전체 회귀를 기다리게 되고, 그러면 게이트를 우회할 방법을 찾게 된다. 반대로 전부 가볍게 하면
#    결제·인증이 무방비가 된다. 판정은 scripts/resolve-ci-tier.mjs 가 하고, 그 정본은
#    scripts/lib/change-risk.mjs 하나다(배포 파이프라인도 같은 모듈을 쓴다).
#
#      fast     — 문구·CSS·이미지·문서            → typecheck · lint
#      standard — 일반 프론트엔드(app/components/js) → + build
#      critical — 결제·인증·Worker·DB·배포설정      → + 전체 테스트 · 배포 가드 · 자동 Preview
#
# 🔴 세 잡 모두 **항상 실행**된다. 티어에 따라 건너뛰는 것은 잡이 아니라 그 안의 스텝이다.
#    잡 자체를 if 로 막으면 브랜치 룰셋의 필수 체크가 보고를 받지 못해 머지가 영영 막힌다.
#    건너뛴 잡은 30초 안에 끝나므로 비용은 사실상 러너 기동 시간뿐이다.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

jobs:
  classify:
    name: Risk tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      runs_build: ${{ steps.tier.outputs.runs_build }}
      runs_critical: ${{ steps.tier.outputs.runs_critical }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 의존성이 필요 없는 순수 모듈이라 npm ci 를 돌리지 않는다.
      #
      # CD_FORCE_CRITICAL 은 `full-ci` 라벨로 티어를 끌어올리는 탈출구다. 경로만으로는 안 잡히는
      # 변경(예: 정적 셸 index.html 안의 결제 모달 수정)을 사람이 알고 있을 때 쓴다. 라벨은
      # 올리는 방향으로만 작동한다 — 내리는 길을 만들면 게이트를 끄는 버튼이 된다.
      - name: Resolve verification tier from changed paths
        id: tier
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CD_FORCE_CRITICAL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          node scripts/lib/change-risk.mjs --self-test
          node scripts/resolve-ci-tier.mjs --self-test
          node scripts/resolve-ci-tier.mjs

  # 🔴 스택 PR 을 부모(→main)부터 머지하면 자식의 머지 커밋은 목적지를 잃은 브랜치로 들어간다.
  # GitHub 은 자식을 "Merged" 로 칠하지만 그 커밋은 main 의 조상이 아니고, 아무 신호도 남지
  # 않는다. 전수조사에서 그렇게 좌초한 PR 이 9건 나왔고 복구 PR 을 세 번 만들었다(#591·#593·#600).
  # 사고는 전부 부모가 자식보다 12~16초 먼저 머지되며 일어났다 — 사람이 조심해서 막을 간격이 아니다.
  #
  # 그래서 순서를 기계로 고정한다: 자식이 열려 있는 동안 부모는 머지되지 않는다. 스택은 바닥
  # 브랜치에 전부 쌓인 뒤 main 으로 한 번에 들어가므로 경합 구간 자체가 사라진다.
  #
  # 자식을 부모 브랜치에 머지하면 그것이 곧 부모 PR 의 head 갱신이라 부모 PR 에 synchronize 가
  # 발생해 이 검사가 자동으로 다시 돈다. 자식을 머지 없이 닫았을 때만 수동 재실행이 필요하다.
  #
  # classify 에 의존하지 않는다 — 티어와 무관하게 항상 돌아야 하고, 먼저 끝날수록 좋다.
  landing-order:
    name: Landing order
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to merge a parent before its stacked children
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${PR_HEAD_REF:-}" ]; then
            echo "::notice::PR 컨텍스트가 없어 착지 순서를 검사하지 않습니다."
            exit 0
          fi
          children=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${PR_HEAD_REF}&per_page=100" \
            --jq '.[] | "  - #\(.number) \(.title)"')
          if [ -z "$children" ]; then
            echo "이 브랜치(${PR_HEAD_REF})를 base 로 하는 열린 PR 이 없습니다. 지금 머지해도 좌초하지 않습니다."
            exit 0
          fi
          echo "::error::이 PR 을 먼저 머지하면 아래 PR 들의 머지 커밋이 main 에 도달하지 못합니다. 아래를 먼저 머지하세요."
          echo "$children"
          exit 1

  fast:
    name: Typecheck and lint
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 은 아래 `lint:changed` 가 base...head 를 계산하기 위해 필요하다.
      # 얕은 체크아웃에서는 base 커밋이 없어 diff 가 통째로 비고, 그러면 이 게이트가
      # 조용히 아무 파일도 검사하지 않는 상태가 된다.
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 🔴 `npm run lint` 는 `next lint` 이고 `pages/ app/ components/ lib/ src/` 만 본다.
      # 머지 후 배포(scripts/deploy-safe.mjs 의 "changed-file lint")는 **변경 파일 전부**에
      # eslint 를 직접 건다 — `__tests__/ scripts/ worker/ js/` 까지. 두 범위가 다르면 PR 은
      # 초록불로 머지되고 스테이징 배포가 린트로 죽는데, 사람에게 보이는 마지막 에러는 그
      # 다음 스텝의 "SHA 불일치" 하나뿐이라 원인이 가려진다
      # (2026-08-22 run 32584789263: __tests__/worker/fpti-deep-report.quality.test.js).
      # 대상 선정 정본은 scripts/lib/lint-targets.mjs 이고 배포도 같은 모듈을 쓴다.
      - name: Lint changed files exactly as the release does
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run lint:changed -- --self-test
          npm run lint:changed

      # 🔴 `test:node` 는 `__tests__/ui/*.test.js` 정적 가드다. jest 는 이것을 돌리지 않고,
      # PR CI 에서는 critical 티어(`npm test`)에서만 돌았다. 그런데 deploy-safe 는 risk=medium
      # 부터 돌린다 — 즉 app/·components/·js/ 만 고친 standard 티어 PR 은 **머지된 뒤에야**
      # 이 검사를 처음 받는다. 2026-08-22 PR #940 이 정확히 그 경로로 통과해 머지되고
      # 스테이징 배포를 3연속 실패시켰다(fusion-fortune.static.test.js 3건).
      #
      # fast 잡에 두는 이유: 이 가드들의 입력은 index.html·js/·styles/ 라 티어가 fast 로
      # 잡히는 변경에서도 깨어나야 한다. 실측 13.7초 / 296 tests (2026-08-23).
      - name: Run the static UI guards the release runs
        run: npm run test:node

      # 🔴 이것은 **fast 잡**이어야 한다. 사이트맵을 어긋나게 만드는 것은 라우트 추가만이
      # 아니라 글 한 편, 공용 컴포넌트 한 줄이다(lastmod 서명이 소스 파일에서 나온다).
      # build 잡에 두면 티어가 fast 로 잡히는 문구·콘텐츠 변경에서 깨어나지 않는데, 그게 정확히
      # 지키려는 경로다. 빌드 산출물을 읽지 않고 소스와 추적본만 비교하므로 몇 초면 끝난다.
      #
      # 왜 필요한가 (2026-08-24 하루에 세 번): 라우트·콘텐츠를 바꾼 PR 이 사이트맵을 함께
      # 갱신하지 않아 ①#1076 의 /ziwei/chart 가 추적본에서 빠진 채 머지돼 헤딩 가드가 그
      # 라우트를 건너뛰었고 ②낡은 추적본으로 검증한 #1079 가 CI 에서 터졌으며 ③#1099 가
      # lastmod 52개를 낡은 채로 남겼다. 기존 verify:sitemap 은 배포 워크플로에만 있어
      # 전부 머지 뒤에야 알 수 있었다.
      - name: Verify the tracked sitemap matches its sources
        run: npm run verify:sitemap-drift

      # 🔴 이 두 가드는 **fast 잡**에 있어야 한다. 입력이 CSS·정적 셸·package.json 이라
      # build/critical 잡에 두면 `styles/mobile-lite.css` 한 줄 수정에는 깨어나지 않는데,
      # 그게 정확히 지키려는 경로다. 둘 다 node 내장 모듈만 쓰는 정적 파일 읽기라 1초 미만이다.
      - name: Verify mobile detail wrapper is non-intrusive
        run: npm run verify:mobile-detail-nonintrusive

      # 🔴 이것도 **fast 잡**이어야 한다. 시주를 세는 엔진이 런타임별로 3벌인데(정적 셸 / 워커 /
      # 앱 라우터) 앱 라우터 엔진만 고치면 티어가 standard 라 critical 잡이 통째로 스킵된다 —
      # 즉 거기 두면 세 벌 중 하나가 조용히 갈라지는 경로를 못 잡는다. 세 엔진을 실제로 돌려
      # 같은 시주가 나오는지 보는 검사이고 네트워크 없이 5초면 끝난다.
      - name: Verify hour pillar parity across saju engines
        run: npm run verify:hour-pillar-parity

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 인라인 스크립트와 js/saju-engine*.js 라
      # 티어가 fast/standard 로 갈리는데, build/critical 잡에 두면 정작 지켜야 할 셸 한 줄 수정에
      # 깨어나지 않는다. 모바일 지연 마운트가 오버레이를 DOM 밖으로 들어낸 뒤 여는 경로를 빠뜨리면
      # 그 기능이 통째로 죽는데 화면도 콘솔도 조용하다(tsModal 실사고). 정적 파일 읽기라 1초 미만.
      - name: Verify mobile lazy-mount overlays have an opening path
        run: npm run verify:mobile-lazy-mount-openers

      # 🔴 이것도 **fast 잡**이어야 한다. `fortune/index.html` 단독 수정은 티어가 low/fast 라
      # build 잡이 통째로 스킵된다 — 그런데 이 가드가 잡으려는 것이 바로 "정적 셸을 손으로 고쳐
      # sign-profiles·periods 와 어긋나게 만든" 경우다. build 잡에 두면 지키려던 경로에서만 잠든다.
      # 소스 두 개를 읽어 문자열을 비교할 뿐이라 네트워크 없이 1초 미만이다.
      - name: Verify fortune hub shell matches its source
        run: npm run verify:fortune-hub-shell

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 과 js/core/service-registry.js 라
      # 티어가 low/fast 로 잡히는데, build/critical 잡에 두면 정작 지켜야 할 "홈 가격 라벨 한 줄
      # 수정"에 깨어나지 않는다. 홈 표시가격이 결제 정본(worker/lib/paid-feature-registry.js)과
      # 어긋난 채로 배포된 전력이 있다(IFÀ 오라클: 30코인=3,000원짜리를 5,000원으로 표시,
      # 2026-08-19 실측). 정적 파일 읽기 + 정본 import 라 네트워크 없이 1초 미만이다.
      - name: Verify home service registry matches billing source of truth
        run: npm run verify:home-service-registry

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 하나뿐이라 티어가 low/fast 로 잡히는데,
      # build 잡에 두면 정작 지켜야 할 "홈 히어로 CSS 한 줄 수정"에 깨어나지 않는다.
      # 지키는 것: 히어로 확정 레이아웃이 마크업보다 뒤에 도착해 홈 전체가 446px 밀려 내려가던
      # 회귀(실측 layout-shift 0.5433 → 0.0000, 2026-08-20). 정적 파일 하나를 읽고 두 CSS 블록을
      # 문자열로 대조할 뿐이라 네트워크 없이 1초 미만이다.
      - name: Verify hero first-paint lock matches its authoritative block
        run: npm run verify:hero-firstpaint-lock

      # 🔴 이것도 **fast 잡**이어야 한다 — 2026-08-23 에 critical 잡에서 옮겨 왔다.
      # public/ 미러가 소스보다 낡으면 테스트는 전부 통과하고 사용자만 옛 화면을 본다.
      # 2026-08-20~21 이틀에 세 번 났고 세 번 다 CI 가 아무 말을 안 했다.
      # 그런데 미러의 소스는 index.html·styles/**·js/** 라 티어가 low/fast 로 잡히는 쪽이 많다
      # (scripts/lib/change-risk.mjs: styles/ 는 low). critical 잡에 두면 정작 지켜야 할
      # "CSS 한 줄만 고친 PR" 에서 잡이 통째로 스킵돼 낡은 미러가 그대로 머지된다 — PR #928
      # (styles/mobile-lite.css)이 정확히 그렇게 통과했고, 뒤따르던 critical 티어 PR 들이
      # 대신 연쇄로 빨간불이 됐다(#932 에서 발견, #935 로 수습).
      # 생성기를 한 번 돌려 커밋된 내용과 대조할 뿐이라 네트워크 없이 2초 미만이다.
      - name: Verify public mirrors are fresh
        run: |
          npm run verify:public-mirror-fresh
          npm run verify:public-mirror-fresh -- --self-test

      # 배선을 검사하는 가드가 배선되지 않으면 농담이 된다. allowlist 만 고쳐 침묵시키는
      # 경로도 여기서 함께 막힌다 — scripts/ 만 바꾸면 critical 티어가 돌지 않는다.
      - name: Verify guard wiring
        run: |
          npm run verify:guard-wiring -- --self-test
          npm run verify:guard-wiring

      # 기능 가이드가 자기 기능으로 가는 1차 동선을 갖고 있는지 본다. /health-report/guide 는
      # 그 동선이 0개인 채로 색인·광고 심사까지 통과했고, 그걸 볼 검사가 하나도 없었다.
      # 🔴 여기(fast 잡)여야 한다 — 소스만 읽으므로 빌드가 필요 없고, app/ 단독 변경이 낮은
      # 티어로 잡혀 build 잡 스텝이 스킵돼도 이 검사는 돌아야 한다.
      - name: Verify guide feature CTA
        run: npm run verify:guide-feature-cta

      # 🔴 이것도 **fast 잡**이어야 한다. `public/i18n/**` 단독 변경은 티어가 low/fast 라 build
      # 잡이 통째로 스킵되는데, 그게 정확히 지키려는 경로다(새 UI 카피를 en.json 에만 넣고 다른
      # 11개 로케일을 빠뜨리는 실수). 이 세 스크립트는 이미 npm run i18n:check 체인 안에 있지만
      # 그 체인은 build-cf-main.mjs 에서 optional:true 로 돈다(2026-07-28 배포 정지 사고 이후
      # 의도적 조치, 되돌리지 않음) — 즉 실패해도 지금까지는 아무 것도 막지 않았다. 여기 fast
      # 잡에 직접 두면 티어 무관 항상 실행되고 필수 체크라 실패 시 병합이 막힌다.
      - name: Verify i18n locale coverage
        run: |
          node scripts/i18n-check.mjs
          node scripts/verify-i18n-public-parity.mjs --all
          npm run verify:i18n-runtime

  build:
    name: Build Pages and Worker
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 🔴 draft PR 은 build:cf·build:worker 를 건너뛴다(2026-08-21) — 티어 스킵과 같은 이유로
    # **스텝**에서만 건너뛴다, 잡 자체를 막지 않는다(브랜치 룰셋 필수 체크는 계속 보고돼야 함).
    # ready_for_review 로 전환되면 그 이벤트가 트리거 목록에 있어 전체 빌드가 자동으로 돈다.
    # lint·typecheck(fast 잡)·critical(결제·보안 테스트)은 draft 여도 그대로 돈다 — 안전 우선.
    steps:
      - name: Skip notice
        if: needs.classify.outputs.runs_build != 'true' || github.event.pull_request.draft == true
        run: echo "::notice::tier=${{ needs.classify.outputs.tier }} draft=${{ github.event.pull_request.draft }} — 빌드를 건너뜁니다(문구·CSS·이미지·문서 변경, 또는 draft PR)."

      - name: Checkout PR head
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm ci

      # build:cf 의 postbuild 가 out/ 을 읽어 AdSense 콘텐츠 게이트를 돌린다. 빌드가 끝나야만
      # 도는 검사라 여기서 함께 잡는다 — 배포 직전에 처음 알게 되면 릴리스가 통째로 막힌다.
      - name: Build Cloudflare Pages output
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run build:cf

      # 색인 대상 라우트의 H1 이 정확히 1개인지 본다. 사이트맵에서 라우트를 전수 발견하므로
      # 새 라우트도 자동으로 걸린다. out/ 을 읽으니 반드시 build:cf 뒤에 둔다.
      - name: Verify SEO heading integrity
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:seo-heading-integrity

      # 색인 대상 라우트가 "문장급" 본문을 실제로 갖고 있는지 본다. raw 글자수 게이트는 링크
      # 라벨·푸터 공용 문구까지 세기 때문에, 본문이 JS 안에만 있는 라우트를 통과시킨다
      # (2026-08-24 실측: /oracle/ifa 0자 · /saju/love-simulation 0자). dist/ 와 그 안의
      # 사이트맵을 읽으니 반드시 build:cf 뒤에 둔다.
      - name: Verify indexable prose depth
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:indexable-prose-depth

      # 얇은 광고 라우트에 사람이 쓴 편집자 노트가 붙어 있는지 본다. 대상을 out/ 에서 전수
      # 발견하므로 새로 얇아진 라우트도 자동으로 걸린다. out/ 을 읽으니 반드시 build:cf 뒤에 둔다.
      # 🔴 여기 있어야 하는 이유: verify-guard-wiring 이 "아무 게이트도 안 부르는 검증기" 를
      #    실패시킨다. 이 줄을 지우면 그 가드가 다시 빨간불이 된다(지우려면 UNWIRED_BY_DESIGN
      #    에 사유와 함께 옮길 것).
      - name: Verify editor notes
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:editor-notes

      # /fortune/{period}/{sign} 96개가 기간마다 실제로 다른 글을 내보내는지 본다.
      # 소스에서 sign 을 전수 발견하므로 sign 을 늘리고 기간 문안을 빠뜨리면 여기서 걸린다.
      # out/ 을 읽지 않으므로 빌드 앞에 두어도 되지만, 같은 성격의 SEO 가드끼리 모아 둔다.
      - name: Verify fortune period axis
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:fortune-period-axis

      # 번들 1MB 제한과 문법 오류를 업로드 없이 잡는다(--dry-run 은 아무것도 올리지 않는다).
      - name: Build Worker bundle (dry run)
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run build:worker

      - name: Verify Worker size budget
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:worker-size

  critical:
    name: Critical checks
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip notice
        if: needs.classify.outputs.runs_critical != 'true'
        run: echo "::notice::tier=${{ needs.classify.outputs.tier }} — 결제·인증·Worker·DB·배포설정 경로가 걸리지 않아 전체 테스트와 배포 가드를 건너뜁니다."

      - name: Checkout PR head
        if: needs.classify.outputs.runs_critical == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.classify.outputs.runs_critical == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm ci

      # 전체 스위트는 60초 안팎이다. 파일 목록을 손으로 관리하면 새 테스트가 조용히
      # 실행되지 않는 상태로 남는다(2026-08 에 48개 파일이 그랬다).
      - name: Test
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm test

      # 배포 파이프라인 자체의 회귀. 이 가드가 죽으면 증상이 "배포가 그냥 잘 됨"이라
      # 아무도 모르고, 다음 사고는 프로덕션에서 코드가 사라지는 형태로 온다.
      - name: Verify release pipeline contract
        if: needs.classify.outputs.runs_critical == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run verify:deploy-safe
          npm run verify:pages-single-deploy-guard
          npm run verify:worker-single-deploy
          npm run verify:worker-config-parity
          npm run verify:worker-config-parity -- --self-test
          npm run verify:staging-noindex
          npm run verify:staging-noindex -- --self-test
          # 배선을 지키는 가드와 별개로, 실제 변환기가 하는 일도 픽스처로 증명한다.
          node scripts/apply-staging-noindex.mjs --self-test
          npm run verify:pages-worker-parity-test
          npm run verify:deployed-sha -- --self-test
          npm run verify:merge-landed-test

      # 공개 API 3개(리뷰 목록·요약·오늘의 운세 허브)가 엣지 캐시를 지나는지, 캐시 조회가
      # connectDb 보다 앞인지, 그리고 🔴 생년이 실린 개인화 응답이 그 **공유** 캐시에 새지 않는지.
      # 마지막 것은 사고가 나면 "다음 방문자가 남의 사주를 받는다" 이므로 self-test 를 함께 돌린다.
      - name: Verify public API edge cache
        if: needs.classify.outputs.runs_critical == 'true'
        run: |
          npm run verify:public-api-edge-cache
          npm run verify:public-api-edge-cache -- --self-test
          # 자격증명 단위 캐시(/api/auth/me · /api/profile)는 틀리면 남의 세션이 보인다.
          npm run verify:credential-cache
          npm run verify:credential-cache -- --self-test

      - name: Verify ads.txt is present
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm run verify:ads-txt

      - name: Scan for leaked secrets
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm run verify:no-secret-leak
