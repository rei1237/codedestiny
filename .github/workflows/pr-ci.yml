name: PR CI

# main 으로 가는 모든 변경이 통과해야 하는 관문이다. 프로덕션 배포는 이 워크플로가 아니라
# main 머지 이후 "Release Cloudflare Pages and Worker" 가 수행한다 — 여기서는 아무것도 배포하지 않는다.
#
# 🔴 검사 강도는 **변경된 파일 경로**로 정한다. 모든 PR 에 같은 검사를 돌리면 CSS 한 줄 고치는 데
#    전체 회귀를 기다리게 되고, 그러면 게이트를 우회할 방법을 찾게 된다. 반대로 전부 가볍게 하면
#    결제·인증이 무방비가 된다. 판정은 scripts/resolve-ci-tier.mjs 가 하고, 그 정본은
#    scripts/lib/change-risk.mjs 하나다(배포 파이프라인도 같은 모듈을 쓴다).
#
#      fast     — 문구·CSS·이미지·문서            → typecheck · lint
#      standard — 일반 프론트엔드(app/components/js) → + build
#      critical — 결제·인증·Worker·DB·배포설정      → + 전체 테스트 · 배포 가드 · 자동 Preview
#
# 🔴 세 잡 모두 **항상 실행**된다. 티어에 따라 건너뛰는 것은 잡이 아니라 그 안의 스텝이다.
#    잡 자체를 if 로 막으면 브랜치 룰셋의 필수 체크가 보고를 받지 못해 머지가 영영 막힌다.
#    건너뛴 잡은 30초 안에 끝나므로 비용은 사실상 러너 기동 시간뿐이다.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

jobs:
  classify:
    name: Risk tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      runs_build: ${{ steps.tier.outputs.runs_build }}
      runs_critical: ${{ steps.tier.outputs.runs_critical }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 의존성이 필요 없는 순수 모듈이라 npm ci 를 돌리지 않는다.
      #
      # CD_FORCE_CRITICAL 은 `full-ci` 라벨로 티어를 끌어올리는 탈출구다. 경로만으로는 안 잡히는
      # 변경(예: 정적 셸 index.html 안의 결제 모달 수정)을 사람이 알고 있을 때 쓴다. 라벨은
      # 올리는 방향으로만 작동한다 — 내리는 길을 만들면 게이트를 끄는 버튼이 된다.
      - name: Resolve verification tier from changed paths
        id: tier
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CD_FORCE_CRITICAL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          node scripts/lib/change-risk.mjs --self-test
          node scripts/resolve-ci-tier.mjs --self-test
          node scripts/resolve-ci-tier.mjs

  # 🔴 스택 PR 을 부모(→main)부터 머지하면 자식의 머지 커밋은 목적지를 잃은 브랜치로 들어간다.
  # GitHub 은 자식을 "Merged" 로 칠하지만 그 커밋은 main 의 조상이 아니고, 아무 신호도 남지
  # 않는다. 전수조사에서 그렇게 좌초한 PR 이 9건 나왔고 복구 PR 을 세 번 만들었다(#591·#593·#600).
  # 사고는 전부 부모가 자식보다 12~16초 먼저 머지되며 일어났다 — 사람이 조심해서 막을 간격이 아니다.
  #
  # 그래서 순서를 기계로 고정한다: 자식이 열려 있는 동안 부모는 머지되지 않는다. 스택은 바닥
  # 브랜치에 전부 쌓인 뒤 main 으로 한 번에 들어가므로 경합 구간 자체가 사라진다.
  #
  # 자식을 부모 브랜치에 머지하면 그것이 곧 부모 PR 의 head 갱신이라 부모 PR 에 synchronize 가
  # 발생해 이 검사가 자동으로 다시 돈다. 자식을 머지 없이 닫았을 때만 수동 재실행이 필요하다.
  #
  # classify 에 의존하지 않는다 — 티어와 무관하게 항상 돌아야 하고, 먼저 끝날수록 좋다.
  landing-order:
    name: Landing order
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to merge a parent before its stacked children
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${PR_HEAD_REF:-}" ]; then
            echo "::notice::PR 컨텍스트가 없어 착지 순서를 검사하지 않습니다."
            exit 0
          fi
          children=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${PR_HEAD_REF}&per_page=100" \
            --jq '.[] | "  - #\(.number) \(.title)"')
          if [ -z "$children" ]; then
            echo "이 브랜치(${PR_HEAD_REF})를 base 로 하는 열린 PR 이 없습니다. 지금 머지해도 좌초하지 않습니다."
            exit 0
          fi
          echo "::error::이 PR 을 먼저 머지하면 아래 PR 들의 머지 커밋이 main 에 도달하지 못합니다. 아래를 먼저 머지하세요."
          echo "$children"
          exit 1

  fast:
    name: Typecheck and lint
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 은 아래 `lint:changed` 가 base...head 를 계산하기 위해 필요하다.
      # 얕은 체크아웃에서는 base 커밋이 없어 diff 가 통째로 비고, 그러면 이 게이트가
      # 조용히 아무 파일도 검사하지 않는 상태가 된다.
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 🔴 `npm run lint` 는 `next lint` 이고 `pages/ app/ components/ lib/ src/` 만 본다.
      # 머지 후 배포(scripts/deploy-safe.mjs 의 "changed-file lint")는 **변경 파일 전부**에
      # eslint 를 직접 건다 — `__tests__/ scripts/ worker/ js/` 까지. 두 범위가 다르면 PR 은
      # 초록불로 머지되고 스테이징 배포가 린트로 죽는데, 사람에게 보이는 마지막 에러는 그
      # 다음 스텝의 "SHA 불일치" 하나뿐이라 원인이 가려진다
      # (2026-08-22 run 32584789263: __tests__/worker/fpti-deep-report.quality.test.js).
      # 대상 선정 정본은 scripts/lib/lint-targets.mjs 이고 배포도 같은 모듈을 쓴다.
      - name: Lint changed files exactly as the release does
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run lint:changed -- --self-test
          npm run lint:changed

      # 🔴 `test:node` 는 `__tests__/ui/*.test.js` 정적 가드다. jest 는 이것을 돌리지 않고,
      # PR CI 에서는 critical 티어(`npm test`)에서만 돌았다. 그런데 deploy-safe 는 risk=medium
      # 부터 돌린다 — 즉 app/·components/·js/ 만 고친 standard 티어 PR 은 **머지된 뒤에야**
      # 이 검사를 처음 받는다. 2026-08-22 PR #940 이 정확히 그 경로로 통과해 머지되고
      # 스테이징 배포를 3연속 실패시켰다(fusion-fortune.static.test.js 3건).
      #
      # fast 잡에 두는 이유: 이 가드들의 입력은 index.html·js/·styles/ 라 티어가 fast 로
      # 잡히는 변경에서도 깨어나야 한다. 실측 13.7초 / 296 tests (2026-08-23).
      - name: Run the static UI guards the release runs
        run: npm run test:node

      # 🔴 이것은 **fast 잡**이어야 한다. 사이트맵을 어긋나게 만드는 것은 라우트 추가만이
      # 아니라 글 한 편, 공용 컴포넌트 한 줄이다(lastmod 서명이 소스 파일에서 나온다).
      # build 잡에 두면 티어가 fast 로 잡히는 문구·콘텐츠 변경에서 깨어나지 않는데, 그게 정확히
      # 지키려는 경로다. 빌드 산출물을 읽지 않고 소스와 추적본만 비교하므로 몇 초면 끝난다.
      #
      # 왜 필요한가 (2026-08-24 하루에 세 번): 라우트·콘텐츠를 바꾼 PR 이 사이트맵을 함께
      # 갱신하지 않아 ①#1076 의 /ziwei/chart 가 추적본에서 빠진 채 머지돼 헤딩 가드가 그
      # 라우트를 건너뛰었고 ②낡은 추적본으로 검증한 #1079 가 CI 에서 터졌으며 ③#1099 가
      # lastmod 52개를 낡은 채로 남겼다. 기존 verify:sitemap 은 배포 워크플로에만 있어
      # 전부 머지 뒤에야 알 수 있었다.
      - name: Verify the tracked sitemap matches its sources
        run: npm run verify:sitemap-drift

      # 🔴 이 두 가드는 **fast 잡**에 있어야 한다. 입력이 CSS·정적 셸·package.json 이라
      # build/critical 잡에 두면 `styles/mobile-lite.css` 한 줄 수정에는 깨어나지 않는데,
      # 그게 정확히 지키려는 경로다. 둘 다 node 내장 모듈만 쓰는 정적 파일 읽기라 1초 미만이다.
      - name: Verify mobile detail wrapper is non-intrusive
        run: npm run verify:mobile-detail-nonintrusive

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 CSS 모듈과 .tsx 라 티어가 fast 로 잡히는데,
      # build/critical 잡에 두면 정작 지키려는 "스프라이트 크롭 한 줄 수정"에 깨어나지 않는다.
      # 지키는 것: 크롭 수식이 CSS 로 돌아가 길이÷길이 나눗셈(CSS Values 4)을 쓰는 회귀.
      # 그 문법은 Chrome 119+/Safari 17+ 에서만 유효해 최신 브라우저에서는 멀쩡히 보이고
      # 구형 인앱 웹뷰에서만 시트가 원본 크기로 우하단에 붙는다(2026-08-25 네이버 인앱 실사고).
      # 정적 파일 읽기라 네트워크 없이 1초 미만이다.
      - name: Verify sprite crops are computed in JS, not CSS calc
        run: |
          npm run verify:pig-sprite-crop -- --self-test
          npm run verify:pig-sprite-crop

      # 🔴 이것도 **fast 잡**이어야 한다. 시주를 세는 엔진이 런타임별로 3벌인데(정적 셸 / 워커 /
      # 앱 라우터) 앱 라우터 엔진만 고치면 티어가 standard 라 critical 잡이 통째로 스킵된다 —
      # 즉 거기 두면 세 벌 중 하나가 조용히 갈라지는 경로를 못 잡는다. 세 엔진을 실제로 돌려
      # 같은 시주가 나오는지 보는 검사이고 네트워크 없이 5초면 끝난다.
      - name: Verify hour pillar parity across saju engines
        run: npm run verify:hour-pillar-parity

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 js/saju-engine.js 하나라 티어가 fast/standard 로
      # 갈리는데, critical 잡에 두면 정작 지켜야 할 "명반 엔진 한 줄 수정"에 깨어나지 않는다.
      # 소한(小限)은 틀려도 화면이 조용하다 — 궁 이름과 나이가 그럴듯하게 계속 나오기 때문에
      # 방향을 대한과 같이 쓰거나 나이를 양력 연도로 세도 아무도 모른다. 외부 명반과 대조한
      # 값을 고정해 그 세 갈래를 막는다. 엔진을 vm 으로 한 번 돌릴 뿐이라 네트워크 없이 2초 미만.
      - name: Verify ziwei minor limit (소한) placement
        run: npm run verify:ziwei-sohan

      # 🔴 이것도 **fast 잡**이어야 한다 — 입력이 js/saju-engine.js 라 티어가 fast/standard 다.
      # 기본 명반을 헤드리스로 실제 렌더해서 본다. 지키는 것 둘: ① 간소가 기본이고 상세 요소는
      # 마크업에 있되 CSS 로 접힌다 ② 궁합 입력 폼이 다시 접힌 <details> 안으로 들어가지 않는다.
      # ②가 이 화면의 원래 결함이었다 — 홈 타일은 "궁합 5,000원"을 광고하는데 결과 화면에서는
      # 펼치기 전까지 보이지 않아 있는 줄도 모르고 지나갔다. 엔진을 한 번 돌릴 뿐이라 3초 미만.
      - name: Verify ziwei chart detail view and compatibility card
        run: npm run verify:ziwei-chart-detail-view

      # 🔴 이것도 **fast 잡**이어야 한다. 상담 주제 목록이 네 벌(프롬프트 템플릿 · 워커 라벨 ·
      # TOPICS 화이트리스트 · React 선택지)로 손에 맞춰져 있는데, 그중 React 쪽만 고치는 PR 은
      # 티어가 standard 라 critical 잡이 통째로 스킵된다 — 즉 이 가드를 critical 에 두면 정작
      # 어긋나기 쉬운 경로에서 잠든다. lawsuit·life_direction 은 템플릿이 다 쓰여 있는데도
      # 선택지에 없어 **도달 자체가 불가능**했다. 파일 셋을 읽고 대조할 뿐이라 2초 미만이다.
      - name: Verify ziwei consultation categories stay in sync
        run: npm run verify:ziwei-consult-categories

      # 🔴 이것도 **fast 잡**이어야 한다. 궁간·대한사화·자화·소한은 worker/lib/ziwei-ai-chart.js 와
      # worker/routes/ziwei-ai.js 에 걸쳐 있는데, 앞의 것만 고치는 PR 은 티어가 critical 로 안 올라간다
      # (scripts/resolve-ci-tier.mjs 는 worker/routes/ziwei-ai.js 만 critical 로 못 박는다).
      # critical 잡에 두면 정작 명반 계산만 손댄 PR 에서 이 가드가 잠든다.
      # 셸 엔진을 헤드리스로 한 번 돌려 대조할 뿐이라 몇 초면 끝난다.
      - name: Verify ziwei worker chart facts (궁간·대한사화·자화·소한)
        run: npm run verify:ziwei-worker-chart-facts

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 js/saju-engine.js · app/_lib/ziwei-engine.ts ·
      # worker/lib/ziwei-ai-chart.js 셋에 걸쳐 있는데, 앞의 둘만 고치는 PR 은 티어가 critical 로
      # 올라가지 않는다(scripts/resolve-ci-tier.mjs 는 worker/routes/ziwei-ai.js 만 critical 로 못 박는다).
      # 이 가드가 잡으려는 것이 바로 "한 엔진만 고쳐서 셋이 갈리는" 경우라, critical 에 두면 잠든다.
      # 세 엔진을 29명분 돌려 별 위치를 인덱스로 대조한다. 네트워크·LLM 호출 없이 몇 초면 끝난다.
      # 🔴 대조 인물에 1997-02-10 이 들어 있다 — 한국 설날(2/8)과 중국 설날(2/7)이 갈리는 날이라,
      # 어느 엔진이든 lunar-javascript 로 되돌아가면 그 자리에서 빨간불이 된다(검사 ⑦).
      - name: Verify ziwei star placement parity (셸·워커·앱)
        run: npm run verify:ziwei-star-parity

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 destiny-island.html 과 worker/lib/island/ 라
      # 티어가 fast/standard 로 갈린다 — critical 잡에 두면 정작 지켜야 할 섬 문구 한 줄 수정에 깨어나지 않는다.
      # 섬은 별 이름을 **키로** 설명을 찾는데 소비 코드가 전부 filter(Boolean) 이라,
      # 키가 어긋나면 에러 없이 그 별의 설명만 조용히 사라진다(록존/녹존 · 청양/경양 실사고).
      # 워커 카탈로그를 import 해 읽고 정적 파일을 파싱할 뿐이라 1초 미만.
      - name: Verify island star copy covers the worker catalog
        run: npm run verify:island-star-copy

      # 🔴 한국 음양력 코어 가드 5종. 전부 **fast 잡**이어야 한다 — 입력이 lib/korean-calendar/ 와
      # scripts/ 라 티어가 fast/standard 로 갈린다. critical 잡에 두면 정작 지켜야 할 경로에서 잠든다.
      #
      # 이 코어가 있는 이유: lunar-javascript 는 중국 표준시(UTC+8) 기준 중국 음력이다.
      # 삭이 CST 23시대에 들면 KST 로는 다음날이라 그 달 전체의 음력일이 하루 밀린다.
      # 실측: 1900~2100 중 73,414일 비교에서 2,997일(4.08%)이 갈린다.
      # 자미두수는 음력일로 자미성을 잡으므로 하루가 밀리면 명반 14주성이 통째로 이동한다.
      #
      # 네트워크를 타지 않는다(KASI 가드도 기본은 체크인된 픽스처 모드다). 합쳐서 20초 미만.
      - name: Verify Korean calendar table is freshly generated
        run: npm run verify:korean-calendar-table-fresh

      # 🔴 회귀 증명의 핵심. 새 코어와 lunar-javascript 의 **모든** 차이가
      # 타임존 재구성(CST 또는 북경 지방평균시)으로 설명되는지 전수로 본다. 잔차 0 이어야 통과한다.
      - name: Verify every calendar divergence is explained by timezone
        run: npm run verify:korean-calendar-divergence

      - name: Verify solar term ephemeris matches lunar-javascript
        run: npm run verify:korean-calendar-solar-terms

      # 자정 ±5분 위험 등기부 — astronomy-engine 업그레이드가 사용자 결과를 바꾸는 유일한 통로다.
      - name: Verify the midnight-boundary risk register is unchanged
        run: npm run verify:korean-calendar-midnight-register

      # 기본 모드는 네트워크 0. --live 는 사람이 손으로 돌려 픽스처를 갱신한다.
      - name: Verify the core matches the checked-in KASI samples
        run: npm run verify:korean-calendar-kasi-samples

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 lib/korean-calendar/ 와 js/core/ 라
      # 티어가 fast/standard 로 갈린다. 네트워크 0.
      #
      # 바로 위 가드와 **다른 것을 본다.** 그쪽 검사 ⑥ 은 KASI 의 lunSecha/lunWolgeon,
      # 즉 **음력 프레임**이다(세차가 설날에, 월건이 음력 달에 바뀐다). 이 가드는
      # **절기 프레임**(세차가 입춘에, 월건이 節에)을 KASI 절입 시각으로 유도해 코어와 대조한다.
      # 그 대조는 이 가드가 생기기 전까지 레포 어디에도 없었다 —
      # verify:korean-calendar-solar-terms 는 이름과 달리 lunar-javascript 와 비교한다.
      #
      # 두 층이다. tier-1 지상값은 셸에 체크인된 KASI 검증캐시(1990 12중절)로 전수 스윕(518,427분).
      # tier-2 는 2026-08-28 에 채집됐다 — data.go.kr 특일 정보 활용신청이 승인돼 403 이 풀렸고,
      # KASI 가 실제로 답하는 **2000~2028** 29년을 픽스처로 받았다(1930~2050 은 승인 전의 가정이었다).
      # 그중 2011 은 節(입동)에 KASI 데이터 오류가 있어 지상값에서 뺀다 — 우리 코어와
      # lunar-javascript 가 1분 이내로 일치하고 KASI 만 5h51m 벗어난다(KASI_KNOWN_ERRATA).
      # 픽스처도 마커도 없으면 실패한다(조용한 skip 방지).
      - name: Verify the solar-term frame matches KASI
        run: npm run verify:solar-term-frame-kasi

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 js/core/ · js/saju-engine*.js 라 티어가
      # fast/standard 로 갈린다 — critical 잡에 두면 정작 지켜야 할 "간지 경로 한 줄 수정"에
      # 깨어나지 않는다. 네트워크 0, 실측 5.6초(자식 프로세스 5개 포함).
      #
      # 무엇을 지키나: 셸이 KST 벽시계 부품으로 **로컬 Date 를 조립**하는데, 그 벽시계가 그
      # 타임존에 존재하지 않으면(서머타임 시계 앞당김) JS 가 조용히 다른 시각으로 접어 시주·
      # 일주·월주가 틀어진다. 그 조립을 부품 API 로 옮기는 작업(PR-C~E)의 **저울**이다.
      #   ① TZ=Asia/Seoul 산출물이 픽스처와 전건 같다
      #   ② 6개 존의 서머타임 구멍 건수가 census 와 정확히 같다
      #   ③ 구멍을 뺀 나머지에서 모든 존이 KST 와 같다
      # 🔴 "구멍 총계 0" 은 아직 요구하지 않는다 — 그것이 PR-D 의 졸업 조건이다.
      #
      # 🔴 값 대조와 **별도로 isNull 지도**를 본다. KasiEngine.getGanji 는 지금 1990년 말고
      # 전부 null 이라(검증캐시가 그 한 해뿐) 값만 보면 이 표면이 통째로 null==null 로 통과한다.
      # 전환 중에 getGanji 가 답하기 시작하면 호출부 13곳이 한꺼번에 절기 프레임으로 갈아탄다.
      - name: Verify the shell ganji surfaces are timezone-stable
        run: npm run verify:ganji-surface-parity

      # 🔴 이것도 **fast 잡**이다. 절기를 다루는 소스(js/·worker/·app/·lib/)를 전수 발견해
      # CST 애드혹 보정(+3600*1000 · 480분 오프셋)이 되살아났는지 보고, 로컬 절기를 만드는
      # 소비자 5벌을 실제로 실행해 코어와 분 단위로 같은 12節을 내는지 대조한다.
      # 애드혹이라 하나만 빠져도 그 엔진만 1시간 이른 월건 경계를 쓰고, 그 창에 태어난 사람은
      # 월건이 한 칸 밀린 결과를 받는다 — 화면도 콘솔도 조용하다.
      - name: Verify saju solar-term boundaries all come from the core
        run: npm run verify:saju-solar-term-core

      # 🔴 이것도 **fast 잡**이다. 27수는 음력 월·일로 **직접** 결정되므로 음력일이 하루 밀리면
      # 본명숙이 통째로 옆 칸으로 간다(실측 2026-08-27: 1950~2030 29,585일 중 1,055일 3.57%).
      # 숙요를 다루는 소스를 전수 발견해 lunar-javascript 잔존을 분류와 대조하고, 소비자 10벌을
      # 실제로 실행해 **갈리는 날짜에서** 코어 쪽 본명숙을 내는지 본다(낙샤트라 3라우트는 Swiss WASM 을
      # 끌고 와 node 로 직접 import 되지 않아 esbuild 로 번들해 돌린다). 베다 어댑터는 반대 방향인
      # 음력→양력이라 하루가 밀리면 요일이 밀리고 그대로 다른 바라(지배 행성)가 나온다.
      - name: Verify sukuyo lunar dates all come from the core
        run: npm run verify:sukuyo-korean-calendar

      # 🔴 이것도 **fast 잡**이다. 음력↔양력 변환은 자미두수(자미성)·숙요(본명숙)·휴먼디자인
      # (행성 황경)이 전부 올라타는 축이라, 하루가 밀리면 그 세 결과가 통째로 다른 값이 된다.
      # 변환 API 를 부르는 소스를 전수 발견해 잔존 분류와 대조하고, 소비자 13벌을 실제로 실행해
      # **갈리는 날짜에서** 코어 쪽 날짜를 내는지 본다. 🔴 KASI 로컬 폴백도 여기서 본다 —
      # 그 라우트는 레포가 "권위 있는 한국 달력"으로 삼는 지점이라, 중국 음력이면 업스트림이
      # 죽는 동안에만 조용히 틀린다(실제로 그 상태였다).
      - name: Verify lunar conversions all come from the core
        run: npm run verify:lunar-conversion-core

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 js/saju-engine*.js · js/luck-sync-diary.js ·
      # js/sibyl-system.js 라 티어가 fast/standard 로 갈린다.
      # 위 두 가드는 소스 스캔 + 모듈 실행이라 **정적 셸을 못 본다** — 셸은 ESM 이 아니라 브라우저
      # 전역에 얹히는 한 덩어리 스크립트다(PR-E2 가 정확히 그렇게 셸을 놓쳤다). 이 가드는
      # scripts/lib/ziwei-engine-harness.cjs 의 DOM 부트스트랩으로 셸을 **실제로 평가하되
      # global.Solar/global.Lunar 를 지운 채** 돌린다. 그래서 누가 셸에 EightChar 를 되살리면
      # 조용한 폴백이 아니라 여기서 터진다. 절기 프레임이 갈리는 날을 찾아 값까지 대조하고,
      # 야자시 정책 두 축(오늘 일진=keep-day · 출생 원국=shift-day)이 섞이지 않는지도 본다.
      # 네트워크 없음. 10초 미만.
      - name: Verify the static shell calendar comes from the core
        run: npm run verify:shell-korean-calendar

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 lib/korean-calendar/ · js/saju-engine.js ·
      # worker/lib/ 라 티어가 fast/standard/critical 로 갈린다.
      #
      # 대운의 기운 나이는 **유파마다 절사 관례가 갈린다.** 그래서 이 이관은 "더 정확한 계산"이
      # 아니라 **관례를 그대로 재현하고 달력만 바꾸는 것**이어야 하고, 그 사실을 이 가드가
      # 주장이 아니라 측정으로 지킨다 — 코어의 daeunFromFrame 에 lunar-javascript 자신의
      # 절기·세차·월주를 먹이면 그 라이브러리와 **잔차 0** 이어야 한다(검사 ①, 표본 13,790건).
      # 누가 관례를 "개선"하면 그 순간 여기가 빨간불이 된다.
      # 이어서 KST 절기로 바꿨을 때 값이 실제로 움직이는지(검사 ②), 소비자 3벌(정적 셸 ·
      # life-book 워커)이 코어와 같은 대운을 내는지(검사 ③④)를 실제로 실행해 본다.
      # 네트워크 없음. 30초 미만.
      - name: Verify daeun comes from the core with the same convention
        run: npm run verify:daeun-korean-calendar

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 lib/saju/ 와 worker/lib/life-book-ai-saju.js 라
      # 티어가 fast/critical 로 갈리는데, critical 잡에 두면 정작 지켜야 할 "표 한 줄 수정" 에서
      # 잠든다(resolve-ci-tier 는 worker/routes/ziwei-ai.js 만 critical 로 못 박는다).
      #
      # 달력 가드들과 성격이 정반대다 — 이 표(納音·十神·지장간·오행·十二運星·旬空)는 간지 문자열
      # 조회라 **시간대와 무관**하므로 값이 움직일 이유가 없다. 즉 **값이 바뀌면 정정이 아니라
      # 이관 실수다.** 그런데 그 실수는 조용하다 — 이 파생 필드를 단언하는 테스트가 레포에 하나도
      # 없었다. 그래서 이 가드가 유일한 안전망이고, LunarUtil 과 키 216개를 전수 대조한 뒤
      # 소비자를 실제로 돌려 값까지 맞춘다. 네트워크 없음. 10초 미만.
      - name: Verify the myeongri constant tables still match their source
        run: npm run verify:myeongri-tables

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 worker/lib/ · worker/routes/ · lib/korean-calendar/ 라
      # 티어가 fast/critical 로 갈리는데, critical 잡에 두면 정작 지켜야 할 한 줄 수정에서 잠든다.
      #
      # 23시대 출생의 일진을 어느 날로 볼지는 **유파 결정**이고 이 레포는 표면마다 답이 다르다
      # (정적 셸 shift-day · 앱 기본 keep-day · destiny-bias 는 사용자 선택). 이 가드는 어느 축이
      # 옳은지를 정하지 않는다 — **축이 소스에 명시돼 있고**(코어 기본값에 안 기대고), 실행 결과가
      # 그 축과 일치하며, 23시대에서 두 정책이 실제로 갈리는지를 매번 다시 잰다. 소비자 3벌을
      # 실제로 돌린다. 네트워크 없음. 30초 미만.
      - name: Verify the natal day-pillar axis is declared, not inherited
        run: npm run verify:natal-day-pillar-axis

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 인라인 스크립트와 js/saju-engine*.js 라
      # 티어가 fast/standard 로 갈리는데, build/critical 잡에 두면 정작 지켜야 할 셸 한 줄 수정에
      # 깨어나지 않는다. 모바일 지연 마운트가 오버레이를 DOM 밖으로 들어낸 뒤 여는 경로를 빠뜨리면
      # 그 기능이 통째로 죽는데 화면도 콘솔도 조용하다(tsModal 실사고). 정적 파일 읽기라 1초 미만.
      - name: Verify mobile lazy-mount overlays have an opening path
        run: npm run verify:mobile-lazy-mount-openers

      # 🔴 이것도 **fast 잡**이어야 한다. `fortune/index.html` 단독 수정은 티어가 low/fast 라
      # build 잡이 통째로 스킵된다 — 그런데 이 가드가 잡으려는 것이 바로 "정적 셸을 손으로 고쳐
      # sign-profiles·periods 와 어긋나게 만든" 경우다. build 잡에 두면 지키려던 경로에서만 잠든다.
      # 소스 두 개를 읽어 문자열을 비교할 뿐이라 네트워크 없이 1초 미만이다.
      - name: Verify fortune hub shell matches its source
        run: npm run verify:fortune-hub-shell

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 과 js/core/service-registry.js 라
      # 티어가 low/fast 로 잡히는데, build/critical 잡에 두면 정작 지켜야 할 "홈 가격 라벨 한 줄
      # 수정"에 깨어나지 않는다. 홈 표시가격이 결제 정본(worker/lib/paid-feature-registry.js)과
      # 어긋난 채로 배포된 전력이 있다(IFÀ 오라클: 30코인=3,000원짜리를 5,000원으로 표시,
      # 2026-08-19 실측). 정적 파일 읽기 + 정본 import 라 네트워크 없이 1초 미만이다.
      - name: Verify home service registry matches billing source of truth
        run: npm run verify:home-service-registry

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 하나뿐이라 티어가 low/fast 로 잡히는데,
      # build 잡에 두면 정작 지켜야 할 "홈 히어로 CSS 한 줄 수정"에 깨어나지 않는다.
      # 지키는 것: 히어로 확정 레이아웃이 마크업보다 뒤에 도착해 홈 전체가 446px 밀려 내려가던
      # 회귀(실측 layout-shift 0.5433 → 0.0000, 2026-08-20). 정적 파일 하나를 읽고 두 CSS 블록을
      # 문자열로 대조할 뿐이라 네트워크 없이 1초 미만이다.
      - name: Verify hero first-paint lock matches its authoritative block
        run: npm run verify:hero-firstpaint-lock

      # 🔴 이것도 **fast 잡**이어야 한다 — 2026-08-23 에 critical 잡에서 옮겨 왔다.
      # public/ 미러가 소스보다 낡으면 테스트는 전부 통과하고 사용자만 옛 화면을 본다.
      # 2026-08-20~21 이틀에 세 번 났고 세 번 다 CI 가 아무 말을 안 했다.
      # 그런데 미러의 소스는 index.html·styles/**·js/** 라 티어가 low/fast 로 잡히는 쪽이 많다
      # (scripts/lib/change-risk.mjs: styles/ 는 low). critical 잡에 두면 정작 지켜야 할
      # "CSS 한 줄만 고친 PR" 에서 잡이 통째로 스킵돼 낡은 미러가 그대로 머지된다 — PR #928
      # (styles/mobile-lite.css)이 정확히 그렇게 통과했고, 뒤따르던 critical 티어 PR 들이
      # 대신 연쇄로 빨간불이 됐다(#932 에서 발견, #935 로 수습).
      # 생성기를 한 번 돌려 커밋된 내용과 대조할 뿐이라 네트워크 없이 2초 미만이다.
      - name: Verify public mirrors are fresh
        run: |
          npm run verify:public-mirror-fresh
          npm run verify:public-mirror-fresh -- --self-test

      # 🔴 2026-08-24 릴리스 사고. js/app.js 가 삭제된 모듈을 손으로 박은 `?v=` 로 부르고 있어
      #    엣지가 옛 파일을 계속 서빙했고, 승격 뒤 스모크가 404 로 죽어 릴리스가 자동 롤백됐다.
      #    _headers:342-343 은 "수기 ?v= 금지" 를 이미 글로 적어 두었지만 강제하는 것이 없었다.
      - name: Verify the shell module graph resolves and its cache keys rotate
        run: |
          npm run verify:js-module-graph -- --self-test
          npm run verify:js-module-graph

      # 배선을 검사하는 가드가 배선되지 않으면 농담이 된다. allowlist 만 고쳐 침묵시키는
      # 경로도 여기서 함께 막힌다 — scripts/ 만 바꾸면 critical 티어가 돌지 않는다.
      - name: Verify guard wiring
        run: |
          npm run verify:guard-wiring -- --self-test
          npm run verify:guard-wiring

      # SNS 일일 자동 발행은 공개 채널로 나가는 되돌릴 수 없는 외부 행위다. 이 가드는 실제
      # 발행 없이(fetch 주입) 계약을 고정한다 — 기본값 꺼짐 · 크론이 죽지 않게 throw 금지 ·
      # 봇 토큰이 든 URL 미로깅 · 발행 링크가 sitemap 에 실재 · 새 크론을 만들지 않았는지.
      # 🔴 fast 잡에 둔다: 소스만 읽어 빌드가 필요 없고, scripts/ 나 워크플로만 바뀐 PR 에서
      # critical 티어가 스킵돼도 이 검사는 돌아야 한다.
      - name: Verify SNS daily post contract
        run: npm run verify:sns-daily-post

      # 기능 가이드가 자기 기능으로 가는 1차 동선을 갖고 있는지 본다. /health-report/guide 는
      # 그 동선이 0개인 채로 색인·광고 심사까지 통과했고, 그걸 볼 검사가 하나도 없었다.
      # 🔴 여기(fast 잡)여야 한다 — 소스만 읽으므로 빌드가 필요 없고, app/ 단독 변경이 낮은
      # 티어로 잡혀 build 잡 스텝이 스킵돼도 이 검사는 돌아야 한다.
      - name: Verify guide feature CTA
        run: npm run verify:guide-feature-cta

      # 🔴 이것도 **fast 잡**이어야 한다. `public/i18n/**` 단독 변경은 티어가 low/fast 라 build
      # 잡이 통째로 스킵되는데, 그게 정확히 지키려는 경로다(새 UI 카피를 en.json 에만 넣고 다른
      # 11개 로케일을 빠뜨리는 실수). 이 세 스크립트는 이미 npm run i18n:check 체인 안에 있지만
      # 그 체인은 build-cf-main.mjs 에서 optional:true 로 돈다(2026-07-28 배포 정지 사고 이후
      # 의도적 조치, 되돌리지 않음) — 즉 실패해도 지금까지는 아무 것도 막지 않았다. 여기 fast
      # 잡에 직접 두면 티어 무관 항상 실행되고 필수 체크라 실패 시 병합이 막힌다.
      - name: Verify i18n locale coverage
        run: |
          node scripts/i18n-check.mjs
          node scripts/verify-i18n-public-parity.mjs --all
          npm run verify:i18n-runtime

  build:
    name: Build Pages and Worker
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 🔴 draft PR 은 build:cf·build:worker 를 건너뛴다(2026-08-21) — 티어 스킵과 같은 이유로
    # **스텝**에서만 건너뛴다, 잡 자체를 막지 않는다(브랜치 룰셋 필수 체크는 계속 보고돼야 함).
    # ready_for_review 로 전환되면 그 이벤트가 트리거 목록에 있어 전체 빌드가 자동으로 돈다.
    # lint·typecheck(fast 잡)·critical(결제·보안 테스트)은 draft 여도 그대로 돈다 — 안전 우선.
    steps:
      - name: Skip notice
        if: needs.classify.outputs.runs_build != 'true' || github.event.pull_request.draft == true
        run: echo "::notice::tier=${{ needs.classify.outputs.tier }} draft=${{ github.event.pull_request.draft }} — 빌드를 건너뜁니다(문구·CSS·이미지·문서 변경, 또는 draft PR)."

      - name: Checkout PR head
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm ci

      # build:cf 의 postbuild 가 out/ 을 읽어 AdSense 콘텐츠 게이트를 돌린다. 빌드가 끝나야만
      # 도는 검사라 여기서 함께 잡는다 — 배포 직전에 처음 알게 되면 릴리스가 통째로 막힌다.
      - name: Build Cloudflare Pages output
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run build:cf

      # 색인 대상 라우트의 H1 이 정확히 1개인지 본다. 사이트맵에서 라우트를 전수 발견하므로
      # 새 라우트도 자동으로 걸린다. out/ 을 읽으니 반드시 build:cf 뒤에 둔다.
      - name: Verify SEO heading integrity
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:seo-heading-integrity

      # 위 가드는 **서버 HTML 만** 본다. `page.tsx` 가 h1 을 그리고 같은 라우트의
      # `ssr:false` 클라이언트가 또 h1 을 그리면 서버 HTML 에는 1개뿐이라 통과하고
      # 브라우저에서는 2개가 된다(브라우저 실측 2026-08-28: 10개 라우트가 그랬다).
      # dist/ 와 app/ 소스를 함께 읽으니 반드시 build:cf 뒤에 둔다.
      # 🔴 여기 있어야 하는 이유: verify-guard-wiring 이 "아무 게이트도 안 부르는 검증기" 를
      #    실패시킨다. 이 줄을 지우면 그 가드가 빨간불이 된다.
      - name: Verify hydrated H1 integrity
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:hydrated-h1-integrity

      # 색인 대상 라우트가 "문장급" 본문을 실제로 갖고 있는지 본다. raw 글자수 게이트는 링크
      # 라벨·푸터 공용 문구까지 세기 때문에, 본문이 JS 안에만 있는 라우트를 통과시킨다
      # (2026-08-24 실측: /oracle/ifa 0자 · /saju/love-simulation 0자). dist/ 와 그 안의
      # 사이트맵을 읽으니 반드시 build:cf 뒤에 둔다.
      - name: Verify indexable prose depth
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:indexable-prose-depth

      # 얇은 광고 라우트에 사람이 쓴 편집자 노트가 붙어 있는지 본다. 대상을 out/ 에서 전수
      # 발견하므로 새로 얇아진 라우트도 자동으로 걸린다. out/ 을 읽으니 반드시 build:cf 뒤에 둔다.
      # 🔴 여기 있어야 하는 이유: verify-guard-wiring 이 "아무 게이트도 안 부르는 검증기" 를
      #    실패시킨다. 이 줄을 지우면 그 가드가 다시 빨간불이 된다(지우려면 UNWIRED_BY_DESIGN
      #    에 사유와 함께 옮길 것).
      - name: Verify editor notes
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:editor-notes

      # /fortune/{period}/{sign} 96개가 기간마다 실제로 다른 글을 내보내는지 본다.
      # 소스에서 sign 을 전수 발견하므로 sign 을 늘리고 기간 문안을 빠뜨리면 여기서 걸린다.
      # out/ 을 읽지 않으므로 빌드 앞에 두어도 되지만, 같은 성격의 SEO 가드끼리 모아 둔다.
      - name: Verify fortune period axis
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:fortune-period-axis

      # /fortune 의 회전 문장은 data-cd-trans 로 사전 템플릿을 가리키고, 변수 값이 `@키` 면
      # 런타임이 그 값도 사전에서 풀어 넣는다. 키가 하나라도 없으면 그 자리만 조용히
      # 한국어로 남는다 — 화면을 열어 보지 않으면 모르므로 여기서 막는다. 소스에서
      # 키를 전수 발견하고 템플릿 슬롯과 넘기는 변수 이름이 맞는지도 본다.
      - name: Verify fortune marker keys
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:fortune-marker-keys

      # 번들 1MB 제한과 문법 오류를 업로드 없이 잡는다(--dry-run 은 아무것도 올리지 않는다).
      - name: Build Worker bundle (dry run)
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run build:worker

      - name: Verify Worker size budget
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run verify:worker-size

      # 🔴 배포와 같은 조건에서 돌아야 한다. deploy-safe.mjs:720 은 `risk.level !== "low"` 일 때
      # smoke:core 를 돌리는데, 그 판정은 여기 티어와 **같은 모듈**(scripts/lib/change-risk.mjs)이
      # 낸다 — level!==low 가 곧 runs_build 다. 그런데 PR CI 에는 이 스텝이 없어서, 머지 전에는
      # 아무도 돌리지 않고 배포에서 처음 돌았다.
      - name: Run the core mock smoke tests the release runs
        if: needs.classify.outputs.runs_build == 'true' && github.event.pull_request.draft != true
        run: npm run smoke:core

  critical:
    name: Critical checks
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip notice
        if: needs.classify.outputs.runs_critical != 'true'
        run: echo "::notice::tier=${{ needs.classify.outputs.tier }} — 결제·인증·Worker·DB·배포설정 경로가 걸리지 않아 전체 테스트와 배포 가드를 건너뜁니다."

      - name: Checkout PR head
        if: needs.classify.outputs.runs_critical == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.classify.outputs.runs_critical == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm ci

      # 전체 스위트는 60초 안팎이다. 파일 목록을 손으로 관리하면 새 테스트가 조용히
      # 실행되지 않는 상태로 남는다(2026-08 에 48개 파일이 그랬다).
      - name: Test
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm test

      # 🔴 `deploy:critical` 의 게이트를 머지 전으로 당긴다 (2026-08-24).
      #
      # deploy-safe.mjs:724-729 는 risk=high 이거나 deep 이 걸리면 `npm run deploy:critical` 을
      # 돌린다. 그 판정은 여기 티어와 **같은 모듈**(scripts/lib/change-risk.mjs)이 내므로
      # runs_critical 과 같은 집합이다. 그런데 그 23개 게이트 중 PR CI 에도 있던 것은
      # typecheck·build:worker 둘뿐이었다 — 나머지는 **머지된 뒤 배포에서 처음** 돌았다.
      #
      # 실제로 그 경로로 릴리스가 세 번 죽었다(7e7f05a9 · 72e5c0d4 · ddf032d2, 최근 6실패 중 5건).
      # 전부 verify:worker-no-undef 가 worker/lib 의 미선언 식별자를 잡은 것이고, 전부 PR 은
      # 초록불로 머지됐다. 배포가 막히는 동안 머지한 내용은 스테이징에 도달하지 못한다.
      #
      # 목록을 손으로 지키지 않는다 — verify:guard-wiring 이 package.json 의 deploy:critical 을
      # 파싱해 전수 발견하고, 여기에도 없고 POST_MERGE_BY_DESIGN 선언도 없는 게이트를 실패시킨다.
      - name: Run the deploy-only gates before the merge, not after
        if: needs.classify.outputs.runs_critical == 'true'
        run: |
          npm run verify:worker-no-undef
          npm run verify:env-parity
          npm run verify:no-nested-retry
          npm run verify:mongo-reset-callers
          npm run verify:admin-route-error-context
          npm run verify:analytics-events
          npm run verify:pass-snapshot
          npm run verify:phone-encryption
          npm run verify:signup-phone-required

      # 배포 파이프라인 자체의 회귀. 이 가드가 죽으면 증상이 "배포가 그냥 잘 됨"이라
      # 아무도 모르고, 다음 사고는 프로덕션에서 코드가 사라지는 형태로 온다.
      - name: Verify release pipeline contract
        if: needs.classify.outputs.runs_critical == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run verify:deploy-safe
          npm run verify:pages-single-deploy-guard
          npm run verify:worker-single-deploy
          npm run verify:worker-config-parity
          npm run verify:worker-config-parity -- --self-test
          npm run verify:staging-noindex
          npm run verify:staging-noindex -- --self-test
          # 배선을 지키는 가드와 별개로, 실제 변환기가 하는 일도 픽스처로 증명한다.
          node scripts/apply-staging-noindex.mjs --self-test
          npm run verify:pages-worker-parity-test
          npm run verify:deployed-sha -- --self-test
          npm run verify:merge-landed-test

      # 공개 API 3개(리뷰 목록·요약·오늘의 운세 허브)가 엣지 캐시를 지나는지, 캐시 조회가
      # connectDb 보다 앞인지, 그리고 🔴 생년이 실린 개인화 응답이 그 **공유** 캐시에 새지 않는지.
      # 마지막 것은 사고가 나면 "다음 방문자가 남의 사주를 받는다" 이므로 self-test 를 함께 돌린다.
      - name: Verify public API edge cache
        if: needs.classify.outputs.runs_critical == 'true'
        run: |
          npm run verify:public-api-edge-cache
          npm run verify:public-api-edge-cache -- --self-test
          # 자격증명 단위 캐시(/api/auth/me · /api/profile)는 틀리면 남의 세션이 보인다.
          npm run verify:credential-cache
          npm run verify:credential-cache -- --self-test

      - name: Verify ads.txt is present
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm run verify:ads-txt

      - name: Scan for leaked secrets
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm run verify:no-secret-leak
