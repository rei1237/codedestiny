name: PR CI

# main 에 착지한 모든 변경이 통과해야 하는 관문이다. 프로덕션 배포는 이 워크플로가 아니라
# "Release Cloudflare Pages and Worker" 가 수행한다 — 여기서는 아무것도 배포하지 않는다.
#
# 🔴 2026-09-12 부터 이 레포는 PR 을 쓰지 않는다. 이 워크플로는 main push 에서만 돈다.
#    이름은 필수 체크 이름("CI required")과 함께 고정돼 있어 그대로 둔다.
#
# 🔴 검사 강도는 **변경된 파일 경로**로 정한다. 모든 PR 에 같은 검사를 돌리면 CSS 한 줄 고치는 데
#    전체 회귀를 기다리게 되고, 그러면 게이트를 우회할 방법을 찾게 된다. 반대로 전부 가볍게 하면
#    결제·인증이 무방비가 된다. 판정은 scripts/resolve-ci-tier.mjs 가 하고, 그 정본은
#    scripts/lib/change-risk.mjs 하나다(배포 파이프라인도 같은 모듈을 쓴다).
#
#      fast     — 문구·CSS·이미지                  → typecheck · lint
#      docs-only — 평문/계약 문서                  → 문서 신선도 (+ 계약 문서 정적 가드)
#      standard — 일반 프론트엔드(app/components/js) → + build
#      critical — 결제·인증·Worker·DB·배포설정      → + 전체 테스트 · 배포 가드 · 자동 Preview
#
# 🔴 CI required aggregate 는 항상 실행된다. 각 검증 lane은 변경 범위에 따라 실제로 skip할 수
#    있으며, aggregate 는 성공한 lane과 판정상 skip된 lane을 모두 정상으로 취급한다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_ci:
        description: "경로 판정을 무시하고 critical 티어를 강제한다"
        type: boolean
        default: false

concurrency:
  # 커밋마다 독립 실행이다. main 건강 검사는 서로를 취소하면 안 되므로 끝까지 돈다
  # (앞선 커밋을 취소하면 그 커밋이 검사되지 않은 채 이력에 남는다).
  group: pr-ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  classify:
    name: Risk tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      runs_fast: ${{ steps.tier.outputs.runs_fast }}
      runs_build: ${{ steps.tier.outputs.runs_build }}
      runs_critical: ${{ steps.tier.outputs.runs_critical }}
      runs_guards: ${{ steps.tier.outputs.runs_guards }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 은 유지한다 — 아래 tier 판정이 `git diff --name-only base...head` 로
          # merge-base 를 쓰므로 히스토리를 자르면 판정이 통째로 틀어진다.
          #
          # 대신 blob 만 지연 로딩한다. 이 잡은 파일 "이름" 만 보고 내용은 한 번도 열지 않으므로
          # 블롭이 실제로 페치될 일이 없다. 커밋·트리는 전부 받으므로 base...head 는 그대로 돈다.
          # 근거(2026-09-06 실측, run 34007055500): 이 잡 35s 중 33s 가 체크아웃이고,
          # 같은 레포 build 잡의 얕은 체크아웃은 7s 다(pack 350.11 MiB, 오브젝트 114,654개,
          # 대부분 블롭 — index.html 단독 2.94MB). classify 는 나머지 3개 잡을 막는 직렬 선행이라
          # 여기서 줄인 시간이 그대로 PR 전체 wall-clock 에서 빠진다.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 의존성이 필요 없는 순수 모듈이라 npm ci 를 돌리지 않는다.
      #
      # CD_FORCE_CRITICAL 은 티어를 끌어올리는 탈출구다(수동 실행의 full_ci 입력). 경로만으로는
      # 안 잡히는 변경(예: 정적 셸 index.html 안의 결제 모달 수정)을 사람이 알고 있을 때 쓴다.
      # 올리는 방향으로만 작동한다 — 내리는 길을 만들면 게이트를 끄는 버튼이 된다.
      - name: Resolve verification tier from changed paths
        id: tier
        env:
          PR_BASE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.sha }}
          CD_FORCE_CRITICAL: ${{ inputs.full_ci }}
        run: |
          node scripts/lib/change-risk.mjs --self-test
          node scripts/resolve-ci-tier.mjs --self-test
          node scripts/resolve-ci-tier.mjs

      - name: Verify plain documentation freshness
        if: steps.tier.outputs.runs_fast != 'true'
        run: npm run verify:doc-freshness

      - name: Compare proposed verification plan (shadow only)
        env:
          PR_BASE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.sha }}
          CD_FORCE_CRITICAL: ${{ inputs.full_ci }}
        run: |
          node --test __tests__/release/verification-plan.test.js
          node scripts/check-changed.mjs --ci-shadow --output=verification-plan.json

      - name: Save shadow plan for the 10-PR comparison
        uses: actions/upload-artifact@v4
        with:
          name: verification-plan-${{ github.run_id }}
          path: verification-plan.json
          retention-days: 30

  fast:
    name: Typecheck and lint
    needs: classify
    if: needs.classify.outputs.runs_fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Markdown-only PR은 classify의 문서 검증만 실행한다. 코드가 섞이면 기존 fast lane을 유지한다.
    steps:
      # fetch-depth: 0 은 아래 `lint:changed` 가 base...head 를 계산하기 위해 필요하다.
      # 얕은 체크아웃에서는 base 커밋이 없어 diff 가 통째로 비고, 그러면 이 게이트가
      # 조용히 아무 파일도 검사하지 않는 상태가 된다.
      #
      # 블롭은 지연 로딩한다(classify 잡과 같은 이유, PR #1650). 이 잡이 히스토리 쪽
      # 파일 "내용" 을 여는 곳은 없다 — `lint:changed` 는 scripts/lint-changed-files.mjs:38
      # 의 `git diff --name-only base...head` 로 이름만 뽑고, eslint·typecheck 는 체크아웃된
      # 워킹트리(HEAD)만 본다. 트리 오브젝트는 blob:none 에서도 전부 받으므로 diff 는 그대로 돈다.
      # 🔴 히스토리 블롭을 실제로 읽는 스크립트는 measure-shell-css-externalization.mjs 와
      #    query-retired-pass-tier-aliases.mjs 뿐이고 (`git show <sha>:<file>`), 둘 다 어떤
      #    워크플로에도 배선돼 있지 않다(2026-09-06 `.github/workflows/*.yml` + package.json 전수 확인).
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore TypeScript incremental metadata
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-node24-tsc-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-tsc-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-

      - name: Run the shared fast CI entrypoint
        env:
          PR_BASE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: npm run ci:fast

  guards:
    name: Static guards
    needs: classify
    if: needs.classify.outputs.runs_guards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 평문 문서만 바뀐 PR은 fast lane의 문서 신선도 검사만 실행하고 이 무거운 lane은 skip한다.
    #
    # fast 잡에서 갈라져 나왔다(2026-09-06). 근거: run 34010746934 실측에서 fast 잡 3m27s 중
    # typecheck 44s + lint 22s 와 이 가드들 102s 가 **직렬**이었다. 둘은 서로를 필요로 하지
    # 않으므로 병렬로 돌리면 문구 PR 의 wall-clock 이 잡당 고정비(약 36s) 한 벌만 더 내고
    # 약 69s 줄어든다. 검사는 하나도 줄이지 않았다 — 같은 스텝이 같은 순서로 그대로 있다.
    steps:
      # fast 잡과 같은 체크아웃이다. 일부 가드가 git 을 부르므로(verify:public-mirror-fresh ·
      # verify:business-identity 등) fetch-depth: 0 을 유지하고, 블롭만 지연 로딩한다.
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `verify:quantum-card-cascade`는 실제 브라우저에서 초기 렌더·새로고침·SPA 이동과
      # 모바일 레이아웃을 확인한다. ubuntu-latest 러너에는 Playwright 패키지만 있고
      # 브라우저 바이너리는 기본 제공되지 않으므로, 가드 실행 전에 Chromium을 설치한다.
      # 제3자 Chrome 저장소의 stale index가 --with-deps를 막지 않도록 ephemeral
      # runner에서만 해당 source를 비활성화한 뒤, Playwright OS 의존성 설치는 유지한다.
      - name: Verify Playwright APT source is safe for browser guards
        run: node scripts/verify-playwright-apt-source.mjs

      # 브라우저는 매 런 ~130MB 를 새로 받는다. 잠금파일이 그대로면 같은 버전이므로
      # 캐시에서 복원한다. install 스텝은 그대로 둔다 — 복원돼도 무결성을 확인하고,
      # --with-deps 의 apt 패키지는 캐시 대상이 아니라 매번 필요하다.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium for browser guards
        run: npx playwright install --with-deps chromium

      # 🔴 `test:node` 는 `__tests__/ui/*.test.js` 정적 가드다. jest 는 이것을 돌리지 않고,
      # PR CI 에서는 critical 티어(`npm test`)에서만 돌았다. 그런데 deploy-safe 는 risk=medium
      # 부터 돌린다 — 즉 app/·components/·js/ 만 고친 standard 티어 PR 은 **머지된 뒤에야**
      # 이 검사를 처음 받는다. 2026-08-22 PR #940 이 정확히 그 경로로 통과해 머지되고
      # 스테이징 배포를 3연속 실패시켰다(fusion-fortune.static.test.js 3건).
      #
      # fast 잡에 두는 이유: 이 가드들의 입력은 index.html·js/·styles/ 라 티어가 fast 로
      # 잡히는 변경에서도 깨어나야 한다. 실측 13.7초 / 296 tests (2026-08-23).
      - name: Run the static UI guards the release runs
        run: |
          npm run test:node
          npm run verify:quantum-card-cascade

      # 숙요는 음력 일자표가 아니라 UTC/JD와 연속적인 Swiss 달 황경을 정본으로
      # 사용한다. 시간 경계·27숙 매핑·공개 astronomy 경로를 실제 파일로 확인한다.
      - name: Verify continuous Sukuyo astronomy core
        run: npm run verify:sukuyo-astronomy

      # 🔴 이것은 **fast 잡**이어야 한다. 사이트맵을 어긋나게 만드는 것은 라우트 추가만이
      # 아니라 글 한 편, 공용 컴포넌트 한 줄이다(lastmod 서명이 소스 파일에서 나온다).
      # build 잡에 두면 티어가 fast 로 잡히는 문구·콘텐츠 변경에서 깨어나지 않는데, 그게 정확히
      # 지키려는 경로다. 빌드 산출물을 읽지 않고 소스와 추적본만 비교하므로 몇 초면 끝난다.
      #
      # 왜 필요한가 (2026-08-24 하루에 세 번): 라우트·콘텐츠를 바꾼 PR 이 사이트맵을 함께
      # 갱신하지 않아 ①#1076 의 /ziwei/chart 가 추적본에서 빠진 채 머지돼 헤딩 가드가 그
      # 라우트를 건너뛰었고 ②낡은 추적본으로 검증한 #1079 가 CI 에서 터졌으며 ③#1099 가
      # lastmod 52개를 낡은 채로 남겼다. 기존 verify:sitemap 은 배포 워크플로에만 있어
      # 전부 머지 뒤에야 알 수 있었다.
      - name: Verify the tracked sitemap matches its sources
        run: npm run verify:sitemap-drift

      # 유명인 고유 원고(lib/famous-saju/celebrity-editorial.js)와 다체계 표 모듈의 fail-closed 가드.
      # 원고 분량·출처·엔진 산출값 정합·원고 간 중복도, 그리고 숙요 시각 무관성·1900년 이전 null·
      # 베다 확정/후보 규칙·자미두수 열 부재를 본다. 입력이 lib/·scripts/ 라 티어가 fast 로 잡히므로
      # 여기 둔다. 정적 소스 + 엔진 계산뿐이라 네트워크 없이 수 초다.
      #
      # magazine 은 앞의 둘과 단언이 겹치지 않는다(2026-09-02 대조): 시 미상 3주 명식 분기
      # (birthTimeKnown=false → pillars.hour null · 오행 합계 6 vs 8 · "시 미상" 라벨),
      # 매거진↔엔진 연/월/일주 간지 일치, 상세 페이지 구성요소 12종 존재, 직접 리딩 계약 문장,
      # 기계적 상투구·U+FFFD 금지를 본다. lib/famous-saju/celebrity-saju-service.ts 를 제품 밖에서
      # 실행하는 유일한 코드라 이것이 없으면 그 분기의 단언이 0이 된다.
      - name: Verify celebrity editorial entries and the multi-system table
        run: |
          npm run verify:famous-saju-editorial
          npm run verify:famous-saju-multisystem
          npm run verify:famous-saju-magazine

      # 🔴 이 두 가드는 **fast 잡**에 있어야 한다. 입력이 CSS·정적 셸·package.json 이라
      # build/critical 잡에 두면 `styles/mobile-lite.css` 한 줄 수정에는 깨어나지 않는데,
      # 그게 정확히 지키려는 경로다. 둘 다 node 내장 모듈만 쓰는 정적 파일 읽기라 1초 미만이다.
      - name: Verify mobile detail wrapper is non-intrusive
        run: npm run verify:mobile-detail-nonintrusive

      # 🔴 이것도 같은 이유로 **fast 잡**이다. 입력이 결제창 CSS·정적 셸·사전 JSON 이라
      # 티어가 fast 로 잡히는데, 사전 한 줄만 고쳐도 탭 라벨이 칸을 넘길 수 있다.
      - name: Verify locale text fit
        run: npm run verify:locale-text-fit

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 CSS 모듈과 .tsx 라 티어가 fast 로 잡히는데,
      # build/critical 잡에 두면 정작 지키려는 "스프라이트 크롭 한 줄 수정"에 깨어나지 않는다.
      # 지키는 것: 크롭 수식이 CSS 로 돌아가 길이÷길이 나눗셈(CSS Values 4)을 쓰는 회귀.
      # 그 문법은 Chrome 119+/Safari 17+ 에서만 유효해 최신 브라우저에서는 멀쩡히 보이고
      # 구형 인앱 웹뷰에서만 시트가 원본 크기로 우하단에 붙는다(2026-08-25 네이버 인앱 실사고).
      # 정적 파일 읽기라 네트워크 없이 1초 미만이다.
      - name: Verify sprite crops are computed in JS, not CSS calc
        run: |
          npm run verify:pig-sprite-crop -- --self-test
          npm run verify:pig-sprite-crop
      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 찻집 CSS 모듈과 .tsx 라 티어가 fast 로 잡히는데,
      # build/critical 잡에 두면 정작 지키려는 "연출 한 줄 수정"에 깨어나지 않는다. 정적 파일
      # 읽기라 1초 미만이다.
      # 지키는 것: ① @keyframes 의 transform 에 var() 를 새로 늘리는 것(컴포지터가 그 애니메이션을
      # 못 받아 메인스레드로 내려온다) ② .cdShimmer 애니메이션 선택자를 다시 넓히는 것(안 보이는
      # 카드 78장이 매 프레임 background-position 을 움직인다).
      # 둘 다 **화면이 조용한 결함**이다 — 스크린샷·기능 테스트로는 영영 안 잡히고 기기에서만 렉으로
      # 나타난다. 실측 2026-08-30: 앨범 끊긴 프레임 48.8% → 1.7%, 프롤로그 RecalcStyle 1305 → 839ms.
      - name: Verify the tea house render budget
        run: npm run verify:tea-house-perf-budget

      # 🔴 노벨 가드 둘. 전부 **fast 잡**이어야 한다 — 입력이 정적 셸(public/codedestiny-novel.html)과
      # 정본 JSON 이라 티어가 fast 로 잡히는데, build/critical 잡에 두면 정작 지키려는 "셸 엔진 한 줄
      # 수정"에 깨어나지 않는다. 오래 "실브라우저 필요"로 미배선이었으나 둘 다 jsdom·파일 읽기뿐이고
      # 합쳐 3초 미만이다(실측 2026-08-29 웜 캐시: 0.3s + 1.9s).
      # 지키는 것: ① 연이의 모습(사람↔꽃돼지) 마커표가 정본과 일치 ② 어떤 진입 경로로 들어와도
      # 같은 지점에서 같은 모습이 나오는 것. 이 상태는 **틀려도 화면이 조용하다** — 사람 연이가
      # 멀쩡히 그려지기 때문에, 꽃돼지 구간 25화를 사람으로 읽고도 아무 에러가 안 난다(실사고).
