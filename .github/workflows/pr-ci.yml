      # 31건이 함(X)으로, 원성 함 40건 중 15건이 득(O)으로 나왔다(실측 2026-08-29).
      # 기존 자미 가드 둘은 `if (row.borrowed) continue;` 로 차성을 건너뛰어 이 결함을 못 봤다.
