      # 무엇을 지키나: 셸이 KST 벽시계 부품으로 **로컬 Date 를 조립**하면, 그 벽시계가 그
      # 타임존에 존재하지 않을 때(서머타임 시계 앞당김) JS 가 조용히 다른 시각으로 접어 시주·
      # 일주·월주가 틀어진다. 그 조립을 부품 API 로 옮긴 작업(PR-C~E)의 **저울**이다.
      #   ① TZ=Asia/Seoul 산출물이 픽스처와 전건 같다
      #   ② 버린 표본이 6개 존 전부 0 이고, 접힌 벽시계 수는 census 와 정확히 같다
      #   ③ **제외 없이** 모든 존이 KST 와 같다
      #   ⑭ 공개 표면에 Date 를 받는 함수가 하나도 없다(어댑터가 되살아나는 것을 막는다)
      #   ⑮ 표면을 도는 동안 로컬 Date 조작이 0 건이다(값 대조가 못 보는 자리를 실행으로 덮는다)
      # ✅ "구멍 총계 0" 은 PR-E(Date 진입점 제거)에서 달성했다. 그 대신 접힌 벽시계 수가
      # 0 이 **아님**을 요구한다 — 그것이 매트릭스가 UTC 를 여섯 번 재고 있지 않다는 증거다.
      #
      # 🔴 값 대조와 **별도로 isNull 지도**를 본다. terms 없이 부르는 갈래는 지금 1990년 말고
      # 전부 null 이라(검증캐시가 그 한 해뿐) 값만 보면 이 표면이 통째로 null==null 로 통과한다.
      # 전환 중에 그 표면이 답하기 시작하면 호출부 13곳이 한꺼번에 절기 프레임으로 갈아탄다.
      #
      # 🔴 그 isNull 축에도 사각지대가 있었다 — 실측 2026-08-28: 12벌 중 5벌이 값을 한 칸도 안
      # 날라(투영기가 `{g,j}` 를 못 읽고 calcMeta 의 없는 키를 읽었다) 접어도 안 움직이는 열이었고,
      # 검증캐시 밖에서 null 인 3벌은 live 행이 1516행 중 1행뿐이었다. 그 열들에 로컬 Date 를
      # 심어도 가드가 초록이었다(실측). 지금은 투영기를 고치고(④ 가 상수 열을 실패로 친다),
      # 검증캐시 해를 표본에 넣고, ⑮ 가 값이 아니라 **행위**로 접힘을 잡는다.
      - name: Verify the shell ganji surfaces are timezone-stable
        run: npm run verify:ganji-surface-parity

      # 🔴 이것도 **fast 잡**이다. 절기를 다루는 소스(js/·worker/·app/·lib/)를 전수 발견해
      # CST 애드혹 보정(+3600*1000 · 480분 오프셋)이 되살아났는지 보고, 로컬 절기를 만드는
      # 소비자 5벌을 실제로 실행해 코어와 분 단위로 같은 12節을 내는지 대조한다.
      # 애드혹이라 하나만 빠져도 그 엔진만 1시간 이른 월건 경계를 쓰고, 그 창에 태어난 사람은
      # 월건이 한 칸 밀린 결과를 받는다 — 화면도 콘솔도 조용하다.
      - name: Verify saju solar-term boundaries all come from the core
        run: npm run verify:saju-solar-term-core

      # 🔴 이것도 **fast 잡**이다. 27수는 음력 월·일로 **직접** 결정되므로 음력일이 하루 밀리면
      # 본명숙이 통째로 옆 칸으로 간다(실측 2026-08-27: 1950~2030 29,585일 중 1,055일 3.57%).
      # 숙요를 다루는 소스를 전수 발견해 lunar-javascript 잔존을 분류와 대조하고, 소비자 10벌을
      # 실제로 실행해 **갈리는 날짜에서** 코어 쪽 본명숙을 내는지 본다(낙샤트라 3라우트는 Swiss WASM 을
      # 끌고 와 node 로 직접 import 되지 않아 esbuild 로 번들해 돌린다). 베다 어댑터는 반대 방향인
      # 음력→양력이라 하루가 밀리면 요일이 밀리고 그대로 다른 바라(지배 행성)가 나온다.
      - name: Verify sukuyo lunar dates all come from the core
        run: npm run verify:sukuyo-korean-calendar

      # 숙요 궁합은 "누가 누구에게 어느 자리인지"가 전부인데, 클라 휠과 정본이 갈리면 화면과
      # 상담이 서로 다른 자리를 말한다(성/위 두 줄이 뒤집힌 채 오래 배포돼 있었다). 27거리를
      # 실제로 돌려 대조하고, 같은 관계의 양극이 서로 다른 문장을 내는지까지 실행으로 본다.
      - name: Verify sukuyo role direction stays asymmetric
        run: npm run verify:sukuyo-role-direction

      # 🔴 이것도 **fast 잡**이다. 음력↔양력 변환은 자미두수(자미성)·숙요(본명숙)·휴먼디자인
      # (행성 황경)이 전부 올라타는 축이라, 하루가 밀리면 그 세 결과가 통째로 다른 값이 된다.
      # 변환 API 를 부르는 소스를 전수 발견해 잔존 분류와 대조하고, 소비자 13벌을 실제로 실행해
      # **갈리는 날짜에서** 코어 쪽 날짜를 내는지 본다. 🔴 KASI 로컬 폴백도 여기서 본다 —
      # 그 라우트는 레포가 "권위 있는 한국 달력"으로 삼는 지점이라, 중국 음력이면 업스트림이
      # 죽는 동안에만 조용히 틀린다(실제로 그 상태였다).
      - name: Verify lunar conversions all come from the core
        run: npm run verify:lunar-conversion-core

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 js/saju-engine*.js · js/luck-sync-diary.js ·
      # js/sibyl-system.js 라 티어가 fast/standard 로 갈린다.
      # 위 두 가드는 소스 스캔 + 모듈 실행이라 **정적 셸을 못 본다** — 셸은 ESM 이 아니라 브라우저
      # 전역에 얹히는 한 덩어리 스크립트다(PR-E2 가 정확히 그렇게 셸을 놓쳤다). 이 가드는
      # scripts/lib/ziwei-engine-harness.cjs 의 DOM 부트스트랩으로 셸을 **실제로 평가하되
      # global.Solar/global.Lunar 를 지운 채** 돌린다. 그래서 누가 셸에 EightChar 를 되살리면
      # 조용한 폴백이 아니라 여기서 터진다. 절기 프레임이 갈리는 날을 찾아 값까지 대조하고,
      # 야자시 정책 두 축(오늘 일진=keep-day · 출생 원국=shift-day)이 섞이지 않는지도 본다.
      # 네트워크 없음. 10초 미만.
      - name: Verify the static shell calendar comes from the core
        run: npm run verify:shell-korean-calendar

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 lib/korean-calendar/ · js/saju-engine.js ·
      # worker/lib/ 라 티어가 fast/standard/critical 로 갈린다.
      #
      # 대운의 기운 나이는 **유파마다 절사 관례가 갈린다.** 그래서 이 이관은 "더 정확한 계산"이
      # 아니라 **관례를 그대로 재현하고 달력만 바꾸는 것**이어야 하고, 그 사실을 이 가드가
      # 주장이 아니라 측정으로 지킨다 — 코어의 daeunFromFrame 에 lunar-javascript 자신의
      # 절기·세차·월주를 먹이면 그 라이브러리와 **잔차 0** 이어야 한다(검사 ①, 표본 13,790건).
      # 누가 관례를 "개선"하면 그 순간 여기가 빨간불이 된다.
      # 이어서 KST 절기로 바꿨을 때 값이 실제로 움직이는지(검사 ②), 소비자 3벌(정적 셸 ·
      # life-book 워커)이 코어와 같은 대운을 내는지(검사 ③④)를 실제로 실행해 본다.
      # 네트워크 없음. 30초 미만.
      - name: Verify daeun comes from the core with the same convention
        run: npm run verify:daeun-korean-calendar

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 lib/saju/ 와 worker/lib/life-book-ai-saju.js 라
      # 티어가 fast/critical 로 갈리는데, critical 잡에 두면 정작 지켜야 할 "표 한 줄 수정" 에서
      # 잠든다(resolve-ci-tier 는 worker/routes/ziwei-ai.js 만 critical 로 못 박는다).
      #
      # 달력 가드들과 성격이 정반대다 — 이 표(納音·十神·지장간·오행·十二運星·旬空)는 간지 문자열
      # 조회라 **시간대와 무관**하므로 값이 움직일 이유가 없다. 즉 **값이 바뀌면 정정이 아니라
      # 이관 실수다.** 그런데 그 실수는 조용하다 — 이 파생 필드를 단언하는 테스트가 레포에 하나도
      # 없었다. 그래서 이 가드가 유일한 안전망이고, LunarUtil 과 키 216개를 전수 대조한 뒤
      # 소비자를 실제로 돌려 값까지 맞춘다. 네트워크 없음. 10초 미만.
      - name: Verify the myeongri constant tables still match their source
        run: npm run verify:myeongri-tables

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 worker/lib/ · worker/routes/ · lib/korean-calendar/ 라
      # 티어가 fast/critical 로 갈리는데, critical 잡에 두면 정작 지켜야 할 한 줄 수정에서 잠든다.
      #
      # 23시대 출생의 일진을 어느 날로 볼지는 **유파 결정**이고 이 레포는 표면마다 답이 다르다
      # (정적 셸 shift-day · 앱 기본 keep-day · destiny-bias 는 사용자 선택). 이 가드는 어느 축이
      # 옳은지를 정하지 않는다 — **축이 소스에 명시돼 있고**(코어 기본값에 안 기대고), 실행 결과가
      # 그 축과 일치하며, 23시대에서 두 정책이 실제로 갈리는지를 매번 다시 잰다. 소비자 3벌을
      # 실제로 돌린다. 네트워크 없음. 30초 미만.
      - name: Verify the natal day-pillar axis is declared, not inherited
        run: npm run verify:natal-day-pillar-axis

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 인라인 스크립트와 js/saju-engine*.js 라
      # 티어가 fast/standard 로 갈리는데, build/critical 잡에 두면 정작 지켜야 할 셸 한 줄 수정에
      # 깨어나지 않는다. 모바일 지연 마운트가 오버레이를 DOM 밖으로 들어낸 뒤 여는 경로를 빠뜨리면
      # 그 기능이 통째로 죽는데 화면도 콘솔도 조용하다(tsModal 실사고). 정적 파일 읽기라 1초 미만.
      - name: Verify mobile lazy-mount overlays have an opening path
        run: npm run verify:mobile-lazy-mount-openers

      # 🔴 모바일 back-stack·세션 초안·하단 탭바 여정은 정적 계약만으로는 실제
      # 터치 경로 회귀를 잡을 수 없다. PR 에서도 Playwright 여정 검증을 실행해
      # 새 검증기가 가드 배선에서 빠지지 않도록 한다.
      - name: Verify mobile journeys
        run: npm run verify:mobile-journeys

      # 🔴 이것도 **fast 잡**이어야 한다. `fortune/index.html` 단독 수정은 티어가 low/fast 라
      # build 잡이 통째로 스킵된다 — 그런데 이 가드가 잡으려는 것이 바로 "정적 셸을 손으로 고쳐
      # sign-profiles·periods 와 어긋나게 만든" 경우다. build 잡에 두면 지키려던 경로에서만 잠든다.
      # 소스 두 개를 읽어 문자열을 비교할 뿐이라 네트워크 없이 1초 미만이다.
      - name: Verify fortune hub shell matches its source
        run: npm run verify:fortune-hub-shell

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 과 js/core/service-registry.js 라
      # 티어가 low/fast 로 잡히는데, build/critical 잡에 두면 정작 지켜야 할 "홈 가격 라벨 한 줄
      # 수정"에 깨어나지 않는다. 홈 표시가격이 결제 정본(worker/lib/paid-feature-registry.js)과
      # 어긋난 채로 배포된 전력이 있다(IFÀ 오라클: 30코인=3,000원짜리를 5,000원으로 표시,
      # 2026-08-19 실측). 정적 파일 읽기 + 정본 import 라 네트워크 없이 1초 미만이다.
      - name: Verify home service registry matches billing source of truth
        run: npm run verify:home-service-registry

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 하나뿐이라 티어가 low/fast 로 잡히는데,
      # build 잡에 두면 정작 지켜야 할 "홈 히어로 CSS 한 줄 수정"에 깨어나지 않는다.
      # 지키는 것: 히어로 확정 레이아웃이 마크업보다 뒤에 도착해 홈 전체가 446px 밀려 내려가던
      # 회귀(실측 layout-shift 0.5433 → 0.0000, 2026-08-20). 정적 파일 하나를 읽고 두 CSS 블록을
      # 문자열로 대조할 뿐이라 네트워크 없이 1초 미만이다.
      - name: Verify hero first-paint lock matches its authoritative block
        run: npm run verify:hero-firstpaint-lock

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 하나뿐이라 티어가 low/fast 로 잡히는데,
      # build 잡에 두면 정작 지켜야 할 "인증바 예약 스크립트 한 줄 수정"에 깨어나지 않는다.
      # 지키는 것: 홈 히어로 바로 위 형제 #authQuickLinks 가 게스트 108px 로 그려졌다가 확정
      # 로그인 카드(428~514px)로 통째로 교체되며 히어로를 320px 밀어내던 회귀
      # (실측 2026-08-29 프로덕션 16b294592, 412x823 CPU 4x: 유효 로그인 CLS 0.2865 → 0.0003).
      # 장치가 다리 넷(첫 페인트 스크립트·CSS 규칙·저장·해제)이라 하나만 빠져도 무음으로 죽는다.
      # 정적 파일 하나를 읽고 문자열·순서를 대조할 뿐이라 네트워크 없이 1초 미만이다.
      - name: Verify auth bar first-paint reservation is intact
        run: npm run verify:auth-bar-reservation

      # 🔴 이것도 **fast 잡**이어야 한다. 입력이 index.html 하나뿐이고, 지켜야 할 변경이
      # "오버레이 마크업 한 줄 추가" 라 티어가 low/fast 로 잡힌다.
      # 지키는 것: 셸의 모달은 거의 전부 .wrap(isolation:isolate) 안이라 z-index 로는 body 직속
      # 하단 탭바(z 980)를 못 넘는다. 유일한 해법인 "열리면 탭바를 물린다" 장치가 시빌라 모달에서
      # 관측 트리거 누락으로 안 돌았고, 그래서 리포트 마지막 줄이 탭바에 잘렸다
      # (Playwright 412x823 실측 2026-08-29: 모달을 열고 3.15초를 기다려도 안 물렸고, 무관한
      # body 변이 하나에 그제서야 물렸다 — 상시 버그가 아니라 레이스였다).
      # index.html 을 읽고 jsdom 으로 파싱할 뿐이라 네트워크 없이 2초 미만이다.
      - name: Verify shell overlays hide the bottom tab bar
        run: npm run verify:shell-overlay-nav-coverage

      # 🔴 2026-09-02 에 critical 잡에서 옮겨 왔다 — 위 두 가드와 정확히 같은 이유다.
      # 이 가드가 지키는 것의 대부분(홈 셸 표식 · 동의 배너 앱 억제)은 입력이 index.html 인데
      # change-risk 는 index.html 을 **low** 로 본다(scripts/lib/change-risk.mjs 의 lowPatterns).
      # 그래서 critical 잡에 있는 동안은 "셸만 고친 PR" 에서 잡이 통째로 스킵돼, 정작 지켜야 할
      # 변경에서 한 번도 돌지 않았다. jsdom 으로 analytics.js 를 실행할 뿐 네트워크는 0건이다.
      - name: Verify GA4 instrumentation contract
        run: npm run verify:analytics-events

      # 🔴 이것도 **fast 잡**이어야 한다 — 2026-08-23 에 critical 잡에서 옮겨 왔다.
      # public/ 미러가 소스보다 낡으면 테스트는 전부 통과하고 사용자만 옛 화면을 본다.
      # 2026-08-20~21 이틀에 세 번 났고 세 번 다 CI 가 아무 말을 안 했다.
      # 그런데 미러의 소스는 index.html·styles/**·js/** 라 티어가 low/fast 로 잡히는 쪽이 많다
      # (scripts/lib/change-risk.mjs: styles/ 는 low). critical 잡에 두면 정작 지켜야 할
      # "CSS 한 줄만 고친 PR" 에서 잡이 통째로 스킵돼 낡은 미러가 그대로 머지된다 — PR #928
      # (styles/mobile-lite.css)이 정확히 그렇게 통과했고, 뒤따르던 critical 티어 PR 들이
      # 대신 연쇄로 빨간불이 됐다(#932 에서 발견, #935 로 수습).
      # 생성기를 한 번 돌려 커밋된 내용과 대조할 뿐이라 네트워크 없이 2초 미만이다.
      - name: Verify public mirrors are fresh
        run: |
          npm run verify:public-mirror-fresh
          npm run verify:public-mirror-fresh -- --self-test

      # 🔴 2026-08-24 릴리스 사고. js/app.js 가 삭제된 모듈을 손으로 박은 `?v=` 로 부르고 있어
      #    엣지가 옛 파일을 계속 서빙했고, 승격 뒤 스모크가 404 로 죽어 릴리스가 자동 롤백됐다.
      #    _headers:342-343 은 "수기 ?v= 금지" 를 이미 글로 적어 두었지만 강제하는 것이 없었다.
      - name: Verify the shell module graph resolves and its cache keys rotate
        run: |
          npm run verify:js-module-graph -- --self-test
          npm run verify:js-module-graph

      # 배선을 검사하는 가드가 배선되지 않으면 농담이 된다. allowlist 만 고쳐 침묵시키는
      # 경로도 여기서 함께 막힌다 — scripts/ 만 바꾸면 critical 티어가 돌지 않는다.
      - name: Verify guard wiring
        run: |
          npm run verify:guard-wiring -- --self-test
          npm run verify:guard-wiring

      # 🔴 fast 잡이어야 한다. 이 self-test 는 원래 critical 잡에 있었는데,
      # scripts/verify-merge-landed.mjs 단독 변경은 티어가 standard 라(실측 2026-09-02:
      # resolveTier(['scripts/verify-merge-landed.mjs']) === 'standard') **착지 판정기를
      # 고치는 PR 에서 정확히 그 판정기의 self-test 가 잠들었다.** 워치독이 3단 스택 PR 을
      # 좌초로 오탐해 4시간 내리 빨간불이던 것을 고칠 때 드러났다(#1449).
      - name: Verify landing watchdog verdicts
        run: npm run verify:merge-landed-test

      # SNS 일일 자동 발행은 공개 채널로 나가는 되돌릴 수 없는 외부 행위다. 이 가드는 실제
      # 발행 없이(fetch 주입) 계약을 고정한다 — 기본값 꺼짐 · 채널 모듈(telegram.js·threads.js)은
      # throw 금지 · 반대로 **태스크는 채널이 하나라도 실패하면 throw** 한다(크론 래퍼가 던진 것만
      # 사람에게 알리므로, 2026-08-29 처럼 조용히 0건 발행하는 구멍을 막는 부분이다) ·
      # 봇 토큰이 든 URL 미로깅 · 발행 링크가 sitemap 에 실재 · 새 크론을 만들지 않았는지.
      # 🔴 fast 잡에 둔다: 소스만 읽어 빌드가 필요 없고, scripts/ 나 워크플로만 바뀐 PR 에서
      # critical 티어가 스킵돼도 이 검사는 돌아야 한다.
      - name: Verify SNS daily post contract
        run: npm run verify:sns-daily-post

      # 기능 가이드가 자기 기능으로 가는 1차 동선을 갖고 있는지 본다. /health-report/guide 는
      # 그 동선이 0개인 채로 색인·광고 심사까지 통과했고, 그걸 볼 검사가 하나도 없었다.
      # 🔴 여기(fast 잡)여야 한다 — 소스만 읽으므로 빌드가 필요 없고, app/ 단독 변경이 낮은
      # 티어로 잡혀 build 잡 스텝이 스킵돼도 이 검사는 돌아야 한다.
      - name: Verify guide feature CTA
        run: npm run verify:guide-feature-cta

      # 동적 OG 카드는 요청 파라미터를 그대로 그림으로 그리는 유일한 표면이다. 이 가드는
      # 네트워크도 wasm 도 타지 않고 worker/lib/og-card.js 의 순수 함수를 그대로 돌려
      # image 미수용(SSRF) · 프리셋 화이트리스트 · 길이 상한 · 이스케이프를 고정한다.
      # 🔴 fast 잡이어야 한다: 소스만 읽으므로 빌드가 필요 없고, robots.ts 나 스크립트만
      # 바뀐 PR 에서 critical 티어가 스킵돼도 이 검사는 돌아야 한다.
      - name: Verify dynamic OG route contract
        run: npm run verify:og-route-contract

      # 🔴 이것도 **fast 잡**이어야 한다. `public/i18n/**` 단독 변경은 티어가 low/fast 라 build
      # 잡이 통째로 스킵되는데, 그게 정확히 지키려는 경로다(새 UI 카피를 en.json 에만 넣고 다른
      # 11개 로케일을 빠뜨리는 실수). 이 세 스크립트는 이미 npm run i18n:check 체인 안에 있지만
      # 그 체인은 build-cf-main.mjs 에서 optional:true 로 돈다(2026-07-28 배포 정지 사고 이후
      # 의도적 조치, 되돌리지 않음) — 즉 실패해도 지금까지는 아무 것도 막지 않았다. 여기 fast
      # 잡에 직접 두면 티어 무관 항상 실행되고 필수 체크라 실패 시 병합이 막힌다.
      # 네 번째(verify:feature-marketing-dictionary)는 i18n:check 체인 밖이고 여기가 유일한 배선이다 —
      # 상세 팝업의 한국어 카피(index.html)만 고치고 11개 로케일 사전을 안 고치면 옛 문구가 그대로
      # 남거나 한국어가 샌다. 그 드리프트를 지금까지 아무 가드도 잡지 않았다(2026-09-02).
      # 인수인계 문서는 다음 세션이 "그것만 읽고 시작하는" 물건이라, 상태가 본문에만 있으면
      # 그 상태를 알기 위해 문서를 통째로 읽어야 한다 — 규약이 줄이려던 비용을 규약이 만든다.
      # status·updated·next 세 줄만 강제한다. 규약 정본은 docs/handoff/_TEMPLATE.md.
      # 🔴 여기(fast 잡)여야 한다 — docs/** 단독 변경은 티어가 fast 라 build/critical 잡이
      # 통째로 스킵되는데, 그게 정확히 이 검사가 지켜야 할 경로다.
      - name: Verify handoff frontmatter contract
        run: |
          npm run verify:handoff-contract -- --self-test
          npm run verify:handoff-contract

      - name: Verify i18n locale coverage
        run: |
          node scripts/i18n-check.mjs
          node scripts/verify-i18n-public-parity.mjs --all
          npm run verify:i18n-runtime
          npm run verify:feature-marketing-dictionary

  build:
    name: Build Pages and Worker
    needs: classify
    if: needs.classify.outputs.runs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # build가 필요한 Ready PR만 러너를 점유한다. ready_for_review 전환 시 다시 평가된다.
    steps:
      - name: Checkout PR head
        if: needs.classify.outputs.runs_build == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.classify.outputs.runs_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.runs_build == 'true'
        run: npm ci

      # next 컴파일이 build:cf 166s 중 90.9s 였다(2026-09-06 실측, job 101448056153). 그 대부분이
      # webpack 영속 캐시가 꺼져 있어 매번 전량 재컴파일하는 몫이라 보고, **PR CI 에서만** 켜서 잰다
      # (next.config.mjs 의 NEXT_WEBPACK_FS_CACHE — 릴리스 빌드는 종전대로 캐시 없이 돈다).
      # 🔴 경로가 .next/cache 가 아닌 이유: build:cf 첫 스텝 clean:build 가 .next 를 통째로 지운다.
      # 캐시는 브랜치 스코프라 첫 런은 콜드다 — 같은 PR 의 두 번째 런부터 복원된다.
      - name: Restore webpack build cache
        if: needs.classify.outputs.runs_build == 'true'
        uses: actions/cache@v4
        with:
          path: build-cache/next-webpack
          key: next-webpack-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-webpack-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}-
            next-webpack-${{ runner.os }}-

      # build:cf 의 postbuild 가 out/ 을 읽어 AdSense 콘텐츠 게이트를 돌린다. 빌드가 끝나야만
      # 도는 검사라 여기서 함께 잡는다 — 배포 직전에 처음 알게 되면 릴리스가 통째로 막힌다.
      - name: Build Cloudflare Pages output
        if: needs.classify.outputs.runs_build == 'true'
        env:
          NEXT_WEBPACK_FS_CACHE: "1"
        run: npm run build:cf

      # 색인 대상 라우트의 H1 이 정확히 1개인지 본다. 사이트맵에서 라우트를 전수 발견하므로
      # 새 라우트도 자동으로 걸린다. out/ 을 읽으니 반드시 build:cf 뒤에 둔다.
      - name: Verify SEO heading integrity
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:seo-heading-integrity

      # 위 가드는 **서버 HTML 만** 본다. `page.tsx` 가 h1 을 그리고 같은 라우트의
      # `ssr:false` 클라이언트가 또 h1 을 그리면 서버 HTML 에는 1개뿐이라 통과하고
      # 브라우저에서는 2개가 된다(브라우저 실측 2026-08-28: 10개 라우트가 그랬다).
      # dist/ 와 app/ 소스를 함께 읽으니 반드시 build:cf 뒤에 둔다.
      # 🔴 여기 있어야 하는 이유: verify-guard-wiring 이 "아무 게이트도 안 부르는 검증기" 를
      #    실패시킨다. 이 줄을 지우면 그 가드가 빨간불이 된다.
      - name: Verify hydrated H1 integrity
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:hydrated-h1-integrity

      # 색인 대상 라우트가 "문장급" 본문을 실제로 갖고 있는지 본다. raw 글자수 게이트는 링크
      # 라벨·푸터 공용 문구까지 세기 때문에, 본문이 JS 안에만 있는 라우트를 통과시킨다
      # (2026-08-24 실측: /oracle/ifa 0자 · /saju/love-simulation 0자). dist/ 와 그 안의
      # 사이트맵을 읽으니 반드시 build:cf 뒤에 둔다.
      - name: Verify indexable prose depth
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:indexable-prose-depth

      # 색인 대상 라우트가 홈에서 몇 홉 만에 닿는지 본다. 사이트맵에 넣는 것만으로는 크롤되지
      # 않는다 — 2026-08-30 GSC 실측에서 3홉인 /fortune/{기간}/{sign} 96개 중 92개, 4홉인
      # /stories/* 45개 전부가 노출 0 이었고, 그 141개가 "발견됨 - 미색인" 하한 145와 겹쳤다.
      # dist/ 와 그 안의 사이트맵을 읽으니 반드시 build:cf 뒤에 둔다.
      - name: Verify internal link depth
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:internal-link-depth

      # 얇은 광고 라우트에 사람이 쓴 편집자 노트가 붙어 있는지 본다. 대상을 out/ 에서 전수
      # 발견하므로 새로 얇아진 라우트도 자동으로 걸린다. out/ 을 읽으니 반드시 build:cf 뒤에 둔다.
      # 🔴 여기 있어야 하는 이유: verify-guard-wiring 이 "아무 게이트도 안 부르는 검증기" 를
      #    실패시킨다. 이 줄을 지우면 그 가드가 다시 빨간불이 된다(지우려면 UNWIRED_BY_DESIGN
      #    에 사유와 함께 옮길 것).
      - name: Verify editor notes
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:editor-notes

      # /fortune/{period}/{sign} 96개가 기간마다 실제로 다른 글을 내보내는지 본다.
      # 소스에서 sign 을 전수 발견하므로 sign 을 늘리고 기간 문안을 빠뜨리면 여기서 걸린다.
      # out/ 을 읽지 않으므로 빌드 앞에 두어도 되지만, 같은 성격의 SEO 가드끼리 모아 둔다.
      - name: Verify fortune period axis
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:fortune-period-axis

      # /fortune 의 회전 문장은 data-cd-trans 로 사전 템플릿을 가리키고, 변수 값이 `@키` 면
      # 런타임이 그 값도 사전에서 풀어 넣는다. 키가 하나라도 없으면 그 자리만 조용히
      # 한국어로 남는다 — 화면을 열어 보지 않으면 모르므로 여기서 막는다. 소스에서
      # 키를 전수 발견하고 템플릿 슬롯과 넘기는 변수 이름이 맞는지도 본다.
      - name: Verify fortune marker keys
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:fortune-marker-keys

      # 번들 1MB 제한과 문법 오류를 업로드 없이 잡는다(--dry-run 은 아무것도 올리지 않는다).
      - name: Build Worker bundle (dry run)
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run build:worker

      - name: Verify Worker size budget
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run verify:worker-size

      # 🔴 배포와 같은 조건에서 돌아야 한다. deploy-safe.mjs:720 은 `risk.level !== "low"` 일 때
      # smoke:core 를 돌리는데, 그 판정은 여기 티어와 **같은 모듈**(scripts/lib/change-risk.mjs)이
      # 낸다 — level!==low 가 곧 runs_build 다. 그런데 PR CI 에는 이 스텝이 없어서, 머지 전에는
      # 아무도 돌리지 않고 배포에서 처음 돌았다.
      - name: Run the core mock smoke tests the release runs
        if: needs.classify.outputs.runs_build == 'true'
        run: npm run smoke:core

  critical:
    name: Critical checks
    needs: classify
    if: needs.classify.outputs.runs_critical == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 블롭 지연 로딩 (PR #1650 과 같은 근거). 이 잡의 검사는 전부 워킹트리 대상이다 —
      # `npm test` 와 배포 게이트들은 체크아웃된 HEAD 만 읽고, git 을 부르는 것들도
      # `cat-file -e <sha>^{commit}`(커밋 존재 확인, blob:none 에서도 있음)까지다.
      # fetch-depth: 0 은 그 커밋 확인과 deploy-safe 의 base 대조 때문에 그대로 둔다.
      - name: Checkout PR head
        if: needs.classify.outputs.runs_critical == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        if: needs.classify.outputs.runs_critical == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm ci

      # 전체 스위트는 60초 안팎이다. 파일 목록을 손으로 관리하면 새 테스트가 조용히
      # 실행되지 않는 상태로 남는다(2026-08 에 48개 파일이 그랬다).
      - name: Test
        if: needs.classify.outputs.runs_critical == 'true'
        # test:node already runs in the required guards lane for every tier.
        run: npm run test:jest

      # 🔴 `deploy:critical` 의 게이트를 머지 전으로 당긴다 (2026-08-24).
      #
      # deploy-safe.mjs:724-729 는 risk=high 이거나 deep 이 걸리면 `npm run deploy:critical` 을
      # 돌린다. 그 판정은 여기 티어와 **같은 모듈**(scripts/lib/change-risk.mjs)이 내므로
      # runs_critical 과 같은 집합이다. 그런데 그 23개 게이트 중 PR CI 에도 있던 것은
      # typecheck·build:worker 둘뿐이었다 — 나머지는 **머지된 뒤 배포에서 처음** 돌았다.
      #
      # 실제로 그 경로로 릴리스가 세 번 죽었다(7e7f05a9 · 72e5c0d4 · ddf032d2, 최근 6실패 중 5건).
      # 전부 verify:worker-no-undef 가 worker/lib 의 미선언 식별자를 잡은 것이고, 전부 PR 은
      # 초록불로 머지됐다. 배포가 막히는 동안 머지한 내용은 스테이징에 도달하지 못한다.
      #
      # 목록을 손으로 지키지 않는다 — verify:guard-wiring 이 package.json 의 deploy:critical 을
      # 파싱해 전수 발견하고, 여기에도 없고 POST_MERGE_BY_DESIGN 선언도 없는 게이트를 실패시킨다.
      - name: Run the deploy-only gates before the merge, not after
        if: needs.classify.outputs.runs_critical == 'true'
        run: |
          npm run verify:worker-no-undef
          npm run verify:env-parity
          npm run verify:no-nested-retry
          npm run verify:mongo-reset-callers
          npm run verify:cron-mongo-op-coverage
          npm run verify:cron-mongo-op-coverage -- --self-test
          npm run verify:mongoose-update-pipeline
          npm run verify:mongoose-update-pipeline -- --self-test
          npm run verify:admin-route-error-context
          npm run verify:pass-snapshot
          npm run verify:phone-encryption
          npm run verify:signup-phone-required
          npm run verify:staging-llm-mock

      # 배포 파이프라인 자체의 회귀. 이 가드가 죽으면 증상이 "배포가 그냥 잘 됨"이라
      # 아무도 모르고, 다음 사고는 프로덕션에서 코드가 사라지는 형태로 온다.
      - name: Verify release pipeline contract
        if: needs.classify.outputs.runs_critical == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run verify:deploy-safe
          npm run verify:pages-single-deploy-guard
          npm run verify:worker-single-deploy
          npm run verify:worker-config-parity
          npm run verify:worker-config-parity -- --self-test
          npm run verify:staging-noindex
          npm run verify:staging-noindex -- --self-test
          # 배선을 지키는 가드와 별개로, 실제 변환기가 하는 일도 픽스처로 증명한다.
          node scripts/apply-staging-noindex.mjs --self-test
          npm run verify:pages-worker-parity-test
          npm run verify:deployed-sha -- --self-test

      # 공개 API 3개(리뷰 목록·요약·오늘의 운세 허브)가 엣지 캐시를 지나는지, 캐시 조회가
      # connectDb 보다 앞인지, 그리고 🔴 생년이 실린 개인화 응답이 그 **공유** 캐시에 새지 않는지.
      # 마지막 것은 사고가 나면 "다음 방문자가 남의 사주를 받는다" 이므로 self-test 를 함께 돌린다.
      - name: Verify public API edge cache
        if: needs.classify.outputs.runs_critical == 'true'
        run: |
          npm run verify:public-api-edge-cache
          npm run verify:public-api-edge-cache -- --self-test
          # 자격증명 단위 캐시(/api/auth/me · /api/profile)는 틀리면 남의 세션이 보인다.
          npm run verify:credential-cache
          npm run verify:credential-cache -- --self-test
          # /api/me/access-state 는 캐시 히트 시 인증 DB 왕복을 건너뛴다. 그 대가(탈퇴 판정도 함께
          # 건너뛴다)를 갚는 무효화가 탈퇴 라우트에 붙어 있는지 순서와 함께 본다.
          npm run verify:access-state-cache-order
          npm run verify:access-state-cache-order -- --self-test

      # 요청 경로 Mongo 쿼리 리터럴이 선언 인덱스(models.js schema.indexes + 마이그레이션 createIndex)의
      # 선두 키를 쓰는지. CI 에 DB 가 없어 explain 을 못 돌리므로 정적으로 잡는다 — 08-30 실측에서
      # users {referralCode} 가 가입마다 최대 8회 COLLSCAN 이었고, 그런 쿼리는 머지 전엔 아무도 못 봤다.
      # worker/** 는 change-risk 가 level=high 라 이 잡(runs_critical)이 항상 깨어난다.
      - name: Verify Mongo query shapes match declared indexes
        if: needs.classify.outputs.runs_critical == 'true'
        run: |
          npm run verify:mongo-query-index-shapes
          npm run verify:mongo-query-index-shapes -- --self-test

      - name: Verify ads.txt is present
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm run verify:ads-txt

      - name: Scan for leaked secrets
        if: needs.classify.outputs.runs_critical == 'true'
        run: npm run verify:no-secret-leak

  # 브랜치 룰셋은 내부 잡 이름 여럿 대신 이 한 이름만 요구한다. 내부 병렬화나 잡 분리는
  # ruleset 변경 없이 가능하다.
  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [classify, fast, guards, build, critical]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every executed CI lane to succeed
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          GUARDS_RESULT: ${{ needs.guards.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CRITICAL_RESULT: ${{ needs.critical.result }}
        run: |
          set -euo pipefail
          for result in "$CLASSIFY_RESULT" "$FAST_RESULT" "$GUARDS_RESULT" "$BUILD_RESULT" "$CRITICAL_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::필수 CI lane 이 성공 또는 정상 skip 상태가 아닙니다: $result"
              exit 1
            fi
          done
          echo "모든 필수 CI lane 이 성공했습니다."

