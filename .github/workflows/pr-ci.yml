      # 🔴 이것도 **fast 잡**이어야 한다. 상담 주제 목록이 네 벌(프롬프트 템플릿 · 워커 라벨 ·
      # TOPICS 화이트리스트 · React 선택지)로 손에 맞춰져 있는데, 그중 React 쪽만 고치는 PR 은
