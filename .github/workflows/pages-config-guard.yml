name: Pages Config Guard

# push:main 트리거는 제거했다 — 릴리스 워크플로가 매 머지마다 같은 검사를 이미 돌린다.
# 여기 남은 값은 릴리스 사이에 대시보드에서 설정이 바뀌는 것을 잡는 일일 점검이다.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-config-guard
  cancel-in-progress: true

jobs:
  verify-pages-config:
    name: Verify Cloudflare Pages automatic deployments are disabled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate required Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Check Pages automatic deployment configuration
        run: node scripts/ensure-pages-single-deploy.mjs --check
