name: Main drift watchdog

# main 에 착지한 조합을 검사한다. 최신 base 검증을 요구하는 strict ruleset과 함께,
# 실제 main의 생성 미러를 별도로 확인하는 사후 진단이다.
#
# 🔴 이것은 머지 게이트가 아니다 — 이미 머지된 main 을 보고 실패로 알린다. 막지는 못하지만,
# 드리프트가 "한참 뒤 무관한 PR 이 빨간불이 되는" 형태로 발견되던 것을 몇 분 안의 실패
# 알림으로 바꾼다(실제 사고: PR #928 이 남긴 낡은 미러를 #932 에서야 발견, #935 로 수습).
#
# 미러 생성기는 build-home-funnel.mjs의 parse5 등 npm 의존성을 사용한다.
# PR CI와 같은 lockfile로 설치하고 npm 다운로드 캐시를 재사용한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 연속 머지 때 앞선 실행을 취소해도 안전하다 — 뒤 커밋은 앞 커밋을 포함하므로, 드리프트가
# 남아 있으면 새 실행에서 그대로 걸린다. (배포 워크플로와 달리 이 잡은 아무것도 내보내지
# 않으므로, 취소가 "하지 않은 배포" 로 남는 문제가 없다.)
concurrency:
  group: main-drift-watchdog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Main drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 생성기를 실제로 돌려 커밋된 public/ 미러와 대조한다. 손으로 관리하는 목록이 아니라
      # 정본 생성기의 출력이므로 미러가 늘어도 자동으로 덮인다.
      - name: Verify public mirrors are fresh
        run: npm run verify:public-mirror-fresh

      # 로케일 홈이 정본 index.html 과 같은 마커를 들고 있는지. 릴리스 잡에도 있지만 거기는
      # 사람이 프로덕션 승격을 눌렀을 때뿐이라, 컷오버 이후 그 사이가 며칠씩 비어 있다.
      - name: Verify locale mirrors match main
        run: npm run verify:locale-main-sync

      - name: Explain the failure
        if: failure()
        run: |
          {
            echo "### main 드리프트 검사 실패"
            echo ""
            echo "- 커밋: \`${GITHUB_SHA}\`"
            echo "- 실패한 step과 로그에서 설치/환경 오류인지 실제 생성 미러 차이인지 먼저 확인할 것."
            echo "- 격리 브랜치에서 \`npm ci\`, \`npm run verify:public-mirror-fresh\`, \`npm run verify:locale-main-sync\` 로 재현할 것."
            echo "- 실제 미러 차이일 때만 \`npm run sync:public\` 으로 재생성하고 PR 로 수정할 것(검증은 PR CI 가 한다)."
          } >> "$GITHUB_STEP_SUMMARY"
