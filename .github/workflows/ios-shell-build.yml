name: iOS Shell Build

# iOS Capacitor 셸을 macOS 러너에서 컴파일하고 시뮬레이터에서 띄워 본다(docs/ios/phase-reports/phase-3.md 6절 대체).
# 🔴 게이트가 아니다. `CI required` 집계나 다른 필수 검사에 엮지 않는다. 시크릿을 쓰지 않고 서명도 하지 않는다.
# 트리거는 수동 실행과, iOS 셸 경로를 건드린 main push 로 한정한다.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/ios/**"
      - "apps/mobile/capacitor.config.ts"
      - "apps/mobile/package.json"
      - ".github/workflows/ios-shell-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-shell-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build and launch on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 앱 번들(dist/). 웹 배포와 같은 빌드에 앱 전용 후처리를 더한다. 시크릿이 필요 없다.
      - name: Build mobile web bundle
        run: npm run build:mobile:app

      # CapApp-SPM/Package.swift 가 apps/mobile/node_modules 의 플러그인을 경로로 참조한다.
      - name: Install app native dependencies
        run: npm install --prefix apps/mobile --no-package-lock --ignore-scripts

      # 러너에서 다시 생성되는 파일(Package.swift, public/, capacitor.config.json)은 커밋하지 않는다.
      - name: Capacitor sync
        working-directory: apps/mobile
        run: ../../node_modules/.bin/cap sync ios

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build for simulator (unsigned)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ios"
          xcodebuild \
            -project apps/mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios/xcodebuild.log" | grep -E "error:|warning:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/ios/xcodebuild.log"

      - name: Collect shell warnings
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ios"
          grep -E "CodeDestinyViewController\.swift:[0-9]+:[0-9]+: (warning|error):" "$RUNNER_TEMP/ios/xcodebuild.log" | sort -u > "$RUNNER_TEMP/ios/shell-diagnostics.txt" || true
          echo "### CodeDestinyViewController.swift diagnostics" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/ios/shell-diagnostics.txt" ]; then
            sed 's/^/    /' "$RUNNER_TEMP/ios/shell-diagnostics.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "none" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 홈(정적 화면)만 연다. 유료 생성 API 를 부르는 화면으로 이동하지 않는다.
      - name: Launch on simulator
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios"
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          UDID=$(xcrun simctl list devices available -j | node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const version = (key) => (key.match(/iOS-(\d+)-(\d+)/) || []).slice(1).map(Number);
            const runtimes = Object.keys(data).filter((key) => /SimRuntime\.iOS-/.test(key))
              .sort((a, b) => { const [x1, y1] = version(a); const [x2, y2] = version(b); return x2 - x1 || y2 - y1; });
            for (const key of runtimes) {
              const device = data[key].find((d) => d.isAvailable && /^iPhone \d+( Pro)?$/.test(d.name))
                || data[key].find((d) => d.isAvailable && /^iPhone/.test(d.name));
              if (device) { console.error(`${device.name} ${key}`); console.log(device.udid); process.exit(0); }
            }
            process.exit(1);
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --stdout="$OUT/app-stdout.log" --stderr="$OUT/app-stderr.log" "$UDID" com.codedestiny.app -cdSelfTest
          # 셀프 테스트는 capacitorDidLoad 15초 뒤에 찍힌다.
          sleep 30
          xcrun simctl io "$UDID" screenshot "$OUT/home.png"
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "com.codedestiny.app"; then
            echo "running" > "$OUT/process.txt"
          else
            echo "not running" > "$OUT/process.txt"
          fi
          # 커스텀 스킴 복귀 경로(로그인 복귀)가 앱을 깨우는지 본다. 웹이 처리하지 못해도 앱은 살아 있어야 한다.
          xcrun simctl openurl "$UDID" "com.codedestiny.app://auth?ci_probe=1" || echo "openurl failed" >> "$OUT/process.txt"
          sleep 8
          xcrun simctl io "$UDID" screenshot "$OUT/after-openurl.png"
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "com.codedestiny.app"; then
            echo "running after openurl" >> "$OUT/process.txt"
          else
            echo "not running after openurl" >> "$OUT/process.txt"
          fi
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "App"' > "$OUT/app-oslog.log" || true
          grep -h "cd-selftest" "$OUT/app-oslog.log" "$OUT/app-stderr.log" "$OUT/app-stdout.log" | sort -u > "$OUT/selftest.txt" || true
          grep -hE "⚡️|ERROR|Error|error" "$OUT/app-stdout.log" "$OUT/app-stderr.log" | head -n 200 > "$OUT/console-highlights.txt" || true
          {
            echo "### Simulator"
            echo '```'
            cat "$OUT/process.txt"
            echo "--- selftest"
            cat "$OUT/selftest.txt"
            echo "--- console highlights (first 40)"
            head -n 40 "$OUT/console-highlights.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -qx "running" "$OUT/process.txt"
          grep -q "running after openurl" "$OUT/process.txt"
          ! grep -q "not running after openurl" "$OUT/process.txt"

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-${{ github.run_id }}
          path: ${{ runner.temp }}/ios
          retention-days: 14
          if-no-files-found: warn
