name: Integrity CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Security audit (high+)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run bundle:budget
