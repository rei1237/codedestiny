name: Docs Freshness Gate

on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "PROJECT_STRUCTURE.md"
      - "PAYMENT_POLICY.md"
      - "PAYMENT_CONCURRENCY_AUDIT.md"
      - "CLOUDFLARE_PAGES_SETUP.md"
      - "DEPLOY_CHECKLIST.md"
      - "docs/**"
      - "app/**"
      - "worker/**"
      - "lib/**"
      - "js/**"
      - "styles/**"
      - "server/**"
      - "public/**"
      - "__tests__/**"
      - "index.html"
      - "PhysiognomyUI.js"
      - "_headers"
      - "package.json"
      - "scripts/verify-doc-freshness.mjs"
      - ".github/workflows/docs-freshness-gate.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "PROJECT_STRUCTURE.md"
      - "PAYMENT_POLICY.md"
      - "PAYMENT_CONCURRENCY_AUDIT.md"
      - "CLOUDFLARE_PAGES_SETUP.md"
      - "DEPLOY_CHECKLIST.md"
      - "docs/**"
      - "app/**"
      - "worker/**"
      - "lib/**"
      - "js/**"
      - "styles/**"
      - "server/**"
      - "public/**"
      - "__tests__/**"
      - "index.html"
      - "PhysiognomyUI.js"
      - "_headers"
      - "package.json"
      - "scripts/verify-doc-freshness.mjs"
      - ".github/workflows/docs-freshness-gate.yml"
  workflow_dispatch:

concurrency:
  group: docs-freshness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-freshness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify doc freshness
        run: npm run verify:doc-freshness
