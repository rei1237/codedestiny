name: Lighthouse CI

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI (production URL)
        run: npx lhci autorun --collect.url=https://code-destiny.com --collect.numberOfRuns=3 --assert.assertions.categories:performance=warn --assert.assertions.categories:accessibility=warn --assert.assertions.categories:best-practices=warn --assert.assertions.categories:seo=warn
