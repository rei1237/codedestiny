name: PR Preview

# 프리뷰는 **기본 흐름에서 빠져 있다.** PR 에 `preview` 라벨을 붙였을 때만 만든다.
#
# 🔴 왜 자동으로 만들지 않는가 — 두 가지 이유가 있고, 둘째가 더 중요하다.
#
#   ① 매 실행이 Cloudflare 에 Pages 배포 1건과 Worker 버전 1건을 남긴다. 커밋마다 만들면
#      한 PR 에 아티팩트가 수십 쌍 쌓인다.
#
#   ② **프리뷰는 결제·인증·Worker 변경을 검증하지 못한다.** Worker 프리뷰 버전은 라우팅되지
#      않으므로 프리뷰 URL 의 `/api/*` 는 **지금 라이브인 워커**(옛 코드)가 응답한다. 그리고
#      프리뷰의 `/api` 는 프로덕션 DB 를 본다 — 샌드박스가 아니다. 즉 위험한 변경일수록
#      프리뷰가 답을 줄 수 없다. 한때 critical 티어에 프리뷰를 자동으로 걸어 두었는데,
#      그건 비용만 내고 얻는 것이 없는 배치였다(2026-08-11 에 제거).
#
# 프리뷰가 실제로 값을 하는 경우는 하나다: **화면이 바뀌는 프런트엔드 변경을 눈으로 볼 때.**
# 그때만 라벨을 붙인다. 나머지 검증은 PR CI 가, 배포 후 확인은 릴리스의 스모크와 SHA 대조가 한다.
#
# 프로덕션은 절대 건드리지 않는다(--preview-only). 승격은 main 머지 이후 릴리스 워크플로만 한다.
on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Cloudflare preview
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'code-destiny-web' }}
      CD_PRODUCTION_ORIGIN: ${{ vars.CD_PRODUCTION_ORIGIN || 'https://code-destiny.com' }}
      # 프리뷰는 브랜치 팁을 통째로 올린다. 변경 집합이 비어도 중단하지 않는다.
      CD_ALLOW_EMPTY_CHANGESET: "true"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # --preview-only 는 Pages 프리뷰 + Worker 프리뷰 버전만 만들고 스모크까지 돌린 뒤 멈춘다.
      # 프로덕션 별칭은 전혀 건드리지 않는다.
      - name: Build, upload preview, and smoke
        run: npm run deploy:safe -- --ci --preview-only

      - name: Read preview URLs
        id: urls
        run: node scripts/print-deploy-state.mjs --require=preview

      - name: Comment the preview URL on the PR
        uses: actions/github-script@v7
        env:
          PAGES_URL: ${{ steps.urls.outputs.pages_url }}
        with:
          script: |
            const pages = process.env.PAGES_URL || '(없음)';
            const marker = '<!-- cd-preview -->';
            const body = [
              marker,
              '### 🔍 Preview 준비 완료',
              '',
              `- **Pages**: ${pages}`,
              `- **커밋**: \`${context.payload.pull_request.head.sha.slice(0, 12)}\``,
              '',
              '> ⚠️ **화면 확인용입니다.** Worker 프리뷰 버전은 라우팅되지 않으므로 이 URL 의 `/api/*` 는 **지금 라이브인 워커**가 응답합니다 — 워커·결제·인증 쪽 변경은 여기서 확인되지 않습니다.',
              '> ⚠️ `/api` 는 **프로덕션 DB** 를 봅니다. 여기서 하는 결제·해금은 실제 기록으로 남습니다.',
              '',
              '확인이 끝나고 문제가 없으면 이 PR 을 머지하세요. 머지되면 같은 커밋이 자동으로 프로덕션에 배포됩니다.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body });
            }
