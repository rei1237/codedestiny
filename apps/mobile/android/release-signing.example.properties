# Copy this file to release-signing.properties.
# Do not commit release-signing.properties or any keystore file.

# Increase CODE_DESTINY_ANDROID_VERSION_CODE before every Google Play upload.
CODE_DESTINY_ANDROID_VERSION_CODE=1

# Human-readable app version shown in Play Console.
CODE_DESTINY_ANDROID_VERSION_NAME=1.0.0

# Recommended external location:
# C:\\Users\\your-name\\Documents\\CodeDestinyKeys\\upload-keystore.jks
CODE_DESTINY_ANDROID_KEYSTORE_FILE=C:\\Users\\your-name\\Documents\\CodeDestinyKeys\\upload-keystore.jks

# Values below must be the passwords and alias created by keytool.
CODE_DESTINY_ANDROID_KEYSTORE_PASSWORD=replace-with-upload-store-password
CODE_DESTINY_ANDROID_KEY_ALIAS=upload
CODE_DESTINY_ANDROID_KEY_PASSWORD=replace-with-upload-key-password
