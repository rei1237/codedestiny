apply plugin: 'com.android.application'

def codeDestinySigningProps = new Properties()
def codeDestinySigningPropsFile = rootProject.file('release-signing.properties')
if (codeDestinySigningPropsFile.exists()) {
    codeDestinySigningPropsFile.withInputStream { codeDestinySigningProps.load(it) }
}

def readMobileConfig = { String name, String fallback = '' ->
    def fromProject = project.findProperty(name)
    if (fromProject != null && String.valueOf(fromProject).trim()) return String.valueOf(fromProject).trim()
    def fromEnv = System.getenv(name)
    if (fromEnv != null && fromEnv.trim()) return fromEnv.trim()
    def fromProps = codeDestinySigningProps.getProperty(name)
    if (fromProps != null && fromProps.trim()) return fromProps.trim()
    return fallback
}

def readMobileInt = { String name, int fallback ->
    try {
        return Integer.parseInt(readMobileConfig(name, String.valueOf(fallback)))
    } catch (Exception ignored) {
        return fallback
    }
}

def resolveReleaseStoreFile = { String configuredPath ->
    if (!configuredPath) return null
    def expandedPath = configuredPath.startsWith('~')
            ? System.getProperty('user.home') + configuredPath.substring(1)
            : configuredPath
    def candidate = file(expandedPath)
    if (!candidate.exists()) {
        candidate = rootProject.file(expandedPath)
    }
    return candidate
}

def releaseStoreFilePath = readMobileConfig('CODE_DESTINY_ANDROID_KEYSTORE_FILE', readMobileConfig('storeFile', ''))
def releaseStoreFile = resolveReleaseStoreFile(releaseStoreFilePath)
def releaseKeyAlias = readMobileConfig('CODE_DESTINY_ANDROID_KEY_ALIAS', readMobileConfig('keyAlias', ''))
def releaseStorePassword = readMobileConfig('CODE_DESTINY_ANDROID_KEYSTORE_PASSWORD', readMobileConfig('storePassword', ''))
def releaseKeyPassword = readMobileConfig('CODE_DESTINY_ANDROID_KEY_PASSWORD', readMobileConfig('keyPassword', ''))
def missingReleaseSigningItems = []
if (!releaseStoreFilePath) missingReleaseSigningItems.add('CODE_DESTINY_ANDROID_KEYSTORE_FILE')
if (releaseStoreFilePath && (releaseStoreFile == null || !releaseStoreFile.exists())) missingReleaseSigningItems.add("keystore file not found: ${releaseStoreFilePath}")
if (!releaseKeyAlias) missingReleaseSigningItems.add('CODE_DESTINY_ANDROID_KEY_ALIAS')
if (!releaseStorePassword) missingReleaseSigningItems.add('CODE_DESTINY_ANDROID_KEYSTORE_PASSWORD')
if (!releaseKeyPassword) missingReleaseSigningItems.add('CODE_DESTINY_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = missingReleaseSigningItems.isEmpty()

gradle.taskGraph.whenReady { taskGraph ->
    def releasePackageTasks = taskGraph.allTasks.findAll { task ->
        task.path == ':app:bundleRelease' || task.path == ':app:assembleRelease'
    }
    if (!releasePackageTasks.isEmpty() && !hasReleaseSigning) {
        throw new GradleException("""Code Destiny Android release signing is not configured.
Missing: ${missingReleaseSigningItems.join(', ')}
Create apps/mobile/android/release-signing.properties from release-signing.example.properties, or set CODE_DESTINY_ANDROID_* environment variables.
Release builds are not allowed to fall back to debug signing.""".stripIndent().trim())
    }
}

android {
    namespace = "com.codedestiny.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.codedestiny.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode readMobileInt('CODE_DESTINY_ANDROID_VERSION_CODE', 1)
        versionName readMobileConfig('CODE_DESTINY_ANDROID_VERSION_NAME', '1.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // CodeDestinyNavigationPlugin 이 커스텀탭을 직접 띄운다. @capacitor/browser 도 같은 라이브러리를
    // 쓰지만 그쪽은 implementation 이라 앱 모듈 컴파일 클래스패스에 노출되지 않는다.
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    // MainActivity 에서 WebView 알고리즘 다크닝을 끈다(시스템 다크모드에서 첫 페인트 다크 방지).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.android.billingclient:billing:9.1.0"
    // Zero-Tap Sign-In(Play 2027-04 필수) — CodeDestinyCredentialsPlugin. Restore Credentials 는
    // API 28+/Google Play services 에서만 동작하므로 플러그인이 isAvailable 로 게이트한다.
    // play-services-auth 계열(auth·fido·auth-blockstore·identity-credentials·googleid)은 전이로 들어온다.
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
