apply plugin: 'com.android.application'

def codeDestinySigningProps = new Properties()
def codeDestinySigningPropsFile = rootProject.file('release-signing.properties')
if (codeDestinySigningPropsFile.exists()) {
    codeDestinySigningPropsFile.withInputStream { codeDestinySigningProps.load(it) }
}

def readMobileConfig = { String name, String fallback = '' ->
    def fromProject = project.findProperty(name)
    if (fromProject != null && String.valueOf(fromProject).trim()) return String.valueOf(fromProject).trim()
    def fromEnv = System.getenv(name)
    if (fromEnv != null && fromEnv.trim()) return fromEnv.trim()
    def fromProps = codeDestinySigningProps.getProperty(name)
    if (fromProps != null && fromProps.trim()) return fromProps.trim()
    return fallback
}

def readMobileInt = { String name, int fallback ->
    try {
        return Integer.parseInt(readMobileConfig(name, String.valueOf(fallback)))
    } catch (Exception ignored) {
        return fallback
    }
}

def releaseStoreFilePath = readMobileConfig('CODE_DESTINY_ANDROID_KEYSTORE_FILE', readMobileConfig('storeFile', ''))
def releaseStoreFile = releaseStoreFilePath ? file(releaseStoreFilePath) : null
if (releaseStoreFilePath && !releaseStoreFile.exists()) {
    releaseStoreFile = rootProject.file(releaseStoreFilePath)
}
def releaseKeyAlias = readMobileConfig('CODE_DESTINY_ANDROID_KEY_ALIAS', readMobileConfig('keyAlias', ''))
def releaseStorePassword = readMobileConfig('CODE_DESTINY_ANDROID_KEYSTORE_PASSWORD', readMobileConfig('storePassword', ''))
def releaseKeyPassword = readMobileConfig('CODE_DESTINY_ANDROID_KEY_PASSWORD', readMobileConfig('keyPassword', ''))
def hasReleaseSigning = releaseStoreFilePath && releaseStoreFile.exists() && releaseKeyAlias && releaseStorePassword && releaseKeyPassword

android {
    namespace = "com.codedestiny.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.codedestiny.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode readMobileInt('CODE_DESTINY_ANDROID_VERSION_CODE', 1)
        versionName readMobileConfig('CODE_DESTINY_ANDROID_VERSION_NAME', '1.0')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.android.billingclient:billing:9.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
