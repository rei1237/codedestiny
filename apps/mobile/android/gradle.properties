# =======================================================
# Vibe Coding Optimized gradle.properties
# =======================================================

# 1. 빌드 속도 및 캐싱 최적화 (AI 수정 시 대기 시간 최소화)
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# 2. 파일 시스템 감시 (코드 변경 사항을 즉각적으로 감지하여 Sync 속도 향상)
org.gradle.vfs.watch=true

# 3. 메모리 및 가비지 컬렉터 최적화 (IDE 버벅임 방지)
# AI 에디터 자체가 메모리를 많이 사용하므로 Gradle의 메모리 누수를 방지하고 넉넉하게 할당
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 4. 경고 메시지 간소화 (AI가 에러 로그를 읽을 때 방해되지 않도록 설정)
org.gradle.warning.mode=summary

# =======================================================
# 안드로이드 (Capacitor) 필수 설정
# =======================================================
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
