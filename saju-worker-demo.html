<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사주 계산 - Web Worker 오프로드 데모</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
      color: #e8dfc8;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(26, 26, 46, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #d4af37;
      margin-bottom: 8px;
      font-size: 2rem;
    }
    .subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #ffd700;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #ffd700;
      background: rgba(255, 255, 255, 0.12);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-row .form-group {
      margin-bottom: 0;
    }
    button {
      background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);
      color: #0a0e27;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 0.8px;
      transition: all 0.3s ease;
      width: 100%;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result-container {
      margin-top: 40px;
      padding: 24px;
      background: rgba(155, 143, 212, 0.08);
      border: 1px solid rgba(155, 143, 212, 0.3);
      border-radius: 12px;
      min-height: 200px;
    }
    .result-title {
      color: #c4b5fd;
      font-weight: 700;
      margin-bottom: 16px;
      font-size: 15px;
      letter-spacing: 0.8px;
    }
    .result-item {
      display: grid;
      grid-template-columns: 150px 1fr;
      margin-bottom: 12px;
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .result-item:last-child {
      border-bottom: none;
    }
    .result-label {
      color: #ffd700;
      font-weight: 600;
      font-size: 13px;
    }
    .result-value {
      color: #e8dfc8;
      font-size: 13px;
    }
    .loading {
      text-align: center;
      color: #999;
      font-size: 14px;
      padding: 20px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .error {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.4);
      color: #fca5a5;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 13px;
    }
    .success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 13px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .perf-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
      font-size: 12px;
    }
    .perf-item {
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      border-left: 3px solid #d4af37;
    }
    .perf-label {
      color: #999;
    }
    .perf-value {
      color: #86efac;
      font-weight: 700;
      font-size: 13px;
      margin-top: 4px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📿 사주 계산 (Web Worker 오프로드)</h1>
    <p class="subtitle">메인 스레드 블로킹 없이 백그라운드에서 사주 계산 수행 • 목표: 2초 이내 응답</p>

    <form id="sajuForm">
      <div class="form-row">
        <div class="form-group">
          <label for="birthDate">생년월일 *</label>
          <input type="date" id="birthDate" name="birthDate" autocomplete="bday" required />
        </div>
        <div class="form-group">
          <label for="birthTime">생시 (시:분)</label>
          <input type="time" id="birthTime" name="birthTime" autocomplete="off" value="12:00" />
        </div>
        <div class="form-group">
          <label for="gender">성별</label>
          <select id="gender" name="gender" autocomplete="sex">
            <option value="M">남</option>
            <option value="F">여</option>
          </select>
        </div>
      </div>
      <button type="submit" id="submitBtn">⚡ Web Worker로 계산</button>
    </form>

    <div id="message" class="success hidden"></div>
    <div id="error" class="error hidden"></div>

    <div id="resultContainer" class="result-container hidden">
      <div class="result-title">✨ 사주 계산 결과</div>
      <div id="resultContent"></div>
      <div id="perfInfo" class="perf-info"></div>
    </div>
  </div>

  <!-- ═════════════════════════════════════════════════════════════ -->
  <!-- Web Worker 서비스 로드 (필수) -->
  <!-- ═════════════════════════════════════════════════════════════ -->
  <script src="/js/services/sajuWorkerService.js"></script>

  <script>
    // Form 제출 핸들러
    document.getElementById('sajuForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const birthDate = document.getElementById('birthDate').value;
      const birthTime = document.getElementById('birthTime').value;
      const gender = document.getElementById('gender').value;

      // UI 상태 초기화
      hideErrors();
      showMessage('📊 사주 계산 중...');
      document.getElementById('resultContainer').classList.add('hidden');
      document.getElementById('submitBtn').disabled = true;

      // 성능 측정 시작
      const startTime = performance.now();

      try {
        // ⚡ Web Worker를 통한 사주 계산 (메인 스레드 블로킹 없음)
        const result = await window.sajuWorkerService.calculateSaju({
          birthDate,
          birthTime,
          gender
        });

        const endTime = performance.now();
        const calculationTime = (endTime - startTime).toFixed(2);

        if (result && !result.error) {
          displayResult(result, calculationTime);
          showMessage(
            `✅ 계산 완료 (${calculationTime}ms)\n메인 스레드는 반응형 상태 유지!`,
            'success'
          );
        } else {
          showError(result?.error || '계산 실패');
        }
      } catch (err) {
        showError(`오류: ${err.message}`);
      } finally {
        document.getElementById('submitBtn').disabled = false;
      }
    });

    // 결과 표시
    function displayResult(result, calcTime) {
      const container = document.getElementById('resultContainer');
      const content = document.getElementById('resultContent');

      let html = '';

      // 기본 정보
      html += `
        <div class="result-item">
          <div class="result-label">생년월일</div>
          <div class="result-value">${result.birthDate}</div>
        </div>
        <div class="result-item">
          <div class="result-label">생시</div>
          <div class="result-value">${result.birthTime}</div>
        </div>
        <div class="result-item">
          <div class="result-label">성별</div>
          <div class="result-value">${result.gender === 'M' ? '남' : '여'}</div>
        </div>
      `;

      // 음력
      if (result.lunar) {
        const lunarStr = `${result.lunar.year}년 ${result.lunar.month}월 ${result.lunar.day}일${result.lunar.isLeap ? ' (윤달)' : ''}`;
        html += `
          <div class="result-item">
            <div class="result-label">음력</div>
            <div class="result-value">${lunarStr}</div>
          </div>
        `;
      }

      // 천간지지
      if (result.ganji) {
        html += `
          <div class="result-item">
            <div class="result-label">년주(年柱)</div>
            <div class="result-value">${result.ganji.year}</div>
          </div>
          <div class="result-item">
            <div class="result-label">월주(月柱)</div>
            <div class="result-value">${result.ganji.month}</div>
          </div>
          <div class="result-item">
            <div class="result-label">일주(日柱)</div>
            <div class="result-value">${result.ganji.day}</div>
          </div>
          <div class="result-item">
            <div class="result-label">시주(時柱)</div>
            <div class="result-value">${result.ganji.hour}</div>
          </div>
        `;
      }

      content.innerHTML = html;

      // 성능 정보
      const perfInfo = document.getElementById('perfInfo');
      perfInfo.innerHTML = `
        <div class="perf-item">
          <div class="perf-label">⚡ 워커 계산 시간</div>
          <div class="perf-value">${calcTime}ms</div>
        </div>
        <div class="perf-item">
          <div class="perf-label">📌 메인 스레드</div>
          <div class="perf-value">반응형 유지 ✅</div>
        </div>
      `;

      container.classList.remove('hidden');
    }

    // UI 유틸리티
    function showMessage(msg, type = 'info') {
      const el = document.getElementById('message');
      el.textContent = msg;
      el.className = 'success';
      if (type === 'info') el.className = 'success hidden';
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = '⚠️ ' + msg;
      el.classList.remove('hidden');
    }

    function hideErrors() {
      document.getElementById('error').classList.add('hidden');
    }

    // 페이지 로드 시 워커 초기화
    window.addEventListener('load', () => {
      if (window.sajuWorkerService) {
        window.sajuWorkerService.init();
      }
    });

    // 기본값 설정 (오늘 날짜)
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('birthDate').value = today;
    });
  </script>
</body>
</html>
