<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운명의 찻집 · 사주 상담</title><style>body{max-width:540px;margin:24px auto;background:#f6ede7;color:#443842;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>운명의 찻집 · 사주 상담</h1><img src="01-a-question-at-the-table.png" alt="사주 책을 펼친 공식 연이 그림과 반복되는 고민을 묻는 표지."><img src="02-begin-with-your-situation.png" alt="이직 질문을 현재 상황, 망설이는 조건, 원하는 변화로 구체화하는 질문 노트."><img src="03-the-basis-of-the-reading.png" alt="일간, 월지와 계절, 오행, 십성을 반응 방식과 자원, 관계의 역할로 연결한 설명."><img src="04-guests-and-seasons.png" alt="원국은 기본 명식, 대운은 긴 시기, 세운은 한 해의 흐름으로 구별한 찻집 손님 도해."><img src="05-your-report-map.png" alt="기본 명식과 조건부 십성 손님, 질문별 상담지, 종합 조언과 행동 순서의 실제 결과 지도."><img src="06-career-contents.png" alt="진로 사주 상담의 실제 9개 상세 목차를 앞부분과 실행부분으로 나눈 안내."><img src="07-a-different-way-to-use-strength.png" alt="책임을 떠안는 패턴에서 역할 합의와 작은 행동으로 이어지는 가상의 상담 예시."><img src="08-prepare-your-birth.png" alt="본인 생년월일과 양음력, 출생시간 미상 선택, 출생지와 시간대 등 입력 준비 안내."><img src="09-a-note-for-tomorrow.png" alt="결과 텍스트와 PDF 저장, 실천 기록, 별도 꿀편지와 타로 선택의 범위 구분."><img src="10-a-warm-ending.png" alt="차를 든 공식 꽃돼지 연이와 질문 중심 상담, AI 작성 고지."><p>본인의 명식과 질문을 바탕으로 읽는 사주 상담입니다. 목차는 질문 분야에 따라 달라지며, 명식·운 자료 및 결과에 있는 항목만 펼쳐집니다. 타로와 두 사람 궁합은 별도 선택 상품입니다. 안내 속 상담 문장은 이해를 돕기 위한 편집 예시로 실제 고객 결과가 아닙니다. 연이는 서비스 캐릭터이며 상담 문장은 AI가 작성합니다. 꿀편지는 별도 조건이 있는 추가 기능입니다.</p></html>
