<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네오와 나누는 대화형 운명 상담</title><style>body{max-width:540px;margin:24px auto;font-family:sans-serif;background:#f6ece5;color:#413b45}img{width:100%;height:auto}p{line-height:1.7}</style><h1>네오와 나누는 대화형 운명 상담</h1><img src="01-what-is-your-question.png" alt="빈 전략판 앞의 공식 백사자 네오와 한 질문의 대화형 상담 표지."><img src="02-turn-worry-into-a-question.png" alt="추상적인 고민을 지금 고를 선택과 반복행동, 확인할 사실로 구체화하는 설명."><img src="03-check-the-basis.png" alt="한 체계만 선택하는 계약과 여섯 체계의 구분, 상대 마음과 결과 보장 금지 안내."><img src="04-read-the-whole-answer.png" alt="현재 채팅 답변의 세 말풍선과 펼친본문, 조건부 주의패턴·행동·근거 항목."><img src="05-a-better-decision.png" alt="계속 비교만 하는 상황에서 결정기준과 기한을 정하는 네오의 가상 조언."><img src="06-continue-with-context.png" alt="최근 일부 대화를 이어받되 추천질문 전송은 새 답변의 조건 확인이라는 안내."><img src="07-check-your-inputs.png" alt="기존대화의 필수 생년월일, 달력 기준, 선택시간·성별·주제·체계 안내."><img src="08-a-conversation-not-a-command-book.png" alt="백사자 네오와 대화형답변·별도작전실·초융합상품 구분, AI캐릭터 안내."><p>현재 대화형 상담 화면의 네오 모드입니다. 연이와 같은 1회 유료 답변 상품을 사용하며 말투가 달라집니다. 별도 상품인 네오의 팩폭 작전실의 브리핑·수정 명령서·특전은 여기에 포함되지 않습니다. 질문마다 선택한 한 체계의 근거를 사용하고 최근 대화 일부를 참고합니다. 추천 질문의 새 답변도 전송 시 이용 조건을 다시 확인합니다. 안내 속 대화와 작전 노트는 이해를 돕기 위한 편집 예시이며 실제 고객 결과가 아닙니다. 네오는 AI 상담 캐릭터입니다.</p></html>
