<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영냥이 서양 점성술 연어 상담</title><style>body{max-width:540px;margin:24px auto;background:#f2ede5;color:#393749;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>영냥이 서양 점성술 연어 상담</h1><img src="01-how-to-use-your-effort.png" alt="공식점성술영냥이와시험준비방식점검을묻는표지."><img src="02-look-at-the-process.png" alt="계획이해반복세단계에서실제공부병목을질문으로구체화."><img src="03-ability-in-a-real-setting.png" alt="수성토성화성의쉬운해석과하우스각교차읽기를설명."><img src="04-from-question-to-preparation.png" alt="실제공부질문앞8장의판단과현실비교목차를세단계로안내."><img src="05-beyond-one-test.png" alt="질문9~11장조건부두드러진영역올해종합실행과시기한계."><img src="06-make-a-smaller-plan.png" alt="계획과복습의균형을구체화하는가상시험준비예시."><img src="07-eight-chapters-without-a-question.png" alt="기본성향8장목차를정확한순서대로네묶음으로설명."><img src="08-bring-the-goal-and-the-constraints.png" alt="출생시간지역준비단계목표기간제약과가격AI조건안내."><p>서양 점성술 연어는 시험·진로·재물·이동 등 선택의 조건을 살피는 질문 상담입니다. 이 안내는 공부·시험 질문 11장과 별도 기본 성향 리포트 8장을 소개합니다. 행성·하우스·각의 출생 배치를 해석하며, 현재 구성에 실시간 트랜짓은 없습니다. 목차에 시기·올해가 있어도 합격일이나 월별 사건을 예측하지 않습니다. 질문에 따라 목차가 달라지며 예시는 가상 편집입니다. AI 작성 상담이고 가격과 추가 질문 조건은 기존 화면을 따릅니다.</p></html>
