<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영냥이 자미두수 고등어 상담</title><style>body{max-width:540px;margin:24px auto;background:#f3ede5;color:#393447;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>영냥이 자미두수 고등어 상담</h1><img src="01-where-you-stand.png" alt="별지도를 펼친 공식 영냥이와 자미두수 고등어의 자기이해 질문."><img src="02-a-small-role.png" alt="일상의 역할을 묻는 구체적인 상황과 자기이해 질문 노트."><img src="03-palaces-in-plain-words.png" alt="명궁 신궁 관록궁 부부궁 재백궁의 쉬운 설명."><img src="04-your-question-in-six.png" alt="자기이해 질문 상담의 실제 여섯 목차를 읽기 쉽게 편집."><img src="05-another-reading-path.png" alt="질문 상담과 구분한 전체 성향 리포트 기본 다섯 목차."><img src="06-a-role-you-can-adjust.png" alt="신뢰를 받는 강점과 역할 부담을 함께 읽는 가상 해설."><img src="07-prepare-the-coordinates.png" alt="자미두수의 필수 출생시간 성별 달력과 상담 범위 경계."><img src="08-one-small-change.png" alt="공식 영냥이와 AI 해설·기록 다시읽기·기존가격 안내."><p>자미두수 고등어 질문 상담은 일상과 개인의 관계 고민 한 가지를 다룹니다. 질문 상담 6장과 질문 없이 고르는 기본 성향 리포트 5장은 서로 다른 구성입니다. 주제에 따라 목차가 바뀌며 궁합 비교나 장기 대한 상담이 자동 포함되지 않습니다. 출생시간과 성별이 필요합니다. 안내의 해설은 편집 예시이며 실제 고객 명반이나 결과가 아닙니다. 계산 근거를 바탕으로 AI가 작성하며, 가격과 추가 질문 조건은 상담 준비 화면에서 확인합니다.</p></html>
