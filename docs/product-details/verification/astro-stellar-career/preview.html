<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>봉인된 별의 방 · 일과 역할</title><style>body{max-width:540px;margin:24px auto;background:#f5f0e6;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>봉인된 별의 방 · 일과 역할</h1><img src="01-work-with-a-name.png" alt="바쁜 하루 끝에도, 내 일이 남았으면 좋겠다면."><img src="02-responsibility-and-room.png" alt="할 일은 늘어나는데, 결정할 자리는 없다면."><img src="03-five-natal-anchors.png" alt="다섯 근거로, 일의 지도를 연결해요."><img src="04-the-first-five-paragraphs.png" alt="어디로 가고 싶은지, 어떻게 시작하는지."><img src="05-the-last-four-paragraphs.png" alt="기회를 넓히되, 소모되는 조건도 살펴요."><img src="06-an-artifact-a-routine-a-record.png" alt="한 달의 실천을, 세 가지 흔적으로 남겨요."><img src="07-fictional-portfolio.png" alt="나를 설명하는 말에, 작은 증거를 더해보세요."><img src="08-open-the-work-room.png" alt="지금의 일을 돌아보고, 다음 역할을 준비해요."><p>일반 점성술 화면의 봉인된 별의 방에서 개별 해금하는 일과 역할 리딩입니다. MC·10하우스 룰러·6하우스·ASC 룰러·목성의 배치로 아홉 문단의 해석과 환경·수익화·실천 포인트를 읽습니다. 직업·수익·취업 결과를 보장하지 않습니다. 출생시간·지역이 하우스와 축에 영향을 줍니다. 기본 심층 패키지와 다른 별의 방은 별도 항목입니다. 예시는 가상 편집이며 기존 가격·해금 정책을 따릅니다.</p></html>
