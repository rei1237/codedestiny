<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>봉인된 별의 방 · 재능과 끌림</title><style>body{max-width:540px;margin:24px auto;background:#f5f0e6;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>봉인된 별의 방 · 재능과 끌림</h1><img src="01-talent-that-reaches-someone.png" alt="좋아하는 것을, 누군가에게 닿게 하려면."><img src="02-too-many-possibilities.png" alt="관심은 많은데, 첫 작업이 막막하다면."><img src="03-three-planets-one-project.png" alt="취향과 실행 사이에, 이어주는 길을 찾아요."><img src="04-the-first-five-paragraphs.png" alt="재능을 칭찬하는 데서, 한 걸음 더 들어가요."><img src="05-how-a-talent-is-seen.png" alt="나만의 기준을, 어떻게 보여줄까요?"><img src="06-three-lines-of-interest.png" alt="세 줄만 적고, 겹치는 한 가지를 골라요."><img src="07-fictional-small-collection.png" alt="잘해 보이려 하기보다, 내 선택을 설명해보세요."><img src="08-give-your-interest-a-form.png" alt="내 관심에, 작은 형태를 만들어줘요."><p>정상 점성술 화면의 개별 해금 항목입니다. 금성·화성·목성의 배치를 바탕으로 취향·실행·확장, 브랜딩과 관계에서 드러나는 매력, 과잉 사용의 주의점을 아홉 문단과 다섯 조언으로 읽습니다. 준비된 출생차트 해석이며 실시간 AI 상담이나 직업 적성 검사는 아닙니다. 출생시간·지역이 하우스에 영향을 줍니다. 기본 패키지와 다른 별의 방은 별도입니다. 가상 편집 예시를 포함하며 기존 가격·해금 정책을 따릅니다.</p></html>
