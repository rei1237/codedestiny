<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운명의 찻집 · 두 사람 사주 궁합</title><style>body{max-width:540px;margin:24px auto;background:#f6ede7;color:#443842;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>운명의 찻집 · 두 사람 사주 궁합</h1><img src="01-two-seats.png" alt="서로 다른 두 사람의 말과 두 잔의 차를 배치한 사주 궁합 표지."><img src="02-equal-attention.png" alt="나의 명식과 상대의 명식을 각각 읽은 뒤 두 사람의 상호작용을 살피는 구조."><img src="03-what-a-pair-reveals.png" alt="오행의 보완, 십성의 역할, 일지의 관계 습관과 시기 자료를 나누어 살피는 안내."><img src="04-nine-chapters.png" alt="사주 궁합 상담지의 실제 9개 목차."><img src="05-around-the-chapters.png" alt="본인과 상대 출생 정보, 일간 비교, 조건부 관계 요약과 공통 종합·선택·행동 영역."><img src="06-a-conversation-example.png" alt="즉시 대화를 원하는 사람과 시간이 필요한 사람이 구체적인 재대화 시점을 정하는 편집 예시."><img src="07-prepare-two-profiles.png" alt="두 사람 생년월일과 양음력, 각각의 출생시간 미상, 관계와 고민 입력 안내."><img src="08-save-your-agreement.png" alt="공식 사주 연이 그림과 텍스트·PDF 저장, 별도 꿀편지와 다른 궁합 구분."><img src="09-our-next-conversation.png" alt="두 찻잔과 함께 관계 조언의 한계와 AI 작성 사실을 밝히는 마무리."><p>두 사람의 생년월일과 명식을 대조하는 별도 사주 궁합 상품입니다. 안내 속 도해와 대화는 이해를 돕기 위한 편집 예시이며 실제 고객 결과가 아닙니다. 출생시간 미상은 미상으로 처리하고, 시기 해석은 확인된 운 자료 범위에서 제공합니다. 강점·주의점·선택지 등은 결과에 내용이 있을 때 표시됩니다. 숙요 궁합과 타로는 별도 상품입니다. 연이는 서비스 캐릭터이며 AI가 상담 문장을 작성합니다.</p></html>
