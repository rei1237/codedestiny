<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>종합 사주 풀이 검수 미리보기</title><style>body{margin:0 auto;max-width:540px;background:#faf5ed;color:#342732;font:16px/1.7 system-ui}img{width:100%;height:auto;display:block}h1,p{padding:0 18px}</style><h1>종합 사주 풀이</h1><p>로컬 편집 산출물 미리보기. 실제 서비스 화면 검수는 mobile.json 및 viewport 캡처를 참조하세요.</p><img src="../../../../public/feature-details/crafted/saju-summary/01-cover.webp" alt="종합 사주 풀이 표지. 성격을 일과 사랑에 어떻게 활용할지 묻는 큰 문장과 달빛 서재의 네 기둥 삽화." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/02-concerns.webp" alt="두 방향으로 놓인 종이와 노트가 있는 일상 책상. 반복되는 선택, 일의 환경, 가까운 관계라는 세 가지 고민을 소개한다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/03-craft.webp" alt="10년 경력 명리학자 박병하 네오의 상담 경험을 소개한다. 디지털 풀이이며 사람이 결과마다 직접 상담하는 상품이 아니라는 설명을 함께 표시한다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/04-reviews.webp" alt="제작자의 실제 1:1 상담 카카오톡 후기 두 건. 생각이 정리되었다는 후기와 사주 특성 설명을 읽고 신기하고 시원했다는 후기를 원문 그대로 발췌한다. 이 디지털 상품의 후기는 아니다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/05-basis.webp" alt="네 기둥을 나타낸 개념 삽화 아래 일간, 계절, 오행, 십성의 쉬운 뜻을 연결한 도해. 실제 명식은 아니다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/06-self-outline.webp" alt="서재의 노트와 사주 총평, 계절과 기운의 균형, 오행과 십성, 성격과 기질이라는 네 가지 목차가 배치된 편집 구성." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/07-life-outline.webp" alt="간격을 두고 놓인 두 찻잔 이미지와 진로, 연애, 재물, 인간관계, 생활 리듬, 실천 전략의 목차." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/08-example.webp" alt="토 일간의 연애 항목에서 코드상 문장을 발췌한 예시와 해석의 이유, 생활에 적용할 행동을 설명한다. 실제 고객 결과가 아니다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/09-scope.webp" alt="생년월일 정보 확인, 종합 풀이 열람의 두 단계와 준비 정보 안내. 대운과 궁합은 별도 상품이며, 출생 시간을 모르면 낮 12시 기준으로 분석한다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-summary/10-close.webp" alt="달빛 서재 이미지와 나를 이해한 내용을 다음 선택에 활용하자는 마무리 문장. 마지막 안내는 버튼이 아닌 일반 문장으로 표시한다." width="1080" height="1440"><p>후기는 제작자의 과거 1:1 상담 후기이며, 이 디지털 상품의 이용 후기가 아닙니다. 해석 예시는 이해를 돕기 위한 코드 기반 발췌·편집 예시입니다.</p></html>
