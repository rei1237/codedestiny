<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초융합 운세 상세</title><style>body{max-width:540px;margin:24px auto;background:#f3efe5;color:#293e4c;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7;white-space:pre-line}</style><h1>초융합 운세</h1><img src="01-crossroads.png" alt="달빛이 드는 방의 공식 수정구 삽화와 선택의 갈림길에서 시작하는 초융합 상담."><img src="02-one-question.png" alt="현재 상황, 결정할 선택, 확인할 조건을 구분하는 질문 노트."><img src="03-different-lenses.png" alt="사주·자미두수·베다점·숙요점·서양점성술·타로 각각의 해석 관점."><img src="04-reading-order.png" alt="도입과 핵심 요약에서 여섯 독립 해석, 종합 해석으로 이어지는 실제 결과 순서."><img src="05-from-reading-to-action.png" alt="시기와 행동, 근거 비교, 최종 판단, 마지막 메시지의 실제 결과 항목."><img src="06-difference-is-information.png" alt="같은 이직 질문에 확장과 준비의 두 관점이 나올 때 조건부 행동으로 연결하는 가상 사례."><img src="07-six-positions.png" alt="현재 상황, 내면, 장애물, 외부 영향, 선택, 다음 행동의 여섯 타로 자리 도식."><img src="08-prepare-your-story.png" alt="필수 출생 정보와 상담 주제, 선택 질문 및 성별·별칭 입력을 구분한다."><img src="09-return-to-the-evidence.png" alt="완성 결과의 차례 이동과 최근 상담 다시 열기, PDF 저장 안내."><img src="10-your-own-choice.png" alt="공식 수정구 삽화와 AI 해설의 범위 및 사용자의 판단을 존중하는 마지막 메시지."><p>결과의 여섯 체계별 해석과 종합·시기·행동 구조를 안내합니다. 받은 내용이 있는 항목부터 표시되며, 근거 비교는 같은 주제와 시기에 비교 가능한 자료가 있을 때 구성됩니다. 도식과 상담 문장은 이해를 돕기 위한 편집 예시로 실제 고객 결과가 아닙니다. 체계 간 일치나 화면의 수치는 성공 확률 또는 정확도 인증이 아닙니다. 결과 문장은 AI가 작성하며, 여섯 명의 사람이 직접 상담하는 상품이 아닙니다.</p></html>
