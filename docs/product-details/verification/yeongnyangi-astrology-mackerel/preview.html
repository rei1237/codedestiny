<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영냥이 서양 점성술 고등어 상담</title><style>body{max-width:540px;margin:24px auto;background:#f2ede5;color:#393749;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>영냥이 서양 점성술 고등어 상담</h1><img src="01-more-than-one-sign.png" alt="공식점성술영냥이와겉으로말한답내면반응의차이를묻는표지."><img src="02-three-ways-of-being-me.png" alt="태양달상승점역할을세층으로설명하는시각구성."><img src="03-a-question-with-a-scene.png" alt="부탁거절후걱정이라는구체적질문작성예시."><img src="04-six-chapters-to-an-action.png" alt="실제자기이해6장목차를두장씩세단계로정리."><img src="05-a-strength-with-an-edge.png" alt="거절표현에서배려와경계를함께남기는가상조언."><img src="06-a-five-chapter-portrait.png" alt="기본성향5장실제목차를번호로제공."><img src="07-the-chart-needs-a-time.png" alt="출생시간지역시간대필수와서양출생차트의시기한계안내."><img src="08-find-a-language-for-yourself.png" alt="공식영냥이와AI해석가격조건결과기록마무리."><p>서양 점성술 고등어는 출생 차트의 태양·달·상승점과 행성의 배치에서 일상 질문을 읽는 상담입니다. 자기이해 질문은 6장, 질문 없이 읽는 기본 성향 리포트는 5장으로 다릅니다. 출생시간·지역·시간대가 필요하며, 현재 출생 차트에 실시간 트랜짓은 포함되지 않습니다. 별자리 하나로 성격이나 미래 사건을 확정하지 않습니다. 설명용 사례는 가상 편집이며 AI가 계산 근거를 바탕으로 작성합니다. 가격과 추가 질문 조건은 기존 화면에서 확인하세요.</p></html>
