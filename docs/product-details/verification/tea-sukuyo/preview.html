<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운명의 찻집 · 숙요 궁합</title><style>body{max-width:540px;margin:24px auto;background:#f6ede7;color:#443842;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>운명의 찻집 · 숙요 궁합</h1><img src="01-near-and-far.png" alt="달빛 아래 공식 숙요 연이 이미지와 관계의 속도 차이를 묻는 표지."><img src="02-two-natal-mansions.png" alt="각자의 생일과 양음력 기준을 각각의 본명숙에 연결하고 27숙 관계를 비교하는 도해."><img src="03-distance-is-not-a-score.png" alt="숙요의 관계 유형·거리·방향을 일상에서 관계를 경험하는 방식으로 설명."><img src="04-both-directions.png" alt="나에서 상대, 상대에서 나 두 방향을 분리한 관계 설명 도해."><img src="05-what-you-read.png" alt="숙요 결과의 실제 본명숙·유형·거리·방향·강점·주의·역할 및 공통상담 순서."><img src="06-a-different-rhythm.png" alt="연락의 속도가 다른 두 사람이 대화 시간을 조율하는 편집 예시."><img src="07-before-you-begin.png" alt="두 사람 생년월일과 양음력·윤달 확인, 관계와 초점 입력, 출생시간 불필요 안내."><img src="08-a-gentle-distance.png" alt="공식 꽃돼지 연이와 결과 저장, 별도 상품·꿀편지 범위, AI 작성 안내."><p>두 사람의 생년월일과 달력 기준으로 본명숙과 27숙 관계를 읽는 숙요 궁합입니다. 본명숙·관계 유형·거리·방향을 중심으로 안내하며 성공 확률이나 상대의 속마음을 확정하지 않습니다. 도해와 문장은 이해를 돕기 위한 편집 예시이고 실제 고객 결과가 아닙니다. 방향별 설명·강점·주의점·선택지 등은 결과에 있는 내용만 표시됩니다. 사주 궁합과 타로는 별도 상품이며 꿀편지는 별도 조건의 추가 기능입니다. 연이는 서비스 캐릭터이고 상담 문장은 AI가 작성합니다.</p></html>
