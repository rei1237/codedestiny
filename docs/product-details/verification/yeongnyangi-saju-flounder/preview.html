<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>영냥이 사주 광어 상담</title><style>body{max-width:540px;margin:auto;background:#faf5ed;color:#342732;font:16px/1.7 system-ui}img{width:100%;height:auto;display:block}h1,p{padding:0 18px}</style><h1>영냥이 사주 광어 상담</h1><p>로컬 편집 미리보기. 실제 화면은 mobile.json 및 legacy/question 캡처를 참조하세요.</p><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/01-bridge.webp" alt="달빛 아래 다리에 앉은 공식 영냥이. 두 사람 사이의 차이를 이해하는 사주 광어 상담." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/02-translation.webp" alt="답을 빨리 듣고 싶은 사람과 천천히 정리하고 싶은 사람의 대화 차이를 보여주는 편집 도식." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/03-two-charts.webp" alt="각자의 기질과 관계에서 드러나는 차이, 현실에서 확인할 조건을 차례로 읽는 사주 해석 구조." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/04-question-foundation.webp" alt="두 사람 관계 질문 상담의 시작 목차: 바탕, 강점과 부담, 질문의 답, 판단 근거와 조건, 기회와 주의." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/05-question-relationship.webp" alt="질문 상담의 관계 다섯 장과 질문 밖 네 영역, 종합 실행 계획을 구분한 실제 구성 안내." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/06-personal-first.webp" alt="한 사람의 기본 사주 광어 전체 성향 리포트 앞 여섯 목차. 두 사람 질문 상담과 구별한다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/07-personal-next.webp" alt="기본 사주 전체 성향 리포트 뒤 일곱 목차: 배움, 곁의 사람들, 부모, 자녀와 후반, 회복, 올해와 내년, 앞으로 열두 달." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/08-dialogue-example.webp" alt="답장이 늦어 불안한 상황에서 대화할 시간을 서로 정하는 가상의 행동 예시." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/09-before-reading.webp" alt="관계 상담 전에 출생 정보, 관계 유형, 상황과 질문을 준비하며 AI 해설 방식과 제작자 경력을 안내한다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-flounder/10-closer.webp" alt="상대방을 바꾸려 하기보다 자신의 질문과 바꿀 수 있는 대화 조건을 정리하며 마무리한다." width="1080" height="1440"><p>관계 대화와 도식은 이해를 돕기 위한 편집 예시이며 실제 고객 결과가 아닙니다. 두 사람의 질문 상담과 한 사람의 전체 성향 리포트는 서로 다른 구성입니다. 상대의 속마음이나 관계의 결말을 확정하지 않습니다. 가격과 추가 질문 조건은 기존 상담 준비 화면에서 확인해 주세요.</p></html>
