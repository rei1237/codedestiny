<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점성술 관계·궁합 개별 해석</title><style>body{max-width:540px;margin:24px auto;background:#f5f0e6;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>점성술 관계·궁합 개별 해석</h1><img src="01-your-side-of-a-relationship.png" alt="관계가 어려울 때, 내 쪽의 언어부터 살펴요."><img src="02-a-different-pace.png" alt="호감은 있어도, 다가가는 속도는 달라요."><img src="03-three-relationship-cards.png" alt="결과의 세 카드, 서로 다른 질문을 맡아요."><img src="04-a-personal-guide.png" alt="개인의 관계 설명과, 두 사람의 궁합은 구분해요."><img src="05-fictional-an-invitation.png" alt="먼저 내 마음을, 상대가 알 수 있는 말로."><img src="06-a-language-for-a-conversation.png" alt="정해진 결론보다, 대화를 시작할 단서를."><p>점성술 대체 결과 화면의 관계·궁합 개별 해금 항목입니다. 본인 출생차트의 금성·화성·7하우스를 세 설명 카드로 읽습니다. 시너스트리에서 상대 행성을 참고하는 방식도 설명하지만 상대 정보로 계산한 실제 두 사람 궁합 결과는 아닙니다. 정상 화면의 봉인된 별의 방 관계의 문과 별도 항목입니다. 출생시간·지역이 하우스 해석에 영향을 줍니다. 가상 편집 예시이며 기존 가격·해금 정책을 따릅니다.</p></html>
