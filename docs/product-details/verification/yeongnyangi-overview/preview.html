<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>영냥이 질문 상담 검수 미리보기</title><style>body{margin:0 auto;max-width:540px;background:#faf5ed;color:#342732;font:16px/1.7 system-ui}img{width:100%;height:auto;display:block}h1,p{padding:0 18px}</style><h1>영냥이 질문 상담</h1><p>로컬 편집 산출물 미리보기. 실제 서비스 화면 검수는 mobile.json 및 viewport 캡처를 참조하세요.</p><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/01-question.webp" alt="달빛 점술방의 공식 영냥이와 질문부터 시작하는 상담 안내." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/02-situation.webp" alt="관계의 표현, 이직의 조건, 오래 반복되는 패턴을 구분해 적는 질문 노트." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/03-basis.webp" alt="사주 명식을 상징하는 네 장의 한지와 각 점술의 계산에서 상담으로 이어지는 설명." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/04-systems.webp" alt="사주, 자미두수, 숙요, 베다점, 서양 점성술, 타로의 서로 다른 해석 근거." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/05-contents.webp" alt="질문 상담의 기본 흐름인 바탕, 질문 답변, 판단 근거, 기회와 주의, 실행 계획을 보여준다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/06-example.webp" alt="부탁을 거절하지 못하는 고민에 대해 조건을 말하는 연습을 제시한 가상의 상담 예시." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/07-scope.webp" alt="고등어는 한 질문, 연어는 중요한 선택, 광어는 두 사람 비교, 참치는 장기 시기 흐름으로 구분." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/08-method.webp" alt="명리 상담사의 확인된 경력과 계산 기반 AI 상담의 차이를 분명히 설명한다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/09-prepare.webp" alt="질문, 상황, 대상, 기간과 선택 조건, 출생 정보를 준비하고 결제 전 범위를 확인하는 과정." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-overview/10-close.webp" alt="공식 영냥이가 다음 질문을 기다리는 마무리. 디지털 상담 결과를 기존 내 상담에서 다시 읽는 안내." width="1080" height="1440"><p>생선은 정확도의 등급이 아닙니다. 질문 상담과 전체 성향 리포트는 별도 선택 흐름입니다. 이해를 돕기 위한 편집 예시이며 실제 고객 결과가 아닙니다. 상담 범위는 질문·대상·기간에 따라 달라집니다. 가격과 적용 가능한 결제 수단은 기존 상담 준비 화면에서 확인해 주세요.</p></html>
