<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점성술 앞으로 12개월 흐름</title><style>body{max-width:540px;margin:24px auto;background:#f5f0e6;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>점성술 앞으로 12개월 흐름</h1><img src="01-a-calendar-for-your-next-step.png" alt="다음 일정을 잡기 전에, 한 해의 흐름을 펼쳐요."><img src="02-not-every-plan-at-once.png" alt="모든 계획을, 한 달에 몰아넣지 않도록."><img src="03-moving-sky-and-birth-chart.png" alt="태어난 하늘 위로, 지금의 별이 움직여요."><img src="04-how-the-result-unfolds.png" alt="큰 흐름을 읽고, 내 일정으로 좁혀가요."><img src="05-a-period-not-one-deadline.png" alt="하루의 결론보다, 이어지는 기간을 봐요."><img src="06-a-month-at-a-time.png" alt="달마다 하나씩, 돌아볼 지점을 남겨요."><img src="07-five-areas-of-life.png" alt="같은 시기도, 분야에 따라 다르게 읽어요."><img src="08-what-a-date-can-tell.png" alt="계산되는 날짜와, 현실의 사건은 구분해요."><img src="09-fictional-project-calendar.png" alt="변화를 준비한다면, 점검할 일을 먼저 정해요."><img src="10-make-room-in-your-calendar.png" alt="흐름을 참고하고, 선택은 내 생활에 맞춰요."><p>현재 날짜부터 앞으로 12개월의 행성 이동과 출생차트의 관계를 계산하는 개별 해금 항목입니다. 조건부 올해의 주제와 주요 흐름, 열두 월별 카드, 일·연애·돈·관계·건강의 시기, 계산 근거를 읽습니다. 계산되는 날짜는 행성 배치의 시점이며 실제 사건의 발생일이나 성공·질병을 확정하지 않습니다. 출생시간 미상일 때 축·하우스와 올해의 주제는 제한됩니다. 시각은 기기 시간대 기준입니다. 가상 편집 예시를 포함합니다. 기본 차트 심층 패키지와 다른 해금은 별도이며 현재 화면의 가격·결제 조건을 따릅니다.</p></html>
