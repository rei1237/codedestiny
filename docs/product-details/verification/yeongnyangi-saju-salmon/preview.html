><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-salmon/10-close.webp" alt="비교한 조건과 실행 계획을 작은 준비로 옮기자는 마무리. 두 사람 비교와 장기 전환은 별도 범위임을 안내한다." width="1080" height="1440"><p>아래 이직 사례와 도식은 이해를 돕기 위한 편집 예시입니다. 실제 고객 결과가 아닙니다. 질문 상담의 목차는 주제와 입력 조건에 따라 달라지며, 전체 성향 리포트는 별도 선택 흐름입니다. 가격과 추가 질문 조건은 기존 상담 준비 화면에서 확인해 주세요.</p></html>
