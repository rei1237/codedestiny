<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연이와 나누는 대화형 운명 상담</title><style>body{max-width:540px;margin:24px auto;font-family:sans-serif;background:#f6ece5;color:#413b45}img{width:100%;height:auto}p{line-height:1.7}</style><h1>연이와 나누는 대화형 운명 상담</h1><img src="01-a-place-for-your-question.png" alt="편지 앞의 공식 꽃돼지 연이와 질문 하나로 시작하는 대화형 상담 표지."><img src="02-name-the-moment.png" alt="기다리던 답장, 미루던 선택, 관계의 거리라는 구체적인 질문 예시."><img src="03-one-system-at-a-time.png" alt="사주, 자미두수, 숙요, 베다, 점성술, 타로 중 선택한 한 체계로 읽는 상담 안내."><img src="04-open-the-answer.png" alt="실제 말풍선과 자세히 보기 안의 도입·마음·핵심해석·주제조언·주의패턴·행동·근거 구성."><img src="05-you-can-say-it-gently.png" alt="부탁을 거절하지 못하는 상황에서 다정하게 경계를 표현하는 가상의 답변 예시."><img src="06-the-next-question.png" alt="최근 대화를 참고하는 흐름과 추천 질문, 매 새 답변의 이용 조건을 구분하는 설명."><img src="07-before-we-talk.png" alt="현재 채팅의 생년월일 필수, 양음력·선택시간·선택성별, 분야와 체계 확인 안내."><img src="08-one-question-is-enough.png" alt="공식 꽃돼지 연이와 다정한 마무리, AI 캐릭터와 두 상담자 동일상품 안내."><p>현재 대화형 상담 화면의 1회 유료 답변 구성을 안내합니다. 연이와 네오는 같은 결제 상품의 상담자 선택이며, 해석의 전달 말투가 다릅니다. 선택한 한 체계의 근거로 질문을 읽고 최근 대화 일부를 참고합니다. 추천 질문을 고르는 것과 새 답변을 받는 것은 다르며, 새 질문 전송 시 이용 가능 여부와 결제 조건을 다시 확인합니다. 초융합 등 연결된 상세 상담은 별도 상품입니다. 안내 속 문장은 이해를 돕기 위한 편집 예시로 실제 고객 결과가 아닙니다. 연이는 AI 상담 캐릭터입니다.</p></html>
