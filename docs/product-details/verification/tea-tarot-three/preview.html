<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운명의 찻집 · 타로 3장</title><style>body{max-width:540px;margin:24px auto;background:#fbf1e5;color:#573e4e;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>운명의 찻집 · 타로 3장</h1><img src="01-a-knot-and-a-cup.png" alt="달빛 찻집을 배경으로 세 장의 공식 타로 뒷면과 질문을 정리하는 표지."><img src="02-three-questions.png" alt="현재의 매듭, 활용할 자원, 다음 행동의 세 자리와 별도 과거현재미래 배열 안내."><img src="03-before-the-draw.png" alt="찻잔 선택과 질문 작성, 배열 확인, 로그인 후 세 장 선택으로 이어지는 실제 준비 절차."><img src="04-read-each-card.png" alt="카드별 핵심 의미, 현재 상황, 질문과의 연결, 조언, 주의점의 실제 다섯 해석 항목."><img src="05-the-reading-you-receive.png" alt="결과의 핵심 답변, 카드별 해석과 연결, 종합 해석, 연이의 조언, 선택 시나리오, 행동과 마무리."><img src="06-a-small-beginning.png" alt="작업 시작을 미루는 상황을 매듭·자원·행동의 세 관점으로 정리한 가상 예시."><img src="07-keep-one-sentence.png" alt="결과 텍스트 저장과 작은 행동 기록, 꿀편지의 별도 조건을 구분하는 안내."><img src="08-under-the-moon.png" alt="달빛 찻집과 차를 든 연이의 공식 그림, 질문 중심 상담 및 AI 작성 고지."><p>찻집의 3장 배열과 상담 구성을 안내합니다. 카드 도식은 자리 설명이며 실제 뽑힌 카드가 아닙니다. 상담 예시는 편집 예시로 실제 고객 결과가 아닙니다. 카드 간 연결·선택 시나리오·행동 항목은 받은 내용이 있을 때 표시됩니다. 사주·사주 궁합·숙요 궁합은 별도 선택 상품입니다. 꿀편지는 별도 조건이 있는 추가 기능이며 기본 상담에 자동 포함되지 않습니다. 연이는 서비스 캐릭터이고 상담 문장은 AI가 작성합니다.</p></html>
