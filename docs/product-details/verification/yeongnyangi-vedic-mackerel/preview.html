<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영냥이 베다점 고등어 상담</title><style>body{max-width:540px;margin:24px auto;background:#f3eee1;color:#3d4641;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>영냥이 베다점 고등어 상담</h1><img src="01-outside-and-inside.png" alt="베다차트책앞의공식영냥이와겉모습과내면의리듬을묻는표지."><img src="02-after-a-good-day.png" alt="만남에서의태도와혼자회복하는시간을구분한상황노트."><img src="03-three-ways-to-read.png" alt="라그나달나크샤트라의서로다른해석역할과베다체계구분."><img src="04-six-chapters-for-one-question.png" alt="베다고등어자기이해질문의실제6목차."><img src="05-start-with-your-nature.png" alt="질문상담과다른베다기본5장의실제목차."><img src="06-your-own-recovery-rhythm.png" alt="사람에게집중하는강점을지키며회복시간을남기는가상해석예시."><img src="07-your-birth-coordinates.png" alt="베다필수출생시간지역시간대와한질문범위안내."><img src="08-a-word-you-can-use-today.png" alt="공식영냥이와AI해설및기존조건·기록안내."><p>베다점 고등어 질문 상담은 한 가지 일상·개인 관계 고민을 라그나·달·나크샤트라 등 실제 베다 차트 근거로 읽습니다. 질문 상담 6장과 기본 성향 리포트 5장은 다른 구성입니다. 서양 점성술이나 사주의 기준과 섞지 않습니다. 생년월일·달력·출생시간·출생지역이 필요하며 시간대를 확인합니다. 두 사람 차트 비교와 현재·다음 장기 다샤의 전환은 별도 범위입니다. 사례는 실제 고객 결과가 아닌 편집 예시이며 AI가 계산 근거를 풀어 씁니다. 가격과 추가 질문 조건은 기존 준비 화면에서 확인합니다.</p></html>
