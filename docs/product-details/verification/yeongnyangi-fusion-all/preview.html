<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영냥이 전체 오마카세 상담</title><style>body{max-width:540px;margin:24px auto;background:#f4ecdd;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>영냥이 전체 오마카세 상담</h1><img src="01-one-life-six-lenses.png" alt="삶이 한꺼번에 움직일 때, 질문의 중심을 찾아요."><img src="02-a-move-is-not-one-choice.png" alt="이직 하나인데, 바뀌는 것은 많으니까요."><img src="03-three-eastern-lenses.png" alt="성향·삶의 자리·관계, 같은 말로 뭉치지 않아요."><img src="04-three-other-lenses.png" alt="시기·출생차트·카드, 서로 다른 질문을 맡아요."><img src="05-twelve-foundations.png" alt="서둘러 섞기 전에, 각 해석의 근거부터."><img src="06-twelve-question-chapters.png" alt="넓게 읽은 다음, 내 질문으로 돌아와요."><img src="07-nine-life-chapters.png" alt="고민 밖의 생활도, 함께 흔들리지 않도록."><img src="08-three-final-chapters.png" alt="여섯 표의 찬반보다, 내가 확인할 조건을."><img src="09-fictional-conditions.png" alt="“옮겨도 될까”에서, “무엇을 확인할까”로."><img src="10-start-with-one-question.png" alt="많이 얽힌 고민도, 한 문장부터 시작해요."><p>사주·자미두수·숙요·베다·서양 점성술·타로를 체계별로 구분하는 36장 개인 상담입니다. 여섯 해석은 독립된 여섯 개의 검증이나 정확도 점수가 아닙니다. 출생시간·지역·시간대가 필요하며 타로는 자동 추출한 6장을 사용합니다. 현재 목차는 기본 자기이해 주제의 예이며 선택 주제에 따라 일부가 달라집니다. 실제 계산 근거가 없는 시기나 상대 마음을 확정하지 않습니다. 예시는 가상 편집, 결과 본문은 AI 작성입니다. 가격과 추가 질문 조건은 기존 화면을 따릅니다.</p></html>
