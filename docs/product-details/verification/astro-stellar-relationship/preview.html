<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>봉인된 별의 방 · 관계의 문</title><style>body{max-width:540px;margin:24px auto;background:#f5f0e6;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>봉인된 별의 방 · 관계의 문</h1><img src="01-a-place-for-love.png" alt="좋아하는 마음이, 함께하는 생활이 되려면."><img src="02-affection-and-daily-life.png" alt="설렘은 분명한데, 약속에서는 어긋난다면."><img src="03-venus-and-mars.png" alt="마음을 여는 말과, 움직이게 하는 힘."><img src="04-the-seventh-house.png" alt="반복되는 상대상에서, 생활의 약속으로."><img src="05-nine-paragraphs.png" alt="문을 여는 순간부터, 오래 머무는 태도까지."><img src="06-a-guide-not-a-pair-chart.png" alt="궁합을 읽는 기준과, 실제 두 사람 계산은 달라요."><img src="07-fictional-small-promise.png" alt="원하는 태도 하나와, 지킬 태도 하나를."><img src="08-keep-the-door-open.png" alt="사랑의 답보다, 함께 맞출 조건을 남겨요."><p>본인의 출생차트로 애정 언어·끌림·관계 패턴과 생활 약속을 읽는 개별 해금 항목입니다. 금성·화성·7하우스·7하우스 룰러를 사용합니다. 아홉 문단의 해석과 관계 포인트를 제공하며, 시너스트리에서 살펴볼 기준도 설명합니다. 상대 정보로 계산한 실제 두 사람 궁합이나 속마음 결과가 포함된다는 뜻은 아닙니다. 출생시간·지역이 하우스 해석에 영향을 줍니다. 예시는 가상 편집이며 기존 가격·해금 정책을 따릅니다.</p></html>
