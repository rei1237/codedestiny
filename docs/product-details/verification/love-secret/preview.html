<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연애 비책 상세</title><style>body{max-width:540px;margin:24px auto;background:#f9ede7;color:#452f37;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>연애 비책</h1><img src="01-unsent-letter.png" alt="편지를 고르는 인물의 공식 연애 비책 삽화와 관계에서 다음 대화를 고민하는 표지."><img src="02-your-question.png" alt="현재 관계와 사용자의 질문을 사주 근거와 연결해 다음 대화와 행동을 정리하는 구조."><img src="03-my-love-pattern.png" alt="관계의 핵심과 나의 기질에 관한 실제 8개 주제를 짧은 목차로 정리한다."><img src="04-the-other-person.png" alt="상대의 거리감, 끌림, 친밀감, 이상형, 선호하는 관계의 다섯 주제와 상대 정보 유무의 차이."><img src="05-protect-my-heart.png" alt="갈등, 흔들림, 재회, 자기 보호의 네 주제와 압박 대신 서로의 경계를 존중하는 방향."><img src="06-time-to-talk.png" alt="타이밍, 올해의 흐름, 계산된 날짜, 결혼과 동행, 30일 흐름의 다섯 주제."><img src="07-small-actions.png" alt="썸 전략, 단계별 행동, 대화 문장, 표현과 스타일, 7일 실천, 마지막 메시지의 여섯 주제."><img src="08-draft-message.png" alt="거절할 여지를 남기며 만남을 제안하는 가상의 대화 초안과 후속 행동 예시."><img src="09-use-the-report.png" alt="결과의 한 줄 요약, 깊이 읽기, 실천 체크리스트 및 7일 가이드와 PDF 저장의 읽기 안내."><img src="10-start-with-now.png" alt="편지와 함께 현재 관계, 궁금한 질문, 출생 정보를 준비하도록 안내하고 AI 해설임을 밝힌다."><p>이 안내의 목차는 현재 상담이 다루는 28개 주제를 읽기 쉽게 줄여 쓴 것입니다. 실제 화면은 받은 내용을 주제별로 묶어 표시합니다. 예시 대화와 행동은 편집 예시이며 실제 고객 결과가 아닙니다. 상대 정보가 없으면 상대 명식을 계산한 궁합으로 해석하지 않습니다. 날짜 안내는 관계의 성공을 보장하지 않습니다. 10년 경력 상담사·명리학자가 만든 AI 해설 서비스이며, 사람이 결과마다 직접 집필·감수하는 상담이 아닙니다.</p></html>
