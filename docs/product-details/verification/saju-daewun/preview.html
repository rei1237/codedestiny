<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>사주 대운 풀이 검수 미리보기</title><style>body{margin:0 auto;max-width:540px;background:#faf5ed;color:#342732;font:16px/1.7 system-ui}img{width:100%;height:auto;display:block}h1,p{padding:0 18px}</style><h1>사주 대운 풀이</h1><p>로컬 편집 산출물 미리보기. 실제 서비스 화면 검수는 mobile.json 및 viewport 캡처를 참조하세요.</p><img src="../../../../public/feature-details/crafted/saju-daewun/01-season.webp" alt="사주 대운 풀이 표지. 달빛 아래 명식을 살피는 삽화와 지금의 선택 속도를 묻는 문장." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-daewun/02-question.webp" alt="노트와 책상 삽화 옆으로 확장, 회복, 관계 변화의 고민을 펼친 편집 화면." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-daewun/03-scale.webp" alt="원국은 바탕, 대운은 약 10년의 배경, 세운은 해마다의 변화로 구분하는 개념 도해." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-daewun/04-outline.webp" alt="실제 대운 해설의 구성인 원국, 천간, 지지, 균형, 합충, 일과 관계, 행동 순서를 큰 목차로 보여준다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-daewun/05-year.webp" alt="연도별 세운 항목과 대운표, 인생 흐름 그래프의 역할을 설명한다. 실측 개인 그래프는 표시하지 않는다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-daewun/06-example.webp" alt="이해를 돕기 위한 편집 예시. 기회를 작은 실행으로 시험하고 시간과 비용을 점검하는 행동을 제안한다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-daewun/07-prepare.webp" alt="알고 있는 출생 시간과 생년 정보를 준비하고, 출생 시간을 모를 경우 대운 시점 확정이 제한됨을 안내한다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-daewun/08-compare.webp" alt="대운표와 그래프의 역할을 구분하고 점수가 성공 확률이 아님을 알리는 편집 페이지." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/saju-daewun/09-close.webp" alt="달빛 서재와 작은 실천을 제안하는 마무리. 구매 조작은 이미지 밖의 기존 웹 버튼으로 한다." width="1080" height="1440"><p>아래 사례와 시간 도해는 이해를 돕기 위한 예시입니다. 실제 고객 결과나 미래 사건의 예측표가 아닙니다. 출생 시간을 모르면 대운 시작 시점과 연령별 흐름을 확정하지 않습니다.</p></html>
