<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>애니멀 토템 · 별자리 다섯 동물</title><style>body{max-width:540px;margin:24px auto;background:#f5f0e6;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7}</style><h1>애니멀 토템 · 별자리 다섯 동물</h1><img src="01-a-divided-heart.png" alt="머리로는 아는데, 마음은 따라오지 않을 때."><img src="02-two-voices.png" alt="옳은 답을 찾기 전에, 두 목소리를 들어봐요."><img src="03-shadow-and-gift.png" alt="숨기고 싶은 모습에도, 쓰임을 바꿀 힘이 있어요."><img src="04-the-fifth-place.png" alt="마지막 자리는, 다음 한 걸음에 남겨요."><img src="05-what-the-result-includes.png" alt="다섯 장의 나열에서, 하나의 해설로 이어져요."><img src="06-five-card-library.png" alt="마음에 남은 카드는, 한 번 더 펼쳐 읽어요."><img src="07-fictional-rest.png" alt="계속 잘하고 싶은 마음에, 쉴 자리도 남겨주세요."><img src="08-before-five-animals.png" alt="다섯 자리 앞에, 지금의 질문을 놓아봐요."><p>이성·감정·그림자·잠재 선물·다음 행동의 다섯 자리를 읽는 심화 모드입니다. 미래나 타인의 마음을 확정하는 검사가 아닙니다. 질문은 최대 300자이며 건너뛰기도 가능합니다. AI 질문 해설, 카드별 정적 안내와 그림자·선물 통합 해설이 제공됩니다. 예시는 가상 편집입니다. 일러스트는 분위기 이미지이며 실제 카드는 성좌 문양입니다. 기본 한 장·세 장 상담은 별도 모드입니다. 가격·재이용 조건은 기존 선택·결제 화면을 따릅니다.</p></html>
