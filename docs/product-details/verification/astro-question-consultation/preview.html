<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점성술 질문 AI 상담</title><style>body{max-width:540px;margin:24px auto;background:#f5f0e6;font-family:sans-serif}img{width:100%;height:auto}p{line-height:1.7;word-break:keep-all}</style><h1>점성술 질문 AI 상담</h1><img src="01-a-question-inside-your-chart.png" alt="차트는 읽었는데, 내 고민은 아직 남았다면."><img src="02-turn-a-worry-into-a-question.png" alt="막연한 운보다, 지금의 고민을 적어주세요."><img src="03-the-chart-becomes-evidence.png" alt="상담의 출발점은, 이미 계산된 내 차트예요."><img src="04-the-first-three-parts.png" alt="질문을 다시 짚고, 나의 반복을 살펴요."><img src="05-your-resources-and-conditions.png" alt="쓸 수 있는 강점과, 확인할 조건을 나눠요."><img src="06-from-caution-to-action.png" alt="반대 가능성까지 보고, 행동으로 마무리해요."><img src="07-when-the-question-is-about-us.png" alt="내 연애 성향과, 우리의 궁합은 구분해요."><img src="08-answer-and-question-text.png" alt="읽을 상담문과, 다시 살펴볼 질문문을."><img src="09-fictional-work-question.png" alt="남을지 옮길지보다, 무엇이 반복되는지부터."><img src="10-start-with-one-scene.png" alt="한 가지 장면에서, 나만의 질문을 시작해요."><p>기본 점성술 결과에서 질문을 입력해 AI 상담문을 받는 기능입니다. 열 부분의 상담 본문과 상담에 사용된 질문문을 함께 살펴볼 수 있습니다. 기본 결과와 5~1000자의 질문이 필요합니다. 궁합 데이터가 있을 때만 해당 두 사람의 근거를 사용합니다. 다른 전문가 상담·차트 패키지·트랜짓 해금은 별도입니다. 상담 내용은 질문과 계산 근거에 따라 달라집니다. 예시는 가상 편집입니다. 가격과 결제 조건은 현재 화면을 따릅니다.</p></html>
