<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>영냥이 사주 참치 상담</title><style>body{max-width:540px;margin:auto;background:#faf5ed;color:#342732;font:16px/1.7 system-ui}img{width:100%;height:auto;display:block}h1,p{padding:0 18px}</style><h1>영냥이 사주 참치 상담</h1><p>로컬 편집 미리보기. 실제 화면은 mobile.json 및 실제 화면 캡처를 참조하세요.</p><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/01-next-season.webp" alt="달빛 기차역에서 다음 길을 기다리는 공식 영냥이. 사주 참치 장기 전환 상담의 표지." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/02-time-map.webp" alt="원국, 대운, 세운을 바탕, 긴 시기의 배경, 해마다의 변화로 구분하는 개념 시간지도." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/03-transition-question.webp" alt="장기 전환 질문 상담 앞부분의 기질, 강점, 답과 근거, 주기와 전환, 회복과 시나리오 대응 목차." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/04-question-life.webp" alt="장기 질문 상담에서 인생 전반의 열두 영역과 마지막 종합 실행 계획을 살핀다." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/05-personal-foundation.webp" alt="별도 기본 사주 전체 성향 리포트의 첫 열 목차. 일간, 오행, 사랑, 표현, 결혼, 재물, 책임과 압박." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/06-personal-relations.webp" alt="기본 성향 리포트 11~19장의 배움, 동료, 가족, 회복, 귀인과 보완 기운 목차." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/07-personal-timing.webp" alt="기본 성향 리포트 20~28장의 대운, 연간과 월간 흐름, 연애와 결혼, 이동 목차." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/08-scenario.webp" alt="다음 시기를 기다리며 현실의 일과 생활을 작은 시도로 점검하는 가상의 문장 예시." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/09-reading-method.webp" alt="제작자의 경력과 AI 해설을 구분하고 십성, 용신 등 용어를 생활 선택으로 해석하는 방법." width="1080" height="1440"><img src="../../../../public/feature-details/crafted/yeongnyangi-saju-tuna/10-ready.webp" alt="기차역 이미지와 함께 출생 정보, 현재 고민, 살펴볼 기간을 준비하도록 마무리한다." width="1080" height="1440"><p>장기 흐름 도식과 대화는 이해를 돕기 위한 편집 예시이며 실제 고객 결과가 아닙니다. 질문 상담과 전체 성향 리포트는 별도 선택 흐름입니다. 대운·세운은 미래 사건의 확정 날짜나 성공 확률이 아닙니다. 계산 가능한 출생 정보와 시기 근거 안에서 해석합니다. 가격과 추가 질문 조건은 기존 상담 준비 화면에서 확인해 주세요.</p></html>
