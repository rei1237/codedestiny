<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fusion Fortune</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d21;color:#f6f0ff;font-family:Arial,'Malgun Gothic',sans-serif;line-height:1.7}main{max-width:960px;margin:auto;padding:24px}a,button{color:inherit}nav{display:flex;justify-content:space-between;margin-bottom:24px}button{font:inherit;min-height:44px;border:1px solid #78658e;border-radius:12px;padding:10px 20px;background:transparent;cursor:pointer}button:focus-visible{outline:3px solid #ead089;outline-offset:4px}.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;border:1px solid #796a78;padding:48px;background:#171225}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#171225 5%,#171225c9 58%,#17122550),url('../../public/images/fusion-fortune/fusion-guardian-celestial-hero.webp') center/cover;z-index:-1}h1{font-size:48px;line-height:1.25;letter-spacing:-.025em;margin:0 0 24px;max-width:620px}p{max-width:62ch}.muted{color:#cfc2e0}.gold{color:#ead089}.cta{background:#ead089;color:#21182b;border-color:#ead089;font-weight:bold}.meta{margin:24px 0;display:flex;gap:18px;flex-wrap:wrap}.trust{font-size:14px;margin:22px 0 0}.flow{display:flex;flex-wrap:wrap;gap:12px;padding:28px 0;border-bottom:1px solid #554660}.flow span{color:#dfd2ef}.section{padding:28px 0;border-bottom:1px solid #554660}h2{font-size:26px;margin:0 0 16px}h3{font-size:19px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{border:1px solid #796a90;padding:14px;border-radius:10px;color:#e2d8ed}.step{display:grid;grid-template-columns:44px 1fr auto;gap:16px;padding:20px 0;border-top:1px solid #493b58;align-items:center}.orb{width:38px;height:38px;border-radius:50%;border:1px solid #bfa578;background:#322340}.step p{margin:4px 0;color:#cfc2e0}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{aspect-ratio:2/3;background:linear-gradient(145deg,#30213f,#1a1428);border:1px solid #a99064;display:grid;place-items:center;text-align:center;padding:8px;border-radius:10px}.final{padding:28px;background:#251d35;border:1px solid #bfa578;border-radius:18px}footer{padding:30px 0;color:#cfc2e0;font-size:13px}@media(max-width:600px){main{padding:16px}.hero{padding:28px 22px}h1{font-size:32px}.fields{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}.step{grid-template-columns:36px 1fr}.step>span:last-child{grid-column:2}.cta{width:100%}}
</style><main><nav><span data-i18n="brand"></span><button data-i18n="home"></button></nav><section class="hero"><h1 data-i18n="title"></h1><p class="muted" data-i18n="intro"></p><div class="meta gold"><span data-i18n="systems"></span><span data-i18n="length"></span><span data-i18n="save"></span></div><button class="cta" data-i18n="start" onclick="document.querySelector('#input').scrollIntoView()"></button><p class="trust muted" data-i18n="trust"></p></section><div class="flow"><span data-i18n="flow"></span></div><section class="section" id="input"><h2 data-i18n="input"></h2><p class="muted" data-i18n="profile"></p><div class="fields"><div class="field" data-i18n="date"></div><div class="field" data-i18n="time"></div><div class="field" data-i18n="place"></div><div class="field" data-i18n="topic"></div></div><p class="muted" data-i18n="payment"></p></section><section class="section"><h2 data-i18n="review"></h2><p class="muted" data-i18n="preview"></p><div id="steps"></div></section><section class="section"><h2 data-i18n="tarot"></h2><p class="muted" data-i18n="tarotIntro"></p><div class="cards" id="cards"></div></section><section class="section"><h2 data-i18n="cross"></h2><p class="muted" data-i18n="crossIntro"></p></section><section class="section"><div class="final"><h2 class="gold" data-i18n="final"></h2><p data-i18n="finalIntro"></p></div></section><footer data-i18n="footer"></footer></main><script>
const copy={brand:'Code Destiny · 초융합 운세',home:'홈으로',title:'여섯 전문가의 해석,\n하나로 깊어지는 나의 운세',intro:'사주부터 타로까지, 각 체계의 근거를 독립적으로 읽고 함께 가리키는 흐름과 서로 다른 관점을 하나의 상담으로 정리합니다.',systems:'여섯 체계 교차 해석',length:'한국어 완성본 30,000자 이상',save:'저장 · 재열람 · PDF',start:'나의 초융합 상담 준비하기',trust:'사주 엔진 — 실제 경력 10년차 명리학자 설계·자문',flow:'출생정보 입력 → 여섯 전문가 분석 → 교차 검증 → 최적 운세 답안',input:'태어난 순간에서 시작합니다',profile:'저장한 프로필로 채우고, 생시와 출생지를 확인해 주세요.',date:'생년월일 · 필수',time:'태어난 시각 · 필수',place:'출생지 · 필수',topic:'상담 주제',payment:'입력 확인 후 기존 결제창에서 이용권·월정석·단건 결제를 선택합니다. 가격은 서비스 가격표를 사용합니다.',review:'여섯 전문가의 검토',preview:'진행 상태 구성 예시입니다. 실제 분석 완료 이벤트가 도착한 체계에만 완료 표시를 붙입니다.',tarot:'지금의 선택을 비추는 여섯 장',tarotIntro:'카드를 뒤집어 이번 상담에 선택된 카드와 정·역방향을 확인합니다.',cross:'함께 가리키는 흐름과 관점의 차이',crossIntro:'완료된 여섯 분석의 근거를 비교합니다. 시기·관계·심리 등 질문의 영역에 맞춰 어떤 근거를 우선했는지 설명합니다.',final:'최적 운세 답안',finalIntro:'여섯 분석과 교차 검증이 완료되면 종합 결론과 지금 실행할 행동을 공개합니다.',footer:'960px 화면 구성 목업 · 실제 개인 운세나 결제 화면이 아닙니다.',waiting:'분석 대기',detail:'전문 근거 → 독립 결론 → 행동 조언',saju:'사주',ziwei:'자미두수',vedic:'베다점성술',sukuyo:'숙요점',astrology:'서양 점성술',tarotLabel:'타로',current:'현재 상황',inner:'내면',obstacle:'장애물',external:'외부 영향',choice:'선택',action:'다음 행동'};
document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=copy[e.dataset.i18n]);for(const key of ['saju','ziwei','vedic','sukuyo','astrology','tarotLabel']){const e=document.createElement('div');e.className='step';e.innerHTML='<span class="orb"></span><div><strong></strong><p></p></div><span class="gold"></span>';e.querySelector('strong').textContent=copy[key];e.querySelector('p').textContent=copy.detail;e.lastChild.textContent=copy.waiting;document.querySelector('#steps').append(e)}for(const key of ['current','inner','obstacle','external','choice','action']){const e=document.createElement('div');e.className='card';e.textContent=copy[key];document.querySelector('#cards').append(e)}
</script></html>
