<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>베다 점성술 — 별들의 지도</title>
<link id="gfont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=optional" onerror="this.remove()">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" onerror="this.remove()">
<style>
/* ── 오프라인 폴백 폰트 스택 ─────────────────────────────
   Cinzel 폰트가 없으면 Georgia → Times New Roman → serif 순으로 대체
   한글은 Apple SD Gothic Neo → Malgun Gothic → NanumGothic → 시스템 기본 */
/* 온라인이면 Google Fonts 로드, 오프라인이면 아래 --font-display/--font-body 폴백 사용 */

:root {
  --font-display: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
  --font-body: 'Pretendard Variable', Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'NanumGothic', '나눔고딕', '맑은 고딕', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#D4AF37;--gold2:#F5D06A;--purple:#7C3AED;--purple2:#A78BFA;--cyan:#06B6D4;--pink:#EC4899;
  --red:#FF4444;--green:#22C55E;--orange:#F59E0B;
  /* "심연의 우주" 네뷸라 베이스 */
  --bg:#030208;--bg2:#0b0824;--bg3:#1a0b33; /* black → indigo-950 → purple-900 */
  --neb1:rgba(124,58,237,0.18);
  --neb2:rgba(30,64,175,0.18);
  --neb3:rgba(236,72,153,0.10);
  /* Glassmorphism */
  --glass:rgba(255,255,255,0.085);--glassdark:rgba(0,0,0,0.3);
  --border:rgba(139,92,246,0.25);--bordergold:rgba(212,175,55,0.3);
  --text:#F0E8FF;--text2:rgba(240,232,255,0.65);--text3:rgba(240,232,255,0.4);
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1100px 650px at 12% 18%, var(--neb2), transparent 60%),
    radial-gradient(900px 520px at 82% 22%, var(--neb1), transparent 62%),
    radial-gradient(720px 520px at 70% 86%, var(--neb3), transparent 60%),
    linear-gradient(180deg, var(--bg3) 0%, var(--bg2) 35%, var(--bg) 100%);
  color:var(--text);
  font-size:14px;
  line-height:1.6;
}
body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  z-index:-2;
  background:
    radial-gradient(1200px 700px at 50% 10%, rgba(255,255,255,0.06), transparent 60%),
    radial-gradient(900px 520px at 20% 70%, rgba(255,255,255,0.035), transparent 62%),
    radial-gradient(760px 460px at 85% 78%, rgba(255,255,255,0.03), transparent 62%);
  filter:blur(0.5px);
}
body::after{
  content:"";
  position:fixed;inset:-40px;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(closest-side at 50% 50%, transparent 68%, rgba(0,0,0,0.55) 100%);
}
h1,h2,h3,.cinzel{font-family:var(--font-display);letter-spacing:0.05em}
input,select,textarea{
  background:rgba(255,255,255,0.06);border:1px solid rgba(139,92,246,0.35);border-radius:10px;
  padding:10px 14px;color:#fff;font-size:14px;outline:none;width:100%;
  font-family:var(--font-body);transition:border-color 0.2s;
}
input:focus,select:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(167,139,250,0.15)}
select option{background:#1a0040;color:#fff}
input::placeholder{color:var(--text3)}
label{
  font-size:12px;
  color:rgba(240,232,255,0.78);
  margin-bottom:6px;
  display:block;
  font-weight:600;
  letter-spacing:0.02em;
}
button{cursor:pointer;font-family:var(--font-body);border:none;outline:none}
.btn-primary{
  background:linear-gradient(135deg,var(--purple),#4C1D95);color:#fff;
  padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;
  border:1px solid rgba(167,139,250,0.4);transition:all 0.2s;width:100%;
  text-align:center;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(0,0,0,0.35),0 0 0 1px rgba(212,175,55,0.15),0 0 24px rgba(245,208,106,0.14)}
.btn-primary:active{transform:scale(0.97)}
.btn-sm{padding:7px 16px;border-radius:8px;font-size:12px;background:rgba(139,92,246,0.2);color:var(--purple2);border:1px solid var(--border);transition:all 0.2s}
.btn-sm:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,0.3),0 0 18px rgba(245,208,106,0.12);border-color:rgba(245,208,106,0.22)}
.btn-sm:active{transform:scale(0.95)}
.glass{
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(245,208,106,0.22);
  border-radius:16px;
  box-shadow:0 18px 60px rgba(0,0,0,0.34);
}
.glass:hover{box-shadow:0 20px 70px rgba(0,0,0,0.40),0 0 0 1px rgba(245,208,106,0.16),0 0 28px rgba(245,208,106,0.12)}
.card-gold{background:rgba(212,175,55,0.06);border:1px solid var(--bordergold);border-radius:16px;padding:16px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;gap:4px}
.tag-purple{background:rgba(139,92,246,0.2);color:var(--purple2);border:1px solid rgba(139,92,246,0.3)}
.tag-gold{background:rgba(212,175,55,0.15);color:var(--gold2);border:1px solid rgba(212,175,55,0.3)}
.tag-cyan{background:rgba(6,182,212,0.15);color:var(--cyan);border:1px solid rgba(6,182,212,0.3)}
.tag-pink{background:rgba(236,72,153,0.15);color:var(--pink);border:1px solid rgba(236,72,153,0.3)}
.tag-red{background:rgba(255,68,68,0.15);color:var(--red);border:1px solid rgba(255,68,68,0.3)}
.tag-green{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.3)}
.section{padding:0 0 24px}
.section-title{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;padding-left:2px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:16px 0}
.bar-wrap{height:6px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px}
.score-ring{display:flex;flex-direction:column;align-items:center;gap:4px}
.planet-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.planet-row:last-child{border-bottom:none}
.p-sym{font-size:18px;width:28px;text-align:center}
.p-name{font-weight:600;font-size:13px;min-width:54px}
.p-sign{color:var(--text2);font-size:12px;flex:1}
.p-badge{font-size:10px;padding:2px 8px;border-radius:10px}
.house-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;text-align:center;position:relative;min-height:50px;padding:4px;
  border:1px solid rgba(139,92,246,0.2);background:rgba(139,92,246,0.04);
}
.house-num{font-size:9px;color:var(--text3);position:absolute;top:2px;left:3px}
.house-sign{font-size:9px;color:var(--gold);margin-bottom:2px}
.house-planets{font-size:10px;color:var(--cyan);line-height:1.3}
.module-card{
  background:var(--glass);border:1px solid var(--border);border-radius:16px;
  padding:16px;cursor:pointer;transition:all 0.25s;user-select:none;
  display:flex;align-items:center;gap:14px;
}
.module-card:active{transform:scale(0.97);border-color:var(--purple2)}
.module-icon{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.module-title{font-family:var(--font-display);font-size:14px;font-weight:600;margin-bottom:3px}
.module-sub{font-size:11px;color:var(--text2)}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:6px}
.back-btn:active{transform:scale(0.95)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-value{font-size:13px;font-weight:500;color:var(--text)}
.chakra-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chakra-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chakra-name{font-size:12px;min-width:100px;color:var(--text2)}
.chakra-score{font-size:11px;color:var(--text3);min-width:30px;text-align:right}
.compat-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.compat-name{font-size:12px;color:var(--text2);min-width:120px}
.compat-score{font-size:11px;min-width:32px;text-align:right;color:var(--text3)}
.dasha-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.dasha-planet{font-size:13px;font-weight:600;min-width:70px}
.dasha-years{font-size:11px;color:var(--text3);flex:1}
.dasha-active{background:rgba(212,175,55,0.1);border-radius:8px;padding:2px 8px;color:var(--gold);font-size:10px}
.page{display:none;padding:16px;max-width:480px;margin:0 auto}
.page.active{display:block}
#app{min-height:100vh;position:relative}
.lagna-asc{
  width:100%;height:36px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.15),transparent);
  font-family:var(--font-display);font-size:11px;color:var(--gold);letter-spacing:0.15em;
  border-top:1px solid var(--bordergold);border-bottom:1px solid var(--bordergold);
  margin-bottom:12px;
}
.result-hero{
  background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(6,182,212,0.15));
  border:1px solid rgba(139,92,246,0.3);border-radius:20px;padding:20px;
  text-align:center;margin-bottom:20px;
}
.result-hero-name{font-family:var(--font-display);font-size:22px;color:var(--gold);margin-bottom:6px}
.result-hero-sub{font-size:12px;color:var(--text2)}
.info-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;margin-bottom:10px;font-size:12px;line-height:1.7;color:var(--text2)}
.info-box strong{color:var(--text)}
.tips{font-size:11px;color:var(--text3);background:rgba(212,175,55,0.07);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:10px}
.yoga-card{background:rgba(6,182,212,0.07);border:1px solid rgba(6,182,212,0.2);border-radius:12px;padding:14px;margin-bottom:10px}
.yoga-name{font-weight:700;font-size:14px;color:var(--cyan);margin-bottom:4px}
.yoga-type{font-size:11px;color:var(--text3)}
.yoga-benefit{font-size:12px;color:var(--text2);margin-top:6px}
.compat-header{background:linear-gradient(135deg,rgba(236,72,153,0.2),rgba(124,58,237,0.2));border:1px solid rgba(236,72,153,0.3);border-radius:16px;padding:16px;text-align:center;margin-bottom:16px}
.compat-total{font-size:32px;font-family:var(--font-display);color:var(--gold)}
.nabisco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 0 16px}
.south-chart{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid rgba(139,92,246,0.3);border-radius:4px;overflow:hidden;background:rgba(139,92,246,0.1)}
.north-chart svg{width:100%;height:auto}
.chart-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.chart-toggle-btn{flex:1;padding:8px;text-align:center;font-size:12px;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all 0.2s}
.chart-toggle-btn.active{background:rgba(139,92,246,0.25);color:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(212,175,55,0.3)}50%{box-shadow:0 0 20px rgba(212,175,55,0.6)}}
@keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
@keyframes spinRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp 0.4s ease forwards}
.active-dasha{animation:glow 2s ease-in-out infinite}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:20px}
.loading-ring{width:60px;height:60px;border:3px solid rgba(139,92,246,0.2);border-top-color:var(--purple2);border-radius:50%;animation:spinRing 0.8s linear infinite}
.loading-text{color:var(--text2);font-size:13px;animation:pulse 1.5s ease-in-out infinite}
.error-box{background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.3);border-radius:12px;padding:16px;color:#ff9999;font-size:13px;text-align:center}

/* ── 개편 추가 스타일 ───────────────────────────────────── */

/* 스크롤 페이드인 */
.reveal{opacity:0;transform:translateY(22px);transition:opacity 0.55s ease,transform 0.55s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-delay-1{transition-delay:0.08s}
.reveal-delay-2{transition-delay:0.16s}
.reveal-delay-3{transition-delay:0.24s}
.reveal-delay-4{transition-delay:0.32s}

/* 반응형 타이포 */
.hero-name{font-family:var(--font-display);font-size:clamp(20px,5vw,28px);color:var(--gold);line-height:1.2}
.hero-sub{font-size:clamp(11px,2.5vw,13px);color:var(--text2)}
.section-head{font-family:var(--font-display);font-size:clamp(13px,3vw,15px);color:var(--gold);letter-spacing:0.08em;margin-bottom:4px}
.section-head{
  font-variation-settings:"wght" 650;
  text-shadow:0 0 16px rgba(245,208,106,0.14);
}
.section-head-kr{
  font-family:var(--font-body);
  font-weight:800;
  letter-spacing:0.02em;
  text-shadow:none;
}
.form-subhead{
  font-family:var(--font-display);
  font-variation-settings:"wght" 700;
  letter-spacing:0.12em;
  text-transform:none;
}
.module-title,.mod-title{
  font-variation-settings:"wght" 650;
  letter-spacing:0.06em;
  text-shadow:0 0 14px rgba(245,208,106,0.10);
}
.body-text{font-size:clamp(13px,3.2vw,14px);line-height:1.75;color:var(--text2)}
.sage-text{
  font-size:clamp(13px,3.2vw,14px);
  line-height:1.85;
  color:var(--text2);
  font-style:italic;
  padding:12px 14px;
  background:rgba(212,175,55,0.06);
  border:1px solid rgba(245,208,106,0.14);
  border-radius:14px;
  margin:10px 0;
  box-shadow:0 14px 40px rgba(0,0,0,0.24);
}
.keyword{display:inline;background:rgba(212,175,55,0.15);color:var(--gold2);border:1px solid rgba(212,175,55,0.3);border-radius:4px;padding:1px 6px;font-size:0.92em;font-weight:500}

/* 탭 시스템 */
.tab-bar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,0.06);color:var(--text2);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.2s;white-space:nowrap}
.tab-btn.active{background:rgba(139,92,246,0.25);color:#fff;border-color:rgba(139,92,246,0.5)}
.tab-btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,0.28),0 0 18px rgba(245,208,106,0.10);border-color:rgba(245,208,106,0.20)}
.tab-btn:active{transform:scale(0.95)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* 아코디언 */
.acc-item{border:1px solid rgba(255,255,255,0.07);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc-header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background 0.2s}
.acc-header:active{background:rgba(255,255,255,0.04)}
.acc-title{font-size:13px;font-weight:600;flex:1}
.acc-arrow{font-size:12px;color:var(--text3);transition:transform 0.25s;flex-shrink:0}
.acc-body{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(.4,0,.2,1)}
.acc-body.open{max-height:600px}
.acc-inner{padding:0 14px 14px}

/* 행성 테이블 개편 */
.planet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.planet-cell{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:8px 6px;text-align:center;position:relative;overflow:hidden}
.planet-cell::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.planet-sym-big{font-size:20px;display:block;margin-bottom:2px}
.planet-nm{font-size:11px;font-weight:700;margin-bottom:2px}
.planet-pos{font-size:10px;color:var(--text3);line-height:1.3}
.planet-dig{font-size:9px;padding:1px 6px;border-radius:8px;margin-top:3px;display:inline-block}

/* 요약 카드 그리드 */
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.sum-card{background:rgba(255,255,255,0.04);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.07);position:relative;overflow:hidden}
.sum-card-label{font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
.sum-card-val{font-size:clamp(12px,3vw,14px);font-weight:700;line-height:1.3}
.sum-card-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* 모듈 카드 (개편) */
.mod-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all 0.22s;user-select:none;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 16px 44px rgba(0,0,0,0.38),0 0 24px rgba(245,208,106,0.12);border-color:rgba(245,208,106,0.22)}
.mod-card:active{transform:scale(0.97)}
.mod-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.mod-texts{flex:1;min-width:0}
.mod-title{font-family:var(--font-display);font-size:13px;font-weight:600;margin-bottom:2px}
.mod-preview{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-score{font-size:18px;font-family:var(--font-display);font-weight:700;flex-shrink:0}

/* 다샤 타임라인 */
.dasha-timeline{position:relative;padding-left:20px}
.dasha-timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--purple2),transparent)}
.dasha-node{position:relative;margin-bottom:14px}
.dasha-dot{position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;border:2px solid var(--purple2);background:var(--bg)}
.dasha-dot.active-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(212,175,55,0.6)}
.dasha-period{font-size:12px;font-weight:600;margin-bottom:2px}
.dasha-range{font-size:11px;color:var(--text3)}
.dasha-insight{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.6}

/* 차크라 링 */
.chakra-list{display:flex;flex-direction:column;gap:10px}
.chakra-item{display:flex;align-items:center;gap:10px}
.chakra-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:#fff}
.chakra-circle{position:relative;isolation:isolate}
.chakra-circle::after{
  content:"";
  position:absolute;inset:-6px;
  border-radius:999px;
  border:1px solid rgba(245,208,106,0.22);
  opacity:0;
  transform:scale(0.92);
  animation:chakraPulse 2.1s ease-in-out infinite;
}
@keyframes chakraPulse{
  0%,100%{opacity:0;transform:scale(0.92)}
  40%{opacity:0.6;transform:scale(1.08)}
  70%{opacity:0.12;transform:scale(1.22)}
}

/* 차크라 에너지 바: 무지개 흐름 */
.chakra-energy{
  height:8px;
  background:rgba(255,255,255,0.08);
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(245,208,106,0.14);
}
.chakra-energy > .chakra-energy-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#32ade6,#0a84ff,#bf5af2);
  box-shadow:0 0 22px rgba(245,208,106,0.16);
  position:relative;
  transition:width 1.1s cubic-bezier(.4,0,.2,1);
}
.chakra-energy > .chakra-energy-fill::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);
  transform:translateX(-60%);
  animation:energyFlow 1.8s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes energyFlow{to{transform:translateX(60%)}}

/* 별자리 연결선 드로잉 */
.constellation-path{width:100%;height:64px;display:block;opacity:0.9}
.constellation-path path{
  stroke:rgba(245,208,106,0.75);
  stroke-width:1.25;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:420;
  stroke-dashoffset:420;
  animation:constellationDraw 1.6s ease forwards;
  animation-play-state:paused;
  filter:drop-shadow(0 0 10px rgba(245,208,106,0.18));
}
.reveal.visible .constellation-path path{animation-play-state:running}
@keyframes constellationDraw{to{stroke-dashoffset:0}}
.chakra-info{flex:1}
.chakra-label{font-size:12px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.chakra-desc{font-size:11px;color:var(--text3);line-height:1.5}

/* 궁합 */
.compat-score-big{font-family:var(--font-display);font-size:clamp(42px,10vw,56px);font-weight:700;line-height:1}
.compat-item{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:8px;margin-bottom:9px}
.compat-label{font-size:11px;color:var(--text2)}
.compat-num{font-size:11px;text-align:right;font-weight:600}

/* 디테일 헤더 */
.detail-topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 10px;
  position:sticky;
  top:0;
  z-index:20;
  margin:0 -10px 16px;
  border-radius:16px;
  overflow:hidden;
  border-bottom:1px solid rgba(245,208,106,0.12);
  background:
    linear-gradient(180deg, rgba(3,2,8,0.85) 0%, rgba(3,2,8,0.55) 100%);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.detail-topbar::before{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  background:
    radial-gradient(520px 120px at 30% 0%, rgba(124,58,237,0.18), transparent 70%),
    radial-gradient(420px 120px at 80% 0%, rgba(30,64,175,0.16), transparent 70%);
  opacity:0.9;
}
.detail-topbar::after{
  content:"";
  position:absolute;left:12px;right:12px;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent, rgba(245,208,106,0.35), transparent);
  pointer-events:none;
}
.detail-topbar-inner{
  position:relative;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:12px;
  width:100%;
}
.detail-title{
  font-family:var(--font-display);
  font-variation-settings:"wght" 700;
  letter-spacing:0.10em;
  text-shadow:0 0 18px rgba(245,208,106,0.16);
  text-align:center;
}
.detail-sub{font-size:11px;color:rgba(240,232,255,0.5);letter-spacing:0.08em;text-align:center}
.detail-spacer{width:84px}

/* 뒤로 버튼: 우주 컨셉 글래스 칩 */
.back-btn{
  position:relative;
  border:1px solid rgba(245,208,106,0.22);
  background:rgba(255,255,255,0.06);
  color:rgba(240,232,255,0.85);

}
.back-btn::before{
  content:"";

  border-radius:999px;
  background:linear-gradient(90deg, rgba(245,208,106,0.10), rgba(124,58,237,0.12), rgba(30,64,175,0.10));
  opacity:0.35;
  filter:blur(8px);
  z-index:-1;
}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(0,0,0,0.36),0 0 22px rgba(245,208,106,0.14)}
.back-btn:active{transform:scale(0.97)}

      sel.innerHTML = '';
      if(firstOpt) sel.appendChild(firstOpt);
      
      groups.forEach(function(g){
        if(!g || !Array.isArray(g.places) || !g.places.length) return;
        var og=document.createElement('optgroup');
        og.label = g.label || '장소';
        g.places.forEach(function(p){
          if(!p) return;
          var opt=document.createElement('option');
          opt.value = p.tz || '';
          opt.textContent = p.label || (p.tz || '장소');
          opt.setAttribute('data-long', String(p.lon));
          opt.setAttribute('data-lat', String(p.lat));
          opt.setAttribute('data-tz', String(p.tzOff));
          opt.setAttribute('data-base-tz', String(p.tzOff));
          if(p.def){
            opt.selected = true;
            // Immediately apply default place coordinates
            setTimeout(function(){ 
              try{ 
                var evt = document.createEvent('HTMLEvents');
                evt.initEvent('change', true, false);
                sel.dispatchEvent(evt);
              }catch(_){} 
            }, 0);
          }
          og.appendChild(opt);
        });
        sel.appendChild(og);
      });
    }
  }catch(e){ console.error('Error building place select:', e); }
}

function vedicApplySelectedPlace(){
  var sel=document.getElementById('v_place');
  if(!sel) return;
  
  var opt=sel.options[sel.selectedIndex];
  if(!opt) return;
  
  // Get coordinates from selected option, fallback to Seoul if placeholder selected
  var lat=parseFloat(opt.getAttribute('data-lat')||'');
  var lon=parseFloat(opt.getAttribute('data-long')||'');
  var tz=parseFloat(opt.getAttribute('data-tz')||opt.getAttribute('data-base-tz')||'');
  
  // If placeholder/no coordinates, use Seoul as default
  if(isNaN(lat)) lat=37.5665;
  if(isNaN(lon)) lon=126.9780;
  if(isNaN(tz)) tz=9;
  
  var latEl=document.getElementById('v_lat');
  var lonEl=document.getElementById('v_lon');
  var tzEl=document.getElementById('v_tz');
  
  if(latEl) { 
    latEl.value = String(lat); 
    // Trigger input event for sync
    try{
      var evt = document.createEvent('HTMLEvents');
      evt.initEvent('input', true, false);
      latEl.dispatchEvent(evt);
    }catch(_){}
  }
  if(lonEl) { 
    lonEl.value = String(lon); 
    try{
      var evt = document.createEvent('HTMLEvents');
      evt.initEvent('input', true, false);
      lonEl.dispatchEvent(evt);
    }catch(_){}
  }
  if(tzEl) { 
    tzEl.value = String(tz); 
    try{
      var evt = document.createEvent('HTMLEvents');
      evt.initEvent('input', true, false);
      tzEl.dispatchEvent(evt);
    }catch(_){}
  }
}

(function(){
  const c=document.getElementById('starCanvas'),ctx=c.getContext('2d'),stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars.length=0;
    for(let i=0;i<150;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.3,t:Math.random()*6.28,s:Math.random()*.04+.005});}
  window.addEventListener('resize',resize);resize();
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.t+=s.s;const a=0.4+0.5*Math.sin(s.t);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();});requestAnimationFrame(draw);}
  draw();
})();

// ─── ASTRONOMY ENGINE ─────────────────────────────────────
const nd=d=>((d%360)+360)%360;
const r2d=d=>d*Math.PI/180;

function julianDay(yr,mo,dy,hr){
  let y=yr,m=mo;if(m<=2){y--;m+=12;}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+dy+B-1524.5+hr/24;
}
function ayanamsa(jd){
  const T=(jd-2415020.0)/36524.2198782;
  return nd(22.460148+1.396468*T+0.000308*T*T);
}
function calcPlanets(jd){
  // Local fallback ephemeris:
  // - Uses simple Keplerian orbital elements (good "ballpark" accuracy) for Sun+planets
  // - Keeps current fast Moon approximation (Moon is the most sensitive; API remains the gold standard)
  const ay=ayanamsa(jd);
  const d = jd - 2451543.5; // days since J2000 (matches common low-precision element sets)

  function _deg(x){ return x*180/Math.PI; }
  function _rad(x){ return x*Math.PI/180; }
  function _fix(a){ return nd(a); }
  function _sin(x){ return Math.sin(x); }
  function _cos(x){ return Math.cos(x); }

  function _kepler(M,e){
    // solve E - e sin E = M (radians)
    let E=M,delta=1,iter=0;
    while(Math.abs(delta) > 1e-6 && iter < 20){
      delta = (E - e*_sin(E) - M) / (1 - e*_cos(E));
      E = E - delta;
      iter++;
    }
    return E;
  }

  // Paul Schlyter-style low-precision elements (degrees, AU). Accurate enough for fallback UI.
  // Source idea: "Computing planetary positions" (commonly used in hobby ephemeris).
  function _elements(name){
    const el = {
      Sun:     { N:0,      i:0,        w:282.9404+4.70935e-5*d, a:1.000000, e:0.016709-1.151e-9*d, M:356.0470+0.9856002585*d },
      Mercury: { N:48.3313+3.24587e-5*d, i:7.0047+5.00e-8*d,  w:29.1241+1.01444e-5*d, a:0.387098, e:0.205635+5.59e-10*d, M:168.6562+4.0923344368*d },
      Venus:   { N:76.6799+2.46590e-5*d, i:3.3946+2.75e-8*d,  w:54.8910+1.38374e-5*d, a:0.723330, e:0.006773-1.302e-9*d, M:48.0052+1.6021302244*d },
      Mars:    { N:49.5574+2.11081e-5*d, i:1.8497-1.78e-8*d,  w:286.5016+2.92961e-5*d, a:1.523688, e:0.093405+2.516e-9*d, M:18.6021+0.5240207766*d },
      Jupiter: { N:100.4542+2.76854e-5*d,i:1.3030-1.557e-7*d, w:273.8777+1.64505e-5*d, a:5.202560, e:0.048498+4.469e-9*d, M:19.8950+0.0830853001*d },
      Saturn:  { N:113.6634+2.38980e-5*d,i:2.4886-1.081e-7*d, w:339.3939+2.97661e-5*d, a:9.554750, e:0.055546-9.499e-9*d, M:316.9670+0.0334442282*d }
    };
    return el[name];
  }

  function _helioEcl(name){
    const e=_elements(name);
    const N=_rad(_fix(e.N||0));
    const i=_rad(_fix(e.i||0));
    const w=_rad(_fix(e.w||0));
    const a=e.a, ecc=e.e;
    const M=_rad(_fix(e.M||0));

    const E=_kepler(M,ecc);
    const xv=a*(_cos(E)-ecc);
    const yv=a*(Math.sqrt(1-ecc*ecc)*_sin(E));
    const v=Math.atan2(yv,xv);
    const r=Math.sqrt(xv*xv+yv*yv);

    const xh=r*(_cos(N)*_cos(v+w) - _sin(N)*_sin(v+w)*_cos(i));
    const yh=r*(_sin(N)*_cos(v+w) + _cos(N)*_sin(v+w)*_cos(i));
    const zh=r*(_sin(v+w)*_sin(i));
    return {x:xh,y:yh,z:zh,r:r};
  }

  // Earth heliocentric position via "Sun" elements (Sun's orbit == Earth's heliocentric)
  const earth=_helioEcl("Sun");

  function _geoLon(name){
    const p=_helioEcl(name);
    const xg=p.x - earth.x;
    const yg=p.y - earth.y;
    const lon=_fix(_deg(Math.atan2(yg,xg)));
    return lon;
  }

  // Sun geocentric longitude is Earth heliocentric + 180
  const sunLon = _fix(_deg(Math.atan2(earth.y, earth.x)) + 180);

  // Moon (keep existing fast approximation, but compute from jd consistently)
  const T=(jd-2451545.0)/36525;
  let moonLon=_fix(218.3164591+481267.88134236*T);
  const D=_fix(297.85036+445267.11480*T);
  const Mm=_fix(134.96298+477198.867398*T);
  moonLon=_fix(moonLon
    +6.289*_sin(_rad(Mm))
    -1.274*_sin(_rad(2*D-Mm))
    +0.658*_sin(_rad(2*D))
    -0.214*_sin(_rad(2*Mm))
    -0.110*_sin(_rad(D))
  );

  // Mean node (fallback); true node differs and can be off versus some sites.
  const rahuT=_fix(125.044555 - 1934.1361849*T);

  const sid = {
    Sun: _fix(sunLon - ay),
    Moon: _fix(moonLon - ay),
    Mercury: _fix(_geoLon("Mercury") - ay),
    Venus: _fix(_geoLon("Venus") - ay),
    Mars: _fix(_geoLon("Mars") - ay),
    Jupiter: _fix(_geoLon("Jupiter") - ay),
    Saturn: _fix(_geoLon("Saturn") - ay),
    Rahu: _fix(rahuT - ay)
  };
  sid.Ketu=_fix(sid.Rahu+180);
  return sid;
}
function calcAscendant(jd,lat,lon){
  const T=(jd-2451545.0)/36525;
  const GMST=nd(280.46061837+360.98564736629*(jd-2451545.0)+0.000387933*T*T);
  const LST=nd(GMST+lon);
  const eps=23.439292-0.013004*T;
  const asc=nd(Math.atan2(-Math.cos(r2d(LST)),Math.sin(r2d(LST))*Math.cos(r2d(eps))+Math.tan(r2d(lat))*Math.sin(r2d(eps)))*180/Math.PI);
  return nd(asc-ayanamsa(jd));
}
function isRetrograde(planet,jd){
  if(["Sun","Moon"].includes(planet))return false;
  if(["Rahu","Ketu"].includes(planet))return true;
  const l1=calcPlanets(jd-0.5)[planet];
  const l2=calcPlanets(jd+0.5)[planet];
  const diff=nd(l2-l1);return diff>180;
}
function dignity(planet,sign){
  if(EXALT[planet]===sign)return"Exalted";
  if(DEBIL[planet]===sign)return"Debilitated";

// ─── CHART BUILDER (f.timezone = UTC 오프셋 시간, 예: 9 = UTC+9) ─
function buildChart(f,lonsOverride){
  const utcH=f.hour+(f.minute||0)/60-f.timezone;
  const jd=julianDay(f.year,f.month,f.day,utcH);
  const lons=lonsOverride||calcPlanets(jd);
  const asc=calcAscendant(jd,f.lat,f.lon);
  const ps={};
  const allP=["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn","Rahu","Ketu"];
  for(const p of allP){
    const lon=lons[p];const sign=Math.floor(nd(lon)/30);
    ps[p]={lon,sign,signName:SIGNS[sign],deg:nd(lon)%30,retro:isRetrograde(p,jd),dignity:dignity(p,sign)};
  }
  const lagnaSign=Math.floor(nd(asc)/30);
  const houses=Array.from({length:12},(_,h)=>{
    const si=(lagnaSign+h)%12;
    return{num:h+1,sign:SIGNS[si],signKr:SIGNKR[si],si,lord:SLORDS[si],planets:allP.filter(p=>ps[p].sign===si)};
  });
  const rasi={asc,ascSign:SIGNS[lagnaSign],ascSignKr:SIGNKR[lagnaSign],planets:ps,houses};
  // Nakshatra
  const SPAN=360/27;const ml=nd(ps.Moon.lon);
  const ni=Math.floor(ml/SPAN);const din=ml-ni*SPAN;
  const nak={idx:ni,name:NAKS[ni].n,lord:NAKS[ni].l,pada:Math.floor(din/(SPAN/4))+1,din};
  // Vimshottari Dasha
  const firstIdx=DSEQ.findIndex(d=>d.p===nak.lord);
  const bal=DSEQ[firstIdx].y*(1-din/SPAN);
  const bd=new Date(f.year,f.month-1,f.day,f.hour,(f.minute||0));
  const dashas=[];let dt=new Date(bd);
  for(let i=0;i<9;i++){
    const info=DSEQ[(firstIdx+i)%9];const dur=i===0?bal:info.y;
    const start=new Date(dt);const end=new Date(dt.getTime()+dur*365.25*86400000);
    const ants=[];let ad=new Date(start);
    for(let j=0;j<9;j++){
      const ai=DSEQ[(firstIdx+i+j)%9];const ay=dur*ai.y/120;
      const ae=new Date(ad.getTime()+ay*365.25*86400000);
      ants.push({p:ai.p,start:new Date(ad),end:new Date(ae)});ad=new Date(ae);
    }

  }
  const now=new Date();
  const maha=dashas.find(d=>now>=d.start&&now<=d.end)||dashas[dashas.length-1];
  const anta=maha.ants.find(a=>now>=a.start&&now<=a.end)||maha.ants[0];
  // D9 Navamsa
  const d9={};const NAVS=30/9;
  const navStart={0:0,1:9,2:6,3:3,4:0,5:9,6:6,7:3,8:0,9:9,10:6,11:3};
  for(const p of allP){
    const pos=ps[p];const ni2=Math.floor(pos.deg/NAVS);const ss=navStart[pos.sign];
    const ns=(ss+ni2)%12;d9[p]={sign:ns,signName:SIGNS[ns]};
  }

  const d10={};
  for(const p of allP){
    const pos=ps[p];const di=Math.floor(pos.deg/3);
    const ss=pos.sign%2===0?pos.sign:(pos.sign+8)%12;
    const ds=(ss+di)%12;d10[p]={sign:ds,signName:SIGNS[ds]};
  }
  return{f,rasi,nak,dashas,maha,anta,d9,d10};
}

// Ashtakoot Milan (Compatibility)
function calcCompatibility(nak1,nak2){
  const i1=NAKS.findIndex(n=>n.n===nak1);const i2=NAKS.findIndex(n=>n.n===nak2);
  // Varna (1)
  const varnaMap={"Ashwini":3,"Bharani":0,"Krittika":1,"Rohini":3,"Mrigashira":2,"Ardra":0,"Punarvasu":3,"Pushya":1,"Ashlesha":0,"Magha":0,"Purva Phalguni":3,"Uttara Phalguni":3,"Hasta":2,"Chitra":3,"Swati":2,"Vishakha":3,"Anuradha":2,"Jyeshtha":0,"Mula":1,"Purva Ashadha":3,"Uttara Ashadha":1,"Shravana":2,"Dhanishtha":3,"Shatabhisha":2,"Purva Bhadrapada":1,"Uttara Bhadrapada":3,"Revati":3};
  const varna=varnaMap[nak1]>=varnaMap[nak2]?1:0;
  // Vashya (2) — simplified
  const vashya=Math.abs(i1-i2)<=4?2:1;
  // Tara (3)
  const t1=(i2-i1+27)%27%9+1;const t2=(i1-i2+27)%27%9+1;
  const taraScore=[1,3,5,7].includes(t1)&&[1,3,5,7].includes(t2)?3:[1,3,5,7].includes(t1)||[1,3,5,7].includes(t2)?1.5:0;
  // Yoni (4)
  const y1=NKYONI[nak1],y2=NKYONI[nak2];
  const hostile=[["Dog","Deer"],["Cat","Rat"],["Horse","Buffalo"],["Elephant","Lion"],["Goat","Mongoose"],["Cow","Tiger"],["Serpent","Mongoose"]];
  const yoni=y1===y2?4:hostile.some(h=>(y1===h[0]&&y2===h[1])||(y1===h[1]&&y2===h[0]))?0:2;
  // Graha Maitri (5)
  const l1=NAKS[i1].l,l2=NAKS[i2].l;
  const r1=l1===l2?"Neutral":(PFRIEND[l1]&&PFRIEND[l1][l2])||"Neutral";
  const r2=l1===l2?"Neutral":(PFRIEND[l2]&&PFRIEND[l2][l1])||"Neutral";
  const gmScores={"Friend-Friend":5,"Friend-Neutral":4,"Neutral-Friend":4,"Neutral-Neutral":3,"Friend-Enemy":1,"Enemy-Friend":1,"Enemy-Neutral":0.5,"Neutral-Enemy":0.5,"Enemy-Enemy":0};
  const gm=gmScores[`${r1}-${r2}`]||3;
  // Gana (6)
  const g1=NKGANA[nak1],g2=NKGANA[nak2];
  const gana=g1===g2?6:g1==="Deva"&&g2==="Manushya"||g1==="Manushya"&&g2==="Deva"?5:g1==="Deva"&&g2==="Rakshasa"||g1==="Rakshasa"&&g2==="Deva"?0:3;
  // Bhakoot (7)
  const s1=Math.floor(i1/2.25),s2=Math.floor(i2/2.25);
  const diff=Math.abs(s1-s2);
  const bhakoot=[6,8,5,9].includes(diff+1)||[6,8,5,9].includes(12-diff)?0:7;
  // Nadi (8)
  const nadi=NKNADI[nak1]!==NKNADI[nak2]?8:0;
  const total=Math.round(varna+vashya+taraScore+yoni+gm+gana+bhakoot+nadi);
  const why={
    varna: varna===1
      ? `Varna 점수 1점: 두 낙샤트라의 Varna(계층) 흐름이 상호 수용 가능한 방향입니다. 관계에서 역할·기대치가 자연스럽게 정렬되기 쉬워요.`
      : `Varna 점수 0점: Varna(계층) 관점에서 기대치/역할 인식 차이가 커질 수 있습니다. 현실적 기준(가치관·생활방식)을 명확히 맞추는 것이 중요합니다.`,
    vashya: vashya===2
      ? `Vashya 2점: 두 낙샤트라의 거리(상호 끌림/영향권)가 가까운 편으로, 주도권 싸움 없이 리듬을 맞추기 쉽습니다.`
      : `Vashya 1점: 상호 영향권이 다소 분리되어 각자 고집이 살아날 수 있습니다. 중요한 의사결정은 “원칙 합의 → 역할 분담” 순서가 유리합니다.`,
    tara: taraScore===3
      ? `Tara 3점: Tara(행운/보호) 패턴이 상호 길(吉) 쪽으로 맞물립니다. 함께 있을 때 컨디션·운의 흐름이 안정적입니다.`
      : taraScore>0
        ? `Tara ${taraScore}점: 한쪽은 길(吉) 흐름인데 다른 한쪽이 약할 수 있습니다. 컨디션/시기운이 엇갈릴 때 서로 “휴식·배려”를 우선하면 균형이 잡힙니다.`
        : `Tara 0점: Tara 관점에서 시기운이 충돌할 수 있습니다. 큰 결정(동거/결혼/투자)은 “타이밍”을 더 보수적으로 잡는 것이 좋습니다.`,
    yoni: yoni===4
      ? `Yoni 4점: 동일한 Yoni(본능/친밀감 원형)로 신체적·정서적 친밀감이 자연스럽습니다.`
      : yoni===0
        ? `Yoni 0점: Yoni(본능 원형)가 상극 패턴으로, 자극/갈등이 강하게 느껴질 수 있습니다. 갈등이 생기면 “즉시 해결”보다 “쿨다운 후 대화”가 필요합니다.`
        : `Yoni 2점: 기본 친밀감은 형성되지만 리듬(애정표현/거리감)이 다를 수 있습니다. 서로의 애정 언어를 구체화하면 점수가 체감상 올라갑니다.`,
    gm: `Graha Maitri ${gm}점: 두 낙샤트라의 지배 행성(${l1} ↔ ${l2}) 우정 관계가 ${r1}/${r2}로 계산되었습니다. 정신적 코드(대화/판단 기준)가 잘 맞을수록 장기 안정성이 커집니다.`,
    gana: gana===6
      ? `Gana 6점: 동일 Gana(${g1}) — 기질의 기본 파형이 유사해 “사소한 생활 리듬”까지 잘 맞는 편입니다.`
      : gana===0
        ? `Gana 0점: 기질(${g1} ↔ ${g2}) 충돌 가능성이 큽니다. 갈등의 핵심은 ‘사랑’이 아니라 ‘표현 방식’일 때가 많으니 규칙을 만들어 두세요.`
        : `Gana ${gana}점: 기질이 부분적으로 달라 보완이 가능하지만, 스트레스 상황에서 반응 패턴이 다를 수 있습니다.`,
    bhakoot: bhakoot===7
      ? `Bhakoot 7점: Bhakoot(관계/번영) 축이 안정적입니다. 함께 살수록 재정·생활 기반이 정돈되는 흐름이 기대됩니다.`
      : `Bhakoot 0점: Bhakoot Dosha 가능성 — 관계의 ‘번영/재정/가정 운영’에서 마찰이 생기기 쉽습니다. 돈·가족·거주 같은 현실 의제를 초기에 합의하면 완화됩니다.`,
    nadi: nadi===8
      ? `Nadi 8점: Nadi(체질/혈통) 타입이 달라 건강·자녀운 측면에서 유리한 조합으로 봅니다.`
      : `Nadi 0점: Nadi Dosha 가능성 — 체질/건강·자녀 이슈를 더 신중히 보라는 신호입니다. 생활 습관/건강검진/출산 계획을 현실적으로 잡는 것이 좋아요.`
  };
  const breakdown=[
    {n:"Varna (카스트 호환성)",max:1,sc:Math.round(varna),desc:"사회적 적합성",why:why.varna},
    {n:"Vashya (지배 관계)",max:2,sc:Math.round(vashya),desc:"상호 영향력",why:why.vashya},
    {n:"Tara (별자리 궁합)",max:3,sc:Math.round(taraScore),desc:"건강·운",why:why.tara},
    {n:"Yoni (본능 호환)",max:4,sc:Math.round(yoni),desc:"신체적 친밀감",why:why.yoni},
    {n:"Graha Maitri (행성우정)",max:5,sc:Math.round(gm),desc:"정신적 호환",why:why.gm},
    {n:"Gana (기질 호환)",max:6,sc:Math.round(gana),desc:"기질적 조화",why:why.gana},
    {n:"Bhakoot (관계 조화)",max:7,sc:Math.round(bhakoot),desc:"관계 번영",why:why.bhakoot},
    {n:"Nadi (체질 호환)",max:8,sc:Math.round(nadi),desc:"자녀·건강",why:why.nadi}
  ];
  const pct=Math.round(total/36*100);
  const verdict=pct>=75?"매우 좋은 궁합 — 강력히 추천":pct>=65?"좋은 궁합 — 추천":pct>=50?"보통 궁합 — 노력 필요":"신중한 접근 권장";
  const strengths=[];const challenges=[];
  if(nadi===8)strengths.push("완벽한 체질 호환");
  if(gana===6)strengths.push("동일 기질 — 자연스러운 조화");
  if(yoni===4)strengths.push("강한 신체적 끌림");
  if(nadi===0)challenges.push("Nadi Dosha: 자녀·건강 주의");
  if(gana===0)challenges.push("기질 충돌 주의 필요");
  if(bhakoot===0)challenges.push("Bhakoot Dosha: 재물·번영 주의");
  const overallReason=
    `낙샤트라 기준: <span class="keyword">${nak1}</span> × <span class="keyword">${nak2}</span>.<br>`+
    `총점 <span class="keyword">${total}/36</span>은 ‘감정’보다 <span class="keyword">생활 궁합(기질·의사결정·건강/가정 운영)</span>을 얼마나 안정적으로 굴릴 수 있는지에 초점을 둔 값입니다.<br>`+
    `${(bhakoot===0||nadi===0)?'특히 <span class="keyword">Bhakoot/Nadi</span>는 결혼 생활의 현실(재정·가정·건강)과 연결되므로, 낮게 나오면 “룰/합의/생활 설계”로 보완하는 게 핵심입니다.':'핵심 항목에서 큰 도샤 신호가 없어서, 관계의 안정성을 끌어올리기 좋은 조합입니다.'}`;

  return{
    total,pct,verdict,breakdown,strengths,challenges,
    overallReason,
    advice:pct>=65
      ?"두 사람의 별자리 에너지가 조화를 이룹니다. 장점은 키우고, 약점은 ‘규칙’으로 보완하면 장기적으로 매우 안정적입니다."
      :"차이점을 인정하고 서로를 보완하는 노력이 관계의 핵심입니다. 특히 낮게 나온 항목을 중심으로 대화 규칙과 생활 합의를 만드는 것이 효과적입니다."
  };
}

function vedicNormalizeLang(langCode){
  var l=String(langCode||'ko');
  if(l==='jp') return 'ja';
  if(l.toLowerCase()==='zh-cn') return 'zh-CN';
  return l;
}

function vedicResolveInitialLang(){
  try{
    var q=new URLSearchParams(window.location.search||'');
    var fromQuery=q.get('lang');
    if(fromQuery) return vedicNormalizeLang(fromQuery);
  }catch(_){}
  try{
    var saved=localStorage.getItem('cd_lang');
    if(saved) return vedicNormalizeLang(saved);
  }catch(_){}
  return 'ko';
}

function vedicGetTranslatableNodes(){
  var all=document.querySelectorAll('body *');
  var list=[];
  for(var i=0;i<all.length;i++){
    var el=all[i];
    if(!el||!el.tagName) continue;
    var tag=String(el.tagName).toUpperCase();
    if(tag==='SCRIPT'||tag==='STYLE'||tag==='NOSCRIPT'||tag==='CANVAS') continue;
    if(el.children&&el.children.length) continue;
    var txt=(el.textContent||'').replace(/\s+/g,' ').trim();
    if(!txt||txt.length<2) continue;
    if(/^[\d\s.,:%+\-_/()]+$/.test(txt)) continue;
    if(txt.length>1200) continue;
    if(!el.dataset.vedicSrcText){
      el.dataset.vedicSrcText=txt;
    }
    list.push(el);
  }
  return list;
}

function vedicChunkTexts(nodes, maxItems, maxChars){
  var chunks=[];
  var curNodes=[];
  var curTexts=[];
  var curChars=0;
  for(var i=0;i<nodes.length;i++){
    var t=(nodes[i] && nodes[i].dataset && nodes[i].dataset.vedicSrcText) || '';
    var ln=t.length;
    if(!ln) continue;
    if(curNodes.length>=maxItems || (curChars+ln)>maxChars){
      if(curNodes.length){
        chunks.push({ nodes:curNodes, texts:curTexts });
      }
      curNodes=[];
      curTexts=[];
      curChars=0;
    }
    curNodes.push(nodes[i]);
    curTexts.push(t);
    curChars+=ln;
  }
  if(curNodes.length){
    chunks.push({ nodes:curNodes, texts:curTexts });
  }
  return chunks;
}

function vedicWaitForGoogleCombo(timeoutMs){
  var started=Date.now();
  return new Promise(function(resolve,reject){
    (function poll(){
      var combo=document.querySelector('#vedicGoogleTranslateHost .goog-te-combo')||document.querySelector('.goog-te-combo');
      if(combo) return resolve(combo);
      if(Date.now()-started>(timeoutMs||7000)) return reject(new Error('google_translate_combo_timeout'));
      setTimeout(poll,120);
    })();
  });
}

function vedicSetGoogTransCookie(targetLang){
  var value='/ko/'+targetLang;
  var host=window.location.hostname||'';
  var bare=host.replace(/^www\./,'');
  document.cookie='googtrans='+value+'; path=/;';
  if(bare){
    document.cookie='googtrans='+value+'; domain='+bare+'; path=/;';
    document.cookie='googtrans='+value+'; domain=.'+bare+'; path=/;';
  }
}

function vedicApplyGoogleCookieFallback(targetLang){
  if(!targetLang) return Promise.reject(new Error('google_cookie_lang_missing'));
  try{
    var key='vedic_google_cookie_fallback_'+targetLang;
    if(sessionStorage.getItem(key)==='1'){
      return Promise.reject(new Error('google_translate_combo_missing_after_reload'));
    }
    sessionStorage.setItem(key,'1');
  }catch(_){}
  vedicSetGoogTransCookie(targetLang);
  setTimeout(function(){ window.location.reload(); }, 80);
  return Promise.resolve();
}

        }
        onReady();
      }catch(err){
        reject(err);
      }
    };

    var script=document.querySelector('script[data-vedic-google-translate="1"]');
    if(!script){
      script=document.createElement('script');
      script.src='https://translate.google.com/translate_a/element.js?cb=__vedicGoogleTranslateInit';
      script.async=true;
      script.defer=true;
      script.setAttribute('data-vedic-google-translate','1');
      script.onerror=function(){ reject(new Error('google_translate_script_failed')); };
      document.head.appendChild(script);
    }
  });
  return VEDIC_LANG_STATE.googleReadyPromise;
}

function vedicApplyGoogleLanguage(normalized){
  var googleLangMap={
    en:'en',
    ja:'ja',
    'zh-CN':'zh-CN',
    zh:'zh-CN',
    hi:'hi',
    es:'es',
    fr:'fr'
  };
  var target=googleLangMap[normalized];
  if(!target) return Promise.reject(new Error('unsupported_google_lang_'+normalized));
  return vedicEnsureGoogleTranslateLoaded()
    .then(function(){
      return vedicWaitForGoogleCombo(2600).catch(function(){
        return null;
      });
    })
    .then(function(combo){
      if(!combo){
        return vedicApplyGoogleCookieFallback(target);
      }
      combo.value=target;
      combo.dispatchEvent(new Event('change',{bubbles:true}));
      try{
        sessionStorage.removeItem('vedic_google_cookie_fallback_'+target);
      }catch(_){}
    });
}

function vedicApplyTranslatedText(langCode){
  var normalized=vedicNormalizeLang(langCode);
  VEDIC_LANG_STATE.current=normalized;
  try{ localStorage.setItem('cd_lang', normalized); }catch(_){}
  var nodes=vedicGetTranslatableNodes();
  if(!nodes.length) return Promise.resolve();
  if(normalized==='ko'){
    nodes.forEach(function(el){
      if(el&&typeof el.dataset.vedicSrcText==='string'){
        el.textContent=el.dataset.vedicSrcText;
      }
    });
    document.documentElement.setAttribute('lang','ko');
    try{
      var host=window.location.hostname||'';
      var bare=host.replace(/^www\./,'');
      document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      if(bare){
        document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain='+bare+'; path=/;';
        document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=.'+bare+'; path=/;';
      }
    }catch(_){}
    vedicSetLangStatus('Korean applied', false);
    return Promise.resolve();
  }
  var token=Date.now()+Math.random();
  VEDIC_LANG_STATE.token=token;
  VEDIC_LANG_STATE.translating=true;
  vedicSetLangStatus('Translating with Google...', false);
  return vedicApplyGoogleLanguage(normalized)
    .then(function(){
      if(VEDIC_LANG_STATE.token!==token) return;
      document.documentElement.setAttribute('lang', normalized);
      vedicSetLangStatus('Language applied (Google)', false);
    })
    .catch(function(err){
      console.warn('[vedic] translation failed:', err && err.message ? err.message : err);
      vedicSetLangStatus('Google translation failed. Check network/script load.', true);
    })
    .finally(function(){
      if(VEDIC_LANG_STATE.token===token) VEDIC_LANG_STATE.translating=false;
    });
}

function vedicApplyLanguage(langCode){
  VEDIC_LANG_STATE.current=vedicNormalizeLang(langCode||VEDIC_LANG_STATE.current||'ko');
  try{ localStorage.setItem('cd_lang', VEDIC_LANG_STATE.current); }catch(_){}
  return Promise.resolve();
}

function vedicEnsureLanguageToggle(){
  if(document.getElementById('vedicGoogleTranslateHost')) return;
  var host=document.createElement('div');
  host.id='vedicGoogleTranslateHost';
  host.style.position='fixed';
  host.style.left='-9999px';
  host.style.top='-9999px';
  host.style.width='1px';
  host.style.height='1px';
  host.style.overflow='hidden';
  host.style.opacity='0';
  host.style.pointerEvents='none';
  document.body.appendChild(host);
}

function vedicInitLanguageBridge(){
  VEDIC_LANG_STATE.current=vedicResolveInitialLang();
  vedicEnsureLanguageToggle();
  vedicInstallGoogleBannerGuard();
  setTimeout(function(){ vedicEnsureGoogleTranslateLoaded(); }, 0);
  setTimeout(function(){ vedicApplyTranslatedText(VEDIC_LANG_STATE.current); }, 120);
}

// ─── NAVIGATION ───────────────────────────────────────────
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  window.scrollTo(0,0);
  if(id!=='input') setTimeout(initReveal,80);
}
function goBack(){showPage(G.detailBack||'result');}

// ─── SCROLL REVEAL ────────────────────────────────────────
function initReveal(){
  const els=document.querySelectorAll('.reveal');
  if(!els.length)return;
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
  },{threshold:0.08});
  els.forEach(el=>obs.observe(el));
}

// ─── ACCORDION ────────────────────────────────────────────
function toggleAcc(id){
  const body=document.getElementById('acc-'+id);
  const arrow=document.getElementById('arr-'+id);
  if(!body)return;
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  if(arrow)arrow.style.transform=isOpen?'rotate(0deg)':'rotate(180deg)';
}

// ─── TABS ─────────────────────────────────────────────────
function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const btn=document.getElementById('tbtn-'+id);
  const panel=document.getElementById('tpanel-'+id);
  if(btn)btn.classList.add('active');
  if(panel){panel.classList.add('active');setTimeout(initReveal,60);}
  G.activeTab=id;
}

// ─── PROFILE 정규화 (지역/생일 null 시 서울·기본값 적용, tz = 시간 단위 UTC 오프셋) ─
function normalizeProfileForVedic(profile){
  if(!profile)return profile;
  const b=profile.birth||{
    year:profile.birthYear,
    month:profile.birthMonth,
    day:profile.birthDay,
    hour:profile.birthHour,
    minute:profile.birthMinute,
    calType:profile.calType
  };
  if(!b||((b.year==null||b.year==='')&&(b.month==null||b.month==='')&&(b.day==null||b.day==='')))return profile;
  if((b.hour==null||b.hour==='')&&profile.birthHour!=null&&profile.birthHour!=='')b.hour=profile.birthHour;
  if((b.minute==null||b.minute==='')&&profile.birthMinute!=null&&profile.birthMinute!=='')b.minute=profile.birthMinute;
  if((b.hour==null||b.hour==='')&&typeof profile.birthTime==='string'){
    var _tp=profile.birthTime.split(':');
    if(_tp.length>=2){
      b.hour=parseInt(_tp[0],10);
      b.minute=(b.minute==null||b.minute==='')?parseInt(_tp[1],10):b.minute;
    }
  }
  const l=profile.location||{};
  const lat=typeof l.lat==='number'&&!isNaN(l.lat)?l.lat:(parseFloat(l.lat)||37.5665);
  const lng=typeof l.lng==='number'&&!isNaN(l.lng)?l.lng:(typeof l.lon==='number'&&!isNaN(l.lon)?l.lon:(parseFloat(l.lng)||parseFloat(l.lon)||126.978));
  let tz=9;
  if(typeof l.baseTzOffset==='number'&&!isNaN(l.baseTzOffset))tz=l.baseTzOffset;
  else if(typeof l.tzOffset==='number'&&!isNaN(l.tzOffset))tz=Math.abs(l.tzOffset)<=24?l.tzOffset:l.tzOffset/60;
  return{
    id:profile.id,
    name:profile.name,
    gender:profile.gender,
    birth:{
      year:b.year,
      month:b.month,
      day:b.day,
      hour:b.hour!=null?b.hour:12,
      minute:b.minute!=null?b.minute:0,
      calType:b.calType||'solar'
    },
    location:{
      label:l.label||'대한민국 (서울)',
      tz:l.tz||'Asia/Seoul',
      lat, lng,
      tzOffset:tz,
      baseTzOffset:tz,
      dstMinutes:l.dstMinutes
    }
  };
}

// ─── PROFILE → FORM (f.timezone = UTC 오프셋 시간 단위, 예: 9 = UTC+9) ─
function profileToForm(profile){
  const p=normalizeProfileForVedic(profile)||profile;
  const birth=p.birth||{};
  const loc=p.location||{};
  let tz=9;
  if(typeof loc.baseTzOffset==='number'&&!isNaN(loc.baseTzOffset))tz=loc.baseTzOffset;
  else if(typeof loc.tzOffset==='number'&&!isNaN(loc.tzOffset))tz=Math.abs(loc.tzOffset)<=24?loc.tzOffset:loc.tzOffset/60;
  const latRaw=parseFloat(loc.lat);
  const lonRaw=parseFloat(loc.lng)||parseFloat(loc.lon);
  const lat=(typeof latRaw==='number'&&!isNaN(latRaw))?latRaw:NaN;
  const lon=(typeof lonRaw==='number'&&!isNaN(lonRaw))?lonRaw:NaN;
  const yearRaw=parseInt(birth.year,10);
  const monthRaw=parseInt(birth.month,10);
  const dayRaw=parseInt(birth.day,10);
  const year=(Number.isFinite(yearRaw)&&yearRaw>1900&&yearRaw<2100)?yearRaw:NaN;
  const month=(Number.isFinite(monthRaw)&&monthRaw>=1&&monthRaw<=12)?monthRaw:NaN;
  const day=(Number.isFinite(dayRaw)&&dayRaw>=1&&dayRaw<=31)?dayRaw:NaN;
  return{
    name:(p.name||'').trim()||'이름없음',
    gender:p.gender||'M',
    year:year,
    month:month,
    day:day,
    hour:parseInt(birth.hour,10)||12,
    minute:parseInt(birth.minute,10)||0,
    lat:lat,
    lon:lon,
    timezone:tz
  };
}

// ─── CALCULATE FROM PROFILE (Swiss API 전용) ─────────────────
function doCalculateFromProfile(profile){
  const f=profileToForm(profile);
  if(isNaN(f.year)||isNaN(f.month)||isNaN(f.day)){alert('생년월일을 확인해 주세요. (연도:'+f.year+', 월:'+f.month+', 일:'+f.day+')');return;}
  if(isNaN(f.lat)||isNaN(f.lon)){alert('위도/경도를 확인해 주세요. 장소를 선택하거나 수동으로 입력해 주세요.');return;}
  var nameEl=document.getElementById('loading-name');
  if(nameEl) nameEl.textContent=f.name+'님의';
  showPage('loading');

  function runWithPlanets(planetsFromApi){
    try{
      var chart=buildChart(f,planetsFromApi);
      if(!chart||!chart.f){throw new Error('Chart build failed: invalid chart structure');}
      var report=analyze(chart);
      if(!report){throw new Error('Analysis failed: no report generated');}
      var insights=generateInsights(chart,report);
      if(!insights){throw new Error('Insights generation failed');}
      G.chart=chart;G.report=report;G.insights=insights;G.activeTab='overview';
      G.usedLocalCalc=false;
      try{
        renderResult();
        showPage('result');
      }catch(renderErr){
        console.error('Render error:',renderErr);
        document.getElementById('result-content').innerHTML='<div class="error-box">결과 표시 중 오류가 발생했습니다. 새로고침 후 다시 시도해 주세요.<br><br>오류: '+(renderErr&&renderErr.message?renderErr.message:'Unknown error')+'<br><br><button onclick="showPage(\'input\')" style="background:rgba(139,92,246,0.3);border:1px solid var(--border);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:10px;">입력 화면으로 돌아가기</button></div>';
        showPage('result');
      }
    }catch(err){
      console.error('Calculation error:',err);
      document.getElementById('result-content').innerHTML='<div class="error-box">계산 중 오류가 발생했습니다. 생년월일·시간·장소를 확인해 주세요.<br><br>상세: '+(err&&err.message?err.message:'Unknown error')+'<br><br><button onclick="showPage(\'input\')" style="background:rgba(139,92,246,0.3);border:1px solid var(--border);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:10px;">입력 화면으로 돌아가기</button></div>';
      showPage('result');
    }
  }

  function runWithLocalFallback(detail){
    if(detail){ console.warn('[vedic] API fallback to local:', detail); }
    try{
      var chart=buildChart(f);
      if(!chart||!chart.f){throw new Error('Chart build failed: invalid chart structure');}
      var report=analyze(chart);
      if(!report){throw new Error('Analysis failed: no report generated');}
      var insights=generateInsights(chart,report);
      if(!insights){throw new Error('Insights generation failed');}
      G.chart=chart;G.report=report;G.insights=insights;G.activeTab='overview';
      G.usedLocalCalc=true;
      renderResult();
      showPage('result');
    }catch(localErr){
      console.error('[vedic] local fallback failed', localErr);
      showApiRequiredError((detail?String(detail)+' | ':'') + String((localErr&&localErr.message)||localErr||'local fallback failed'));
    }
  }

  function showApiRequiredError(detail){
    if(detail){ console.warn('[vedic] API Error:', detail); }
    var detailText=detail?('<br><br>상세: '+String(detail)):'';
    document.getElementById('result-content').innerHTML='<div class="error-box">Swiss API 응답이 없어 베다 결과를 생성할 수 없습니다. 잠시 후 다시 시도해 주세요.'+detailText+'<br><br><button onclick="showPage(\'input\')" style="background:rgba(139,92,246,0.3);border:1px solid var(--border);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:10px;">입력 화면으로 돌아가기</button></div>';
    showPage('result');
  }

  var apiBase=typeof window!=='undefined'&&window.location&&window.location.origin?window.location.origin:'';
  var url=apiBase+'/api/vedic/planets';
  var payload={ year:f.year,month:f.month,day:f.day,hour:f.hour,minute:f.minute,timezone:f.timezone,lat:f.lat,lon:f.lon };
  var timeoutMs=12000;
  var reqPromise;
  if(typeof AbortController==='function'){
    var ac=new AbortController();
    var t=setTimeout(function(){ try{ ac.abort(); }catch(_){} }, timeoutMs);
    reqPromise=fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ac.signal})
      .then(function(r){ return r.json(); })
      .finally(function(){ clearTimeout(t); });
  } else {
    reqPromise=Promise.race([
      fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.json();}),
      new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, timeoutMs); })
    ]);
  }
  reqPromise
    .then(function(res){
      if(res&&res.ok&&res.planets){
        runWithPlanets(res.planets);
        return;
      }
      runWithLocalFallback(res&&res.error?res.error:'Swiss API invalid response');
    })
    .catch(function(err){
      runWithLocalFallback(err&&err.message?err.message:'Swiss API request failed');
    });
}

// ─── INIT: 프로필 있으면 API 호출 후 결과, 없으면 noprofile ─
function _hasValidBirth(p){
  if(!p||!p.birth)return false;
  const b=p.birth;
  const numOrStr=function(v){ return v!==undefined&&v!==null&&v!==''&&(typeof v==='number'?!isNaN(v):String(v).trim()!==''); };
  return numOrStr(b.year)&&numOrStr(b.month)&&numOrStr(b.day);
}
function _hasAnyBirth(p){
  if(!p||!p.birth)return false;
  const b=p.birth;
  return (b.year!=null&&b.year!=='')||(b.month!=null&&b.month!=='')||(b.day!=null&&b.day!=='');
}
function _repairProfile(profile){
  if(!profile)return null;
  if(profile.birth&&typeof profile.birthDate==='string'&&(profile.birth.year==null||profile.birth.month==null||profile.birth.day==null)){
    var bdParts=profile.birthDate.split(/[-/]/);
    if(bdParts.length>=3){
      if(profile.birth.year==null)profile.birth.year=parseInt(bdParts[0],10);
      if(profile.birth.month==null)profile.birth.month=parseInt(bdParts[1],10);
      if(profile.birth.day==null)profile.birth.day=parseInt(bdParts[2],10);
    }else if(bdParts.length===1&&bdParts[0].length>=8){
      if(profile.birth.year==null)profile.birth.year=parseInt(bdParts[0].slice(0,4),10);
      if(profile.birth.month==null)profile.birth.month=parseInt(bdParts[0].slice(4,6),10);
      if(profile.birth.day==null)profile.birth.day=parseInt(bdParts[0].slice(6,8),10);
    }
  }
  if(!profile.birth&&(profile.birthYear!=null||profile.birthMonth!=null||profile.birthDay!=null)){
    profile={ id:profile.id,name:profile.name,gender:profile.gender,location:profile.location,birth:{ year:profile.birthYear,month:profile.birthMonth,day:profile.birthDay,hour:profile.birthHour,minute:profile.birthMinute } };
  }
  if(!profile.birth&&(profile.birthDate||profile.birthTime)){
    var y=1990,m=1,d=1,hr=12,min=0;
    if(typeof profile.birthDate==='string'){
      var parts=profile.birthDate.split(/[-/]/);
      if(parts.length>=3){ y=parseInt(parts[0],10)||y; m=parseInt(parts[1],10)||m; d=parseInt(parts[2],10)||d; }
      else if(parts.length===1&&parts[0].length>=8){ y=parseInt(parts[0].slice(0,4),10)||y; m=parseInt(parts[0].slice(4,6),10)||m; d=parseInt(parts[0].slice(6,8),10)||d; }
    }
    if(typeof profile.birthTime==='string'){
      var tparts=profile.birthTime.split(/[:]/);
      if(tparts.length>=2){ hr=parseInt(tparts[0],10); min=parseInt(tparts[1],10); if(isNaN(hr))hr=12; if(isNaN(min))min=0; }
    }
    profile.birth=profile.birth||{ year:y,month:m,day:d,hour:hr,minute:min };
  }
  const b=profile.birth||{};
  if((b.hour==null||b.hour==='')&&profile.birthHour!=null&&profile.birthHour!=='')b.hour=profile.birthHour;
  if((b.minute==null||b.minute==='')&&profile.birthMinute!=null&&profile.birthMinute!=='')b.minute=profile.birthMinute;
  if((b.hour==null||b.hour===''||b.minute==null||b.minute==='')&&typeof profile.birthTime==='string'){
    var _timeParts=profile.birthTime.split(':');
    if(_timeParts.length>=2){
      if(b.hour==null||b.hour==='')b.hour=parseInt(_timeParts[0],10);
      if(b.minute==null||b.minute==='')b.minute=parseInt(_timeParts[1],10);
    }
  }
  if(b.year==null||b.year==='')b.year=1990;
  if(b.month==null||b.month==='')b.month=1;
  if(b.day==null||b.day==='')b.day=1;
  if(b.hour==null&&b.hour!==0)b.hour=12;
  if(b.minute==null&&b.minute!==0)b.minute=0;
  profile.birth=b;
  return profile;
}
function _readProfileFromStorage(){
  let profile=null;
  var raw;
  if(typeof localStorage!=='undefined'){
    raw=localStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){ }
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){
        localStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD');
        profile=_repairProfile(profile);
        if(_hasValidBirth(profile)) return profile;
      }
    }
  }
  if(typeof sessionStorage!=='undefined'){
    raw=sessionStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){ }
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){
        sessionStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD');
        profile=_repairProfile(profile);
        if(_hasValidBirth(profile)) return profile;
      }
    }
  }
  if(typeof window!=='undefined'&&window.FORTUNE_APP_VEDIC_PAYLOAD){
    profile=_repairProfile(window.FORTUNE_APP_VEDIC_PAYLOAD);
    if(_hasValidBirth(profile)) return profile;
  }
  if(typeof localStorage!=='undefined'){
    raw=localStorage.getItem('FORTUNE_APP_USER_PROFILE');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){ }
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){
        profile=_repairProfile(profile);
        if(_hasValidBirth(profile)) return profile;
      }
    }
  }
  if(typeof sessionStorage!=='undefined'){
    raw=sessionStorage.getItem('FORTUNE_APP_USER_PROFILE');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){ }
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){
        profile=_repairProfile(profile);
        if(_hasValidBirth(profile)) return profile;
      }
    }
  }
  if(typeof localStorage!=='undefined'){
    const listRaw=localStorage.getItem('FORTUNE_APP_USER_PROFILES.list');
    const currentId=localStorage.getItem('FORTUNE_APP_USER_PROFILES.current');
    if(listRaw){
      let arr=[]; try{ arr=JSON.parse(listRaw); }catch(_){}
      if(Array.isArray(arr)&&arr.length){
        profile=currentId?arr.find(p=>p.id===currentId):null;
        if(!profile)profile=arr[0];
        if(profile&&!_hasValidBirth(profile))profile=arr.find(_hasValidBirth)||arr.find(_hasAnyBirth)||arr[0];
        if(profile)return _repairProfile(profile);
      }
    }
    const legacy=localStorage.getItem('FORTUNE_APP_USER_PROFILES');
    if(legacy){ try{ const a=JSON.parse(legacy); if(Array.isArray(a)&&a.length){ profile=a.find(_hasValidBirth)||a.find(_hasAnyBirth)||a[0]; if(profile)return _repairProfile(profile); } }catch(_){ } }
  }
  return null;
}

function initVedicPage(){
  try{ vedicInitLanguageBridge(); }catch(_){}
  // URL payload 우선 처리: storage 접근 실패 환경에서도 프로필 카드 진입 보장
  var _qp=null;
  try{
    var _sp=new URLSearchParams(window.location.search||'');
    var _vpRaw=_sp.get('vp');
    if(_vpRaw){
      try{ _qp=JSON.parse(decodeURIComponent(_vpRaw)); }catch(_){ try{ _qp=JSON.parse(_vpRaw); }catch(_){ _qp=null; } }
      if(_qp){
        try{ _qp=_repairProfile(_qp); }catch(_){}
        try{ _qp=normalizeProfileForVedic(_qp)||_qp; }catch(_){}
        _fillInputFromProfile(_qp);
        if(_hasValidBirth(_qp)){
          try{
            _sp.delete('vp');
            var _newQ=_sp.toString();
            history.replaceState(null,'',window.location.pathname+(_newQ?('?'+_newQ):'')+window.location.hash);
          }catch(_){}
          doCalculateFromProfile(_qp);
          return;
        }
        showPage('input');
        return;
      }
    }
  }catch(_){}
  // VEDIC_PAYLOAD 직접 읽기: _readProfileFromStorage가 삭제하기 전에 먼저 확보
  var _vp=null;
  try{
    var _vpRaw=(typeof localStorage!=='undefined'?localStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD'):null)||(typeof sessionStorage!=='undefined'?sessionStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD'):null);
    if(_vpRaw){ try{ _vp=JSON.parse(_vpRaw); }catch(_){} }
    else if(typeof window!=='undefined'&&window.FORTUNE_APP_VEDIC_PAYLOAD){ _vp=window.FORTUNE_APP_VEDIC_PAYLOAD; }
  }catch(_){}
  try{ if(typeof localStorage!=='undefined') localStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD'); }catch(_){}
  try{ if(typeof sessionStorage!=='undefined') sessionStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD'); }catch(_){}
  if(_vp){
    try{ _vp=_repairProfile(_vp); }catch(_){}
    try{ _vp=normalizeProfileForVedic(_vp)||_vp; }catch(_){}
    _fillInputFromProfile(_vp);
    if(_hasValidBirth(_vp)){ doCalculateFromProfile(_vp); return; }
    // 생년월일 불완전 시 프리필된 폼 표시
    showPage('input');
    return;
  }
  let profile=null;
  try{ profile=_readProfileFromStorage(); }catch(e){}
  if(!profile){ showPage('input'); return; }
  try{ profile=normalizeProfileForVedic(profile)||profile; }catch(_){}
  if(!profile.birth||(profile.birth.year==null&&profile.birth.month==null&&profile.birth.day==null)){ showPage('input'); return; }
  _fillInputFromProfile(profile);
  doCalculateFromProfile(profile);
}

function _vedicPad2(v){
  var n=parseInt(v,10);
  if(!isFinite(n)) n=0;
  return String(n).padStart(2,'0');
}

function _syncVedicToProfileCardCompatFields(){
  try{
    var host=document.getElementById('page-input')||document.body;
    function ensure(tag,id,type){
      var el=document.getElementById(id);
      if(!el){
        el=document.createElement(tag);
        el.id=id;
        if(type) el.type=type;
        el.style.display='none';
        host.appendChild(el);
      }
      return el;
    }

    var y=parseInt((document.getElementById('v_year')||{}).value,10);
    var m=parseInt((document.getElementById('v_month')||{}).value,10);
    var d=parseInt((document.getElementById('v_day')||{}).value,10);
    var h=parseInt((document.getElementById('v_hour')||{}).value,10);
    var mi=parseInt((document.getElementById('v_minute')||{}).value,10);
    var tz=parseFloat((document.getElementById('v_tz')||{}).value);
    var lat=parseFloat((document.getElementById('v_lat')||{}).value);
    var lon=parseFloat((document.getElementById('v_lon')||{}).value);

    var bd=ensure('input','birthDate','date');
    if(isFinite(y)&&isFinite(m)&&isFinite(d)&&y>0&&m>=1&&m<=12&&d>=1&&d<=31){
      bd.value=String(y).padStart(4,'0')+'-'+_vedicPad2(m)+'-'+_vedicPad2(d);
    }

    var bh=ensure('input','birthHour','number');
    var bm=ensure('input','birthMinute','number');
    bh.value=isFinite(h)?String(h):'12';
    bm.value=isFinite(mi)?String(mi):'0';

    var btnM=ensure('button','btnM');
    var btnF=ensure('button','btnF');
    var g=((document.getElementById('v_gender')||{}).value||'M');
    if(g==='M'){
      btnM.classList.add('on');
      btnF.classList.remove('on');
    }else{
      btnF.classList.add('on');
      btnM.classList.remove('on');
    }

    var countrySel=ensure('select','birthCountry');
    while(countrySel.options.length) countrySel.remove(0);
    var opt=document.createElement('option');
    var placeEl=document.getElementById('v_place');
    var placeText=(placeEl&&placeEl.options&&placeEl.selectedIndex>=0&&placeEl.options[placeEl.selectedIndex])?placeEl.options[placeEl.selectedIndex].text:'대한민국 (서울)';
    var placeTz=(placeEl&&placeEl.value)?String(placeEl.value):'Asia/Seoul';
    opt.value=placeTz;
    opt.text=placeText;
    opt.setAttribute('data-long', isFinite(lon)?String(lon):'126.978');
    opt.setAttribute('data-lat', isFinite(lat)?String(lat):'37.5665');
    opt.setAttribute('data-tz', isFinite(tz)?String(tz):'9');
    opt.setAttribute('data-base-tz', isFinite(tz)?String(tz):'9');
    countrySel.appendChild(opt);
    countrySel.selectedIndex=0;
  }catch(_){ }
}

function _readVedicCompatProfileCardData(){
  try{ _syncVedicToProfileCardCompatFields(); }catch(_){ }
  try{
    var bd=(document.getElementById('birthDate')||{}).value||'';
    if(!bd) return null;
    var hourRaw=parseInt((document.getElementById('birthHour')||{}).value,10);
    var minuteRaw=parseInt((document.getElementById('birthMinute')||{}).value,10);
    var hour=(Number.isFinite(hourRaw)&&hourRaw>=0&&hourRaw<=23)?hourRaw:12;
    var minute=(Number.isFinite(minuteRaw)&&minuteRaw>=0&&minuteRaw<=59)?minuteRaw:0;
    var gender='F';
    var btnM=document.getElementById('btnM');
    var btnF=document.getElementById('btnF');
    if(btnM&&btnM.classList.contains('on')) gender='M';
    else if(btnF&&btnF.classList.contains('on')) gender='F';
    var countrySel=document.getElementById('birthCountry');
    var opt=countrySel?countrySel.options[countrySel.selectedIndex]:null;
    var tz=opt?countrySel.value:'Asia/Seoul';
    var lng=opt?parseFloat(opt.getAttribute('data-long')||'127'):127.0;
    var lat=opt?parseFloat(opt.getAttribute('data-lat')||'37.6'):37.6;
    var tzOff=opt?parseFloat(opt.getAttribute('data-tz')||'9'):9;
    var baseTzOff=opt?parseFloat(opt.getAttribute('data-base-tz')||String(tzOff)):tzOff;
    var locationLabel=opt?opt.text:'대한민국 (서울)';
    var parts=bd.split('-');
    if(parts.length<3) return null;
    var year=parseInt(parts[0],10), month=parseInt(parts[1],10), day=parseInt(parts[2],10);
    return {
      id:'vedic_manual',
      name:'(직접 입력)',
      gender:gender,
      birth:{ year:year, month:month, day:day, hour:hour, minute:minute, calType:'solar' },
      location:{ label:locationLabel, tz:tz, lng:lng, lat:lat, tzOffset:baseTzOff, baseTzOffset:baseTzOff }
    };
  }catch(_){ return null; }
}

function runVedicFromInput(){
  try{
    console.log('runVedicFromInput started');
    var compatProfile=_readVedicCompatProfileCardData();
    if(compatProfile&&compatProfile.birth&&compatProfile.birth.year&&compatProfile.birth.month&&compatProfile.birth.day){
      console.log('Using compat profile');
      doCalculateFromProfile(compatProfile);
      return;
    }
    var yEl=document.getElementById('v_year');
    var mEl=document.getElementById('v_month');
    var dEl=document.getElementById('v_day');
    var hEl=document.getElementById('v_hour');
    var minEl=document.getElementById('v_minute');
    var latEl=document.getElementById('v_lat');
    var lonEl=document.getElementById('v_lon');
    var tzEl=document.getElementById('v_tz');
    var gEl=document.getElementById('v_gender');
    
    console.log('Field elements:', {yEl,mEl,dEl,hEl,minEl,latEl,lonEl,tzEl,gEl});
    
    var y=parseInt(yEl&&yEl.value?yEl.value:'',10);
    var m=parseInt(mEl&&mEl.value?mEl.value:'',10);
    var d=parseInt(dEl&&dEl.value?dEl.value:'',10);
    var hr=parseInt(hEl&&hEl.value?hEl.value:'',10);
    var min=parseInt(minEl&&minEl.value?minEl.value:'',10);
    var lat=parseFloat(latEl&&latEl.value?latEl.value:'');
    var lon=parseFloat(lonEl&&lonEl.value?lonEl.value:'');
    var tz=parseFloat(tzEl&&tzEl.value?tzEl.value:'');
    var gender=gEl&&gEl.value?gEl.value:'M';
    
    console.log('Parsed values:', {y,m,d,hr,min,lat,lon,tz,gender});

    if(!Number.isFinite(y)||!Number.isFinite(m)||!Number.isFinite(d)){ 
      alert('생년월일을 확인해 주세요. (입력값: '+(yEl&&yEl.value)+'-'+(mEl&&mEl.value)+'-'+(dEl&&dEl.value)+')'); 
      return; 
    }
    if(!Number.isFinite(hr))hr=12;
    if(!Number.isFinite(min))min=0;
    if(!Number.isFinite(lat)||!Number.isFinite(lon)){ 
      console.error('Invalid coordinates:', {lat, lon, latVal: latEl&&latEl.value, lonVal: lonEl&&lonEl.value});
      alert('위도/경도를 확인해 주세요. 장소를 선택하거나 위도/경도를 입력해 주세요.\n\n현재 값 - 위도:'+(latEl&&latEl.value)+', 경도:'+(lonEl&&lonEl.value)); 
      return; 
    }
    if(!Number.isFinite(tz))tz=9;

    console.log('Creating profile and calling doCalculateFromProfile');
    var profile={
      id:'vedic_manual',
      name:'(직접 입력)',
      gender:gender,
      birth:{ year:y,month:m,day:d,hour:hr,minute:min },
      location:{ lat:lat, lng:lon, tzOffset:tz, baseTzOffset:tz, label:'(직접 입력)', tz:'' }
    };
    doCalculateFromProfile(profile);
  }catch(e){
    console.error('runVedicFromInput error:',e);
    alert('입력값 처리 중 오류가 발생했습니다.\n\n오류: '+(e&&e.message?e.message:'Unknown')+'\n\n스택: '+(e&&e.stack?e.stack:''));
  }
}

// ─── DETAIL HEADER ────────────────────────────────────────
function detailHeader(icon,title,sub){
  if(sub===undefined)sub='';
  return`<div class="detail-topbar">
    <div class="detail-topbar-inner">
      <button class="btn-sm back-btn" onclick="goBack()"><span aria-hidden="true">←</span> <span>뒤로</span></button>
      <div style="flex:1;min-width:0">
        <div class="detail-title">${icon} ${title}</div>
        ${sub?`<div class="detail-sub">${sub}</div>`:''}
      </div>
      <div class="detail-spacer" aria-hidden="true"></div>
    </div>
  </div>`;
}

// ─── SHOW DETAIL ──────────────────────────────────────────
function showDetail(id){
  G.detailBack='result';
  const r=G.report;const c=G.chart;const ins=G.insights||{};
  let html='';
  if(id==='personality')html=renderPersonality(r.personality,c,ins);
  else if(id==='wealth')html=renderWealth(r.wealth,ins);
  else if(id==='career')html=renderCareer(r.career,ins);
  else if(id==='chakra')html=renderChakra(r.chakra,ins);
  else if(id==='romance')html=renderRomance(r.romance,c,ins);
  else if(id==='compat')html=renderCompatInput();
  else if(id==='yoga')html=renderYoga(r.yoga);
  else if(id==='remedies')html=renderRemedies(r.remedies,c,ins);
  else if(id==='vimshottari')html=renderVimshottari(c,ins);
  document.getElementById('detail-content').innerHTML=html;
  showPage('detail');
}

async function _vedicCompatCoinGate(cost, reason){
  var plan = '';
  try { var _u = JSON.parse(localStorage.getItem('fortune_auth_user') || 'null'); plan = (_u && _u.plan) ? String(_u.plan) : ''; } catch(_) {}
  if (plan === 'unlimited' || plan === 'premium') return true;
  try { if (sessionStorage.getItem('flower_admin_token')) return true; } catch(_) {}

  var token = '';
  try { token = localStorage.getItem('fortune_auth_token') || ''; } catch(_) {}
  if (!token) {
    if (window.confirm('🔒 로그인이 필요한 서비스입니다.\n로그인 후 이용해 주세요.')) {
      window.location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
    }
    return false;
  }

  var balance = 0;
  try {
    var _u2 = JSON.parse(localStorage.getItem('fortune_auth_user') || 'null');
    balance = Number(_u2 && _u2.points) || 0;
  } catch(_) {}

  if (balance < cost) {
    if (window.confirm('🪙 ' + reason + '\n\n이 기능은 이용할 때마다 ' + cost + '코인이 필요합니다.\n현재 보유: ' + Number(balance).toLocaleString('ko-KR') + '코인\n\n코인 충전 페이지로 이동하시겠습니까?')) {
      window.location.href = '/points';
    }
    return false;
  }

  if (!window.confirm('🪙 ' + reason + '\n\n이용할 때마다 ' + cost + '코인이 차감됩니다.\n현재 보유: ' + Number(balance).toLocaleString('ko-KR') + '코인\n\n진행하시겠습니까?')) {
    return false;
  }

  try {
    var resp = await fetch('/api/fortune/pig-coin/consume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ cost: cost, reason: reason, featureKey: 'vedic-per-use', forceDeduct: true, requestId: 'vedic:' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9) })
    });
    var data = await resp.json();
    if (!resp.ok) {
      window.alert((data && data.message) || '코인 차감에 실패했습니다. 다시 시도해 주세요.');
      if (resp.status === 402 || resp.status === 403) window.location.href = '/points';
      return false;
    }
    var nb = (data && data.user && typeof data.user.points === 'number') ? data.user.points : Math.max(0, balance - cost);
    try {
      var _u3 = JSON.parse(localStorage.getItem('fortune_auth_user') || 'null') || {};
      _u3.points = nb;
      localStorage.setItem('fortune_auth_user', JSON.stringify(_u3));
    } catch(_) {}
    if (typeof window.__cdSetGoldenBalance === 'function') window.__cdSetGoldenBalance(nb);
    return true;
  } catch(e) {
    console.error('[vedic compat coin-gate]', e);
    window.alert('오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    return false;
  }
}

    <div class="acc-body open" id="acc-rem-dana">

          <div style="background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:12px;text-align:center">
            <div style="font-size:10px;color:var(--text3);margin-bottom:5px">보시일</div>
            <div style="font-size:16px;font-weight:700;color:#F59E0B">${daDay}</div>
          </div>
          <div style="background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.2);border-radius:12px;padding:12px;text-align:center">
            <div style="font-size:10px;color:var(--text3);margin-bottom:5px">행운 색상</div>
            <div style="font-size:16px;font-weight:700;color:#F59E0B">${daColor}</div>
          </div>
        </div>
        <div style="background:rgba(212,175,55,0.06);border-radius:12px;padding:12px;margin-bottom:12px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:6px">보시 물품</div>
          <div style="font-size:13px;color:var(--text2)">${daItem}</div>
        </div>
        <div style="background:rgba(139,92,246,0.07);border:1px solid rgba(139,92,246,0.2);border-radius:12px;padding:14px;text-align:center">
          <div style="font-size:11px;color:var(--text3);margin-bottom:8px">핵심 만트라 (108회 반복 권장)</div>
          <div style="font-size:13px;font-weight:600;color:var(--purple2);letter-spacing:0.04em;line-height:1.8">${daMantra}</div>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--text3);line-height:1.7">신요일(일·월요일 등)에 맞는 사원 방문, 보시, 만트라 수련이 카르마의 짐을 가볍게 하는 고전적 처방입니다. 믿음이 핵심이며, 기계적 수행보다 진심 어린 의도가 중요합니다.</div>
      </div>
    </div>
  </div>

  <!-- 차크라 힐링 -->
  <div class="acc-item reveal reveal-delay-3">
    <div class="acc-header" onclick="toggleAcc('rem-chakra')">
      <span style="font-size:16px">🔮</span>
      <span class="acc-title">차크라 힐링 & 비자 만트라</span>
      <span class="acc-arrow" id="arr-rem-chakra">▾</span>
    </div>
    <div class="acc-body" id="acc-rem-chakra">
      <div class="acc-inner">
        <div style="display:flex;align-items:center;gap:14px;background:rgba(139,92,246,0.07);border-radius:14px;padding:14px;margin-bottom:12px">
          <div style="width:54px;height:54px;border-radius:50%;background:${chkData.col||'#8B5CF6'}22;border:2px solid ${chkData.col||'#8B5CF6'}55;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${chkData.sym||'🔮'}</div>
          <div>
            <div style="font-size:15px;font-weight:700;color:var(--purple2);margin-bottom:4px">${chkData.kr||chkData.name||'차크라'} 우선 활성화</div>
            <div style="font-size:13px;color:var(--text2)">비자 만트라: <strong style="color:var(--purple2);font-size:15px">${chkData.seed||'OM'}</strong></div>
          </div>
        </div>
        <div style="font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:10px">${chkData.detail||''}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--text2)">
          <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:10px">
            <div style="font-size:10px;color:var(--text3);margin-bottom:4px">요가 수련</div>
            <div>${chkData.yoga||'명상'}</div>
          </div>
          <div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:10px">
            <div style="font-size:10px;color:var(--text3);margin-bottom:4px">힐링 크리스탈</div>
            <div>${chkData.crystal||'수정'}</div>

        ${chkData.affirmation?`<div style="margin-top:12px;padding:12px;background:rgba(139,92,246,0.07);border-radius:10px;text-align:center;font-size:13px;color:var(--purple2);font-style:italic">"${chkData.affirmation}"</div>`:''}
