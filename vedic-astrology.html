<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>베다 점성술 — 별들의 지도</title>
<link id="gfont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" onerror="this.remove()">
<style>
/* ── 오프라인 폴백 폰트 스택 ─────────────────────────────
   Cinzel 폰트가 없으면 Georgia → Times New Roman → serif 순으로 대체
   한글은 Apple SD Gothic Neo → Malgun Gothic → NanumGothic → 시스템 기본 */
/* 온라인이면 Google Fonts 로드, 오프라인이면 아래 --font-display/--font-body 폴백 사용 */

:root {
  --font-display: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'NanumGothic', '나눔고딕', '맑은 고딕', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#D4AF37;--gold2:#F5D06A;--purple:#7C3AED;--purple2:#A78BFA;--cyan:#06B6D4;--pink:#EC4899;
  --red:#FF4444;--green:#22C55E;--orange:#F59E0B;
  --bg:#050010;--bg2:#0a001f;--bg3:#12002e;
  --glass:rgba(255,255,255,0.05);--glassdark:rgba(0,0,0,0.3);
  --border:rgba(139,92,246,0.25);--bordergold:rgba(212,175,55,0.3);
  --text:#F0E8FF;--text2:rgba(240,232,255,0.65);--text3:rgba(240,232,255,0.4);
}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
h1,h2,h3,.cinzel{font-family:var(--font-display);letter-spacing:0.05em}
input,select,textarea{
  background:rgba(255,255,255,0.06);border:1px solid rgba(139,92,246,0.35);border-radius:10px;
  padding:10px 14px;color:#fff;font-size:14px;outline:none;width:100%;
  font-family:var(--font-body);transition:border-color 0.2s;
}
input:focus,select:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(167,139,250,0.15)}
select option{background:#1a0040;color:#fff}
input::placeholder{color:var(--text3)}
label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block}
button{cursor:pointer;font-family:var(--font-body);border:none;outline:none}
.btn-primary{
  background:linear-gradient(135deg,var(--purple),#4C1D95);color:#fff;
  padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;
  border:1px solid rgba(167,139,250,0.4);transition:all 0.2s;width:100%;
  text-align:center;
}
.btn-primary:active{transform:scale(0.97)}
.btn-sm{padding:7px 16px;border-radius:8px;font-size:12px;background:rgba(139,92,246,0.2);color:var(--purple2);border:1px solid var(--border);transition:all 0.2s}
.btn-sm:active{transform:scale(0.95)}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px}
.card-gold{background:rgba(212,175,55,0.06);border:1px solid var(--bordergold);border-radius:16px;padding:16px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;gap:4px}
.tag-purple{background:rgba(139,92,246,0.2);color:var(--purple2);border:1px solid rgba(139,92,246,0.3)}
.tag-gold{background:rgba(212,175,55,0.15);color:var(--gold2);border:1px solid rgba(212,175,55,0.3)}
.tag-cyan{background:rgba(6,182,212,0.15);color:var(--cyan);border:1px solid rgba(6,182,212,0.3)}
.tag-pink{background:rgba(236,72,153,0.15);color:var(--pink);border:1px solid rgba(236,72,153,0.3)}
.tag-red{background:rgba(255,68,68,0.15);color:var(--red);border:1px solid rgba(255,68,68,0.3)}
.tag-green{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.3)}
.section{padding:0 0 24px}
.section-title{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;padding-left:2px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:16px 0}
.bar-wrap{height:6px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px}
.score-ring{display:flex;flex-direction:column;align-items:center;gap:4px}
.planet-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.planet-row:last-child{border-bottom:none}
.p-sym{font-size:18px;width:28px;text-align:center}
.p-name{font-weight:600;font-size:13px;min-width:54px}
.p-sign{color:var(--text2);font-size:12px;flex:1}
.p-badge{font-size:10px;padding:2px 8px;border-radius:10px}
.house-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;text-align:center;position:relative;min-height:50px;padding:4px;
  border:1px solid rgba(139,92,246,0.2);background:rgba(139,92,246,0.04);
}
.house-num{font-size:9px;color:var(--text3);position:absolute;top:2px;left:3px}
.house-sign{font-size:9px;color:var(--gold);margin-bottom:2px}
.house-planets{font-size:10px;color:var(--cyan);line-height:1.3}
.module-card{
  background:var(--glass);border:1px solid var(--border);border-radius:16px;
  padding:16px;cursor:pointer;transition:all 0.25s;user-select:none;
  display:flex;align-items:center;gap:14px;
}
.module-card:active{transform:scale(0.97);border-color:var(--purple2)}
.module-icon{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.module-title{font-family:var(--font-display);font-size:14px;font-weight:600;margin-bottom:3px}
.module-sub{font-size:11px;color:var(--text2)}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:6px}
.back-btn:active{transform:scale(0.95)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-value{font-size:13px;font-weight:500;color:var(--text)}
.chakra-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chakra-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chakra-name{font-size:12px;min-width:100px;color:var(--text2)}
.chakra-score{font-size:11px;color:var(--text3);min-width:30px;text-align:right}
.compat-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.compat-name{font-size:12px;color:var(--text2);min-width:120px}
.compat-score{font-size:11px;min-width:32px;text-align:right;color:var(--text3)}
.dasha-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.dasha-planet{font-size:13px;font-weight:600;min-width:70px}
.dasha-years{font-size:11px;color:var(--text3);flex:1}
.dasha-active{background:rgba(212,175,55,0.1);border-radius:8px;padding:2px 8px;color:var(--gold);font-size:10px}
.page{display:none;padding:16px;max-width:480px;margin:0 auto}
.page.active{display:block}
#app{min-height:100vh;position:relative}
.lagna-asc{
  width:100%;height:36px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.15),transparent);
  font-family:var(--font-display);font-size:11px;color:var(--gold);letter-spacing:0.15em;
  border-top:1px solid var(--bordergold);border-bottom:1px solid var(--bordergold);
  margin-bottom:12px;
}
.result-hero{
  background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(6,182,212,0.15));
  border:1px solid rgba(139,92,246,0.3);border-radius:20px;padding:20px;
  text-align:center;margin-bottom:20px;
}
.result-hero-name{font-family:var(--font-display);font-size:22px;color:var(--gold);margin-bottom:6px}
.result-hero-sub{font-size:12px;color:var(--text2)}
.info-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;margin-bottom:10px;font-size:12px;line-height:1.7;color:var(--text2)}
.info-box strong{color:var(--text)}
.tips{font-size:11px;color:var(--text3);background:rgba(212,175,55,0.07);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:10px}
.yoga-card{background:rgba(6,182,212,0.07);border:1px solid rgba(6,182,212,0.2);border-radius:12px;padding:14px;margin-bottom:10px}
.yoga-name{font-weight:700;font-size:14px;color:var(--cyan);margin-bottom:4px}
.yoga-type{font-size:11px;color:var(--text3)}
.yoga-benefit{font-size:12px;color:var(--text2);margin-top:6px}
.compat-header{background:linear-gradient(135deg,rgba(236,72,153,0.2),rgba(124,58,237,0.2));border:1px solid rgba(236,72,153,0.3);border-radius:16px;padding:16px;text-align:center;margin-bottom:16px}
.compat-total{font-size:32px;font-family:var(--font-display);color:var(--gold)}
.nabisco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 0 16px}
.south-chart{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid rgba(139,92,246,0.3);border-radius:4px;overflow:hidden;background:rgba(139,92,246,0.1)}
.north-chart svg{width:100%;height:auto}
.chart-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.chart-toggle-btn{flex:1;padding:8px;text-align:center;font-size:12px;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all 0.2s}
.chart-toggle-btn.active{background:rgba(139,92,246,0.25);color:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(212,175,55,0.3)}50%{box-shadow:0 0 20px rgba(212,175,55,0.6)}}
@keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
@keyframes spinRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp 0.4s ease forwards}
.active-dasha{animation:glow 2s ease-in-out infinite}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:20px}
.loading-ring{width:60px;height:60px;border:3px solid rgba(139,92,246,0.2);border-top-color:var(--purple2);border-radius:50%;animation:spinRing 0.8s linear infinite}
.loading-text{color:var(--text2);font-size:13px;animation:pulse 1.5s ease-in-out infinite}
.error-box{background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.3);border-radius:12px;padding:16px;color:#ff9999;font-size:13px;text-align:center}

/* ── 개편 추가 스타일 ───────────────────────────────────── */

/* 스크롤 페이드인 */
.reveal{opacity:0;transform:translateY(22px);transition:opacity 0.55s ease,transform 0.55s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-delay-1{transition-delay:0.08s}
.reveal-delay-2{transition-delay:0.16s}
.reveal-delay-3{transition-delay:0.24s}
.reveal-delay-4{transition-delay:0.32s}

/* 반응형 타이포 */
.hero-name{font-family:var(--font-display);font-size:clamp(20px,5vw,28px);color:var(--gold);line-height:1.2}
.hero-sub{font-size:clamp(11px,2.5vw,13px);color:var(--text2)}
.section-head{font-family:var(--font-display);font-size:clamp(13px,3vw,15px);color:var(--gold);letter-spacing:0.08em;margin-bottom:4px}
.body-text{font-size:clamp(13px,3.2vw,14px);line-height:1.75;color:var(--text2)}
.sage-text{font-size:clamp(13px,3.2vw,14px);line-height:1.85;color:var(--text2);font-style:italic;border-left:2px solid var(--gold);padding:10px 14px;background:rgba(212,175,55,0.05);border-radius:0 10px 10px 0;margin:10px 0}
.keyword{display:inline;background:rgba(212,175,55,0.15);color:var(--gold2);border:1px solid rgba(212,175,55,0.3);border-radius:4px;padding:1px 6px;font-size:0.92em;font-weight:500}

/* 탭 시스템 */
.tab-bar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,0.06);color:var(--text2);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.2s;white-space:nowrap}
.tab-btn.active{background:rgba(139,92,246,0.25);color:#fff;border-color:rgba(139,92,246,0.5)}
.tab-btn:active{transform:scale(0.95)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* 아코디언 */
.acc-item{border:1px solid rgba(255,255,255,0.07);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc-header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background 0.2s}
.acc-header:active{background:rgba(255,255,255,0.04)}
.acc-title{font-size:13px;font-weight:600;flex:1}
.acc-arrow{font-size:12px;color:var(--text3);transition:transform 0.25s;flex-shrink:0}
.acc-body{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(.4,0,.2,1)}
.acc-body.open{max-height:600px}
.acc-inner{padding:0 14px 14px}

/* 행성 테이블 개편 */
.planet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.planet-cell{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:8px 6px;text-align:center;position:relative;overflow:hidden}
.planet-cell::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.planet-sym-big{font-size:20px;display:block;margin-bottom:2px}
.planet-nm{font-size:11px;font-weight:700;margin-bottom:2px}
.planet-pos{font-size:10px;color:var(--text3);line-height:1.3}
.planet-dig{font-size:9px;padding:1px 6px;border-radius:8px;margin-top:3px;display:inline-block}

/* 요약 카드 그리드 */
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.sum-card{background:rgba(255,255,255,0.04);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.07);position:relative;overflow:hidden}
.sum-card-label{font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
.sum-card-val{font-size:clamp(12px,3vw,14px);font-weight:700;line-height:1.3}
.sum-card-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* 모듈 카드 (개편) */
.mod-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all 0.22s;user-select:none;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.mod-card:active{transform:scale(0.97)}
.mod-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.mod-texts{flex:1;min-width:0}
.mod-title{font-family:var(--font-display);font-size:13px;font-weight:600;margin-bottom:2px}
.mod-preview{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-score{font-size:18px;font-family:var(--font-display);font-weight:700;flex-shrink:0}

/* 다샤 타임라인 */
.dasha-timeline{position:relative;padding-left:20px}
.dasha-timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--purple2),transparent)}
.dasha-node{position:relative;margin-bottom:14px}
.dasha-dot{position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;border:2px solid var(--purple2);background:var(--bg)}
.dasha-dot.active-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(212,175,55,0.6)}
.dasha-period{font-size:12px;font-weight:600;margin-bottom:2px}
.dasha-range{font-size:11px;color:var(--text3)}
.dasha-insight{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.6}

/* 차크라 링 */
.chakra-list{display:flex;flex-direction:column;gap:10px}
.chakra-item{display:flex;align-items:center;gap:10px}
.chakra-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:#fff}
.chakra-info{flex:1}
.chakra-label{font-size:12px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.chakra-desc{font-size:11px;color:var(--text3);line-height:1.5}

/* 궁합 */
.compat-score-big{font-family:var(--font-display);font-size:clamp(42px,10vw,56px);font-weight:700;line-height:1}
.compat-item{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:8px;margin-bottom:9px}
.compat-label{font-size:11px;color:var(--text2)}
.compat-num{font-size:11px;text-align:right;font-weight:600}

/* 디테일 헤더 */
.detail-topbar{display:flex;align-items:center;gap:10px;padding:14px 0 18px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid rgba(255,255,255,0.04);margin-bottom:16px}

/* 요가 카드 */
.yoga-item{background:rgba(6,182,212,0.06);border:1px solid rgba(6,182,212,0.18);border-radius:12px;padding:14px;margin-bottom:10px}
.yoga-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.yoga-title{font-weight:700;font-size:14px;color:var(--cyan)}
.yoga-dur{font-size:11px;color:var(--text3)}
.yoga-benefit{font-size:12px;color:var(--text2);line-height:1.6}
</style>
</head>
<body>
<canvas id="starCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0"></canvas>
<div style="position:fixed;top:-20%;left:-20%;width:140%;height:140%;background:radial-gradient(ellipse at 30% 25%,rgba(88,28,135,0.4) 0%,transparent 55%),radial-gradient(ellipse at 70% 75%,rgba(6,182,212,0.15) 0%,transparent 50%);pointer-events:none;z-index:0"></div>

<div id="app" style="position:relative;z-index:1">
  <!-- PAGE: NO PROFILE (입력 없음, 프로필 필요) -->
  <div id="page-noprofile" class="page active">
    <div style="padding-top:48px;text-align:center;margin-bottom:28px">
      <div style="font-size:40px;margin-bottom:8px">🌌</div>
      <h1 style="font-size:22px;color:var(--gold);margin-bottom:6px">베다 점성술</h1>
      <p style="font-size:12px;color:var(--text3)">Jyotish · 별들의 지혜</p>
    </div>
    <div class="glass" style="padding:24px;text-align:center">
      <p style="font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.7">나의 운명 카드에서 생년월일·시간 정보를 먼저 입력해 주세요.<br>같은 프로필로 베다점을 볼 수 있습니다.</p>
      <a href="/" class="btn-primary" style="display:inline-block;text-decoration:none;color:#fff">← 메인으로 돌아가기</a>
    </div>
  </div>

  <!-- PAGE: LOADING -->
  <div id="page-loading" class="page">
    <div class="loading" style="padding-top:80px">
      <div class="loading-ring"></div>
      <div class="loading-text">우주의 기운을 읽는 중…</div>
    </div>

const nd=d=>((d%360)+360)%360;
const r2d=d=>d*Math.PI/180;

function julianDay(yr,mo,dy,hr){
  let y=yr,m=mo;if(m<=2){y--;m+=12;}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+dy+B-1524.5+hr/24;
}
function ayanamsa(jd){
  const T=(jd-2415020.0)/36524.2198782;
  return nd(22.460148+1.396468*T+0.000308*T*T);
}
function calcPlanets(jd){
  const T=(jd-2451545.0)/36525;
  const ay=ayanamsa(jd);
  // Mean longitudes
  const L={
    Sun:nd(280.46646+36000.76983*T),
    Moon:nd(218.3164591+481267.88134236*T),
    Mercury:nd(252.250906+149472.6746358*T),
    Venus:nd(181.979801+58517.8156760*T),
    Mars:nd(355.433275+19140.2993313*T),
    Jupiter:nd(34.351519+3034.9056606*T),
    Saturn:nd(50.077444+1222.1138488*T),
    Rahu:nd(125.044555-1934.1361849*T)
  };
  // Sun equation of center
  const Ms=nd(357.52911+35999.05029*T);
  const Csun=(1.914602-0.004817*T)*Math.sin(r2d(Ms))+(0.019993-0.000101*T)*Math.sin(2*r2d(Ms))+0.000289*Math.sin(3*r2d(Ms));
  L.Sun=nd(L.Sun+Csun);
  // Moon corrections
  const D=nd(297.85036+445267.11480*T);
  const Mm=nd(134.96298+477198.867398*T);
  const F=nd(93.27191+483202.017538*T);
  L.Moon=nd(L.Moon+6.289*Math.sin(r2d(Mm))-1.274*Math.sin(r2d(2*D-Mm))+0.658*Math.sin(r2d(2*D))-0.214*Math.sin(r2d(2*Mm))-0.110*Math.sin(r2d(D)));
  // Mars correction
  const Mm2=nd(319.9294+19139.8585*T);
  L.Mars=nd(L.Mars+(10.691+0.623*T)*Math.sin(r2d(Mm2))+0.623*Math.sin(2*r2d(Mm2)));
  // Jupiter correction
  const Mj=nd(20.9367+3034.906*T);
  L.Jupiter=nd(L.Jupiter+5.555*Math.sin(r2d(Mj))+0.168*Math.sin(2*r2d(Mj)));
  // Saturn correction
  const Ms2=nd(317.821+1222.114*T);
  L.Saturn=nd(L.Saturn+6.406*Math.sin(r2d(Ms2))+0.317*Math.sin(2*r2d(Ms2)));
  // Apply Ayanamsa → Sidereal
  const sid={};
  for(const[p,v]of Object.entries(L))sid[p]=nd(v-ay);
  sid.Ketu=nd(sid.Rahu+180);
  return sid;
}
function calcAscendant(jd,lat,lon){
  const T=(jd-2451545.0)/36525;
  const GMST=nd(280.46061837+360.98564736629*(jd-2451545.0)+0.000387933*T*T);
  const LST=nd(GMST+lon);
  const eps=23.439292-0.013004*T;
  const asc=nd(Math.atan2(-Math.cos(r2d(LST)),Math.sin(r2d(LST))*Math.cos(r2d(eps))+Math.tan(r2d(lat))*Math.sin(r2d(eps)))*180/Math.PI);
  return nd(asc-ayanamsa(jd));
}
function isRetrograde(planet,jd){
  if(["Sun","Moon"].includes(planet))return false;
  if(["Rahu","Ketu"].includes(planet))return true;
  const l1=calcPlanets(jd-0.5)[planet];
  const l2=calcPlanets(jd+0.5)[planet];
  const diff=nd(l2-l1);return diff>180;
}
function dignity(planet,sign){
  if(EXALT[planet]===sign)return"Exalted";
  if(DEBIL[planet]===sign)return"Debilitated";
  if(OWNSIGNS[planet]&&OWNSIGNS[planet].includes(sign))return"Own";
  return"Neutral";
}
function planetStrength(rasi,planet){
  const d=rasi.planets[planet].dignity;
  return d==="Exalted"?90:d==="Own"?75:d==="Debilitated"?15:50;
}
function planetHouse(rasi,planet){
  const i=rasi.houses.findIndex(h=>h.planets.includes(planet));
  return i<0?0:i+1;
}

// ─── CHART BUILDER (f.timezone = UTC 오프셋 시간, 예: 9 = UTC+9) ─
function buildChart(f,lonsOverride){
  const utcH=f.hour+(f.minute||0)/60-f.timezone;
  const jd=julianDay(f.year,f.month,f.day,utcH);
  const lons=lonsOverride||calcPlanets(jd);
  const asc=calcAscendant(jd,f.lat,f.lon);
  const ps={};
  const allP=["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn","Rahu","Ketu"];
  for(const p of allP){
    const lon=lons[p];const sign=Math.floor(nd(lon)/30);
    ps[p]={lon,sign,signName:SIGNS[sign],deg:nd(lon)%30,retro:isRetrograde(p,jd),dignity:dignity(p,sign)};
  }
  const lagnaSign=Math.floor(nd(asc)/30);
  const houses=Array.from({length:12},(_,h)=>{
    const si=(lagnaSign+h)%12;
    return{num:h+1,sign:SIGNS[si],signKr:SIGNKR[si],si,lord:SLORDS[si],planets:allP.filter(p=>ps[p].sign===si)};
  });
  const rasi={asc,ascSign:SIGNS[lagnaSign],ascSignKr:SIGNKR[lagnaSign],planets:ps,houses};
  // Nakshatra
  const SPAN=360/27;const ml=nd(ps.Moon.lon);
  const ni=Math.floor(ml/SPAN);const din=ml-ni*SPAN;
  const nak={idx:ni,name:NAKS[ni].n,lord:NAKS[ni].l,pada:Math.floor(din/(SPAN/4))+1,din};
  // Vimshottari Dasha
  const firstIdx=DSEQ.findIndex(d=>d.p===nak.lord);
  const bal=DSEQ[firstIdx].y*(1-din/SPAN);
  const bd=new Date(f.year,f.month-1,f.day,f.hour,(f.minute||0));
  const dashas=[];let dt=new Date(bd);
  for(let i=0;i<9;i++){
    const info=DSEQ[(firstIdx+i)%9];const dur=i===0?bal:info.y;
    const start=new Date(dt);const end=new Date(dt.getTime()+dur*365.25*86400000);
    const ants=[];let ad=new Date(start);
    for(let j=0;j<9;j++){
      const ai=DSEQ[(firstIdx+i+j)%9];const ay=dur*ai.y/120;
      const ae=new Date(ad.getTime()+ay*365.25*86400000);
      ants.push({p:ai.p,start:new Date(ad),end:new Date(ae)});ad=new Date(ae);
    }
    dashas.push({p:info.p,start,end,dur,ants});dt=new Date(end);
  }
  const now=new Date();
  const maha=dashas.find(d=>now>=d.start&&now<=d.end)||dashas[dashas.length-1];
  const anta=maha.ants.find(a=>now>=a.start&&now<=a.end)||maha.ants[0];
  // D9 Navamsa
  const d9={};const NAVS=30/9;
  const navStart={0:0,1:9,2:6,3:3,4:0,5:9,6:6,7:3,8:0,9:9,10:6,11:3};
  for(const p of allP){
    const pos=ps[p];const ni2=Math.floor(pos.deg/NAVS);const ss=navStart[pos.sign];
    const ns=(ss+ni2)%12;d9[p]={sign:ns,signName:SIGNS[ns]};
  }
  // D10 Dasamsa
  const d10={};
  for(const p of allP){
    const pos=ps[p];const di=Math.floor(pos.deg/3);
    const ss=pos.sign%2===0?pos.sign:(pos.sign+8)%12;
    const ds=(ss+di)%12;d10[p]={sign:ds,signName:SIGNS[ds]};
  }
  return{f,rasi,nak,dashas,maha,anta,d9,d10};
}

// Ashtakoot Milan (Compatibility)
function calcCompatibility(nak1,nak2){
  const i1=NAKS.findIndex(n=>n.n===nak1);const i2=NAKS.findIndex(n=>n.n===nak2);
  // Varna (1)
  const varnaMap={"Ashwini":3,"Bharani":0,"Krittika":1,"Rohini":3,"Mrigashira":2,"Ardra":0,"Punarvasu":3,"Pushya":1,"Ashlesha":0,"Magha":0,"Purva Phalguni":3,"Uttara Phalguni":3,"Hasta":2,"Chitra":3,"Swati":2,"Vishakha":3,"Anuradha":2,"Jyeshtha":0,"Mula":1,"Purva Ashadha":3,"Uttara Ashadha":1,"Shravana":2,"Dhanishtha":3,"Shatabhisha":2,"Purva Bhadrapada":1,"Uttara Bhadrapada":3,"Revati":3};
  const varna=varnaMap[nak1]>=varnaMap[nak2]?1:0;
  // Vashya (2) — simplified
  const vashya=Math.abs(i1-i2)<=4?2:1;
  // Tara (3)
  const t1=(i2-i1+27)%27%9+1;const t2=(i1-i2+27)%27%9+1;
  const taraScore=[1,3,5,7].includes(t1)&&[1,3,5,7].includes(t2)?3:[1,3,5,7].includes(t1)||[1,3,5,7].includes(t2)?1.5:0;
  // Yoni (4)
  const y1=NKYONI[nak1],y2=NKYONI[nak2];
  const hostile=[["Dog","Deer"],["Cat","Rat"],["Horse","Buffalo"],["Elephant","Lion"],["Goat","Mongoose"],["Cow","Tiger"],["Serpent","Mongoose"]];
  const yoni=y1===y2?4:hostile.some(h=>(y1===h[0]&&y2===h[1])||(y1===h[1]&&y2===h[0]))?0:2;
  // Graha Maitri (5)
  const l1=NAKS[i1].l,l2=NAKS[i2].l;
  const r1=l1===l2?"Neutral":(PFRIEND[l1]&&PFRIEND[l1][l2])||"Neutral";
  const r2=l1===l2?"Neutral":(PFRIEND[l2]&&PFRIEND[l2][l1])||"Neutral";
  const gmScores={"Friend-Friend":5,"Friend-Neutral":4,"Neutral-Friend":4,"Neutral-Neutral":3,"Friend-Enemy":1,"Enemy-Friend":1,"Enemy-Neutral":0.5,"Neutral-Enemy":0.5,"Enemy-Enemy":0};
  const gm=gmScores[`${r1}-${r2}`]||3;
  // Gana (6)
  const g1=NKGANA[nak1],g2=NKGANA[nak2];
  const gana=g1===g2?6:g1==="Deva"&&g2==="Manushya"||g1==="Manushya"&&g2==="Deva"?5:g1==="Deva"&&g2==="Rakshasa"||g1==="Rakshasa"&&g2==="Deva"?0:3;
  // Bhakoot (7)
  const s1=Math.floor(i1/2.25),s2=Math.floor(i2/2.25);
  const diff=Math.abs(s1-s2);
  const bhakoot=[6,8,5,9].includes(diff+1)||[6,8,5,9].includes(12-diff)?0:7;
  // Nadi (8)
  const nadi=NKNADI[nak1]!==NKNADI[nak2]?8:0;
  const total=Math.round(varna+vashya+taraScore+yoni+gm+gana+bhakoot+nadi);
  const breakdown=[
    {n:"Varna (카스트 호환성)",max:1,sc:Math.round(varna),desc:"사회적 적합성"},
    {n:"Vashya (지배 관계)",max:2,sc:Math.round(vashya),desc:"상호 영향력"},
    {n:"Tara (별자리 궁합)",max:3,sc:Math.round(taraScore),desc:"건강·운"},
    {n:"Yoni (본능 호환)",max:4,sc:Math.round(yoni),desc:"신체적 친밀감"},
    {n:"Graha Maitri (행성우정)",max:5,sc:Math.round(gm),desc:"정신적 호환"},
    {n:"Gana (기질 호환)",max:6,sc:Math.round(gana),desc:"기질적 조화"},
    {n:"Bhakoot (관계 조화)",max:7,sc:Math.round(bhakoot),desc:"관계 번영"},
    {n:"Nadi (체질 호환)",max:8,sc:Math.round(nadi),desc:"자녀 건강·건강"}
  ];
  const pct=Math.round(total/36*100);
  const verdict=pct>=75?"매우 좋은 궁합 — 강력히 추천":pct>=65?"좋은 궁합 — 추천":pct>=50?"보통 궁합 — 노력 필요":"신중한 접근 권장";
  const strengths=[];const challenges=[];
  if(nadi===8)strengths.push("완벽한 체질 호환");
  if(gana===6)strengths.push("동일 기질 — 자연스러운 조화");
  if(yoni===4)strengths.push("강한 신체적 끌림");
  if(nadi===0)challenges.push("Nadi Dosha: 자녀·건강 주의");
  if(gana===0)challenges.push("기질 충돌 주의 필요");
  if(bhakoot===0)challenges.push("Bhakoot Dosha: 재물·번영 주의");
  return{total,pct,verdict,breakdown,strengths,challenges,advice:pct>=65?"두 사람의 별자리 에너지가 조화를 이룹니다. 상호 존중과 이해로 깊은 관계를 만들어가세요.":"차이점을 인정하고 서로를 보완하는 노력이 관계의 핵심입니다."};
}

// ─── SCROLL REVEAL ────────────────────────────────────────
function initReveal(){
  const els=document.querySelectorAll('.reveal');
  if(!els.length)return;
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
  },{threshold:0.08});
  els.forEach(el=>obs.observe(el));
}

// ─── PROFILE 정규화 (지역/생일 null 시 서울·기본값 적용, tz = 시간 단위 UTC 오프셋) ─
function normalizeProfileForVedic(profile){
  if(!profile||!profile.birth)return profile;
  const b=profile.birth;
  const l=profile.location||{};
  const lat=typeof l.lat==='number'&&!isNaN(l.lat)?l.lat:(parseFloat(l.lat)||37.5665);
  const lng=typeof l.lng==='number'&&!isNaN(l.lng)?l.lng:(typeof l.lon==='number'&&!isNaN(l.lon)?l.lon:(parseFloat(l.lng)||parseFloat(l.lon)||126.978));
  let tz=9;
  if(typeof l.baseTzOffset==='number'&&!isNaN(l.baseTzOffset))tz=l.baseTzOffset;
  else if(typeof l.tzOffset==='number'&&!isNaN(l.tzOffset))tz=Math.abs(l.tzOffset)<=24?l.tzOffset:l.tzOffset/60;
  return{
    id:profile.id,
    name:profile.name,
    gender:profile.gender,
    birth:{
      year:b.year,
      month:b.month,
      day:b.day,
      hour:b.hour!=null?b.hour:12,
      minute:b.minute!=null?b.minute:0,
      calType:b.calType||'solar'
    },
    location:{
      label:l.label||'대한민국 (서울)',
      tz:l.tz||'Asia/Seoul',
      lat, lng,
      tzOffset:tz,
      baseTzOffset:tz,
      dstMinutes:l.dstMinutes
    }
  };
}

// ─── PROFILE → FORM (f.timezone = UTC 오프셋 시간 단위, 예: 9 = UTC+9) ─
function profileToForm(profile){
  const p=normalizeProfileForVedic(profile)||profile;
  const birth=p.birth||{};
  const loc=p.location||{};
  let tz=9;
  if(typeof loc.baseTzOffset==='number'&&!isNaN(loc.baseTzOffset))tz=loc.baseTzOffset;
  else if(typeof loc.tzOffset==='number'&&!isNaN(loc.tzOffset))tz=Math.abs(loc.tzOffset)<=24?loc.tzOffset:loc.tzOffset/60;
  const lat=parseFloat(loc.lat);
  const lon=parseFloat(loc.lng)||parseFloat(loc.lon);
  return{
    name:(p.name||'').trim()||'이름없음',
    gender:p.gender||'M',
    year:parseInt(birth.year,10)||1990,
    month:parseInt(birth.month,10)||1,
    day:parseInt(birth.day,10)||1,
    hour:parseInt(birth.hour,10)||12,
    minute:parseInt(birth.minute,10)||0,
    lat:(typeof lat==='number'&&!isNaN(lat))?lat:37.5665,
    lon:(typeof lon==='number'&&!isNaN(lon))?lon:126.978,
    timezone:tz
  };
}

// ─── CALCULATE FROM PROFILE (API 우선, 실패 시 로컬) ───────
function doCalculateFromProfile(profile){
  const f=profileToForm(profile);
  if(isNaN(f.year)||isNaN(f.lat)||isNaN(f.lon)){alert('프로필 정보가 부족합니다.');return;}
  showPage('loading');

  function runWithPlanets(planetsFromApi){
    try{
      var chart=buildChart(f,planetsFromApi);
      var report=analyze(chart);
      var insights=generateInsights(chart,report);
      G.chart=chart;G.report=report;G.insights=insights;G.activeTab='overview';
      G.usedLocalCalc=!planetsFromApi;
      renderResult();
      showPage('result');
    }catch(err){
      console.error(err);
      document.getElementById('result-content').innerHTML='<div class="error-box">계산 중 오류가 발생했습니다. 생년월일·시간·장소를 확인해 주세요.<br><a href="/" style="color:var(--gold);margin-top:12px;display:inline-block">← 메인으로</a></div>';
      showPage('result');
    }
  }

  function runLocal(){
    runWithPlanets(undefined);
  }

  var apiBase=typeof window!=='undefined'&&window.location&&window.location.origin?window.location.origin:'';
  fetch(apiBase+'/api/vedic/planets',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      year:f.year,month:f.month,day:f.day,
      hour:f.hour,minute:f.minute,timezone:f.timezone
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    if(res&&res.ok&&res.planets){
      runWithPlanets(res.planets);
    } else {
      runLocal();
    }
  })
  .catch(function(err){
    console.warn('Vedic API unavailable, using local calculation:', err&&err.message?err.message:'');
    runLocal();
  });
}

// ─── INIT: 프로필 있으면 API 호출 후 결과, 없으면 noprofile ─
function _hasValidBirth(p){
  if(!p||!p.birth)return false;
  const b=p.birth;
  const numOrStr=function(v){ return v!==undefined&&v!==null&&v!===''&&(typeof v==='number'?!isNaN(v):String(v).trim()!==''); };
  return numOrStr(b.year)&&numOrStr(b.month)&&numOrStr(b.day);
}
function _hasAnyBirth(p){
  if(!p||!p.birth)return false;
  const b=p.birth;
  return (b.year!=null&&b.year!=='')||(b.month!=null&&b.month!=='')||(b.day!=null&&b.day!=='');
}
function _repairProfile(profile){
  if(!profile)return null;
  if(!profile.birth&&(profile.birthYear!=null||profile.birthMonth!=null||profile.birthDay!=null)){
    profile={ id:profile.id,name:profile.name,gender:profile.gender,location:profile.location,birth:{ year:profile.birthYear,month:profile.birthMonth,day:profile.birthDay,hour:profile.birthHour,minute:profile.birthMinute } };
  }
  if(!profile.birth&&(profile.birthDate||profile.birthTime)){
    var y=1990,m=1,d=1,hr=12,min=0;
    if(typeof profile.birthDate==='string'){
      var parts=profile.birthDate.split(/[-/]/);
      if(parts.length>=3){ y=parseInt(parts[0],10)||y; m=parseInt(parts[1],10)||m; d=parseInt(parts[2],10)||d; }
      else if(parts.length===1&&parts[0].length>=8){ y=parseInt(parts[0].slice(0,4),10)||y; m=parseInt(parts[0].slice(4,6),10)||m; d=parseInt(parts[0].slice(6,8),10)||d; }
    }
    if(typeof profile.birthTime==='string'){
      var tparts=profile.birthTime.split(/[:]/);
      if(tparts.length>=2){ hr=parseInt(tparts[0],10); min=parseInt(tparts[1],10); if(isNaN(hr))hr=12; if(isNaN(min))min=0; }
    }
    profile.birth=profile.birth||{ year:y,month:m,day:d,hour:hr,minute:min };
  }
  const b=profile.birth||{};
  if(b.year==null||b.year==='')b.year=1990;
  if(b.month==null||b.month==='')b.month=1;
  if(b.day==null||b.day==='')b.day=1;
  if(b.hour==null&&b.hour!==0)b.hour=12;
  if(b.minute==null&&b.minute!==0)b.minute=0;
  profile.birth=b;
  return profile;
}
function _readProfileFromStorage(){
  let profile=null;
  let raw;
  if(typeof localStorage!=='undefined'){
    raw=localStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){}
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){ localStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD'); return _repairProfile(profile); }
    }
  }
  if(typeof sessionStorage!=='undefined'){
    raw=sessionStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){}
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){ sessionStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD'); return _repairProfile(profile); }
    }
  }
  if(typeof window!=='undefined'&&window.FORTUNE_APP_VEDIC_PAYLOAD)return _repairProfile(window.FORTUNE_APP_VEDIC_PAYLOAD);
  if(typeof localStorage!=='undefined'){
    const listRaw=localStorage.getItem('FORTUNE_APP_USER_PROFILES.list');
    const currentId=localStorage.getItem('FORTUNE_APP_USER_PROFILES.current');
    if(listRaw){
      let arr=[]; try{ arr=JSON.parse(listRaw); }catch(_){}
      if(Array.isArray(arr)&&arr.length){
        profile=currentId?arr.find(p=>p.id===currentId):null;
        if(!profile)profile=arr[0];
        if(profile&&!_hasValidBirth(profile))profile=arr.find(_hasValidBirth)||arr.find(_hasAnyBirth)||arr[0];
        if(profile)return _repairProfile(profile);
      }
    }
    const legacy=localStorage.getItem('FORTUNE_APP_USER_PROFILES');
    if(legacy){ try{ const a=JSON.parse(legacy); if(Array.isArray(a)&&a.length){ profile=a.find(_hasValidBirth)||a.find(_hasAnyBirth)||a[0]; if(profile)return _repairProfile(profile); } }catch(_){ } }
  }
  return null;
}
function initVedicPage(){
  let profile=null;
  try{ profile=_readProfileFromStorage(); }catch(e){}
  if(!profile){ showPage('noprofile'); return; }
  profile=normalizeProfileForVedic(profile)||profile;
  if(!profile.birth||(profile.birth.year==null&&profile.birth.month==null&&profile.birth.day==null)){ showPage('noprofile'); return; }
  doCalculateFromProfile(profile);
}

    </div>`;
  }}
  html+='</div>';
  return html;

function renderNorthChart(rasi){

    {d:`M${cx},${cy} L${cx},0 L0,0 Z`,tx:50,ty:32},

    {d:`M${cx},${cy} L${cx+50},${cy-50} L${W},0 Z`,tx:cx+52,ty:cy-22}

// ─── SHOW DETAIL ──────────────────────────────────────────
function showDetail(id){
  G.detailBack='result';
  const r=G.report;const c=G.chart;const ins=G.insights||{};
  let html='';
  if(id==='personality')html=renderPersonality(r.personality,c,ins);
  else if(id==='wealth')html=renderWealth(r.wealth,ins);
  else if(id==='career')html=renderCareer(r.career,ins);
  else if(id==='chakra')html=renderChakra(r.chakra,ins);
  else if(id==='romance')html=renderRomance(r.romance,c,ins);
  else if(id==='compat')html=renderCompatInput();

  document.getElementById('detail-content').innerHTML=html;
  showPage('detail');
}

// ─── DETAIL: COMPAT ──────────────────────────────────────
function renderCompatInput(){
  return detailHeader('👫','궁합 계산기','Ashtakoot Milan · 8 Koota')+`
  <div class="sage-text reveal" style="margin-bottom:16px">아쉬타쿠타 밀란(Ashtakoot Milan)은 두 영혼의 달 낙샤트라를 8가지 기준으로 분석하여 36점 만점으로 궁합을 측정하는 베다 점성술의 핵심 결혼 궁합 시스템입니다.</div>
  <div class="glass reveal reveal-delay-1" style="padding:16px;margin-bottom:12px">
    <div class="section-head" style="margin-bottom:12px">두 번째 인물 출생 정보</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label>이름</label><input id="c-name" placeholder="이영희" value="이영희"></div>
      <div><label>성별</label><select id="c-gender"><option value="F">여성 ♀</option><option value="M">남성 ♂</option></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
      <div><label>연도</label><input id="c-year" type="number" value="1992"></div>
      <div><label>월</label><input id="c-month" type="number" value="3" min="1" max="12"></div>
      <div><label>일</label><input id="c-day" type="number" value="15" min="1" max="31"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
      <div><label>시</label><input id="c-hour" type="number" value="12" min="0" max="23"></div>
      <div><label>분</label><input id="c-min" type="number" value="30" min="0" max="59"></div>
      <div><label>UTC+</label><input id="c-tz" type="number" value="9" min="-12" max="14"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      <div><label>위도</label><input id="c-lat" value="37.5665"></div>
      <div><label>경도</label><input id="c-lon" value="126.978"></div>
    </div>
    <button class="btn-primary" onclick="doCompatCalc()">💕 궁합 계산하기</button>
  </div>
  <div id="compat-result"></div>`;
}

function doCompatCalc(){
  const f2={
    name:document.getElementById('c-name').value||'이름없음',
    gender:document.getElementById('c-gender').value,
    year:parseInt(document.getElementById('c-year').value)||1992,
    month:parseInt(document.getElementById('c-month').value)||3,
    day:parseInt(document.getElementById('c-day').value)||15,
    hour:parseInt(document.getElementById('c-hour').value)||12,
    minute:parseInt(document.getElementById('c-min').value)||30,
    lat:parseFloat(document.getElementById('c-lat').value)||37.5665,
    lon:parseFloat(document.getElementById('c-lon').value)||126.978,
    timezone:parseInt(document.getElementById('c-tz').value)||9
  };
  try{
    const chart2=buildChart(f2);
    const nak1=G.chart.nak.name;const nak2=chart2.nak.name;
    const compat=calcCompatibility(nak1,nak2);
    const pc=compat.pct;const pcCol=pc>=75?"#22C55E":pc>=65?"#F59E0B":"#FF5555";
    document.getElementById('compat-result').innerHTML=`
    <div style="text-align:center;background:linear-gradient(135deg,rgba(236,72,153,0.15),rgba(124,58,237,0.15));border:1px solid rgba(236,72,153,0.25);border-radius:16px;padding:20px;margin-bottom:14px">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px">${G.chart.f.name} <span style="color:var(--text3)">×</span> ${f2.name}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:10px">${nak1} — ${nak2}</div>
      <div class="compat-score-big" style="color:${pcCol}">${compat.total}<span style="font-size:clamp(16px,4vw,20px);color:var(--text3)">/36</span></div>
      <div style="font-size:clamp(12px,3vw,14px);color:${pcCol};margin:6px 0;font-weight:600">${pc}%</div>
      <div style="font-size:14px;color:var(--text);font-weight:500">${compat.verdict}</div>
    </div>
    <div class="glass" style="padding:16px;margin-bottom:12px">
      <div class="section-head" style="margin-bottom:12px">8 항목 상세 점수</div>
      ${compat.breakdown.map(b=>{
        const bc=b.sc/b.max>=0.75?'#22C55E':b.sc/b.max>=0.4?'#F59E0B':'#FF5555';
        return`<div class="compat-item">
          <div class="compat-label">${b.n}</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${b.sc/b.max*100}%;background:${bc}"></div></div>
          <div class="compat-num" style="color:${bc}">${b.sc}/${b.max}</div>
        </div>`;
      }).join('')}
    </div>
    ${compat.strengths.length?`<div style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.2);border-radius:12px;padding:14px;margin-bottom:10px"><div class="section-head" style="color:#22C55E;margin-bottom:8px">✦ 강점</div>${compat.strengths.map(s=>`<div style="font-size:13px;color:var(--text2);padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05)">${s}</div>`).join('')}</div>`:''}
    ${compat.challenges.length?`<div style="background:rgba(255,68,68,0.05);border:1px solid rgba(255,68,68,0.18);border-radius:12px;padding:14px;margin-bottom:10px"><div class="section-head" style="color:#FF5555;margin-bottom:8px">⚠ 주의 사항</div>${compat.challenges.map(cc=>`<div style="font-size:13px;color:var(--text2);padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05)">${cc}</div>`).join('')}</div>`:''}
    <div style="padding:14px;background:rgba(212,175,55,0.05);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;font-size:13px;color:var(--text2);line-height:1.75">${compat.advice}</div>`;
    setTimeout(initReveal,60);
  }catch(e){
    document.getElementById('compat-result').innerHTML=`<div class="error-box">계산 오류: ${e.message}</div>`;
  }
}
