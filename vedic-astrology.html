// ─── DETAIL: VIMSHOTTARI DASHA ───────────────────────────
function renderVimshottari(chart,ins){
  ins=ins||{};
  const dashas=ins.dashas||[];
  const curr=ins.currentDasha||null;
  const PORD=['Ketu','Venus','Sun','Moon','Mars','Rahu','Jupiter','Saturn','Mercury'];
  const PYRS={Ketu:7,Venus:20,Sun:6,Moon:10,Mars:7,Rahu:18,Jupiter:16,Saturn:19,Mercury:17};
  const PSYM={Sun:'☉',Moon:'☽',Mercury:'☿',Venus:'♀',Mars:'♂',Jupiter:'♃',Saturn:'♄',Rahu:'☊',Ketu:'☋'};
  const PCOL={Sun:'#F59E0B',Moon:'#C4B5FD',Mercury:'#10B981',Venus:'#EC4899',Mars:'#EF4444',Jupiter:'#F59E0B',Saturn:'#8B7CF6',Rahu:'#7C3AED',Ketu:'#6B7280'};
  const PKRKR={Sun:'태양',Moon:'달',Mercury:'수성',Venus:'금성',Mars:'화성',Jupiter:'목성',Saturn:'토성',Rahu:'라후',Ketu:'케투'};

  // 현재 대운 찾기
  const now=new Date();
  let activeDasha=null;
  let activePct=0;
  for(const d of dashas){
    const s=new Date(d.start);const e=new Date(d.end);
    if(now>=s&&now<e){activeDasha=d;activePct=Math.min(99,Math.round((now-s)/(e-s)*100));break;}
  }

  return detailHeader('🌌','빔쇼타리 다샤','Vimshottari Dasha Timeline')+`
  <div class="reveal">
    <div class="sage-text" style="margin-bottom:16px">${ins.dashaOverview||'빔쇼타리 다샤는 베다 점성술의 핵심 시간 예측 체계로, 달의 낙샤트라를 기준으로 총 120년 주기의 각 행성 대운·소운을 계산합니다. 어떤 행성의 대운을 걷느냐에 따라 삶의 색깔이 전혀 달라집니다.'}</div>
  </div>

  ${activeDasha?`
  <!-- 현재 활성 대운 강조 카드 -->
  <div class="reveal reveal-delay-1" style="background:linear-gradient(135deg,${PCOL[activeDasha.planet]||'#8B5CF6'}10,rgba(212,175,55,0.05));border:1px solid ${PCOL[activeDasha.planet]||'#8B5CF6'}40;border-radius:20px;padding:18px;margin-bottom:16px">
    <div style="font-size:11px;color:var(--text3);letter-spacing:0.12em;margin-bottom:8px">✦ 현재 활성 대운 ✦</div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
      <div style="font-size:36px;filter:drop-shadow(0 0 10px ${PCOL[activeDasha.planet]||'#8B5CF6'})">${PSYM[activeDasha.planet]||'⭐'}</div>
      <div>
        <div style="font-size:20px;font-weight:700;color:${PCOL[activeDasha.planet]||'#8B5CF6'}">${PKRKR[activeDasha.planet]||''} 마하다샤</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${activeDasha.start}~${activeDasha.end} · ${PYRS[activeDasha.planet]}년 주기</div>
      </div>
    </div>
    <div class="bar-wrap" style="margin-bottom:8px;height:6px;border-radius:4px">
      <div class="bar-fill" style="width:${activePct}%;background:linear-gradient(90deg,${PCOL[activeDasha.planet]||'#8B5CF6'},${PCOL[activeDasha.planet]||'#8B5CF6'}aa);height:6px;border-radius:4px"></div>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:12px">대운 진행도: ${activePct}%</div>
    <div class="sage-text" style="font-size:13px;line-height:1.8">${DASHA_NARRATIVE[activeDasha.planet]||''}</div>
    ${activeDasha.antardasha&&activeDasha.antardasha.length?`
    <div style="margin-top:14px">
      <div style="font-size:11px;color:var(--text3);letter-spacing:0.08em;margin-bottom:8px">현재 소운 (안타르다샤)</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${activeDasha.antardasha.slice(0,5).map((ad,i)=>{
          const adNow=now>=new Date(ad.start)&&now<new Date(ad.end);
          return`<div style="padding:6px 10px;border-radius:10px;background:${adNow?PCOL[ad.planet]+'20':'rgba(255,255,255,0.04)'};border:1px solid ${adNow?PCOL[ad.planet]+'50':'rgba(255,255,255,0.07)'};font-size:11px;color:${adNow?PCOL[ad.planet]:'var(--text3)'}">
            ${PSYM[ad.planet]||''} ${PKRKR[ad.planet]||ad.planet}${adNow?' 🔥':''}
            <div style="font-size:10px;margin-top:2px">${ad.start}~${ad.end}</div>
          </div>`;}).join('')}
      </div>
    </div>`:''}
  </div>`:''}

  <!-- 전체 다샤 타임라인 -->
  <div class="acc-item reveal reveal-delay-2">
    <div class="acc-header" onclick="toggleAcc('vims-timeline')">
      <span style="font-size:16px">📅</span>
      <span class="acc-title">전체 대운 타임라인</span>
      <span class="acc-arrow" id="arr-vims-timeline">▾</span>
    </div>
    <div class="acc-body open" id="acc-vims-timeline">
      <div class="acc-inner" style="padding:0">
        ${(dashas||[]).map((d,idx)=>{
          const isActive=activeDasha&&d.planet===activeDasha.planet&&d.start===activeDasha.start;
          const isPast=new Date(d.end)<now;
          const col=PCOL[d.planet]||'#8B5CF6';
          return`<div style="display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);background:${isActive?col+'0D':'transparent'};position:relative">
            ${isActive?`<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${col};border-radius:2px"></div>`:''}
            <div style="min-width:32px;text-align:center">
              <div style="font-size:22px;opacity:${isPast?0.35:1}">${PSYM[d.planet]||'⭐'}</div>
            </div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
                <span style="font-size:13px;font-weight:700;color:${isPast?'var(--text3)':col}">${PKRKR[d.planet]||d.planet} 대운</span>
                ${isActive?`<span style="font-size:9px;padding:2px 7px;border-radius:8px;background:${col}22;color:${col};border:1px solid ${col}44">진행 중</span>`:''}
                ${isPast?`<span style="font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,0.04);color:var(--text3)">완료</span>`:''}
              </div>
              <div style="font-size:11px;color:var(--text3);margin-bottom:${isActive?6:0}px">${d.start} ~ ${d.end} · ${PYRS[d.planet]}년</div>
              ${isActive?`<div style="font-size:11px;color:var(--text2);line-height:1.6">${(DASHA_NARRATIVE[d.planet]||'').slice(0,90)}...</div>`:''}
            </div>
          </div>`;}).join('')}
      </div>
    </div>
  </div>

  <!-- 각 행성 대운 상세 -->
  <div class="acc-item reveal reveal-delay-3">
    <div class="acc-header" onclick="toggleAcc('vims-detail')">
      <span style="font-size:16px">📖</span>
      <span class="acc-title">각 대운의 의미 — 행성별 가이드</span>
      <span class="acc-arrow" id="arr-vims-detail">▾</span>
    </div>
    <div class="acc-body" id="acc-vims-detail">
      <div class="acc-inner" style="padding:0">
        ${PORD.map(pl=>`<div style="padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-size:20px">${PSYM[pl]||'⭐'}</span>
            <span style="font-size:13px;font-weight:700;color:${PCOL[pl]||'#8B5CF6'}">${PKRKR[pl]||pl} 대운</span>
            <span style="font-size:11px;color:var(--text3);margin-left:auto">${PYRS[pl]}년</span>
          </div>
          <div style="font-size:12px;color:var(--text2);line-height:1.8">${DASHA_NARRATIVE[pl]||''}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <!-- 다샤 활용법 -->
  <div class="acc-item reveal reveal-delay-4">
    <div class="acc-header" onclick="toggleAcc('vims-guide')">
      <span style="font-size:16px">🌠</span>
      <span class="acc-title">다샤 시스템 활용 가이드</span>
      <span class="acc-arrow" id="arr-vims-guide">▾</span>
    </div>
    <div class="acc-body" id="acc-vims-guide">
      <div class="acc-inner">
        <div style="font-size:13px;color:var(--text2);line-height:1.9">
          빔쇼타리 다샤를 최대로 활용하려면:<br>
          <br>
          <strong style="color:var(--gold)">1. 대운의 행성을 강화하세요</strong> — 현재 대운 행성의 만트라, 색상, 요일에 맞춘 수련이 그 대운의 긍정적 에너지를 증폭시킵니다.<br>
          <br>
          <strong style="color:var(--purple2)">2. 소운을 함께 보세요</strong> — 마하다샤(대운) 안에서 소운(안타르다샤)이 세부 리듬을 만듭니다. 대운·소운 행성이 차트에서 서로 우호적이면 그 시기가 특히 순조롭습니다.<br>
          <br>
          <strong style="color:var(--cyan)">3. 트랜짓과 결합하세요</strong> — 현재 대운 행성이 출생 목성·달과 합 또는 삼합이 되는 트랜짓 시기에 중요한 기회가 집중됩니다.<br>
          <br>
          <strong style="color:#22C55E">4. 어려운 대운도 성장의 씨앗</strong> — 토성·라후·케투 대운처럼 도전적인 대운이라 해서 나쁜 것은 아닙니다. 불필요한 것을 놓아주고 다음 대운의 씨앗을 심는 시기입니다.
        </div>
      </div>
    </div>
  </div>`;
}

</script>
