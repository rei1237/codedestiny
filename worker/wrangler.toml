name = "code-destiny-web"
main = "index.js"
compatibility_date = "2026-05-02"
# no_handle_cross_request_promise_resolution: 전역 공유 MongoDB(mongoose) 연결의 백그라운드
# 토폴로지 모니터 프로미스가 '최초 연결 요청' 컨텍스트에 묶여, 이후 다른 요청이 연결을 재사용할 때
# Cloudflare가 교차 요청 continuation을 취소해 DB 작업이 멈추던(→ "operation timed out"·결과 미완료)
# 문제를 해소한다. 공유 인프라(커넥션 풀)에 대한 Cloudflare 권장 설정.
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]
workers_dev = true
routes = [
  { pattern = "api.code-destiny.com", custom_domain = true },
  { pattern = "code-destiny.com/api/*", zone_name = "code-destiny.com" },
]

[ai]
binding = "AI"

# Non-secret defaults. Secrets and deployment-specific values should be set
# with `wrangler secret put` or in the Cloudflare dashboard.
# Turnstile secret:
# `wrangler secret put TURNSTILE_SECRET_KEY`
[vars]
NODE_ENV = "production"
AUTH_FRONTEND_BASE_URL = "https://code-destiny.com"
SITE_BASE_URL = "https://code-destiny.com"
AUTH_API_BASE_URL = "https://code-destiny.com"
AUTH_URL = "https://code-destiny.com"
NEXTAUTH_URL = "https://code-destiny.com"
GOOGLE_OAUTH_CALLBACK = "https://code-destiny.com/api/auth/oauth/google/callback"
NAVER_OAUTH_CALLBACK = "https://code-destiny.com/api/auth/oauth/naver/callback"
KAKAO_OAUTH_CALLBACK = "https://code-destiny.com/api/auth/oauth/kakao/callback"
AUTH_SIGNUP_BONUS_POINTS = "50"
AUTH_OPERATION_TIMEOUT_MS = "12000"
MONGO_SERVER_SELECTION_TIMEOUT_MS = "8000"
MONGO_CONNECT_TIMEOUT_MS = "8000"
MONGO_SOCKET_TIMEOUT_MS = "20000"
MONGO_WORKER_CONNECT_GUARD_MS = "10000"
MONGO_WORKER_CONNECT_RETRIES = "2"
MONGO_PING_TIMEOUT_MS = "3500"
MONGO_IP_FAMILY = "4"
MONGO_IP_FAMILY_AUTO_FALLBACK = "true"
MONGODB_DB_NAME = "code_destiny"
GEMINI_MODEL = "gemini-2.5-flash"
PREMIUM_GEMINI_MODEL = "gemini-2.5-flash"
ZIWEI_PREMIUM_GEMINI_MODEL = "gemini-2.5-flash"
PREMIUM_SAJU_NEW_YEAR_GEMINI_MODEL = "gemini-2.5-flash"
PREMIUM_GEMINI_TIMEOUT_MS = "45000"
ZIWEI_PREMIUM_LLM_TIMEOUT_MS = "75000"
ZIWEI_PREMIUM_LLM_PROVIDERS = "gemini,workers-ai"
SUKYO_PREMIUM_LLM_PROVIDERS = "gemini,workers-ai"
PSYCHO_ANALYSIS_PROVIDER_TIMEOUT_MS = "45000"
# Keep production dry-run disabled unless a production override explicitly requires it
LLM_DRY_RUN = "false"
PDF_LLM_PROVIDER = "workers-ai"
WORKERS_AI_ENABLED = "true"
PDF_LLM_MAX_CALLS_PER_JOB = "1"
PDF_REAL_LLM_CHAPTER_IDS = "intro"
PDF_DEBUG_MODE = "true"
# Worker-native route groups:
# - /api/auth/*
# - /api/payments/*
# - /api/points/me (alias)
# - /api/fortune/*
# - /api/subscription/status (alias)
#
# Required secrets include JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
# ACCESS_TOKEN_EXPIRES_IN, REFRESH_TOKEN_EXPIRES_IN, MONGO_URI,
# OAuth provider credentials, and PortOne credentials.
# API_UPSTREAM_ORIGIN is optional and only used as a fallback for API groups
# that have not been ported to this Worker yet.

[triggers]
crons = ["0 22 * * *"] # 7:00 AM KST
