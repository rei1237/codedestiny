name = "code-destiny-web"
main = "index.js"
compatibility_date = "2026-05-02"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"

# Non-secret defaults. Secrets and deployment-specific values should be set
# with `wrangler secret put` or in the Cloudflare dashboard.
[vars]
NODE_ENV = "production"
AUTH_FRONTEND_BASE_URL = "https://code-destiny.com"
SITE_BASE_URL = "https://code-destiny.com"
AUTH_API_BASE_URL = "https://code-destiny.com"
AUTH_SIGNUP_BONUS_POINTS = "50"
AUTH_OPERATION_TIMEOUT_MS = "30000"
MONGO_SERVER_SELECTION_TIMEOUT_MS = "20000"
MONGO_CONNECT_TIMEOUT_MS = "20000"
MONGO_SOCKET_TIMEOUT_MS = "30000"
MONGO_WORKER_CONNECT_GUARD_MS = "25000"
MONGO_PING_TIMEOUT_MS = "2500"
MONGO_IP_FAMILY = "4"

# Worker-native route groups:
# - /api/auth/*
# - /api/payments/*
# - /api/fortune/*
#
# Required secrets include JWT_SECRET, MONGO_URI, OAuth provider credentials,
# and PortOne credentials. API_UPSTREAM_ORIGIN is now optional and only used as
# a fallback for API groups that have not been ported to this Worker yet.
