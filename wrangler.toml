name = "code-destiny-web"
pages_build_output_dir = ".open-next"

[vars]
# Production Environment Variables
NEXT_PUBLIC_SITE_URL = "https://code-destiny.com"
NODE_VERSION = "24"

[[routes]]
pattern = "code-destiny.com/*"
script = ".open-next/worker.js"

[compatibility_flags]
nodejs_compat = true

[build]
command = "npm run build:cf"

[placement]
mode = "smart"
