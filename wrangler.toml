name = "codedestiny"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Pages-only config:
# - Cloudflare Pages reads this file during frontend build/deploy.
# - Worker runtime config is isolated in worker/wrangler.toml.
# - If a Workers pipeline needs `wrangler deploy`, use wrangler.assets.toml.

[vars]
AUTH_FRONTEND_BASE_URL = "https://code-destiny.com"
SITE_BASE_URL = "https://code-destiny.com"
API_WORKER_ORIGIN = "https://code-destiny-web.bulegyung.workers.dev"
