name = "codedestiny"
compatibility_date = "2026-05-02"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Pages-only config:
# - Frontend static build/deploy is handled by Cloudflare Pages.
# - Backend Worker config is isolated in worker/wrangler.toml.

[vars]
AUTH_FRONTEND_BASE_URL = "https://code-destiny.com"
SITE_BASE_URL = "https://code-destiny.com"
API_WORKER_ORIGIN = "https://code-destiny-web.bulegyung.workers.dev"
NODE_VERSION = "24"
