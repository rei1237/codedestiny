<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>베다 점성술 (Beta)</title>
<link id="gfont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=optional" onerror="this.remove()">
<style>
/* NOTE: 베다점 엔진(수식/알고리즘)은 그대로 두고,
   데이터 연동/실행 파이프라인만 단순화한 beta 페이지입니다. */

:root {
  --font-display: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'NanumGothic', '나눔고딕', '맑은 고딕', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#D4AF37;--gold2:#F5D06A;--purple:#7C3AED;--purple2:#A78BFA;--cyan:#06B6D4;--pink:#EC4899;
  --red:#FF4444;--green:#22C55E;--orange:#F59E0B;
  --bg:#050010;--bg2:#0a001f;--bg3:#12002e;
  --glass:rgba(255,255,255,0.05);--glassdark:rgba(0,0,0,0.3);
  --border:rgba(139,92,246,0.25);--bordergold:rgba(212,175,55,0.3);
  --text:#F0E8FF;--text2:rgba(240,232,255,0.65);--text3:rgba(240,232,255,0.4);
}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
h1,h2,h3,.cinzel{font-family:var(--font-display);letter-spacing:0.05em}
input,select,textarea{
  background:rgba(255,255,255,0.06);border:1px solid rgba(139,92,246,0.35);border-radius:10px;
  padding:10px 14px;color:#fff;font-size:14px;outline:none;width:100%;
  font-family:var(--font-body);transition:border-color 0.2s;
}
input:focus,select:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(167,139,250,0.15)}
select option{background:#1a0040;color:#fff}
input::placeholder{color:var(--text3)}
label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block}
button{cursor:pointer;font-family:var(--font-body);border:none;outline:none}
.btn-primary{
  background:linear-gradient(135deg,var(--purple),#4C1D95);color:#fff;
  padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;
  border:1px solid rgba(167,139,250,0.4);transition:all 0.2s;width:100%;
  text-align:center;
}
.btn-primary:active{transform:scale(0.97)}
.btn-sm{padding:7px 16px;border-radius:8px;font-size:12px;background:rgba(139,92,246,0.2);color:var(--purple2);border:1px solid var(--border);transition:all 0.2s}
.btn-sm:active{transform:scale(0.95)}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;gap:4px}
.tag-purple{background:rgba(139,92,246,0.2);color:var(--purple2);border:1px solid rgba(139,92,246,0.3)}
.tag-gold{background:rgba(212,175,55,0.15);color:var(--gold2);border:1px solid rgba(212,175,55,0.3)}
.tag-cyan{background:rgba(6,182,212,0.15);color:var(--cyan);border:1px solid rgba(6,182,212,0.3)}
.tag-pink{background:rgba(236,72,153,0.15);color:var(--pink);border:1px solid rgba(236,72,153,0.3)}
.section-head{font-family:var(--font-display);letter-spacing:0.05em;font-size:12px;color:var(--gold);margin-bottom:10px}
.page{display:none;padding:16px;max-width:480px;margin:0 auto}
.page.active{display:block}
#app{min-height:100vh;position:relative}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:20px}
.loading-ring{width:60px;height:60px;border:3px solid rgba(139,92,246,0.2);border-top-color:var(--purple2);border-radius:50%;animation:spinRing 0.8s linear infinite}
@keyframes spinRing{to{transform:rotate(360deg)}}
.loading-text{color:var(--text2);font-size:13px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.55}50%{opacity:1}}
.error-box{background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.3);border-radius:12px;padding:16px;color:#ff9999;font-size:13px;text-align:center}
</style>
</head>
<body>
<canvas id="starCanvas" style="position:fixed;inset:0;z-index:-1"></canvas>
<div id="app">

  <!-- PAGE: NO PROFILE -->
  <div id="page-noprofile" class="page active">
    <div class="glass" style="padding:22px;margin-top:22px;text-align:center">
      <div style="display:flex;justify-content:center;margin-bottom:12px">
        <div style="width:54px;height:54px;border-radius:16px;background:rgba(139,92,246,0.15);border:1px solid rgba(139,92,246,0.25);display:flex;align-items:center;justify-content:center;font-size:24px">🪐</div>
      </div>
      <h1 style="font-size:22px;color:var(--gold);margin-bottom:6px">베다 점성술 (Beta)</h1>
      <p style="font-size:12px;color:var(--text3)">Jyotish · 별들의 지혜</p>
    </div>
    <div class="glass" style="padding:24px;text-align:center;margin-top:14px">
      <p style="font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.7">나의 운명 카드에서 생년월일·시간·장소 정보를 입력하고 프로필을 저장/선택해 주세요.<br>같은 프로필로 베다점을 볼 수 있습니다.</p>
      <a href="/" class="btn-primary" style="display:inline-block;text-decoration:none;color:#fff">← 메인으로 돌아가기</a>
    </div>
  </div>

  <!-- PAGE: LOADING -->
  <div id="page-loading" class="page">
    <div class="loading" style="padding-top:80px">
      <div class="loading-ring"></div>
      <div class="loading-text">우주의 기운을 읽는 중…</div>
    </div>
  </div>

  <!-- PAGE: RESULT -->
  <div id="page-result" class="page">
    <div id="result-content"></div>
  </div>

</div>

<script>
(function(){
  // This file is kept only for backward compatibility.
  // The real beta experience is served at /vedic-beta (rewrite to vedic-astrology.html).
  try {
    if (typeof window !== 'undefined' && window.location && window.location.pathname === '/vedic-astrology_beta.html') {
      window.location.replace('/vedic-beta');
      return;
    }
  } catch(e) {}
})();
(function(){
  if(typeof Math!=='object'||typeof Date!=='function'||typeof JSON!=='object'){
    document.addEventListener('DOMContentLoaded',function(){
      var el=document.getElementById('page-noprofile')||document.body;
      var msg=el.querySelector&&el.querySelector('.glass p');
      if(msg)msg.textContent='이 페이지를 실행하려면 Math, Date, JSON 등 기본 기능이 필요합니다. 보안 환경(SES)에서 차단된 경우 관리자에게 문의하세요.';
    });
    return;
  }
  document.addEventListener('DOMContentLoaded',function(){ initVedicBetaPage(); });
})();

// ─── STAR CANVAS ───────────────────────────────────────────
(function(){
  const c=document.getElementById('starCanvas'),ctx=c.getContext('2d'),stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;stars.length=0;
    for(let i=0;i<150;i++)stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.3,t:Math.random()*6.28,s:Math.random()*.04+.005});}
  window.addEventListener('resize',resize);resize();
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.t+=s.s;const a=0.4+0.5*Math.sin(s.t);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();});requestAnimationFrame(draw);}
  draw();
})();

// ─── ENGINE CONSTANTS/LOGIC ───────────────────────────────
// NOTE: 알고리즘(점성술 계산 로직)은 기존과 동일하게 유지합니다.
//       아래 코드는 기존 `public/vedic-astrology.html`에서 가져온 엔진 코드입니다.

const SIGNS=["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
const SIGNKR=["양자리","황소자리","쌍둥이자리","게자리","사자자리","처녀자리","천칭자리","전갈자리","사수자리","염소자리","물병자리","물고기자리"];
const SIGNSYM=["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"];
const PSYM={Sun:"☉",Moon:"☽",Mars:"♂",Mercury:"☿",Jupiter:"♃",Venus:"♀",Saturn:"♄",Rahu:"☊",Ketu:"☋"};
const PKR={Sun:"태양",Moon:"달",Mars:"화성",Mercury:"수성",Jupiter:"목성",Venus:"금성",Saturn:"토성",Rahu:"라후",Ketu:"케투"};
const PCOL={Sun:"#FF9500",Moon:"#B0C4DE",Mars:"#FF5555",Mercury:"#44FF88",Jupiter:"#FFD700",Venus:"#FFB6C1",Saturn:"#9B8EC4",Rahu:"#88BBFF",Ketu:"#BBAA55"};
const SLORDS=["Mars","Venus","Mercury","Moon","Sun","Mercury","Venus","Mars","Jupiter","Saturn","Saturn","Jupiter"];
const EXALT={Sun:0,Moon:1,Mars:9,Mercury:5,Jupiter:3,Venus:11,Saturn:6,Rahu:2,Ketu:8};
const DEBIL={Sun:6,Moon:7,Mars:3,Mercury:11,Jupiter:9,Venus:5,Saturn:0,Rahu:8,Ketu:2};
const OWNSIGNS={Sun:[4],Moon:[3],Mars:[0,7],Mercury:[2,5],Jupiter:[8,11],Venus:[1,6],Saturn:[9,10],Rahu:[],Ketu:[]};

// --- 기존 엔진에서 사용하는 데이터/테이블(NAKS, DSEQ, STRN, PSIG 등)와 함수들은
//     원본에서 그대로 가져와야 합니다. Beta 페이지는 연동부만 단순화합니다.
//     (이 파일은 저장소 오염 방지를 위해 VEDIC_PAYLOAD를 전혀 사용하지 않습니다.)

// 아래는 엔진 실행에 필요한 최소 유틸 + (원본과 동일한) 계산 함수들
const nd=d=>((d%360)+360)%360;
const r2d=d=>d*Math.PI/180;
function julianDay(yr,mo,dy,hr){
  let y=yr,m=mo;if(m<=2){y--;m+=12;}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+dy+B-1524.5+hr/24;
}
function ayanamsa(jd){
  const T=(jd-2415020.0)/36524.2198782;
  return nd(22.460148+1.396468*T+0.000308*T*T);
}
function calcPlanets(jd){
  const T=(jd-2451545.0)/36525;
  const ay=ayanamsa(jd);
  const L={
    Sun:nd(280.46646+36000.76983*T),
    Moon:nd(218.3164591+481267.88134236*T),
    Mercury:nd(252.250906+149472.6746358*T),
    Venus:nd(181.979801+58517.8156760*T),
    Mars:nd(355.433275+19140.2993313*T),
    Jupiter:nd(34.351519+3034.9056606*T),
    Saturn:nd(50.077444+1222.1138488*T),
    Rahu:nd(125.044555-1934.1361849*T)
  };
  const Ms=nd(357.52911+35999.05029*T);
  const Csun=(1.914602-0.004817*T)*Math.sin(r2d(Ms))+(0.019993-0.000101*T)*Math.sin(2*r2d(Ms))+0.000289*Math.sin(3*r2d(Ms));
  L.Sun=nd(L.Sun+Csun);
  const D=nd(297.85036+445267.11480*T);
  const Mm=nd(134.96298+477198.867398*T);
  const F=nd(93.27191+483202.017538*T);
  L.Moon=nd(L.Moon+6.289*Math.sin(r2d(Mm))-1.274*Math.sin(r2d(2*D-Mm))+0.658*Math.sin(r2d(2*D))-0.214*Math.sin(r2d(2*Mm))-0.110*Math.sin(r2d(D)));
  const Mm2=nd(319.9294+19139.8585*T);
  L.Mars=nd(L.Mars+(10.691+0.623*T)*Math.sin(r2d(Mm2))+0.623*Math.sin(2*r2d(Mm2)));
  const Mj=nd(20.9367+3034.906*T);
  L.Jupiter=nd(L.Jupiter+5.555*Math.sin(r2d(Mj))+0.168*Math.sin(2*r2d(Mj)));
  const Ms2=nd(317.821+1222.114*T);
  L.Saturn=nd(L.Saturn+6.406*Math.sin(r2d(Ms2))+0.317*Math.sin(2*r2d(Ms2)));
  const sid={};
  for(const[p,v]of Object.entries(L))sid[p]=nd(v-ay);
  sid.Ketu=nd(sid.Rahu+180);
  return sid;
}

// ─── 연동/실행 파이프라인 (Beta) ──────────────────────────
function showPage(id){
  try{ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); }catch(_){}
  var el=document.getElementById('page-'+id);
  if(el)el.classList.add('active');
}

function _readCurrentProfileOnly(){
  // 기존 VEDIC_PAYLOAD 기반 연동은 제거(오염 방지). 남아있는 값도 삭제.
  try{ sessionStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD'); }catch(_){}
  try{ localStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD'); }catch(_){}

  try{
    var listRaw=localStorage.getItem('FORTUNE_APP_USER_PROFILES.list')||'[]';
    var currentId=localStorage.getItem('FORTUNE_APP_USER_PROFILES.current')||'';
    var arr=JSON.parse(listRaw);
    if(!Array.isArray(arr)||!arr.length)return null;
    var p=currentId?arr.find(function(x){return x&&x.id===currentId;}) : null;
    if(!p)p=arr[0];
    return p||null;
  }catch(_){
    return null;
  }
}

function _repairProfile(profile){
  if(!profile)return null;
  if(!profile.birth&&(profile.birthYear!=null||profile.birthMonth!=null||profile.birthDay!=null)){
    profile={ id:profile.id,name:profile.name,gender:profile.gender,location:profile.location,birth:{ year:profile.birthYear,month:profile.birthMonth,day:profile.birthDay,hour:profile.birthHour,minute:profile.birthMinute } };
  }
  if(!profile.birth&&(profile.birthDate||profile.birthTime)){
    var y=1990,m=1,d=1,hr=12,min=0;
    if(typeof profile.birthDate==='string'){
      var parts=profile.birthDate.split(/[-/]/);
      if(parts.length>=3){ y=parseInt(parts[0],10)||y; m=parseInt(parts[1],10)||m; d=parseInt(parts[2],10)||d; }
      else if(parts.length===1&&parts[0].length>=8){ y=parseInt(parts[0].slice(0,4),10)||y; m=parseInt(parts[0].slice(4,6),10)||m; d=parseInt(parts[0].slice(6,8),10)||d; }
    }
    if(typeof profile.birthTime==='string'){
      var tparts=profile.birthTime.split(/[:]/);
      if(tparts.length>=2){ hr=parseInt(tparts[0],10); min=parseInt(tparts[1],10); if(isNaN(hr))hr=12; if(isNaN(min))min=0; }
    }
    profile.birth=profile.birth||{ year:y,month:m,day:d,hour:hr,minute:min };
  }
  var b=profile.birth||{};
  if(b.year==null||b.year==='')b.year=1990;
  if(b.month==null||b.month==='')b.month=1;
  if(b.day==null||b.day==='')b.day=1;
  if(b.hour==null&&b.hour!==0)b.hour=12;
  if(b.minute==null&&b.minute!==0)b.minute=0;
  profile.birth=b;
  return profile;
}

function normalizeProfileForVedic(profile){
  if(!profile||!profile.birth)return profile;
  var b=profile.birth;
  var l=profile.location||{};
  var lat=typeof l.lat==='number'&&!isNaN(l.lat)?l.lat:(parseFloat(l.lat)||37.5665);
  var lng=typeof l.lng==='number'&&!isNaN(l.lng)?l.lng:(typeof l.lon==='number'&&!isNaN(l.lon)?l.lon:(parseFloat(l.lng)||parseFloat(l.lon)||126.978));
  var tz=9;
  if(typeof l.baseTzOffset==='number'&&!isNaN(l.baseTzOffset))tz=l.baseTzOffset;
  else if(typeof l.tzOffset==='number'&&!isNaN(l.tzOffset))tz=Math.abs(l.tzOffset)<=24?l.tzOffset:l.tzOffset/60;
  return{
    id:profile.id,
    name:profile.name,
    gender:profile.gender,
    birth:{
      year:b.year,month:b.month,day:b.day,
      hour:b.hour!=null?b.hour:12,
      minute:b.minute!=null?b.minute:0
    },
    location:{ lat:lat, lng:lng, tzOffset:tz, baseTzOffset:tz }
  };
}

// PROFILE → FORM (f.timezone = UTC 오프셋 시간 단위, 예: 9 = UTC+9)
function profileToForm(profile){
  var p=normalizeProfileForVedic(profile)||profile;
  var birth=p.birth||{};
  var loc=p.location||{};
  var tz=9;
  if(typeof loc.baseTzOffset==='number'&&!isNaN(loc.baseTzOffset))tz=loc.baseTzOffset;
  else if(typeof loc.tzOffset==='number'&&!isNaN(loc.tzOffset))tz=Math.abs(loc.tzOffset)<=24?loc.tzOffset:loc.tzOffset/60;
  var lat=parseFloat(loc.lat);
  var lon=parseFloat(loc.lng)||parseFloat(loc.lon);
  return{
    name:(p.name||'').trim()||'이름없음',
    gender:p.gender||'M',
    year:parseInt(birth.year,10)||1990,
    month:parseInt(birth.month,10)||1,
    day:parseInt(birth.day,10)||1,
    hour:parseInt(birth.hour,10)||12,
    minute:parseInt(birth.minute,10)||0,
    lat:(typeof lat==='number'&&!isNaN(lat))?lat:37.5665,
    lon:(typeof lon==='number'&&!isNaN(lon))?lon:126.978,
    timezone:tz
  };
}

function initVedicBetaPage(){
  var p=_readCurrentProfileOnly();
  p=_repairProfile(p);
  if(!p||!p.birth||(p.birth.year==null&&p.birth.month==null&&p.birth.day==null)){
    showPage('noprofile');return;
  }
  showPage('loading');
  try{
    // 로컬 계산만 사용(불필요한 API 의존 제거)
    var f=profileToForm(p);
    // 최소한의 결과 UI(현 단계에서는 엔진 전체 UI를 붙이기 전까지 안내만)
    var jd=julianDay(f.year,f.month,f.day,f.hour+(f.minute||0)/60-f.timezone);
    var planets=calcPlanets(jd);
    var html='<div class=\"glass\" style=\"padding:18px;margin-top:12px\">'
      +'<div class=\"section-head\">연동 확인 (Beta)</div>'
      +'<div style=\"color:var(--text2);font-size:13px;line-height:1.7\">'
      +'프로필 <span class=\"tag tag-gold\">'+(f.name||'')+'</span> 기준으로 로컬 계산을 수행했습니다.<br>'
      +'이제 엔진 결과 UI(성향/재물/천직/차크라/연애/궁합/요가)를 단계적으로 연결하면 됩니다.'
      +'</div>'
      +'<div style=\"margin-top:12px;color:var(--text3);font-size:12px\">'
      +'Sun '+(planets.Sun!=null?planets.Sun.toFixed(2):'?')+'° · Moon '+(planets.Moon!=null?planets.Moon.toFixed(2):'?')+'°'
      +'</div>'
      +'<div style=\"margin-top:12px\"><a class=\"btn-sm\" href=\"/\">← 메인으로</a></div>'
      +'</div>';
    document.getElementById('result-content').innerHTML=html;
    showPage('result');
  }catch(e){
    console.error(e);
    document.getElementById('result-content').innerHTML='<div class=\"error-box\">계산 중 오류가 발생했습니다. 프로필(생년월일·시간·장소)을 확인해 주세요.<br><a href=\"/\" style=\"color:var(--gold);margin-top:12px;display:inline-block\">← 메인으로</a></div>';
    showPage('result');
  }
}
</script>
</body>
</html>
