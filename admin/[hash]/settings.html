<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>설정</title>
    <link rel="stylesheet" href="../assets/admin.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <style>
      .cd-switch{
        display:flex; align-items:center; justify-content:space-between;
        gap:12px; padding:12px 12px;
        border:1px solid rgba(148,163,184,.18);
        background: rgba(15,23,42,.35);
        border-radius:16px;
        margin-top:10px;
      }
      .cd-switch input{ transform: scale(1.2); }
    </style>
  </head>
  <body data-page="settings">
    <div id="cdToast" class="cd-toast" aria-live="polite"></div>
    <div class="cd-shell">
      <aside class="cd-sidebar">
        <div class="cd-brand">
          <div class="flower" aria-hidden="true"><span style="font-size:18px;">🌸</span></div>
          <div style="display:flex; flex-direction:column;">
            <div style="font-weight:900;">Service Flower</div>
            <div style="color:var(--muted); font-size:12px;">Secure Portal</div>
          </div>
        </div>
        <nav class="cd-nav">
          <button type="button" data-cd-nav="dashboard"><span data-lucide="gauge" aria-hidden="true"></span>대시보드</button>
          <button type="button" data-cd-nav="content"><span data-lucide="sparkles" aria-hidden="true"></span>콘텐츠</button>
          <button type="button" data-cd-nav="members"><span data-lucide="users" aria-hidden="true"></span>회원</button>
          <button type="button" data-cd-nav="revenue"><span data-lucide="wallet" aria-hidden="true"></span>수익</button>
          <button type="button" data-cd-nav="security"><span data-lucide="shield" aria-hidden="true"></span>보안</button>
          <button type="button" data-cd-nav="settings"><span data-lucide="settings" aria-hidden="true"></span>설정</button>
        </nav>
      </aside>

      <main class="cd-main">
        <header class="cd-header">
          <div class="meta">
            <div class="time" id="cdClock"></div>
            <div class="who">접근자: <span id="cdWho">-</span></div>
          </div>
          <div class="actions">
            <button id="cdLogoutBtn" class="cd-btn ghost" type="button">로그아웃</button>
          </div>
        </header>

        <section class="cd-grid">
          <div class="cd-card" style="grid-column: span 12;">
            <h3>사이트 설정</h3>
            <p class="sub">서비스 ON/OFF, 포인트 가격, 공지사항, SEO 메타, 캐시 초기화 및 sitemap 재생성을 제공합니다.</p>

            <div class="cd-switch">
              <div>
                <div style="font-weight:900; margin-bottom:4px;">포인트 기반 기능 사용</div>
                <div style="color:var(--muted); font-size:12px; line-height:1.6;">서버 설정과 연동됩니다.</div>
              </div>
              <input type="checkbox" checked />
            </div>

            <div class="cd-inline-selects" style="grid-template-columns: 1fr 1fr; margin-top:12px;">
              <div>
                <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">포인트 가격(기본)</label>
                <input class="cd-input" type="number" id="pointPrice" value="1000" min="0" />
              </div>
              <div>
                <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">SEO 기본 설명</label>
                <input class="cd-input" type="text" id="seoDesc" value="Code Destiny" />
              </div>
            </div>

            <div class="cd-gen-actions">
              <button id="btnSaveSettings" class="cd-btn purple" type="button">설정 저장</button>
              <button id="btnResetCache" class="cd-btn ghost" type="button">캐시 초기화</button>
              <button id="btnRebuildSitemap" class="cd-btn ghost" type="button">sitemap.xml 재생성</button>
            </div>

            <div style="margin-top:18px; border-top:1px solid rgba(148,163,184,.2); padding-top:14px;">
              <h3 style="margin:0 0 10px;">관리자 허용 IP 변경</h3>
              <p class="sub" style="margin-bottom:10px;">
                현재는 단일 IP만 허용됩니다. 변경 시 관리자 비밀번호 확인이 필요합니다.
              </p>
              <div class="cd-inline-selects" style="grid-template-columns:1fr 1fr;">
                <div>
                  <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">새 허용 IP</label>
                  <input id="adminAllowedIp" class="cd-input" type="text" placeholder="예: 66.249.68.34" />
                </div>
                <div>
                  <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">관리자 비밀번호</label>
                  <input id="adminAllowedIpPassword" class="cd-input" type="password" placeholder="비밀번호 입력" />
                </div>
              </div>
              <div class="cd-gen-actions">
                <button id="btnUpdateAllowedIp" class="cd-btn" type="button">IP 변경 적용</button>
              </div>
            </div>

            <div class="cd-kasi-warn" style="margin-top:10px;">
              현재 프론트는 UI 템플릿만 포함하며, 서버 엔드포인트 구현 후 데이터가 반영됩니다.
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./assets/admin.js"></script>
    <script>
      window.__CD_ADMIN_PAGE_INIT__ = ({ showToast }) => {
        try{ window.lucide && window.lucide.createIcons(); }catch(_e){}
        document.getElementById("btnSaveSettings").addEventListener("click", () => showToast("저장 요청(샘플)"));
        document.getElementById("btnResetCache").addEventListener("click", () => showToast("캐시 초기화 요청(샘플)"));
        document.getElementById("btnRebuildSitemap").addEventListener("click", () => showToast("sitemap 재생성 요청(샘플)"));
        document.getElementById("btnUpdateAllowedIp").addEventListener("click", async () => {
          const ip = document.getElementById("adminAllowedIp").value.trim();
          const password = document.getElementById("adminAllowedIpPassword").value;
          if(!ip || !password){
            showToast("IP와 비밀번호를 입력하세요.");
            return;
          }
          try{
            const csrf = (() => {
              const raw = document.cookie || "";
              const parts = raw.split(";").map(v => v.trim());
              for (const p of parts){
                const [k, ...rest] = p.split("=");
                if (k === "fortune_csrf_token") return decodeURIComponent(rest.join("="));
              }
              return "";
            })();
            const res = await fetch("/api/admin/security/allowed-ip", {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type": "application/json",
                ...(csrf ? { "x-csrf-token": csrf } : {}),
              },
              body: JSON.stringify({ ip, password }),
            });
            const payload = await res.json().catch(() => ({}));
            if(!res.ok){
              showToast(payload?.message || "IP 변경 실패");
              return;
            }
            showToast("✅ 허용 IP 변경 완료 (서버 재시작 권장)");
            document.getElementById("adminAllowedIpPassword").value = "";
          }catch(_e){
            showToast("요청을 처리할 수 없습니다.");
          }
        });
      };
    </script>
  </body>
</html>
