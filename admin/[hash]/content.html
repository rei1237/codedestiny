<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>콘텐츠</title>
    <link rel="stylesheet" href="../assets/admin.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .cd-tabs{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
      .cd-tab{ padding:10px 12px; border-radius:14px; border:1px solid rgba(148,163,184,.22); background: rgba(15,23,42,.40); cursor:pointer; font-weight:900; color:#e5e7eb; }
      .cd-tab.is-active{ border-color: rgba(244,114,182,.55); background: rgba(244,114,182,.12); }
      .cd-preview{ border:1px solid rgba(148,163,184,.18); border-radius:16px; background: rgba(2,6,23,.25); padding:12px; }
    </style>
  </head>

  <body data-page="content">
    <div id="cdToast" class="cd-toast" aria-live="polite"></div>

    <div class="cd-shell">
      <aside class="cd-sidebar">
        <div class="cd-brand">
          <div class="flower" aria-hidden="true"><span style="font-size:18px;">🌸</span></div>
          <div style="display:flex; flex-direction:column;">
            <div style="font-weight:900;">Service Flower</div>
            <div style="color:var(--muted); font-size:12px;">Secure Portal</div>
          </div>
        </div>
        <nav class="cd-nav" aria-label="관리 메뉴">
          <button type="button" data-cd-nav="dashboard"><span data-lucide="gauge" aria-hidden="true"></span>대시보드</button>
          <button type="button" data-cd-nav="content"><span data-lucide="sparkles" aria-hidden="true"></span>콘텐츠</button>
          <button type="button" data-cd-nav="members"><span data-lucide="users" aria-hidden="true"></span>회원</button>
          <button type="button" data-cd-nav="revenue"><span data-lucide="wallet" aria-hidden="true"></span>수익</button>
          <button type="button" data-cd-nav="security"><span data-lucide="shield" aria-hidden="true"></span>보안</button>
          <button type="button" data-cd-nav="settings"><span data-lucide="settings" aria-hidden="true"></span>설정</button>
        </nav>
      </aside>

      <main class="cd-main">
        <header class="cd-header">
          <div class="meta">
            <div class="time" id="cdClock"></div>
            <div class="who">접근자: <span id="cdWho">-</span></div>
          </div>
          <div class="actions">
            <button id="cdLogoutBtn" class="cd-btn ghost" type="button">로그아웃</button>
          </div>
        </header>

        <section class="cd-grid">
          <div class="cd-card" style="grid-column: span 12;">
            <h3>일일 운세 콘텐츠 생성</h3>
            <p class="sub">프롬프트 자동 생성 후 클립보드 복사 및 SNS 예약을 지원합니다.</p>

            <div class="cd-inline-selects">
              <div class="cd-sel">
                <label for="genLang">생성 언어 선택</label>
                <select id="genLang">
                  <option value="ALL">전체</option>
                  <option value="KR">KR</option>
                  <option value="EN">EN</option>
                  <option value="JP">JP</option>
                  <option value="CN">CN</option>
                  <option value="FR">FR</option>
                </select>
              </div>
              <div class="cd-sel">
                <label for="genService">생성 서비스 선택</label>
                <select id="genService">
                  <option value="ALL">전체</option>
                  <option value="saju">사주</option>
                  <option value="ziwei">자미두수</option>
                  <option value="sukuyo">숙요점</option>
                  <option value="astrology">점성술</option>
                  <option value="vedic">베다점</option>
                </select>
              </div>
            </div>

            <div class="cd-status-grid" style="grid-template-columns: repeat(7, 1fr);">
              <div class="cd-status"><div class="k">날짜</div><div class="v" id="stDate">[자동]</div></div>
              <div class="cd-status"><div class="k">일진</div><div class="v" id="stIljin">[자동]</div></div>
              <div class="cd-status"><div class="k">음력</div><div class="v" id="stLunar">[자동]</div></div>
              <div class="cd-status"><div class="k">이십팔수</div><div class="v" id="st28">[자동]</div></div>
              <div class="cd-status"><div class="k">나크샤트라</div><div class="v" id="stNak">[자동]</div></div>
              <div class="cd-status"><div class="k">태양별자리</div><div class="v" id="stSunZodiac">[자동]</div></div>
              <div class="cd-status"><div class="k">달 위치</div><div class="v" id="stMoonPos">[자동]</div></div>
            </div>

            <div class="cd-gen-actions" style="margin-top:12px;">
              <button id="btnGeneratePrompt" class="cd-btn" type="button">🌸 프롬프트 생성 & 복사</button>
            </div>

            <div class="cd-prompt-box">
              <div class="head">프롬프트 미리보기</div>
              <textarea id="promptPreview" placeholder="버튼을 눌러 생성..." readonly></textarea>
            </div>
          </div>

          <div class="cd-card" style="grid-column: span 12;">
            <h3>SNS 예약 발행</h3>
            <p class="sub">생성된 콘텐츠를 플랫폼별로 예약 발행합니다. (Buffer 연동은 서버 구현에 따름)</p>

            <div class="cd-tabs">
              <button class="cd-tab is-active" type="button" data-platform="instagram">인스타그램</button>
              <button class="cd-tab" type="button" data-platform="twitter">Twitter/X</button>
              <button class="cd-tab" type="button" data-platform="blog">블로그</button>
              <button class="cd-tab" type="button" data-platform="email">이메일</button>
            </div>

            <div class="cd-inline-selects" style="grid-template-columns: 1fr 1fr; margin-top:12px;">
              <div>
                <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">예약 시간</label>
                <input class="cd-input" id="scheduledAt" type="datetime-local" />
              </div>
              <div>
                <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">플랫폼</label>
                <input class="cd-input" id="selectedPlatform" type="text" readonly value="instagram" />
              </div>
            </div>

            <label style="display:block; margin-top:12px;">
              <div class="cd-small" style="margin-bottom:8px; font-weight:900; color:#e5e7eb;">콘텐츠 미리보기</div>
              <div class="cd-preview" style="min-height:140px; white-space:pre-wrap; color:#e5e7eb;" id="contentPreview">
                -
              </div>
            </label>

            <div class="cd-gen-actions">
              <button id="btnSchedule" class="cd-btn purple" type="button">예약 발행</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/core/kasi-calendar-service.js"></script>
    <script src="/js/saju-engine.js"></script>
    <script src="./assets/daily-content-automation.js"></script>
    <script type="module" src="./assets/admin.js"></script>

    <script type="module">
      import { apiSchedulePost } from "./api/content.js";

      window.__CD_ADMIN_PAGE_INIT__ = ({ showToast }) => {
        try{ window.lucide && window.lucide.createIcons(); }catch(_e){}

        let lastPrompt = "";

        const tabs = Array.from(document.querySelectorAll("[data-platform]"));
        const selectedPlatform = document.getElementById("selectedPlatform");
        tabs.forEach((t) => {
          t.addEventListener("click", () => {
            tabs.forEach((x) => x.classList.remove("is-active"));
            t.classList.add("is-active");
            selectedPlatform.value = t.getAttribute("data-platform") || "instagram";
          });
        });

        function zodiacFromDate(month, day){
          const m = Number(month), d = Number(day);
          const date = m*100 + d;
          if (date >= 321 && date <= 419) return "Aries (양자리)";
          if (date >= 420 && date <= 520) return "Taurus (황소자리)";
          if (date >= 521 && date <= 620) return "Gemini (쌍둥이자리)";
          if (date >= 621 && date <= 722) return "Cancer (게자리)";
          if (date >= 723 && date <= 822) return "Leo (사자자리)";
          if (date >= 823 && date <= 922) return "Virgo (처녀자리)";
          if (date >= 923 && date <= 1022) return "Libra (천칭자리)";
          if (date >= 1023 && date <= 1121) return "Scorpio (전갈자리)";
          if (date >= 1122 && date <= 1221) return "Sagittarius (사수자리)";
          if (date >= 1222 || date <= 119) return "Capricorn (염소자리)";
          return "Aquarius (물병자리)";
        }

        function compute28AndNakshatraSafe(lunarY, lunarM, lunarD){
          const d = Number(lunarD || 0);
          const twentyEightIndex = ((d - 1) % 28 + 28) % 28;
          const nakshatraIndex = ((twentyEightIndex) % 27 + 27) % 27;
          const mansions28 = ["角宿","亢宿","氐宿","房宿","心宿","尾宿","箕宿","斗宿","牛宿","女宿","虚宿","危宿","室宿","壁宿","奎宿","婁宿","胃宿","昴宿","畢宿","觜宿","參宿","井宿","鬼宿","柳宿","星宿","張宿","翼宿","軫宿"];
          const nakshatraNames = ["Ashwini","Bharani","Krittika","Rohini","Mrigashira","Ardra","Punarvasu","Pushya","Ashlesha","Magha","Purva Phalguni","Uttara Phalguni","Hasta","Chitra","Swati","Vishakha","Anuradha","Jyeshtha","Mula","Purva Ashadha","Uttara Ashadha","Shravana","Dhanishta","Shatabhisha","Purva Bhadrapada","Uttara Bhadrapada","Revati"];
          return { twentyEight: mansions28[twentyEightIndex] || String(twentyEightIndex+1), nakshatra: nakshatraNames[nakshatraIndex] || String(nakshatraIndex+1) };
        }

        function buildPrompt({ dateStr, iljin, lunarStr, twentyEight, nakshatra, sunZodiac, moonPos, lang, serviceKey }){
          return [
            `너는 Code Destiny 콘텐츠 편집자다.`,
            `오늘 날짜 기준으로 “${serviceKey}” 콘텐츠를 생성하라.`,
            `언어: ${lang}`,
            ``,
            `- 날짜: ${dateStr}`,
            `- 일진: ${iljin}`,
            `- 음력: ${lunarStr}`,
            `- 이십팔수: ${twentyEight}`,
            `- 나크샤트라: ${nakshatra}`,
            `- 태양별자리: ${sunZodiac}`,
            `- 달 위치: ${moonPos}`,
          ].join("\n");
        }

        document.getElementById("btnGeneratePrompt").addEventListener("click", async () => {
          try{
            if(!window.KasiCalendarService || typeof window.KasiCalendarService.resolveDateContext !== "function"){
              showToast("만세력 엔진 로드 실패");
              return;
            }
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = now.getMonth()+1;
            const dd = now.getDate();
            document.getElementById("stDate").textContent = `${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;

            const ctx = await window.KasiCalendarService.resolveDateContext({
              calendarType:"solar",
              year: yyyy,
              month: mm,
              day: dd,
              hour: now.getHours(),
              minute: now.getMinutes(),
              second: now.getSeconds(),
              latitude: 37.5665,
              longitude: 126.9780,
              tzOffsetHours: 9
            }, { setCurrent:false });

            const dayGan = ctx?.ganji?.day?.[0];
            const dayZhi = ctx?.ganji?.day?.[1];
            const iljin = dayGan && dayZhi ? `${dayGan}${dayZhi}` : "미확인";
            document.getElementById("stIljin").textContent = iljin;

            const lunarY = ctx?.lunar?.year;
            const lunarM = ctx?.lunar?.month;
            const lunarD = ctx?.lunar?.day;
            const lunarLeap = !!ctx?.lunar?.isLeap;
            const lunarStr = lunarY && lunarM && lunarD ? `${lunarY}-${String(lunarM).padStart(2,'0')}-${String(lunarD).padStart(2,'0')}${lunarLeap?" (윤달)":""}` : "미확인";
            document.getElementById("stLunar").textContent = lunarStr;

            const calc = compute28AndNakshatraSafe(lunarY, lunarM, lunarD);
            document.getElementById("st28").textContent = calc.twentyEight;
            document.getElementById("stNak").textContent = calc.nakshatra;

            const sunZodiac = zodiacFromDate(mm, dd);
            document.getElementById("stSunZodiac").textContent = sunZodiac;
            document.getElementById("stMoonPos").textContent = calc.nakshatra;

            const lang = document.getElementById("genLang").value;
            const serviceKey = document.getElementById("genService").value;
            const prompt = buildPrompt({
              dateStr: document.getElementById("stDate").textContent,
              iljin,
              lunarStr,
              twentyEight: calc.twentyEight,
              nakshatra: calc.nakshatra,
              sunZodiac,
              moonPos: calc.nakshatra,
              lang,
              serviceKey,
            });
            lastPrompt = prompt;
            document.getElementById("promptPreview").value = prompt;
            await navigator.clipboard.writeText(prompt);
            showToast("✅ 프롬프트 복사 완료!");

            document.getElementById("contentPreview").textContent = prompt;
          }catch(_e){
            showToast("생성 실패");
          }
        });

        document.getElementById("btnSchedule").addEventListener("click", async () => {
          try{
            if(!lastPrompt){
              showToast("먼저 프롬프트를 생성하세요.");
              return;
            }
            const scheduledAt = document.getElementById("scheduledAt").value;
            const platform = document.getElementById("selectedPlatform").value || "instagram";
            const res = await apiSchedulePost({ platform, scheduledAt, payload: { content: lastPrompt } });
            if(res?.ok){
              showToast("예약 요청 완료");
            }else{
              showToast("예약 요청 실패");
            }
          }catch(_e){
            showToast("요청을 처리할 수 없습니다.");
          }
        });
      };
    </script>
  </body>
</html>
