<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>수익</title>
    <link rel="stylesheet" href="../assets/admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <style>
      .cd-chart-card canvas{ width:100% !important; }
    </style>
  </head>

  <body data-page="revenue">
    <div id="cdToast" class="cd-toast" aria-live="polite"></div>
    <div class="cd-shell">
      <aside class="cd-sidebar">
        <div class="cd-brand">
          <div class="flower" aria-hidden="true"><span style="font-size:18px;">🌸</span></div>
          <div style="display:flex; flex-direction:column;">
            <div style="font-weight:900;">Service Flower</div>
            <div style="color:var(--muted); font-size:12px;">Secure Portal</div>
          </div>
        </div>
        <nav class="cd-nav">
          <button type="button" data-cd-nav="dashboard"><span data-lucide="gauge" aria-hidden="true"></span>대시보드</button>
          <button type="button" data-cd-nav="content"><span data-lucide="sparkles" aria-hidden="true"></span>콘텐츠</button>
          <button type="button" data-cd-nav="members"><span data-lucide="users" aria-hidden="true"></span>회원</button>
          <button type="button" data-cd-nav="revenue"><span data-lucide="wallet" aria-hidden="true"></span>수익</button>
          <button type="button" data-cd-nav="security"><span data-lucide="shield" aria-hidden="true"></span>보안</button>
          <button type="button" data-cd-nav="settings"><span data-lucide="settings" aria-hidden="true"></span>설정</button>
        </nav>
      </aside>

      <main class="cd-main">
        <header class="cd-header">
          <div class="meta">
            <div class="time" id="cdClock"></div>
            <div class="who">접근자: <span id="cdWho">-</span></div>
          </div>
          <div class="actions">
            <button id="cdLogoutBtn" class="cd-btn ghost" type="button">로그아웃</button>
          </div>
        </header>

        <section class="cd-grid">
          <div class="cd-card" style="grid-column: span 12;">
            <h3>수익 그래프</h3>
            <p class="sub">서버에서 일/월/연별 데이터를 제공할 수 있도록 엔드포인트를 구성합니다.</p>

            <div class="cd-row2">
              <div class="cd-card cd-chart-card" style="padding:12px; border-radius:16px;">
                <h3 style="margin-bottom:8px;">일별 수익</h3>
                <canvas id="chartDaily"></canvas>
              </div>
              <div class="cd-card cd-chart-card" style="padding:12px; border-radius:16px;">
                <h3 style="margin-bottom:8px;">월별 수익</h3>
                <canvas id="chartMonthly"></canvas>
              </div>
            </div>

            <div class="cd-row2" style="margin-top:14px;">
              <div class="cd-card cd-chart-card" style="padding:12px; border-radius:16px;">
                <h3 style="margin-bottom:8px;">언어권 수익 비율</h3>
                <canvas id="chartLangRevenue"></canvas>
              </div>
              <div class="cd-card" style="padding:12px; border-radius:16px;">
                <h3 style="margin-bottom:8px;">환불/이메일 상담</h3>
                <div style="color:var(--muted); font-size:13px; line-height:1.7;">
                  - 환불 처리: 서버 구현 후 연동
                  <br />- 이메일 상담 수입: 서버 구현 후 연동
                  <br />- 결제/포인트 히스토리 기반 집계
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./assets/admin.js"></script>
    <script>
      window.__CD_ADMIN_PAGE_INIT__ = ({ showToast }) => {
        try{ window.lucide && window.lucide.createIcons(); }catch(_e){}

        try{
          new Chart(document.getElementById("chartDaily"),{
            type:"line",
            data:{ labels:["-4d","-3d","-2d","-1d","오늘"], datasets:[{
              label:"수익",
              data:[1200,980,1100,1320,1500],
              borderColor:"rgba(168,85,247,.9)",
              backgroundColor:"rgba(168,85,247,.15)",
              tension:.35,
              pointRadius:3,
              borderWidth:2
            }]},
            options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ color:"#94a3b8" }, grid:{ color:"rgba(148,163,184,.15)"}}, x:{ ticks:{ color:"#94a3b8"}, grid:{display:false}}}}
          });
          new Chart(document.getElementById("chartMonthly"),{
            type:"bar",
            data:{ labels:["1주","2주","3주","4주"], datasets:[{
              label:"수익",
              data:[6500,7200,6800,8100],
              backgroundColor:"rgba(244,114,182,.65)",
              borderWidth:0
            }]},
            options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ color:"#94a3b8" }, grid:{ color:"rgba(148,163,184,.15)"}}, x:{ ticks:{ color:"#94a3b8"}, grid:{display:false}}}}
          });
          new Chart(document.getElementById("chartLangRevenue"),{
            type:"doughnut",
            data:{ labels:["KR","EN","JP","CN","FR"], datasets:[{
              data:[42,18,16,14,10],
              backgroundColor:["rgba(244,114,182,.85)","rgba(168,85,247,.75)","rgba(59,130,246,.75)","rgba(34,211,238,.65)","rgba(148,163,184,.55)"],
              borderWidth:0
            }]},
            options:{ responsive:true, plugins:{ legend:{ labels:{ color:"#94a3b8"} } } }
          });
        }catch(_e){}
      };
    </script>
  </body>
</html>
