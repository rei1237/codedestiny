<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보안</title>
    <link rel="stylesheet" href="../assets/admin.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body data-page="security">
    <div id="cdToast" class="cd-toast" aria-live="polite"></div>
    <div class="cd-shell">
      <aside class="cd-sidebar">
        <div class="cd-brand">
          <div class="flower" aria-hidden="true"><span style="font-size:18px;">🌸</span></div>
          <div style="display:flex; flex-direction:column;">
            <div style="font-weight:900;">Service Flower</div>
            <div style="color:var(--muted); font-size:12px;">Secure Portal</div>
          </div>
        </div>
        <nav class="cd-nav">
          <button type="button" data-cd-nav="dashboard"><span data-lucide="gauge" aria-hidden="true"></span>대시보드</button>
          <button type="button" data-cd-nav="content"><span data-lucide="sparkles" aria-hidden="true"></span>콘텐츠</button>
          <button type="button" data-cd-nav="members"><span data-lucide="users" aria-hidden="true"></span>회원</button>
          <button type="button" data-cd-nav="revenue"><span data-lucide="wallet" aria-hidden="true"></span>수익</button>
          <button type="button" data-cd-nav="security"><span data-lucide="shield" aria-hidden="true"></span>보안</button>
          <button type="button" data-cd-nav="settings"><span data-lucide="settings" aria-hidden="true"></span>설정</button>
        </nav>
      </aside>

      <main class="cd-main">
        <header class="cd-header">
          <div class="meta">
            <div class="time" id="cdClock"></div>
            <div class="who">접근자: <span id="cdWho">-</span></div>
          </div>
          <div class="actions">
            <button id="cdLogoutBtn" class="cd-btn ghost" type="button">로그아웃</button>
          </div>
        </header>

        <section class="cd-grid">
          <div class="cd-card" style="grid-column: span 12;">
            <h3>보안 모니터링</h3>
            <p class="sub">접근 시도 로그, 차단된 IP, 이상 접근 패턴을 확인합니다.</p>

            <div class="cd-hero-list">
              <div class="cd-list-item">
                <div class="k">최근 접근 시도</div>
                <div class="v" id="secRecent">-</div>
              </div>
              <div class="cd-list-item">
                <div class="k">차단 목록</div>
                <div class="v" id="secBlocked">-</div>
              </div>
              <div class="cd-list-item">
                <div class="k">이상 패턴</div>
                <div class="v" id="secAnomaly">-</div>
              </div>
            </div>

            <div style="margin-top:14px;">
              <h3 style="margin:0 0 10px;">이메일 알림 설정</h3>
              <div class="cd-inline-selects" style="grid-template-columns: 1fr 1fr; margin-top:8px;">
                <div>
                  <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">알림 사용</label>
                  <select id="emailEnable" class="cd-input">
                    <option value="true">사용</option>
                    <option value="false" selected>중지</option>
                  </select>
                </div>
                <div>
                  <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">수신 이메일</label>
                  <input id="emailTarget" class="cd-input" type="email" placeholder="admin@example.com" />
                </div>
              </div>
              <div class="cd-gen-actions">
                <button id="btnSaveEmail" class="cd-btn purple" type="button">저장</button>
              </div>
              <div class="cd-kasi-warn" style="margin-top:8px;">
                이메일 전송은 서버 설정(메일 SMTP)에 의해 동작합니다.
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./assets/admin.js"></script>
    <script type="module">
      import { apiSecuritySummary, apiEmailAlertsSettings } from "./api/security.js";

      window.__CD_ADMIN_PAGE_INIT__ = ({ showToast }) => {
        try{ window.lucide && window.lucide.createIcons(); }catch(_e){}

        async function load(){
          try{
            const res = await apiSecuritySummary();
            if(!res?.ok) return;
            const p = res.payload || {};
            document.getElementById("secRecent").textContent = p.recentAttempts ?? "-";
            document.getElementById("secBlocked").textContent = p.blockedIps ?? "-";
            document.getElementById("secAnomaly").textContent = p.anomalies ?? "-";
          }catch(_e){}
        }
        load();

        document.getElementById("btnSaveEmail").addEventListener("click", async () => {
          try{
            const enable = document.getElementById("emailEnable").value === "true";
            const email = document.getElementById("emailTarget").value.trim();
            const res = await apiEmailAlertsSettings({ enable, email });
            if(res?.ok){
              showToast("저장 완료");
            }else{
              showToast("저장 실패");
            }
          }catch(_e){
            showToast("요청을 처리할 수 없습니다.");
          }
        });
      };
    </script>
  </body>
</html>
