<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원</title>
    <link rel="stylesheet" href="./assets/admin.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .cd-table{ width:100%; border-collapse:collapse; }
      .cd-table th, .cd-table td{
        padding:10px 10px;
        border-bottom:1px solid rgba(148,163,184,.18);
        text-align:left;
        color:#e5e7eb;
        font-size:13px;
      }
      .cd-table th{
        color: rgba(148,163,184,.95);
        font-weight:900;
        font-size:12px;
        text-transform:uppercase;
        letter-spacing:.08em;
      }
      .cd-actions{ display:flex; gap:10px; flex-wrap:wrap; }
    </style>
  </head>
  <body data-page="members">
    <div id="cdToast" class="cd-toast" aria-live="polite"></div>
    <div class="cd-shell">
      <aside class="cd-sidebar">
        <div class="cd-brand">
          <div class="flower" aria-hidden="true"><span style="font-size:18px;">🌸</span></div>
          <div style="display:flex; flex-direction:column;">
            <div style="font-weight:900;">Service Flower</div>
            <div style="color:var(--muted); font-size:12px;">Secure Portal</div>
          </div>
        </div>
        <nav class="cd-nav">
          <button type="button" data-cd-nav="dashboard"><span data-lucide="gauge" aria-hidden="true"></span>대시보드</button>
          <button type="button" data-cd-nav="content"><span data-lucide="sparkles" aria-hidden="true"></span>콘텐츠</button>
          <button type="button" data-cd-nav="members"><span data-lucide="users" aria-hidden="true"></span>회원</button>
          <button type="button" data-cd-nav="revenue"><span data-lucide="wallet" aria-hidden="true"></span>수익</button>
          <button type="button" data-cd-nav="security"><span data-lucide="shield" aria-hidden="true"></span>보안</button>
          <button type="button" data-cd-nav="settings"><span data-lucide="settings" aria-hidden="true"></span>설정</button>
        </nav>
      </aside>

      <main class="cd-main">
        <header class="cd-header">
          <div class="meta">
            <div class="time" id="cdClock"></div>
            <div class="who">접근자: <span id="cdWho">-</span></div>
          </div>
          <div class="actions">
            <button id="cdLogoutBtn" class="cd-btn ghost" type="button">로그아웃</button>
          </div>
        </header>

        <section class="cd-grid">
          <div class="cd-card" style="grid-column: span 12;">
            <h3>회원 목록</h3>
            <p class="sub">검색/필터/삭제는 서버 정책에 따릅니다.</p>

            <div class="cd-inline-selects" style="grid-template-columns: 1fr 180px; gap:12px;">
              <div>
                <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">검색</label>
                <input id="memberSearch" class="cd-input" type="search" placeholder="이름 또는 이메일" />
              </div>
              <div style="display:flex; align-items:flex-end;">
                <button id="btnSearch" class="cd-btn purple" type="button" style="width:100%;">검색</button>
              </div>
            </div>

            <div style="margin-top:12px; color:var(--muted); font-size:12px;" id="memberMeta">-</div>

            <div style="overflow:auto; margin-top:12px;">
              <table class="cd-table" aria-label="회원 테이블">
                <thead>
                  <tr>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>가입일</th>
                    <th>생년월일</th>
                    <th>관리</th>
                  </tr>
                </thead>
                <tbody id="memberTbody">
                  <tr><td colspan="5" style="color:var(--muted); text-align:center; padding:18px 10px;">로딩 중...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./assets/admin.js"></script>
    <script type="module">
      import { apiUsersList } from "./api/members.js";

      window.__CD_ADMIN_PAGE_INIT__ = ({ showToast }) => {
        const tbody = document.getElementById("memberTbody");
        const meta = document.getElementById("memberMeta");
        const searchEl = document.getElementById("memberSearch");
        const btnSearch = document.getElementById("btnSearch");

        function formatDate(v){
          if(!v) return "-";
          const d = new Date(v);
          if(Number.isNaN(d.getTime())) return String(v);
          return d.toLocaleDateString("ko-KR");
        }

        async function load(){
          tbody.innerHTML = `<tr><td colspan="5" style="color:var(--muted); text-align:center; padding:18px 10px;">로딩 중...</td></tr>`;
          const search = (searchEl.value || "").trim();
          const res = await apiUsersList({ search });
          if(!res?.ok){
            meta.textContent = "불러오기에 실패했습니다.";
            tbody.innerHTML = `<tr><td colspan="5" style="color:var(--muted); text-align:center; padding:18px 10px;">오류</td></tr>`;
            return;
          }
          const users = Array.isArray(res.payload?.users) ? res.payload.users : [];
          const totalCount = res.payload?.totalCount ?? users.length;
          const count = res.payload?.count ?? users.length;
          meta.textContent = `총 ${totalCount}명 · 결과 ${count}명`;
          tbody.innerHTML = users.map((u) => `
            <tr>
              <td>${u.name || "-"}</td>
              <td>${u.email || "-"}</td>
              <td>${formatDate(u.joinedAt)}</td>
              <td>${formatDate(u.birthDate)}</td>
              <td>
                <div class="cd-actions">
                  <button type="button" class="cd-btn ghost" data-del="${u._id}" style="padding:8px 10px;">삭제</button>
                </div>
              </td>
            </tr>
          `).join("");

          tbody.querySelectorAll("[data-del]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const userId = btn.getAttribute("data-del") || "";
              if(!userId) return;
              const ok = window.confirm("삭제하시겠습니까?");
              if(!ok) return;
              try{
                const res2 = await fetch(`/api/admin/users/${encodeURIComponent(userId)}`, {
                  method: "DELETE",
                  credentials: "include"
                });
                if(!res2.ok){
                  showToast("삭제 실패");
                  return;
                }
                await load();
                showToast("삭제 완료");
              }catch(_e){
                showToast("요청을 처리할 수 없습니다.");
              }
            });
          });
        }

        btnSearch.addEventListener("click", load);
        load();
      };
    </script>
  </body>
</html>
