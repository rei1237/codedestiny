<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원</title>
    <link rel="stylesheet" href="../assets/admin.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .cd-table{ width:100%; border-collapse:collapse; }
      .cd-table th, .cd-table td{
        padding:10px 10px;
        border-bottom:1px solid rgba(148,163,184,.18);
        text-align:left;
        color:#e5e7eb;
        font-size:13px;
      }
      .cd-table th{
        color: rgba(148,163,184,.95);
        font-weight:900;
        font-size:12px;
        text-transform:uppercase;
        letter-spacing:.08em;
      }
      .cd-actions{ display:flex; gap:10px; flex-wrap:wrap; }
      /* 코인 지급 모달 */
      .coin-modal-backdrop{
        display:none; position:fixed; inset:0; z-index:200;
        background:rgba(0,0,0,.72); backdrop-filter:blur(4px);
        align-items:center; justify-content:center; padding:16px;
      }
      .coin-modal-backdrop.is-open{ display:flex; }
      .coin-modal{
        width:100%; max-width:360px; border-radius:18px;
        border:1px solid rgba(251,191,36,.35); background:#0a0a18;
        padding:24px; box-shadow:0 0 0 1px rgba(251,191,36,.18),0 24px 56px rgba(0,0,0,.75);
      }
      .coin-modal h2{ font-size:17px; font-weight:800; color:#fbbf24; margin:0 0 4px; }
      .coin-modal .coin-meta{ font-size:12.5px; color:#94a3b8; margin-bottom:14px; line-height:1.6; }
      .coin-modal label{ display:block; font-size:11.5px; font-weight:700; color:#cbd5e1; margin-bottom:6px; }
      .coin-modal input{ width:100%; box-sizing:border-box; background:#0f172a; border:1px solid rgba(251,191,36,.3);
        border-radius:10px; padding:9px 12px; font-size:13px; color:#f1f5f9; outline:none; margin-bottom:12px; }
      .coin-modal input:focus{ border-color:rgba(251,191,36,.65); }
      .coin-modal-error{ background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3);
        border-radius:8px; padding:7px 10px; font-size:12px; color:#fca5a5; margin-bottom:12px; }
      .coin-modal-actions{ display:flex; gap:10px; margin-top:4px; }
      .coin-modal-actions .cd-btn{ flex:1; }
    </style>
  </head>
  <body data-page="members">
    <div id="cdToast" class="cd-toast" aria-live="polite"></div>
    <div class="cd-shell">
      <aside class="cd-sidebar">
        <div class="cd-brand">
          <div class="flower" aria-hidden="true"><span style="font-size:18px;">🌸</span></div>
          <div style="display:flex; flex-direction:column;">
            <div style="font-weight:900;">Service Flower</div>
            <div style="color:var(--muted); font-size:12px;">Secure Portal</div>
          </div>
        </div>
        <nav class="cd-nav">
          <button type="button" data-cd-nav="dashboard"><span data-lucide="gauge" aria-hidden="true"></span>대시보드</button>
          <button type="button" data-cd-nav="content"><span data-lucide="sparkles" aria-hidden="true"></span>콘텐츠</button>
          <button type="button" data-cd-nav="members"><span data-lucide="users" aria-hidden="true"></span>회원</button>
          <button type="button" data-cd-nav="revenue"><span data-lucide="wallet" aria-hidden="true"></span>수익</button>
          <button type="button" data-cd-nav="security"><span data-lucide="shield" aria-hidden="true"></span>보안</button>
          <button type="button" data-cd-nav="settings"><span data-lucide="settings" aria-hidden="true"></span>설정</button>
        </nav>
      </aside>

      <main class="cd-main">
        <header class="cd-header">
          <div class="meta">
            <div class="time" id="cdClock"></div>
            <div class="who">접근자: <span id="cdWho">-</span></div>
          </div>
          <div class="actions">
            <button id="cdLogoutBtn" class="cd-btn ghost" type="button">로그아웃</button>
          </div>
        </header>

        <section class="cd-grid">
          <div class="cd-card" style="grid-column: span 12;">
            <h3>회원 목록</h3>
            <p class="sub">검색/필터/삭제는 서버 정책에 따릅니다.</p>

            <div class="cd-inline-selects" style="grid-template-columns: 1fr 180px; gap:12px;">
              <div>
                <label class="cd-small" style="display:block; margin-bottom:8px; font-weight:900; color:#e5e7eb;">검색</label>
                <input id="memberSearch" class="cd-input" type="search" placeholder="이름 또는 이메일" />
              </div>
              <div style="display:flex; align-items:flex-end;">
                <button id="btnSearch" class="cd-btn purple" type="button" style="width:100%;">검색</button>
              </div>
            </div>

            <div style="margin-top:12px; color:var(--muted); font-size:12px;" id="memberMeta">-</div>

            <div style="overflow:auto; margin-top:12px;">
              <table class="cd-table" aria-label="회원 테이블">
                <thead>
                  <tr>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>가입일</th>
                    <th>생년월일</th>
                    <th>🐷 코인</th>
                    <th>관리</th>
                  </tr>
                </thead>
                <tbody id="memberTbody">
                  <tr><td colspan="6" style="color:var(--muted); text-align:center; padding:18px 10px;">로딩 중...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- 꽃꽃돼지 코인 지급 모달 -->
    <div id="coinModal" class="coin-modal-backdrop" role="dialog" aria-modal="true" aria-label="꽃꽃돼지 코인 지급">
      <div class="coin-modal">
        <h2>🐷 꽃꽃돼지 코인 지급</h2>
        <div class="coin-meta" id="coinModalMeta">-</div>
        <label>코인 수량 <span style="color:#64748b;">(음수 입력 시 차감)</span></label>
        <input id="coinAmount" type="number" placeholder="예: 100 (지급) 또는 -50 (차감)" />
        <label>지급 사유</label>
        <input id="coinReason" type="text" value="관리자 꽃꽃돼지 코인 지급" />
        <div id="coinModalError" class="coin-modal-error" style="display:none;"></div>
        <div class="coin-modal-actions">
          <button id="coinModalConfirm" type="button" class="cd-btn" style="background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.5);color:#fde68a;">🐷 지급</button>
          <button id="coinModalCancel" type="button" class="cd-btn ghost">취소</button>
        </div>
      </div>
    </div>

    <script type="module" src="./assets/admin.js"></script>
    <script type="module">
      import { apiUsersList, apiAdjustPoints, apiDeleteUser } from "./api/members.js";

      // 코인 모달 상태
      let _coinTargetUser = null;

      const coinModal = document.getElementById("coinModal");
      const coinModalMeta = document.getElementById("coinModalMeta");
      const coinAmount = document.getElementById("coinAmount");
      const coinReason = document.getElementById("coinReason");
      const coinModalError = document.getElementById("coinModalError");
      const coinModalConfirm = document.getElementById("coinModalConfirm");
      const coinModalCancel = document.getElementById("coinModalCancel");

      function openCoinModal(user) {
        _coinTargetUser = user;
        coinModalMeta.innerHTML = `<strong style="color:#f1f5f9;">${user.name}</strong> <span style="color:#64748b;">(${user.email})</span><br>현재 잔액: <strong style="color:#fbbf24;">${Number(user.points||0).toLocaleString("ko-KR")} 코인</strong>`;
        coinAmount.value = "";
        coinReason.value = "관리자 꽃꽃돼지 코인 지급";
        coinModalError.style.display = "none";
        coinModalError.textContent = "";
        coinModal.classList.add("is-open");
        coinAmount.focus();
      }

      function closeCoinModal() {
        _coinTargetUser = null;
        coinModal.classList.remove("is-open");
      }

      coinModalCancel.addEventListener("click", closeCoinModal);
      coinModal.addEventListener("click", (e) => { if (e.target === coinModal) closeCoinModal(); });

      coinModalConfirm.addEventListener("click", async () => {
        if (!_coinTargetUser) return;
        const delta = Number(coinAmount.value);
        if (!Number.isFinite(delta) || delta === 0) {
          coinModalError.textContent = "유효한 코인 수량을 입력해 주세요.";
          coinModalError.style.display = "block";
          return;
        }
        const reason = (coinReason.value || "관리자 꽃꽃돼지 코인 지급").trim();
        coinModalConfirm.disabled = true;
        coinModalConfirm.textContent = "처리 중...";
        coinModalError.style.display = "none";
        try {
          const res = await apiAdjustPoints({ userId: _coinTargetUser._id, delta, reason });
          if (!res.ok) {
            coinModalError.textContent = res.payload?.message || "코인 지급에 실패했습니다.";
            coinModalError.style.display = "block";
            return;
          }
          closeCoinModal();
          showToast(`🐷 ${delta > 0 ? "+" : ""}${delta.toLocaleString("ko-KR")} 코인 반영 완료`);
          await load();
        } catch(_e) {
          coinModalError.textContent = "요청 중 오류가 발생했습니다.";
          coinModalError.style.display = "block";
        } finally {
          coinModalConfirm.disabled = false;
          coinModalConfirm.textContent = "🐷 지급";
        }
      });

      window.__CD_ADMIN_PAGE_INIT__ = ({ showToast }) => {
        const tbody = document.getElementById("memberTbody");
        const meta = document.getElementById("memberMeta");
        const searchEl = document.getElementById("memberSearch");
        const btnSearch = document.getElementById("btnSearch");

        function formatDate(v){
          if(!v) return "-";
          const d = new Date(v);
          if(Number.isNaN(d.getTime())) return String(v);
          return d.toLocaleDateString("ko-KR");
        }

        async function load(){
          tbody.innerHTML = `<tr><td colspan="6" style="color:var(--muted); text-align:center; padding:18px 10px;">로딩 중...</td></tr>`;
          const search = (searchEl.value || "").trim();
          const res = await apiUsersList({ search });
          if(!res?.ok){
            meta.textContent = "불러오기에 실패했습니다.";
            tbody.innerHTML = `<tr><td colspan="6" style="color:var(--muted); text-align:center; padding:18px 10px;">오류</td></tr>`;
            return;
          }
          const users = Array.isArray(res.payload?.users) ? res.payload.users : [];
          const totalCount = res.payload?.totalCount ?? users.length;
          const count = res.payload?.count ?? users.length;
          meta.textContent = `총 ${totalCount}명 · 결과 ${count}명`;
          tbody.innerHTML = users.map((u) => `
            <tr>
              <td>${u.name || "-"}</td>
              <td>${u.email || "-"}</td>
              <td>${formatDate(u.joinedAt)}</td>
              <td>${formatDate(u.birthDate)}</td>
              <td style="font-weight:700; color:#fbbf24;">${Number(u.points||0).toLocaleString("ko-KR")}</td>
              <td>
                <div class="cd-actions">
                  <button type="button" class="cd-btn" data-coin='${JSON.stringify({_id:u._id,name:u.name,email:u.email,points:u.points||0})}' style="padding:8px 10px;background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.45);color:#fde68a;">🐷 코인</button>
                  <button type="button" class="cd-btn ghost" data-del="${u._id}" style="padding:8px 10px;">삭제</button>
                </div>
              </td>
            </tr>
          `).join("");

          tbody.querySelectorAll("[data-coin]").forEach((btn) => {
            btn.addEventListener("click", () => {
              try {
                const user = JSON.parse(btn.getAttribute("data-coin") || "{}");
                openCoinModal(user);
              } catch(_e) {}
            });
          });

          tbody.querySelectorAll("[data-del]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const userId = btn.getAttribute("data-del") || "";
              if(!userId) return;
              const ok = window.confirm("삭제하시겠습니까?");
              if(!ok) return;
              try{
                const res2 = await apiDeleteUser(userId);
                if(!res2.ok){
                  showToast("삭제 실패: " + (res2.payload?.message || "오류"));
                  return;
                }
                await load();
                showToast("삭제 완료");
              }catch(_e){
                showToast("요청을 처리할 수 없습니다.");
              }
            });
          });
        }

        btnSearch.addEventListener("click", load);
        load();
      };
    </script>
  </body>
</html>
