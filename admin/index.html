<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404</title>
    <style>
      /* 위장용 404 페이지
         - 관리자 기능/경로를 외부에 노출하지 않기 위한 목적
         - "admin", "관리자" 같은 단어를 최대한 화면에 표시하지 않음
      */
      :root{
        --bg:#0a0a0f;
        --txt:#ffffff;
        --muted:#94a3b8;
        --pink:#f472b6;
      }
      body{
        margin:0;
        background:radial-gradient(circle at 20% 10%, rgba(244,114,182,.18), transparent 35%),
                   radial-gradient(circle at 70% 20%, rgba(168,85,247,.20), transparent 40%),
                   var(--bg);
        color:var(--txt);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
      }
      .card{
        width:min(720px, 100%);
        border:1px solid rgba(148,163,184,.25);
        background:rgba(2,6,23,.55);
        backdrop-filter: blur(10px);
        border-radius:18px;
        padding:28px;
        box-shadow: 0 20px 60px rgba(0,0,0,.35);
      }
      .title{
        display:flex;
        align-items:center;
        gap:12px;
        margin-bottom:8px;
      }
      .dot{
        width:14px;height:14px;border-radius:999px;background:var(--pink);
        box-shadow: 0 0 0 6px rgba(244,114,182,.18);
      }
      h1{
        margin:0;
        font-size:28px;
        letter-spacing:-0.02em;
      }
      p{
        margin:10px 0 0;
        color:var(--muted);
        line-height:1.6;
      }
      .actions{
        margin-top:18px;
        display:flex;
        gap:12px;
        flex-wrap:wrap;
      }
      a, button{
        appearance:none;
        border:1px solid rgba(244,114,182,.35);
        background: rgba(244,114,182,.10);
        color:var(--txt);
        padding:10px 14px;
        border-radius:12px;
        text-decoration:none;
        cursor:pointer;
      }
      .ghost{
        border-color: rgba(148,163,184,.35);
        background: rgba(148,163,184,.08);
      }
    </style>
  </head>
  <body>
    <div class="card" role="main">
      <div class="title">
        <span class="dot" aria-hidden="true"></span>
        <h1>페이지를 찾을 수 없습니다.</h1>
      </div>
      <p>
        요청하신 경로는 존재하지 않거나 처리할 수 없습니다.
        <br />잠시 후 다시 시도해 주세요.
      </p>
      <div class="actions">
        <a href="/" class="ghost">홈으로</a>
        <button type="button" onclick="history.back()">뒤로 가기</button>
      </div>
    </div>
  </body>
</html>
