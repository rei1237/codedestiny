@font-face{font-family:FishDisplay;src:url('/assets/destiny-bias/fonts/big-shoulders-display-latin-800.woff2') format('woff2');font-weight:800;font-display:swap}
:root{color-scheme:light;--paper:#fff8e9;--ink:#173e43;--coral:#b83b28;--water:#d7ebe7;--muted:#4c6968;--line:#a9c4bc}

body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;gap:16px}

main{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center;min-height:650px}
.intro{align-self:start;padding-top:110px}

.experience{text-align:center;padding:28px 0}
.pond{position:relative;isolation:isolate;width:100%;aspect-ratio:1.1;border:1px solid var(--line);border-radius:48% 48% 44% 44%;background:var(--water);overflow:hidden;display:grid;place-items:center}
.pond::before,.pond::after{content:'';position:absolute;border:1px solid #91b8b0;border-radius:50%;width:76%;height:25%;bottom:14%;z-index:-1}

.fish-sprite{width:100%;height:100%;background-image:url('/assets/fortune-fish/coral-fish-sprite-v1.png');background-size:400% 400%;background-position:0 0;animation:swim 1s steps(1,end) infinite}
.pond[data-motion='lift'] .fish-sprite{background-position-y:33.333333%;animation-duration:1.3s}
.pond[data-motion='curl'] .fish-sprite{background-position-y:66.666667%;animation-duration:1.4s}
.pond[data-motion='rest'] .fish-sprite{background-position-y:100%;animation-duration:2s}
.pond[data-motion='rest'] .fish-drift{animation-duration:9s}
.pond[data-motion='curl'] .fish-drift{animation:turn 4s ease-in-out infinite}
.pond[data-motion='lift'] .fish-drift{animation:lift 3s ease-in-out infinite}
@keyframes swim{0%,100%{background-position-x:0}25%{background-position-x:33.333333%}50%{background-position-x:66.666667%}75%{background-position-x:100%}}
@keyframes drift{0%,100%{transform:translate(-4%,0) rotate(-3deg)}50%{transform:translate(4%,-3%) rotate(3deg)}}
@keyframes turn{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(10deg) translateY(-3%)}}
@keyframes lift{0%,100%{transform:rotate(-7deg)}50%{transform:translateY(-7%) rotate(-13deg)}}
.motion-caption{position:absolute;bottom:20px;left:12px;right:12px;font-size:13px;color:var(--ink);margin:0;font-weight:650}
.stage-note{min-height:26px;margin:20px 0 14px;font-size:14px;color:var(--muted)}

.primary:hover:not(:disabled){background:#245960}
.primary:disabled{cursor:wait;opacity:.7}
.motion-toggle{display:block;margin:12px auto 0;border:0;background:transparent;color:var(--muted);font-size:13px;min-height:44px;text-decoration:underline;text-underline-offset:4px;padding:8px 18px}
.paused .fish-drift,.paused .fish-sprite{animation-play-state:paused}
.reading{margin-top:24px;text-align:left;border-top:1px solid var(--line);padding-top:22px}
.reading h2{font-size:25px;line-height:1.4;letter-spacing:-.04em;margin:0 0 12px;word-break:keep-all}

.footnote{border-top:1px solid var(--line);padding-top:18px;display:flex;gap:20px;justify-content:space-between;font-size:12px;color:var(--muted)}

@media(max-width:700px){.shell{padding:14px 24px max(24px,env(safe-area-inset-bottom))}.topbar{padding-bottom:10px}main{display:block;min-height:0}.intro{padding-top:30px;text-align:center}h1{font-size:78px;line-height:.9;margin-bottom:18px}h1 span{display:inline}h1 br{display:none}.intro-title{font-size:19px;margin-bottom:8px}.intro-copy{font-size:14px;margin:auto;max-width:300px}.experience{padding:20px 0 28px;max-width:450px;margin:auto}.pond{max-height:340px;aspect-ratio:1.18}.fish-drift{width:72%}.motion-caption{bottom:14px;font-size:12px}.stage-note{margin-top:16px}.footnote{display:block}.footnote p+p{margin-top:8px}}
@media(prefers-reduced-motion:reduce){.fish-drift,.fish-sprite{animation:none!important}.primary{transition:none}}
</style>

<script>
(() => {
  'use strict';
  // One character, four sprite rows. Each row is a four-frame loop.
  const readings = [
    { motion:'swim', observation:'꼬리를 힘차게 흔들며 앞으로 헤엄쳐요', title:'작은 시작이 흐름을 만들어요', body:"앞으로 나아가는 몸짓은 작은 시작이 만들어 내는 흐름을 상징해요. 지금 떠올린 일에 이 움직임을 비춰 보면, 모든 조건이 갖춰지기를 기다리기보다 손에 잡히는 부분부터 움직여 보라는 힌트로 읽을 수 있어요. 시작이 작다고 그 의미까지 작은 것은 아니에요.\n\n마음속에서는 기대와 망설임이 함께 움직일 수 있어요. 해보고 싶은 마음은 분명한데, 잘하지 못할까 봐 준비만 길어지고 있지는 않은지 살펴보세요. 꼼꼼함은 당신을 지켜 주는 힘이지만, 첫걸음까지 막아 버리면 스스로의 가능성을 확인할 기회도 줄어들어요.\n\n관계에서는 멋진 표현보다 편안한 안부 한마디가 대화의 문을 열어 줄 수 있어요. 다만 내가 용기를 냈다고 상대도 같은 속도로 답해야 하는 것은 아니에요. 먼저 마음을 표현하되, 그 뒤에는 상대가 반응할 여유를 남겨 주세요.\n\n일이나 공부에서는 계획 전체를 완성하려 하기보다 가장 작은 한 조각을 끝내 보세요. 자료 한 쪽을 읽거나, 초안의 첫 문장을 쓰거나, 정리할 것 세 가지만 고르는 식이면 충분해요. 지출이 필요한 계획이라면 설렘과 필요를 구분하고, 이미 가진 것으로 시작할 방법부터 찾아보세요.\n\n오늘의 포인트는 많이 하는 것이 아니라 한 번 움직여 보는 거예요. 작은 시도 뒤에 무엇이 쉬웠고 무엇이 어려웠는지 확인하면 다음 선택이 구체적으로 보일 수 있어요. 물고기가 한 번의 꼬리짓으로 조금씩 나아가듯, 당신에게도 오늘 할 수 있는 만큼의 전진이 있어요.", action:'오늘의 한 걸음 · 미뤄 둔 일 하나를 10분만 시작해 보세요.' },
    { motion:'lift', observation:'고개를 들고 지느러미를 활짝 펼쳐요', title:'마음이 향하는 쪽을 살펴봐요', body:"고개를 들고 지느러미를 펼치는 몸짓은 관심과 발견을 상징해요. 지금 마음에 둔 일을 이 장면에 비춰 보면, 서둘러 답을 정하기보다 무엇이 자꾸 눈길을 끄는지 살펴보라는 힌트로 읽을 수 있어요. 익숙한 하루 속에서도 내 마음이 반응하는 지점은 조금씩 달라질 수 있으니까요.\n\n이 움직임은 주변의 신호만큼 자신의 반응도 살펴보게 해요. 누군가의 말에 유난히 기뻤거나 작은 일에도 마음이 쓰였다면, 그 안에 내가 바라는 인정이나 필요한 배려가 숨어 있을 수 있어요. 감정을 곧바로 옳고 그름으로 판단하기보다, 왜 그랬는지 한 번 더 물어보세요.\n\n관계에서는 추측을 늘리는 것보다 다정한 질문 하나가 도움이 될 수 있어요. 상대가 조용하다는 이유만으로 마음이 멀어졌다고 단정하지 말고, 요즘 어떻게 지내는지 편하게 확인해 보세요. 대답을 끌어내려 하기보다 듣고 이해할 자리를 만드는 것이 중요해요.\n\n일이나 공부에서는 평소 지나쳤던 설명, 작은 피드백, 반복되는 불편함에 실마리가 있을 수 있어요. 새로운 것을 발견했다고 바로 계획을 바꿀 필요는 없어요. 흥미로운 점을 적어 두고 현재 목표와 맞는지 비교해 보세요. 갖고 싶은 물건도 내 생활에서 어떤 역할을 할지 먼저 생각하면 선택이 또렷해져요.\n\n오늘은 정답을 빨리 찾는 날이라기보다 나에게 맞는 질문을 고르는 날로 삼아 보세요. 무엇이 좋았는지, 어떤 순간에 편안했는지 알아차리는 것만으로도 충분한 발견이에요. 작은 물고기가 고개를 들듯, 당신의 시선도 조금 더 넓어질 여지가 있어요.", action:'오늘의 한 걸음 · 궁금했던 것을 하나 물어보세요.' },
    { motion:'curl', observation:'몸을 둥글게 말며 방향을 바꿔요', title:'조금 다르게 가도 괜찮아요', body:"몸을 둥글게 말아 방향을 바꾸는 움직임은 돌아봄과 조정을 상징해요. 지금 떠올린 일이 뜻대로 풀리지 않는다면, 같은 방향으로 더 힘을 쓰기보다 접근 방식을 살짝 바꿔 보라는 힌트로 읽을 수 있어요. 방향을 고치는 일은 처음의 선택을 부정하는 것과는 달라요.\n\n이미 들인 시간이나 마음이 클수록 멈추기가 어렵게 느껴질 수 있어요. 조금만 더 하면 괜찮아질 것이라는 기대가 나를 버티게 하기도 하지만, 때로는 지금의 필요를 놓치게 만들기도 해요. 끝까지 지키고 싶은 핵심과 바꿔도 괜찮은 방법을 나누어 보세요.\n\n관계에서는 같은 서운함을 반복해서 설명하고 있지는 않은지 돌아볼 만해요. 상대를 설득하는 말을 더하기 전에, 내가 바라는 행동이 무엇인지 구체적으로 정리해 보세요. 대화가 자꾸 엇갈린다면 잠시 쉬었다가 다시 이야기하는 것도 하나의 선택이에요. 거리 조절이 곧 관계의 끝을 뜻하지는 않아요.\n\n일이나 공부에서는 목표 자체보다 분량, 순서, 마감이 나와 맞지 않았을 수 있어요. 하루에 할 일을 줄이거나 어려운 부분을 먼저 질문하는 식으로 방법을 바꿔 보세요. 지출이나 약속 역시 이미 시작했다는 이유만으로 늘리기보다, 앞으로 감당할 수 있는 범위를 기준으로 점검하는 편이 좋아요.\n\n오늘의 변화는 거창한 결심보다 작은 수정에서 시작할 수 있어요. 계획 하나를 덜어 내고 그 자리에 숨 쉴 여유를 남겨 보세요. 물고기가 몸을 돌려 다른 길을 찾듯, 당신도 지금의 경험을 가지고 조금 더 편안한 방향을 고를 수 있어요.", action:'오늘의 한 걸음 · 붙잡고 있던 계획 하나를 가볍게 조정해 보세요.' },
    { motion:'rest', observation:'눈을 감고 지느러미만 조용히 움직여요', title:'쉬어 가는 것도 당신의 속도예요', body:"눈을 감고 지느러미만 조용히 움직이는 모습은 여백과 회복을 상징해요. 지금 떠올린 고민에 이 장면을 비춰 보면, 바로 결론을 내리기보다 잠시 속도를 낮추고 현재의 상태를 살펴보라는 힌트로 읽을 수 있어요. 겉으로 큰 움직임이 없다고 아무 일도 일어나지 않는 것은 아니에요.\n\n해야 할 일이 많을 때는 쉬는 순간에도 마음이 분주할 수 있어요. 남들은 앞서가는 것 같고, 내가 멈추면 기회를 놓칠 것처럼 느껴질 수도 있죠. 그럴수록 오늘 꼭 필요한 일과 막연한 불안 때문에 붙잡고 있는 일을 구분해 보세요. 모든 일을 같은 무게로 짊어질 필요는 없어요.\n\n관계에서는 대화를 더 이어 가는 것보다 서로의 여유를 지켜 주는 편이 도움이 될 때가 있어요. 답장이 늦거나 말수가 적은 모습을 곧바로 거절로 해석하지 않아도 괜찮아요. 당신에게도 혼자 정리할 시간이 필요하다면, 무리해서 맞추기보다 지금의 상태를 부드럽게 알려 주세요.\n\n일이나 공부에서는 새로운 일을 벌이기보다 진행 중인 것의 마무리와 점검에 집중해 보세요. 빠뜨린 내용을 확인하고 다음에 할 일을 적어 두면 쉬는 동안의 부담을 덜 수 있어요. 소비도 마음이 지쳐 있을 때 바로 결정하기보다, 잠깐 시간을 두고 여전히 필요한지 살펴보세요.\n\n오늘의 쉼은 내일 더 많이 해내기 위한 의무가 아니에요. 지금의 나를 돌보는 시간 자체로 의미가 있어요. 작은 물고기가 물결에 몸을 맡기듯, 잠깐 어깨의 힘을 풀어 보세요. 충분히 숨을 고른 뒤에 다음 움직임을 골라도 늦지 않아요.", action:'오늘의 한 걸음 · 알림을 내려놓고 잠깐 쉬어 보세요.' }
  ];
  const byId = id => document.getElementById(id);
  const pond = byId('pond');
  const button = byId('read-button');
  const status = byId('status');
  const toggle = byId('motion-toggle');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let busy = false;
  let assetReady = false;
  let timer;
  let paused = reducedMotion.matches;
  function updateMotionControl() {
    pond.classList.toggle('paused', paused || reducedMotion.matches);
    toggle.hidden = reducedMotion.matches;
    toggle.setAttribute('aria-pressed', String(paused));
    toggle.textContent = paused ? '움직임 다시 보기' : '움직임 잠시 멈추기';
  }
  updateMotionControl();
  reducedMotion.addEventListener('change', updateMotionControl);
  toggle.addEventListener('click', () => { paused = !paused; updateMotionControl(); });
  const sprite = new Image();
  function loadSprite() {
    button.disabled = true;
    sprite.src = '/assets/fortune-fish/coral-fish-sprite-v1.png';
  }
  sprite.onload = () => {
    assetReady = true;
    button.disabled = false;
    button.textContent = '물고기의 움직임 읽기';
    status.textContent = '잠깐, 물고기와 눈을 맞춰 보세요.';
  };
  sprite.onerror = () => {
    assetReady = false;
    button.disabled = false;
    button.textContent = '물고기 다시 불러오기';
    status.textContent = '물고기를 불러오지 못했어요. 다시 시도해 주세요.';
  };
  button.addEventListener('click', () => {
    if (!assetReady) { loadSprite(); return; }
    if (busy) return;
    busy = true;
    button.disabled = true;
    button.textContent = '물고기를 바라보는 중';
    byId('reading').hidden = true;
    const reading = readings[Math.floor(Math.random() * readings.length)];
    pond.dataset.motion = reading.motion;
    byId('motion-caption').textContent = reading.observation;
    byId('fish').setAttribute('aria-label', '코랄색 금붕어가 ' + reading.observation);
    status.textContent = '물고기가 어떤 몸짓을 보여주는지 살펴보세요.';
    timer = window.setTimeout(() => {
      byId('reading-title').textContent = reading.title;
      byId('reading-body').textContent = reading.body;
      byId('reading-action').textContent = reading.action;
      byId('reading').hidden = false;
      status.textContent = '이 움직임이 전하는 오늘의 힌트예요.';
      button.textContent = '한 번 더 바라보기';
      button.disabled = false;
      busy = false;
    }, reducedMotion.matches ? 150 : 2400);
  });
  window.addEventListener('pagehide', () => {
    window.clearTimeout(timer);
    if (busy) {
      busy = false;
      button.disabled = false;
      button.textContent = '물고기의 움직임 읽기';
      status.textContent = '준비되면 물고기를 다시 바라보세요.';
    }
  });
  loadSprite();
})();
</script>
