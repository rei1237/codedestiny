<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>베다 점성술 — 별들의 지도</title>
<script src="/js/core/pass-verdict.js?v=build-ce0e961efebc"></script>
<script src="/js/core/checkout-entry.js?v=build-ce0e961efebc"></script>
<script src="/js/core/payment-service.js?v=build-payment-service-v1"></script>
<script src="/js/destiny-profile.js?v=build-8a7f8c83af92"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" onerror="this.remove()">
<style>
/* ── 오프라인 폴백 폰트 스택 ─────────────────────────────
   Cinzel 폰트가 없으면 Georgia → Times New Roman → serif 순으로 대체
   한글은 Apple SD Gothic Neo → Malgun Gothic → NanumGothic → 시스템 기본 */
/* 온라인이면 Google Fonts 로드, 오프라인이면 아래 --font-display/--font-body 폴백 사용 */

:root {
  --font-display: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
  --font-body: 'Pretendard Variable', Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'NanumGothic', '나눔고딕', '맑은 고딕', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#D4AF37;--gold2:#F5D06A;--purple:#7C3AED;--purple2:#A78BFA;--cyan:#06B6D4;--pink:#EC4899;
  --red:#FF4444;--green:#22C55E;--orange:#F59E0B;
  /* "심연의 우주" 네뷸라 베이스 */
  --bg:#030208;--bg2:#0b0824;--bg3:#1a0b33; /* black → indigo-950 → purple-900 */
  --neb1:rgba(124,58,237,0.18);
  --neb2:rgba(30,64,175,0.18);
  --neb3:rgba(236,72,153,0.10);
  /* Glassmorphism */
  --glass:rgba(255,255,255,0.085);--glassdark:rgba(0,0,0,0.3);
  --border:rgba(139,92,246,0.25);--bordergold:rgba(212,175,55,0.3);
  --text:#F0E8FF;--text2:rgba(240,232,255,0.65);--text3:rgba(240,232,255,0.4);
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(1100px 650px at 12% 18%, var(--neb2), transparent 60%),
    radial-gradient(900px 520px at 82% 22%, var(--neb1), transparent 62%),
    radial-gradient(720px 520px at 70% 86%, var(--neb3), transparent 60%),
    linear-gradient(180deg, var(--bg3) 0%, var(--bg2) 35%, var(--bg) 100%);
  color:var(--text);
  font-size:14px;
  line-height:1.6;
}
body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  z-index:-2;
  background:
    radial-gradient(1200px 700px at 50% 10%, rgba(255,255,255,0.06), transparent 60%),
    radial-gradient(900px 520px at 20% 70%, rgba(255,255,255,0.035), transparent 62%),
    radial-gradient(760px 460px at 85% 78%, rgba(255,255,255,0.03), transparent 62%);
  filter:blur(0.5px);
}
body::after{
  content:"";
  position:fixed;inset:-40px;
  pointer-events:none;
  z-index:-1;
  background:
    radial-gradient(closest-side at 50% 50%, transparent 68%, rgba(0,0,0,0.55) 100%);
}
h1,h2,h3,.cinzel{font-family:var(--font-display);letter-spacing:0.05em}
input,select,textarea{
  background:rgba(255,255,255,0.06);border:1px solid rgba(139,92,246,0.35);border-radius:10px;
  padding:10px 14px;color:#fff;font-size:14px;outline:none;width:100%;
  font-family:var(--font-body);transition:border-color 0.2s;
}
input:focus,select:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(167,139,250,0.15)}
select option{background:#1a0040;color:#fff}
input::placeholder{color:var(--text3)}
label{
  font-size:12px;
  color:rgba(240,232,255,0.78);
  margin-bottom:6px;
  display:block;
  font-weight:600;
  letter-spacing:0.02em;
}
button{cursor:pointer;font-family:var(--font-body);border:none;outline:none}
.btn-primary{
  background:linear-gradient(135deg,var(--purple) 0%,#4C1D95 60%,#3B0764 100%);color:#fff;
  padding:13px 24px;border-radius:14px;font-size:14px;font-weight:700;
  border:1px solid rgba(167,139,250,0.4);transition:all 0.25s cubic-bezier(.22,1,.36,1);width:100%;
  text-align:center;position:relative;overflow:hidden;letter-spacing:.02em;
}
.btn-primary::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.12) 50%,transparent 100%);
  transform:translateX(-100%);transition:transform .5s;
}
.btn-primary:hover::before{transform:translateX(100%)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,0.4),0 0 0 1px rgba(212,175,55,0.2),0 0 30px rgba(167,139,250,0.2)}
.btn-primary:active{transform:scale(0.97)}
.btn-sm{padding:7px 16px;border-radius:8px;font-size:12px;background:rgba(139,92,246,0.2);color:var(--purple2);border:1px solid var(--border);transition:all 0.2s}
.btn-sm:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(0,0,0,0.3),0 0 18px rgba(245,208,106,0.12);border-color:rgba(245,208,106,0.22)}
.btn-sm:active{transform:scale(0.95)}
.glass{
  background:var(--glass);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(245,208,106,0.22);
  border-radius:16px;
  box-shadow:0 18px 60px rgba(0,0,0,0.34),inset 0 1px 0 rgba(255,255,255,0.06);
  position:relative;overflow:hidden;
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(600px 300px at 50% -30%,rgba(245,208,106,0.04),transparent 60%);
  opacity:0;transition:opacity .35s;
}
.glass:hover::before{opacity:1}
.glass:hover{box-shadow:0 24px 80px rgba(0,0,0,0.44),0 0 0 1px rgba(245,208,106,0.18),0 0 38px rgba(245,208,106,0.08),inset 0 1px 0 rgba(255,255,255,0.09)}
.card-gold{background:rgba(212,175,55,0.06);border:1px solid var(--bordergold);border-radius:16px;padding:16px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;gap:4px}
.tag-purple{background:rgba(139,92,246,0.2);color:var(--purple2);border:1px solid rgba(139,92,246,0.3)}
.tag-gold{background:rgba(212,175,55,0.15);color:var(--gold2);border:1px solid rgba(212,175,55,0.3)}
.tag-cyan{background:rgba(6,182,212,0.15);color:var(--cyan);border:1px solid rgba(6,182,212,0.3)}
.tag-pink{background:rgba(236,72,153,0.15);color:var(--pink);border:1px solid rgba(236,72,153,0.3)}
.tag-red{background:rgba(255,68,68,0.15);color:var(--red);border:1px solid rgba(255,68,68,0.3)}
.tag-green{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.3)}
.section{padding:0 0 24px}
.section-title{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;padding-left:2px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:16px 0}
.bar-wrap{height:6px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px}
.score-ring{display:flex;flex-direction:column;align-items:center;gap:4px}
.planet-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.planet-row:last-child{border-bottom:none}
.p-sym{font-size:18px;width:28px;text-align:center}
.p-name{font-weight:600;font-size:13px;min-width:54px}
.p-sign{color:var(--text2);font-size:12px;flex:1}
.p-badge{font-size:10px;padding:2px 8px;border-radius:10px}
.house-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;text-align:center;position:relative;min-height:50px;padding:4px;
  border:1px solid rgba(139,92,246,0.2);background:rgba(139,92,246,0.04);
}
.house-num{font-size:9px;color:var(--text3);position:absolute;top:2px;left:3px}
.house-sign{font-size:9px;color:var(--gold);margin-bottom:2px}
.house-planets{font-size:10px;color:var(--cyan);line-height:1.3}
.module-card{
  background:var(--glass);border:1px solid var(--border);border-radius:16px;
  padding:16px;cursor:pointer;transition:all 0.25s;user-select:none;
  display:flex;align-items:center;gap:14px;
}
.module-card:active{transform:scale(0.97);border-color:var(--purple2)}
.module-icon{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.module-title{font-family:var(--font-display);font-size:14px;font-weight:600;margin-bottom:3px}
.module-sub{font-size:11px;color:var(--text2)}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:6px}
.back-btn:active{transform:scale(0.95)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-value{font-size:13px;font-weight:500;color:var(--text)}
.chakra-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chakra-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chakra-name{font-size:12px;min-width:100px;color:var(--text2)}
.chakra-score{font-size:11px;color:var(--text3);min-width:30px;text-align:right}
.compat-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.compat-name{font-size:12px;color:var(--text2);min-width:120px}
.compat-score{font-size:11px;min-width:32px;text-align:right;color:var(--text3)}
.dasha-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.dasha-planet{font-size:13px;font-weight:600;min-width:70px}
.dasha-years{font-size:11px;color:var(--text3);flex:1}
.dasha-active{background:rgba(212,175,55,0.1);border-radius:8px;padding:2px 8px;color:var(--gold);font-size:10px}
.page{display:none;padding:16px;max-width:480px;margin:0 auto}
.page.active{display:block}
#app{min-height:100vh;position:relative}
.lagna-asc{
  width:100%;height:36px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.15),transparent);
  font-family:var(--font-display);font-size:11px;color:var(--gold);letter-spacing:0.15em;
  border-top:1px solid var(--bordergold);border-bottom:1px solid var(--bordergold);
  margin-bottom:12px;
}
.result-hero{
  background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(6,182,212,0.15));
  border:1px solid rgba(139,92,246,0.3);border-radius:20px;padding:20px;
  text-align:center;margin-bottom:20px;
}
.result-hero-name{font-family:var(--font-display);font-size:22px;color:var(--gold);margin-bottom:6px}
.result-hero-sub{font-size:12px;color:var(--text2)}
.info-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;margin-bottom:10px;font-size:12px;line-height:1.7;color:var(--text2)}
.info-box strong{color:var(--text)}
.tips{font-size:11px;color:var(--text3);background:rgba(212,175,55,0.07);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:10px}
.yoga-card{background:rgba(6,182,212,0.07);border:1px solid rgba(6,182,212,0.2);border-radius:12px;padding:14px;margin-bottom:10px}
.yoga-name{font-weight:700;font-size:14px;color:var(--cyan);margin-bottom:4px}
.yoga-type{font-size:11px;color:var(--text3)}
.yoga-benefit{font-size:12px;color:var(--text2);margin-top:6px}
.compat-header{background:linear-gradient(135deg,rgba(236,72,153,0.2),rgba(124,58,237,0.2));border:1px solid rgba(236,72,153,0.3);border-radius:16px;padding:16px;text-align:center;margin-bottom:16px}
.compat-total{font-size:32px;font-family:var(--font-display);color:var(--gold)}
.nabisco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 0 16px}
.south-chart{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid rgba(139,92,246,0.3);border-radius:4px;overflow:hidden;background:rgba(139,92,246,0.1)}
.north-chart svg{width:100%;height:auto}
.chart-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.chart-toggle-btn{flex:1;padding:8px;text-align:center;font-size:12px;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all 0.2s}
.chart-toggle-btn.active{background:rgba(139,92,246,0.25);color:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(212,175,55,0.3)}50%{box-shadow:0 0 20px rgba(212,175,55,0.6)}}
@keyframes pulse{0%,100%{opacity:0.7}50%{opacity:1}}
@keyframes spinRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp 0.4s ease forwards}
.active-dasha{animation:glow 2s ease-in-out infinite}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:20px}
.loading-ring{width:60px;height:60px;border:3px solid rgba(139,92,246,0.2);border-top-color:var(--purple2);border-radius:50%;animation:spinRing 0.8s linear infinite}
.loading-text{color:var(--text2);font-size:13px;animation:pulse 1.5s ease-in-out infinite}
.error-box{background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.3);border-radius:12px;padding:16px;color:#ff9999;font-size:13px;text-align:center}

/* ── 개편 추가 스타일 ───────────────────────────────────── */

/* 스크롤 페이드인 */
.reveal{opacity:0;transform:translateY(22px);transition:opacity 0.6s ease,transform 0.6s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-delay-1{transition-delay:0.09s}
.reveal-delay-2{transition-delay:0.18s}
.reveal-delay-3{transition-delay:0.27s}
.reveal-delay-4{transition-delay:0.36s}

/* 반응형 타이포 */
.hero-name{font-family:var(--font-display);font-size:clamp(20px,5vw,28px);color:var(--gold);line-height:1.2}
.hero-sub{font-size:clamp(11px,2.5vw,13px);color:var(--text2)}
.section-head{font-family:var(--font-display);font-size:clamp(13px,3vw,15px);color:var(--gold);letter-spacing:0.08em;margin-bottom:4px}
.section-head{
  font-variation-settings:"wght" 650;
  text-shadow:0 0 16px rgba(245,208,106,0.14);
}
.section-head-kr{
  font-family:var(--font-body);
  font-weight:800;
  letter-spacing:0.02em;
  text-shadow:none;
}
.form-subhead{
  font-family:var(--font-display);
  font-variation-settings:"wght" 700;
  letter-spacing:0.12em;
  text-transform:none;
}
.module-title,.mod-title{
  font-variation-settings:"wght" 650;
  letter-spacing:0.06em;
  text-shadow:0 0 14px rgba(245,208,106,0.10);
}
.body-text{font-size:clamp(13px,3.2vw,14px);line-height:1.75;color:var(--text2)}
.sage-text{
  font-size:clamp(13px,3.2vw,14px);
  line-height:1.85;
  color:var(--text2);
  font-style:italic;
  padding:12px 14px;
  background:rgba(212,175,55,0.06);
  border:1px solid rgba(245,208,106,0.14);
  border-radius:14px;
  margin:10px 0;
  box-shadow:0 14px 40px rgba(0,0,0,0.24);
}
.keyword{display:inline;background:rgba(212,175,55,0.15);color:var(--gold2);border:1px solid rgba(212,175,55,0.3);border-radius:4px;padding:1px 6px;font-size:0.92em;font-weight:500}

/* 탭 시스템 */
.tab-nav{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:6px;align-items:center;padding:6px 0 4px;margin-bottom:16px;position:sticky;top:0;z-index:12;background:linear-gradient(180deg,rgba(5,6,10,0.9),rgba(5,6,10,0.72));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.06);isolation:isolate}
.tab-nav::before,.tab-nav::after{content:'';position:absolute;top:0;bottom:0;width:18px;pointer-events:none;opacity:0;transition:opacity .2s}
.tab-nav::before{left:34px;background:linear-gradient(90deg,rgba(5,6,10,0.9),transparent)}
.tab-nav::after{right:34px;background:linear-gradient(270deg,rgba(5,6,10,0.9),transparent)}
.tab-nav.has-left-shadow::before{opacity:1}
.tab-nav.has-right-shadow::after{opacity:1}
.tab-scroll-btn{width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,0.06);color:var(--text);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;transition:all .2s}
.tab-scroll-btn:hover{border-color:rgba(245,208,106,0.24);box-shadow:0 10px 22px rgba(0,0,0,0.26),0 0 16px rgba(245,208,106,0.12)}
.tab-scroll-btn:active{transform:scale(0.95)}
.tab-scroll-btn:disabled{opacity:0.36;cursor:default;box-shadow:none;border-color:rgba(255,255,255,0.08)}
.tab-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 2px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;scroll-snap-type:x proximity}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:8px 14px;min-height:40px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,0.06);color:var(--text2);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.2s;white-space:nowrap;scroll-snap-align:center}
.tab-btn.active{background:rgba(139,92,246,0.25);color:#fff;border-color:rgba(139,92,246,0.5);box-shadow:0 0 0 1px rgba(139,92,246,0.28),0 10px 24px rgba(0,0,0,0.26)}
.tab-btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,0.28),0 0 18px rgba(245,208,106,0.10);border-color:rgba(245,208,106,0.20)}
.tab-btn:active{transform:scale(0.95)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* 아코디언 */
.acc-item{border:1px solid rgba(255,255,255,0.07);border-radius:12px;margin-bottom:8px;overflow:hidden}
.acc-header{display:flex;align-items:center;gap:10px;padding:13px 14px;min-height:48px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background 0.2s}
.acc-header:active{background:rgba(255,255,255,0.04)}
.acc-title{font-size:13px;font-weight:600;flex:1}
.acc-arrow{font-size:12px;color:var(--text3);transition:transform 0.25s;flex-shrink:0}
.acc-body{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(.4,0,.2,1)}
.acc-body.open{max-height:2800px}
.acc-inner{padding:0 14px 14px}

/* 행성 테이블 개편 */
.planet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.planet-cell{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:8px 6px;text-align:center;position:relative;overflow:hidden}
.planet-cell::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.planet-sym-big{font-size:20px;display:block;margin-bottom:2px}
.planet-nm{font-size:11px;font-weight:700;margin-bottom:2px}
.planet-pos{font-size:10px;color:var(--text3);line-height:1.3}
.planet-dig{font-size:9px;padding:1px 6px;border-radius:8px;margin-top:3px;display:inline-block}

/* 요약 카드 그리드 */
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.sum-card{background:rgba(255,255,255,0.04);border-radius:14px;padding:13px;border:1px solid rgba(255,255,255,0.07);position:relative;overflow:hidden;transition:all .25s;backdrop-filter:blur(4px);}
.sum-card::after{content:"";position:absolute;top:-30%;left:-10%;width:120%;height:60%;background:radial-gradient(ellipse,rgba(245,208,106,0.04),transparent 70%);pointer-events:none}
.sum-card:hover{border-color:rgba(245,208,106,0.18);box-shadow:0 10px 28px rgba(0,0,0,0.3)}
.sum-card-label{font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px}
.sum-card-val{font-size:clamp(12px,3vw,14px);font-weight:700;line-height:1.3}
.sum-card-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* 전문 해석 카드 (핵심요약→근거→현실→주의→행동→종합 6단) */
.vd-head{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.vd-head-icon{font-size:18px;line-height:1}
.vd-head-title{font-family:var(--font-body);font-weight:800;font-size:clamp(14px,3.6vw,16px);color:var(--gold2);letter-spacing:0.02em}
.vd-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.vd-stack{display:grid;gap:10px;margin:0 0 16px}
.vd-card{background:rgba(255,255,255,0.035);border:1px solid var(--vd-edge,rgba(255,255,255,0.08));border-radius:14px;padding:13px 14px;position:relative;overflow:hidden}
.vd-card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px 140px at 0% 0%,var(--vd-glow,rgba(245,208,106,0.07)),transparent 70%);pointer-events:none}
.vd-card-head{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.vd-card-icon{font-size:15px;line-height:1}
.vd-card-title{font-size:12px;font-weight:800;letter-spacing:0.04em;color:var(--vd-accent,var(--gold2))}
.vd-card p{font-size:clamp(13px,3.2vw,14px);line-height:1.85;color:var(--text2);margin:0 0 8px}
.vd-card p:last-child{margin-bottom:0}
.vd-list{margin:0 0 8px;padding:0;list-style:none}
.vd-list:last-child{margin-bottom:0}
.vd-list li{position:relative;padding-left:15px;font-size:clamp(12.5px,3.1vw,13.5px);line-height:1.8;color:var(--text2);margin-bottom:7px}
.vd-list li:last-child{margin-bottom:0}
.vd-list li::before{content:"";position:absolute;left:2px;top:0.72em;width:5px;height:5px;border-radius:50%;background:var(--vd-bar,var(--gold));opacity:0.8}
/* 심화 서술 블록 (아코디언 내부) */
.vd-deep{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.07)}
.vd-deep p{font-size:clamp(12.5px,3.1vw,13.5px);line-height:1.85;color:var(--text2);margin:0 0 8px}
.vd-deep p:last-child{margin-bottom:0}
.vd-row{margin-top:10px}
.vd-row:first-child{margin-top:0}
.vd-row-label{font-size:11px;font-weight:700;letter-spacing:0.04em;color:var(--gold2);margin-bottom:4px}
.vd-row-body p{margin-bottom:6px}

/* 모듈 카드 (개편) */
.mod-card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all 0.25s cubic-bezier(.22,1,.36,1);user-select:none;display:flex;align-items:center;gap:12px;margin-bottom:8px;position:relative;overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.mod-card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(500px 200px at 50% 120%,rgba(245,208,106,0.05),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none;}
.mod-card:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(0,0,0,0.42),0 0 0 1px rgba(245,208,106,0.24),0 0 32px rgba(245,208,106,0.1);border-color:rgba(245,208,106,0.28);}
.mod-card:hover::after{opacity:1}
.mod-card:active{transform:scale(0.97)}
.mod-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.mod-texts{flex:1;min-width:0}
.mod-title{font-family:var(--font-display);font-size:13px;font-weight:600;margin-bottom:2px}
.mod-preview{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-score{font-size:18px;font-family:var(--font-display);font-weight:700;flex-shrink:0}

/* 다샤 타임라인 */
.dasha-timeline{position:relative;padding-left:20px}
.dasha-timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,var(--purple2),transparent)}
.dasha-node{position:relative;margin-bottom:14px}
.dasha-dot{position:absolute;left:-17px;top:4px;width:8px;height:8px;border-radius:50%;border:2px solid var(--purple2);background:var(--bg)}
.dasha-dot.active-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(212,175,55,0.6)}
.dasha-period{font-size:12px;font-weight:600;margin-bottom:2px}
.dasha-range{font-size:11px;color:var(--text3)}
.dasha-insight{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.6}

/* 차크라 링 */
.chakra-list{display:flex;flex-direction:column;gap:10px}
.chakra-item{display:flex;align-items:center;gap:10px}
.chakra-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;color:#fff}
.chakra-circle{position:relative;isolation:isolate}
.chakra-circle::after{
  content:"";
  position:absolute;inset:-6px;
  border-radius:999px;
  border:1px solid rgba(245,208,106,0.22);
  opacity:0;
  transform:scale(0.92);
  animation:chakraPulse 2.1s ease-in-out infinite;
}
@keyframes chakraPulse{
  0%,100%{opacity:0;transform:scale(0.92)}
  40%{opacity:0.6;transform:scale(1.08)}
  70%{opacity:0.12;transform:scale(1.22)}
}

/* 차크라 에너지 바: 무지개 흐름 */
.chakra-energy{
  height:8px;
  background:rgba(255,255,255,0.08);
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(245,208,106,0.14);
}
.chakra-energy > .chakra-energy-fill{
  height:100%;
  width:0%;
  border-radius:999px;
  background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#32ade6,#0a84ff,#bf5af2);
  box-shadow:0 0 22px rgba(245,208,106,0.16);
  position:relative;
  transition:width 1.1s cubic-bezier(.4,0,.2,1);
}
.chakra-energy > .chakra-energy-fill::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);
  transform:translateX(-60%);
  animation:energyFlow 1.8s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes energyFlow{to{transform:translateX(60%)}}

/* 별자리 연결선 드로잉 */
.constellation-path{width:100%;height:64px;display:block;opacity:0.9}
.constellation-path path{
  stroke:rgba(245,208,106,0.75);
  stroke-width:1.25;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:420;
  stroke-dashoffset:420;
  animation:constellationDraw 1.6s ease forwards;
  animation-play-state:paused;
  filter:drop-shadow(0 0 10px rgba(245,208,106,0.18));
}
.reveal.visible .constellation-path path{animation-play-state:running}
@keyframes constellationDraw{to{stroke-dashoffset:0}}
.chakra-info{flex:1}
.chakra-label{font-size:12px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.chakra-desc{font-size:11px;color:var(--text3);line-height:1.5}

/* 궁합 */
.compat-score-big{font-family:var(--font-display);font-size:clamp(42px,10vw,56px);font-weight:700;line-height:1}
.compat-item{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:8px;margin-bottom:9px}
.compat-label{font-size:11px;color:var(--text2)}
.compat-num{font-size:11px;text-align:right;font-weight:600}

/* 디테일 헤더 */
.detail-topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 10px;
  position:sticky;
  top:0;
  z-index:20;
  margin:0 -10px 16px;
  border-radius:16px;
  overflow:hidden;
  border-bottom:1px solid rgba(245,208,106,0.12);
  background:
    linear-gradient(180deg, rgba(3,2,8,0.85) 0%, rgba(3,2,8,0.55) 100%);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.detail-topbar::before{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  background:
    radial-gradient(520px 120px at 30% 0%, rgba(124,58,237,0.18), transparent 70%),
    radial-gradient(420px 120px at 80% 0%, rgba(30,64,175,0.16), transparent 70%);
  opacity:0.9;
}
.detail-topbar::after{
  content:"";
  position:absolute;left:12px;right:12px;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent, rgba(245,208,106,0.35), transparent);
  pointer-events:none;
}
.detail-topbar-inner{
  position:relative;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:12px;
  width:100%;
}
.detail-title{
  font-family:var(--font-display);
  font-variation-settings:"wght" 700;
  letter-spacing:0.10em;
  text-shadow:0 0 18px rgba(245,208,106,0.16);
  text-align:center;
}
.detail-sub{font-size:11px;color:rgba(240,232,255,0.5);letter-spacing:0.08em;text-align:center}
.detail-spacer{width:84px}

.tab-panel .detail-topbar .back-btn,
.tab-panel .detail-topbar .detail-spacer{display:none}
.tab-panel .detail-topbar .detail-topbar-inner{grid-template-columns:1fr}

/* 뒤로 버튼: 우주 컨셉 글래스 칩 */
.back-btn{
  position:relative;
  border:1px solid rgba(245,208,106,0.22);
  background:rgba(255,255,255,0.06);
  color:rgba(240,232,255,0.85);
  border-radius:999px;

  gap:8px;

}
.back-btn::before{
  content:"";

  border-radius:999px;
  background:linear-gradient(90deg, rgba(245,208,106,0.10), rgba(124,58,237,0.12), rgba(30,64,175,0.10));
  opacity:0.35;
  filter:blur(8px);
  z-index:-1;
}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(0,0,0,0.36),0 0 22px rgba(245,208,106,0.14)}
.back-btn:active{transform:scale(0.97)}

/* 디테일 카드 공통: 더 깔끔한 글래스 */
.acc-item{
  background:rgba(255,255,255,0.038);
  border:1px solid rgba(245,208,106,0.14);
  box-shadow:0 16px 50px rgba(0,0,0,0.28);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:border-color .25s,box-shadow .25s;
}
.acc-item:hover{border-color:rgba(245,208,106,0.22);box-shadow:0 18px 55px rgba(0,0,0,0.32),0 0 24px rgba(245,208,106,0.05)}
.acc-header{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00))}
.acc-header:hover{background:rgba(255,255,255,0.04)}

/* 요가 카드 */
.yoga-item{background:rgba(6,182,212,0.06);border:1px solid rgba(6,182,212,0.18);border-radius:12px;padding:14px;margin-bottom:10px}
.yoga-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.yoga-title{font-family:var(--font-body);font-weight:800;font-size:14px;color:var(--cyan);letter-spacing:0.01em}
.yoga-dur{font-size:11px;color:var(--text3)}
.yoga-benefit{font-family:var(--font-body);font-size:12.5px;color:rgba(240,232,255,0.72);line-height:1.75}

@media (max-width:430px){

}

function _vedicGetSwissBridge(){
  return window.swisseph||window.Swe||window.swe||null;
}

function _vedicEnsureSwissReady(timeoutMs){
  if(_vedicGetSwissBridge()) return Promise.resolve(true);
  var timeout=(typeof timeoutMs==='number'&&timeoutMs>0)?timeoutMs:12000;
  return new Promise(function(resolve,reject){
    var settled=false;
    function done(ok,err){
      if(settled) return;
      settled=true;
      try{window.removeEventListener('swisseph:ready',onReady);}catch(_){}
      try{window.removeEventListener('swisseph:error',onErr);}catch(_){}
      if(ok) resolve(true); else reject(err||new Error('swisseph bridge ready timeout'));
    }
    function onReady(){ done(true); }
    function onErr(ev){
      var msg=(ev&&ev.detail&&ev.detail.error)?String(ev.detail.error):'swisseph bridge init failed';
      done(false,new Error(msg));
    }
    window.addEventListener('swisseph:ready',onReady,{once:true});
    window.addEventListener('swisseph:error',onErr,{once:true});

    var existing=document.querySelector('script[src*="swisseph-loader.js"]');
    if(!existing){
      var s=document.createElement('script');
      s.type='module';
      s.src='js/swisseph-loader.js?v=20260328-lazy1';
      s.async=true;
      s.defer=true;
      s.onerror=function(){ done(false,new Error('swisseph module load failed')); };
      document.head.appendChild(s);
    }

    setTimeout(function(){
      if(_vedicGetSwissBridge()) done(true);
      else done(false,new Error('swisseph bridge ready timeout'));
    },timeout);
  });
}

function _vedicReadSwissLon(res,label){
  var v=null;
  if(Array.isArray(res)) v=Number(res[0]);
  else if(res&&typeof res==='object'){
    if(Array.isArray(res.xx)) v=Number(res.xx[0]);
    else if(typeof res.longitude==='number') v=Number(res.longitude);
    else if(typeof res.lon==='number') v=Number(res.lon);
  }
  if(!Number.isFinite(v)) throw new Error('invalid swisseph longitude: '+String(label||''));
  return nd(v);
}

/* ── 태어난 장소 검색형 타이핑 입력(vedic-place-typed-combo) ──────────────────────
   실제 값의 소스는 여전히 #v_place select 다(vedicApplySelectedPlace/
   _syncVedicToProfileCardCompatFields/vedicReadManualProfile 등 여러 지점이
   selectedIndex·data-* 를 직접 읽으므로 select 는 지우지 않고 display:none 으로만
   숨긴다). #v_placeText 는 타이핑으로 select 의 selectedIndex 를 옮기고
   change 이벤트만 대신 쏴 준다 — 기존 change 리스너(vedicApplySelectedPlace 등)가
   그대로 동작한다. */
function vedicPopulatePlaceDatalist(){
  var sel=document.getElementById('v_place');
  var dl=document.getElementById('v_placeDatalist');
  if(!sel||!dl||dl.options.length) return;
  for(var i=0;i<sel.options.length;i++){
    var label=sel.options[i].text;
    if(!label) continue;
    var opt=document.createElement('option');
    opt.value=label;
    dl.appendChild(opt);
  }
}
function vedicSyncPlaceTextFromSelect(){
  var sel=document.getElementById('v_place');
  var txt=document.getElementById('v_placeText');
  if(!sel||!txt) return;
  var opt=sel.options[sel.selectedIndex];
  if(opt) txt.value=opt.text;
}
function vedicSyncPlaceSelectFromText(){
  var sel=document.getElementById('v_place');
  var txt=document.getElementById('v_placeText');
  if(!sel||!txt) return;
  var typed=txt.value.trim();
  if(!typed) return;
  for(var i=0;i<sel.options.length;i++){
    if(sel.options[i].text===typed){
      if(sel.selectedIndex!==i){
        sel.selectedIndex=i;
        try{
          var evt=document.createEvent('HTMLEvents');
          evt.initEvent('change',true,false);
          sel.dispatchEvent(evt);
        }catch(_){}
      }
      return;
    }
  }
  /* 목록에 없는 자유 입력은 select 를 그대로 두고(마지막 유효 선택 유지) 텍스트만 사용자가
     친 대로 둔다 — 기존 select 의 기본값(서울) 폴백 동작과 같다. */
}

function vedicApplySelectedPlace(){
  var sel=document.getElementById('v_place');
  if(!sel) return;
  
  var opt=sel.options[sel.selectedIndex];
  if(!opt) return;
  
  // Get coordinates from selected option, fallback to Seoul if placeholder selected
  var lat=parseFloat(opt.getAttribute('data-lat')||'');
  var lon=parseFloat(opt.getAttribute('data-long')||'');
  var tz=parseFloat(opt.getAttribute('data-tz')||opt.getAttribute('data-base-tz')||'');
  
  // If placeholder/no coordinates, use Seoul as default
  if(isNaN(lat)) lat=37.5665;
  if(isNaN(lon)) lon=126.9780;
  if(isNaN(tz)) tz=9;
  
  var latEl=document.getElementById('v_lat');
  var lonEl=document.getElementById('v_lon');
  var tzEl=document.getElementById('v_tz');
  
  if(latEl) { 
    latEl.value = String(lat); 
    // Trigger input event for sync
    try{
      var evt = document.createEvent('HTMLEvents');
      evt.initEvent('input', true, false);
      latEl.dispatchEvent(evt);
    }catch(_){}
  }
  if(lonEl) { 
    lonEl.value = String(lon); 
    try{
      var evt = document.createEvent('HTMLEvents');
      evt.initEvent('input', true, false);
      lonEl.dispatchEvent(evt);
    }catch(_){}
  }
  if(tzEl) { 
    tzEl.value = String(tz); 
    try{
      var evt = document.createEvent('HTMLEvents');
      evt.initEvent('input', true, false);
      tzEl.dispatchEvent(evt);
    }catch(_){}
  }
}

// ─── ENHANCED DEEP-SPACE CANVAS ────────────────────────────
(function(){
  const c=document.getElementById('starCanvas'),ctx=c.getContext('2d');
  let stars=[],meteors=[],nebDots=[],W,H;

  function resize(){
    W=c.width=window.innerWidth;H=c.height=window.innerHeight;
    stars=[];nebDots=[];meteors=[];
    // Layer 1: tiny distant stars
    for(let i=0;i<180;i++){
      stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*0.7+0.2,t:Math.random()*6.28,s:Math.random()*.018+.004,col:[255,255,255]});
    }
    // Layer 2: mid-size blue-white stars
    for(let i=0;i<60;i++){
      const g=Math.random()<.4?[180,220,255]:[255,240,200];
      stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+0.5,t:Math.random()*6.28,s:Math.random()*.025+.006,col:g});
    }
    // Layer 3: prominent bright stars with 6-point sparkle
    for(let i=0;i<18;i++){
      stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+1.2,t:Math.random()*6.28,s:Math.random()*.012+.003,col:[255,248,210],sparkle:true});
    }
    // Nebula dust particles (very faint)
    for(let i=0;i<40;i++){
      nebDots.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*28+10,
        col:Math.random()<.4?[124,58,237]:Math.random()<.5?[6,182,212]:[236,72,153],
        a:Math.random()*.022+.005,t:Math.random()*6.28,s:Math.random()*.003+.001});
    }
  }

  function spawnMeteor(){
    if(meteors.length<3&&Math.random()<.004){
      const sx=Math.random()*W,sy=Math.random()*(H*.3);
      const len=Math.random()*120+80,angle=Math.PI/4+Math.random()*.3;
      meteors.push({sx,sy,len,angle,progress:0,speed:Math.random()*.028+.016,alpha:0.9});
    }
  }

  function drawSparkle(x,y,r,a){
    const arms=6,outer=r*2.4,inner=r*0.6;
    ctx.save();ctx.translate(x,y);ctx.globalAlpha=a*.6;
    ctx.strokeStyle=`rgba(255,248,220,${a*.5})`;ctx.lineWidth=0.5;
    for(let i=0;i<arms;i++){
      const ang=i*(Math.PI*2/arms);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(ang)*outer,Math.sin(ang)*outer);ctx.stroke();
    }
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // Nebula soft glows
    nebDots.forEach(n=>{
      n.t+=n.s;
      const na=n.a*(0.5+0.5*Math.sin(n.t));
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      g.addColorStop(0,`rgba(${n.col[0]},${n.col[1]},${n.col[2]},${na})`);
      g.addColorStop(1,`rgba(${n.col[0]},${n.col[1]},${n.col[2]},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,6.28);ctx.fill();
    });
    // Stars
    stars.forEach(s=>{
      s.t+=s.s;const a=0.35+0.6*Math.sin(s.t);
      ctx.globalAlpha=a;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);
      ctx.fillStyle=`rgb(${s.col[0]},${s.col[1]},${s.col[2]})`;ctx.fill();
      if(s.sparkle&&a>.5)drawSparkle(s.x,s.y,s.r,a);
      ctx.globalAlpha=1;
    });
    // Meteors
    spawnMeteor();
    meteors=meteors.filter(m=>{
      m.progress+=m.speed;
      if(m.progress>1)return false;
      const ex=m.sx+Math.cos(m.angle)*m.len*m.progress;
      const ey=m.sy+Math.sin(m.angle)*m.len*m.progress;
      const sx=m.sx+Math.cos(m.angle)*m.len*Math.max(0,m.progress-.18);

function rashiIdx(v){
  if(typeof v==='number'&&v>=0&&v<12)return v;
  const i=SIGNS.indexOf(v);return i>=0?i:0;
}
function rashiFull(v){const r=RASHI_KR[rashiIdx(v)];return r.ko+'('+r.en+'·'+r.west+')';}
function rashiShort(v){return RASHI_KR[rashiIdx(v)].ko;}
function rashiTerm(v){return RASHI_KR[rashiIdx(v)].ko+' 라시';}

function nakLabel(name){const ko=NAK_KR[name];return ko?ko+'('+name+')':String(name||'');}
function nakShort(name){return NAK_KR[name]||String(name||'');}

const GRAHA_SANSKRIT={Sun:"수리야(Surya)",Moon:"찬드라(Chandra)",Mars:"망갈라(Mangala)",Mercury:"부다(Budha)",Jupiter:"구루(Guru)",Venus:"슈크라(Shukra)",Saturn:"샤니(Shani)",Rahu:"라후(Rahu)",Ketu:"케투(Ketu)"};
function grahaTerm(p){const s=GRAHA_SANSKRIT[p];const k=PKR[p]||p;if(!s)return k;return s.indexOf(k)===0?s:s.replace(')','·'+k+')');}

const DIGNITY_KR={
  Exalted:"우차(Uccha·고양)",
  Moolatrikona:"물라트리코나(Moolatrikona·근본 삼각 라시)",
  Own:"스와크셰트라(Swakshetra·자기 라시)",
  Friend:"미트라(Mitra·우호 라시)",
  Neutral:"사마(Sama·중립 라시)",
  Enemy:"샤트루(Shatru·적대 라시)",
  Debilitated:"니차(Neecha·쇠약)"
};
const DIGNITY_SHORT={Exalted:"우차",Moolatrikona:"물라트리코나",Own:"스와크셰트라",Friend:"미트라",Neutral:"사마",Enemy:"샤트루",Debilitated:"니차"};
// 물라트리코나 구간: {라시 인덱스, 시작도, 끝도} — 정통 Parashara 값
const MOOLATRIKONA={Sun:{si:4,from:0,to:20},Moon:{si:1,from:4,to:30},Mars:{si:0,from:0,to:12},Mercury:{si:5,from:16,to:20},Jupiter:{si:8,from:0,to:10},Venus:{si:6,from:0,to:15},Saturn:{si:10,from:0,to:20}};

// ═══ 근거 산출 레이어 ═══════════════════════════════════════
// 기존 dignity 4값(계산 입력)은 그대로 두고, 읽기 전용으로 7단계 품위를 파생시킨다.
function dignityDetail(rasi,planet){
  const fallback={code:"Neutral",ko:DIGNITY_KR.Neutral,short:DIGNITY_SHORT.Neutral,reason:"",tone:0};
  const pl=rasi&&rasi.planets?rasi.planets[planet]:null;
  if(!pl)return fallback;
  const si=pl.sign;const deg=pl.deg||0;const base=pl.dignity||"Neutral";
  const mk=function(code,reason,tone){return{code,ko:DIGNITY_KR[code],short:DIGNITY_SHORT[code],reason,tone};};
  if(base==="Exalted")return mk("Exalted",rashiTerm(si)+'는 '+PKR[planet]+'이 가장 높이 올라서는 고양 자리입니다',2);
  if(base==="Debilitated")return mk("Debilitated",rashiTerm(si)+'는 '+PKR[planet]+'의 힘이 가장 눌리는 쇠약 자리입니다',-2);
  const mt=MOOLATRIKONA[planet];
  if(mt&&mt.si===si&&deg>=mt.from&&deg<mt.to)return mk("Moolatrikona",rashiTerm(si)+' '+mt.from+'~'+mt.to+'도 구간은 '+PKR[planet]+'의 근본 삼각 자리로, 자기 라시보다도 힘이 곧게 섭니다',2);
  if(base==="Own")return mk("Own",rashiTerm(si)+'는 '+PKR[planet]+'이 직접 다스리는 자기 라시입니다',1);
  const lord=SLORDS[si];
  const rel=(PFRIEND[planet]||{})[lord];
  if(rel==="Friend")return mk("Friend",rashiTerm(si)+'의 주인 '+PKR[lord]+'이 '+PKR[planet]+'과 우호 관계입니다',1);
  if(rel==="Enemy")return mk("Enemy",rashiTerm(si)+'의 주인 '+PKR[lord]+'이 '+PKR[planet]+'과 적대 관계입니다',-1);
  return mk("Neutral",rashiTerm(si)+'의 주인 '+PKR[lord]+'과 '+PKR[planet]+'은 중립 관계입니다',0);
}
// 드리슈티(행성의 시선). 모든 그라하는 7번 자리를 응시하고, 망갈라·구루·샤니는 특수 시선을 더 가진다.
const DRISHTI_TARGETS={Mars:[4,7,8],Jupiter:[5,7,9],Saturn:[3,7,10],Rahu:[5,7,9],Ketu:[5,7,9]};
function drishtiTargetsOf(planet){return DRISHTI_TARGETS[planet]||[7];}
function computeDrishti(rasi){
  const out=[];
  const allP=["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn","Rahu","Ketu"];
  for(const p of allP){
    if(!rasi.planets[p])continue;
    const from=planetHouse(rasi,p);
    if(!from)continue;
    for(const off of drishtiTargetsOf(p)){
      const to=((from+off-2)%12)+1;
      const h=rasi.houses[to-1]||{planets:[],lord:null};
      out.push({from:p,fromHouse:from,toHouse:to,offset:off,type:off===7?"full":"special",targetPlanets:(h.planets||[]).slice(),targetLord:h.lord,targetRashi:h.si});
    }
  }
  return out;
}
function drishtiOnHouse(drishti,houseNum,onlyMajor){
  return drishti.filter(function(d){
    if(d.toHouse!==houseNum)return false;
    if(onlyMajor)return ["Mars","Jupiter","Saturn","Rahu","Ketu"].indexOf(d.from)>=0;
    return true;
  });
}

const NAK_PROSE={
  "Ashwini":{core:"아슈위니는 27수 가운데 가장 앞에 서는 낙샤트라입니다. 남들이 아직 상황을 재고 있을 때 이미 첫 발을 내딛고, 결정과 실행 사이의 간격이 거의 없습니다. 치유의 쌍둥이 신 아슈위니 쿠마라가 주관하는 자리라 무너진 것을 되살리는 손이 있습니다.",shadow:"속도가 강점인 만큼 마무리 직전에 흥미를 잃습니다. 시작한 일의 30%가 완주되지 않고 남습니다.",reality:"새 프로젝트의 초기 세팅, 응급 상황 수습, 아무도 손대지 않은 영역의 개척에서 두각을 냅니다. 반대로 6개월 이상 같은 일을 반복하는 자리에서는 급격히 소진됩니다."},
  "Bharani":{core:"바라니는 죽음과 재생을 관장하는 야마의 자리입니다. 끝내야 할 것을 끝내는 힘, 한계까지 견디는 인내가 이 낙샤트라의 본질입니다. 감내의 총량이 남들보다 크고, 그 압력을 통과한 뒤에 사람이 달라집니다.",shadow:"참는 방식이 극단으로 흘러 감정을 쌓아두다 한 번에 터뜨립니다. 관계에서 소유욕과 통제욕이 함께 올라옵니다.",reality:"장기 프로젝트의 마감, 조직의 구조조정, 오래 끌어온 관계의 정리처럼 '끊어내는 결정'에서 제 몫을 합니다. 출산·양육·돌봄 영역과 인연이 깊습니다."},
  "Krittika":{core:"크리티카는 불의 신 아그니의 칼날입니다. 대상을 정확히 관통해 불순물을 태우는 비판력이 타고난 도구이며, 애매한 것을 견디지 못합니다. 진단이 빠르고 정확합니다.",shadow:"날이 밖으로 향하면 사람을 벱니다. 옳은 말을 옳지 않은 온도로 전달해 관계를 잃습니다.",reality:"품질 관리, 감사, 편집, 교정, 진단·수술 같은 '잘라내는 직무'에서 탁월합니다. 팀 회의에서 문제를 가장 먼저 짚어내는 사람이 됩니다."},
  "Rohini":{core:"로히니는 창조주 브라흐마가 가장 아꼈다는 자리로, 물질을 실제 형태로 빚어내는 힘이 있습니다. 아름다움을 알아보는 눈과 풍요를 끌어당기는 자력이 함께 옵니다. 달이 가장 편안해하는 낙샤트라입니다.",shadow:"소유한 것을 놓지 못합니다. 사람·물건·기회 모두 쥐고 있으려 해 순환이 막힙니다.",reality:"디자인·요리·부동산·브랜딩처럼 감각이 곧 결과물이 되는 분야에서 성과가 납니다. 돈 관리에서는 모으는 속도는 빠르지만 처분 결정이 늦어 자산이 한 곳에 묶입니다."},
  "Mrigashira":{core:"므리가쉬라는 사슴이 향기를 좇는 자리입니다. 끊임없이 탐색하고 질문하며, 한 자리에 정착하기보다 더 나은 것이 있는지 확인해야 직성이 풀립니다. 감수성이 예민하고 관찰이 섬세합니다.",shadow:"선택지를 계속 열어두다 결정을 미룹니다. 이미 좋은 것을 손에 쥐고도 다른 것을 찾습니다.",reality:"리서치·기획·취재·큐레이션처럼 찾아내는 일이 본업일 때 강합니다. 연애에서는 상대를 알아가는 초반이 가장 뜨겁고, 안정기에 들어서면 권태를 먼저 느낍니다."},
  "Ardra":{core:"아르드라는 폭풍의 신 루드라가 주관합니다. 기존 질서가 무너진 자리에서 오히려 사고가 명료해지며, 남들이 회피하는 고통을 정면으로 다룹니다. 지적 예리함과 깊은 공감이 한 사람 안에 공존합니다.",shadow:"내면의 폭풍이 밖으로 나올 때 말이 거칠어집니다. 감정 기복의 기복이 커서 주변이 종잡기 어려워합니다.",reality:"위기 대응, 상담·심리, 데이터 분석, 사회 문제를 다루는 일에서 힘을 냅니다. 인생의 큰 전환점이 갑작스러운 사건 형태로 오며, 그 뒤에 오히려 안정됩니다."},
  "Punarvasu":{core:"푸나르바수는 '다시 좋아진다'는 뜻의 자리입니다. 무한한 어머니 아디티가 주관해, 잃어도 회복하고 떠나도 돌아오는 복원력이 핵심입니다. 낙관이 근거 없는 기대가 아니라 실제 회복 경험에서 나옵니다.",shadow:"돌아올 수 있다는 믿음이 안일함으로 굳으면 같은 실패를 반복합니다. 뿌리내리는 시점을 계속 미룹니다.",reality:"재기가 필요한 사업, 교육·상담, 여행·이주와 인연이 깊습니다. 실직·이별 같은 손실 뒤 회복 속도가 주변보다 눈에 띄게 빠릅니다."},
  "Pushya":{core:"푸시야는 27수 중 가장 상서로운 자리로 꼽힙니다. 스승신 브리하스파티가 주관하며, 남을 먹이고 기르는 자질이 본능에 가깝습니다. 신뢰를 얻는 속도가 빠르고 오래갑니다.",shadow:"돌봄이 과해지면 상대의 자립을 막습니다. 자신을 뒤로 미루다 정작 본인이 소진됩니다.",reality:"교육·의료·인사·재무처럼 남을 책임지는 직무에서 자리를 잡습니다. 부모·손윗사람과의 관계가 인생 전반의 안정판 역할을 합니다."},
  "Ashlesha":{core:"아슐레샤는 뱀의 신 나가의 자리입니다. 표면 아래에서 벌어지는 일을 읽어내는 통찰이 있고, 사람의 진짜 동기를 빠르게 간파합니다. 말수보다 관찰이 앞섭니다.",shadow:"간파한 것을 지렛대로 쓰면 관계가 조작으로 변질됩니다. 상처받은 기억을 오래 품습니다.",reality:"협상·수사·심리 상담·전략 기획에서 강점이 드러납니다. 인간관계는 넓히기보다 소수와 깊게 가는 편이 훨씬 안정적입니다."},
  "Magha":{core:"마가는 조상신 피트르의 왕좌입니다. 권위가 몸에 배어 있어 직함이 없어도 좌중의 중심에 놓입니다. 가문·전통·계보에서 힘을 끌어옵니다.",shadow:"인정받지 못하는 상황을 견디기 어려워합니다. 자존심이 실리보다 앞설 때 손해가 큽니다.",reality:"관리직·공직·전통 산업·가업 승계에서 자연스럽게 자리를 잡습니다. 부모나 조상과 관련된 사건이 인생 방향을 크게 돌려놓습니다."},
  "Purva Phalguni":{core:"푸르바 팔구니는 향락과 행운의 신 바가의 자리입니다. 즐거움을 만드는 재능이 있고, 사람을 편안하게 만드는 사교적 온기가 강점입니다. 창작 에너지가 놀이에서 나옵니다.",shadow:"편한 것에 오래 머물면 실력이 정체됩니다. 쾌락과 소비의 균형이 무너지기 쉽습니다.",reality:"엔터테인먼트·이벤트·패션·접객 분야가 잘 맞습니다. 연애 초반의 매력이 강해 인연이 자주 들어오며, 결혼 후 안정을 찾는 데 시간이 걸립니다."},
  "Uttara Phalguni":{core:"우타라 팔구니는 계약과 우정의 신 아리야만이 주관합니다. 한 번 맺은 약속을 지키는 힘이 있고, 그 신뢰가 장기적인 번영으로 돌아옵니다. 관대함이 전략이 아니라 성격입니다.",shadow:"베푼 만큼 돌아오지 않을 때 서운함이 오래 남습니다. 관계에서 상대에게 의존하는 구조를 만들기 쉽습니다.",reality:"파트너십 사업, 법무·계약, 조직 내 조정 역할에서 성과가 납니다. 배우자·동업자와의 관계가 재정 상태를 직접 좌우합니다."},
  "Hasta":{core:"하스타는 태양의 창조력 사비타르가 주관하는 '손'의 자리입니다. 머리로 그린 것을 손으로 구현하는 능력이 뛰어나고, 손재주와 기술 습득 속도가 빠릅니다.",shadow:"능숙함이 지나치면 요령으로 흐릅니다. 지름길을 알기에 정공법을 건너뛰다 신뢰를 잃습니다.",reality:"수공예·의료·정비·연주·요리처럼 손이 결과를 내는 일에서 두각을 냅니다. 배운 기술이 평생의 생계 기반이 되는 구조가 자주 나타납니다."},
  "Chitra":{core:"치트라는 우주의 장인 비슈와카르마의 자리입니다. 완성도에 대한 기준이 높고, 눈에 보이는 결과물의 마감을 끝까지 다듬습니다. 미적 감각과 구조적 사고가 함께 작동합니다.",shadow:"기준이 자기 자신에게로 향하면 외모와 성과에 과도하게 집착합니다. 남의 미완성을 참지 못합니다.",reality:"건축·디자인·엔지니어링·영상 분야에 강합니다. 자기 작업물이 곧 명함이 되는 커리어 구조를 만드는 편이 유리합니다."},
  "Swati":{core:"스와티는 바람의 신 바유의 자리로, 독립이 곧 생존 조건입니다. 누구의 우산 아래에도 완전히 들어가지 않으며, 스스로 균형을 잡을 때 가장 안정됩니다. 협상과 교역의 감각이 뛰어납니다.",shadow:"어디에도 완전히 속하지 않으려다 정체성이 흔들립니다. 결정을 미루는 습관이 기회를 놓치게 만듭니다.",reality:"프리랜서·무역·영업·중개 분야가 잘 맞습니다. 조직에 소속되더라도 재량권이 확보되어야 성과가 나오며, 통제가 심한 환경에서는 오래 버티지 못합니다."},
  "Vishakha":{core:"비샤카는 인드라와 아그니가 함께 주관하는 목적의 자리입니다. 목표가 정해지면 다른 것을 다 접고 그쪽으로 수렴하며, 마지막 구간에서 힘이 더 나옵니다.",shadow:"목표 달성 전까지 스스로를 몰아붙여 관계와 건강을 뒤로 미룹니다. 비교와 질투가 동력이 되기 쉽습니다.",reality:"입시·자격시험·창업 초기처럼 명확한 목표가 있는 구간에서 폭발력이 나옵니다. 목표가 사라진 시기에 급격한 공허를 겪으므로 다음 과녁을 미리 설정해두어야 합니다."},
  "Anuradha":{core:"아누라다는 우정과 계약의 신 미트라가 주관합니다. 헌신으로 사람을 얻고, 그 관계망이 인생의 실질적 자산이 됩니다. 낯선 환경에서도 사람을 만드는 능력이 있습니다.",shadow:"헌신이 일방적으로 흐를 때 의심과 불안이 자랍니다. 관계 유지에 감정 에너지를 과하게 씁니다.",reality:"조직 관리·커뮤니티 운영·해외 근무에서 강점이 드러납니다. 타지·타국에서 오히려 기회가 열리는 구조가 자주 나타납니다."},
  "Jyeshtha":{core:"지예슈타는 번개의 왕 인드라의 자리입니다. 책임이 주어지면 물러서지 않고, 약한 쪽을 감싸는 보호 본능이 강합니다. 위기 상황에서 목소리가 커지는 유형입니다.",shadow:"보호가 지배로 변합니다. 서열과 인정에 예민해 손윗사람·손아랫사람 모두와 마찰이 생깁니다.",reality:"관리자·군경·의료·법 집행 분야와 인연이 깊습니다. 맏이 역할(실제 순서와 무관하게)을 떠맡는 구조가 반복됩니다."},
  "Mula":{core:"물라는 뿌리를 뜻하며, 분해의 여신 니리티가 주관합니다. 표면의 설명에 만족하지 않고 근본 원인까지 파고들며, 그 과정에서 기존 구조를 해체합니다. 직설적이고 타협이 적습니다.",shadow:"뿌리를 뽑는 힘이 자기 삶에도 작동해 안정된 것을 스스로 흔듭니다. 말이 날카로워 관계가 급격히 끊깁니다.",reality:"연구·수사·철학·의학처럼 원인을 캐는 일에서 발군입니다. 20대 후반~30대 초반에 삶의 기반이 한 번 뒤집히고, 그 뒤 훨씬 단단해지는 흐름이 흔합니다."},
  "Purva Ashadha":{core:"푸르바 아샤다는 '패배하지 않는' 자리입니다. 물의 신 아파스가 주관해 설득력과 확신이 강하고, 자신의 논리로 사람을 움직입니다.",shadow:"확신이 굳으면 반대 의견을 듣지 않습니다. 자기 논리에 갇혀 방향 수정이 늦습니다.",reality:"영업·강연·정치·법정 논쟁 같은 설득 직무에서 성과가 큽니다. 사업에서는 확장 판단이 과감해 성패의 진폭이 큽니다."},
  "Uttara Ashadha":{core:"우타라 아샤다는 10명의 우주 신이 함께 주관하는 자리로, 늦지만 확실한 승리를 상징합니다. 덕망으로 신뢰를 쌓고 시간을 자기 편으로 만듭니다.",shadow:"완고함이 굳어 방식을 바꾸지 못합니다. 혼자 짊어지다 고립됩니다.",reality:"공직·연구·장기 프로젝트에서 두각을 냅니다. 30대 이후 축적된 신뢰가 40대에 직위와 자산으로 환산되는 흐름이 자주 나타납니다."},
  "Shravana":{core:"슈라바나는 '듣는' 자리로 유지의 신 비슈누가 주관합니다. 남의 말을 끝까지 듣고 정리해 전달하는 능력이 뛰어나며, 배움이 곧 자산이 됩니다.",shadow:"들은 것이 많아 소문과 험담의 통로가 되기 쉽습니다. 남의 기준을 자기 기준으로 착각합니다.",reality:"교육·미디어·통번역·컨설팅에서 강합니다. 인맥을 통해 기회가 들어오는 비율이 다른 낙샤트라보다 뚜렷하게 높습니다."},
  "Dhanishtha":{core:"다니슈타는 여덟 풍요의 신 아슈타 바수의 자리입니다. 리듬 감각과 재물 감각이 함께 있으며, 집단을 조율하는 데 능합니다.",shadow:"풍요를 과시로 쓰면 관계가 얕아집니다. 자기 성취를 위해 타인을 도구화하기 쉽습니다.",reality:"음악·부동산·금융·팀 운영 분야가 잘 맞습니다. 여러 수입원을 동시에 굴리는 구조에서 재물이 안정됩니다."},
  "Shatabhisha":{core:"샤타비샤는 우주 법칙의 신 바루나가 주관하는 '백 명의 치유자' 자리입니다. 숨겨진 원인을 찾아내는 감각이 있고, 혼자 있는 시간에 오히려 능력이 회복됩니다.",shadow:"비밀주의가 깊어져 도움을 청하지 못합니다. 고립이 길어지면 관계 회복이 어려워집니다.",reality:"의료·연구·보안·데이터 분야에서 강점이 큽니다. 남들이 못 고친 문제를 맡는 위치로 자연스럽게 이동합니다."},
  "Purva Bhadrapada":{core:"푸르바 바드라파다는 미래의 불꽃을 상징합니다. 세속과 영성 두 극단을 오가며, 남들이 보지 못하는 방향을 먼저 감지합니다. 강도 높은 변혁의 자리입니다.",shadow:"극단 사이의 기복이 커서 삶이 불안정해집니다. 자기 파괴적 선택을 낭만화하기 쉽습니다.",reality:"연구·종교·예술·첨단 기술처럼 기존 틀 밖의 영역에서 자리를 찾습니다. 인생에 한 번, 방향을 통째로 바꾸는 결단이 옵니다."},
  "Uttara Bhadrapada":{core:"우타라 바드라파다는 심해의 뱀 아히르 부드냐가 주관합니다. 깊이 가라앉은 지혜가 있고, 서두르지 않아도 결국 도달합니다. 감정의 바닥이 넓어 어지간한 일에 흔들리지 않습니다.",shadow:"깊이가 정체로 바뀌면 시작 자체를 미룹니다. 무기력이 길어지기 쉽습니다.",reality:"상담·연구·종교·저술 분야와 인연이 깊습니다. 위기 상황에서 주변이 기대는 사람이 되며, 중년 이후 평판이 자산이 됩니다."},
  "Revati":{core:"레바티는 27수의 마지막, 여행의 신 푸샨이 주관하는 완성의 자리입니다. 사람과 상황을 끝까지 돌보고 안전하게 도착시키는 안내자 기질이 있습니다.",shadow:"끝맺음을 거부해 이미 끝난 관계를 붙잡습니다. 물질에 대한 불안이 의외로 큽니다.",reality:"돌봄·물류·여행·수의·복지 분야가 잘 맞습니다. 마무리와 인수인계를 맡기면 조직이 안심하는 유형입니다."}

function normalizeDoshaKey(value){
  if(!value)return"Vata";
  if(typeof value==="object"){
    value=value.type||value.name||value.korean||value.kr||value.key||value.dosha||"Vata";
  }
  const raw=String(value).trim().toLowerCase();
  if(/pitta|피타/.test(raw))return"Pitta";
  if(/kapha|카파/.test(raw))return"Kapha";
  return"Vata";
}

function refreshBhavaGlossary(){
  var root=document.getElementById(bhavaGlossaryRootId);
  if(!root) return;
  var wasVisible=root.classList&&root.classList.contains('visible');
  root.outerHTML=renderBhavaGlossary();
  var next=document.getElementById(bhavaGlossaryRootId);
  if(next&&next.classList&&(wasVisible||next.closest('.tab-panel.active'))){
    next.classList.add('visible');
  }
  if(typeof initReveal==='function') setTimeout(initReveal,0);
}

function setBhavaMeaning(n){
  var num=Number(n);
  if(!VEDA_BHAVA_DATA[num]) return;
  bhavaMeaningActive=num;
  refreshBhavaGlossary();
}

function closeBhavaMeaning(){
  bhavaMeaningActive=0;
  refreshBhavaGlossary();
}

function bhavaLabel(n){
  var num=Number(n);
  var info=BHAVA_INFO[num];
  if(!info) return String(n)+"바바(Bhava)";
  return String(num)+"바바(Bhava) "+info.sa;
}

function openBhavaMeaning(n){
  setBhavaMeaning(n);
}

function decorateBhavaTerms(html){
  return String(html||"").replace(/(1[0-2]|[1-9])바바\(Bhava\)/g,function(_,n){
    var num=Number(n);

// ─── ASTRONOMY ENGINE ─────────────────────────────────────
const nd=d=>((d%360)+360)%360;
const r2d=d=>d*Math.PI/180;

function julianDay(yr,mo,dy,hr){
  let y=yr,m=mo;if(m<=2){y--;m+=12;}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+dy+B-1524.5+hr/24;
}
function ayanamsa(jd){
  const T=(jd-2415020.0)/36524.2198782;
  return nd(22.460148+1.396468*T+0.000308*T*T);
}
const VEDIC_FALLBACK_MEAN_MOTION={
  Sun:{L0:280.46646,n:0.98564736},
  Moon:{L0:218.3165,n:13.17639648},
  Mercury:{L0:252.25084,n:4.09233445},
  Venus:{L0:181.97973,n:1.60213034},
  Mars:{L0:355.433,n:0.5240384},
  Jupiter:{L0:34.35152,n:0.08309103},
  Saturn:{L0:50.07744,n:0.03345965},
  Rahu:{L0:125.04452,n:-0.05295381}
};
function markVedicSwissFallbackUsed(){
  try{window.__vedicSwissFallbackUsed=true;}catch(_){ }
}
function calcPlanetsFallback(jd){
  markVedicSwissFallbackUsed();
  var d=Number(jd)-2451545.0;
  var ay=ayanamsa(jd);
  var sid={};
  Object.keys(VEDIC_FALLBACK_MEAN_MOTION).forEach(function(name){
    var cfg=VEDIC_FALLBACK_MEAN_MOTION[name]||{L0:0,n:0};
    var trop=nd(cfg.L0+cfg.n*d);
    sid[name]=nd(trop-ay);
  });
  sid.Ketu=nd(sid.Rahu+180);
  return sid;
}
function calcAscendantFallback(jd,lat,lon){
  markVedicSwissFallbackUsed();
  var T=(Number(jd)-2451545.0)/36525;
  var gmst=280.46061837+360.98564736629*(Number(jd)-2451545.0)+0.000387933*T*T-(T*T*T)/38710000;
  var lst=nd(gmst+Number(lon||0));
  var eps=23.439291-0.0130042*T;
  var phi=r2d(Math.max(-66,Math.min(66,Number(lat||0))));
  var theta=r2d(lst);
  var e=r2d(eps);
  var y=-Math.cos(theta);
  var x=Math.sin(theta)*Math.cos(e)+Math.tan(phi)*Math.sin(e);
  var asc=nd(Math.atan2(y,x)*180/Math.PI);
  return nd(asc-ayanamsa(jd));
}
function calcPlanets(jd){
  var swe=_vedicGetSwissBridge();
  if(!swe) return calcPlanetsFallback(jd);
  var calcFn=swe.swe_calc_ut||swe.calc_ut;
  if(typeof calcFn!=='function') return calcPlanetsFallback(jd);

  var flagSwiss=(typeof swe.SEFLG_SWIEPH==='number')?swe.SEFLG_SWIEPH:2;
  var flagSpeed=(typeof swe.SEFLG_SPEED==='number')?swe.SEFLG_SPEED:256;
  var flags=flagSwiss|flagSpeed;

  var ay=(typeof swe.swe_get_ayanamsa_ut==='function')?Number(swe.swe_get_ayanamsa_ut(jd)):NaN;
  if(!Number.isFinite(ay)) ay=ayanamsa(jd);

  var P={
    Sun:swe.SE_SUN,
    Moon:swe.SE_MOON,
    Mercury:swe.SE_MERCURY,
    Venus:swe.SE_VENUS,
    Mars:swe.SE_MARS,
    Jupiter:swe.SE_JUPITER,
    Saturn:swe.SE_SATURN,
    Rahu:(typeof swe.SE_TRUE_NODE==='number'?swe.SE_TRUE_NODE:swe.SE_MEAN_NODE)
  };
  if(typeof P.Rahu!=='number') return calcPlanetsFallback(jd);

  try{
    var sid={};
    Object.keys(P).forEach(function(name){
      var raw=calcFn.call(swe,jd,P[name],flags);
      var trop=_vedicReadSwissLon(raw,name);
      sid[name]=nd(trop-ay);
    });
    sid.Ketu=nd(sid.Rahu+180);
    return sid;
  }catch(_){
    return calcPlanetsFallback(jd);
  }
}
function calcAscendant(jd,lat,lon){
  var swe=_vedicGetSwissBridge();
  if(!swe) return calcAscendantFallback(jd,lat,lon);
  var houseFn=swe.swe_houses_ex||swe.swe_houses;
  if(typeof houseFn!=='function') return calcAscendantFallback(jd,lat,lon);
  try{
    var hs=(houseFn===swe.swe_houses_ex)?houseFn.call(swe,jd,0,lat,lon,'P'):houseFn.call(swe,jd,lat,lon,'P');
    var ascmc=hs&&hs.ascmc;
    var asc=ascmc&&ascmc.length?Number(ascmc[0]):NaN;
    if(!Number.isFinite(asc)) return calcAscendantFallback(jd,lat,lon);
    var ay=(typeof swe.swe_get_ayanamsa_ut==='function')?Number(swe.swe_get_ayanamsa_ut(jd)):NaN;
    if(!Number.isFinite(ay)) ay=ayanamsa(jd);
    return nd(asc-ay);
  }catch(_){
    return calcAscendantFallback(jd,lat,lon);
  }
}
function isRetrograde(planet,jd){
  if(["Sun","Moon"].includes(planet))return false;
  if(["Rahu","Ketu"].includes(planet))return true;
  const l1=calcPlanets(jd-0.5)[planet];
  const l2=calcPlanets(jd+0.5)[planet];
  const diff=nd(l2-l1);return diff>180;
}
function dignity(planet,sign){
  if(EXALT[planet]===sign)return"Exalted";
  if(DEBIL[planet]===sign)return"Debilitated";
  if(OWNSIGNS[planet]&&OWNSIGNS[planet].includes(sign))return"Own";
  return"Neutral";
}
function planetStrength(rasi,planet){
  const d=rasi.planets[planet].dignity;
  return d==="Exalted"?90:d==="Own"?75:d==="Debilitated"?15:50;
}
function planetHouse(rasi,planet){
  const i=rasi.houses.findIndex(h=>h.planets.includes(planet));
  return i<0?0:i+1;
}

// ─── CHART BUILDER (f.timezone = UTC 오프셋 시간, 예: 9 = UTC+9) ─
function buildChart(f,lonsOverride){
  try{window.__vedicSwissFallbackUsed=false;}catch(_){ }
  const utcH=f.hour+(f.minute||0)/60-f.timezone;
  const jd=julianDay(f.year,f.month,f.day,utcH);
  const lons=lonsOverride||calcPlanets(jd);
  const asc=calcAscendant(jd,f.lat,f.lon);
  const ps={};
  const allP=["Sun","Moon","Mercury","Venus","Mars","Jupiter","Saturn","Rahu","Ketu"];
  for(const p of allP){
    const lon=lons[p];const sign=Math.floor(nd(lon)/30);
    ps[p]={lon,sign,signName:SIGNS[sign],deg:nd(lon)%30,retro:isRetrograde(p,jd),dignity:dignity(p,sign)};
  }
  const lagnaSign=Math.floor(nd(asc)/30);
  const houses=Array.from({length:12},(_,h)=>{
    const si=(lagnaSign+h)%12;
    return{num:h+1,sign:SIGNS[si],signKr:SIGNKR[si],si,lord:SLORDS[si],planets:allP.filter(p=>ps[p].sign===si)};
  });
  const rasi={asc,ascSign:SIGNS[lagnaSign],ascSignKr:SIGNKR[lagnaSign],planets:ps,houses};
  // Nakshatra
  const SPAN=360/27;const ml=nd(ps.Moon.lon);
  const ni=Math.floor(ml/SPAN);const din=ml-ni*SPAN;
  const nak={idx:ni,name:NAKS[ni].n,lord:NAKS[ni].l,pada:Math.floor(din/(SPAN/4))+1,din};
  // Vimshottari Dasha
  const firstIdx=DSEQ.findIndex(d=>d.p===nak.lord);
  const bal=DSEQ[firstIdx].y*(1-din/SPAN);
  const bd=new Date(f.year,f.month-1,f.day,f.hour,(f.minute||0));
  const dashas=[];let dt=new Date(bd);
  for(let i=0;i<9;i++){
    const info=DSEQ[(firstIdx+i)%9];const dur=i===0?bal:info.y;
    const start=new Date(dt);const end=new Date(dt.getTime()+dur*365.25*86400000);
    const ants=[];let ad=new Date(start);
    for(let j=0;j<9;j++){
      const ai=DSEQ[(firstIdx+i+j)%9];const ay=dur*ai.y/120;
      const ae=new Date(ad.getTime()+ay*365.25*86400000);
      ants.push({p:ai.p,start:new Date(ad),end:new Date(ae)});ad=new Date(ae);
    }
    dashas.push({p:info.p,start,end,dur,ants});dt=new Date(end);
  }
  const now=new Date();
  const maha=dashas.find(d=>now>=d.start&&now<=d.end)||dashas[dashas.length-1];
  const anta=maha.ants.find(a=>now>=a.start&&now<=a.end)||maha.ants[0];
  // D9 Navamsa
  const d9={};const NAVS=30/9;
  const navStart={0:0,1:9,2:6,3:3,4:0,5:9,6:6,7:3,8:0,9:9,10:6,11:3};
  for(const p of allP){
    const pos=ps[p];const ni2=Math.floor(pos.deg/NAVS);const ss=navStart[pos.sign];
    const ns=(ss+ni2)%12;d9[p]={sign:ns,signName:SIGNS[ns]};
  }
  // D10 Dasamsa
  const d10={};
  for(const p of allP){
    const pos=ps[p];const di=Math.floor(pos.deg/3);
    const ss=pos.sign%2===0?pos.sign:(pos.sign+8)%12;
    const ds=(ss+di)%12;d10[p]={sign:ds,signName:SIGNS[ds]};
  }
  // 분할 차트 라그나 — 🔴 d9/d10 맵 안에 넣지 말 것.
  // Object.entries(d10)를 도는 코드(직업 D-10 판정)가 PKR['Asc']=undefined를 화면에 뱉는다.
  const ascDeg=nd(asc)%30;
  const d9AscIdx=(navStart[lagnaSign]+Math.floor(ascDeg/NAVS))%12;
  const d10AscIdx=((lagnaSign%2===0?lagnaSign:(lagnaSign+8)%12)+Math.floor(ascDeg/3))%12;
  const d9Asc={sign:d9AscIdx,signName:SIGNS[d9AscIdx]};
  const d10Asc={sign:d10AscIdx,signName:SIGNS[d10AscIdx]};
  return{f,rasi,nak,dashas,maha,anta,d9,d10,d9Asc,d10Asc};
}

function vedicNormalizeLang(langCode){
  var l=String(langCode||'ko');
  if(l==='jp') return 'ja';
  if(l.toLowerCase()==='zh-cn') return 'zh-CN';
  return l;
}

function vedicResolveInitialLang(){
  try{
    var q=new URLSearchParams(window.location.search||'');
    var fromQuery=q.get('lang');
    if(fromQuery) return vedicNormalizeLang(fromQuery);
  }catch(_){}
  try{
    var saved=localStorage.getItem('cd_lang');
    if(saved) return vedicNormalizeLang(saved);
  }catch(_){}
  return 'ko';
}

function vedicGetTranslatableNodes(){
  var all=document.querySelectorAll('body *');
  var list=[];
  for(var i=0;i<all.length;i++){
    var el=all[i];
    if(!el||!el.tagName) continue;
    var tag=String(el.tagName).toUpperCase();
    if(tag==='SCRIPT'||tag==='STYLE'||tag==='NOSCRIPT'||tag==='CANVAS') continue;
    if(el.children&&el.children.length) continue;
    var txt=(el.textContent||'').replace(/\s+/g,' ').trim();
    if(!txt||txt.length<2) continue;
    if(/^[\d\s.,:%+\-_/()]+$/.test(txt)) continue;
    if(txt.length>1200) continue;
    if(!el.dataset.vedicSrcText){
      el.dataset.vedicSrcText=txt;
    }
    list.push(el);
  }
  return list;
}

function vedicChunkTexts(nodes, maxItems, maxChars){
  var chunks=[];
  var curNodes=[];
  var curTexts=[];
  var curChars=0;
  for(var i=0;i<nodes.length;i++){
    var t=(nodes[i] && nodes[i].dataset && nodes[i].dataset.vedicSrcText) || '';
    var ln=t.length;
    if(!ln) continue;
    if(curNodes.length>=maxItems || (curChars+ln)>maxChars){
      if(curNodes.length){
        chunks.push({ nodes:curNodes, texts:curTexts });
      }
      curNodes=[];
      curTexts=[];
      curChars=0;
    }
    curNodes.push(nodes[i]);
    curTexts.push(t);
    curChars+=ln;
  }
  if(curNodes.length){
    chunks.push({ nodes:curNodes, texts:curTexts });
  }
  return chunks;
}

function vedicWaitForGoogleCombo(timeoutMs){
  var started=Date.now();
  return new Promise(function(resolve,reject){
    (function poll(){
      var combo=document.querySelector('#vedicGoogleTranslateHost .goog-te-combo')||document.querySelector('.goog-te-combo');
      if(combo) return resolve(combo);
      if(Date.now()-started>(timeoutMs||7000)) return reject(new Error('google_translate_combo_timeout'));
      setTimeout(poll,120);
    })();
  });
}

    }

      if(window.google&&window.google.translate&&window.google.translate.TranslateElement){
        if(!window.__vedicGoogleWidgetMounted){
          new window.google.translate.TranslateElement({
            pageLanguage:'ko',
            includedLanguages:'en,ja,zh-CN,hi,es,fr',
            autoDisplay:false,
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'vedicGoogleTranslateHost');
          window.__vedicGoogleWidgetMounted=true;
        }

      }

    }

    window.__vedicGoogleTranslateInit=function(){
      try{
        if(!window.google||!window.google.translate||!window.google.translate.TranslateElement){
          return reject(new Error('google_translate_not_available'));

            autoDisplay:false,

          }, 'vedicGoogleTranslateHost');
          window.__vedicGoogleWidgetMounted=true;
        }
        onReady();
      }catch(err){
        reject(err);
      }
    };

    var script=document.querySelector('script[data-vedic-google-translate="1"]');
    if(!script){
      script=document.createElement('script');

function vedicApplyTranslatedText(langCode){
  var normalized=vedicNormalizeLang(langCode);
  VEDIC_LANG_STATE.current=normalized;
  try{ localStorage.setItem('cd_lang', normalized); }catch(_){}
  var nodes=vedicGetTranslatableNodes();
  if(!nodes.length) return Promise.resolve();
  if(normalized==='ko'){
    nodes.forEach(function(el){
      if(el&&typeof el.dataset.vedicSrcText==='string'){
        el.textContent=el.dataset.vedicSrcText;
      }
    });
    document.documentElement.setAttribute('lang','ko');
    try{
      var host=window.location.hostname||'';
      var bare=host.replace(/^www\./,'');
      document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      if(bare){
        document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain='+bare+'; path=/;';
        document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=.'+bare+'; path=/;';
      }
    }catch(_){}
    vedicSetLangStatus('Korean applied', false);
    return Promise.resolve();
  }
  var token=Date.now()+Math.random();
  VEDIC_LANG_STATE.token=token;
  VEDIC_LANG_STATE.translating=true;
  vedicSetLangStatus('Translating with Google...', false);
  return vedicApplyGoogleLanguage(normalized)
    .then(function(){
      if(VEDIC_LANG_STATE.token!==token) return;
      document.documentElement.setAttribute('lang', normalized);
      vedicSetLangStatus('Language applied (Google)', false);
    })
    .catch(function(err){
      console.warn('[vedic] translation failed:', err && err.message ? err.message : err);
      vedicSetLangStatus('Google translation failed. Check network/script load.', true);
    })
    .finally(function(){
      if(VEDIC_LANG_STATE.token===token) VEDIC_LANG_STATE.translating=false;
    });
}

function initReveal(){
  const els=document.querySelectorAll('.reveal');
  if(!els.length)return;
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
  },{threshold:0.08});
  els.forEach(el=>obs.observe(el));
}

function centerActiveTab(btn){
  const bar=document.getElementById('vedicTabBar');
  if(!bar||!btn)return;
  const target=btn.offsetLeft-(bar.clientWidth/2)+(btn.clientWidth/2);
  const max=Math.max(0,bar.scrollWidth-bar.clientWidth);
  const next=Math.max(0,Math.min(max,target));
  try{ bar.scrollTo({left:next,behavior:'smooth'}); }
  catch(_){ bar.scrollLeft=next; }
}

function switchTabRelative(step){
  const order=['overview','personality','relation','moneywork','dasha','energy','deep'];
  const current=order.indexOf(G.activeTab||'overview');
  const nextIndex=Math.max(0,Math.min(order.length-1,current+step));
  if(nextIndex!==current) switchTab(order[nextIndex]);
}

function updateTabBarState(){
  const nav=document.getElementById('vedicTabNav');
  const bar=document.getElementById('vedicTabBar');
  const prev=document.getElementById('vedicTabPrev');
  const next=document.getElementById('vedicTabNext');
  if(!nav||!bar)return;
  const maxLeft=Math.max(0,bar.scrollWidth-bar.clientWidth-1);
  const atStart=bar.scrollLeft<=2;
  const atEnd=bar.scrollLeft>=maxLeft;
  nav.classList.toggle('has-left-shadow',!atStart);
  nav.classList.toggle('has-right-shadow',!atEnd);
  if(prev) prev.disabled=atStart;
  if(next) next.disabled=atEnd;
}

async function copyCurrentVedicDataSnapshot(){

    const text=JSON.stringify(snapshot,null,2);
    if(navigator&&navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){
      await navigator.clipboard.writeText(text);
    }else{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.setAttribute('readonly','readonly');
      ta.style.position='absolute';
      ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    alert('상담용 차트 데이터를 복사했습니다.');
  }catch(_){
    alert('복사에 실패했습니다. 잠시 후 다시 시도해 주세요.');

}

/* 이 페이지는 js/saju-engine.js 를 로드하지 않아 공용 _cdAIPromptBuildRequestId 를 쓸 수 없다.
   같은 알고리즘을 페이지 로컬로 둔다 — 대안(공용 파일 신설 + 전 페이지 script 태그)은 파급이 훨씬 크다. */
function vedicAiHashText(value){
  var text=String(value==null?'':value);
  var hash=2166136261;
  for(var i=0;i<text.length;i+=1){
    hash^=text.charCodeAt(i);
    hash+=(hash<<1)+(hash<<4)+(hash<<7)+(hash<<8)+(hash<<24);
  }
  return (hash>>>0).toString(36);
}

/* 같은 (차트·질문·궁합·epoch) 이면 항상 같은 requestId 를 만든다. 워커 consume 은 requestId 멱등이라,
   생성 실패 후 재시도가 재차감을 부르지 않는다. epoch 는 생성 성공 시에만 올라간다. */
function vedicAiCreateRequestId(chart,question,compatibilityResult,epoch){
  const seed=[
    'vedic-ai-prompt-v1',
    vedicAiBuildChartKey(chart),
    String(question||'').trim().replace(/\s+/g,' '),
    (function(){ try{ return JSON.stringify(compatibilityResult||null); }catch(_){ return ''; } })(),
    String(Number(epoch||0))
  ].join('|');
  return 'vedic-ai-prompt:v1-'+vedicAiHashText(seed)+vedicAiHashText(seed.length+'|'+seed);
}

/* 워커가 "결제 권한을 보존한 채 실패"라고 명시했을 때만 증거를 보관한다(fail-closed).
   구버전 워커 응답에는 이 필드가 없으므로 자동 보관되지 않아, 환불된 결제로 무료 생성이 되지 않는다. */
function vedicAiShouldRetainEvidence(payload){
  const item=payload&&typeof payload==='object'?payload:{};
  return item.paymentRetainedForRetry===true&&item.refundOk!==true;
}

const VEDIC_AI_RETRY_HINT=' 이미 결제가 확인되었으니 추가 결제 없이 다시 시도할 수 있습니다.';

function vedicAiPayloadLayers(payload){
  var layers=[];
  var cursor=payload&&typeof payload==='object'?payload:{};
  for(var i=0;i<4&&cursor&&typeof cursor==='object';i+=1){
    if(layers.indexOf(cursor)>=0)break;
    layers.push(cursor);
    if(cursor.data&&typeof cursor.data==='object')cursor=cursor.data;
    else if(cursor.payload&&typeof cursor.payload==='object')cursor=cursor.payload;
    else break;
  }
  return layers.length?layers:[{}];
}

function vedicAiFirstObject(layers,key){
  for(var i=0;i<layers.length;i+=1){
    var value=layers[i]&&layers[i][key];
    if(value&&typeof value==='object')return value;
  }
  return {};
}

function vedicAiFirstString(layers,keys){
  for(var i=0;i<layers.length;i+=1){
    for(var j=0;j<keys.length;j+=1){
      var text=String((layers[i]&&layers[i][keys[j]])||'').trim();
      if(text)return text;
    }
  }
  return '';
}

function vedicAiGateEvidence(gateResult,requestId){
  var gate=gateResult&&typeof gateResult==='object'?gateResult:{};
  var payload=gate.payload&&typeof gate.payload==='object'?gate.payload:gate;
  var layers=vedicAiPayloadLayers(payload);
  var consume=vedicAiFirstObject(layers,'consume');
  var accessGrant=vedicAiFirstObject(layers,'accessGrant');
  var accessDecision=vedicAiFirstObject(layers,'accessDecision');
  var payment=vedicAiFirstObject(layers,'payment');
  var evidenceRequestId=String(
    requestId
    || accessGrant.requestId
    || accessDecision.requestId
    || consume.requestId
    || vedicAiFirstString(layers,['requestId','purchaseId'])
    || ''
  ).trim();
  var accessType=vedicAiFirstString(layers,['accessType','transactionType'])||String(accessGrant.accessType||accessDecision.accessType||consume.accessType||'').trim();
  var accessMethod=vedicAiFirstString(layers,['accessMethod','paymentMethod'])||String(accessGrant.accessMethod||accessDecision.accessMethod||accessDecision.paymentMethod||consume.accessMethod||consume.paymentMethod||'').trim();
  var paymentMode=vedicAiFirstString(layers,['paymentMode','accessMode'])||String(accessGrant.paymentMode||accessDecision.paymentMode||consume.paymentMode||'').trim();
  var ledgerId=vedicAiFirstString(layers,['ledgerId','monthlyCreditLedgerId']);
  var transactionId=vedicAiFirstString(layers,['transactionId','ledgerId','paymentId','purchaseId'])
    || String(consume.transactionId||accessGrant.evidenceId||accessGrant.purchaseId||accessDecision.transactionId||accessDecision.evidenceId||accessDecision.purchaseId||'').trim();
  return {
    requestId:evidenceRequestId,
    accessGrant:accessGrant,
    accessDecision:accessDecision,
    freeBySubscription:layers.some(function(layer){return layer&&layer.freeBySubscription===true;}),
    consume:consume,
    payment:payment&&Object.keys(payment).length?payment:undefined,
    _paymentContext:{
      requestId:evidenceRequestId,
      featureKey:vedicAiFirstString(layers,['featureKey','serviceKey','contentId'])||String(accessGrant.featureKey||accessDecision.featureKey||consume.featureKey||VEDIC_AI_PROMPT_FEATURE_KEY).trim(),
      transactionId:transactionId,
      ledgerId:ledgerId||String(consume.ledgerId||accessGrant.ledgerId||accessDecision.ledgerId||'').trim(),
      purchaseId:vedicAiFirstString(layers,['purchaseId'])||String(accessGrant.purchaseId||consume.purchaseId||evidenceRequestId).trim(),
      idempotencyKey:vedicAiFirstString(layers,['idempotencyKey'])||evidenceRequestId,
      accessType:accessType,
      accessMethod:accessMethod,
      paymentMode:paymentMode
    }
  };
}

// 베다 AI 상담 답변 렌더 — 밝은 텍스트(다크 패널용), 잘린 JSON 원문 방어.
function vedicRenderAnswerHtml(text){
  var raw=String(text||'').replace(/\r\n/g,'\n').trim();
  raw=raw.replace(/```[a-zA-Z]*\n?/g,'').replace(/```/g,'').trim();
  if(/^[\[{]/.test(raw)){
    var extracted='';
    try{
      var parsed=JSON.parse(raw); var collected=[];
      (function walk(v){ if(typeof v==='string'){ if(v.trim()) collected.push(v.trim()); } else if(Array.isArray(v)){ v.forEach(walk); } else if(v&&typeof v==='object'){ Object.keys(v).forEach(function(k){ walk(v[k]); }); } })(parsed);
      extracted=collected.join('\n\n');
    }catch(_){ extracted=raw.replace(/"[a-zA-Z_][\w]*"\s*:/g,' ').replace(/[{}\[\]"]/g,' ').replace(/[ \t]+/g,' ').replace(/\s*,\s*/g,'\n').trim(); }
    if(extracted) raw=extracted;
  }
  if(!raw) return '<p style="margin:0;color:#e2e8f0;">상담문을 불러오지 못했습니다. 다시 시도해 주세요.</p>';
  var lines=raw.split(/\n+/); var html='';
  lines.forEach(function(line){
    var t=String(line||'').trim(); if(!t) return;
    t=t.replace(/^#{1,4}\s*/,'');
    var headMatch=t.match(/^(\d{1,2})\s*[.)]\s*(.+)$/);
    var boldMatch=t.match(/^\*\*(.+?)\*\*\s*[:：]?\s*$/);
    if(headMatch&&headMatch[2].length<=40){
      html+='<h4 style="margin:16px 0 8px;color:#fde68a;font-size:0.95rem;font-weight:900;line-height:1.5;word-break:keep-all;">'+hEsc(headMatch[1]+'. '+headMatch[2].replace(/\*\*/g,''))+'</h4>';
    }else if(boldMatch){
      html+='<h4 style="margin:16px 0 8px;color:#fde68a;font-size:0.95rem;font-weight:900;line-height:1.5;word-break:keep-all;">'+hEsc(boldMatch[1])+'</h4>';
    }else{
      html+='<p style="margin:0 0 11px;color:#e8f0ff;font-size:0.86rem;line-height:1.86;word-break:keep-all;">'+hEsc(t).replace(/\*\*(.+?)\*\*/g,'<strong style="color:#fff;">$1</strong>')+'</p>';
    }
  });
  return html||'<p style="margin:0;color:#e2e8f0;">상담문을 불러오지 못했습니다.</p>';
}

function vedicAiRefreshUi(){
  const state=vedicAiEnsureState();
  const qEl=document.getElementById('vedicAiQuestion');
  const cEl=document.getElementById('vedicAiCharCount');
  const sEl=document.getElementById('vedicAiStatus');
  const gBtn=document.getElementById('vedicAiGenerateBtn');
  const cpBtn=document.getElementById('vedicAiCopyBtn');
  const reBtn=document.getElementById('vedicAiRegenerateBtn');
  const wrap=document.getElementById('vedicAiPromptWrap');
  const promptEl=document.getElementById('vedicAiPromptText');
  const metaEl=document.getElementById('vedicAiPromptMeta');
  const answerEl=document.getElementById('vedicAiAnswer');
  const compatEl=document.getElementById('vedicAiCompatState');

  if(qEl && qEl.value!==state.question) qEl.value=state.question;
  if(cEl) cEl.textContent=String((state.question||'').length);
  if(sEl){
    sEl.textContent=state.statusMessage||'';
    sEl.style.color=state.statusError?'#fda4af':'var(--text3)';
  }
  if(gBtn){
    gBtn.disabled=!!state.inFlight;
    // 결제 권한이 보존된 실패 뒤에는 추가 결제가 없다는 것을 버튼에서도 알린다.
    gBtn.textContent=state.inFlight
      ?'상담 생성 중...'
      :(state.paidEvidence?'🔄 추가 결제 없이 다시 상담 받기':'✨ AI 상담 받기 (10,000원)');
  }
  if(cpBtn) cpBtn.disabled=!state.prompt||state.inFlight;
  if(reBtn) reBtn.disabled=!state.prompt||state.inFlight;
  if(answerEl){
    if(state.resultText){ answerEl.innerHTML=vedicRenderAnswerHtml(state.resultText); answerEl.style.display='block'; }
    else{ answerEl.style.display='none'; }
  }
  if(wrap) wrap.style.display=state.prompt?'block':'none';
  if(promptEl) promptEl.textContent=state.prompt||'';
  if(metaEl){
    if(state.prompt){
      const qLabel=VEDIC_AI_QUESTION_TYPE_LABELS[state.questionType]||VEDIC_AI_QUESTION_TYPE_LABELS.general;
      const charged=Number(state.lastChargedCoins||0);
      const remain=Number.isFinite(state.balanceAfter)?' · 잔여 가치 '+Number(state.balanceAfter).toLocaleString('ko-KR'):'';
      const compat=state.compatibilityHint?(' · '+state.compatibilityHint):'';
      metaEl.textContent='유형: '+qLabel+' · 승인: '+charged+remain+compat;
    }else{
      metaEl.textContent='';
    }
  }
  if(compatEl){
    const hasCompat=!!G.vedicCompatibilityResult;
    compatEl.textContent='궁합 컨텍스트: '+(hasCompat?'연결됨':'미연결');
    compatEl.className='tag '+(hasCompat?'tag-gold':'tag-purple');
  }
}
