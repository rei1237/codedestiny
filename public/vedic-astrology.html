async function vedicAiGeneratePrompt(){
  const state=vedicAiEnsureState();
  const qEl=document.getElementById('vedicAiQuestion');
  if(qEl) state.question=String(qEl.value||'').slice(0,1000);
  const question=String(state.question||'').trim();

  if(state.inFlight){
    state.statusError=true;
    state.statusMessage='이전 요청을 처리 중입니다. 잠시 후 다시 시도해 주세요.';
    vedicAiRefreshUi();
    return;
  }
  if(question.length<5||question.length>1000){
    state.statusError=true;
    state.statusMessage='질문은 5자 이상 1000자 이하로 입력해 주세요.';
    vedicAiRefreshUi();
    return;
  }

  const snapshot=buildCurrentVedicDataSnapshot(G.chart,G.report);
  if(!snapshot){
    state.statusError=true;
    state.statusMessage='기본 베다 결과가 없어 상담 질문을 정리할 수 없습니다.';
    vedicAiRefreshUi();
    return;
  }

  state.inFlight=true;
  state.statusError=false;
  state.statusMessage='상담 답변을 작성 중입니다. 최대 1~2분 정도 걸릴 수 있고, 생성 성공 시에만 10,000원 결제가 확인됩니다.';
  vedicAiRefreshUi();
  _vedicSetPaymentPending(true,'베다 AI 상담 결제/생성 확인 중입니다...');

  try{
    let token='';
    try{ token=localStorage.getItem('fortune_auth_token')||''; }catch(_){ }
    const headers={ 'Content-Type':'application/json' };
    if(token) headers.Authorization='Bearer '+token;
    const requestId=vedicAiCreateRequestId(G.chart,question,G.vedicCompatibilityResult||null,state.requestEpoch);
    // 이미 결제가 확인된 재시도면 게이트를 다시 열지 않는다(재결제 차단).
    const reuse=(state.paidRequestId===requestId&&state.paidEvidence)?state.paidEvidence:null;
    const gate=reuse||await vedicAiPaidGate(requestId);

    if(!reuse&&(!gate||gate.ok!==true)){
      const code=String(gate&&gate.code||'PAYMENT_REQUIRED').trim();
      state.paidEvidence=null;
      state.paidRequestId='';
      state.statusError=true;
      state.statusMessage=vedicAiStatusText(code, gate&&gate.message);
      if((gate&&gate.status)===401||code==='AUTH_REQUIRED'){
        if(window.confirm('로그인이 필요합니다. 로그인 화면으로 이동할까요?')){
          window.location.href='/login?next='+encodeURIComponent(location.pathname+location.search);
        }
      }
      vedicAiRefreshUi();
      return;
    }

    headers['idempotency-key']=gate.requestId||requestId;
    state.statusError=false;
    state.statusMessage=reuse
      ? '이미 확인된 결제 권한으로 추가 결제 없이 상담 답변을 다시 만들고 있습니다.'
      : '결제 권한이 확인되었습니다. 상담 답변을 작성하고 있습니다.';
    vedicAiRefreshUi();

    // 게이트(결제)는 위에서 1회만. 생성 POST만 일시 503/네트워크 시 동일 requestId로 자동 재시도.
    const vedicAiBody=JSON.stringify({
      requestId:gate.requestId||requestId,
      question:question,
      vedicResult:snapshot,
      compatibilityResult:G.vedicCompatibilityResult||null,
      accessGrant:gate.accessGrant,
      accessDecision:gate.accessDecision,
      freeBySubscription:gate.freeBySubscription===true,
      consume:gate.consume,
      payment:gate.payment,
      _paymentContext:gate._paymentContext
    });
    let resp=null,data={};
    for(let attempt=1;attempt<=3;attempt++){
      try{
        resp=await fetch('/api/fortune/vedic/ai-prompt',{method:'POST',headers:headers,body:vedicAiBody});
        data=await resp.json().catch(function(){ return {}; });
      }catch(fetchErr){
        if(attempt<3){ await new Promise(function(r){setTimeout(r,900*attempt);}); continue; }
        throw fetchErr;
      }
      const _vCode=String(data&&data.code||'').toUpperCase();
      const _vTransient=resp.status===503||_vCode==='SERVICE_TEMPORARILY_UNAVAILABLE'||_vCode==='PAID_ACCESS_VERIFY_RETRYABLE'||_vCode==='DB_DEGRADED';
      if(_vTransient&&attempt<3){ await new Promise(function(r){setTimeout(r,900*attempt);}); continue; }
      break;
    }

    if(!resp.ok){
      const code=String(data&&data.code||'').trim();
      // 결제는 확인됐는데 생성만 실패 — 서버가 환불하지 않았을 때만 증거를 보관해 무료 재시도를 연다.
      if(vedicAiShouldRetainEvidence(data)){
        state.paidEvidence=gate;
        state.paidRequestId=requestId;
      }else{
        state.paidEvidence=null;
        state.paidRequestId='';
      }
      state.statusError=true;
      state.statusMessage=vedicAiStatusText(code, data&&data.message)+(state.paidEvidence?VEDIC_AI_RETRY_HINT:'');
      if(code==='AUTH_REQUIRED'&&window.confirm('로그인이 필요합니다. 로그인 화면으로 이동할까요?')){
        window.location.href='/login?next='+encodeURIComponent(location.pathname+location.search);
      }
      vedicAiRefreshUi();
      return;
    }

    state.resultText=String(data&&data.resultText||'').trim();
    // 프롬프트는 무료 동봉(generatedPrompt) — 답변과 함께 접이식으로 제공.
    state.prompt=String(data&&data.generatedPrompt||data&&data.prompt||'').trim();
    state.questionType=String(data&&data.questionType||'general');
    state.lastChargedCoins=Math.max(0, Number(data&&data.chargedCoins||0));
    state.balanceAfter=Number.isFinite(Number(data&&data.balanceAfter))?Number(data.balanceAfter):null;
    state.compatibilityHint=String(data&&data.compatibilityHint||'').trim();
    // 성공했으므로 이 결제 증거는 소진됐다. epoch를 올려 같은 질문 재요청이 정상 결제로 가게 한다.
    state.paidEvidence=null;
    state.paidRequestId='';
    state.requestEpoch=Number(state.requestEpoch||0)+1;
    state.statusError=false;
    state.statusMessage='AI 상담 완성: '+(Number(state.lastChargedCoins||0)*100).toLocaleString('ko-KR')+'원 결제 확인'+(Number.isFinite(state.balanceAfter)?(' · 잔여 원화 가치 '+(Number(state.balanceAfter)*100).toLocaleString('ko-KR')+'원'):'');
    if(Number.isFinite(state.balanceAfter)) vedicAiSyncBalance(state.balanceAfter);
    vedicAiRefreshUi();
  }catch(e){
    console.error('[vedic ai prompt]', e);
    state.statusError=true;
    state.statusMessage='네트워크 또는 서버 오류로 생성에 실패했습니다. 잠시 후 다시 시도해 주세요.';
    vedicAiRefreshUi();
  }finally{
    state.inFlight=false;
    _vedicSetPaymentPending(false);
    vedicAiRefreshUi();
  }
}

async function vedicAiCopyPrompt(){
  const state=vedicAiEnsureState();
  const text=String(state.prompt||'').trim();
  if(!text){
    alert('복사할 상담 질문이 없습니다. 먼저 정리해 주세요.');
    return;
  }
  try{
    if(navigator&&navigator.clipboard&&typeof navigator.clipboard.writeText==='function'){
      await navigator.clipboard.writeText(text);
    }else{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.setAttribute('readonly','readonly');
      ta.style.position='absolute';
      ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    state.statusError=false;
    state.statusMessage='정리된 상담 질문을 클립보드에 복사했습니다.';
    vedicAiRefreshUi();
  }catch(_){
    state.statusError=true;
    state.statusMessage='복사에 실패했습니다. 다시 시도해 주세요.';
    vedicAiRefreshUi();
  }
}

const VEDIC_PRASHNA_FEATURE_KEY='vedic_prashna_prompt';
const VEDIC_PRASHNA_AMOUNT_KRW=5000;
const VEDIC_PRASHNA_PRICE=50;
const VEDIC_PRASHNA_STEPS=[
  '결제를 확인하고 있습니다.',
  '질문 시각과 위치를 고정했습니다.',
  '프라슈나 차트를 계산하고 있습니다.',

  '복사용 프롬프트를 만들고 있습니다.'

function vedicPrashnaCreateState(){
  var f=G.chart&&G.chart.f?G.chart.f:{};
  return {
    question:'',
    latitude:(Number.isFinite(Number(f.lat))?Number(f.lat).toFixed(6):''),
    longitude:(Number.isFinite(Number(f.lon))?Number(f.lon).toFixed(6):''),
    locationMode:'manual',
    snapshot:null,
    order:null,
    prompt:'',
    chart:null,
    result:null,
    confirmOpen:false,
    confirmed:false,
    chartOpen:false,
    inFlight:false,
    statusError:false,
    loadingStep:0,
    statusMessage:'프라슈나는 한 번에 하나의 구체적인 질문을 다룰 때 판단 기준이 가장 선명해집니다.'
  };
}

function vedicPrashnaEnsureState(){
  if(!G.vedicPrashna) G.vedicPrashna=vedicPrashnaCreateState();
  return G.vedicPrashna;
}

function vedicPrashnaTrack(name,payload){
  try{
    var safe=Object.assign({event:name,featureKey:VEDIC_PRASHNA_FEATURE_KEY},payload||{});
    delete safe.question;
    delete safe.latitude;
    delete safe.longitude;
    if(window.dataLayer&&typeof window.dataLayer.push==='function') window.dataLayer.push(safe);
  }catch(_){}
}

function vedicPrashnaSetStatus(message,isError){
  var state=vedicPrashnaEnsureState();
  state.statusMessage=String(message||'');
  state.statusError=!!isError;
  vedicPrashnaRefreshUi();
}

function vedicPrashnaSetQuestion(value){
  var state=vedicPrashnaEnsureState();
  state.question=String(value||'').slice(0,600);
  vedicPrashnaRefreshUi();
}

function vedicPrashnaSetLocationMode(mode){
  var state=vedicPrashnaEnsureState();
  state.locationMode=mode==='current'?'current':'manual';

  vedicPrashnaRefreshUi();
}

function vedicPrashnaSetCoord(kind,value){
  var state=vedicPrashnaEnsureState();

  if(kind==='lon') state.longitude=String(value||'').slice(0,24);

}

function vedicPrashnaUseExample(text){
  var state=vedicPrashnaEnsureState();
  state.question=String(text||'').slice(0,600);
  state.statusError=false;
  state.statusMessage='예시 질문을 적용했습니다.';
  vedicPrashnaRefreshUi();
}

function vedicPrashnaValidateClient(){
  var state=vedicPrashnaEnsureState();
  var question=String(state.question||'').trim().replace(/\s+/g,' ');
  var lat=Number(state.latitude);
  var lon=Number(state.longitude);
  if(!question){
    return '질문이 비어 있습니다.';
  }
  if(question.length<12){
    return '결과의 판단 기준을 분명하게 만들 수 있도록 대상, 상황, 확인하고 싶은 내용을 조금 더 구체적으로 적어주세요.';
  }
  if(question.length>600){
    return '질문은 600자 이하로 입력해 주세요.';
  }
  if((question.match(/[?？]/g)||[]).length>1 || ((question.match(/그리고|또는|혹은|동시에/g)||[]).length>=2)){
    return '프라슈나는 한 번에 하나의 질문을 다룹니다. 가장 먼저 확인하고 싶은 질문 하나만 남겨주세요.';
  }
  if(!Number.isFinite(lat)||!Number.isFinite(lon)){
    return '프라슈나 차트를 생성하려면 현재 위치 또는 위도·경도가 필요합니다.';
  }
  if(lat<-90||lat>90||lon<-180||lon>180){
    return '위도는 -90~90, 경도는 -180~180 사이로 입력해 주세요.';
  }
  return '';
}

    if(token) headers.Authorization='Bearer '+token;

  return headers;
}

  }
}

function vedicPrashnaUseCurrentLocation(){
  var state=vedicPrashnaEnsureState();
  state.locationMode='current';
  if(!navigator.geolocation){
    vedicPrashnaSetStatus('현재 위치를 불러올 수 없습니다. 위도·경도를 직접 입력해 주세요.',true);
    return;
  }
  state.inFlight=true;
  state.statusError=false;
  state.statusMessage='위치 권한은 프라슈나 차트의 시간대와 라그나를 계산하는 데에만 사용됩니다.';
  vedicPrashnaRefreshUi();
  navigator.geolocation.getCurrentPosition(function(pos){
    state.inFlight=false;
    state.latitude=Number(pos.coords.latitude).toFixed(6);
    state.longitude=Number(pos.coords.longitude).toFixed(6);
    state.statusError=false;
    state.statusMessage='현재 위치를 불러왔습니다. 입력된 위치의 시간대는 자동으로 확인됩니다.';
    vedicPrashnaTrack('prashna_location_selected',{mode:'current'});
    vedicPrashnaRefreshUi();
  },function(){
    state.inFlight=false;
    state.locationMode='manual';
    state.statusError=true;
    state.statusMessage='현재 위치 권한이 거부되었습니다. 위도·경도를 직접 입력해 주세요.';
    vedicPrashnaRefreshUi();
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}

function vedicPrashnaCreateRequestId(orderId){
  return String(orderId||('vedic-prashna:'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9))).slice(0,120);
}

function vedicPrashnaGateEvidence(gateResult,requestId){
  var evidence=vedicAiGateEvidence(gateResult,requestId);
  evidence._paymentContext=evidence._paymentContext||{};
  evidence._paymentContext.featureKey=VEDIC_PRASHNA_FEATURE_KEY;
  evidence._paymentContext.requestId=evidence._paymentContext.requestId||requestId;
  evidence._paymentContext.idempotencyKey=evidence._paymentContext.idempotencyKey||requestId;
  return evidence;
}

async function vedicPrashnaPaidGate(snapshot){
  var requestId=vedicPrashnaCreateRequestId(snapshot&&snapshot.orderId);
  if(typeof window._cdOpenPaidServiceGate!=='function'){
    return {ok:false,status:402,code:'PAYMENT_REQUIRED',message:'결제 선택창을 열 수 없습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.'};
  }
  var result=await window._cdOpenPaidServiceGate({
    title:'프라슈나 프롬프트',
    reason:'프라슈나 프롬프트',
    featureKey:VEDIC_PRASHNA_FEATURE_KEY,
    categoryKey:'vedic',
    subFeatureKey:'prashna-prompt',
    serviceKey:'vedic-prashna-prompt',
    action:'generateVedicPrashnaPrompt',
    coinPrice:VEDIC_PRASHNA_PRICE,
    cost:VEDIC_PRASHNA_PRICE,
    amountKrw:VEDIC_PRASHNA_AMOUNT_KRW,
    amountKRW:VEDIC_PRASHNA_AMOUNT_KRW,
    paymentAmount:VEDIC_PRASHNA_AMOUNT_KRW,
    membershipCreditCost:0,
    forcePassFirst:false,
    requestId:requestId
  });
  if(result&&result.status==='granted'){
    return Object.assign({ok:true,status:200},vedicPrashnaGateEvidence(result,requestId));
  }
  return {
    ok:false,
    status:402,
    code:'PAYMENT_REQUIRED',
    message:String((result&&(result.message||result.reason))||'결제가 완료되지 않았습니다. 이용 금액은 청구되지 않았으며 프라슈나 차트도 생성되지 않았습니다.').trim()
  };
}

async function vedicPrashnaCreateSnapshot(){
  var state=vedicPrashnaEnsureState();
  var err=vedicPrashnaValidateClient();
  if(err){
    vedicPrashnaSetStatus(err,true);
    return;
  }
  state.inFlight=true;
  state.statusError=false;
  state.statusMessage='질문 시각을 서버에서 고정하고 위치의 시간대를 확인하고 있습니다.';
  state.snapshot=null;
  state.order=null;
  state.confirmed=false;
  state.confirmOpen=false;
  vedicPrashnaRefreshUi();
  try{
    var resp=await fetch('/api/fortune/vedic/prashna/snapshot',{
      method:'POST',
      headers:vedicPrashnaReadAuthHeaders(),
      body:JSON.stringify({
        question:String(state.question||'').trim(),
        latitude:Number(state.latitude),
        longitude:Number(state.longitude)
      })
    });
    var data=await resp.json().catch(function(){return{};});
    if(!resp.ok){
      if(data&&data.code==='AUTH_REQUIRED') vedicPrashnaLoginPrompt();
      vedicPrashnaSetStatus(String(data&&data.message||'시간대 확인 실패: 위치를 다시 입력하거나 시간대를 확인해 주세요.'),true);
      return;
    }
    state.snapshot=data.snapshot||null;
    state.order=data.order||null;
    state.confirmOpen=true;
    state.confirmed=false;
    state.statusError=false;
    state.statusMessage='아래 질문·시각·위치를 기준으로 프라슈나 차트가 생성됩니다.';
    vedicPrashnaTrack('prashna_snapshot_created',{orderId:state.order&&state.order.orderId});
    vedicPrashnaRefreshUi();
  }catch(e){
    console.error('[vedic prashna snapshot]',e);
    vedicPrashnaSetStatus('시간대 확인 실패: 위치를 다시 입력하거나 시간대를 확인해 주세요.',true);
  }finally{
    state.inFlight=false;
    vedicPrashnaRefreshUi();
  }
}

async function vedicPrashnaConfirmGenerate(){
  var state=vedicPrashnaEnsureState();
  if(!state.snapshot||!state.order){
    vedicPrashnaSetStatus('주문 스냅샷이 필요합니다. 다시 생성해 주세요.',true);
    return;
  }
  if(!state.confirmed){
    vedicPrashnaSetStatus('질문, 시각, 위치와 결제 금액을 확인해 주세요.',true);
    return;
  }
  state.confirmOpen=false;
  state.inFlight=true;
  state.statusError=false;
  state.loadingStep=0;
  state.statusMessage=VEDIC_PRASHNA_STEPS[0];
  state.prompt='';
  state.chart=null;
  state.result=null;
  vedicPrashnaTrack('prashna_checkout_started',{orderId:state.order.orderId});
  vedicPrashnaRefreshUi();
  _vedicSetPaymentPending(true,VEDIC_PRASHNA_STEPS[0]);
  var timer=setInterval(function(){
    var s=vedicPrashnaEnsureState();
    if(!s.inFlight){clearInterval(timer);return;}
    s.loadingStep=Math.min(VEDIC_PRASHNA_STEPS.length-1,(s.loadingStep||0)+1);
    s.statusMessage=VEDIC_PRASHNA_STEPS[s.loadingStep];
    _vedicSetPaymentPending(true,s.statusMessage);
    vedicPrashnaRefreshUi();
  },900);
  try{
    var gate=await vedicPrashnaPaidGate(state.snapshot);
    if(!gate||gate.ok!==true){
      state.statusError=true;
      state.statusMessage=String(gate&&gate.message||'결제가 완료되지 않았습니다. 이용 금액은 청구되지 않았으며 프라슈나 차트도 생성되지 않았습니다.');
      vedicPrashnaTrack('prashna_payment_failed',{orderId:state.order.orderId});
      vedicPrashnaRefreshUi();
      return;
    }
    state.loadingStep=2;
    state.statusMessage=VEDIC_PRASHNA_STEPS[2];
    vedicPrashnaTrack('prashna_payment_succeeded',{orderId:state.order.orderId});
    vedicPrashnaRefreshUi();
    var headers=vedicPrashnaReadAuthHeaders();
    headers['idempotency-key']=gate.requestId||state.snapshot.orderId;
    var resp=await fetch('/api/fortune/vedic/prashna/generate',{
      method:'POST',
      headers:headers,
      body:JSON.stringify({
        orderId:state.order.orderId,
        snapshot:state.snapshot,
        requestId:gate.requestId||state.snapshot.orderId,
        accessGrant:gate.accessGrant,
        accessDecision:gate.accessDecision,
        consume:gate.consume,
        payment:gate.payment,
        _paymentContext:gate._paymentContext
      })
    });
    var data=await resp.json().catch(function(){return{};});
    if(!resp.ok){
      state.statusError=true;
      state.statusMessage=String(data&&data.message||'결제는 확인되었지만 결과 생성에 실패했습니다. 결제 취소 또는 무료 재생성 절차를 진행합니다.');
      vedicPrashnaTrack('prashna_generation_failed',{orderId:state.order.orderId,code:String(data&&data.code||'')});
      vedicPrashnaRefreshUi();
      return;
    }
    state.result=data.result||null;
    state.prompt=String(data.promptText||(data.result&&data.result.promptText)||'').trim();
    state.chart=data.chart||(data.result&&data.result.chart)||null;
    state.snapshot=data.snapshot||state.snapshot;
    state.order=data.order||state.order;
    state.statusError=false;
    state.statusMessage='프라슈나 프롬프트가 준비되었습니다';
    vedicPrashnaTrack('prashna_chart_generated',{orderId:state.order&&state.order.orderId});
    try{localStorage.setItem('VEDIC_PRASHNA_LAST_RESULT',JSON.stringify({order:state.order,snapshot:state.snapshot,prompt:state.prompt,chart:state.chart,result:state.result,savedAt:new Date().toISOString()}));}catch(_){}
    vedicPrashnaRefreshUi();
  }catch(e){
    console.error('[vedic prashna generate]',e);
    state.statusError=true;
    state.statusMessage='결제 상태를 확인하고 있습니다. 창을 닫지 말고 잠시 기다려 주세요.';
    vedicPrashnaRefreshUi();
  }finally{
    clearInterval(timer);
    state.inFlight=false;
    _vedicSetPaymentPending(false);
    vedicPrashnaRefreshUi();
  }
}

async function vedicPrashnaCopyPrompt(){
  var state=vedicPrashnaEnsureState();
  var text=String(state.prompt||'').trim();
  if(!text){
    vedicPrashnaSetStatus('복사할 프라슈나 프롬프트가 없습니다.',true);
    return;
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    }else{
      var ta=document.createElement('textarea');
      ta.value=text;
      ta.style.position='fixed';
      ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    state.statusError=false;
    state.statusMessage='프라슈나 프롬프트를 복사했습니다.';
    vedicPrashnaTrack('prashna_prompt_copied',{orderId:state.order&&state.order.orderId});
    vedicPrashnaRefreshUi();
  }catch(_){
    vedicPrashnaSetStatus('복사에 실패했습니다. 직접 선택해 복사해 주세요.',true);
  }
}

function vedicPrashnaRefreshUi(){
  var state=vedicPrashnaEnsureState();
  var q=document.getElementById('vedicPrashnaQuestion');
  var lat=document.getElementById('vedicPrashnaLat');
  var lon=document.getElementById('vedicPrashnaLon');
  var status=document.getElementById('vedicPrashnaStatus');
  var count=document.getElementById('vedicPrashnaCount');
  var btn=document.getElementById('vedicPrashnaCreateBtn');
  var modal=document.getElementById('vedicPrashnaConfirmModal');
  var modalBody=document.getElementById('vedicPrashnaConfirmBody');
  var check=document.getElementById('vedicPrashnaConfirmCheck');
  var pay=document.getElementById('vedicPrashnaPayBtn');
  var result=document.getElementById('vedicPrashnaResult');
  var prompt=document.getElementById('vedicPrashnaPromptText');
  var chart=document.getElementById('vedicPrashnaChartText');
  var chartWrap=document.getElementById('vedicPrashnaChartWrap');
  if(q&&q.value!==state.question) q.value=state.question;
  if(lat&&lat.value!==state.latitude) lat.value=state.latitude;
  if(lon&&lon.value!==state.longitude) lon.value=state.longitude;
  if(count) count.textContent=String((state.question||'').length);
  if(status){
    status.textContent=state.statusMessage||'';
    status.style.color=state.statusError?'#fda4af':'var(--text3)';
  }
  if(btn){
    btn.disabled=!!state.inFlight;
    btn.textContent=state.inFlight?'처리 중...':'프라슈나 프롬프트 생성 · 5,000원';
  }
  if(modal){
    modal.style.display=state.confirmOpen?'flex':'none';
  }
  if(check) check.checked=!!state.confirmed;
  if(pay) pay.disabled=!state.confirmed||state.inFlight;
  if(modalBody&&state.snapshot){
    modalBody.innerHTML=[
      ['질문',state.snapshot.question],
      ['기준 시각',state.snapshot.capturedAtLocal],
      ['시간대',state.snapshot.timezone],
      ['위치',Number(state.snapshot.latitude).toFixed(6)+', '+Number(state.snapshot.longitude).toFixed(6)],
      ['사용 가격','5,000원']
    ].map(function(row){
      return '<div style="display:grid;grid-template-columns:82px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.08)"><strong style="color:#fde68a;font-size:12px">'+hEsc(row[0])+'</strong><span style="color:#e2e8f0;font-size:12px;line-height:1.55;word-break:break-word">'+hEsc(row[1])+'</span></div>';
    }).join('');
  }
  if(result) result.style.display=state.prompt?'block':'none';
  if(prompt) prompt.textContent=state.prompt||'';
  if(chartWrap) chartWrap.style.display=(state.chartOpen&&state.chart)?'block':'none';
  if(chart) chart.textContent=state.chart?JSON.stringify(state.chart,null,2):'';
}

// ─── DEEP INSIGHT GENERATOR ───────────────────────────────
function generateInsights(chart,report){
  const{rasi,nak,maha,anta,dashas}=chart;

  const ch=report.chakra;const rom=report.romance;const y=report.yoga;
  const nktr=NAKTR[nak.name]||{sym:"⭐",tr:["지혜"],sh:["집착"],pur:"성장"};
  const lagnaLordPos=rasi.planets[p.lagnaLord];
  const moonPos=rasi.planets['Moon'];
  const sunPos=rasi.planets['Sun'];
  const now=new Date();
  const mahaRem=Math.round((maha.end-now)/(1000*60*60*24*365.25)*10)/10;
  const antaRem=Math.round((anta.end-now)/(1000*60*60*24*30));

  // ── 1. 종합 운세 요약 (오늘의 기운) ──────────────────────
  const dashaPower=PSIG[maha.p]?PSIG[maha.p].kar[0]:'변화';
  const antaPower=PSIG[anta.p]?PSIG[anta.p].kar[0]:'흐름';
  const mahaQuality=rasi.planets[maha.p]?rasi.planets[maha.p].dignity:'Neutral';
  const dashaQualEmoji={Exalted:'✦ 황금기',Own:'◆ 안정기',Debilitated:'▲ 정화기',Neutral:'● 성장기'}[mahaQuality]||'● 성장기';
  const dashaStarMap={Sun:'태양은 왕좌에서 명령합니다 — 권위·리더십·자아 발현의 에너지가 당신의 삶 전면에 들어옵니다',Moon:'달은 조수를 움직입니다 — 감정의 깊이를 탐험하고, 직관과 내면의 목소리가 가장 강력한 나침반이 됩니다',Mars:'화성의 검이 빛납니다 — 용기·행동·개척의 불꽃이 활활 타오르며, 주저함을 태워버리는 시기입니다',Mercury:'헤르메스가 속삭입니다 — 지성·소통·상업의 날카로운 도구가 손에 들어오는 시기입니다',Jupiter:'목성은 은총의 비를 내립니다 — 지혜·확장·번영의 물결이 가장 광대하게 펼쳐지는 성장의 계절입니다',Venus:'금성이 세상에 마법을 겁니다 — 예술·사랑·아름다움·풍요의 황금빛이 삶의 결을 바꿔놓습니다',Saturn:'토성은 시간의 연금술사입니다 — 도전과 단련을 통해 불순물을 제거하고 영혼의 순금을 빚어내는 시기입니다',Rahu:'라후는 새로운 차원의 문을 엽니다 — 익숙함의 경계를 허물고 전혀 다른 삶의 영토로 당신을 이끕니다',Ketu:'케투는 하늘의 지우개입니다 — 집착과 세속적 욕망을 놓아버릴수록 영적 자유와 깊은 지혜가 넘쳐납니다'};
  const mahaInsightMap={
    Exalted:`<span class="keyword">${PKR[maha.p]} 대운</span>이 <strong style="color:var(--gold)">항진(最高位)</strong>으로 운행됩니다. 이 행성이 하늘에서 가장 강렬하게 빛나는 황금 좌표에 있습니다. 당신 생애에서 가장 강력한 우주의 지원이 흐르는 시기 — 지금 뿌린 씨앗은 열 배의 결실로 돌아옵니다.`,
    Own:`<span class="keyword">${PKR[maha.p]} 대운</span>이 <strong style="color:#22C55E">자기 궁(自宮)</strong>에서 운행됩니다. 물고기가 자신의 강으로 돌아온 것처럼, 이 에너지는 가장 자연스럽고 안정된 힘으로 발현됩니다.`,
    Debilitated:`<span class="keyword">${PKR[maha.p]} 대운</span>이 <strong style="color:#FF9500">약화(伏位)</strong> 상태입니다. 물질적 확장보다 내면의 그림자를 마주하고 영적 성장을 이뤄내야 하는 정화의 시기 — 이 연단은 영혼의 가장 값진 금을 빚어냅니다.`,
    Neutral:`<span class="keyword">${PKR[maha.p]} 대운</span>이 균형 상태로 흐릅니다. ${dashaStarMap[maha.p]||dashaPower+'의 카르마를 의식적으로 실천할 때 풍성한 결실을 맺습니다.'}`

  // ── 2. 라그나 + 낙샤트라 심층 성향 ──────────────────────
  const lagnaEl=(STRN[p.lagnaSign]||STRN.Aries).el;
  const lagnaStr=STRN[p.lagnaSign]||STRN.Aries;
  const elDesc={Fire:"불꽃처럼 타오르는 영혼으로, 한번 정한 방향을 향해 강렬하게 돌진하는 선천적 에너지를 지닙니다",Earth:"대지처럼 묵직하고 신뢰할 수 있는 토대를 구축하며, 현실에 뿌리내린 지혜로 주변을 안정시킵니다",Air:"바람처럼 자유롭고 지적인 영혼으로, 정보와 아이디어를 연결하며 세상을 변화시키는 소통의 달인입니다",Water:"깊은 바다처럼 감성과 직관이 풍부하며, 타인의 마음을 읽어내는 탁월한 공감 능력을 타고났습니다"};
  const deityInfo=NAKDEITY_DATA[nak.name]||{deity:"우주신",role:"신성한 에너지",kw:["지혜"],motive:"Dharma"};
  const padaSign=NAKPADA_SIGNS[nak.name]?NAKPADA_SIGNS[nak.name][Math.max(0,nak.pada-1)]:"Aries";
  const padaSignKr=rashiShort(padaSign);
  const padaKw=PADA_SIGN_KW[padaSign]||'';
  const ganaKR={Deva:"데바(Deva) — 신성한 기질로 영성·덕망·조화를 추구합니다",Manushya:"마누샤(Manushya) — 인간적 기질로 현실과 이상 사이에서 균형을 찾습니다",Rakshasa:"락샤사(Rakshasa) — 강렬한 기질로 한 번 목표를 정하면 끝까지 밀어붙이는 집중력이 있습니다"}[NKGANA[nak.name]||'Manushya'];
  const motiveKr=MOTIVES_KR[deityInfo.motive]||deityInfo.motive;
  const motiveDesc=MOTIVES_DESC[deityInfo.motive]||'';
  // 라그나 × 낙샤트라 조합 심층 문구
  const lagnaElKr={Fire:"불의 자리",Earth:"땅의 자리",Air:"바람의 자리",Water:"물의 자리"}[lagnaEl]||"";
  const lagnaSignKr2=p.lagnaSignKr||lagna;
  const nakSymStr=nktr.sym||"⭐";
  const nakPurpose=nktr.pur||"성장";
  // 라그나 + 낙샤트라 조합 문장
  const comboPhraseMap={
    "Leo-Ashwini":`${lagnaElKr} ${lagnaSignKr2} 라그나에, 치유의 별 ${nak.name} 낙샤트라 — 당신은 상처받은 리더십을 치유하는 개척자입니다`,
    "Leo-Magha":`불의 왕좌 ${lagnaSignKr2}와 왕족의 별 ${nak.name}의 결합 — 당신은 타고난 왕의 기질로 세상에 위엄을 새기러 왔습니다`,
    "Aries-Ashwini":`두 불꽃이 하나로 합쳐졌습니다 — ${lagnaSignKr2} 라그나와 ${nak.name}의 이중 개척 에너지가 당신을 시대의 선구자로 빚었습니다`,
    "Scorpio-Jyeshtha":`심연의 두 라시 — ${lagnaSignKr2}와 ${nak.name}의 강렬한 결합, 당신은 불가사의한 변혁의 힘을 세상에 가져왔습니다`,
    "Pisces-Revati":`영적 우주의 끝에서 시작되는 영혼 — ${lagnaSignKr2}와 ${nak.name}의 조합, 당신은 경계 너머를 꿈꾸는 신비로운 안내자입니다`
  };
  const comboKey=`${rasi.ascSign}-${nak.name}`;
  const comboPhrase=comboPhraseMap[comboKey]||`${lagnaElKr} ${lagnaSignKr2} 라그나에, ${nakSymStr} ${nak.name} 낙샤트라가 결합되어 — 당신은 ${lagnaStr.kw[0]}을 통해 ${nakPurpose}을 이루는 독특한 영혼입니다`;
  const personalityInsight=`${comboPhrase}.<br><br>
당신의 라그나(Lagna) <span class="keyword">${p.lagnaSignKr}</span>는 세상이 처음 마주치는 당신의 얼굴입니다. ${elDesc[lagnaEl]||''}. 이 라시가 외적 페르소나의 언어를 결정하며, 사람들은 당신을 그렇게 경험합니다.<br><br>
3대 핵심 운명 키워드: <span class="keyword">${(lagnaStr.kw||[]).join(' · ')}</span>. 천성적으로 ${(lagnaStr.tr||[]).slice(0,2).join(', ')}의 에너지가 당신을 둘러쌉니다.<br><br>
달이 머무는 낙샤트라 <span class="keyword">${nak.name}</span>(${nktr.sym})은 잠재의식 깊숙한 곳의 언어입니다. 수호신 <span class="keyword">${deityInfo.deity}</span>의 에너지가 당신의 꿈·직관·감정 패턴을 조율합니다. ${deityInfo.role}.<br><br>
파다(Pada) <span class="keyword">${nak.pada}</span> — <span class="keyword">${padaSignKr} 나밤샤</span>: ${padaKw}. 이 파다는 낙샤트라 에너지가 물질 세계에서 구체적으로 표현되는 방식의 미세한 조율입니다.<br><br>
기질(Gana): <span class="keyword">${ganaKR}</span><br>인생 동기(Motivation): <span class="keyword">${motiveKr}</span>. ${motiveDesc}<br><br>
그림자의 씨앗: <span class="keyword">${(nktr.sh||[]).join(' · ')}</span>. 이것은 결함이 아니라 당신이 이번 생에서 통합해야 할 카르마의 원소입니다. 이 그림자를 직면할 때 비로소 빛이 완성됩니다.`;


  // ── 3. 재물 심층 분석 ─────────────────────────────────
  const wScore=w.score||50;
  const wTypeLabel=w.wealthType||'균형 축적형';
  const wealthNarrative=wScore>=70?
    `당신의 재물 차트는 <span class="keyword">${wScore}점</span>의 강한 활성 상태입니다. 재물을 끌어당기는 선천적 자력이 있으며, 특히 ${w.src} 분야에서 풍성한 흐름이 형성됩니다. 재물 유형은 <span class="keyword">${wTypeLabel}</span>으로, 이 성향에 맞는 커리어와 투자 전략이 재물 그릇을 더욱 크게 만듭니다.<br><br>아루다 라그나(사회적 성공 이미지): <span class="keyword">${w.arudhaSignKr||''}</span> — 세상이 바라보는 당신의 성공 아우라입니다. 인두 라그나(재물 특화 포인트): <span class="keyword">${w.induSignKr||''}</span> (에너지 지수 ${w.induScore||0}점) — 재물의 비밀 통로가 이 라시의 에너지에 숨어있습니다.`:
    wScore>=50?

    `재물 지수 <span class="keyword">${wScore}점</span> — 이번 생에서 재물은 '노력으로 쌓는 카르마'로 설정되어 있습니다. 재물 유형 <span class="keyword">${wTypeLabel}</span>에 집중하여 강점을 키우면, 장기적으로 의미 있는 풍요가 따릅니다.<br><br>아루다 라그나: <span class="keyword">${w.arudhaSignKr||''}</span>의 에너지를 적극 활용해 사회적 이미지를 높이세요. 인두 라그나: <span class="keyword">${w.induSignKr||''}</span>가 재물 에너지의 활성화 포인트입니다.`;

추천 직군 <span class="keyword">${(c.primary||[]).join(' · ')}</span>은 단순한 직업 목록이 아니라, 당신의 영혼이 이번 생에서 가장 자연스럽게 기여할 수 있는 영역입니다.<br><br>
아마탸카라카(Amatyakaraka) — 직업적 재능의 행성: <span class="keyword">${PKR[amKarakaName]} (${amKarakaName})</span>. 이 행성의 카르마 <span class="keyword">${PSIG[amKarakaName]?PSIG[amKarakaName].kar.slice(0,2).join('·'):'소통·분석'}</span>를 기반으로 한 직업에서 타고난 재능이 빛을 발합니다. 관련 분야: <span class="keyword">${PSIG[amKarakaName]?PSIG[amKarakaName].car.slice(0,3).join('·'):'다양한 분야'}</span>.<br><br>
${c.best?`<span class="keyword">${c.best}</span>이 커리어의 황금기가 될 것입니다.`:'현재 진행 중인 대운에서 커리어의 씨앗을 심을 때입니다.'}`;

// ═══ 섹션 조립기 — 6토픽 × 8부 구조 ═══════════════════════
// ① 핵심 요약 ② 베다점 근거 ③ 현재 의미 ④ 현실 사례 ⑤ 장점 ⑥ 주의점 ⑦ 실천 조언 ⑧ 종합 정리
// 렌더링은 6카드(✨/🪐/🌿/⚠/💡/🔮)로 묶인다.
function bhavaTerm(n){return String(n)+'바바';}
function bhavaFull(n){
  const info=VEDA_BHAVA_DATA[n]||{};const pr=BHAVA_PROSE[n]||{signif:[]};
  return String(n)+'바바('+(info.name||'')+'·'+(pr.signif||[]).slice(0,3).join('·')+')';
}
function pickVaried(bucket,seed){
  if(!bucket||!bucket.length)return'';
  return bucket[Math.abs(Math.round(seed))%bucket.length];
}
// 조사 자동 선택 — 그라하·라시 이름이 동적으로 붙으므로 받침 유무를 실제로 판정한다.
const JOSA_DIGIT_JONG={'0':1,'1':1,'3':1,'6':1,'7':1,'8':1,'2':0,'4':0,'5':0,'9':0};
// 조사는 괄호 앞 표제어에 맞춘다 — "망갈라(Mangala·화성)는"이지 "…화성)은"이 아니다.
function josaStem(word){
  return String(word||'').replace(/\([^)]*\)/g,'');
}
function hasJong(word){
  const s=josaStem(word).replace(/[^가-힣0-9]/g,'');
  if(!s)return false;
  const chLast=s.charAt(s.length-1);
  if(chLast>='0'&&chLast<='9')return!!JOSA_DIGIT_JONG[chLast];
  const code=chLast.charCodeAt(0);
  if(code<0xAC00||code>0xD7A3)return false;
  return (code-0xAC00)%28!==0;
}
function jongIsRieul(word){
  const s=josaStem(word).replace(/[^가-힣]/g,'');
  if(!s)return false;
  const code=s.charCodeAt(s.length-1);
  if(code<0xAC00||code>0xD7A3)return false;
  return (code-0xAC00)%28===8;
}
function josa(word,withJong,withoutJong){
  return String(word||'')+(hasJong(word)?withJong:withoutJong);
}
// '으로/로'는 ㄹ 받침이 예외(→ 로)
function josaRo(word){
  return String(word||'')+((hasJong(word)&&!jongIsRieul(word))?'으로':'로');
}

function vdYogaKey(label){
  const s=String(label||'');
  if(s.indexOf('Gaja Kesari')>=0)return'Gaja Kesari';
  if(s.indexOf('Dhana')>=0)return'Dhana';
  if(s.indexOf('Lakshmi')>=0)return'Lakshmi';
  if(s.indexOf('Raja')>=0)return'Raja';

// 결혼 유력 구간 — 7바바 로드·관계 카라카·우파파다 로드의 다샤가 마하/안타르 양쪽에서 겹치는 지점을 찾는다.
function buildMarriageWindows(chart,report){
  const rasi=chart.rasi;
  const roles={};
  const addRole=function(p,label){if(!p)return;(roles[p]=roles[p]||[]).push(label);};
  const h7l=rasi.houses[6].lord;
  const karaka=chart.f.gender==='M'?'Venus':'Jupiter';
  const ulSign=(report.romance&&report.romance.upapadaSign)||null;
  const ulLord=ulSign?SLORDS[SIGNS.indexOf(ulSign)]:null;
  addRole(h7l,'7바바 로드');
  addRole(karaka,'관계 카라카');
  addRole(ulLord,'우파파다 라그나 로드');

  const birthY=(chart.f&&chart.f.year)||null;
  const minY=birthY!=null?birthY+20:null;
  const maxY=birthY!=null?birthY+49:null;
  const now=new Date();
  const rows=[];
  for(const d of chart.dashas||[]){
    const mahaCand=!!roles[d.p];
    for(const a of d.ants||[]){
      const antaCand=!!roles[a.p];
      if(!mahaCand&&!antaCand)continue;
      const sY=a.start.getFullYear(),eY=a.end.getFullYear();
      if(minY!=null&&(eY<minY||sY>maxY))continue;
      const roleSet={};
      (roles[d.p]||[]).concat(roles[a.p]||[]).forEach(function(r){roleSet[r]=1;});
      const covered=Object.keys(roleSet);
      const mD=dignityDetail(rasi,d.p),aD=dignityDetail(rasi,a.p);
      const past=a.end<now;
      // 양쪽이 모두 관계 담당이면 기운이 가장 강하고, 한쪽만이면 차순위로 본다.
      const tier=(mahaCand&&antaCand)?2:1;
      // 다샤 구간이 만 20세 이전부터 걸쳐 있으면, 표시는 20세가 되는 해부터 자른다.
      let dsY=sY,dsM=a.start.getMonth()+1;
      if(minY!=null&&dsY<minY){dsY=minY;dsM=1;}
      rows.push({
        mahaLord:d.p,antaLord:a.p,tier:tier,
        mahaCand:mahaCand,antaCand:antaCand,
        startY:dsY,startM:dsM,
        endY:eY,endM:a.end.getMonth()+1,
        age:birthY!=null?(dsY-birthY):null,
        covered:covered,
        score:tier*20+covered.length*5+(past?0:12)+Math.max(0,mD.tone)+Math.max(0,aD.tone),
        past:past
      });
    }
  }
  rows.sort(function(x,y){
    if(y.score!==x.score)return y.score-x.score;
    if(x.past!==y.past)return x.past?1:-1;
    return x.startY-y.startY;
  });
  // 순위는 점수로 매기고, 표시는 시간순으로 한다.
  const top=rows.slice(0,2);
  top.forEach(function(r,i){r.rank=i;});
  top.sort(function(a,b){return (a.startY-b.startY)||(a.startM-b.startM);});
  return{
    windows:top,
    roles:roles,
    h7lord:h7l,karaka:karaka,ulLord:ulLord,
    fallbackUsed:rows.length===0
  };
}

      '수리야가 '+bhavaTerm(sunH)+'. 사회적 자아와 인정 욕구가 이 영역을 향합니다.',
      '가장 힘이 실린 그라하는 '+grahaTerm(strongest.p)+' — '+strongest.d.short+', 가장 눌린 그라하는 '+grahaTerm(weakest.p)+' — '+weakest.d.short+'입니다.',
      majorDrishti.length?('특수 드리슈티: '+majorDrishti.map(function(d){return PKR[d.from]+' '+d.fromHouse+'바바→'+d.toHouse+'바바';}).join(' · ')+'. 이 시선이 닿는 바바가 이번 생에서 힘이 몰리는 영역입니다.'):'특수 드리슈티가 한쪽으로 몰리지 않아 한쪽으로 힘이 쏠리지 않습니다.',
      '현재 마하다샤 '+josa(grahaTerm(maha.p),'은','는')+' '+bhavaTerm(mahaH)+'에서 '+mahaD.short+', 안타르다샤 '+josa(grahaTerm(anta.p),'은','는')+' '+bhavaTerm(antaH)+'에서 '+antaD.short+'입니다.'
    ],
    meaning:'세 축이 서로 다른 방향을 볼 때 사람은 자기 안에서 갈등을 느낍니다. 라그나는 '+josa((lagnaStr.kw||[]).slice(0,2).join('·'),'을','를')+' 원하고, 달은 '+josa(nakBase.pur,'을','를')+' 향하며, 수리야는 '+((BHAVA_PROSE[sunH]||{}).signif||[]).slice(0,2).join('·')+' 영역에서 인정받으려 합니다. '+(DASHA_BHAVA_PROSE[mahaH]||'')+' 지금 우선순위를 정해야 한다면 대운이 지목하는 '+bhavaTerm(mahaH)+' 영역이 먼저입니다.',
    reality:[nakPr.reality,'직업·재물 쪽에서는 '+(c.primary||[]).slice(0,2).join('·')+' 계열이, 관계에서는 '+(rom.partnerTraits||[]).slice(0,2).join('·')+' 성향의 상대가 반복해서 등장합니다.','에너지 측면에서는 '+((CHKINFO[blk]||{}).kr||blk)+'가 막혀 '+((CHKINFO[blk]||{}).imbal||[])[0]+' 신호가 주기적으로 올라옵니다.'],
    merit:josa(grahaTerm(strongest.p),'이','가')+' '+strongest.d.short+'로 서 있는 것이 이 명반의 최대 자산입니다. '+((GRAHA_KARAKA_PROSE[strongest.p]||{}).title||'')+' 영역에서는 남들보다 적은 힘으로 같은 결과를 냅니다. '+(DIGNITY_PROSE[strongest.d.code]||''),
    caution:josa(grahaTerm(weakest.p),'이','가')+' '+weakest.d.short+'라 '+((GRAHA_KARAKA_PROSE[weakest.p]||{}).title||'')+' 영역에서 같은 문제가 반복됩니다. '+(DIGNITY_PROSE[weakest.d.code]||'')+' 이 영역을 강점으로 덮으려 하면 문제가 더 깊어지므로, 별도의 시간과 방법을 배정해야 합니다.',
    action:[
      '이번 대운에서 '+bhavaTerm(mahaH)+' 영역의 목표 하나를 문장으로 확정합니다.',
      grahaTerm(weakest.p)+'의 요일에 그 영역을 점검하는 30분을 고정합니다 — 강한 그라하로 덮지 않는 것이 핵심입니다.',
      '라그나·달·수리야가 각각 원하는 것을 한 줄씩 적어두고, 충돌할 때 대운 기준으로 판단합니다.'
    ],
    closing:'명반은 고정된 판결문이 아니라 자원 배치도입니다. 어디에 힘이 실려 있고 어디가 비어 있는지를 알면, 같은 노력으로도 결과가 달라집니다. '+pickVaried(VD_CLOSERS,seed+6)
  };

  return{overview,personality,wealth,career,romance,energy,dasha};
}

// ═══ 심화 서술 — 기존 아코디언 내부를 채운다 ══════════════════
// 유료 스냅샷이 읽는 report 필드는 읽기만 하고 변경하지 않는다.
function buildVedicDeepDetails(chart,report){
  const rasi=chart.rasi,nak=chart.nak,maha=chart.maha,anta=chart.anta;
  const drishti=computeDrishti(rasi);
  const p=report.personality,w=report.wealth,c=report.career,rom=report.romance;
  const seed=(nak.idx||0)*17+rasi.houses[0].si*5+(nak.pada||1);
  const lagnaSi=rasi.houses[0].si;

  // ── 파트너 ────────────────────────────────────────────────
  const h7si=rasi.houses[6].si;
  const h7l=rom.h7lord,h7lH=planetHouse(rasi,h7l)||7,h7lD=dignityDetail(rasi,h7l);
  const karaka=rom.karaka,karD=dignityDetail(rasi,karaka),karSi=rasi.planets[karaka].sign;
  const h7Rashi=RASHI_TRAIT_PROSE[h7si]||{core:'',edge:'',risk:''};
  const d9Kar=(chart.d9&&chart.d9[karaka])||null;
  const h7Watchers=drishtiOnHouse(drishti,7,true);
  const partner={
    paras:[
      '7바바(Yuvati)에 흐르는 라시는 '+rashiFull(h7si)+'입니다. '+h7Rashi.core+' 이 결이 곧 반복해서 끌리는 상대의 기본형이며, 본인이 편안하다고 느끼는 관계의 온도를 정합니다.',
      '7바바의 주인 '+grahaTerm(h7l)+'는 '+bhavaFull(h7lH)+'에 놓여 '+h7lD.ko+' 상태입니다. '+h7lD.reason+'. 이 주인이 그리는 상대상은 이렇습니다. '+PARTNER_GRAHA_ROLE[h7l],
      '관계 카라카는 '+grahaTerm(karaka)+'이고 '+rashiTerm(karSi)+'에서 '+karD.short+'입니다. '+PARTNER_GRAHA_ROLE[karaka]+(d9Kar?' 나밤샤(D-9)에서는 '+josaRo(rashiTerm(d9Kar.sign))+' 이동합니다. 연애 단계보다 결혼 이후에 이런 면이 더 뚜렷해집니다 — '+((RASHI_TRAIT_PROSE[d9Kar.sign]||{}).core||''):'')
    ],
    rows:[
      {label:'상대의 기본 결',body:h7Rashi.core+' 강점은 '+h7Rashi.edge+' 반대로 '+h7Rashi.risk},
      {label:'배경·환경',body:PARTNER_GRAHA_ROLE[h7l]+' 여기에 카라카 '+josa(PKR[karaka],'이','가')+' 놓인 '+rashiTerm(karSi)+'의 결이 겹칩니다. '+((RASHI_TRAIT_PROSE[karSi]||{}).core||'')},
      {label:'만나는 경로',body:'7바바 주인이 '+bhavaTerm(h7lH)+'에 있으므로 '+(MEETING_PATH_BHAVA[h7lH]||'')},
      {label:'관계 역학',body:(h7lD.tone>0?'7바바 주인에 힘이 실려 관계가 비교적 쉽게 시작되고 유지됩니다. 다만 시작이 쉬운 만큼 검증 없이 진도가 나가는 것이 실제 위험입니다.':h7lD.tone<0?'7바바 주인이 눌려 있어 관계가 자리 잡기까지 시간이 걸립니다. 조건보다 함께 있을 때 편한지 지치는지를 기준으로 판단해야 어긋남이 줄어듭니다.':'7바바 주인이 중립이라 관계의 결과가 들인 노력에 정직하게 비례합니다.')+(h7Watchers.length?' 여기에 '+h7Watchers.map(function(d){return PKR[d.from];}).join('·')+'의 드리슈티가 7바바로 들어옵니다. '+(DRISHTI_PROSE[h7Watchers[0].from]||''):'')}
    ]
  };

  // ── 결혼 시기 ─────────────────────────────────────────────
  const mw=buildMarriageWindows(chart,report);
  const saturn7=(rasi.houses[6].planets||[]).indexOf('Saturn')>=0;
  const node7=(rasi.houses[6].planets||[]).some(function(x){return x==='Rahu'||x==='Ketu';});
  const saturnEye7=h7Watchers.some(function(d){return d.from==='Saturn';});
  const delays=[];
  if(saturn7)delays.push('샤니(Shani·토성)가 7바바에 직접 앉아 있습니다. 관계의 확정이 늦어지는 대신 한 번 맺으면 잘 흔들리지 않습니다');
  if(saturnEye7&&!saturn7)delays.push('샤니의 드리슈티가 7바바를 누릅니다. 검증 기간이 길어지므로 조급하게 밀어붙이면 오히려 어긋나기 쉽습니다');
  if(node7)delays.push('라후 또는 케투가 7바바에 있습니다. 인연이 갑자기 들어왔다 갑자기 정리되는 일이 잦으므로, 초기 6개월의 판단을 신뢰하지 않는 편이 안전합니다');
  if(h7lD.tone<0)delays.push('7바바 주인이 '+h7lD.short+'라 관계 초반에 오해가 자주 생깁니다. 기대하는 바를 처음에 말로 정해두면 감정 소모가 크게 줄어듭니다');
  const marriage={
    paras:[
      '결혼 시기는 7바바(Yuvati)의 주인, 성별에 따른 관계 카라카 '+grahaTerm(karaka)+', 우파파다 라그나의 주인 — 이 셋의 다샤가 열리는 지점에서 봅니다. 이 명반에서 관계를 여는 열쇠는 '+Object.keys(mw.roles).map(function(k){return PKR[k]+'('+mw.roles[k].join('·')+')';}).join(', ')+'입니다.',
      mw.windows.length?'아래는 관계를 맡은 그라하의 다샤가 실제로 열리는 시기입니다. 그때 반드시 결혼한다는 뜻은 아니고, 만남이 진지해지거나 결혼 이야기가 오갈 일이 많아지는 때로 봅니다. 이미 지난 것으로 표시된 시기는 그 무렵 관계에 큰 변화가 있었는지 돌아보는 기준으로 쓰시면 됩니다.':'관계를 맡은 그라하의 다샤가 만 20~49세와 크게 겹치지 않습니다. 이런 경우 결혼은 시기의 흐름보다 본인의 결정이 훨씬 크게 작용합니다.'
    ],
    rows:mw.windows.map(function(win,i){
      return{
        label:(win.rank===0?'인연이 가장 무르익는 때':'그다음으로 좋은 때')+' — '+win.startY+'년 '+win.startM+'월 ~ '+win.endY+'년 '+win.endM+'월'+(win.past?' (이미 지나감)':'')+(win.age!=null?' · 만 '+win.age+'세 무렵':''),
        body:grahaTerm(win.mahaLord)+' 대운 안에서 '+grahaTerm(win.antaLord)+' 세운이 흐르는 때입니다. 이렇게 보는 이유는 '+win.covered.join(', ')+(win.tier===2?'가 대운과 세운 양쪽에서 함께 힘을 얻기 때문입니다.':'가 한쪽에서 힘을 얻기 때문입니다.')+' '+(win.rank===0?'이 명반에서 인연이 가장 진하게 들어오는 때이고, 만나던 사람이 있다면 이 무렵에 이야기가 구체적으로 진행됩니다.':'앞의 시기 다음으로 인연이 강하게 들어오는 때입니다.')+' '+(ANTARDASHA_PAIR_PROSE[win.antaLord]||'')
      };
    }).concat(delays.length?[{label:'지연·주의 요인',body:delays.join('. ')+'.'}]:[{label:'지연 요인',body:'7바바를 누르는 구조적 지연 요인은 잡히지 않습니다. 시기가 오면 진행이 비교적 매끄럽게 이어집니다.'}])
      .concat([{label:'만남의 신호',body:'7바바 주인이 '+bhavaTerm(h7lH)+'에 있으므로 '+(MEETING_PATH_BHAVA[h7lH]||'')+' 위에 적힌 시기에 이런 자리에 나갈 일이 늘어난다면, 그때가 인연이 시작되는 지점일 가능성이 큽니다.'}])
  };

  // ── 나밤샤(D-9) ───────────────────────────────────────────
  const d9AscSi=(chart.d9Asc&&chart.d9Asc.sign!=null)?chart.d9Asc.sign:lagnaSi;
  const d9H7Si=(d9AscSi+6)%12;
  const navamsa={
    paras:[
      '나밤샤(Navamsa·D-9)는 라시 차트가 씨앗이라면 그 씨앗이 실제로 어떤 열매를 맺는지 보여주는 분할 차트입니다. 결혼과 배우자, 그리고 인생 후반의 실질을 여기서 읽습니다.',
      '나밤샤 라그나는 '+rashiFull(d9AscSi)+'입니다. '+(NAVAMSA_LAGNA_PROSE[d9AscSi]||'')+' 나밤샤의 7바바는 '+rashiTerm(d9H7Si)+'로, '+((RASHI_TRAIT_PROSE[d9H7Si]||{}).core||'')
    ],
    rows:[
      {label:'나밤샤 라그나',body:rashiFull(d9AscSi)+' — '+(NAVAMSA_LAGNA_PROSE[d9AscSi]||'')},
      {label:'나밤샤 7바바',body:rashiTerm(d9H7Si)+' — 결혼 생활에서 상대에게 실제로 기대하게 되는 부분입니다. '+((RASHI_TRAIT_PROSE[d9H7Si]||{}).edge||'')},
      {label:'카라카의 나밤샤 위치',body:d9Kar?grahaTerm(karaka)+'가 나밤샤에서 '+rashiTerm(d9Kar.sign)+'에 놓입니다. 라시 차트의 '+rashiTerm(karSi)+'와 비교하면 결이 달라집니다. 연애 단계에서 보이던 모습보다 결혼 이후에 이 성질이 더 크게 올라옵니다 — '+((RASHI_TRAIT_PROSE[d9Kar.sign]||{}).core||''):'카라카의 나밤샤 위치를 산출하지 못했습니다.'}
    ]
  };

  // ── 직업 ──────────────────────────────────────────────────
  const h10l=c.h10lord,h10lH=planetHouse(rasi,h10l)||10,h10D=dignityDetail(rasi,h10l);
  const amk=c.amatyakaraka||'Mercury',amkH=planetHouse(rasi,amk)||1;
  const d10AscSi=(chart.d10Asc&&chart.d10Asc.sign!=null)?chart.d10Asc.sign:lagnaSi;
  const d10H10Si=(d10AscSi+9)%12;
  const llH=planetHouse(rasi,p.lagnaLord)||1;
  let envOrg=0,envSolo=0,envBiz=0;
  if(['Saturn','Sun','Moon'].indexOf(h10l)>=0)envOrg+=2;
  if(['Mercury','Venus','Ketu'].indexOf(h10l)>=0)envSolo+=2;
  if(['Mars','Rahu','Jupiter'].indexOf(h10l)>=0)envBiz+=2;
  if([6,10].indexOf(h10lH)>=0)envOrg+=2;
  if([3,5,12].indexOf(h10lH)>=0)envSolo+=2;
  if([1,7,11].indexOf(h10lH)>=0)envBiz+=2;
  if([10,6].indexOf(llH)>=0)envOrg+=1;
  if([3,12,5].indexOf(llH)>=0)envSolo+=1;
  if([1,11].indexOf(llH)>=0)envBiz+=1;
  if(dignityDetail(rasi,'Saturn').tone>0)envOrg+=1;
  if(planetHouse(rasi,'Rahu')===10)envBiz+=1;
  const envKey=(envBiz>=envOrg&&envBiz>=envSolo)?'biz':(envSolo>=envOrg?'solo':'org');
  const envLabel={org:'조직형',solo:'프리랜서·전문가형',biz:'사업·자영형'}[envKey];
  const nextMaha=(chart.dashas||[]).find(function(d){return d.start>maha.end;})||null;
  const career={
    paras:[
      '직군은 10바바(Karma) 주인의 카라카와 아마탸카라카(Amatyakaraka)를 겹쳐 판정합니다. 10바바 주인 '+grahaTerm(h10l)+'가 '+bhavaFull(h10lH)+'에 놓여 '+h10D.ko+'이고, 그 카라카 의미는 '+((GRAHA_KARAKA_PROSE[h10l]||{}).title||'')+'입니다. 그래서 '+(c.primary||[]).join('·')+' 계열이 1순위로 지목됩니다.',
      '아마탸카라카 '+grahaTerm(amk)+'는 '+bhavaTerm(amkH)+'에 있습니다. '+CAREER_ROLE_PROSE[amk]+' 이 그라하의 다샤가 열릴 때 커리어의 전환점이 찾아오므로, 이직·전직 판단은 그 시점을 기준으로 잡는 편이 유리합니다.'
    ],
    rows:[
      {label:'1순위 직군의 근거',body:PKR[h10l]+'의 카라카('+((PSIG[h10l]||{}).kar||[]).slice(0,3).join('·')+')가 사회적 성취의 방향을 정합니다. '+CAREER_ROLE_PROSE[h10l]},
      {label:'2순위 경로',body:(c.secondary&&c.secondary.length)?'10바바 안에 들어온 그라하 기반으로 '+c.secondary.join('·')+' 계열이 보조 경로가 됩니다. 주력을 바꾸기보다 현 직무에 이 색을 얹는 방식이 손실이 적습니다.':'10바바가 비어 있어 보조 경로는 주인 그라하의 힘을 따라갑니다. 인접 직무로 넓히는 편이 완전한 전환보다 안전합니다.'},
      {label:'적합한 일의 구조 — '+envLabel,body:CAREER_ENV_PROSE[envKey]},
      {label:'다샴샤(D-10) 판정',body:'다샴샤 라그나는 '+rashiTerm(d10AscSi)+', 다샴샤 10바바는 '+rashiTerm(d10H10Si)+'입니다. '+(D10_RASHI_PROSE[d10H10Si]||'')+' 라시 차트의 직군 판정과 이 결이 겹치는 지점이 실제로 오래 가는 자리입니다.'},
      {label:'대운별 커리어 흐름',body:'현재는 '+grahaTerm(maha.p)+' 대운입니다. '+(DASHA_BHAVA_PROSE[planetHouse(rasi,maha.p)||1]||'')+(nextMaha?' 다음은 '+nextMaha.start.getFullYear()+'년에 시작하는 '+grahaTerm(nextMaha.p)+' 대운입니다. '+(DASHA_BHAVA_PROSE[planetHouse(rasi,nextMaha.p)||1]||'')+' 큰 방향 전환은 이 전환점에 맞추는 편이 소모가 적습니다.':'')}
    ]
  };

  // ── 재물 ──────────────────────────────────────────────────
  const h2Lord=rasi.houses[1].lord,h11Lord=rasi.houses[10].lord;
  const h2D=dignityDetail(rasi,h2Lord),h11D=dignityDetail(rasi,h11Lord);
  const h2LordH=planetHouse(rasi,h2Lord)||2,h11LordH=planetHouse(rasi,h11Lord)||11;
  const wType=w.wealthType||'균형 축적형';

// ─── PROFILE 정규화 (지역/생일 null 시 서울·기본값 적용, tz = 시간 단위 UTC 오프셋) ─
function normalizeProfileForVedic(profile){
  if(!profile)return profile;
  const b=profile.birth||{
    year:profile.birthYear,
    month:profile.birthMonth,
    day:profile.birthDay,
    hour:profile.birthHour,
    minute:profile.birthMinute,
    calType:profile.calType
  };
  if(!b||((b.year==null||b.year==='')&&(b.month==null||b.month==='')&&(b.day==null||b.day==='')))return profile;
  if((b.hour==null||b.hour==='')&&profile.birthHour!=null&&profile.birthHour!=='')b.hour=profile.birthHour;
  if((b.minute==null||b.minute==='')&&profile.birthMinute!=null&&profile.birthMinute!=='')b.minute=profile.birthMinute;
  if((b.hour==null||b.hour==='')&&typeof profile.birthTime==='string'){
    var _tp=profile.birthTime.split(':');
    if(_tp.length>=2){
      b.hour=parseInt(_tp[0],10);
      b.minute=(b.minute==null||b.minute==='')?parseInt(_tp[1],10):b.minute;
    }
  }
  const l=profile.location||{};
  const lat=typeof l.lat==='number'&&!isNaN(l.lat)?l.lat:(parseFloat(l.lat)||37.5665);
  const lng=typeof l.lng==='number'&&!isNaN(l.lng)?l.lng:(typeof l.lon==='number'&&!isNaN(l.lon)?l.lon:(parseFloat(l.lng)||parseFloat(l.lon)||126.978));
  let tz=9;
  if(typeof l.baseTzOffset==='number'&&!isNaN(l.baseTzOffset))tz=l.baseTzOffset;
  else if(typeof l.tzOffset==='number'&&!isNaN(l.tzOffset))tz=Math.abs(l.tzOffset)<=24?l.tzOffset:l.tzOffset/60;
  return{
    id:profile.id,
    name:profile.name,
    gender:profile.gender,
    birth:{
      year:b.year,
      month:b.month,
      day:b.day,
      hour:b.hour!=null?b.hour:12,
      minute:b.minute!=null?b.minute:0,
      calType:b.calType||'solar'
    },
    location:{
      label:l.label||'대한민국 (서울)',
      tz:l.tz||'Asia/Seoul',
      lat, lng,
      tzOffset:tz,
      baseTzOffset:tz,
      dstMinutes:l.dstMinutes
    }
  };
}

// ─── PROFILE → FORM (f.timezone = UTC 오프셋 시간 단위, 예: 9 = UTC+9) ─
function profileToForm(profile){
  const p=normalizeProfileForVedic(profile)||profile;
  const birth=p.birth||{};
  const loc=p.location||{};
  let tz=9;
  if(typeof loc.baseTzOffset==='number'&&!isNaN(loc.baseTzOffset))tz=loc.baseTzOffset;
  else if(typeof loc.tzOffset==='number'&&!isNaN(loc.tzOffset))tz=Math.abs(loc.tzOffset)<=24?loc.tzOffset:loc.tzOffset/60;
  const latRaw=parseFloat(loc.lat);
  const lonRaw=parseFloat(loc.lng)||parseFloat(loc.lon);
  // profile 카드 payload가 일부 값이 누락/범위 이탈되어도 결과 화면으로 진입하도록 기본값 처리
  const lat=(typeof latRaw==='number'&&!isNaN(latRaw))?latRaw:37.5665;
  const lon=(typeof lonRaw==='number'&&!isNaN(lonRaw))?lonRaw:126.978;
  const yearRaw=parseInt(birth.year,10);
  const monthRaw=parseInt(birth.month,10);
  const dayRaw=parseInt(birth.day,10);
  // 연도 범위 검증을 결과 화면 진입을 막는 형태로 쓰지 않음
  const year=Number.isFinite(yearRaw)?yearRaw:1990;
  const month=(Number.isFinite(monthRaw)&&monthRaw>=1&&monthRaw<=12)?monthRaw:1;
  const day=(Number.isFinite(dayRaw)&&dayRaw>=1&&dayRaw<=31)?dayRaw:1;
  const hourRaw=parseInt(birth.hour,10);
  const minuteRaw=parseInt(birth.minute,10);
  const hour=(Number.isFinite(hourRaw)&&hourRaw>=0&&hourRaw<=23)?hourRaw:12;
  const minute=(Number.isFinite(minuteRaw)&&minuteRaw>=0&&minuteRaw<=59)?minuteRaw:0;
  return{
    name:(p.name||'').trim()||'이름없음',
    gender:p.gender||'M',
    year:year,
    month:month,
    day:day,
    hour:hour,
    minute:minute,
    lat:lat,
    lon:lon,
    timezone:tz
  };
}

// ─── CALCULATE FROM PROFILE (로컬 Swiss 라이브러리 계산) ───────
function doCalculateFromProfile(profile){
  const f=profileToForm(profile);
  if(isNaN(f.year)||isNaN(f.month)||isNaN(f.day)){alert('생년월일을 확인해 주세요. (연도:'+f.year+', 월:'+f.month+', 일:'+f.day+')');return;}
  if(isNaN(f.lat)||isNaN(f.lon)){alert('위도/경도를 확인해 주세요. 장소를 선택하거나 수동으로 입력해 주세요.');return;}
  var nameEl=document.getElementById('loading-name');
  if(nameEl) nameEl.textContent=f.name+'님의';
  showPage('loading');

  function runWithLocalSwiss(detail){
    try{
      var chart=buildChart(f);
      if(!chart||!chart.f){throw new Error('Chart build failed: invalid chart structure');}
      var report=analyze(chart);
      if(!report){throw new Error('Analysis failed: no report generated');}
      var insights=generateInsights(chart,report);
      if(!insights){throw new Error('Insights generation failed');}
      G.chart=chart;G.report=report;G.insights=insights;G.activeTab='overview';
      try{G.sections=buildVedicSections(chart,report,insights);}catch(secErr){console.error('[vedic] section build failed',secErr);G.sections=null;}
      try{G.deep=buildVedicDeepDetails(chart,report);}catch(deepErr){console.error('[vedic] deep detail build failed',deepErr);G.deep=null;}
      vedicAiResetForChart(chart);
      G.vedicCompatibilityResult=null;
      G.usedLocalCalc=true;
      G.usedSwissFallback=!!window.__vedicSwissFallbackUsed;
      renderResult();
      showPage('result');
    }catch(localErr){
      console.error('[vedic] local swiss calculation failed', localErr);
      showLocalSwissError((detail?String(detail)+' | ':'') + String((localErr&&localErr.message)||localErr||'local swiss calculation failed'));
    }
  }

  function showLocalSwissError(detail){
    if(detail){ console.warn('[vedic] Local Swiss Error:', detail); }
    var detailText=detail?('<br><br>상세: '+String(detail)):'';
    document.getElementById('result-content').innerHTML='<div class="error-box">계산에 실패했습니다. 잠시 후 다시 시도해 주세요.'+detailText+'<br><br><button onclick="showPage(\'input\')" style="background:rgba(139,92,246,0.3);border:1px solid var(--border);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:10px;">입력 화면으로 돌아가기</button></div>';
    showPage('result');
  }

  _vedicEnsureSwissReady(4500)
    .then(function(){ runWithLocalSwiss('local swisseph mode'); })
    .catch(function(err){
      console.warn('[vedic] Swiss bridge timeout; continue with fallback engine', err);
      runWithLocalSwiss('fallback analytical mode');
    });
}

// ─── INIT: 프로필이 있으면 바로 로컬 Swiss 계산 결과 화면으로 진입 ─
function _hasValidBirth(p){
  if(!p||!p.birth)return false;
  const b=p.birth;
  const numOrStr=function(v){ return v!==undefined&&v!==null&&v!==''&&(typeof v==='number'?!isNaN(v):String(v).trim()!==''); };
  return numOrStr(b.year)&&numOrStr(b.month)&&numOrStr(b.day);
}
function _hasAnyBirth(p){
  if(!p||!p.birth)return false;
  const b=p.birth;
  return (b.year!=null&&b.year!=='')||(b.month!=null&&b.month!=='')||(b.day!=null&&b.day!=='');
}
function _repairProfile(profile){
  if(!profile)return null;
  if(profile.birth&&typeof profile.birthDate==='string'&&(profile.birth.year==null||profile.birth.month==null||profile.birth.day==null)){
    var bdParts=profile.birthDate.split(/[-/]/);
    if(bdParts.length>=3){
      if(profile.birth.year==null)profile.birth.year=parseInt(bdParts[0],10);
      if(profile.birth.month==null)profile.birth.month=parseInt(bdParts[1],10);
      if(profile.birth.day==null)profile.birth.day=parseInt(bdParts[2],10);
    }else if(bdParts.length===1&&bdParts[0].length>=8){
      if(profile.birth.year==null)profile.birth.year=parseInt(bdParts[0].slice(0,4),10);
      if(profile.birth.month==null)profile.birth.month=parseInt(bdParts[0].slice(4,6),10);
      if(profile.birth.day==null)profile.birth.day=parseInt(bdParts[0].slice(6,8),10);
    }
  }
  if(!profile.birth&&(profile.birthYear!=null||profile.birthMonth!=null||profile.birthDay!=null)){
    profile={ id:profile.id,name:profile.name,gender:profile.gender,location:profile.location,birth:{ year:profile.birthYear,month:profile.birthMonth,day:profile.birthDay,hour:profile.birthHour,minute:profile.birthMinute } };
  }
  if(!profile.birth&&(profile.birthDate||profile.birthTime)){
    var y=1990,m=1,d=1,hr=12,min=0;
    if(typeof profile.birthDate==='string'){
      var parts=profile.birthDate.split(/[-/]/);
      if(parts.length>=3){ y=parseInt(parts[0],10)||y; m=parseInt(parts[1],10)||m; d=parseInt(parts[2],10)||d; }
      else if(parts.length===1&&parts[0].length>=8){ y=parseInt(parts[0].slice(0,4),10)||y; m=parseInt(parts[0].slice(4,6),10)||m; d=parseInt(parts[0].slice(6,8),10)||d; }
    }
    if(typeof profile.birthTime==='string'){
      var tparts=profile.birthTime.split(/[:]/);
      if(tparts.length>=2){ hr=parseInt(tparts[0],10); min=parseInt(tparts[1],10); if(isNaN(hr))hr=12; if(isNaN(min))min=0; }
    }
    profile.birth=profile.birth||{ year:y,month:m,day:d,hour:hr,minute:min };
  }
  const b=profile.birth||{};
  if((b.hour==null||b.hour==='')&&profile.birthHour!=null&&profile.birthHour!=='')b.hour=profile.birthHour;
  if((b.minute==null||b.minute==='')&&profile.birthMinute!=null&&profile.birthMinute!=='')b.minute=profile.birthMinute;
  if((b.hour==null||b.hour===''||b.minute==null||b.minute==='')&&typeof profile.birthTime==='string'){
    var _timeParts=profile.birthTime.split(':');
    if(_timeParts.length>=2){
      if(b.hour==null||b.hour==='')b.hour=parseInt(_timeParts[0],10);
      if(b.minute==null||b.minute==='')b.minute=parseInt(_timeParts[1],10);
    }
  }
  if(b.year==null||b.year==='')b.year=1990;
  if(b.month==null||b.month==='')b.month=1;
  if(b.day==null||b.day==='')b.day=1;
  if(b.hour==null&&b.hour!==0)b.hour=12;
  if(b.minute==null&&b.minute!==0)b.minute=0;
  profile.birth=b;
  return profile;
}

function _pickProfileFromList(arr,currentId){
  if(!Array.isArray(arr)||!arr.length) return null;
  var profile=null;
  if(currentId){
    profile=arr.find(function(p){ return p&&p.id===currentId; })||null;
  }
  if(!profile) profile=arr[0];
  if(profile&&!_hasValidBirth(profile)) profile=arr.find(_hasValidBirth)||arr.find(_hasAnyBirth)||arr[0];
  return profile||null;
}
function _selectBirthPlaceByProfile(loc){
  try{
    var sel=document.getElementById('v_place');
    if(!sel||!sel.options||!sel.options.length) return false;

    var label=String((loc&&loc.label)||'').trim();
    var tz=String((loc&&loc.tz)||'').trim();
    var lat=parseFloat(loc&&loc.lat);
    var lon=parseFloat(loc&&loc.lng);
    if(!isFinite(lon)) lon=parseFloat(loc&&loc.lon);

    var bestIdx=-1;
    var bestScore=-1;
    for(var i=0;i<sel.options.length;i++){
      var opt=sel.options[i];
      if(!opt) continue;

      var score=0;
      var optText=String(opt.textContent||'').trim();
      var optTz=String(opt.value||'').trim();
      var optLat=parseFloat(opt.getAttribute('data-lat')||'');
      var optLon=parseFloat(opt.getAttribute('data-long')||'');

      if(label&&optText===label) score+=100;
      else if(label&&optText&&(optText.indexOf(label)>=0||label.indexOf(optText)>=0)) score+=70;
      if(tz&&optTz===tz) score+=20;

      if(isFinite(lat)&&isFinite(lon)&&isFinite(optLat)&&isFinite(optLon)){
        var dist=Math.abs(optLat-lat)+Math.abs(optLon-lon);
        if(dist<0.0005) score+=80;
        else if(dist<0.01) score+=60;
        else if(dist<0.05) score+=40;
        else if(dist<0.2) score+=20;
      }

      if(score>bestScore){
        bestScore=score;
        bestIdx=i;
      }
    }

    if(bestIdx<0||bestScore<20) return false;
    sel.selectedIndex=bestIdx;
    try{ vedicApplySelectedPlace(); }catch(_){ }
    try{ vedicSyncPlaceTextFromSelect(); }catch(_){ }
    return true;
  }catch(_){
    return false;
  }
}
function _readProfileFromStorage(){

    raw=localStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD');

  }
  if(typeof sessionStorage!=='undefined'){
    raw=sessionStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){ }
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){
        sessionStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD');
        profile=_repairProfile(profile);
        if(_hasValidBirth(profile)) return profile;
      }
    }
  }
  if(typeof window!=='undefined'&&window.FORTUNE_APP_VEDIC_PAYLOAD){
    profile=_repairProfile(window.FORTUNE_APP_VEDIC_PAYLOAD);
    if(_hasValidBirth(profile)) return profile;
  }
  if(typeof localStorage!=='undefined'){
    raw=localStorage.getItem('FORTUNE_APP_USER_PROFILE');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){ }
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){
        profile=_repairProfile(profile);
        if(_hasValidBirth(profile)) return profile;
      }
    }
  }
  if(typeof sessionStorage!=='undefined'){
    raw=sessionStorage.getItem('FORTUNE_APP_USER_PROFILE');
    if(raw){ try{ profile=JSON.parse(raw); }catch(_){ }
      if(profile&&(profile.birth||profile.birthYear!=null||profile.birthDate)){
        profile=_repairProfile(profile);
        if(_hasValidBirth(profile)) return profile;
      }
    }
  }
  if(typeof localStorage!=='undefined'){
    var scopes=[_readVedicAuthScope()];
    if(scopes[0]!=='guest') scopes.push('guest');
    for(var si=0;si<scopes.length;si++){
      var scope=String(scopes[si]||'guest');
      var scopedListRaw=localStorage.getItem('FORTUNE_APP_USER_PROFILES.list::'+scope);
      if(!scopedListRaw) continue;
      var scopedArr=[];
      try{ scopedArr=JSON.parse(scopedListRaw); }catch(_){ scopedArr=[]; }
      var scopedCurrentId=localStorage.getItem('FORTUNE_APP_USER_PROFILES.current::'+scope)||'';
      profile=_pickProfileFromList(scopedArr,scopedCurrentId);
      if(profile) return _repairProfile(profile);
    }

    const listRaw=localStorage.getItem('FORTUNE_APP_USER_PROFILES.list');
    const currentId=localStorage.getItem('FORTUNE_APP_USER_PROFILES.current');
    if(listRaw){
      let arr=[]; try{ arr=JSON.parse(listRaw); }catch(_){}
      profile=_pickProfileFromList(arr,currentId);
      if(profile)return _repairProfile(profile);
    }
    const legacy=localStorage.getItem('FORTUNE_APP_USER_PROFILES');
    if(legacy){ try{ const a=JSON.parse(legacy); if(Array.isArray(a)&&a.length){ profile=a.find(_hasValidBirth)||a.find(_hasAnyBirth)||a[0]; if(profile)return _repairProfile(profile); } }catch(_){ } }
  }
  return null;
}
function _fillInputFromProfile(profile){
  try{
    var b=(profile&&profile.birth)||{};
    var l=(profile&&profile.location)||{};
    function setV(id,v){ var el=document.getElementById(id); if(el&&v!=null&&v!=='') el.value=String(v); }
    setV('v_name',profile&&profile.name);
    setV('v_year',b.year);
    setV('v_month',b.month);
    setV('v_day',b.day);
    setV('v_hour',b.hour!=null?b.hour:12);
    setV('v_minute',b.minute!=null?b.minute:0);
    if(profile&&profile.gender){ var genEl=document.getElementById('v_gender'); if(genEl) genEl.value=String(profile.gender); }
    var lat=(l.lat!=null&&!isNaN(parseFloat(l.lat)))?l.lat:37.5665;
    var lng=(l.lng!=null&&!isNaN(parseFloat(l.lng)))?l.lng:(l.lon!=null&&!isNaN(parseFloat(l.lon))?l.lon:126.978);
    var tz=(l.baseTzOffset!=null&&!isNaN(l.baseTzOffset))?l.baseTzOffset:(l.tzOffset!=null&&!isNaN(l.tzOffset)?l.tzOffset:9);
    setV('v_lat',lat);
    setV('v_lon',lng);
    setV('v_tz',tz);

    var matchedPlace=_selectBirthPlaceByProfile(l);
    if(!matchedPlace){
      try{ vedicApplySelectedPlace(); }catch(_){ }
      setV('v_lat',lat);
      setV('v_lon',lng);
      setV('v_tz',tz);
    }

    try{ _syncVedicToProfileCardCompatFields(); }catch(_){ }
  }catch(_){}
}

function initVedicPage(){
  try{ vedicInitLanguageBridge(); }catch(_){}
  // URL payload 우선 처리: storage 접근 실패 환경에서도 프로필 카드 진입 보장
  var _qp=null;
  try{
    var _sp=new URLSearchParams(window.location.search||'');
    var _vpRaw=_sp.get('vp');
    if(_vpRaw){
      try{ _qp=JSON.parse(decodeURIComponent(_vpRaw)); }catch(_){ try{ _qp=JSON.parse(_vpRaw); }catch(_){ _qp=null; } }
      if(_qp){
        try{ _qp=_repairProfile(_qp); }catch(_){}
        try{ _qp=normalizeProfileForVedic(_qp)||_qp; }catch(_){}
        _fillInputFromProfile(_qp);
        if(_hasValidBirth(_qp)){
          try{
            _sp.delete('vp');
            var _newQ=_sp.toString();
            history.replaceState(null,'',window.location.pathname+(_newQ?('?'+_newQ):'')+window.location.hash);
          }catch(_){}
          doCalculateFromProfile(_qp);
          return;
        }
        showPage('input');
        return;
      }
    }
  }catch(_){}
  // VEDIC_PAYLOAD 직접 읽기: _readProfileFromStorage가 삭제하기 전에 먼저 확보
  var _vp=null;
  try{
    var _vpRaw=(typeof localStorage!=='undefined'?localStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD'):null)||(typeof sessionStorage!=='undefined'?sessionStorage.getItem('FORTUNE_APP_VEDIC_PAYLOAD'):null);
    if(_vpRaw){ try{ _vp=JSON.parse(_vpRaw); }catch(_){} }
    else if(typeof window!=='undefined'&&window.FORTUNE_APP_VEDIC_PAYLOAD){ _vp=window.FORTUNE_APP_VEDIC_PAYLOAD; }
  }catch(_){}
  try{ if(typeof localStorage!=='undefined') localStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD'); }catch(_){}
  try{ if(typeof sessionStorage!=='undefined') sessionStorage.removeItem('FORTUNE_APP_VEDIC_PAYLOAD'); }catch(_){}
  if(_vp){
    try{ _vp=_repairProfile(_vp); }catch(_){}
    try{ _vp=normalizeProfileForVedic(_vp)||_vp; }catch(_){}
    _fillInputFromProfile(_vp);
    if(_hasValidBirth(_vp)){ doCalculateFromProfile(_vp); return; }
    // 생년월일 불완전 시 프리필된 폼 표시
    showPage('input');
    return;
  }
  let profile=null;
  try{ profile=_readProfileFromStorage(); }catch(e){}
  if(!profile){ showPage('input'); return; }
  try{ profile=normalizeProfileForVedic(profile)||profile; }catch(_){}
  if(!profile.birth||(profile.birth.year==null&&profile.birth.month==null&&profile.birth.day==null)){ showPage('input'); return; }
  _fillInputFromProfile(profile);
  doCalculateFromProfile(profile);
}

function _vedicPad2(v){
  var n=parseInt(v,10);
  if(!isFinite(n)) n=0;
  return String(n).padStart(2,'0');
}

function _syncVedicToProfileCardCompatFields(){
  try{
    var host=document.getElementById('page-input')||document.body;
    function ensure(tag,id,type){
      var el=document.getElementById(id);
      if(!el){
        el=document.createElement(tag);
        el.id=id;
        if(type) el.type=type;
        el.style.display='none';
        host.appendChild(el);
      }
      return el;
    }

    var y=parseInt((document.getElementById('v_year')||{}).value,10);
    var m=parseInt((document.getElementById('v_month')||{}).value,10);
    var d=parseInt((document.getElementById('v_day')||{}).value,10);
    var h=parseInt((document.getElementById('v_hour')||{}).value,10);
    var mi=parseInt((document.getElementById('v_minute')||{}).value,10);
    var tz=parseFloat((document.getElementById('v_tz')||{}).value);
    var lat=parseFloat((document.getElementById('v_lat')||{}).value);
    var lon=parseFloat((document.getElementById('v_lon')||{}).value);

    var bd=ensure('input','birthDate','date');
    if(isFinite(y)&&isFinite(m)&&isFinite(d)&&y>0&&m>=1&&m<=12&&d>=1&&d<=31){
      bd.value=String(y).padStart(4,'0')+'-'+_vedicPad2(m)+'-'+_vedicPad2(d);
    }

    var bh=ensure('input','birthHour','number');
    var bm=ensure('input','birthMinute','number');
    bh.value=isFinite(h)?String(h):'12';
    bm.value=isFinite(mi)?String(mi):'0';

    var btnM=ensure('button','btnM');
    var btnF=ensure('button','btnF');
    var g=((document.getElementById('v_gender')||{}).value||'M');
    if(g==='M'){
      btnM.classList.add('on');
      btnF.classList.remove('on');
    }else{
      btnF.classList.add('on');
      btnM.classList.remove('on');
    }

    var countrySel=ensure('select','birthCountry');
    while(countrySel.options.length) countrySel.remove(0);
    var opt=document.createElement('option');
    var placeEl=document.getElementById('v_place');
    var placeText=(placeEl&&placeEl.options&&placeEl.selectedIndex>=0&&placeEl.options[placeEl.selectedIndex])?placeEl.options[placeEl.selectedIndex].text:'대한민국 (서울)';
    var placeTz=(placeEl&&placeEl.value)?String(placeEl.value):'Asia/Seoul';
    opt.value=placeTz;
    opt.text=placeText;
    opt.setAttribute('data-long', isFinite(lon)?String(lon):'126.978');
    opt.setAttribute('data-lat', isFinite(lat)?String(lat):'37.5665');
    opt.setAttribute('data-tz', isFinite(tz)?String(tz):'9');
    opt.setAttribute('data-base-tz', isFinite(tz)?String(tz):'9');
    countrySel.appendChild(opt);
    countrySel.selectedIndex=0;
  }catch(_){ }
}

function _readVedicCompatProfileCardData(){
  try{ _syncVedicToProfileCardCompatFields(); }catch(_){ }
  try{
    var bd=(document.getElementById('birthDate')||{}).value||'';
    if(!bd) return null;
    var hourRaw=parseInt((document.getElementById('birthHour')||{}).value,10);
    var minuteRaw=parseInt((document.getElementById('birthMinute')||{}).value,10);
    var hour=(Number.isFinite(hourRaw)&&hourRaw>=0&&hourRaw<=23)?hourRaw:12;
    var minute=(Number.isFinite(minuteRaw)&&minuteRaw>=0&&minuteRaw<=59)?minuteRaw:0;
    var gender='F';
    var btnM=document.getElementById('btnM');
    var btnF=document.getElementById('btnF');
    if(btnM&&btnM.classList.contains('on')) gender='M';
    else if(btnF&&btnF.classList.contains('on')) gender='F';
    var nameValue=((document.getElementById('v_name')||{}).value||'').trim()||'나의 베다 차트';
    var countrySel=document.getElementById('birthCountry');
    var opt=countrySel?countrySel.options[countrySel.selectedIndex]:null;
    var tz=opt?countrySel.value:'Asia/Seoul';
    var lng=opt?parseFloat(opt.getAttribute('data-long')||'127'):127.0;
    var lat=opt?parseFloat(opt.getAttribute('data-lat')||'37.6'):37.6;
    var tzOff=opt?parseFloat(opt.getAttribute('data-tz')||'9'):9;
    var baseTzOff=opt?parseFloat(opt.getAttribute('data-base-tz')||String(tzOff)):tzOff;
    var locationLabel=opt?opt.text:'대한민국 (서울)';
    var parts=bd.split('-');
    if(parts.length<3) return null;
    var year=parseInt(parts[0],10), month=parseInt(parts[1],10), day=parseInt(parts[2],10);
    return {
      id:'vedic_manual',
      name:nameValue,
      gender:gender,
      birth:{ year:year, month:month, day:day, hour:hour, minute:minute, calType:'solar' },
      location:{ label:locationLabel, tz:tz, lng:lng, lat:lat, tzOffset:baseTzOff, baseTzOffset:baseTzOff }
    };
  }catch(_){ return null; }
}

function vedicShowInputError(message){

}

function vedicValidCalendarDate(y,m,d){
  var dt=new Date(Date.UTC(0,0,1));
  dt.setUTCFullYear(y,m-1,d);
  return dt.getUTCFullYear()===y&&dt.getUTCMonth()===(m-1)&&dt.getUTCDate()===d;
}

function vedicReadManualProfile(){
  var yEl=document.getElementById('v_year');
  var mEl=document.getElementById('v_month');
  var dEl=document.getElementById('v_day');
  var hEl=document.getElementById('v_hour');
  var minEl=document.getElementById('v_minute');
  var latEl=document.getElementById('v_lat');
  var lonEl=document.getElementById('v_lon');
  var tzEl=document.getElementById('v_tz');
  var gEl=document.getElementById('v_gender');
  var nameEl=document.getElementById('v_name');
  var placeEl=document.getElementById('v_place');
  var y=parseInt(yEl&&yEl.value?yEl.value:'',10);
  var m=parseInt(mEl&&mEl.value?mEl.value:'',10);
  var d=parseInt(dEl&&dEl.value?dEl.value:'',10);
  var hRaw=hEl&&hEl.value?String(hEl.value).trim():'';
  var minRaw=minEl&&minEl.value?String(minEl.value).trim():'';
  var tzRaw=tzEl&&tzEl.value?String(tzEl.value).trim():'';
  var hr=hRaw===''?12:parseInt(hRaw,10);
  var min=minRaw===''?0:parseInt(minRaw,10);
  var lat=parseFloat(latEl&&latEl.value?latEl.value:'');
  var lon=parseFloat(lonEl&&lonEl.value?lonEl.value:'');
  var tz=tzRaw===''?9:parseFloat(tzRaw);
  if(!Number.isFinite(y)||!Number.isFinite(m)||!Number.isFinite(d)){
    return {error:'생년월일을 모두 입력해 주세요.'};
  }
  if(y<1||y>9999||m<1||m>12||d<1||d>31||!vedicValidCalendarDate(y,m,d)){
    return {error:'실제로 존재하는 생년월일을 입력해 주세요.'};
  }
  if(!Number.isFinite(hr)||hr<0||hr>23){
    return {error:'태어난 시는 0~23 사이로 입력해 주세요.'};
  }
  if(!Number.isFinite(min)||min<0||min>59){
    return {error:'태어난 분은 0~59 사이로 입력해 주세요.'};
  }
  if(!Number.isFinite(lat)||lat<-90||lat>90){
    return {error:'위도는 -90~90 사이로 입력해 주세요.'};
  }
  if(!Number.isFinite(lon)||lon<-180||lon>180){
    return {error:'경도는 -180~180 사이로 입력해 주세요.'};
  }
  if(!Number.isFinite(tz)||tz<-14||tz>14){
    return {error:'타임존 오프셋은 -14~14 사이로 입력해 주세요.'};
  }
  var manualName=(nameEl&&nameEl.value?String(nameEl.value).trim():'')||'나의 베다 차트';
  var placeLabel='직접 입력';
  if(placeEl&&placeEl.options&&placeEl.selectedIndex>=0){
    placeLabel=placeEl.options[placeEl.selectedIndex].text||placeLabel;
  }
  return {
    profile:{
      id:'vedic_manual',
      name:manualName.slice(0,40),
      gender:gEl&&gEl.value?gEl.value:'M',
      birth:{ year:y,month:m,day:d,hour:hr,minute:min,calType:'solar' },
      location:{ lat:lat, lng:lon, tzOffset:tz, baseTzOffset:tz, label:placeLabel, tz:placeEl&&placeEl.value?String(placeEl.value):'' }
    }
  };
}

  }
}

    {d:`M${cx},${cy} L${cx-50},${cy-50} L${cx},0 Z`,tx:cx-28,ty:cy-42},
    {d:`M${cx},${cy} L0,0 L${cx-50},${cy-50} Z`,tx:50,ty:cy-22},
    {d:`M${cx},${cy} L${cx+50},${cy-50} L${W},0 Z`,tx:cx+52,ty:cy-22}
  ];

  <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="10" fill="rgba(212,175,55,0.4)" font-weight="bold">☉</text>

// 문장 단위 분할 — 소수점(4.3년)에서 끊기지 않도록 마침표 뒤 공백/끝만 경계로 본다.
function vdSentences(text){
  const s=String(text||'').trim();
  if(!s)return[];
  const out=[];let buf='';
  for(let i=0;i<s.length;i++){
    const chNow=s.charAt(i);
    buf+=chNow;
    if((chNow==='.'||chNow==='!'||chNow==='?')&&(i===s.length-1||s.charAt(i+1)===' ')){
      if(buf.trim())out.push(buf.trim());
      buf='';
    }
  }
  if(buf.trim())out.push(buf.trim());
  return out;
}
function vdParas(text,per){
  const sents=vdSentences(text);
  if(!sents.length)return'';
  const step=per||2;const out=[];
  for(let i=0;i<sents.length;i+=step)out.push('<p>'+sents.slice(i,i+step).join(' ')+'</p>');
  return out.join('');
}
function vdList(items){
  const rows=(items||[]).map(function(x){return String(x||'').trim();}).filter(Boolean);
  if(!rows.length)return'';
  return'<ul class="vd-list">'+rows.map(function(x){return'<li>'+x+'</li>';}).join('')+'</ul>';
}
function vdCardBody(sec,key){
  if(key==='summary')return vdParas(sec.summary,2);
  if(key==='basis')return vdList(sec.basis)+vdParas(sec.meaning,2);
  if(key==='reality')return vdList(sec.reality)+vdParas(sec.merit,2);
  if(key==='caution')return vdParas(sec.caution,2);
  if(key==='action')return vdList(sec.action);
  return vdParas(sec.closing,2);
}
function renderVedicSectionCards(sec,opts){
  if(!sec)return'';
  const o=opts||{};
  const chips=(sec.chips||[]).filter(Boolean);
  const head=o.hideHead?'':'<div class="vd-head"><span class="vd-head-icon" aria-hidden="true">'+(sec.icon||'🪷')+'</span><span class="vd-head-title">'+(sec.title||'')+'</span></div>';
  const chipHtml=chips.length?'<div class="vd-chips">'+chips.map(function(c,i){
    const cls=['tag-gold','tag-purple','tag-cyan','tag-pink'][i%4];
    return'<span class="tag '+cls+'">'+c+'</span>';
  }).join('')+'</div>':'';
  const cards=VD_CARD_DEFS.map(function(def){
    const body=vdCardBody(sec,def.k);
    if(!body)return'';
    return'<div class="vd-card" style="--vd-accent:'+def.accent+';--vd-bar:'+def.bar+';--vd-edge:'+def.edge+';--vd-glow:'+def.glow+'">'+

      body+'</div>';
  }).join('');
  return'<div class="reveal reveal-delay-1">'+head+chipHtml+'<div class="vd-stack">'+cards+'</div></div>';
}
function vdSection(key){
  try{return(G&&G.sections)?G.sections[key]:null;}catch(e){return null;}
}
function vdDeep(key){
  try{return(G&&G.deep)?G.deep[key]:null;}catch(e){return null;}
}
// 심화 서술 블록 렌더 — 기존 칩·한 줄 아래에 덧붙인다.
function renderDeepBlock(key,opts){
  const blk=vdDeep(key);
  if(!blk)return'';
  const o=opts||{};
  const paras=(blk.paras||[]).map(function(t){return vdParas(t,2);}).join('');
  const rows=(blk.rows||[]).filter(function(r){return r&&String(r.body||'').trim();}).map(function(r){
    return'<div class="vd-row"><div class="vd-row-label">'+r.label+'</div><div class="vd-row-body">'+vdParas(r.body,2)+'</div></div>';
  }).join('');
  if(!paras&&!rows)return'';
  return'<div class="vd-deep"'+(o.style?' style="'+o.style+'"':'')+'>'+paras+rows+'</div>';
}

function renderChakra(ch,ins){

async function _vedicCompatCoinGate(cost, reason){
  cost=VEDIC_COMPAT_COST;
  reason=String(reason||'베다점 궁합 계산');

  var requestId='vedic:compat:'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
  function syncVedicBilling(payload, txId){
    var source=payload&&typeof payload==='object'?payload:{};
    var data=source.data&&typeof source.data==='object'?source.data:{};
    var consume=source.consume&&typeof source.consume==='object'?source.consume:(data.consume&&typeof data.consume==='object'?data.consume:{});
    var nb=Number(source.balance ?? data.balance ?? (source.user&&source.user.points) ?? (data.user&&data.user.points));
    if(Number.isFinite(nb)&&nb>=0){
      try{
        var _u3=JSON.parse(localStorage.getItem('fortune_auth_user')||'null')||{};
        _u3.points=nb;
        localStorage.setItem('fortune_auth_user',JSON.stringify(_u3));
      }catch(_){}
      if(typeof window.__cdSetGoldenBalance==='function')window.__cdSetGoldenBalance(nb);
    }
    return String(txId||source.transactionId||source.paymentId||source.purchaseId||consume.transactionId||consume._id||requestId);
  }

  if(typeof window._cdCoinGatePerUse==='function'){
    if(_vedicCompatChargeInFlight){
      window.alert('결제 요청 처리 중입니다. 잠시 후 다시 시도해 주세요.');
      return false;
    }
    _vedicCompatChargeInFlight=true;
    _vedicSetPaymentPending(true,'이용권으로 바로 열 수 있는지 꽃돼지 연이가 확인하고 있어요.');
    var granted=false;
    try{
      var gateResult=window._cdCoinGatePerUse(cost,reason,function(transactionId,payload){
        granted=true;
        syncVedicBilling(payload,transactionId);
      },function(){granted=false;},{
        featureKey:'vedic-compatibility-per-use',
        serviceKey:'vedic-compatibility',
        action:'calculateVedicCompatibility',
        requestId:requestId
      });
      if(gateResult&&typeof gateResult.then==='function')gateResult=await gateResult;
      if(!granted&&gateResult&&typeof gateResult==='object'){
        var payload=gateResult.payload&&typeof gateResult.payload==='object'?gateResult.payload:gateResult;
        var status=String(gateResult.status||payload.status||'').toLowerCase();
        if(status==='granted'||status==='paid'||status==='success'||payload.accessGrant||payload.premiumAccessToken||payload.consume){
          granted=true;
          syncVedicBilling(payload,gateResult.transactionId);
        }
      }
      return granted;
    }catch(e){
      console.error('[vedic compat coin-gate]',e);
      window.alert('결제를 완료하지 못했습니다. 잠시 후 다시 시도해 주세요.');
      return false;
    }finally{
      _vedicCompatChargeInFlight=false;
      _vedicSetPaymentPending(false);
    }
  }

  // 공유 결제 게이트(destiny-profile.js) 미로드: 정책 우회 차감(직접 coin-gate/forceDeduct/COIN) 대신 안내.
  window.alert('결제 모듈을 불러오지 못했습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.');
  return false;
}

        ${activeDasha.antardasha.slice(0,5).map((ad,i)=>{
          const adNow=now>=new Date(ad.start)&&now<new Date(ad.end);
          return`<div style="padding:6px 10px;border-radius:10px;background:${adNow?PCOL[ad.planet]+'20':'rgba(255,255,255,0.04)'};border:1px solid ${adNow?PCOL[ad.planet]+'50':'rgba(255,255,255,0.07)'};font-size:11px;color:${adNow?PCOL[ad.planet]:'var(--text3)'}">
            ${PSYM[ad.planet]||''} ${PKRKR[ad.planet]||ad.planet}${adNow?' 🔥':''}
            <div style="font-size:10px;margin-top:2px">${ad.start}~${ad.end}</div>
          </div>`;}).join('')}
      </div>
    </div>`:''}
  </div>`:''}

  <!-- 전체 다샤 타임라인 -->
  <div class="acc-item reveal reveal-delay-2">
    <div class="acc-header" onclick="toggleAcc('vims-timeline')">
      <span style="font-size:16px">📅</span>
      <span class="acc-title">전체 대운 타임라인</span>
      <span class="acc-arrow" id="arr-vims-timeline">▾</span>
    </div>
    <div class="acc-body open" id="acc-vims-timeline">
      <div class="acc-inner" style="padding:0">
        ${(dashas||[]).map((d,idx)=>{
          const isActive=activeDasha&&d.planet===activeDasha.planet&&d.start===activeDasha.start;
          const isPast=new Date(d.end)<now;
          const col=PCOL[d.planet]||'#8B5CF6';
          return`<div style="display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);background:${isActive?col+'0D':'transparent'};position:relative">
            ${isActive?`<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${col};border-radius:2px"></div>`:''}
            <div style="min-width:32px;text-align:center">
              <div style="font-size:22px;opacity:${isPast?0.35:1}">${PSYM[d.planet]||'⭐'}</div>
            </div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
                <span style="font-size:13px;font-weight:700;color:${isPast?'var(--text3)':col}">${PKRKR[d.planet]||d.planet} 대운</span>
                ${isActive?`<span style="font-size:9px;padding:2px 7px;border-radius:8px;background:${col}22;color:${col};border:1px solid ${col}44">진행 중</span>`:''}
                ${isPast?`<span style="font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,0.04);color:var(--text3)">완료</span>`:''}
              </div>
              <div style="font-size:11px;color:var(--text3);margin-bottom:${isActive?6:0}px">${d.start} ~ ${d.end} · ${PYRS[d.planet]}년</div>
              ${isActive?`<div style="font-size:11px;color:var(--text2);line-height:1.6">${(DASHA_NARRATIVE[d.planet]||'').slice(0,90)}...</div>`:''}
            </div>
          </div>`;}).join('')}
      </div>
    </div>
  </div>

  <!-- 각 행성 대운 상세 -->
  <div class="acc-item reveal reveal-delay-3">
    <div class="acc-header" onclick="toggleAcc('vims-detail')">
      <span style="font-size:16px">📖</span>
      <span class="acc-title">마하다샤 행성별 해석 가이드</span>
      <span class="acc-arrow" id="arr-vims-detail">▾</span>
    </div>
    <div class="acc-body" id="acc-vims-detail">
      <div class="acc-inner" style="padding:0">
        ${PORD.map(pl=>`<div style="padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-size:20px">${PSYM[pl]||'⭐'}</span>
            <span style="font-size:13px;font-weight:700;color:${PCOL[pl]||'#8B5CF6'}">${PKRKR[pl]||pl} 대운</span>
            <span style="font-size:11px;color:var(--text3);margin-left:auto">${PYRS[pl]}년</span>
          </div>
          <div style="font-size:12px;color:var(--text2);line-height:1.8">${DASHA_NARRATIVE[pl]||''}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <!-- 다샤 활용법 -->
  <div class="acc-item reveal reveal-delay-4">
    <div class="acc-header" onclick="toggleAcc('vims-guide')">
      <span style="font-size:16px">🌠</span>
      <span class="acc-title">다샤 실전 활용법</span>
      <span class="acc-arrow" id="arr-vims-guide">▾</span>
    </div>
    <div class="acc-body" id="acc-vims-guide">
      <div class="acc-inner">
        <div style="font-size:13px;color:var(--text2);line-height:1.9">
          빔쇼타리 다샤를 최대로 활용하려면:<br>
          <br>
          <strong style="color:var(--gold)">1. 대운의 행성을 강화하세요</strong> — 현재 대운 행성의 만트라, 색상, 요일에 맞춘 수련이 그 대운의 긍정적 에너지를 증폭시킵니다.<br>
          <br>
          <strong style="color:var(--purple2)">2. 소운을 함께 보세요</strong> — 마하다샤(대운) 안에서 소운(안타르다샤)이 세부 리듬을 만듭니다. 대운·소운 행성이 차트에서 서로 우호적이면 그 시기가 특히 순조롭습니다.<br>
          <br>
          <strong style="color:var(--cyan)">3. 트랜짓과 결합하세요</strong> — 현재 대운 행성이 출생 목성·달과 합 또는 삼합이 되는 트랜짓 시기에 중요한 기회가 집중됩니다.<br>
          <br>
          <strong style="color:#22C55E">4. 어려운 대운도 성장의 씨앗</strong> — 토성·라후·케투 대운처럼 도전적인 대운이라 해서 나쁜 것은 아닙니다. 불필요한 것을 놓아주고 다음 대운의 씨앗을 심는 시기입니다.
        </div>
      </div>
    </div>
  </div>`;
}

</script>
</body>
</html>
