<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>명운(明運) · Code Destiny — 사주 프리미엄 작명</title>
<style>
:root{
  --navy:#060c1a;--navy2:#0a1628;--navy3:#0f1f38;
  --gold:#D4AF37;--gold2:#f5e27a;--gold3:#92720c;
  --text:#e2e8f0;--muted:#94a3b8;--dim:#475569;
  --border:rgba(212,175,55,.22);--card:rgba(255,255,255,.025);
  --木:#4ade80;--火:#f87171;--土:#fbbf24;--金:#c8a85e;--水:#60a5fa;
  --danger:#f87171;--warn:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;overflow-x:hidden;}
body{background:var(--navy);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.6;}

/* 인트로 */
#intro{position:fixed;inset:0;background:var(--navy);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;}
#intro.out{animation:fadeOut .9s forwards;}
@keyframes fadeOut{to{opacity:0;pointer-events:none;}}
.fusion-arena{position:relative;width:280px;height:280px;}
.elem-orb{position:absolute;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;opacity:0;animation:flyIn 1.5s cubic-bezier(.15,0,.2,1) forwards;}
.elem-orb.木{background:radial-gradient(circle,#4ade80,#166534);box-shadow:0 0 28px #4ade8077;--tx:-110px;--ty:-110px;top:0;left:0;animation-delay:.1s;}
.elem-orb.火{background:radial-gradient(circle,#f87171,#7f1d1d);box-shadow:0 0 28px #f8717177;--tx:110px;--ty:-110px;top:0;right:0;animation-delay:.22s;}
.elem-orb.土{background:radial-gradient(circle,#fbbf24,#78350f);box-shadow:0 0 28px #fbbf2477;--tx:0;--ty:120px;bottom:10px;left:50%;transform:translateX(-50%);animation-delay:.36s;}
.elem-orb.金{background:radial-gradient(circle,#e2c97e,#52400a);box-shadow:0 0 28px #e2c97e77;--tx:-110px;--ty:110px;bottom:10px;left:0;animation-delay:.5s;}
.elem-orb.水{background:radial-gradient(circle,#60a5fa,#1e3a8a);box-shadow:0 0 28px #60a5fa77;--tx:110px;--ty:110px;bottom:10px;right:0;animation-delay:.64s;}
@keyframes flyIn{0%{transform:translate(var(--tx),var(--ty)) scale(2);opacity:0;}45%{opacity:1;}78%{transform:translate(0,0) scale(1);opacity:1;}92%{transform:translate(0,0) scale(2.8);opacity:0;}100%{opacity:0;}}
.fusion-core{position:absolute;top:50%;left:50%;width:70px;height:70px;border-radius:50%;transform:translate(-50%,-50%);animation:coreBurst .7s 1.35s ease-out forwards;opacity:0;}
@keyframes coreBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(0);box-shadow:0 0 0 0 rgba(212,175,55,.9);}40%{opacity:1;box-shadow:0 0 50px 35px rgba(212,175,55,.35);}100%{opacity:0;box-shadow:0 0 120px 90px rgba(212,175,55,0);transform:translate(-50%,-50%) scale(3.5);}}
.ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid;animation:ringOut 2.2s ease-out forwards;opacity:0;}
.ring:nth-child(1){width:90px;height:90px;border-color:rgba(212,175,55,.55);animation-delay:1.35s;}
.ring:nth-child(2){width:150px;height:150px;border-color:rgba(212,175,55,.3);animation-delay:1.5s;}
.ring:nth-child(3){width:230px;height:230px;border-color:rgba(212,175,55,.12);animation-delay:1.65s;}
@keyframes ringOut{0%{opacity:0;transform:translate(-50%,-50%) scale(.1);}25%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(2.6);}}
.intro-title{font-family:'Cinzel Decorative',serif;font-size:54px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:appear 1s 1.9s forwards;opacity:0;margin-top:28px;line-height:1;}
.intro-sub{font-family:'Noto Serif KR';color:var(--muted);font-size:13px;letter-spacing:3px;animation:appear .8s 2.15s forwards;opacity:0;margin-top:10px;}
@keyframes appear{to{opacity:1;}}
@keyframes shimmer{0%{background-position:200% center;}100%{background-position:-200% center;}}

/* 파티클 */
#pts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.pt{position:absolute;border-radius:50%;animation:floatUp linear infinite;}
@keyframes floatUp{0%{transform:translateY(0);opacity:.4;}60%{opacity:.9;}100%{transform:translateY(-110vh);opacity:0;}}

/* 앱 레이아웃 */
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:40px 18px 100px;}
header{text-align:center;margin-bottom:38px;}
.hd-badge{font-size:11px;letter-spacing:6px;color:var(--gold);margin-bottom:10px;}
.hd-title{font-family:'Cinzel Decorative',serif;font-size:clamp(34px,7vw,58px);background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite;line-height:1.1;}
.hd-sub{font-family:'Noto Serif KR';color:var(--muted);font-size:14px;letter-spacing:2px;margin-top:8px;}

/* 스텝바 */
.step-bar{display:flex;align-items:flex-start;justify-content:center;margin:0 0 34px;}
.si{display:flex;flex-direction:column;align-items:center;gap:5px;}
.sn{width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .35s;background:rgba(255,255,255,.05);border:1px solid var(--dim);color:var(--dim);}
.sn.on{background:linear-gradient(135deg,var(--gold),var(--gold3));border:none;color:var(--navy);box-shadow:0 0 18px rgba(212,175,55,.28);}
.sl{font-size:11px;color:var(--dim);white-space:nowrap;transition:color .35s;}
.sl.on{color:var(--gold);}
.sline{width:56px;height:1px;background:var(--dim);margin:16px 3px 0;transition:background .35s;}
.sline.on{background:var(--gold);}

/* 카드 */
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:17px;padding:26px;margin-bottom:16px;animation:slideUp .45s ease;}
.card-title{font-family:'Noto Serif KR';font-size:14px;color:var(--gold);margin-bottom:18px;display:flex;align-items:center;gap:7px;}
@keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

/* 폼 */
.fg{margin-bottom:14px;}
.fg label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim);margin-bottom:6px;}
.fg select,.fg input{width:100%;background:#0c1928;color:var(--text);border:1px solid rgba(212,175,55,.2);border-radius:9px;padding:10px 13px;font-family:'Noto Sans KR';font-size:14px;outline:none;transition:border .2s,box-shadow .2s;appearance:none;}
.fg select:focus,.fg input:focus{border-color:rgba(212,175,55,.55);box-shadow:0 0 0 3px rgba(212,175,55,.09);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:460px){.g2,.g3{grid-template-columns:1fr;}}

/* 버튼 */
.btn-gold{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--navy);font-size:15px;font-weight:700;font-family:'Noto Serif KR';letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s,transform .1s;}
.btn-gold:hover{opacity:.9;transform:translateY(-1px);}
.btn-gold:disabled{opacity:.45;pointer-events:none;}
.btn-ghost{padding:11px 18px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--dim);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Noto Sans KR';transition:all .2s;}
.btn-ghost:hover{border-color:var(--border);color:var(--text);}
.btn-og{flex:1;padding:13px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--gold);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Noto Serif KR';transition:all .2s;}
.btn-og:hover{background:rgba(212,175,55,.07);}
.btn-og:disabled{opacity:.45;pointer-events:none;}
.btn-row{display:flex;gap:10px;margin-top:4px;}
.btn-pay{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#D4AF37,#f5c842,#92720c);color:#0a0f1c;font-size:16px;font-weight:700;font-family:'Noto Serif KR';letter-spacing:2px;cursor:pointer;box-shadow:0 4px 30px rgba(212,175,55,.3);transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-pay:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(212,175,55,.45);}

/* 사주 기둥 */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
@media(max-width:400px){.pillars{grid-template-columns:repeat(2,1fr);}}
.pillar{text-align:center;padding:14px 7px;background:rgba(255,255,255,.03);border-radius:12px;border:1px solid rgba(255,255,255,.06);}
.pillar .pl{font-size:10px;color:var(--dim);margin-bottom:9px;}
.pillar .ps{font-size:26px;font-weight:700;margin-bottom:3px;}
.pillar .po{font-size:10px;margin-bottom:9px;}
.pillar .pdiv{width:1px;height:15px;background:rgba(255,255,255,.07);margin:0 auto 9px;}
.pillar .pb{font-size:26px;font-weight:700;margin-bottom:3px;}
.pillar .pbo{font-size:10px;}

/* 오행바 */
.ohbar{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.ohbar-lbl{font-size:12px;width:34px;}
.ohbar-trk{flex:1;height:7px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;}
.ohbar-fill{height:100%;border-radius:4px;transition:width .9s ease;}
.ohbar-val{font-size:11px;color:var(--dim);width:14px;text-align:right;}

/* 성향분석 카드 */
.trait-section{margin-bottom:14px;}
.trait-label{font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.trait-text{font-size:13px;color:var(--muted);line-height:1.75;}
.trait-text strong{color:var(--text);}
.trait-text .bad{color:#f87171;}
.trait-text .good{color:#4ade80;}
.weakness-card{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.25);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
.wc-title{font-size:13px;color:#f87171;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.wc-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.wc-dot{width:5px;height:5px;border-radius:50%;background:#f87171;margin-top:7px;flex-shrink:0;}
.wc-text{font-size:13px;color:var(--muted);line-height:1.65;}
.wc-text em{color:var(--text);font-style:normal;}
.upsell-card{background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(212,175,55,.03));border:1px solid rgba(212,175,55,.35);border-radius:16px;padding:24px;margin-bottom:16px;}
.us-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);color:var(--gold);font-size:11px;padding:3px 12px;border-radius:20px;margin-bottom:12px;}
.us-title{font-family:'Noto Serif KR';font-size:18px;color:var(--text);font-weight:700;margin-bottom:8px;line-height:1.45;}
.us-desc{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:16px;}
.us-desc .hl{color:var(--gold2);font-weight:600;}
.us-items{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
@media(max-width:440px){.us-items{grid-template-columns:1fr;}}
.us-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:rgba(255,255,255,.03);border-radius:9px;border:1px solid rgba(255,255,255,.06);}
.us-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.us-item-text{font-size:12px;color:var(--muted);line-height:1.5;}
.us-item-text strong{color:var(--text);display:block;margin-bottom:1px;}
.price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.price-orig{font-size:14px;color:var(--dim);text-decoration:line-through;}
.price-now{font-size:26px;font-weight:700;color:var(--gold);font-family:'Noto Serif KR';}
.price-unit{font-size:13px;color:var(--muted);}
.guarantee{font-size:11px;color:var(--dim);text-align:center;margin-top:8px;}

/* 이름 카드 */
.names-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:11px;margin-bottom:18px;}
.nm-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:17px 15px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden;}
.nm-card:hover{background:rgba(212,175,55,.07);border-color:rgba(212,175,55,.38);transform:translateY(-2px);}
.nm-card.top{border-color:var(--gold);}
.nm-card .star{position:absolute;top:9px;right:10px;color:var(--gold);font-size:12px;}
.nm-name{font-size:25px;font-weight:700;letter-spacing:4px;color:#f8fafc;margin-bottom:6px;font-family:'Noto Serif KR';}
.nm-hanja{font-size:12px;color:var(--muted);margin-bottom:8px;}
.nm-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.oh-tag{font-size:10px;padding:2px 8px;border-radius:20px;}
.nm-btm{display:flex;justify-content:space-between;align-items:center;}
.nm-st{font-size:11px;color:var(--dim);}
.nm-sb{font-size:10px;}

/* 툴팁 */
.tip{position:relative;display:inline-flex;align-items:center;cursor:help;}
.tip-icon{color:var(--gold);font-size:11px;opacity:.65;margin-left:3px;}
.tip-box{position:absolute;bottom:calc(100%+6px);left:50%;transform:translateX(-50%);background:#1a2942;border:1px solid var(--gold);color:#e2e8f0;font-size:11px;padding:7px 11px;border-radius:7px;z-index:80;min-width:180px;max-width:240px;line-height:1.55;pointer-events:none;opacity:0;transition:opacity .15s;white-space:normal;}
.tip:hover .tip-box{opacity:1;}

/* 모달 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.83);z-index:300;display:none;align-items:center;justify-content:center;padding:14px;overflow-y:auto;}
#modal.open{display:flex;}
.mbox{background:#0c1726;border:1px solid rgba(212,175,55,.3);border-radius:18px;padding:26px;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 0 70px rgba(212,175,55,.07);animation:slideUp .3s ease;}
.mclose{position:absolute;top:13px;right:15px;background:none;border:none;color:var(--dim);font-size:19px;cursor:pointer;transition:color .2s;line-height:1;}
.mclose:hover{color:var(--text);}
.m-name{font-size:36px;font-weight:700;letter-spacing:5px;font-family:'Noto Serif KR';color:#f8fafc;margin-bottom:4px;}
.m-hanja{font-size:14px;color:var(--gold);margin-bottom:6px;}
.m-score{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11px;background:rgba(212,175,55,.1);color:var(--gold);border:1px solid rgba(212,175,55,.28);margin-bottom:18px;}
.ms{margin-bottom:18px;}
.ms-hd{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.5px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:10px;display:flex;align-items:center;gap:5px;}
.ms p{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:7px;}
.ms p strong{color:var(--text);}
.ms p .hl{color:var(--gold);font-weight:600;}
.ms p .good{color:#4ade80;}
.ms p .bad{color:#f87171;}
.infobox{font-size:12px;background:rgba(212,175,55,.05);border-left:2px solid var(--gold);padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;color:var(--muted);line-height:1.65;}
.flowrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0;}
.fpill{font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;}
.farr{color:var(--gold);font-size:13px;}
.suri-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:8px;}
.sc{text-align:center;padding:12px 8px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid rgba(255,255,255,.05);}
.sc .scl{font-size:10px;color:var(--dim);margin-bottom:3px;}
.sc .scf{font-size:10px;color:var(--dim);margin-bottom:4px;}
.sc .scn{font-size:20px;font-weight:700;margin-bottom:2px;}
.sc .scr{font-size:11px;font-weight:600;margin-bottom:4px;}
.sc .scd{font-size:10px;color:var(--muted);line-height:1.5;}
.yy-row{display:flex;gap:9px;margin-bottom:8px;}
.yy{flex:1;text-align:center;padding:10px 6px;background:rgba(255,255,255,.03);border-radius:9px;border:1px solid rgba(255,255,255,.05);}
.yy .yyl{font-size:10px;color:var(--dim);margin-bottom:4px;}
.yy .yyn{font-size:18px;font-weight:700;margin-bottom:2px;}
.yy .yyt{font-size:10px;}

/* 스피너 */
.spin{display:inline-block;width:17px;height:17px;border:2px solid rgba(212,175,55,.25);border-top-color:var(--gold);border-radius:50%;animation:spinning .7s linear infinite;}
@keyframes spinning{to{transform:rotate(360deg);}}

/* SVG 레이더 wrapper */
.radar-wrap{width:100%;max-width:210px;margin:0 auto;display:block;}
</style>
<link rel="preconnect" href="https://assets.code-destiny.com" crossorigin>
<style data-cd-r2-static-fonts>
@font-face{font-family:'CodeDestinyStaticDisplay';src:url('https://assets.code-destiny.com/Mulmaru.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'CodeDestinyStaticDecorative';src:url('https://assets.code-destiny.com/Galmuri11-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:optional}
:root{--font-body:'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;--font-display:'CodeDestinyStaticDisplay',var(--font-body);--font-decorative:'CodeDestinyStaticDecorative',var(--font-display)}
body{font-family:var(--font-body)!important;line-height:1.68;letter-spacing:0;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
h1,h2,h3,.title,.cover-title,.hero-title,.card-title,.section-title{font-family:var(--font-display)!important;letter-spacing:0;word-break:keep-all}
button,input,select,textarea{font-family:var(--font-body)!important}
</style>

<body>

<!-- 인트로 -->
<div id="intro">
  <div class="fusion-arena">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="elem-orb 木">木</div>
    <div class="elem-orb 火">火</div>
    <div class="elem-orb 土">土</div>
    <div class="elem-orb 金">金</div>
    <div class="elem-orb 水">水</div>
    <div class="fusion-core"></div>
  </div>
  <div class="intro-title">明運</div>
  <div class="intro-sub">사주 운명 작명 시스템</div>
</div>

<div id="pts"></div>

<div id="app" style="display:none;">
  <header>
    <p class="hd-badge">✦ PREMIUM DESTINY NAMING SYSTEM ✦</p>
    <h1 class="hd-title">明運</h1>
    <p class="hd-sub">Code Destiny — 사주 기반 프리미엄 작명 서비스</p>
  </header>
  <div class="step-bar" id="stepbar"></div>
  <div id="content"></div>
</div>

<div id="modal"><div class="mbox" id="mbox"></div></div>

<script>
// ════════════════════════════════════════════════
// ▌ 1. 상수 데이터
// ════════════════════════════════════════════════
const STEMS    =["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const STEMS_OH =["木","木","火","火","土","土","金","金","水","水"];
const STEMS_KR =["갑","을","병","정","무","기","경","신","임","계"];
const BRANCHES =["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const BRANCH_OH=["水","土","木","木","土","火","火","土","金","金","土","水"];
const BRANCH_KR=["자","축","인","묘","진","사","오","미","신","유","술","해"];
const OH_KR   ={木:"목(木)",火:"화(火)",土:"토(土)",金:"금(金)",水:"수(水)"};
const OH_CLR  ={木:"#4ade80",火:"#f87171",土:"#fbbf24",金:"#c8a85e",水:"#60a5fa"};

const CHOSUNG_LIST=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const BALPUM_MAP={ㄱ:"木",ㄲ:"木",ㅋ:"木",ㄴ:"火",ㄷ:"火",ㄸ:"火",ㄹ:"火",ㅌ:"火",ㅇ:"土",ㅎ:"土",ㅅ:"金",ㅆ:"金",ㅈ:"金",ㅉ:"金",ㅊ:"金",ㅁ:"水",ㅂ:"水",ㅃ:"水",ㅍ:"水"};
const OH_SOUND_CLASS={木:"아음(牙音) — ㄱ·ㅋ",火:"설음(舌音) — ㄴ·ㄷ·ㄹ·ㅌ",土:"후음(喉音) — ㅇ·ㅎ",金:"치음(齒音) — ㅅ·ㅈ·ㅊ",水:"순음(脣音) — ㅁ·ㅂ·ㅍ"};
function getChosung(ch){const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return"ㅇ";return CHOSUNG_LIST[Math.floor(c/588)];}
function getBalpum(kr){return BALPUM_MAP[getChosung(kr)]||"土";}

function getSaju(year,month,day,hour){
  const ySI=((year-4)%10+10)%10, yBI=((year-4)%12+12)%12;
  const yG=ySI%5; // 五虎遁年起月法: 甲己·乙庚·丙辛·丁壬·戊癸 그룹
  const mSB=[2,4,6,8,0][yG], mSI=(mSB+month-1)%10, mBI=(month+1)%12;

function randShuffle(arr,seed){
  const a=[...arr];let s=seed|0;
  for(let i=a.length-1;i>0;i--){
    s=(s*1664525+1013904223)&0xFFFFFFFF;
    const j=Math.abs(s)%(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function generateNames(snKey,yongshin,seed){
  const si=SURNAMES[snKey]||SURNAMES["김"];
  const pool=randShuffle(CHARS,seed);
  const seen=new Set();
  const results=[];
  for(let i=0;i<pool.length&&results.length<60;i++){
    for(let j=0;j<pool.length&&results.length<60;j++){
      if(i===j)continue;
      const c1=pool[i],c2=pool[j];
      // ① 자원오행 — 최소 1자 용신
      if(c1.o!==yongshin&&c2.o!==yongshin)continue;
      // ② 발음오행 상극 탈락
      const sb=si.balpum,b1=getBalpum(c1.k),b2=getBalpum(c2.k);
      if(SANGGEUK[sb]===b1||SANGGEUK[b1]===b2)continue;
      // ③ 81격 수리 — 원·형격 흉 탈락
      const won=normSuri(si.s+c1.s),hyeong=normSuri(c1.s+c2.s);
      const iSuri=normSuri(si.s+c1.s+c2.s),jeong=normSuri(si.s+c2.s);
      const wonI=suriInfo(won),hyeongI=suriInfo(hyeong);
      if(wonI.r==="흉"||hyeongI.r==="흉")continue;
      // ④ 음양 배합 — 전부 동일 탈락
      if(si.s%2===c1.s%2&&c1.s%2===c2.s%2)continue;
      // ⑤ 중복 방지
      const key=snKey+c1.k+c2.k;
      if(seen.has(key))continue;
      seen.add(key);
      // 점수
      let score=0;
      if(wonI.r==="대길")score+=4;if(hyeongI.r==="대길")score+=4;
      if(suriInfo(iSuri).r==="대길")score+=2;if(suriInfo(jeong).r==="대길")score+=2;
      if(c1.o===yongshin)score+=3;if(c2.o===yongshin)score+=3;
      if(SANGSAENG[sb]===b1)score+=2;if(SANGSAENG[b1]===b2)score+=2;
      results.push({
        name:snKey+c1.k+c2.k,snKey,c1,c2,si,
        suri:{won,hyeong,i:iSuri,jeong,wonI,hyeongI,iI:suriInfo(iSuri),jeongI:suriInfo(jeong)},
        sb,b1,b2,score
      });
    }
  }
  return results.sort((a,b)=>b.score-a.score).slice(0,9);
}

  [.25,.5,.75,1].forEach(f=>{
    const pts=keys.map((_,i)=>{const rr=f*r;return`${cx+rr*Math.cos(ang[i])},${cy+rr*Math.sin(ang[i])}`;});
    grid+=`<polygon points="${pts.join(" ")}" fill="none" stroke="rgba(212,175,55,.13)" stroke-width=".5" stroke-dasharray="2,2"/>`;
  });
  const axes=keys.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(ang[i])}" y2="${cy+r*Math.sin(ang[i])}" stroke="rgba(212,175,55,.18)" stroke-width=".5"/>`).join("");
  let suppPoly="";
  if(supp){
    const pts=keys.map((k,i)=>pt((dist[k]||0)+(supp[k]||0),i));
    suppPoly=`<polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="rgba(212,175,55,.1)" stroke="rgba(212,175,55,.5)" stroke-width="1.5" stroke-dasharray="3,2"/>`;
  }
  const mainPts=keys.map((k,i)=>pt(dist[k]||0,i));
  const mainPoly=`<polygon points="${mainPts.map(p=>p.join(",")).join(" ")}" fill="rgba(96,165,250,.18)" stroke="rgba(96,165,250,.75)" stroke-width="1.8"/>`;
  const dots=mainPts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${OH_CLR[keys[i]]}"/>`).join("");
  const labs=keys.map((k,i)=>{
    const lx=cx+(r+14)*Math.cos(ang[i]),ly=cy+(r+14)*Math.sin(ang[i]);
    return`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="10" fill="${OH_CLR[k]}" font-family="Noto Serif KR">${OH_EM[k]}</text>`;
  }).join("");
  return`<svg viewBox="0 0 ${sz} ${sz}" style="width:100%;max-width:${sz}px;" xmlns="http://www.w3.org/2000/svg">${grid}${axes}${suppPoly}${mainPoly}${dots}${labs}</svg>`;
}

    <div class="ms">
      <div class="ms-hd">🔵 자원오행(字源五行) — 한자 자체의 기운</div>
      <div class="infobox">자원오행은 한자의 부수(部首)와 자원(字源)을 기준으로 결정합니다. 원획법(原劃法)을 적용하여 변형된 부수를 원래 자형으로 환산합니다.<br>예: 氵→水(4획), 艹→艸(6획), 釒→金(8획), ⻏→邑(7획), 忄→心(4획)</div>
      <p><strong>${c1.c}(${c1.k})</strong> — ${c1.rad} 부수 / "${c1.m}" / 원획 <strong>${c1.s}획</strong><br>자원오행 <span class="hl">${OH_KR[c1.o]}</span><br><span style="font-size:12px;color:var(--muted);">${c1.rdesc}</span></p>
      <p><strong>${c2.c}(${c2.k})</strong> — ${c2.rad} 부수 / "${c2.m}" / 원획 <strong>${c2.s}획</strong><br>자원오행 <span class="hl">${OH_KR[c2.o]}</span><br><span style="font-size:12px;color:var(--muted);">${c2.rdesc}</span></p>
    </div>

    <div class="ms">
      <div class="ms-hd">🔊 발음오행(소리오행) — 훈민정음 오음 분류</div>
      <div class="infobox"><strong>훈민정음 아설순치후(牙舌脣齒喉) 분류</strong><br>牙音 ㄱ·ㅋ → 木 &nbsp;|&nbsp; 舌音 ㄴ·ㄷ·ㄹ·ㅌ → 火<br>喉音 ㅇ·ㅎ → 土 &nbsp;|&nbsp; 齒音 ㅅ·ㅈ·ㅊ → 金 &nbsp;|&nbsp; 脣音 ㅁ·ㅂ·ㅍ → 水</div>
      <p>
        성씨 <strong>'${ST.form.surname}'</strong> — 초성 [${cho_sn}] → ${OH_SOUND_CLASS[sb]} → 발음오행 <span class="hl">${OH_KR[sb]}</span><br>
        이름1 <strong>'${c1.k}'</strong> — 초성 [${cho1}] → ${OH_SOUND_CLASS[b1]} → 발음오행 <span class="hl">${OH_KR[b1]}</span><br>
        이름2 <strong>'${c2.k}'</strong> — 초성 [${cho2}] → ${OH_SOUND_CLASS[b2]} → 발음오행 <span class="hl">${OH_KR[b2]}</span>
      </p>
      <div class="flowrow">
        <span class="fpill" style="background:${OH_CLR[sb]}22;color:${OH_CLR[sb]};border:1px solid ${OH_CLR[sb]}44;">${OH_EM[sb]} ${OH_KR[sb]}</span>
        <span class="farr">→</span>
        <span style="font-size:11px;color:${r12.clr};">${r12.lbl}</span>
        <span class="farr">→</span>
        <span class="fpill" style="background:${OH_CLR[b1]}22;color:${OH_CLR[b1]};border:1px solid ${OH_CLR[b1]}44;">${OH_EM[b1]} ${OH_KR[b1]}</span>
        <span class="farr">→</span>
        <span style="font-size:11px;color:${r23.clr};">${r23.lbl}</span>
        <span class="farr">→</span>
        <span class="fpill" style="background:${OH_CLR[b2]}22;color:${OH_CLR[b2]};border:1px solid ${OH_CLR[b2]}44;">${OH_EM[b2]} ${OH_KR[b2]}</span>
      </div>
      <p style="font-size:12px;color:var(--muted);">${r12.desc} ${r23.desc} 상생(▲) 흐름은 이름 전체에 자연스러운 에너지 순환을 만들어 이름을 부를 때마다 좋은 기운이 강화됩니다.</p>
    </div>

    <div class="ms">
      <div class="ms-hd">📊 81격 수리(數理) 완전 풀이</div>
      <div class="infobox">원획법 획수 합계를 81개 수리로 환산합니다. 합이 81을 초과하면 ((합-1)%81)+1로 환산. 0→81 처리.<br>성씨 <strong>${si.hanja}(${si.s}획)</strong> · 이름1 <strong>${c1.c}(${c1.s}획)</strong> · 이름2 <strong>${c2.c}(${c2.s}획)</strong></div>
      <div class="suri-grid">${suriRows}</div>
    </div>

    <div class="ms">
      <div class="ms-hd">☯ 음양(陰陽) 획수 배합</div>
      <div class="yy-row">
        <div class="yy"><div class="yyl">성씨</div><div class="yyn" style="color:${si.s%2!==0?"#f472b6":"#60a5fa"}">${si.s}</div><div class="yyt">${yyt(si.s)}</div></div>
        <div class="yy"><div class="yyl">이름1</div><div class="yyn" style="color:${c1.s%2!==0?"#f472b6":"#60a5fa"}">${c1.s}</div><div class="yyt">${yyt(c1.s)}</div></div>
        <div class="yy"><div class="yyl">이름2</div><div class="yyn" style="color:${c2.s%2!==0?"#f472b6":"#60a5fa"}">${c2.s}</div><div class="yyt">${yyt(c2.s)}</div></div>
      </div>
      <p>배합: <strong>${si.s%2===0?"음":"양"}·${c1.s%2===0?"음":"양"}·${c2.s%2===0?"음":"양"}</strong> — 세 글자가 동일 음양이 아니므로 균형잡힌 배합입니다.<br><span style="font-size:12px;color:var(--muted);">홀수=양(陽), 짝수=음(陰). 세 글자가 모두 같으면 불균형으로 탈락됩니다.</span></p>
    </div>`;
}

// ════════════════════════════════════════════════
// ▌ 8. 메인 렌더 & 이벤트
// ════════════════════════════════════════════════
function render(){
  renderStepBar();
  const c=document.getElementById("content");
  if(ST.step===0)c.innerHTML=renderStep0();
  else if(ST.step===1)c.innerHTML=renderStep1();
  else if(ST.step===2)c.innerHTML=renderStep2();
  window.scrollTo({top:0,behavior:"smooth"});
}

function goStep(n){ST.step=n;render();}

function doAnalyze(){
  ST.loading=true;render();
  setTimeout(()=>{
    const{year,month,day,hour}=ST.form;
    ST.saju=getSaju(year,month,day,hour);
    ST.dist=getOhDist(ST.saju);
    ST.yongshin=getYongshin(ST.dist);
    ST.jeuksin=getJeuksin(ST.dist);
    ST.loading=false;ST.step=1;render();
  },900);
}

function doPay(){
  ST.seed=Date.now();
  ST.loading=true;ST.step=2;render();
  setTimeout(()=>{
    ST.names=generateNames(ST.form.surname,ST.yongshin,ST.seed);
    ST.loading=false;render();
  },700);
}

// ─── "다른 조합 추천" 버튼 고침: 새 시드로 완전히 다른 결과 ───
function doMore(){
  const btn=document.getElementById("btn-more");
  if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin"></span> 생성 중...`;}
  ST.seed=Date.now()+Math.floor(Math.random()*9999);
  setTimeout(()=>{
    ST.names=generateNames(ST.form.surname,ST.yongshin,ST.seed);
    render();// re-render step 2 with new names
  },600);
}

function openModal(idx){
  const it=ST.names[idx];if(!it)return;
  document.getElementById("mbox").innerHTML=renderModal(it);
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow="";
}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});

// ════════════════════════════════════════════════
// ▌ 9. 파티클 초기화
// ════════════════════════════════════════════════
(function(){
  const ct=document.getElementById("pts");
  const clrs=["#D4AF37","#60a5fa","#4ade80","#f87171","#fbbf24"];
  for(let i=0;i<28;i++){
    const el=document.createElement("div");el.className="pt";
    const sz=Math.random()*2.2+.4;
    el.style.cssText=`left:${Math.random()*100}%;bottom:-8px;width:${sz}px;height:${sz}px;background:${clrs[i%5]};opacity:${.2+Math.random()*.5};animation-duration:${7+Math.random()*9}s;animation-delay:${Math.random()*10}s;`;
    ct.appendChild(el);
  }
})();

// ════════════════════════════════════════════════
// ▌ 10. 인트로 → 앱 전환
// ════════════════════════════════════════════════
setTimeout(()=>{
  document.getElementById("intro").classList.add("out");
  const app=document.getElementById("app");
  app.style.display="block";
  setTimeout(()=>document.getElementById("intro")?.remove(),950);
  render();
},2900);
</script>
