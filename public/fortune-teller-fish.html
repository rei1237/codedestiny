<style>
:root {
  --deep:#03050c;
  --navy:#061128;
  --ink:#0b1531;
  --gold:#d5a83a;
  --gold2:#f0ca62;
  --gold3:#fff0a7;
  --red:#ce241d;
  --red2:#ec3a2f;
  --red3:#ff7662;
  --redfilm:#d42020;
  --purple:#7550c8;
  --purple2:#a782ee;
  --teal:#34d6c7;
  --jade:#8be1b4;
  --text:#f3e4c8;
  --text2:rgba(235,218,190,0.68);
  --text3:rgba(218,200,170,0.48);
  --border:rgba(213,168,58,0.24);
  --border2:rgba(240,202,98,0.46);
  --card:rgba(9,14,33,0.86);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'Noto Sans KR',sans-serif;background:radial-gradient(ellipse at 24% 8%,rgba(27,54,111,.75) 0%,rgba(6,17,40,.96) 36%,#03050c 100%);color:var(--text);overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;outline:none;border:none}

/* ── STARS ────────────────────────────────────── */
#starfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) var(--dl) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.05;transform:scale(1)}100%{opacity:var(--op);transform:scale(1.6)}}
.bubble{position:absolute;border-radius:50%;border:1px solid rgba(120,180,255,0.12);animation:rise var(--d) var(--dl) ease-in-out infinite}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:.18}100%{transform:translateY(-120px) scale(1.4);opacity:0}}

/* ── LAYOUT ───────────────────────────────────── */
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:linear-gradient(180deg,rgba(4,8,22,.42),rgba(3,5,12,.15))}
#header{flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + .66rem) 1rem .48rem;display:grid;grid-template-columns:1fr auto 1fr;gap:.65rem;align-items:center;border-bottom:1px solid rgba(213,168,58,0.14);backdrop-filter:blur(12px)}
#content{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:.65rem .9rem 0;scrollbar-width:none}
#content::-webkit-scrollbar{display:none}
#navbar{flex:0 0 auto;display:flex;background:rgba(4,6,16,0.9);border-top:1px solid rgba(120,90,200,0.24);padding:.42rem .35rem calc(env(safe-area-inset-bottom,0px) + .55rem);backdrop-filter:blur(14px)}

/* ── HEADER ───────────────────────────────────── */
.lv-badge{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;border:2px solid;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.14),rgba(20,12,40,0.86));transition:all .4s;box-shadow:0 0 18px rgba(167,130,238,.18)}
.title-area{text-align:center}
.title-en{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.28em;color:var(--gold);opacity:.7;margin-bottom:2px}
.title-ko{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--gold),var(--gold3),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.free-badge{justify-self:end;display:inline-flex;align-items:center;gap:5px;background:rgba(12,42,50,0.72);border:1px solid rgba(52,214,199,0.42);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:850;color:#bffcf2;white-space:nowrap;box-shadow:0 0 16px rgba(52,214,199,.12)}

/* ── TABS ─────────────────────────────────────── */
.tab{display:none}.tab.on{display:block}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:rgba(178,160,220,0.52);font-size:10px;padding:.42rem .2rem;border-radius:14px;transition:all .2s;font-family:inherit;letter-spacing:0}
.nb.on{color:var(--gold2);background:rgba(213,168,58,.1)}
.nb svg{width:20px;height:20px}
.nb.on svg{filter:drop-shadow(0 0 4px rgba(200,165,50,0.5))}

/* ── CARDS ────────────────────────────────────── */
.gc{background:linear-gradient(135deg,rgba(15,22,52,0.88),rgba(9,12,32,0.94));border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.section-title{font-family:'Noto Serif KR',serif;font-size:14.5px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--gold3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.7rem;display:flex;align-items:center;gap:6px}
.lbg{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin:.4rem 0}
.lbf{height:100%;border-radius:3px;background:linear-gradient(90deg,#b8890e,#e8c040,#f5df80);transition:width 1s cubic-bezier(.34,1.4,.64,1)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:18px;padding:4px 11px;font-size:11px;cursor:pointer;transition:all .2s;font-weight:500}

/* ── FISH AREA ────────────────────────────────── */
#fish-stage{position:relative;width:min(78vw,260px);height:min(78vw,260px);margin:.15rem auto .05rem;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
#fish-stage::before{content:'';position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(52,214,199,.14);background:radial-gradient(circle,rgba(255,92,70,.12),rgba(52,214,199,.05) 45%,transparent 72%);box-shadow:inset 0 0 34px rgba(255,92,70,.09),0 0 42px rgba(52,214,199,.08);pointer-events:none}
.ring{position:absolute;border-radius:50%;border:1px solid;pointer-events:none}
#rips{position:absolute;width:170px;height:170px;border-radius:50%;overflow:visible;pointer-events:none}
.rip{position:absolute;border-radius:50%;border:1.5px solid rgba(220,50,30,0.45);animation:rp .9s ease-out forwards}
@keyframes rp{0%{transform:scale(.3);opacity:.7}100%{transform:scale(2.6);opacity:0}}

/* ── ACTUAL FORTUNE TELLER FISH SVG ───────────── */
/* Flat red cellophane fish - the real toy! */
#fw{transform-origin:center center;transform-style:preserve-3d;perspective:300px;transition:filter .3s}
@keyframes fi-idle{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes fi-glow{0%,100%{filter:drop-shadow(0 0 8px rgba(220,30,20,.5)) drop-shadow(0 4px 14px rgba(200,20,10,.3))}50%{filter:drop-shadow(0 0 22px rgba(255,60,30,.9)) drop-shadow(0 4px 28px rgba(220,40,20,.7))}}
@keyframes fi-press{0%,100%{filter:drop-shadow(0 0 18px rgba(255,70,40,.9)) drop-shadow(0 0 40px rgba(220,50,30,.7))}50%{filter:drop-shadow(0 0 38px rgba(255,90,50,1)) drop-shadow(0 0 70px rgba(240,60,30,.9))}}
.f-idle{animation:fi-idle 3s ease-in-out infinite,fi-glow 2.4s ease-in-out infinite}
.f-press{animation:fi-press .5s ease-in-out infinite}
/* Movement animations */
@keyframes mv-head{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-18deg)}70%{transform:rotate(12deg)}}
@keyframes mv-tail{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(20deg) translateX(3px)}70%{transform:rotate(-17deg) translateX(-2px)}}
@keyframes do-curl{0%{transform:rotate(0) scale(1)}45%{transform:rotate(172deg) scale(.58)}100%{transform:rotate(360deg) scale(1)}}
@keyframes do-flip{0%,100%{transform:scaleY(1) rotate(0)}48%,56%{transform:scaleY(-1) rotate(5deg)}}
@keyframes do-still{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.03) rotate(.8deg)}}
@keyframes do-spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.f-head{animation:mv-head .7s ease-in-out infinite,fi-glow 2s ease-in-out infinite}
.f-tail{animation:mv-tail .42s ease-in-out infinite,fi-glow 2s ease-in-out infinite}
.f-curl{animation:do-curl 2s ease-in-out infinite,fi-glow 2s ease-in-out infinite}
.f-flip{animation:do-flip 1.7s ease-in-out infinite,fi-glow 2s ease-in-out infinite}
.f-still{animation:do-still 3.5s ease-in-out infinite,fi-glow 2s ease-in-out infinite}
.f-spin{animation:do-spin 1.2s linear infinite,fi-glow 2s ease-in-out infinite;transform-style:preserve-3d}

/* progress bar */
#prog-wrap{max-width:240px;margin:.5rem auto 0;opacity:0;transition:opacity .35s}
.prog-track{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.prog-bar{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#8a1818,#cc3030,#ff5540);transition:width .05s linear;position:relative;overflow:hidden}
.prog-bar::after{content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shm 1.1s ease-in-out infinite}
@keyframes shm{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}  }

/* result overlay */
#result-overlay{display:none;position:absolute;inset:0;background:rgba(2,4,14,0.93);z-index:20;align-items:center;justify-content:center;border-radius:0}
@keyframes card-in{0%{opacity:0;transform:translateY(24px) scale(.94)}100%{opacity:1;transform:translateY(0) scale(1)}}
#result-card{width:min(340px,92%);animation:card-in .5s cubic-bezier(.34,1.56,.64,1) forwards;position:relative;max-height:85vh;overflow-y:auto;scrollbar-width:none}
#result-card::-webkit-scrollbar{display:none}

/* toast */
@keyframes toast-in{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(30,18,6,0.97);border:1px solid rgba(200,160,40,.6);border-radius:20px;padding:7px 18px;font-size:12.5px;font-weight:700;color:var(--gold2);z-index:100;white-space:nowrap;animation:toast-in .3s ease forwards;pointer-events:none}

/* cat pills scroll */
#cat-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cat-scroll::-webkit-scrollbar{display:none}

/* dividers */
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(200,160,50,0.28),transparent);margin:.7rem 0}
.fish-ritual-card{position:relative;margin:.15rem 0 .9rem;padding:.9rem .75rem 1rem;border:1px solid rgba(213,168,58,.2);border-radius:22px;background:linear-gradient(180deg,rgba(8,16,38,.78),rgba(7,10,26,.58));box-shadow:0 18px 46px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.fish-ritual-card::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,240,167,.78),rgba(52,214,199,.46),transparent);pointer-events:none}
.fish-oracle-copy{text-align:center;margin:.1rem auto .7rem;display:grid;gap:.18rem}
.fish-oracle-copy span{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.24em;color:rgba(52,214,199,.82)}
.fish-oracle-copy strong{font-family:'Noto Serif KR',serif;font-size:16px;line-height:1.35;color:#fff0d0;font-weight:800}
.fish-tip-row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:.55rem auto 0}
.fish-soft-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(52,214,199,.22);background:rgba(5,29,39,.42);border-radius:999px;padding:5px 9px;font-size:10.5px;font-weight:750;color:rgba(191,252,242,.86)}

/* ── QUESTION INPUT ───────────────────────────── */
.fish-question-row{display:flex;align-items:center;gap:6px;margin-bottom:.6rem}
#fish-question{flex:1;background:rgba(10,8,30,0.6);border:1px solid rgba(130,80,180,0.24);border-radius:14px;padding:8px 12px;font-size:12.5px;color:var(--text)}
#fish-question::placeholder{color:rgba(200,180,220,0.38)}
#fish-question-count{font-size:9.5px;color:var(--text3);white-space:nowrap}

/* ── DIVINATION POOL ──────────────────────────── */
#fw-pos{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;transition:transform 1.1s cubic-bezier(.22,1,.36,1)}
.pool-zone{position:absolute;top:50%;transform:translateY(-50%);font-family:'Cinzel',serif;font-size:8px;letter-spacing:.22em;color:rgba(52,214,199,.32);pointer-events:none}
.pool-zone--past{left:2px}
.pool-zone--future{right:2px}

/* ── SIGN REVEAL (observation step) ───────────── */
#sign-reveal{max-width:280px;margin:.3rem auto 0;text-align:center;opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;min-height:1px}
#sign-reveal.show{opacity:1;transform:translateY(0)}
.sr-line1{font-size:12.5px;color:rgba(230,205,158,.92);font-weight:600;margin-bottom:3px}
.sr-line2{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;color:rgba(52,214,199,.78);margin-bottom:4px}
.sr-line3{font-size:11px;color:var(--text3);font-style:italic}
@media (max-width:380px){
  #header{grid-template-columns:auto 1fr auto;padding-left:.72rem;padding-right:.72rem}
  .title-ko{font-size:16px}
  .free-badge{padding:6px 8px;font-size:10px}
  #content{padding-left:.72rem;padding-right:.72rem}
}
</style>

      <div class="fish-question-row">
        <input id="fish-question" type="text" maxlength="40"

      <div id="sign-reveal"></div>

      <!-- Progress -->

      </div>

      <!-- Hold button -->
      <div style="text-align:center;margin:.65rem 0 .4rem">
        <button id="hold-btn"
          onmousedown="startPress(event)" ontouchstart="startPress(event)"

      </div>

    </div>

  </div><!-- /content -->

  <!-- Bottom nav -->
  <div id="navbar">
    <button class="nb on" id="nb-fortune" onclick="switchTab('fortune')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9" stroke-linecap="round" stroke-width="2.5"/><line x1="15" y1="9" x2="15.01" y2="9" stroke-linecap="round" stroke-width="2.5"/></svg>
      운세
    </button>
    <button class="nb" id="nb-items" onclick="switchTab('items')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>

    </button>

function getLevel(pts) {
  for (let i = LEVELS.length-1; i >= 0; i--)

  return LEVELS[0];

function saveState() {
  try { localStorage.setItem('ftf_v3', JSON.stringify(STATE)); } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem('ftf_v3');
    if (raw) {
      const d = JSON.parse(raw);
      // reset daily checkin if new day
      if (d.checkinDate !== TODAY()) { d.checkedIn = false; d.checkinDate = TODAY(); }
      // reset daily reading counter if new day
      if (d.todayDate !== TODAY()) { d.todayReadings = 0; d.todayDate = TODAY(); }
      Object.assign(STATE, d);
    }
  } catch(e) {}
}

// ═══════════════════════════════════════════
//  PRESS LOGIC
// ═══════════════════════════════════════════
let pressing = false, progVal = 0, progTimer = null;
const PRESS_DUR = 3000;

function startPress(e) {
  if (pressing) return;
  e && e.preventDefault();
  pressing = true; progVal = 0;
  document.getElementById('prog-wrap').style.opacity = '1';
  document.getElementById('hold-btn').style.opacity = '0';
  document.getElementById('fw').className = 'f-press';
  document.getElementById('status-txt').style.color = 'rgba(255,175,145,0.82)';
  document.getElementById('status-txt').textContent = '에너지를 흡수하는 중... ✦';
  progTimer = setInterval(() => {
    progVal += 100 / (PRESS_DUR / 50);
    document.getElementById('prog-bar').style.width = Math.min(progVal, 100) + '%';
    if (Math.random() < 0.3) addRipple();
    if (progVal >= 100) { clearInterval(progTimer); revealFortune(); }
  }, 50);
}
function endPress() {
  if (!pressing) return;
  pressing = false;
  clearInterval(progTimer);
  if (progVal < 100) {
    progVal = 0;
    document.getElementById('prog-bar').style.width = '0%';
    document.getElementById('prog-wrap').style.opacity = '0';
    document.getElementById('hold-btn').style.opacity = '1';
    document.getElementById('fw').className = 'f-idle';
    document.getElementById('status-txt').style.color = 'var(--text3)';
    document.getElementById('status-txt').textContent = '물고기를 꾹 눌러 질문을 전해보세요';
    document.getElementById('fw-pos').style.transform = 'translate(0,0)';
  }
}
function addRipple() {
  const cont = document.getElementById('rips');
  const r = document.createElement('div');
  r.className = 'rip';
  const sz = 60 + Math.random()*70;
  r.style.cssText = `width:${sz}px;height:${sz}px;left:${(170-sz)/2+Math.random()*20-10}px;top:${(170-sz)/2+Math.random()*20-10}px;`;
  cont.appendChild(r);
  setTimeout(() => r.remove(), 950);
}

document.addEventListener('mouseup', endPress);
document.addEventListener('touchend', endPress);
const fz = document.getElementById('fish-stage');
fz.addEventListener('mousedown', startPress);
fz.addEventListener('touchstart', startPress, {passive:false});

function buildFortuneResult(species) {
  const movement = pickMovement();
  const signs = MOVEMENT_SIGNS[movement];
  const variants = CATEGORY_VARIANTS[STATE.cat] || CATEGORY_VARIANTS['전체'];
  const variant = variants[Math.floor(Math.random()*variants.length)];
  const meta = SPECIES_META[species];
  const positionZoneKo = STATE.cat === '전체' ? '종합 영역' : STATE.cat;
  return Object.assign({}, variant, {
    movement: movement,
    movementKo: signs.movementKo,
    signs: signs,
    species: species,
    speciesMeta: meta,
    question: (STATE.question || '').trim(),
    positionZoneKo: positionZoneKo,
    framingLine: meta.framingLine(positionZoneKo),
    fishSignEn: signs.motionWordEn + ' ' + meta.nameEn + ' · ' + meta.symbolEn,
  });
}

//  SHARE — 결과 카드 이미지 캡처
// ═══════════════════════════════════════════
function _ftfEnsureHtml2Canvas(cb) {
  if (window.html2canvas) { cb(window.html2canvas); return; }
  const existing = document.getElementById('ftfH2CLoader');
  if (existing) {
    existing.addEventListener('load', () => cb(window.html2canvas || null));
    existing.addEventListener('error', () => cb(null));
    return;
  }
  const s = document.createElement('script');
  s.id = 'ftfH2CLoader';
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.crossOrigin = 'anonymous';
  s.referrerPolicy = 'no-referrer';
  s.onload = () => cb(window.html2canvas || null);
  s.onerror = () => cb(null);
  document.head.appendChild(s);
}

function shareResultImage() {
  const card = document.getElementById('result-card');
  if (!card) return;
  const prevMaxH = card.style.maxHeight, prevOv = card.style.overflowY, prevScroll = card.scrollTop;
  const restore = () => { card.style.maxHeight = prevMaxH; card.style.overflowY = prevOv; card.scrollTop = prevScroll; };
  card.style.maxHeight = 'none';
  card.style.overflowY = 'visible';
  card.scrollTop = 0;

  _ftfEnsureHtml2Canvas((h2c) => {
    if (!h2c) { restore(); shareResultText(); return; }
    h2c(card, { backgroundColor:'#050914', scale:2, useCORS:true, logging:false })
      .then((canvas) => {
        restore();
        canvas.toBlob((blob) => {
          if (!blob) { shareResultText(); return; }
          let file = null;
          try { file = new File([blob], 'fortune-teller-fish.png', { type:'image/png' }); } catch (e) {}
          if (file && navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share) {
            navigator.share({ files:[file], title:'포춘텔러 물고기 운세' }).catch(() => {});
            return;
          }
          const dl = document.createElement('a');
          dl.href = URL.createObjectURL(blob);
          dl.download = 'fortune-teller-fish.png';
          document.body.appendChild(dl);
          dl.click();
          document.body.removeChild(dl);
          setTimeout(() => { try { URL.revokeObjectURL(dl.href); } catch (e) {} }, 4000);
          showToast('결과 카드 이미지를 저장했어요 🐟');
        }, 'image/png');
      })
      .catch(() => { restore(); shareResultText(); });
  });
}

function rollGacha() {
  const r = Math.random() * 100;
  let grade;
  if (r < 5) grade = 4;
  else if (r < 20) grade = 3;
  else if (r < 50) grade = 2;
  else grade = 1;
  const pool = GACHA_POOL.filter(i => i.grade === grade);
  return pool[Math.floor(Math.random() * pool.length)];
}

async function doGachaRoll() {
  const result = rollGacha();
  if (!STATE.gachaHistory) STATE.gachaHistory = [];
  STATE.gachaHistory.unshift({ ...result, date: new Date().toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) });
  if (STATE.gachaHistory.length > 20) STATE.gachaHistory = STATE.gachaHistory.slice(0, 20);
  saveState();
  updateUI();
  showGachaResult(result);
  renderItemsTab();
  showToast('행운 부적이 열렸어요 ✦');
}

      <div style="font-size:9.5px;color:var(--text3);margin-bottom:3px">✦ 아이템 효과</div>
      <div style="font-size:13px;font-weight:700;color:${col}">${it.effect}</div>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="closeResult()" style="flex:1;padding:9px;border-radius:20px;border:1px solid rgba(120,90,185,0.35);background:rgba(22,14,52,0.65);color:rgba(190,165,240,0.72);font-size:12px" onmouseenter="this.style.background='rgba(35,22,75,0.8)'" onmouseleave="this.style.background='rgba(22,14,52,0.65)'">닫기</button>
      <button onclick="closeResult();switchTab('items')" style="flex:1;padding:9px;border-radius:20px;border:1px solid ${col}66;background:linear-gradient(135deg,rgba(60,35,8,0.65),rgba(40,20,4,0.85));color:${col};font-size:12px">✦ 보관함 보기</button>
    </div>
  `;
  const rc = document.getElementById('result-card');
  rc.style.animation = 'none'; void rc.offsetWidth;
  rc.style.animation = 'card-in .5s cubic-bezier(.34,1.56,.64,1) forwards';
  document.getElementById('result-overlay').style.display = 'flex';
}

function renderItemsTab() {
  const history = STATE.gachaHistory || [];

  const gradeCount = {1:0,2:0,3:0,4:0};
  history.forEach(h => { if (gradeCount[h.grade] !== undefined) gradeCount[h.grade]++; });

  document.getElementById('gacha-ui').innerHTML = `
    <div style="text-align:center;margin-bottom:.75rem;padding-top:.3rem">
      <div class="section-title" style="justify-content:center">✦ 행운 부적 보관함</div>
      <p style="font-size:11.5px;color:var(--text3);margin-bottom:.3rem">오늘의 리딩 기운으로 부적을 한 장 열어보세요</p>
      <div style="font-size:10px;color:rgba(191,252,242,.72)">무료 · 바로 보관</div>
    </div>

    <!-- 부적 열기 -->
    <div style="text-align:center;margin-bottom:1rem">
      <div style="position:relative;width:130px;height:130px;margin:0 auto .8rem;cursor:pointer" onclick="doGachaRoll()">
        <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(200,160,40,0.5);background:radial-gradient(circle at 35% 30%,rgba(80,50,120,0.9),rgba(20,10,50,0.97));display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:0 0 28px rgba(150,100,255,0.35),inset 0 0 20px rgba(100,60,200,0.2);transition:all .18s" onmouseenter="this.style.boxShadow='0 0 42px rgba(200,160,50,0.6),inset 0 0 28px rgba(150,100,255,0.3)'" onmouseleave="this.style.boxShadow='0 0 28px rgba(150,100,255,0.35),inset 0 0 20px rgba(100,60,200,0.2)'">🎰</div>
      </div>
      <button onclick="doGachaRoll()" style="padding:11px 34px;border-radius:22px;border:1.5px solid rgba(200,155,35,0.55);background:linear-gradient(135deg,rgba(80,52,8,0.75),rgba(50,30,4,0.9));color:rgba(245,210,95,.95);font-size:13.5px;font-weight:700;letter-spacing:.06em;box-shadow:0 0 16px rgba(200,150,30,0.25);transition:all .2s" onmouseenter="this.style.opacity='.85'" onmouseleave="this.style.opacity='1'">✦ 무료 부적 열기</button>
    </div>

    <!-- 등급 확률 -->
    <div class="gc" style="margin-bottom:.8rem;padding:.75rem .9rem">
      <div style="font-size:9.5px;letter-spacing:.18em;color:var(--text3);margin-bottom:.6rem">✦ 부적 기운</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:5px">
        ${[[4,'#ffdd44','레전더리','5%'],[3,'#c060ff','에픽','15%'],[2,'#4488ff','레어','30%'],[1,'#88cc88','커먼','50%']].map(([g,c,n,p])=>`
          <div style="display:flex;align-items:center;gap:6px;background:rgba(10,8,30,0.6);border:1px solid ${c}33;border-radius:6px;padding:.4rem .6rem">
            <span style="font-size:9px;color:${c};min-width:48px;font-weight:700">${n}</span>
            <span style="font-size:10px;color:rgba(200,180,240,.65);flex:1">${'★'.repeat(Number(g))}</span>
            <span style="font-size:10px;color:${c};font-weight:700">${p}</span>
          </div>`).join('')}
      </div>
    </div>

    <!-- 보관 이력 -->
    <div class="gc" style="margin-bottom:.85rem;padding:.75rem .9rem">
      <div style="font-size:9.5px;letter-spacing:.18em;color:var(--text3);margin-bottom:.6rem">✦ 보관함 (최근 ${history.length}개)</div>
      ${history.length === 0
        ? `<div style="text-align:center;padding:1.4rem;color:var(--text3);font-size:12px">아직 열린 부적이 없어요<br><span style="font-size:11px;opacity:.6">첫 부적을 열어보세요</span></div>`
        : history.map(h => {
            const c = GACHA_GRADE_COLORS[h.grade];
            return `<div style="display:flex;align-items:center;gap:8px;padding:.38rem 0;border-bottom:1px solid rgba(115,78,195,0.1)">
              <span style="font-size:20px">${h.emoji}</span>
              <div style="flex:1;min-width:0">
                <span style="font-size:11.5px;color:${c};font-weight:600">${h.name}</span>
                <span style="font-size:10px;color:var(--text3);margin-left:5px">${GACHA_GRADE_NAMES[h.grade]?.split(' ')[0]}</span>
              </div>
              <span style="font-size:9.5px;color:var(--text3);white-space:nowrap">${h.date||''}</span>

function updateItemsTab() {
  // 운세 확인 후 구 로직 호환용 — 탭이 열려 있을 때만 갱신
  if (STATE.tab === 'items') renderItemsTab();
}

// ═══════════════════════════════════════════
//  INTIMACY TAB
// ═══════════════════════════════════════════
function renderIntimacy() {
  const lv = getLevel(STATE.intimacy);
  const nl = LEVELS.find(l => l.lv === lv.lv + 1);
  const pct = nl ? Math.min((STATE.intimacy - lv.min) / (nl.min - lv.min) * 100, 100) : 100;
  document.getElementById('intimacy-content').innerHTML = `
    <div style="text-align:center;margin-bottom:1.1rem">
      <div style="width:80px;height:80px;border-radius:50%;border:3px solid ${lv.col};margin:0 auto .75rem;display:flex;align-items:center;justify-content:center;background:rgba(20,10,45,0.9);font-size:28px;font-weight:700;color:${lv.col}">${lv.lv}</div>
      <div style="font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:${lv.col};margin-bottom:5px">${lv.name}</div>
      <div style="font-size:11px;color:var(--text3)">친밀도 ${STATE.intimacy}점${nl?' · 다음 레벨까지 '+(nl.min-STATE.intimacy)+'점':'  (최대 레벨 달성!)'}</div>
    </div>

    <div class="gc" style="margin-bottom:.85rem">
      <div style="font-size:10px;letter-spacing:.15em;color:var(--text3);margin-bottom:.55rem">레벨 진행도</div>
      <div class="lbg"><div class="lbf" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:3px">
        <span>Lv.${lv.lv} (${lv.min})</span><span>${nl?'Lv.'+nl.lv+' ('+nl.min+')':'★ MAX ★'}</span>
      </div>
    </div>

    <div class="gc" style="margin-bottom:.85rem">
      <div style="font-size:10px;letter-spacing:.15em;color:var(--text3);margin-bottom:.65rem">나의 기록</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
        ${[['총 운세','#f0be38',STATE.totalReadings+'회'],['보관 부적','#a075ee',(STATE.gachaHistory||[]).length+'개'],['친밀도','#78c8f0',STATE.intimacy+'점']].map(([l,c,v])=>`
          <div style="text-align:center;background:rgba(10,8,32,0.7);border-radius:8px;padding:.65rem .2rem">
            <div style="font-size:18px;font-weight:700;color:${c};margin-bottom:3px">${v}</div>
            <div style="font-size:10px;color:var(--text3)">${l}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="gc">
      <div style="font-size:10px;letter-spacing:.15em;color:var(--text3);margin-bottom:.65rem">레벨별 혜택</div>
      ${LEVELS.map(l=>`
        <div style="display:flex;align-items:center;gap:9px;padding:.5rem 0;border-bottom:1px solid rgba(115,78,195,0.1);opacity:${STATE.intimacy>=l.min?1:.35}">
          <div style="width:28px;height:28px;border-radius:50%;border:2px solid ${l.col};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:${l.col};flex-shrink:0">${l.lv}</div>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:600;color:rgba(215,195,250,0.82)">${l.name}</div>
            <div style="font-size:10.5px;color:var(--text3)">${['기본 운세 · 일일 아이템 추천','연애·재물 전문 운세 해금','행운 아이템 효과 상세 해금','특별 심층 분석 운세 해금','영원의 파트너 전용 운세'][l.lv-1]}</div>
          </div>
          ${STATE.intimacy>=l.min?'<span style="color:var(--gold2);font-size:14px">✦</span>':''}
        </div>`).join('')}
    </div>
    <div style="padding-bottom:.8rem"></div>
  `;
}

// ═══════════════════════════════════════════
//  RECORD TAB
// ═══════════════════════════════════════════
function renderRewards() {
  const checked = STATE.checkedIn;
  const history = STATE.gachaHistory || [];
  document.getElementById('rewards-content').innerHTML = `
    <div class="gc" style="border-color:var(--border2);text-align:center;margin-bottom:.85rem;padding:1.2rem">
      <div style="font-size:32px;margin-bottom:.4rem">🐟</div>
      <div style="font-size:28px;font-weight:800;color:var(--gold2);margin-bottom:4px">${STATE.totalReadings}</div>
      <div style="font-size:10.5px;color:var(--text3)">지금까지 물고기가 읽은 운명의 물결</div>
      <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:.7rem">
        <span class="fish-soft-chip">부적 ${history.length}개</span>
        <span class="fish-soft-chip">친밀도 ${STATE.intimacy}점</span>
      </div>
    </div>

    <div class="gc" style="margin-bottom:.85rem">
      <div style="font-size:10px;letter-spacing:.15em;color:var(--text3);margin-bottom:.75rem">✦ 오늘의 의식</div>
      <div style="text-align:center;padding:.85rem">
        <div style="width:90px;height:90px;border-radius:50%;border:3px solid ${checked?'rgba(200,165,40,0.6)':'rgba(140,100,220,0.45)'};margin:0 auto .85rem;display:flex;align-items:center;justify-content:center;font-size:36px;background:${checked?'rgba(40,28,4,0.75)':'rgba(20,12,50,0.75)'};cursor:${checked?'default':'pointer'};transition:all .2s;${checked?'':'box-shadow:0 0 22px rgba(140,100,220,0.3)'}" onclick="${checked?'':'doCheckin()'}">
          ${checked?'✅':'✦'}
        </div>
        <div style="font-size:13.5px;font-weight:600;color:${checked?'rgba(200,165,40,0.7)':'rgba(210,190,255,0.88)'};margin-bottom:6px">
          ${checked?'오늘의 인사 완료':'물고기에게 인사하기'}
        </div>
        <div style="font-size:11.5px;color:var(--text3);margin-bottom:${checked?'0':'.75rem'}">${checked?'내일 또 다른 물결로 만나요':'하루 한 번 친밀도가 조용히 깊어집니다'}</div>
        ${!checked?`<button onclick="doCheckin()" style="padding:9px 28px;border-radius:20px;border:1px solid rgba(200,155,35,0.5);background:linear-gradient(135deg,rgba(75,50,8,0.65),rgba(55,35,4,0.8));color:rgba(245,210,95,.92);font-size:13px;transition:all .2s" onmouseenter="this.style.opacity='.85'" onmouseleave="this.style.opacity='1'">✦ 오늘의 인사 남기기</button>`:''}
      </div>
    </div>

    <div class="gc" style="margin-bottom:.85rem">
      <div style="font-size:10px;letter-spacing:.15em;color:var(--text3);margin-bottom:.65rem">✦ 리딩 성취</div>
      ${[
        {ico:'🔮',name:'첫 번째 물결',done:STATE.totalReadings>=1,cond:'운세 1회 완료'},
        {ico:'⭐',name:'다섯 번의 예감',done:STATE.totalReadings>=5,cond:'운세 5회 완료'},
        {ico:'💫',name:'열 번의 조짐',done:STATE.totalReadings>=10,cond:'운세 10회 완료'},
        {ico:'💜',name:'소울메이트 달성',done:STATE.intimacy>=180,cond:'친밀도 Lv.3'},
        {ico:'👑',name:'운명의 파트너',done:STATE.intimacy>=360,cond:'친밀도 Lv.4'},
      ].map(q=>`
        <div style="display:flex;align-items:center;gap:10px;padding:.52rem 0;border-bottom:1px solid rgba(115,78,195,0.1)">
          <div style="font-size:22px">${q.ico}</div>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:600;color:rgba(215,195,250,0.82);${q.done?'':'opacity:.55'}">${q.name}</div>
            <div style="font-size:10.5px;color:var(--text3)">${q.cond}</div>
          </div>
          <div style="font-size:15px">${q.done?'✅':'🔒'}</div>
        </div>`).join('')}
    </div>
    <div style="padding-bottom:.8rem"></div>
  `;
}

function doCheckin() {
  if (STATE.checkedIn) return;
  STATE.checkedIn = true;
  STATE.checkinDate = TODAY();
  STATE.intimacy = (STATE.intimacy||0) + 5;
  saveState();
  updateUI();
  renderRewards();
  showToast('친밀도가 깊어졌어요 ✦');
}

// ═══════════════════════════════════════════
//  UI UPDATE
// ═══════════════════════════════════════════
function updateUI() {
  const modeBadge = document.getElementById('fish-mode-badge');
  if (modeBadge) {
    modeBadge.textContent = '무료 리딩';
    modeBadge.title = '포춘텔러 물고기는 무료로 이용할 수 있습니다.';
  }
  const lv = getLevel(STATE.intimacy);
  const badge = document.getElementById('lv-badge');
  badge.textContent = lv.lv;
  badge.style.borderColor = lv.col;
  badge.style.color = lv.col;
  document.getElementById('lv-name').textContent = lv.name;
  document.getElementById('lv-name').style.color = lv.col;
  updateTodayInfo();
}

function updateTodayInfo() {
  document.getElementById('today-info').textContent =
    `오늘 운세 횟수: ${STATE.todayReadings||0}회 · 친밀도 +15/회`;
}

function bumpTodayReadings() {
  if (STATE.todayDate !== TODAY()) { STATE.todayReadings = 0; STATE.todayDate = TODAY(); }
  STATE.todayReadings = (STATE.todayReadings||0) + 1;
  STATE.totalReadings = (STATE.totalReadings||0) + 1;
}

function switchTab(tab) {
  STATE.tab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(el => el.classList.remove('on'));
  document.getElementById('tab-' + tab).classList.add('on');
  document.getElementById('nb-' + tab).classList.add('on');
  if (tab === 'intimacy') renderIntimacy();
  if (tab === 'rewards') renderRewards();
  if (tab === 'items') renderItemsTab();
}

function showToast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
loadState();
renderCats();
renderFishSpecies(pickSpecies());
document.getElementById('fish-question').value = STATE.question || '';
document.getElementById('fish-question-count').textContent = (STATE.question||'').length + '/40';
updateUI();
</script>
</body>
</html>
