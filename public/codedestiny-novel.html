 하지만 다음 동작으로 이어지지 않았다."},{"s":"n","t":"춤이 멈춘 게 아니었다. 춤이 되기 전의 충동이 사라진 것 같았다. 몸이 어떻게 움직여야 하는지 잊은 것처럼."},{"s":"n","t":"RAVEN의 그림자가 바닥에 달라붙었다. 검은 늪처럼."},{"s":"n","t":"BAMBI는 입을 열었다. 노래가 나오지 않은 것보다 더 이상했다. 노래하려는 마음이 흐려졌다."},{"s":"n","t":"가슴에 차오르던 멜로디가, 누가 손으로 문질러 지운 것처럼 사라졌다. BAMBI의 눈이 흔들렸다."},{"s":"n","t":"LUNE은 기타를 다시 잡았다. 하지만 손가락이 다음 코드를 찾지 못했다."},{"s":"n","t":"틀린 게 아니었다. 실수도 아니었다. 그는 처음으로 다음 박자가 떠오르지 않는 얼굴이었다."},{"s":"n","t":"SOLV가 마이크를 들었다. 입술이 움직였다. 하지만 랩이 나오지 않았다."},{"s":"n","t":"소리만 막힌 게 아니었다. 단어가 사라졌다. 머릿속에서 라임이 끊겼다."},{"s":"n","t":"한 줄이 완성되기 직전, 보이지 않는 손이 종이를 찢어버리는 것처럼. SOLV의 눈빛이 차갑게 굳었다."},{"s":"moka","x":"angry","t":"모카가 품에 안고 있던 가사 노트를 펼쳤다. 「안 돼…….」"},{"s":"n","t":"노트 위의 글자들이 흐려지고 있었다. 지운 흔적도, 고친 문장도, 삐뚤빼뚤한 라임도. 전부 회색 먼지처럼 번졌다."},{"s":"moka","x":"angry","t":"모카가 떨리는 손으로 글자를 붙잡으려 했다. 하지만 글자는 손가락 사이로 빠져나갔다."},{"s":"moka","x":"angry","t":"「내 가사…….」 목소리가 갈라졌다. 「내가 쓴 줄들이…….」"},{"s":"n","t":"관객석도 변했다. 함성을 지르려던 이들은 입을 벌린 채 멈췄다."},{"s":"n","t":"손뼉을 치려던 손은 허공에서 멎었다. 웃으려던 아이의 얼굴에서 웃음이 사라졌다."},{"s":"n","t":"감동해 눈물을 흘리던 관객의 눈물도 멈췄다. 눈물방울이 뺨 위에서 그대로 굳었다."},{"s":"n","t":"슬픔도, 기쁨도, 환호도, 웃음도. 전부 밖으로 나오지 못했다."},{"s":"yeon","x":"neutral","t":"연이는 그제야 깨달았다. 이건 침묵이 아니었다. 침묵보다 더 끔찍한 것이었다."},{"s":"yeon","x":"neutral","t":"말을 못 하게 하는 게 아니었다. 표현 자체를 없애고 있었다."},{"s":"yeon","x":"neutral","t":"좋아도 좋아할 수 없게. 아파도 아프다고 할 수 없게. 맛있어도 맛있다고 느끼지 못하게."},{"s":"yeon","x":"neutral","t":"생각이 문장이 되기 전에. 마음이 노래가 되기 전에. 몸이 춤이 되기 전에. 전부 잘라내고 있었다."},{"s":"sys","bg":"siksangCrisis","bgm":"crisis","tone":"dark","t":"공중에 붉은 글자가 떠올랐다.  [표현 봉쇄 진행률: 21%]  [식신의 힘이 약해짐] · [상관의 힘 봉인]  [맛 / 냄새 / 색 / 리듬 / 언어 / 몸짓 출력 제한]","im":true},{"s":"n","t":"연이의 머리 위 꽃이 떨렸다. 가슴 안쪽의 [乙亥]가 차갑게 흔들렸다."},{"s":"neo","x":"serious","t":"「비겁의 섬에서 되찾은 네 자리마저…….」 네오의 눈이 좁아졌다. 「이 무표현 앞에서 움츠러들고 있다.」"},{"s":"n","fx":"ink","t":"그때 검은 깃털이 갈라졌다."},{"s":"n","r":{"who":"crow","x":"base"},"t":"그 안에서 검은 연미복을 입은 까마귀가 천천히 모습을 드러냈다."},{"s":"n","t":"붉은 눈. 긴 부리. 흰 장갑을 낀 손. 그 손에는 붉은 도장이 들려 있었다."},{"s":"n","t":"도장 면에는 검은 글자가 새겨져 있었다.  [封]"},{"s":"crow","x":"base","t":"까마귀는 조용히 무대를 둘러보았다. 목소리는 크지 않았다. 하지만 섬 전체에 박혔다. 「시끄럽군.」"},{"s":"crow","x":"base","t":"그는 SOLV를 보았다. 「말은 칼이 된다.」"},{"s":"crow","x":"base","t":"BAMBI를 보았다. 「노래는 마음을 흔든다.」"},{"s":"crow","x":"base","t":"LUNE을 보았다. 「틀을 깨는 소리는 질서를 어지럽힌다.」"},{"s":"crow","x":"base","t":"RAVEN을 보았다. 「몸짓은 숨겨야 할 진실을 드러낸다.」"},{"s":"crow","x":"base","t":"그리고 관객석을 보았다. 「웃음은 번지고, 박수는 선동하며, 감동은 통제를 무너뜨린다.」"},{"s":"crow","x":"alt","fx":"hands","t":"까마귀는 도장을 들어 올렸다. 「그러니, 막겠다.」"},{"s":"sys","fx":"ink","t":"무대 위에 거대한 붉은 문장이 떠올랐다.  [무표현]","im":true},{"s":"n","t":"그 글자가 나타나는 순간, 섬 전체의 공기가 납처럼 무거워졌다."},{"s":"n","t":"음식은 맛을 잃었다. 악기는 소리를 잃었다. 노트는 문장을 잃었다."},{"s":"n","t":"관객은 표정을 잃었다. 무대는 다음 장면을 잃었다."},{"s":"moka","x":"angry","t":"모카가 무릎을 꿇었다. 「이건…….」 목소리가 떨렸다. 「말을 못 하는 게 아니야.」"},{"s":"yeon","x":"talk","t":"연이는 이를 악물었다. 「응.」"},{"s":"yeon","x":"neutral","t":"그녀는 무대 위의 까마귀를 노려봤다. 「아무것도 못 꺼내게 하는 거야.」"},{"s":"neo","x":"serious","c":{"who":"neo"},"t":"네오의 갈기가 금빛으로 타올랐다. 하지만 그 얼굴도 굳어 있었다. 「연이.」"},{"s":"yeon","x":"neutral","t":"「왜.」"},{"s":"neo","x":"serious","t":"「이번 상대는 강하다.」"},{"s":"yeon","x":"think","t":"「얼마나?」"},{"s":"neo","x":"serious","t":"네오는 무대 위에 떠오른 [무표현]을 바라봤다. 「식신·상관의 섬 자체를 꺼버릴 수 있을 정도로.」"},{"s":"sys","t":"공중의 숫자가 올라갔다.  [표현 봉쇄 진행률: 34%]"},{"s":"crow","x":"base","c":{"who":"moka","x":"angry"},"t":"까마귀가 다시 도장을 들었다. 「입을 닫아라.」"},{"s":"sys","fx":"claw","t":"붉은 도장이 하늘에 찍혔다.  [무언]"},{"s":"crow","x":"base","t":"「손을 멈춰라.」"},{"s":"sys","fx":"claw","t":"두 번째 도장.  [무작]"},{"s":"crow","x":"base","t":"「맛을 잊어라.」"},{"s":"sys","fx":"claw","t":"세 번째 도장.  [무미]"},{"s":"crow","x":"base","t":"「색을 지워라.」"},{"s":"sys","fx":"claw","t":"네 번째 도장.  [무색]"},{"s":"crow","x":"alt","fx":"hands","t":"마지막으로 까마귀는 도장을 높이 들었다. 「꿈을 꺼라.」"},{"s":"sys","bgm":"crisis2","fx":"ink","t":"하늘 전체에 거대한 봉인진이 펼쳐졌다.  [절대표현봉인]","im":true},{"s":"yeon","x":"surprise","t":"연이는 숨을 멈췄다. 그것은 침묵보다 거대했다. 어둠보다 차가웠다."},{"s":"n","t":"이 섬의 모든 존재에게서 나를 밖으로 꺼내는 힘을 빼앗아가는 법칙 같았다."},{"s":"moka","x":"moved","t":"모카의 가사 노트에서 마지막 글자가 흐려졌다. 「연이…….」"},{"s":"moka","x":"moved","t":"모카가 간신히 말했다. 「제 머릿속에서 다음 줄이 사라지고 있어요.」"},{"s":"yeon","x":"soft","t":"연이는 그 말을 듣는 순간, 가슴 안쪽에서 작은 불씨가 튀는 것을 느꼈다."},{"s":"yeon","x":"soft","t":"아직 작았다. 아직 이름도 없었다. 하지만 분명히 있었다."},{"s":"yeon","x":"soft","t":"말이 되기 전의 숨. 노래가 되기 전의 떨림. 꺼지지 않으려는 아주 작은 불."},{"s":"neo","x":"talk","c":{"who":"neo"},"t":"네오가 낮게 말했다. 「식상의 글자가 반응하고 있다.」"},{"s":"yeon","x":"soft","t":"연이는 가슴을 눌렀다. 「이번 글자…….」"},{"s":"n","fx":"burst","t":"불씨가 아주 희미하게 모습을 드러냈다.  [丁]"},{"s":"n","t":"그러나 그 아래에는 갈라진 흙빛도 함께 있었다.  [未]"},{"s":"neo","x":"talk","t":"「丁未다.」"},{"s":"yeon","x":"neutral","c":{"who":"moka","x":"moved"},"t":"연이는 무대 위를 바라봤다. 까마귀의 절대표현봉인이 점점 내려오고 있었다."},{"s":"yeon","x":"neutral","t":"만약 저게 완전히 닿으면. 이 섬은 조용해지는 정도가 아닐 것이다."},{"s":"n","t":"맛없는 음식. 색 없는 조명. 가사 없는 노트. 움직이지 않는 몸. 웃지 못하는 관객."},{"s":"n","t":"그리고 다시는 무대가 되지 못하는 무대. 그런 섬이 될 것이다."},{"s":"yeon","x":"neutral","t":"연이는 앞발에 힘을 줬다. 손가락은 없었다. 하지만 힘은 들어갔다."},{"s":"yeon","x":"talk","t":"「네오.」"},{"s":"neo","x":"talk","c":{"who":"neo"},"t":"「말해라.」"},{"s":"yeon","x":"think","t":"「이번엔 그냥 말하면 안 되겠지?」"},{"s":"neo","x":"talk","t":"「그래.」 네오가 낮게 대답했다. 「이번엔 네가 직접 표현해야 한다.」"},{"s":"yeon","x":"neutral","c":{"who":"moka","x":"moved"},"t":"연이는 다시 무대를 올려다봤다. DEST1NOVA가 멈춰 있었다. 모카가 떨고 있었다."},{"s":"yeon","x":"neutral","t":"관객들이 색을 잃어가고 있었다. 생명력 넘치던 섬이 죽어가고 있었다."},{"s":"yeon","x":"neutral","t":"연이는 짧게 숨을 들이켰다. 무서웠다. 하지만 그보다 더 화가 났다."},{"s":"yeon","x":"talk","t":"「좋아.」 그녀가 말했다. 「꽃돼지든 뭐든.」"},{"s":"yeon","x":"happy","fx":"burst","t":"머리 위 꽃이 붉게 흔들렸다. 「내가 먼저 꺼내볼게.」"},{"s":"crow","x":"base","t":"까마귀의 붉은 눈이 연이를 향했다. 「작은 생물이군.」"},{"s":"yeon","x":"talk","t":"연이는 그를 노려봤다. 「다들 진짜 첫인사 좀 고쳐라. 대본이라도 돌리냐.」"},{"s":"crow","x":"alt","fx":"hands","t":"까마귀가 도장을 그녀에게 겨누었다. 「너도 곧 아무것도 표현하지 못하게 될 것이다.」"},{"s":"n","tone":"dark","t":"[절대표현봉인]이 천천히 내려왔다. 식신·상관의 섬 전체가 숨을 죽였다."},{"s":"n","t":"연이의 가슴 안쪽에서 [丁未]가 꺼질 듯 흔들렸다."},{"s":"n","t":"그리고 다음 순간."},{"s":"yeon","x":"talk","t":"연이는 무대 쪽으로 한 걸음 내디뎠다."},{"s":"sys","t":"제9화 · 검은 깃털 — 끝  다음 화: 꺼지지 않는 불씨 [丁未]. 표현을 빼앗긴 섬에서, 연이는 처음으로 자기 손으로 무언가를 꺼내려 한다.","im":true}]});
EPISODES.push({"no":"EP.10","tag":"제10화 · 데뷔전","title":"데뷔전","beats":[{"s":"sys","bg":"siksang","bgm":"gloom","l":{"who":"yeon"},"c":{"who":"moka","x":"base"},"r":{"who":"neo"},"t":"제10화 · 데뷔전 — 식신·상관의 섬. 소리도 맛도 색도 사라지기 시작한 무대 앞에서.","im":true},{"s":"n","t":"검은 봉인진이 하늘을 덮었다. 섬 밖으로 새어나가려는 모든 것을 손바닥으로 눌러버리는 진이었다. 노래도 기타 소리도 관객의 박수도 허공 중간에서 멈췄다.","tone":"dark"},{"s":"yeon","x":"talk","t":"뭐야 이거. 시끌시끌하던 섬이 갑자기 음소거 눌린 것처럼 됐잖아. 크림빵은 저렇게 따끈해 보이는데 코가 냄새를 못 잡아."},{"s":"yeon","x":"think","t":"저 봉인진 좀 봐. 섬 입에 손바닥 딱 붙이고 음소거 누른 꼴이잖아. 소리도 뚝, 맛도 뚝, 색도 뚝. 이 앱, 업데이트하고 더 고장 났어."},{"s":"n","t":"연이는 달빛 크림빵을 한입 베어 물었다. 단맛도 고소함도 따뜻함도 없었다. 그냥 씹히는 무언가였다."},{"s":"yeon","x":"talk","t":"…이건 좀 너무하잖아. 말끝을 누가 손으로 눌러버리는 것 같아."},{"s":"moka","x":"moved","t":"연이님… 제 가사 노트도 이상해요. 이거 제가 쓴 건데. 틀려도, 별로여도, 제가 쓴 건데요…."},{"s":"n","t":"방금까지 삐뚤빼뚤 살아 있던 라임들이 회색 먼지처럼 번졌다. 먹고 만들고 말하고 노는 섬이, 아무것도 표현 못 하는 회색 방으로 굳어가고 있었다."},{"s":"yeon","x":"talk","t":"야, 그 노트 나 절대 못 뺏기게 할게. 알겠지."},{"s":"neo","x":"talk","t":"연이. 까마귀는 목소리만 봉하는 게 아니다. 식상 전체를 막고 있다."},{"s":"yeon","x":"talk","t":"식상 전체? 말하는 것도, 먹는 것도, 노는 것도, 만드는 것도 전부?"},{"s":"neo","x":"talk","t":"그래. 표현이라는 출구 자체를 눌렀다. 이번엔 소리 한번 지르는 걸로는 부족하다."},{"s":"n","t":"네오의 갈기가 금빛으로 타올랐다. 회색이 내려앉은 섬에서 그 빛만 유일하게 색을 가지고 있었다. 봉인진 위로 다섯 글자가 무겁게 새겨졌다.","tone":"dark"},{"s":"sys","t":"[무언] [무작] [무미] [무색] [무동] — 말 없음. 만듦 없음. 맛 없음. 색 없음. 움직임 없음.","im":true},{"s":"yeon","x":"grin","t":"이름부터 벌써 재미없다. 노잼 다섯 글자가 섬을 깔고 앉았어."},{"s":"n","bg":"siksangCrisis","bgm":"crisis","c":{"who":"moka","x":"base"},"r":{"who":"crow","x":"base"},"t":"무대 중앙에 까마귀가 서 있었다. 검은 연미복, 붉은 눈, 흰 장갑. 그리고 손에 든 붉은 도장.","tone":"dark"},{"s":"crow","x":"base","t":"표현은 혼란이다."},{"s":"n","t":"목소리는 작았다. 그런데도 모두의 마음 위로 무겁게 내려앉았다."},{"s":"crow","x":"alt","t":"말하지 않으면 다투지 않는다. 만들지 않으면 실패하지 않는다. 맛을 모르면 탐하지 않고, 색을 지우면 비교하지 않는다."},{"s":"n","t":"[무언]과 [무작]이 짙어지고, 공기가 회색 물처럼 무거워졌다."},{"s":"crow","x":"base","t":"몸을 멈추면 질서가 유지된다. 그러니 이 섬은 조용해져야 한다."},{"s":"n","fx":"ink","t":"까마귀가 도장을 천천히 들어 올렸다. 그 말이 끝나자 DEST1NOVA 멤버들의 몸이 다시 굳어갔다. SOLV는 가사를, LUNE은 다음 코드를, RAVEN은 다음 발걸음을 잃었다.","tone":"dark"},{"s":"moka","x":"moved","t":"내 다음 줄이… 안 떠올라요."},{"s":"n","t":"모카가 노트를 끌어안고 무릎을 꿇었다. 무릎이 바닥에 닿는 소리조차 회색에 먹혔다."},{"s":"yeon","x":"talk","t":"모카."},{"s":"moka","x":"moved","t":"아무것도 생각이 안 나요. 방금까지 있었는데. 다음 줄이, 다음 박자가, 다음 말이 전부 사라졌어요."},{"s":"n","t":"그 말은 연이의 가슴을 정확히 찔렀다. 비겁의 섬 거울 속 자기가 했던 말이 다른 얼굴로 돌아온 것 같았다.","tone":"dark"},{"s":"yeon","x":"talk","t":"네 자리는 없어, 네가 못 하면 내가 할게. 그땐 그랬는데, 이번엔 네 목소리는 없어로 바뀌었네."},{"s":"yeon","x":"talk","t":"아니. 사라진 거 아니야. 지금 못 보게 막힌 거지. 없어진 게 아니라 가려진 거."},{"s":"n","bg":"siksangNight","bgm":"lunaGuest","fx":"veil","t":"문득 연이의 머릿속에, 데뷔 무대에 오르기 전 대기실이 떠올랐다. 달빛 조명이 낮게 깔린 밤, 섬에서 가장 오래 노래해 온 선배가 조용히 문을 열고 들어왔던 그날."},{"s":"luna","t":"긴장했니? 나도 첫 무대 땐 마이크를 거꾸로 잡았어. 스탠드에 대고 삼십 초를 노래했지. 완벽한 무대 같은 건, 원래 없단다."},{"s":"n","t":"루나블룸. 무대를 몇 번이고 접었다 다시 폈으면서도, 끝내 노래를 놓지 않은 사람. 그녀는 연이의 짧은 앞발에 작은 열쇠 모양 배지를 쥐여 주었다. 차갑지도 무겁지도 않은, 이상하게 손바닥이 따뜻해지는 감촉이었다."},{"s":"luna","t":"이건 귀인의 열쇠. 무대에서 길을 잃거든, 잘하려 애쓰지 말고 네 첫 마음을 열어. 어설퍼도 돼. 안 꺼내는 것보단, 떨면서라도 꺼내는 게 언제나 나으니까."},{"s":"n","fx":"heart","t":"그때는 그냥 예쁜 말이라고만 생각했다. 그런데 지금, 회색으로 굳어가는 모카의 노트 앞에서 그 말이 전혀 다른 무게로 되살아났다. 손안에 없는 열쇠가, 이상하게 손끝에서 만져지는 것 같았다."},{"s":"yeon","x":"calm","t":"…어설퍼도, 안 꺼내는 것보단 낫다. 그래. 지금 필요한 건 잘하는 게 아니라, 그냥 꺼내는 거야."},{"s":"n","bg":"siksangCrisis","bgm":"crisis","t":"연이는 있지도 않은 그 열쇠를 쥐듯, 앞발을 꼭 오므렸다. 회색으로 굳어가는 무대 위에, 아직 지지 않은 작은 불씨 하나가 남아 있었다."},{"s":"n","t":"연이는 모카의 노트를 앞발로 툭 건드렸다. 회색으로 번진 글자들이 손끝에서 희미하게 떨렸다."},{"s":"yeon","x":"soft","t":"네가 쓴 줄은 안 없어져. 망한 줄도, 이상한 라임도, 지운 흔적도, 다시 쓴 것도 전부 네 거야."},{"s":"n","fx":"burst","t":"그 순간 연이의 가슴 안쪽에서 따뜻한 불씨가 움직였다. 작은 붉은 불 하나와, 그 아래 갈라진 흙빛 하나가 함께 떠올랐다."},{"s":"sys","t":"[丁] 작은 불 · [未] 그 불을 받치는 땅 — 丁未. 이번 화의 글자.","im":true},{"s":"neo","x":"lecture","t":"정미가 반응한다. 丁은 작은 불씨다. 말, 노래, 창작, 표현의 불."},{"s":"yeon","x":"think","t":"그럼 未는?"},{"s":"neo","x":"lecture","t":"그 불이 꺼지지 않게 받치는 땅이다. 식신은 그냥 말하는 힘이 아니야. 먹고, 만들고, 기르고, 남기는 힘이다."},{"s":"n","t":"연이는 천천히 고개를 끄덕였다. 불씨만 있으면 번쩍 타올랐다가 금세 사그라든다. 오래 타려면 그 불을 받쳐 줄 바닥이 필요했다."},{"s":"yeon","x":"talk","t":"무대. 몸. 노트. 연습. 만든 것. 남겨진 것. …그게 未구나."},{"s":"neo","x":"smirk","t":"이해가 빠르군. 드물게."},{"s":"yeon","x":"think","t":"방금 그거 칭찬 맞지? 사자 화법은 늘 모호해서 원."},{"s":"neo","x":"deadpan","t":"칭찬이다. 정정하지 않겠다."},{"s":"yeon","x":"talk","t":"모카. 노트 펴."},{"s":"moka","x":"base","t":"지금요? 근데 글자가 흐려지고…."},{"s":"yeon","x":"talk","t":"그래도 펴."},{"s":"n","t":"모카가 떨리는 손으로 노트를 펼쳤다. 글자는 거의 회색이었지만, 지운 줄도 덧쓴 단어도 손때 묻은 모서리도 완전히 사라지진 않았다."},{"s":"yeon","x":"soft","t":"네 노트는 그냥 노트가 아니야. 네 목소리가 뿌리내린 땅이야."},{"s":"n","fx":"burst","t":"그 말에 모카의 손이 멈췄다. 노트 아래에서 아주 작은 흙빛이 피어올랐다. 未의 기운이었다."},{"s":"neo","x":"soft","t":"좋다. 아직 살아 있다."},{"s":"crow","x":"base","t":"쓸모없는 초안이다. 지워주마."},{"s":"n","fx":"ink","t":"까마귀가 도장을 들어 올렸다. 허공에 붉은 글자 [폐기]가 찍혀 모카의 노트로 날아왔다. 모카가 눈을 질끈 감았다.","tone":"dark"},{"s":"yeon","x":"talk","t":"그 말, 안 받을게!"},{"s":"n","fx":"burst","t":"가슴 안쪽의 [丁]이 튀었다. 작은 불꽃이 허공을 갈랐다. 치익 — [폐기]의 한 획이 탔다."},{"s":"crow","x":"base","t":"불씨가 있군."},{"s":"yeon","x":"surprise","t":"…있네."},{"s":"n","t":"연이 자신도 흠칫했다. 입 밖으로 말이 튀어나오는 순간, 불씨가 그 말꼬리를 붙잡고 함께 따라 나온 것이다."},{"s":"neo","x":"talk","t":"그게 丁이다. 표현이 불씨가 되는 것."},{"s":"yeon","x":"talk","t":"말이 진짜 불이 된다고? 무섭기도 한데 좀 짜릿한데. 그럼 한 번 더. 초안도 버릴 게 아니야."},{"s":"n","fx":"burst","t":"치익. [폐기]의 두 번째 획이 탔다."},{"s":"yeon","x":"talk","t":"틀린 줄도 연습한 흔적이고. 지운 문장도 다시 쓰려고 남긴 자리야."},{"s":"n","fx":"burst","t":"쨍! [폐기]가 깨졌다. 모카의 노트가 다시 빛나며 몇 줄이 선명하게 돌아왔다."},{"s":"moka","x":"moved","t":"돌아왔어요…!"},{"s":"yeon","x":"talk","t":"다 돌아온 건 아니야. 그러니까 더 만들어야 해."},{"s":"moka","x":"base","t":"어떻게요?"},{"s":"n","bg":"siksangNight","bgm":"crisis2","t":"검은 봉인 아래 조명이 흐려졌다. 무대 위 DEST1NOVA는 움직이려 했지만 표현의 경로가 막혀 있었다. 섬 전체가 다음 표현을 기다렸다.","tone":"dark"},{"s":"yeon","x":"talk","t":"무대. 무대 위에서 해야 해."},{"s":"moka","x":"base","t":"뭘요?"},{"s":"yeon","x":"talk","t":"노래."},{"s":"n","t":"모카가 얼어붙었다. 노트를 쥔 손가락이 딱 멈췄다."},{"s":"moka","x":"base","t":"누가요?"},{"s":"yeon","x":"talk","t":"…나랑 너."},{"s":"moka","x":"base","t":"…네?"},{"s":"yeon","x":"talk","t":"나도 믿기 싫어. 이 비주얼로 아이돌 비슷한 걸 하게 될 줄은 나도 몰랐다고."},{"s":"n","t":"연이는 자기 몸을 내려다봤다. 분홍빛 꽃돼지, 짧은 앞발, 동그란 배, 머리 위 꽃."},{"s":"yeon","x":"grin","t":"아이돌은 이런 포즈 잡던데. …앞발이 짧아서 브이도 겨우 코앞에서 하네. 각도가 다 죽었어."},{"s":"moka","x":"base","t":"저도 아직 데뷔 전인데요."},{"s":"yeon","x":"talk","t":"나도 데뷔 전이야."},{"s":"moka","x":"base","t":"연이님은 아예 아이돌 지망도 아니잖아요."},{"s":"yeon","x":"talk","t":"그러니까 더 큰일이지."},{"s":"n","t":"심각한 상황인데 조합이 너무 말이 안 됐다. 무명 수달 래퍼, 꽃돼지 임시 보컬, 그리고 갈기 달린 가디언."},{"s":"yeon","x":"talk","t":"너도 같이 해야 하는 거 아니야?"},{"s":"neo","x":"deadpan","t":"나는 하지 않는다. 나는 가디언이다."},{"s":"yeon","x":"grin","t":"그 대사 진짜 많이 우려먹는다. 사골이야 사골."},{"s":"neo","x":"deadpan","t":"사골은 오래 끓일수록 진해진다. 모욕치고는 부족하군."},{"s":"neo","x":"talk","t":"나는 길을 열겠다."},{"s":"yeon","x":"think","t":"무대에는 안 올라오겠다는 거지?"},{"s":"neo","x":"deadpan","t":"필요하면 오른다."},{"s":"yeon","x":"grin","t":"아. 결국 오른다는 뜻이네. 츤데레 사자."},{"s":"moka","x":"base","t":"근데 노래를 어떻게 만들어요? 저 랩은 조금 하는데, 아이돌 노래는…."},{"s":"yeon","x":"grin","t":"걱정 마. 나도 아이돌 노래 어떻게 부르는지 몰라. 둘 다 모르면 그게 콘셉트인 거야."},{"s":"n","t":"그때 아주 작은 소리가 들렸다. 딩. LUNE이 아직 말은 못 한 채, 기타 줄 하나를 약하게 튕겼다. 소리는 금방 사라졌지만 분명히 방향을 가리켰다."},{"s":"neo","x":"talk","t":"다음 박자다. 저 눈빛이 말하고 있다. 틀려도 살려라."},{"s":"n","t":"BAMBI가 입모양으로 그렸다. 숨. 처음은 숨. SOLV는 마이크를 모카 쪽으로 기울였다. 첫 줄. RAVEN의 발끝은 바닥에 작은 원을 그렸다. 무대의 중심."},{"s":"neo","x":"talk","t":"그들이 길을 알려주고 있다."},{"s":"yeon","x":"talk","t":"첫 줄. 숨. 다음 박자. 무대의 중심. …다 받았어."},{"s":"n","t":"모카가 노트를 봤다. 흐려진 글자들 사이에서 한 줄만 또렷하게 남아 있었다."},{"s":"sys","t":"[나는 모카, 아직 무명.]"},{"s":"moka","x":"base","t":"맨날 이 줄만 남네요."},{"s":"yeon","x":"soft","t":"그럼 그게 시작인가 보지. 후렴은 내가 낼게."},{"s":"n","t":"연이는 잠깐 생각했다. 아이돌처럼 노래해야 한다면, 멋진 말보다 모두가 따라 할 수 있는 말이어야 했다. 식신·상관의 섬에서 배운 건 하나였다. 사라지기 전에 꺼내기."},{"s":"yeon","x":"talk","t":"꺼내. 말도, 마음도, 박자도, 맛도. 꺼내서 무대 위에 세우는 거야."},{"s":"n","fx":"burst","t":"모카가 노트에 빠르게 적기 시작했지만 글자가 자꾸 흐려졌다. [무작]의 봉인이 노트를 누르고 있었다."},{"s":"moka","x":"angry","t":"글씨가 안 남아요."},{"s":"yeon","x":"talk","t":"그럼 말로 해."},{"s":"moka","x":"base","t":"말이 막히면요?"},{"s":"yeon","x":"talk","t":"박자로 해."},{"s":"moka","x":"base","t":"박자가 막히면요?"},{"s":"yeon","x":"talk","t":"…그럼 몸으로 해."},{"s":"moka","x":"base","t":"연이님, 지금 되게 상관의 섬 주민 같았어요."},{"s":"yeon","x":"think","t":"칭찬이지?"},{"s":"moka","x":"base","t":"네. 약간 무모한 칭찬이요."},{"s":"yeon","x":"excited","t":"봤지? 이게 상관식 애드리브라는 거야. 물 흐르듯, 막힘없이… 꿀."},{"s":"n","t":"연이는 앞으로 걸어갔다. 무대와 관객석 사이에 검은 선이 그어져 있었다.","tone":"dark"},{"s":"sys","t":"[무대 접근 금지]"},{"s":"n","fx":"ink","t":"연이가 앞발을 선 위에 올렸다. 찌릿. 표현을 막는 기운이 몸을 타고 올라왔다. 순간 머릿속이 하얘졌다."},{"s":"yeon","x":"talk","t":"내가 왜 올라가야 하지. 이 꼴로 무대에? …웃기잖아."},{"s":"n","t":"그때 모카가 연이 옆에 바짝 섰다. 어깨가 잘게 떨렸지만, 발끝은 한 발도 물러서지 않았다."},{"s":"moka","x":"moved","t":"같이 가요."},{"s":"yeon","x":"soft","t":"너 무섭지?"},{"s":"moka","x":"base","t":"네."},{"s":"yeon","x":"soft","t":"나도. 그래도 가자."},{"s":"n","r":{"who":"neo"},"fx":"claw","t":"그때 네오가 그들 앞에 섰다. 금빛 발톱이 검은 선을 향해 휘둘러졌다. 쨍! [무대 접근 금지]에 금이 갔지만, 완전히 깨지지는 않았다."},{"s":"crow","x":"base","r":{"who":"crow","x":"base"},"t":"힘으로는 무대에 오를 수 없다."},{"s":"neo","x":"serious","t":"알고 있다. 마지막은 너희가 해야 한다."},{"s":"n","t":"모카가 숨을 들이켰다. 검은 선 앞에서 그는 노트를 펼치지 않고, 대신 가슴에 손을 얹었다."},{"s":"moka","x":"moved","t":"나는 모카."},{"s":"n","t":"선이 흔들렸다."},{"s":"moka","x":"moved","t":"아직 무명."},{"s":"n","t":"금이 조금 더 커졌다."},{"s":"moka","x":"moved","t":"그래도 오늘. 내 첫 줄은 내가 써."},{"s":"n","fx":"burst","t":"쨍. 선이 절반 갈라졌다."},{"s":"n","t":"이번엔 연이 차례였다. 마이크도 없고 노래도 할 줄 몰랐다. 그런데 이상하게 가슴 안쪽에서 멜로디 하나가 떠올랐다. BAMBI가 준 숨, LUNE이 준 박자, SOLV가 준 첫 줄, RAVEN이 준 중심. 그리고 모카의 떨리는 목소리."},{"s":"n","bgm":"novaTitle","t":"연이는 눈을 감았다. 처음 나온 소리는 작았다."},{"s":"yeon","x":"talk","t":"꺼내."},{"s":"n","t":"검은 선이 멈칫했다. 연이는 다시, 이번엔 조금 선율을 얹었다."},{"s":"yeon","x":"talk","t":"숨겨둔 마음도 꺼내."},{"s":"n","fx":"burst","t":"그 순간 [丁]의 불씨가 작게 빛났다. 모카가 박자를 얹었다."},{"s":"moka","x":"p1","t":"꺼내, 꺼내, 막힌 말도 다시 꺼내."},{"s":"yeon","x":"soft","t":"맛을 잃은 하루에도, 작은 불을 켜."},{"s":"moka","x":"moved","t":"후렴…!"},{"s":"n","fx":"burst","t":"잘 나온 노래도, 전문적인 보컬도 아니었다. 하지만 사라지지 않고 세계 밖으로 나갔다. [무대 접근 금지]가 크게 갈라졌다."},{"s":"n","fx":"burst","bg":"siksangBattle","t":"쨍그랑! 검은 선이 깨졌다. 연이와 모카는 동시에 무대 위로 한 걸음 내디뎠다. 무대 바닥에 흙빛 원이 생기고, 그 위에 작은 붉은 불꽃이 피어났다."},{"s":"sys","t":"[未] 무대의 흙 · [丁] 그 위의 불 — 정미, 무대에 서다.","im":true},{"s":"neo","x":"soft","t":"정미가 무대에 섰다."},{"s":"crow","x":"base","t":"불완전한 표현이다."},{"s":"yeon","x":"talk","t":"맞아."},{"s":"moka","x":"p2","t":"엄청 불완전해요."},{"s":"yeon","x":"talk","t":"근데 지금 나왔잖아."},{"s":"n","t":"모카가 노트를 펼쳤다. 이번에는 글자가 흐려지지 않았다. 그는 빠르게 다음 줄을 적었다."},{"s":"sys","t":"[꺼내, 꺼내, 숨겨둔 나를 꺼내.]"},{"s":"n","fx":"burst","t":"그 글자가 무대 바닥으로 떨어지자 흙빛 원이 더 넓어졌다."},{"s":"yeon","x":"talk","t":"꺼내, 꺼내, 작은 소리도 꺼내."},{"s":"moka","x":"p3","t":"무명이어도 이름은 있어, 떨려도 내 박자는 있어, 틀린 줄 위에 다시 써, 오늘 내 무대는 여기서 켜."},{"s":"n","t":"관객석에서 작은 반응이 일어났다. 한 아이의 손끝에서 색이 피어났고, 다른 관객의 회색 눈동자에 빛이 돌아왔다. 크림빵에서 아주 희미한 냄새가 났다."},{"s":"yeon","x":"happy","t":"돌아오고 있어."},{"s":"neo","x":"talk","t":"아직 약하다. 하지만 시작됐다."},{"s":"moka","x":"moved","t":"연이님, 더 해야 해요."},{"s":"crow","x":"alt","bgm":"crisis2","t":"그만."},{"s":"n","fx":"ink","t":"까마귀가 붉은 도장을 들어 올렸다. 하늘의 봉인진이 더 낮게 내려왔다.","tone":"dark"},{"s":"sys","t":"[표현 봉쇄 진행률: 48%]","im":true},{"s":"yeon","x":"surprise","t":"…벌써 절반 가까이 왔어."},{"s":"crow","x":"base","t":"불완전한 노래는 지워진다."},{"s":"n","fx":"ink","t":"까마귀가 도장을 찍었다. 검은 글자 [무가치]가 연이와 모카를 향해 날아왔다.","tone":"dark"},{"s":"moka","x":"base","t":"무가치…."},{"s":"n","t":"그 말은 모카에게 너무 강했다. 무명. 데뷔 전. 부족한 랩. 부족한 기술. 연이는 모카가 흔들리는 걸 느꼈다."},{"s":"yeon","x":"surprise","t":"모카!"},{"s":"n","fx":"ink","t":"그러나 [무가치]는 이미 모카의 가슴 앞에 닿았다. 노트가 다시 흐려졌고, 연이의 노래도 순간 막혔다. [丁] 불씨가 흔들렸다.","tone":"dark"},{"s":"crow","x":"base","t":"너희의 무대는 완성되지 않았다."},{"s":"n","t":"정말 그랬다. 하나는 꽃돼지, 하나는 무명 수달. 까마귀의 말은 거짓이 아니었다. 그래서 더 위험했다."},{"s":"n","fx":"burst","t":"그때 무대 바닥의 [未]가 작게 울렸다. 따뜻한 흙. 불완전한 것이 버려지지 않고 익는 곳."},{"s":"yeon","x":"talk","t":"맞아. 완성 안 됐어."},{"s":"n","t":"까마귀의 눈이 가늘어졌다. [무가치]가 그 말 앞에서 멈췄다."},{"s":"yeon","x":"talk","t":"근데 완성 안 됐다고 가치 없는 건 아니야. 초안도 무대의 시작이고, 떨리는 첫 줄도 노래의 시작이야."},{"s":"n","fx":"burst","t":"[丁]이 다시 빛났다. 치익. [무가치]의 한 획이 불탔다."},{"s":"yeon","x":"talk","t":"모카. 다음 줄. 완성하려고 하지 마. 일단 꺼내."},{"s":"n","t":"모카는 눈물을 삼키고 다시 입을 열었다. 목소리가 작게 떨렸지만 사라지지 않았다."},{"s":"moka","x":"moved","t":"완성 전이라도, 난 여기 있어. 초안이어도, 난 안 지워."},{"s":"moka","x":"p1","t":"틀린 라임, 흔들린 숨, 그래도 내 안에 살아 있는 꿈, 가치 없단 말에 안 팔아, 내 첫 줄은 내가 지켜 나가."},{"s":"n","fx":"burst","t":"쨍! [무가치]가 갈라졌다. 연이의 [丁] 불씨가 다시 피어났고, [未]의 흙빛 무대가 더 넓어졌다."},{"s":"n","t":"관객석에서 박수가 들렸다. 짝. 아주 작았지만 진짜 박수였다. 짝, 짝. 색이 돌아오고 음식 냄새가 살아났다. LUNE의 기타 줄이 떨렸다. 딩."},{"s":"yeon","x":"happy","t":"박수…."},{"s":"crow","x":"base","t":"불완전한 것들이…."},{"s":"n","t":"까마귀의 표정이 처음으로 일그러졌다. 붉은 눈이 흔들렸다.","tone":"dark"},{"s":"yeon","x":"talk","t":"한 번 더."},{"s":"moka","x":"p2","t":"네."},{"s":"n","bgm":"novaRider","t":"둘은 동시에 숨을 들이켰다. 흐려졌던 조명 위로 붉은 기운이 번지기 시작했다."},{"s":"yeon","x":"talk","t":"꺼내, 꺼내, 숨겨둔 마음도 꺼내."},{"s":"moka","x":"p3","t":"작아도 내 목소리, 흔들려도 내 story."},{"s":"yeon","x":"soft","t":"맛을 잃은 밤에도, 작은 불을 켜."},{"s":"moka","x":"p1","t":"말라버린 무대 위, 내 첫 줄을 세워."},{"s":"n","fx":"burst","t":"둘의 목소리가 겹쳤다. 전문적이지는 않았지만 살아 있었다. 무대 위에 붉고 따뜻한 원이 펼쳐지며 두 글자가 다시 떠올랐다.","im":true},{"s":"neo","x":"soft","t":"[丁未]다. 丁은 연이의 목소리 끝에서 피어나고, 未는 모카의 노트와 무대 바닥에서 받치고 있다. 식신이 처음으로 깨어나고 있다."},{"s":"neo","x":"serious","t":"연이. 계속해라. 멈추면 꺼진다."},{"s":"n","t":"까마귀는 다시 도장을 들고 있었다. 봉인진은 아직 절반 가까이 내려온 상태였다.","tone":"dark"},{"s":"crow","x":"alt","t":"다음에는 완전히 지워주마."},{"s":"sys","t":"[표현 봉쇄 진행률: 52%]","im":true},{"s":"n","t":"위기는 끝나지 않았다. 오히려 이제부터 시작이었다. 하지만 연이는 더 이상 무대 아래에 있지 않았고, 모카도 더 이상 관객이 아니었다. 둘은 불완전한 노래와 랩으로, 그러나 분명 자기 목소리로 무대 위에 있었다."},{"s":"yeon","x":"happy","t":"모카. 우리 지금 아이돌 같아?"},{"s":"moka","x":"base","t":"솔직히 아직은 축제 장기자랑에 가까운데요."},{"s":"yeon","x":"grin","t":"정확해서 아프네."},{"s":"moka","x":"moved","t":"근데 후렴은 조금 아이돌 같아요."},{"s":"yeon","x":"happy","t":"좋아. 데뷔전 1절은 통과라 치자."},{"s":"yeon","x":"grin","t":"관객 반응 별점으로 치면 몇 개쯤 나올까. …반올림 잘하면 세 개는 주지 않겠어?"},{"s":"n","t":"연이는 곁눈으로 네오를 봤다. 아까부터 까마귀를 응시하는 네오의 눈이 평소보다 차갑게 가라앉아 있었다."},{"s":"yeon","x":"think","t":"네오. 저 까마귀 말이야. 왜 하필 만드는 걸 이렇게 싫어하는 거야?"},{"s":"neo","x":"serious","t":"저건 그냥 훼방꾼이 아니다. 저 도장, 밥그릇을 엎는 손이다."},{"s":"yeon","x":"think","t":"밥그릇을 엎어? 무슨 소리야."},{"s":"neo","x":"lecture","t":"편인. 그리고 도식. 밥그릇을 엎는 별, 재능을 갉아먹는 그림자."},{"s":"crow","x":"base","t":"…눈치가 빠른 사자로군."},{"s":"n","t":"까마귀가 처음으로 이름을 인정하듯 붉은 눈을 가늘게 접었다.","tone":"dark"},{"s":"crow","x":"alt","t":"식신은 밥을 짓는 별. 나는 그 밥그릇을 엎는 별. 우리는 처음부터 상극이다."},{"s":"yeon","x":"talk","t":"밥그릇을 엎어? 여긴 먹는 섬이라고. 내 앞에서 밥 얘기 잘못 꺼냈어."},{"s":"yeon","x":"excited","t":"밥그릇 엎는 게 컨셉이라고? 하필 먹는 섬에서? 이 몸, 밥 얘기 나오면 진심 돼. 꿀!"},{"s":"neo","x":"serious","t":"연이. 도식은 재능이 가장 빛나기 직전에 그것을 엎는다. 데뷔 직전, 완성 직전, 무대에 오르기 직전. 정확히 지금 같은 순간을 노린다."},{"s":"yeon","x":"talk","t":"…그래서 하필 데뷔전에 나타났구나."},{"s":"n","t":"연이는 무대 바닥의 [丁未]를 내려다봤다. 밥그릇을 엎으려는 별 앞에서, 작은 불과 그것을 받치는 흙은 여전히 꺼지지 않고 있었다."},{"s":"yeon","x":"talk","t":"모카. 남은 절반, 끝까지 가보자. 이 밥그릇, 절대 안 내줘."},{"s":"moka","x":"p2","t":"네. 오늘 우리 데뷔전, 끝까지 세워요."},{"s":"n","fx":"burst","t":"연이가 마이크 앞으로 한 걸음 다가갔다. 모카가 옆에 섰다. 작은 불씨가 무대 위에서 꺼지지 않기 위해 다시 타오르기 시작했다.","im":true},{"s":"sys","bgm":"gloom","t":"제10화 끝 · 데뷔전(前) — 까마귀의 정체는 편인·도식, 밥그릇을 엎는 별. 봉쇄율 52%, 무대는 이제 후반전으로.","im":true}]});
EPISODES.push({"no":"EP.11","tag":"제11화 · 재능을 먹는 그림자","title":"재능을 먹는 그림자","beats":[{"s":"sys","bg":"siksangCrisis","bgm":"crisis","l":{"who":"yeon","x":"talk"},"c":{"who":"moka","x":"p1"},"r":{"who":"crow","x":"alt"},"t":"제11화 · 식신·상관의 섬 — 회색으로 굳어가는 무대 위. 표현 봉쇄 진행률 61%.","im":true},{"s":"n","t":"꺼내, 꺼내, 숨겨둔 마음도 꺼내. 연이의 목소리가 무대 위로 퍼졌다. 잘 다듬어진 소리는 아니었다. 살짝 떨렸고, 숨도 모자랐다. 무엇보다 노래하는 본인이 제일 당황하고 있었다."},{"s":"yeon","x":"shy","t":"(왜 하필 클라이맥스에서 숨이 딸리냐고… 폐활량아 정신 차려.)"},{"s":"n","t":"기합 좀 넣어보겠다고 아랫배에 힘을 준 순간, 짧은 앞다리가 휘청였다. 무게중심이 코끝으로 쏠린 꽃돼지는 하마터면 무대 바닥에 코부터 콕 박을 뻔했다. 세계관은 웅장한데, 몸은 아직 튜토리얼이었다."},{"s":"n","t":"하지만 사라지지는 않았다. 떨리는 채로, 그 소리는 무대 위에 남았다."},{"s":"moka","x":"base","t":"작아도 내 목소리, 흔들려도 내 story. yo, 연이 위에 나 얹는다."},{"s":"n","t":"모카가 그 위에 랩을 얹었다. 둘의 목소리가 처음으로 겹쳤다. 전문적이지도 완벽하지도 않았지만 살아 있었고, 그 불완전한 목소리가 회색 무대에 작은 틈을 냈다."},{"s":"n","t":"굳어가던 조명에 희미한 색이 한 방울 번지고, 달빛 크림빵 가게에서 약한 단 냄새가 피어올랐다."},{"s":"yeon","x":"talk","t":"봐! 봐봐, 색 돌아온다! 우리 되고 있어!"},{"s":"yeon","x":"happy","t":"봤지 봤지, 색 돌아오는 거 봤지! (신나서 콧김이— 꿀!) …방금 콧김은 라이브 특전이야. 별점에 반영하지 마."},{"s":"n","t":"관객석 앞줄의 아이가 손뼉을 치려 했다. 하지만 소리는 나지 않았다. 두 손이 닿기 직전, 보이지 않는 벽에 막힌 듯 떨었다."},{"s":"yeon","x":"neutral","t":"…박수도 못 치게 막는 거야?"},{"s":"n","t":"연이는 이를 악물었다. 목 안에서 조금 전의 노래가 식어갔다."},{"s":"neo","x":"talk","t":"박수는 소리가 아니라 반응이다. …저 봉인은 반응 자체를 누르고 있다."},{"s":"n","t":"무대 아래 네오의 목소리가 낮게 올라왔다. 무대 위 하늘엔 아직 검은 글자들이 떠 있었다."},{"s":"sys","t":"[무언] [무작] [무미] [무색] [무동] — 말 없음. 만듦 없음. 맛 없음. 색 없음. 움직임 없음.","im":true},{"s":"neo","x":"talk","t":"식신·상관의 섬에서 밖으로 나오려는 모든 것이, 저 다섯 글자에 눌리고 있다."},{"s":"n","t":"모카는 노트를 품에 안고 있었다. 글자들은 조금 돌아왔지만, 여전히 흐릿했다."},{"s":"moka","x":"p2","t":"완성 전이라도 난 여기 있어, 초안이어도 난 안 지워. 내가 쓴 줄 위에 내가 서."},{"s":"n","t":"그 순간 무대 위 흙빛 원이 조금 넓어졌다. 따뜻한 흙빛이 바닥에 번졌다."},{"s":"sys","t":"[未] — 정미(丁未)의 땅이 깨어난다. 작은 불이 설 자리.","im":true},{"s":"n","t":"연이의 가슴 안쪽에서 작은 불씨가 뛰었다."},{"s":"neo","x":"talk","t":"계속해라. 丁이 未 위에 서기 시작했다."},{"s":"yeon","x":"excited","t":"그럼 되는 거야? 이대로 밀면 이기는 거야?"},{"s":"neo","x":"deadpan","t":"…아직은."},{"s":"yeon","x":"grin","t":"'아직은'이라는 말 진짜 싫다니까. 사자야 너 그 단어 너무 좋아해."},{"s":"neo","x":"deadpan","t":"'아직'은 정확한 단어다. '지금은 아니다'라는 뜻이지. 좋아하는 게 아니라, 사실을 말하는 거다."},{"s":"n","t":"그때, 무대 중앙 위의 그림자가 웃었다. 검은 연미복, 붉은 도장을 쥔 손은 하얗고 차가웠다."},{"s":"crow","x":"base","t":"불완전한 표현. 정리되지 않은 말. 훈련되지 않은 목소리. 가치가 검증되지 않은 무대."},{"s":"n","t":"쾅, 쾅, 쾅. 세 글자가 하늘에 못처럼 박혔다."},{"s":"sys","t":"[불완전] [미숙] [무가치]","im":true},{"s":"n","t":"무대 위 공기가 더 무거워졌다. 모카의 노트가 다시 흐려지고, 관객석의 손끝도 멈췄다."},{"s":"crow","x":"base","t":"표현은… 완성된 자에게만 허락되어야 한다."},{"s":"n","t":"연이는 눈을 크게 떴다. 그 말은 단순히 입을 막는 말보다 더 위험했다."},{"s":"yeon","x":"talk","t":"(노래하지 말라는 게 아니야. …잘할 때까지 하지 말라는 거잖아. 완벽해질 때까지, 검증될 때까지, 그 전엔 조용히 있으라는 말.)"},{"s":"moka","x":"base","t":"완성된 자에게만…… 그럼 저는……."},{"s":"n","t":"모카의 얼굴이 창백해졌다. 노트를 쥔 손이 떨렸다."},{"s":"crow","x":"alt","t":"너는 아직 아니다."},{"s":"n","t":"까마귀의 말은 정확히 모카의 약한 곳을 찔렀다. 아직 무명, 아직 데뷔 전, 아직 무대 위에 설 자격이 없다는 말."},{"s":"n","t":"모카의 노트에서 글자가 사라지기 시작했다. 흐려지는 게 아니라, 처음부터 없었던 것처럼 비어갔다."},{"s":"moka","x":"moved","t":"안 돼……."},{"s":"yeon","x":"talk","t":"모카!"},{"s":"n","t":"연이는 급히 그의 노트를 붙잡았다. 노트 한 장이 완전히 하얗게 변했다. 원래 모카가 백 번 넘게 고친 후렴이 적혀 있던 자리엔, 이제 아무것도 없었다."},{"s":"moka","x":"moved","t":"저…… 이거 기억 안 나요. 분명 썼는데."},{"s":"yeon","x":"surprise","t":"뭐?"},{"s":"moka","x":"moved","t":"어떤 라임이었는지, 어떤 박자였는지, 왜 고쳤는지…… 하나도 기억이 안 나요."},{"s":"crow","x":"base","t":"미완성은… 보존할 가치가 없다."},{"s":"yeon","x":"talk","t":"보존할 가치? 야, 이 까마귀야. 밤새 백 번을 고친 게 가치가 없으면, 대체 뭐가 가치가 있는데."},{"s":"n","t":"연이의 목소리가 떨렸다. 화가 나서인지 무서워서인지, 스스로도 구분이 되지 않았다. 다만 모카의 텅 빈 노트를 보고 있으면, 가슴 한가운데가 뜨겁게 조여왔다."},{"s":"n","fx":"ink","t":"그가 도장을 다시 찍었다. 붉은 글자가 노트 위로 내려왔다."},{"s":"sys","t":"[백지화]","im":true},{"s":"n","t":"백지화는 멈추지 않았다. 첫 줄, 두 번째 줄, 지운 흔적, 낙서, 연습한 라임— 모카가 혼자 밤새 썼던 모든 초안들이 하얗게 지워졌다."},{"s":"moka","x":"moved","t":"내가…… 썼던 건데."},{"s":"n","t":"모카의 눈에서 눈물이 툭 떨어져 흰 페이지에 번졌다. 잉크가 아니라 사람 자국이었다. 그마저 곧 말라, 처음부터 아무도 울지 않았던 것처럼 자국도 없이 사라졌다. 모카는 그 마른 자리를 손끝으로 몇 번이고 문질렀다."},{"s":"n","t":"그 순간, 무대 아래 네오의 눈이 크게 흔들렸다. 그는 도장과 노트와 무대 바닥의 정미를 번갈아 보았다."},{"s":"neo","x":"surprise","t":"저 스킬은……."},{"s":"n","t":"처음으로 네오의 목소리에 당황이 섞였다. 갈기가 낮게 타올랐다."},{"s":"yeon","x":"talk","t":"왜? 사자야, 너 지금 표정 왜 그래?"},{"s":"neo","x":"shock","t":"편인도식(偏印倒食)……?!"},{"s":"yeon","x":"think","t":"뭐? 그거 무슨 신기술 이름이야? 발음도 어려워."},{"s":"neo","x":"deadpan","t":"기술 이름이 아니다. 굳이 따지면… 병명에 가깝다."},{"s":"moka","x":"base","t":"그, 그게 뭔데요?"},{"s":"neo","x":"lecture","t":"식신은 먹고, 만들고, 표현하고, 결과로 남기는 힘이다. 이 섬의 밥줄이지."},{"s":"neo","x":"talk","t":"그런데 편인이 지나치게 강하면… 그 식신을 잡아먹는다."},{"s":"yeon","x":"surprise","t":"잡아…먹어? 밥그릇을 통째로?"},{"s":"neo","x":"lecture","t":"생각이 너무 많아져서 만들지 못하고, 평가가 너무 앞서서 말하지 못하고, 완벽해야 한다는 압박이 초안을 죽인다. 그게 편인도식이다."},{"s":"yeon","x":"shy","t":"…잠깐. 생각 많아서 못 만들고, 평가부터 앞서고. 그거 나 과제할 때랑 똑같은데. 나 설마 진작에 걸려 있던 거 아냐?"},{"s":"n","t":"연이는 까마귀를 보았다. 까마귀는 조용히 웃고 있었다."},{"s":"yeon","x":"talk","t":"…처음부터 입을 막으려던 게 아니었구나. 말이 나오기 전에, 아예 죽이는 거였어."},{"s":"neo","x":"talk","t":"정확하다. 식신의 밥그릇을 엎는 기술. 이 섬엔 최악의 상성이다."},{"s":"crow","x":"alt","t":"정확하군, 가디언."},{"s":"n","t":"까마귀의 붉은 눈이 네오를 스쳤다. 그 호칭에 모카의 눈이 흔들렸다."},{"s":"moka","x":"base","t":"가디언……? 네오 씨가?"},{"s":"n","t":"모카의 노트가 다시 하얗게 변했다. 이번엔 몇 장이 동시에 지워졌다."},{"s":"moka","x":"moved","t":"그만…… 제발 그만……."},{"s":"crow","x":"alt","t":"미완성은 불안이다. 불안은 혼란이다. 혼란은… 침묵으로 다스려야 한다."},{"s":"n","fx":"ink","t":"쾅, 쾅, 쾅. 세 글자가 모카의 노트와 무대 위의 未를 동시에 짓눌렀다."},{"s":"sys","t":"[삭제] [검열] [무표현]","im":true},{"s":"n","t":"무대 바닥의 흙빛 원에 금이 갔다. 연이의 가슴 안쪽 丁도 작아졌다. 불이 설 땅이 말라갔다."},{"s":"neo","x":"serious","t":"위험하다."},{"s":"yeon","x":"talk","t":"왜! 뭐가 위험한데!"},{"s":"neo","x":"talk","t":"丁은 작은 불씨, 未는 그 불씨가 남을 땅이다. 그런데 저자가 未를 백지화하고 있다."},{"s":"yeon","x":"think","t":"그러면?"},{"s":"neo","x":"talk","t":"불이 떠 있어도… 오래 못 간다. 땅이 사라지면 불도 꺼진다."},{"s":"n","t":"연이는 하얗게 변해가는 페이지를 봤다. 그건 가사 몇 줄이 아니라, 모카가 포기하지 않았던 시간들이었다. 도저히 참을 수 없었다."},{"s":"yeon","x":"talk","t":"야."},{"s":"n","t":"까마귀의 눈이 연이를 향했다. 연이는 앞발을 무대 바닥에 디뎠다."},{"s":"yeon","x":"talk","t":"미완성은 가치가 없다고?"},{"s":"crow","x":"base","t":"그렇다. 세상은… 완성된 것만 기억한다."},{"s":"yeon","x":"talk","t":"그럼 처음은? 처음 쓴 문장, 처음 부른 노래, 처음 틀린 박자."},{"s":"n","t":"연이는 한 걸음 앞으로 나아가, 짧은 다리로 흙빛 원을 밟았다."},{"s":"yeon","x":"talk","t":"처음부터 완성된 게, 세상에 어디 있는데?"},{"s":"n","fx":"claw","t":"丁의 불꽃이 튀었다. 하지만 [무가치]가 눌렀다. 불꽃은 커지다 다시 작아졌다."},{"s":"crow","x":"alt","t":"불완전한 말은 상처를, 불완전한 창작은 실패를, 불완전한 무대는… 조롱을 만든다."},{"s":"n","t":"검은 말풍선들이 다시 관객석 위로 떠올랐다."},{"s":"sys","t":"[못한다.] [어설프다.] [민망하다.] [그만해.] [준비하고 나와.]","im":true},{"s":"n","t":"관객들은 그 말풍선을 볼 수 있었지만 반응할 수 없었다. 응원하고 싶은데 손이 안 움직이는 눈빛, 외치고 싶은데 목이 굳은 눈빛만 흔들렸다. 완전한 정적보다 더 절망적이었다."},{"s":"n","t":"연이의 목도 답답해졌다. 조금 전까지 작게나마 노래가 나왔는데, 이번엔 입을 열수록 부끄러움이 먼저 올라왔다."},{"s":"yeon","x":"talk","t":"(내가 뭘 안다고 노래해? 무슨 아이돌이라고… 꽃돼지 상태로? 민망하게?)"},{"s":"n","t":"까마귀의 봉인은 소리를 막는 게 아니라, 스스로 표현을 부끄러워하게 만들고 있었다. 밖에서 막는 게 아니라, 안에서 스스로 지우게 하는 것. 그것이 편인도식의 진짜 얼굴이었다."},{"s":"yeon","x":"neutral","t":"진짜…… 악질이네."},{"s":"n","t":"목소리가 겨우 나왔다. 사포에 긁힌 것 같았다."},{"s":"moka","x":"moved","t":"연이…… 저, 다음 줄이 안 나와요."},{"s":"n","t":"그 말이 너무 작았다. 다음 줄이 안 나온다는 건, 식신·상관의 섬에서 가장 무서운 말이었다."},{"s":"n","t":"연이는 모카의 눈을 봤다. 두려움 아래 더 깊은 곳에 상실감이 있었다. 무대가 무서운 게 아니라, 자기 안에 있던 말이 사라지는 것이 무서운 것이다."},{"s":"yeon","x":"talk","t":"모카. 남아 있는 줄, 있어?"},{"s":"n","t":"모카는 떨리는 손으로 노트를 넘겼다. 거의 모든 페이지가 하얗게 비어 있었다. 그러다 마지막 부분에서, 아주 희미한 한 줄이 남아 있었다."},{"s":"sys","t":"[나는 모카.]","im":true},{"s":"moka","x":"moved","t":"이것밖에……. 이거 하나 남았어요."},{"s":"yeon","x":"soft","t":"…그거면 돼. 그거, 처음 줄이잖아."},{"s":"moka","x":"base","t":"네?"},{"s":"n","t":"연이는 목이 조여오는 걸 느끼면서도 말했다."},{"s":"yeon","x":"gentle","t":"네가 누군지 남아 있으면, 다음 줄은 다시 쓸 수 있어."},{"s":"n","t":"모카의 손이 노트를 더 세게 붙잡았다."},{"s":"crow","x":"base","t":"그 한 줄로… 무엇을 할 수 있지?"},{"s":"n","t":"연이는 대답하려 했다. 하지만 [무언]이 목을 조였다. 목 안이 종이처럼 말랐다."},{"s":"yeon","x":"talk","t":"아……."},{"s":"sys","bg":"siksangNight","bgm":"gloom2","tone":"dark","t":"[표현 봉쇄 진행률: 68%]","im":true},{"s":"n","t":"공중의 숫자가 올라갔다. 봉인진이 더 낮게 내려앉고, 달빛 크림빵은 완전히 회색이 됐다."},{"s":"n","t":"LUNE의 기타 줄이 투명해지고, BAMBI의 목소리는 목에 갇히고, SOLV의 마이크엔 검은 금이 갔다. DEST1NOVA조차 다시 멈추고 있었다."},{"s":"moka","x":"moved","t":"제가…… 해야 해요? 저 혼자?"},{"s":"n","t":"연이는 대답하고 싶었다. 하지만 목소리가 나오지 않았다. 답답함이 명치까지 차올랐다."},{"s":"n","t":"무대 아래에서 네오가 한 걸음 움직였다. 하지만 무대 위로는 오르지 않았다."},{"s":"n","t":"이 무대만큼은 연이와 모카가 직접 표현해야 한다는 걸 알고 있었다. 그가 대신 나서면 정미는 끝내 깨어나지 않는다. 그래서 참고 있었다. 하지만 상황은 점점 나빠지고 있었다."},{"s":"sys","tone":"dark","t":"[표현 봉쇄 진행률: 72%]","im":true},{"s":"crow","x":"alt","t":"이제, 마지막으로 남은 이름도 지우겠다."},{"s":"n","t":"붉은 도장이 모카의 노트를 향했다."},{"s":"sys","t":"[무명]","im":true},{"s":"n","t":"그 글자가 노트에 닿으면— 마지막 한 줄, [나는 모카.] 그마저 사라진다."},{"s":"moka","x":"moved","t":"안 돼……!"},{"s":"n","fx":"hands","t":"연이는 몸을 움직이려 했다. 하지만 [무동]이 짧은 다리를 무대 바닥에 못 박았다."},{"s":"n","t":"[무언]은 목을, [무작]은 앞발을, [무미]는 가슴 속 식신 감각을, [무색]은 정미의 불꽃마저 흐리게 만들었다."},{"s":"yeon","x":"talk","t":"(움직여… 움직이라고, 이 짧은 다리야…!)"},{"s":"n","fx":"ink","t":"모카의 노트 위로 [무명]이 천천히 내려왔다. 모카는 눈을 질끈 감았다."},{"s":"moka","x":"moved","t":"나는……. 나는……."},{"s":"n","t":"하지만 다음 말이 나오지 않았다."},{"s":"crow","x":"alt","t":"그래. 너는… 아무도 아니다."},{"s":"n","tone":"dark","t":"[무명]이 마지막 한 줄에 닿기 직전—"},{"s":"sys","bgm":"crisis2","t":"쨍—! 금빛이 무대 아래에서 터졌다.","im":true},{"s":"n","fx":"burst","tone":"desat","t":"[무명]의 글자가 허공에서 멈췄다. 까마귀의 붉은 눈이 처음으로 크게 흔들렸다."},{"s":"n","c":{"who":"neo"},"t":"무대 아래, 네오가 서 있었다. 작은 사자의 갈기가 조용히 타올랐다. 장난기도 귀찮음도 사라진 눈은 낮고 깊었다. 사주의 강처럼."},{"s":"yeon","x":"talk","t":"네오……?"},{"s":"n","t":"네오는 그녀를 보지 않았다. 시선은 까마귀에게 고정되어 있었다."},{"s":"neo","x":"serious","t":"여기까지다."},{"s":"crow","x":"base","t":"…가디언."},{"s":"moka","x":"moved","t":"진짜…… 가디언……?"},{"s":"n","fx":"burst","t":"네오의 발밑에 금빛 문양이 퍼졌다. 비겁의 섬에서 봤던 것보다 훨씬 크고 오래된 문양이었다."},{"s":"n","t":"사주의 강을 떠다니던 간지의 글자들이 한순간 네오의 발밑으로 모였다. 갑자, 을축, 병인, 정묘— 수많은 글자들이 금빛 원을 이루었다."},{"s":"neo","x":"serious","t":"나는 원래, 무대에 설 존재가 아니다. 표현은 너희가 해야 한다. 나는 길을 열 뿐이다."},{"s":"n","fx":"claw","t":"그는 한 걸음 무대 위로 올라섰다. [무동]이 묶으려 했지만, 금빛 발톱이 바닥을 그었다. 쨍— 봉인이 갈라졌다."},{"s":"neo","x":"serious","t":"하지만. 길조차 닫히면… 이야기가 다르다."},{"s":"n","t":"무대 전체가 금빛으로 흔들렸다. 까마귀의 얼굴이 굳었다."},{"s":"crow","x":"alt","t":"너는… 나서면 안 된다."},{"s":"neo","x":"calm","t":"나도 알고 있다."},{"s":"n","t":"그 말은 이상했다. 마치 네오가 나서는 것 자체가, 어떤 규칙을 건드리는 일인 것처럼 들렸다."},{"s":"yeon","x":"talk","t":"네오, 너…… 대체 뭘 대가로 나선 거야?"},{"s":"n","t":"네오는 아주 짧게 그녀를 돌아봤다. 눈빛이 평소보다 훨씬 진지했다."},{"s":"neo","x":"calm","t":"어쩔 수 없군. 이번 한 번만이다."},{"s":"n","fx":"burst","t":"네오가 무대 중앙으로 걸어 나왔다. 그 뒤로 아주 짧은 순간, 달 조명보다 큰 사자의 그림자가 일어섰다. 갈기는 태양처럼 타올랐고, 눈동자는 오래된 별처럼 빛났다."},{"s":"n","t":"관객들은 박수도 환호도 못 했다. 하지만 모두의 눈빛이 흔들렸다. 그 눈빛만은 아직 지워지지 않았다."},{"s":"moka","x":"base","t":"저게…… 진짜 사자였어……."},{"s":"crow","x":"base","t":"네가 왜 아직……."},{"s":"n","t":"까마귀의 손이 떨렸다. 그 말은 끝나지 않았다."},{"s":"n","fx":"metal","t":"네오가 앞발을 들어 올렸다. 그리고 숨을 들이켰다. 아주 길게, 아주 천천히. 그 숨이 갈비뼈 안쪽에서 한 바퀴 돌아 나오는 소리가 들릴 것 같았다. 금빛 발톱 끝에 사주의 글자들이 모였다."},{"s":"neo","x":"serious","t":"사주성광(四柱星光)."},{"s":"n","fx":"metal","t":"작은 칼날이 아니었다. 무대 전체를 가르는 금빛 선. 닫힌 길을 다시 여는 빛. 연이는 그때 처음으로 이상하다고 느꼈다. 네오는 발톱을 휘두른 게 아니라, 숨을 내쉰 것뿐이었다."},{"s":"neo","x":"serious","t":"연이. 모카."},{"s":"n","t":"연이는 간신히, 모카는 떨리는 눈으로 고개를 들었다."},{"s":"neo","x":"serious","t":"내가 봉인을 잠시 가른다. 그 사이— 너희가 다시 꺼내라."},{"s":"n","fx":"burst","tone":"desat","t":"금빛이 폭발했다. [무언]에 금이 가고, [무명]이 흔들리고, 꺼질 듯한 丁未가 다시 작게 빛났다."},{"s":"yeon","x":"talk","t":"목이…… 목이 트인다!"},{"s":"n","t":"연이는 크게 숨을 들이켰다. 종이처럼 말랐던 목에 다시 공기가 돌았다. 하지만 그 순간 깨달았다. 목이 열려도, 무엇을 꺼내야 할지 모르면 소용없다는 것을."},{"s":"neo","x":"talk","t":"길은 열었다. 오래 못 간다. 이건 숨을 잘라 쓰는 일이라서. 저 도식을 이기는 건, 내 발톱이 아니야."},{"s":"yeon","x":"talk","t":"그럼 뭔데! 뭘로 이겨!"},{"s":"neo","x":"lecture","t":"생각해라, 연이. 저자는 '완성'을 무기로 쓴다. 완성되지 않은 건 전부 지운다."},{"s":"neo","x":"sly","t":"그렇다면— 저자가 절대 못 지우는 건 뭐지?"},{"s":"n","t":"연이의 머릿속에서, 조금 전 자기가 뱉은 말이 되돌아왔다. 처음부터 완성된 게 어디 있느냐던 그 말."},{"s":"yeon","x":"talk","t":"…초안."},{"s":"neo","x":"talk","t":"계속해라."},{"s":"yeon","x":"talk","t":"완성은 지울 수 있어. 근데 초안은— 지워도 또 써지잖아. 진심은, 몇 번이든 다시 나오잖아."},{"s":"n","t":"연이의 가슴 안쪽에서 丁의 불씨가 탁, 하고 다시 뛰었다."},{"s":"neo","x":"soft","t":"그게 식상(食傷)이다. 잘 다듬은 결과물이 아니라, 안에서 밖으로 나오려는 힘 자체."},{"s":"neo","x":"talk","t":"편인도식은 '완성'을 심판한다. 하지만 심판할 수 없는 게 하나 있다. 처음 꺼내는 진심."},{"s":"yeon","x":"talk","t":"그러니까 우리가 잘해서 이기는 게 아니라— 부끄러운 채로, 어설픈 채로, 그냥 꺼내버리면 되는 거야?"},{"s":"neo","x":"soft","t":"그래. 완벽하게 부르지 마라. 진심으로 불러라. 그게 저 봉인을 깨는 유일한 카운터다."},{"s":"yeon","x":"grin","t":"완벽하게 하지 말라니, 그건 또 내 특기지. 나 원래 뭐든 대충 하고 진심만 꽉 채우는 타입이거든."},{"s":"n","t":"연이는 모카를 돌아봤다. 노트를 끌어안은 채였지만, 눈빛이 조금 달라져 있었다."},{"s":"moka","x":"base","t":"…연이. 방금 그 말, 나 라임 떠올랐어요."},{"s":"yeon","x":"excited","t":"뭔데?"},{"s":"moka","x":"p1","t":"초안이어도 진심이면, 지워져도 진심이면— yo, 미완성이 우리 무기라면."},{"s":"n","t":"모카의 흐릿하던 노트 위에, 방금 뱉은 그 한 줄이 스스로 새겨졌다. 지워지지 않는 진한 글씨로."},{"s":"sys","t":"[나는 모카.] 아래에 새 줄이 돋았다. — 초안이어도, 진심.","im":true},{"s":"crow","x":"alt","fx":"ink","t":"…무엇을 쓰든 소용없다. 완성되지 않으면, 나는 전부 지운다."},{"s":"yeon","x":"talk","t":"그래, 지워. 근데 우린 또 쓸 거야. 니가 지우는 속도보다, 우리가 진심 꺼내는 속도가 더 빠를걸?"},{"s":"n","t":"연이의 목소리가, 처음으로 떨리지 않았다. 부끄러움은 아직 남았지만, 그걸 그냥 안고 소리를 냈다."},{"s":"n","fx":"burst","t":"무대 바닥의 흙빛 원이, 이번엔 갈라지지 않고 넓어졌다. 丁이 未 위에 단단히 발을 디뎠다."},{"s":"neo","x":"smirk","t":"…불이 땅을 잡았다. 이제 봉인이 아니라, 너희가 진행률을 밀 차례다."},{"s":"sys","bgm":"crisis2","t":"[표현 봉쇄 진행률: 72% → 역전 시작] — 식상 반격, 개방.","im":true},{"s":"n","t":"까마귀의 그림자가 처음으로 뒤로 한 발 물러났다. 붉은 도장을 쥔 손이 미세하게 떨렸다."},{"s":"yeon","x":"grin","t":"어? 방금 뒤로 갔지? 도망 아니고? 이 무대 후기에 '분위기 잡다가 갑자기 퇴장'이라고 적어둘게. 별 하나."},{"s":"crow","x":"base","t":"…재능을 먹는 그림자에게, 겁도 없이."},{"s":"yeon","x":"happy","t":"겁? 나 이미 꽃돼지야. 더 부끄러울 것도 없어. 자, 모카— 처음부터 다시 가자."},{"s":"yeon","x":"grin","t":"완벽? 없어. 리허설? 없어. 폐활량은— 아까부터 없었고. 근데 딱 하나 있어. 지금 당장 꺼낼 진심 한 줌."},{"s":"n","t":"네오의 발톱이 무대 중앙에 금빛 선을 그어, 봉인 아래로 좁은 무대 하나를 열어놓았다."},{"s":"neo","x":"talk","t":"딱 한 곡 분량이다. 이 안에서 다 꺼내라. 남기지 말고."},{"s":"n","t":"연이는 크게 숨을 들이켰다. 모카는 노트를 펼쳤다. 두 사람의 눈이, 오랜만에 같은 곳을 봤다."},{"s":"n","t":"식신·상관의 섬, 최후의 무대가 열리기 직전이었다. 완성이 아니라, 진심으로 여는 무대가."},{"s":"sys","t":"다음 화 · 제12화 — 최후의 무대. 초안이어도, 어설퍼도, 끝까지 꺼내라.","im":true}]});
EPISODES.push({"no":"EP.12","tag":"제12화 · 첫 줄의 무대","title":"첫 줄의 무대","beats":[{"s":"n","bg":"siksangBattle","bgm":"crisis2","l":{"who":"yeon"},"c":{"who":"neo"},"r":{"who":"crow","x":"alt"},"t":"금빛이 무대를 갈랐다. 네오가 숨을 한 번 삼켰다가 뱉었을 뿐인데, 발톱 끝에서 뻗어나간 빛이 무대를 뒤덮은 검은 봉인들을 한순간에 밀어냈다. 아직 이름이 붙지 않은 형(形)이었다.","im":true,"fx":"metal"},{"s":"n","t":"[무언]. [무작]. [무미]. [무색]. [무동]. 그리고 까마귀가 찍어놓은 편인도식의 붉은 도장들. 그 모든 글자에 금이 갔다."},{"s":"n","t":"쨍. 쨍. 쨍. 완전히 깨진 건 아니었다. 찢어진 틈이 생겼을 뿐이었다.","fx":"burst"},{"s":"n","t":"네오의 갈기가 금빛으로 타올랐다. 그 작은 몸 뒤로, 무대를 통째로 덮을 만큼 거대한 사자의 그림자가 떠올라 있었다.","im":true},{"s":"n","t":"갈기는 태양처럼 타올랐고, 눈동자는 오래된 별처럼 빛났다."},{"s":"moka","c":{"who":"moka","x":"moved"},"t":"저게…… 진짜 네오님이에요?","x":"moved"},{"s":"n","t":"연이는 말없이 네오를 바라봤다. 평소의 딱딱하고 건방진 작은 사자가 아니었다. 사주의 강이 잠깐 몸을 빌려 무대에 선 것 같았다."},{"s":"crow","r":{"who":"crow","x":"alt"},"t":"너는 나서면 안 된다.","x":"alt"},{"s":"neo","c":{"who":"neo"},"t":"나도 알고 있다.","x":"serious"},{"s":"n","t":"네오는 이를 악물고 금빛 발톱을 더 깊게 내리그었다. 무대 위에 닫혀 있던 길이 갈라졌다. 그런데 두 번째 숨은 첫 번째보다 짧았다. 연이만 그걸 눈치챘다.","fx":"metal"},{"s":"neo","t":"그러니 오래 버티지 않는다.","x":"serious"},{"s":"n","t":"공중에 금빛 문장이 떠올랐다. [표현 경로 임시 개방]. [제한 시간: 3분].","im":true},{"s":"yeon","t":"3분?","x":"surprise"},{"s":"yeon","t":"운명에 제한 시간이 붙는다고? 이거 약관 몇 조에 적힌 거야. 나 환불 신청할래.","x":"talk"},{"s":"neo","t":"그 안에 해라.","x":"serious"},{"s":"yeon","t":"뭘?","x":"think"},{"s":"neo","t":"너희가 하려던 것. 표현해라.","x":"serious"},{"s":"n","t":"그 말이 떨어지자, 연이의 목을 조이던 [무언]에 금이 갔다. 모카의 노트를 덮던 [무명]도 잠깐 멈췄고, 사라져가던 마지막 한 줄이 희미하게 살아났다."},{"s":"n","t":"[나는 모카.]"},{"s":"moka","c":{"who":"moka","x":"base"},"t":"남아 있어…… 안 지워졌어. 모카의 목소리가 갈라졌다. 노트를 쥔 손등 위로 힘줄이 팽팽하게 섰다. 한 줄. 겨우 한 줄이었지만, 그 한 줄이 아직 거기 있다는 사실만으로 숨이 트였다.","x":"moved"},{"s":"n","t":"연이는 가슴 안쪽을 느꼈다. 꺼질 듯 흔들리던 [丁]의 불씨가 다시 살아났고, 그 아래 [未]의 흙빛이 천천히 무대 바닥을 붙잡았다."},{"s":"n","t":"정미. 丁未. 불씨와, 그 불씨가 설 자리."},{"s":"neo","t":"연이. 모카. 편인도식은 생각과 평가로 식신을 먹어치우는 힘이다.","x":"lecture"},{"s":"n","t":"까마귀의 도장이 다시 붉게 빛났다. [검열]. [삭제]. [완벽].","fx":"claw"},{"s":"neo","t":"잘하려고 하면 잡아먹힌다.","x":"serious"},{"s":"moka","x":"base","t":"그럼 어떻게 해야 해요?"},{"s":"neo","t":"꺼내라.","x":"serious"},{"s":"yeon","t":"들었지? 일단 꺼내.","x":"talk"},{"s":"n","t":"연이는 숨을 크게 들이켰다. 폐 안쪽까지 회색 공기가 들어찼지만, 그 아래 작은 불씨가 꺼지지 않고 타고 있었다. 잘하려는 마음을 내려놓자, 오히려 목이 트였다."},{"s":"n","t":"무대 위는 아직 반쯤 회색이었다. 관객은 박수를 치지 못했고, 함성도 나오지 않았다.","tone":"desat"},{"s":"n","t":"하지만 눈빛은 돌아오고 있었다. 응원하고 싶은데 손이 안 움직이는 눈빛. 맛과 색과 박자를 잃은 채, 누군가 다시 시작해주기를 기다리는 눈빛."},{"s":"n","t":"모카는 그 눈빛을 보았다. 그리고 조용히 입을 열었다."},{"s":"moka","x":"p1","t":"나는 모카."},{"s":"n","t":"그 한 줄은 랩이라기보다 자기소개에 가까웠다. 하지만 사라지지 않았다. 노트 위 글자가 더 선명해졌다."},{"s":"moka","t":"나는 모카.","x":"p1"},{"s":"n","t":"연이가 옆에서 숨을 들이켰다. 그리고 선율을 얹었다."},{"s":"yeon","x":"talk","t":"꺼내, 꺼내, 숨겨둔 마음을 꺼내."},{"s":"n","t":"목소리는 여전히 조금 떨렸다. 하지만 이번엔 피하지 않았다."},{"s":"moka","x":"p2","t":"나는 모카, 아직 무명, 그래도 이름은 안 지워. 첫 줄 하나 남았다면, 다음 줄은 다시 써."},{"s":"n","t":"그 순간 [未]의 흙빛이 무대 바닥에 퍼졌다. 모카의 노트에서 글자 하나가 떨어져, 흙 알갱이가 되어 무대에 내려앉았다. 또 하나. 또 하나.","fx":"burst"},{"s":"n","t":"지워졌던 흔적이 돌아오지는 않았다. 대신 새로 쓴 글자들이 바닥에 쌓이기 시작했다. 미완성의 흙. 초안의 땅."},{"s":"n","t":"그 위에 연이의 [丁] 불씨가 내려앉았다. 정확히는, 모카가 한 줄을 뱉을 때마다 그쪽에서 먼저 붙었다. 모카의 숨이 뜨거워지면 연이의 불씨가 따라 커졌다. 작은 불꽃이 흔들렸지만 꺼지지 않았다.","fx":"fire"},{"s":"crow","x":"base","t":"쾅. 미숙."},{"s":"n","t":"붉은 글자 [미숙]이 둘을 향해 날아왔다. 연이는 마이크를 앞발로 꽉 눌렀다.","fx":"claw"},{"s":"yeon","x":"talk","t":"미숙한 거 맞아."},{"s":"n","t":"[미숙]이 멈칫했다. 연이는 고개를 들었다."},{"s":"yeon","t":"근데 미숙해서 지금 하는 거야. 안 하면 계속 미숙하니까.","x":"talk"},{"s":"n","t":"불씨가 커졌다. [미숙]의 한 획이 불탔다. 치익.","fx":"burst"},{"s":"moka","x":"p3","t":"틀린 박자 위에 다시, 흔들린 숨 위에 다시, 오늘 못하면 내일도 해, 그래도 첫 줄은 여기 남기."},{"s":"n","t":"[미숙]이 갈라졌다. 그 순간 무대 끝, 기타를 안은 LUNE의 손가락이 움직였다. 줄 하나가 떨렸다. 딩. 정말 작은 소리였다."},{"s":"n","t":"LUNE의 눈이 번쩍 뜨였다. 그는 자신의 손을 내려다보고 웃었다. 입은 아직 자유롭지 않았지만, 눈빛만은 분명히 말하고 있었다. 살렸다."},{"s":"n","t":"LUNE이 다시 튕겼다. 딩. 틀린 코드였을지도 모른다. 하지만 그는 그것을 바로 다음 박자로 바꿨다. 딩딩. 딩. 멜로디가 생겼다."},{"s":"moka","x":"moved","t":"LUNE 님……!"},{"s":"yeon","x":"talk","t":"꺼내, 꺼내, 작은 소리도 꺼내."},{"s":"n","t":"곡이 아주 조금 아이돌 노래처럼 변했다. 관객들의 손끝이 떨렸다. 아직 박수는 못 쳤지만, 손가락 끝에 색이 돌아왔다.","fx":"heart"},{"s":"crow","x":"alt","t":"소용없다. 무미."},{"s":"n","t":"까마귀가 다시 도장을 찍었다. 음식 거리의 냄새가 죽어갔다. 달빛 크림빵은 회색이 되었고, 수프는 김을 잃었다.","tone":"desat","fx":"claw"},{"s":"n","t":"보컬 BAMBI의 눈동자가 흔들렸다. 그녀는 아직 노래하지 못했다."},{"s":"yeon","t":"BAMBI! 맛이 사라지는 거, 나 진짜 싫어!","x":"talk"},{"s":"n","t":"까마귀가 순간 멈칫했다. 연이는 아주 진지했다."},{"s":"yeon","t":"먹어도 아무 맛이 안 나는 건, 마음이 아무것도 못 느끼는 거랑 똑같잖아. 맛있으면 맛있다고 해야지.","x":"talk"},{"s":"moka","x":"p1","t":"한입 먹고 살아나는 맛, 숨 막힌 날에 필요한 밥, 말 못 해도 몸은 알아, 따뜻한 건 마음을 살려."},{"s":"n","t":"그 순간 BAMBI가 숨을 들이켰다. 목을 감싸던 검은 봉인에 금이 갔다. 쨍.","fx":"burst"},{"s":"n","t":"BAMBI의 첫 음은 노래라기보다 숨이었다. 아……. 하지만 그 숨에 온기가 있었다. 회색으로 굳었던 크림빵에서 다시 희미한 냄새가 났다."},{"s":"n","t":"BAMBI가 눈을 감고 노래했다. 괜찮아, 처음 숨도 노래가 돼. 맛을 잃은 마음에도, 따뜻한 빛은 돌아와."},{"s":"n","t":"[무미]가 갈라졌다. 크림빵의 단 냄새가 돌아왔다. 구름솜 튀김이 다시 고소해졌다. 수프에 김이 올랐다.","fx":"burst"},{"s":"yeon","x":"happy","t":"아, 돌아왔다."},{"s":"n","t":"그 한마디에 [丁未]가 더 선명해졌다.","fx":"heart"},{"s":"crow","x":"alt","t":"식신이……."},{"s":"neo","c":{"who":"neo"},"t":"그래. 만들고 먹이고 살리는 힘이다.","x":"talk"},{"s":"crow","t":"네가 길을 열었군.","x":"base"},{"s":"neo","t":"길은 열었을 뿐이다. 걷는 건 저들이다.","x":"talk"},{"s":"n","t":"그 말에 연이의 가슴이 뜨거워졌다. 모카도 노트를 더 세게 잡았다. 노트의 글자들이 빠르게 되살아나고 있었다."},{"s":"n","t":"예전 문장이 그대로 돌아오는 건 아니었다. 새로운 줄이 생기고 있었다. 지금 무대 위에서. 바로 이 순간."},{"s":"n","t":"래퍼 SOLV가 마이크를 들어 올렸다. 그의 마이크에는 아직 검은 금이 있었다."},{"s":"crow","c":{"who":"crow","x":"alt"},"t":"무언.","x":"alt"},{"s":"n","t":"까마귀가 바로 도장을 찍었다. SOLV의 입술이 다시 막히려 했다.","fx":"claw"},{"s":"moka","l":{"who":"yeon"},"c":{"who":"moka","x":"angry"},"r":{"who":"crow","x":"alt"},"t":"아니! SOLV 형의 말은 길이랬어!","x":"angry"},{"s":"n","t":"모카의 노트에서 은빛 글자가 떠올랐다. 그가 처음 SOLV 존에서 들은 문장. [말은 칼이 될 수도 있고, 길이 될 수도 있다.]"},{"s":"moka","t":"그럼 지금은 길이야!","x":"base"},{"s":"yeon","x":"talk","t":"꺼내, 꺼내, 막힌 길도 다시 꺼내."},{"s":"moka","x":"p2","t":"닫힌 문 위에 첫 글자, 막힌 목 위에 내 박자, 무명이라도 말할 수 있어, 내 이름으로 길을 그어."},{"s":"n","t":"그 순간 SOLV의 눈빛이 번쩍였다. 마이크의 검은 금이 깨졌다. 쨍!","fx":"burst"},{"s":"n","t":"SOLV의 랩이 무대를 갈랐다. First line, break the frame, 이름 없는 밤도 make a name, 삼킨 말이 길이 될 때, 무대는 다시 숨을 쉬네."},{"s":"n","t":"관객석의 눈빛이 살아났다. 함성은 아직이었지만 입술들이 움직였다. 소리 없는 외침. 그 움직임만으로도 무대가 더 밝아졌다.","fx":"heart"},{"s":"crow","x":"alt","t":"무동."},{"s":"n","t":"까마귀가 다급히 도장을 찍었다. 댄서 RAVEN의 발이 다시 바닥에 묶였다. 이번엔 더 강했다. 그림자가 검은 사슬처럼 발목을 감았다.","tone":"dark","fx":"claw"},{"s":"crow","t":"몸짓은 말보다 위험하다. 몸은 거짓말을 하지 못하니까.","x":"alt"},{"s":"n","t":"그 말과 함께 RAVEN의 그림자가 완전히 굳었다."},{"s":"yeon","t":"RAVEN까지 막히면…….","x":"think"},{"s":"neo","c":{"who":"neo"},"r":{"who":"crow","x":"alt"},"t":"무대의 몸이 닫힌다.","x":"serious"},{"s":"n","t":"연이는 자기 몸을 내려다봤다. 짧은 다리. 둥근 몸. 꽃돼지. 방금 전까지 가장 민망했던 몸."},{"s":"n","t":"하지만 RAVEN 존에서 들은 말이 떠올랐다. 무대에서는 멋있는 것보다 멈추지 않는 게 먼저다."},{"s":"n","t":"연이는 이를 악물고 움직였다. 짧은 다리로 한 걸음. 통. 바닥이 반응했다. 다시 한 걸음. 딩.","fx":"burst"},{"s":"n","t":"흔들리는 몸. 어설픈 박자. 아이돌 댄스라기엔 너무 귀여운 움직임. 하지만 멈추지 않았다."},{"s":"yeon","x":"talk","t":"몸도 말한다며. 그럼 내 몸도 말하게 해볼게."},{"s":"n","t":"그녀는 앞발을 들어 올렸다. 통. 딩. 통. 딩. 식신·상관의 섬 바닥이 다시 반응했다. 처음 이 섬에 도착했을 때처럼. 통딩통딩. 그리고 박자에 맞춰, 가슴 안쪽의 [乙]이 아주 작게 자랐다. 덩굴이 한 마디 뻗는 느낌이었다.","fx":"wood"},{"s":"yeon","t":"꿀! ……방금 콧바람도 박자에 맞춘 거야. 이것도 한 파트로 쳐줘.","x":"excited"},{"s":"moka","l":{"who":"yeon"},"c":{"who":"moka","x":"p3"},"t":"통딩, 통딩, 꽃돼지 step in, 짧은 다리라도 멈추지 않지!","x":"p3"},{"s":"yeon","x":"talk","t":"너 방금 꽃돼지 스텝이라고 했어?"},{"s":"moka","x":"base","t":"죄송해요! 라임 때문에!"},{"s":"yeon","t":"나중에 이야기하자!","x":"talk"},{"s":"n","t":"하지만 박자는 살아났다. LUNE이 기타로 그 리듬을 받았고, BAMBI가 숨을 얹었고, SOLV가 랩으로 밀었다. 그리고 RAVEN의 그림자가 흔들렸다.","fx":"burst"},{"s":"n","t":"RAVEN이 천천히 고개를 들었다. 발끝이 바닥에서 떨어졌다. 쿵. 첫 박자. 쿵. 두 번째. 그리고 세 번째."},{"s":"n","t":"RAVEN의 몸이 회전했다. 검은 사슬이 꽃잎처럼 흩어졌다. 그가 무대 중앙을 가로질렀다. 그의 춤은 분명히 외치고 있었다. 나는 아직 움직인다.","fx":"vortex"},{"s":"n","t":"[무동]이 깨졌다. 쨍그랑! 네 명이 돌아왔다. SOLV. BAMBI. LUNE. RAVEN. DEST1NOVA가 다시 완성됐다.","im":true,"fx":"burst"},{"s":"n","t":"그 중심에는 연이와 모카의 어설픈 후렴이 있었다. 어설퍼서 시작된 노래. 미완성이라서 살아남은 무대."},{"s":"crow","c":{"who":"crow","x":"alt"},"t":"불완전한 것들이…… 어떻게…….","x":"alt"},{"s":"yeon","t":"계속하니까.","x":"calm"},{"s":"n","t":"모카가 노트를 펼쳤다. 이제 노트는 하얗지 않았다. 새로운 가사로 가득 차고 있었다."},{"s":"moka","l":{"who":"moka","x":"p1"},"r":null,"c":{"who":"crow","x":"alt"},"t":"망해도 다시 쓰고, 틀려도 다시 부르고, 막혀도 다시 두드리면, 처음은 결국 길이 돼.","x":"p1"},{"s":"n","t":"그 순간 무대 위에 거대한 글자가 떠올랐다. [丁未]. 이제 흔들리지 않았다.","im":true,"fx":"heart"},{"s":"n","t":"丁의 불꽃은 작지만 선명했고, 未의 흙은 따뜻하고 단단했다. 작은 불이 흙 위에 서자, 무대 전체가 하나의 촛불처럼 빛났다."},{"s":"n","t":"무대 아래에서 네오가 무릎을 살짝 굽혔다. 금빛 틈을 유지하느라 힘이 빠진 듯했다."},{"s":"yeon","l":{"who":"yeon","x":"talk"},"t":"네오!","x":"surprise"},{"s":"n","t":"까마귀는 마지막으로 도장을 높이 들었다. 붉은 도장이 아니라, 이제는 먹구름 같은 검은 도장이었다. 그 위에 글자가 떠올랐다. [편인도식].","tone":"dark"},{"s":"crow","c":{"who":"crow","x":"alt"},"t":"생각이 창작을 삼키고, 평가가 목소리를 삼키며, 두려움이 무대를 삼킨다.","x":"alt"},{"s":"n","t":"검은 도장이 하늘에 찍혔다. [완성되지 않은 모든 표현을 삭제한다.] 거대한 검은 문장이 내려왔다. 아까와는 비교도 되지 않는 압력.","im":true,"tone":"dark","fx":"claw"},{"s":"n","t":"연이의 [丁未]가 흔들렸다. 모카의 노트가 다시 떨렸다. DEST1NOVA의 악기와 목소리와 몸도 동시에 눌렸다."},{"s":"crow","x":"alt","t":"완벽하지 않으면 사라져라!"},{"s":"n","t":"그 말에 무대 전체가 굳었다. 완벽하지 않으면. 그 문장이 너무 무거웠다.","tone":"desat"},{"s":"n","t":"모카의 랩도, 연이의 노래도, LUNE의 기타도, BAMBI의 숨도, SOLV의 첫 줄도, RAVEN의 발끝도, 모두 조금씩 흔들렸다."},{"s":"n","t":"세상에 완벽한 표현은 없었다. 그렇다면 전부 사라져야 하는가. 그 질문이 무대를 짓눌렀다. 연이는 숨을 삼켰지만 정답이 떠오르지 않았다."},{"s":"n","t":"그때, SOLV가 낮게 말했다. 완벽하지 않아도."},{"s":"n","t":"BAMBI가 이어 불렀다. 따뜻할 수 있어."},{"s":"n","t":"LUNE이 기타를 튕겼다. 틀려도."},{"s":"n","t":"RAVEN이 발을 디뎠다. 쿵. 움직일 수 있다."},{"s":"moka","x":"moved","t":"무명이어도."},{"s":"yeon","x":"talk","t":"나일 수 있어."},{"s":"n","bgm":"novaFlame","t":"그 순간 모두의 기운이 하나로 이어졌다. DEST1NOVA의 무대, 모카의 첫 줄, 연이의 정미, 네오가 열어둔 금빛 길. 전부 한곳에 모였다.","im":true,"fx":"heart"},{"s":"yeon","x":"talk","t":"다 같이."},{"s":"n","c":{"who":"neo"},"r":{"who":"crow","x":"alt"},"t":"네오가 금빛 틈을 마지막으로 넓혔다. 그리고 모두가 동시에 시작했다.","fx":"claw"},{"s":"n","t":"꺼내, 꺼내, 숨겨둔 마음을 꺼내. SOLV의 랩이 들어왔다. 완벽 전의 first line, 흔들려도 still shine."},{"s":"n","t":"BAMBI의 노래가 덮었다. 작은 숨도 노래가 돼, 따뜻하면 살아 있어. LUNE의 기타가 틀을 부쉈다. 딩! 틀린 코드도 우리 거야!","fx":"burst"},{"s":"n","t":"RAVEN의 춤이 봉인의 선을 갈랐다. 쿵. 쿵. 쿵.","fx":"vortex"},{"s":"moka","l":{"who":"yeon"},"c":{"who":"moka","x":"p3"},"r":{"who":"crow","x":"alt"},"t":"나는 모카, 아직 무명, 그래도 내 이름 안 지워!","x":"p3"},{"s":"yeon","x":"talk","t":"맛을 잃은 밤에도, 작은 불을 켜."},{"s":"n","t":"그 순간 [丁未]가 완전히 빛났다. 작은 불이 흙 위에서 타올랐다. 그 불은 폭발하지 않았다. 대신 번졌다.","im":true,"fx":"heart"},{"s":"n","t":"무대에서 관객석으로. 관객석에서 음식 거리로. 음식 거리에서 말놀이 골목으로. 골목에서 섬 전체로."},{"s":"n","t":"맛이 돌아왔다. 색이 돌아왔다. 몸이 돌아왔다. 글자가 돌아왔다."},{"s":"n","t":"그리고 마침내. 관객들의 손이 서로 닿았다. 짝! 첫 번째 박수. 이번엔 막히지 않았다. 짝짝짝!","fx":"burst"},{"s":"n","t":"함성도 돌아왔다. DEST1NOVA! 모카! 연이! 네오!"},{"s":"n","t":"네오는 함성을 들을 여유도 없이 금빛 틈을 유지하고 있었다. 그러나 그의 입가가 아주 조금 올라갔다."},{"s":"n","t":"까마귀의 [편인도식] 문장이 무대 위에서 불타기 시작했다. 치익. 치이익. 완성되지 않은 모든 표현을 삭제한다. 그 문장이 [丁未]의 불에 타들어갔다.","fx":"burst"},{"s":"yeon","x":"talk","t":"삭제 안 돼."},{"s":"moka","x":"p1","t":"아직 쓰는 중이니까."},{"s":"n","t":"SOLV가 낮게 랩했다. 미완성이라서 다음 줄이 있고. BAMBI가 노래했다. 다음 줄이 있어서 살아 있어."},{"s":"n","t":"LUNE이 웃었다. 그리고 틀리면 또 살리면 돼! RAVEN이 발을 찍었다. 멈추지 않으면 무대다."},{"s":"n","t":"[편인도식]이 산산조각났다. 까마귀의 검은 도장이 깨졌다. 쨍그랑!","im":true,"fx":"burst"},{"s":"crow","x":"alt","t":"불완전한 것들이……. 왜 사라지지 않는 거지……."},{"s":"n","t":"까마귀가 뒷걸음질쳤다. 그의 연미복이 검은 깃털로 흩어지기 시작했다.","fx":"vortex"},{"s":"yeon","x":"talk","t":"완성하려고 계속하니까."},{"s":"crow","t":"계속…….","x":"base"},{"s":"n","t":"그의 몸이 무너졌다. 검은 깃털들이 무대 위로 흩어졌다. 하지만 이번엔 바닥에 닿기도 전에, 따뜻한 불빛에 녹아 사라졌다.","fx":"vortex"},{"s":"n","t":"마지막으로 작은 깃털 하나가 남았다. 그 깃털은 이상하게도 완전히 검지 않았다. 끝부분에 희미한 회색빛이 있었다."},{"s":"crow","x":"base","t":"표현은…… 두려운 것이다……."},{"s":"yeon","t":"응.","x":"soft"},{"s":"n","t":"무대가 조용해졌다."},{"s":"yeon","t":"그래도 해야 해.","x":"gentle"},{"s":"n","r":null,"t":"그 순간 마지막 깃털도 사라졌다.","fx":"heart"},{"s":"sys","t":"[식신·상관의 섬 정화 완료] · [편인도식 봉인 해제]","im":true},{"s":"sys","t":"[사주 글자 회수] · [時柱: 丁未]"},{"s":"sys","t":"[표현의 힘 개방: 작은 불씨의 무대] · [식신: 미완성을 기르고 남기는 힘] · [상관: 막힌 틀을 깨고 밖으로 꺼내는 힘]"},{"s":"n","t":"연이는 그 글자를 바라봤다. 가슴 안쪽으로 [丁未]가 스며들었다. 따뜻했다. 작은 불과 단단한 흙.","fx":"heart"},{"s":"n","t":"말이 사라지지 않도록 붙잡는 힘. 초안이 작품이 되도록 기다리는 힘. 맛을 되찾고, 몸을 움직이고, 말을 꺼내는 힘."},{"s":"yeon","t":"정미…….","x":"soft"},{"s":"n","t":"연이는 가슴을 눌렀다. 머리 위 꽃에 작은 붉은 불빛이 붙었고, 꽃 아래로 따뜻한 흙빛 무늬가 생겼다."},{"s":"n","c":{"who":"moka","x":"moved"},"t":"모카는 노트를 내려다봤다. 하얗게 지워졌던 페이지들은 돌아오지 않았다. 하지만 이상하게 슬프지만은 않았다."},{"s":"n","t":"그 빈 페이지 위에 새로운 첫 줄이 떠올라 있었다. [나는 모카.] 그리고 그 아래. [아직 쓰는 중.]"},{"s":"n","t":"모카는 그것을 보고 한참 울었다."},{"s":"yeon","t":"좋은 제목이네.","x":"smile"},{"s":"moka","t":"그러게요.","x":"moved"},{"s":"n","bgm":"stillLake","t":"그때 네오가 한쪽 무릎을 꿇었다. 아니, 정확히는 네 발 중 하나가 살짝 무너졌다. 숨소리가 이상했다. 들이켜는 소리는 나는데, 그 숨이 어디에도 닿지 않는 소리였다."},{"s":"yeon","x":"talk","c":{"who":"neo"},"t":"네오!"},{"s":"n","t":"연이는 깜짝 놀라 달려갔다. 거대한 사자의 그림자는 이미 사라져 있었다. 다시 작은 사자. 아니, 갈기 달린 고양이처럼 보이는 네오가 앉아 있었다."},{"s":"n","t":"달려가던 짧은 다리가 저희끼리 엉켰다. 마지막 한 걸음은 걷기보다 구르기에 가까웠고, 코가 먼저 바닥에 콩 찍혔다. 위엄이라곤 없는 등장이었다."},{"s":"yeon","t":"괜찮아?","x":"think"},{"s":"neo","t":"괜찮다.","x":"calm"},{"s":"yeon","t":"거짓말하지 마.","x":"talk"},{"s":"neo","t":"가디언은 쉽게 쓰러지지 않는다.","x":"calm"},{"s":"yeon","t":"그 말 하는 애들이 꼭 쓰러지던데?","x":"grin"},{"s":"neo","t":"표본이 부족하다.","x":"deadpan"},{"s":"moka","c":{"who":"moka","x":"base"},"t":"네오님…… 방금 그 모습은 뭐였어요?","x":"base"},{"s":"yeon","c":{"who":"neo"},"t":"맞아. 너 아까 진짜 컸어. 달 조명보다 컸는데, 그걸 착각이라고 우기는 건 무리 아니야?","x":"grin"},{"s":"neo","t":"착각이다.","x":"deadpan"},{"s":"moka","c":{"who":"moka","x":"base"},"t":"관객들도 다 봤어요.","x":"base"},{"s":"n","t":"네오는 잠시 침묵했다. 그리고 아주 담담하게 말했다."},{"s":"neo","c":{"who":"neo"},"t":"무대 연출이다.","x":"deadpan"},{"s":"yeon","t":"거짓말.","x":"grin"},{"s":"moka","c":{"who":"moka","x":"angry"},"t":"거짓말.","x":"angry"},{"s":"n","t":"연이와 모카가 동시에 외쳤다. 네오는 시선을 피했다. 그때 관객석에서 함성이 터졌다. DEST1NOVA! 모카! 연이! 그리고 조금 뒤. 네오!"},{"s":"n","c":{"who":"neo"},"t":"네오의 귀가 다시 미세하게 움직였다. 연이는 그걸 놓치지 않았다."},{"s":"yeon","t":"좋아하지 마.","x":"grin"},{"s":"neo","t":"안 했다. 무대 상황이 정리됐는지 확인한 것뿐이다.","x":"deadpan"},{"s":"yeon","t":"귀로?","x":"grin"},{"s":"neo","t":"그렇다.","x":"deadpan"},{"s":"n","t":"연이는 웃음을 터뜨렸다."},{"s":"n","t":"웃다가 콧바람이 먼저 튀었다. 꾸울. 연이는 아무 일 없었다는 얼굴로 시선을 돌렸지만, 네오의 귀가 또 한 번 움찔했다."},{"s":"n","bg":"siksang","t":"무대 위, DEST1NOVA 멤버들이 다가왔다. SOLV가 모카의 어깨를 두드렸다. 좋은 첫 줄이었다."},{"s":"moka","c":{"who":"moka","x":"moved"},"t":"저…… 진짜 괜찮았나요?","x":"moved"},{"s":"n","t":"SOLV가 말했다. 괜찮은 정도는 넘었다. 모카는 그대로 굳었다. LUNE이 기타를 들고 웃었다. 우리 후렴도 생겼잖아. 꺼내, 꺼내!"},{"s":"n","t":"BAMBI가 연이를 보며 말했다. 연이의 목소리도 좋았어. 떨렸지만, 그래서 더 진짜였어."},{"s":"yeon","x":"happy","c":{"who":"neo"},"t":"아이돌 칭찬은 부담이 크네."},{"s":"n","t":"RAVEN은 짧게 말했다. 무대 체질이다."},{"s":"yeon","x":"talk","t":"아니라니까요."},{"s":"neo","t":"관객 반응은 좋았다.","x":"soft"},{"s":"yeon","t":"너도 즐겼잖아.","x":"grin"},{"s":"neo","t":"임무 수행이었다.","x":"deadpan"},{"s":"yeon","t":"거대한 사자 그림자까지 띄우는 임무 수행?","x":"grin"},{"s":"yeon","t":"착각, 무대 연출, 임무 수행. 하루 만에 변명이 세 개나 늘었네. 다음 편엔 몇 개로 불어날까.","x":"grin"},{"s":"n","t":"네오는 대답하지 않았다. 대답하지 않는다는 건, 뭔가 있다는 뜻이었다. 연이는 마음속에 표시해두었다. 네오 정체 수상함. 매우 수상함."},{"s":"yeon","t":"이 세계 고객센터에 '가디언 사양 문의' 하나 넣고 싶은데. 접수 창구가 어디 붙어 있는지를 모르겠단 말이지.","x":"think"},{"s":"n","t":"하지만 지금은 추궁할 때가 아니었다. 음식 냄새가 돌아왔고, 조명은 색을 찾았고, 아이들은 웃었고, 관객들은 박수를 쳤다."},{"s":"n","t":"말놀이 골목에서는 벌써 방금 무대를 흉내 내고 있었다. 꺼내, 꺼내! 숨겨둔 마음을 꺼내!"},{"s":"moka","c":{"who":"moka","x":"base"},"t":"제 흑역사가 섬 전체 후렴이 됐어요.","x":"base"},{"s":"yeon","x":"happy","t":"축하해. 밈이 됐네."},{"s":"yeon","t":"게다가 아까 그 '꿀'도 같이 데뷔했어. 이제 내 콧바람도 정식 멤버라니까. 전용 파트까지 있어.","x":"grin"},{"s":"moka","t":"이거 좋은 거죠?","x":"base"},{"s":"yeon","t":"대체로.","x":"grin"},{"s":"n","c":{"who":"neo"},"t":"네오는 조용히 마지막 깃털이 사라진 자리를 바라보고 있었다. 그의 눈빛은 조금 어두웠다."},{"s":"yeon","x":"talk","t":"네오. 그 까마귀, 완전히 끝난 거야?"},{"s":"neo","t":"까마귀는 사라졌다.","x":"calm"},{"s":"yeon","t":"그 말은, 흑막은 안 끝났다는 뜻이지?","x":"think"},{"s":"n","t":"네오는 이번에도 바로 대답하지 않았다."},{"s":"yeon","t":"너 진짜 숨기는 거 많다.","x":"talk"},{"s":"neo","t":"아직 말할 때가 아니다.","x":"calm"},{"s":"yeon","t":"그 말 제일 수상한 거 알지?","x":"grin"},{"s":"neo","t":"알고 있다.","x":"soft"},{"s":"n","t":"연이는 네오를 바라봤다. 이 작은 사자는 분명 뭔가를 알고 있었다. 사주의 강, 흩어진 글자, 봉인자들, 그리고 무대 위에서 드러난 거대한 사자의 그림자."},{"s":"n","t":"궁금한 건 많았다. 하지만 이 섬에서 배운 것도 있었다. 모든 말을 한 번에 꺼낼 필요는 없다는 것. 초안이 있고, 다음 줄이 있고, 언젠가 완성될 문장이 있다는 것."},{"s":"yeon","t":"다음 줄에서 물어볼게.","x":"soft"},{"s":"neo","t":"무슨 뜻이지?","x":"neutral"},{"s":"yeon","t":"지금은 넘어가 준다는 뜻이야. 근데 안 까먹을 거야.","x":"grin"},{"s":"neo","t":"그럴 것 같았다.","x":"soft"},{"s":"n","t":"무대 위 조명이 따뜻하게 내려왔다. 정미의 불씨가 연이의 가슴 안에서 조용히 타오르고 있었다.","fx":"heart"},{"s":"n","t":"식신·상관의 섬은 다시 소란스러워지고 있었다. 이번에는 그 소란이 조금 더 소중하게 느껴졌다."},{"s":"n","t":"말할 수 있다는 것. 만들 수 있다는 것. 맛있다고 웃을 수 있다는 것. 틀려도 다시 할 수 있다는 것. 그 모든 것이, 생각보다 쉽게 빼앗길 수 있는 것이었으니까."},{"s":"yeon","t":"꺼내라……. 좋은 주문이네.","x":"soft"},{"s":"moka","x":"base","t":"우리 후렴이에요."},{"s":"yeon","x":"happy","t":"그래. 우리 후렴."},{"s":"n","bgm":"main","t":"그리고 그 순간, 식신·상관의 섬 하늘에 다시 음악이 올랐다. 이번엔 누구도 그것을 막지 않았다.","im":true},{"s":"sys","t":"제12화 · 첫 줄의 무대 — 끝. 다음 이야기, 곧."}]});
EPISODES.push({"no":"EP.13","tag":"제13화 · 맛있는 작별","title":"맛있는 작별","beats":[{"s":"n","bg":"siksang","bgm":"daily","l":{"who":"yeon"},"c":{"who":"moka","x":"base"},"r":null,"t":"식신·상관의 섬이 다시 시끄러워졌다. 전과 같은 시끄러움은 아니었다. 소리가 많다는 뜻이 아니라, 돌아온 소리라는 뜻이었다."},{"s":"n","t":"잃어버릴 뻔했다가 다시 찾은 웃음. 막힐 뻔했다가 다시 터진 박수. 사라질 뻔했다가 다시 살아난 노래."},{"s":"n","t":"회색으로 굳어가던 거리에 색이 돌아왔고, 냄새를 잃었던 음식들이 다시 김을 피워 올렸다.","fx":"heart"},{"s":"n","t":"달빛 크림빵은 다시 부풀었고, 구름솜 튀김은 다시 바삭한 향을 냈다. 노을빛 탕후루가 반짝이며 굳었다. 리듬 팬케이크 가게 앞에는 아이들이 뒤집개를 들고 줄을 섰다. 「하나, 둘, 셋!」 휙. 팬케이크가 공중에서 한 바퀴 돌았다. 짝짝짝. 이번에는 박수가 제대로 났다."},{"s":"n","t":"봉인에 막혀 허공에서 멈추던 손들이, 이제는 서로 부딪히고 있었다. 그 소리 하나하나가 섬이 살아 있다는 증거처럼 들렸다. 연이는 무대 옆 계단에 앉아 있었다. 정확히는 앉으려다 다리가 짧아 그냥 털썩 내려앉은 상태였다."},{"s":"yeon","x":"think","t":"계단은 확실히 다리 긴 종족을 기준으로 설계됐어. 이 섬, 배리어프리 항목은 별 반 개야."},{"s":"yeon","x":"talk","t":"나 진짜 무대 했네. 말로 꺼내놓고 나니, 그제야 실감이 손끝까지 번졌다. 아직도 심장이 무대 위에 두고 온 것처럼 얕게 뛰었다."},{"s":"n","t":"말로 꺼내자 다시 민망해졌다. 목덜미가 괜히 근질거렸다."},{"s":"moka","x":"moved","t":"저도요."},{"s":"yeon","x":"talk","t":"너는 래퍼니까 언젠가 했을 일이잖아."},{"s":"moka","x":"base","t":"연이님도 했잖아요."},{"s":"yeon","x":"talk","t":"나는 사고였어. 등 떠밀린 사고."},{"s":"moka","x":"base","t":"사고치고는 후렴이 너무 좋았어요."},{"s":"n","t":"멀리서 아이들이 뛰어다니며 외쳤다. 「꺼내, 꺼내!」 「숨겨둔 마음을 꺼내!」"},{"s":"yeon","x":"shy","t":"아…… 내 흑역사가 후렴이 됐다.","fx":"veil"},{"s":"moka","x":"base","t":"저도 제 첫 줄이 섬 전체에 퍼졌어요."},{"s":"n","t":"둘은 잠시 서로를 바라봤다. 그리고 동시에 웃었다. 부끄러운데 싫지는 않은, 이상한 감각이었다."},{"s":"n","fx":"heart","t":"부끄러움과 뿌듯함이 한자리에 앉아 있는 건 처음이었다. 연이는 그 이상한 온도를 조금 더 느껴보고 싶어, 굳이 자리를 뜨지 않았다."},{"s":"yeon","x":"talk","t":"방금 전까진 표현이란 게 무섭고 민망하고, 평가받는 일이라고만 생각했거든."},{"s":"n","t":"그런데 막상 무대에서 꺼낸 말이 누군가의 입에 다시 불리는 걸 보니, 그건 조금 다른 감각이었다."},{"s":"n","t":"내가 낸 작은 소리가 다른 사람에게 닿는 것. 내 첫 줄이 누군가의 장난이 되고, 응원이 되고, 노래가 되는 것.","fx":"heart"},{"s":"n","t":"그게 조금 부끄럽고, 조금 따뜻했다. 그때 무대 아래쪽에서 주민들이 다가왔다. 달빛 크림빵 가게의 곰, 리듬 팬케이크 가게의 두더지, 말놀이 골목의 붉은 여우와 초록 앵무새. 그다음에는 악기 장인들, 음식 부스 주인들, 아이들, 관객들까지 하나둘 모여들었다."},{"s":"n","t":"연이는 그들을 보고 살짝 굳었다. 짧은 앞발이 계단 모서리를 꾹 쥐었다."},{"s":"yeon","x":"talk","t":"왜, 왜 다들 오시지?"},{"s":"moka","x":"base","t":"혹시 후렴 저작권 문제?"},{"s":"yeon","x":"talk","t":"그게 지금 제일 먼저 떠올라?"},{"s":"moka","x":"base","t":"제가 무명이라 권리에 민감해요."},{"s":"yeon","x":"grin","t":"너 데뷔 무대도 하기 전에 법무팀부터 차렸구나."},{"s":"n","t":"달빛 크림빵 가게 곰이 앞으로 나왔다. 커다란 앞발에는 갓 구운 빵 바구니가 들려 있었다. 「고맙네.」"},{"s":"yeon","x":"talk","t":"네?"},{"s":"n","t":"「이 섬의 맛을 되찾아줘서.」 곰은 따뜻한 달빛 크림빵 하나를 내밀었다. 「아까 첫 입은 선물이었지. 이번 건 감사 인사일세.」"},{"s":"n","t":"연이는 조심스럽게 빵을 받았다. 따뜻했다. 이번에는 냄새도 났다.","fx":"heart"},{"s":"n","t":"달콤하고 고소하고, 아주 약간 짭짤한 별소금 향. 연이는 한입 베어 물었다. 순간 눈이 커졌다. 맛이 더 진했다. 크림이 부드럽게 퍼졌고, 그 안쪽에서 작은 불씨 같은 온기가 올라왔다."},{"s":"yeon","x":"happy","t":"와……."},{"s":"yeon","x":"bliss","t":"너무 맛있어서 콧구멍에서 저절로 김이 뿜어졌다. 꿀. ……방금 건 감탄이 아니라 콧김이야, 오해 말고."},{"s":"n","t":"곰이 웃었다. 「표현이 돌아오면 맛도 깊어지지.」"},{"s":"yeon","x":"talk","t":"이건 진짜 사과가 아니라 보상인데요."},{"s":"n","t":"「그렇게 받아도 좋네.」 옆에서 두더지가 리듬 팬케이크 접시를 내밀었다. 「이건 무대 축하 팬케이크예요.」 팬케이크 위에는 작은 글자가 시럽으로 적혀 있었다. [첫 줄 축하]"},{"s":"moka","x":"moved","t":"저…… 이거 먹어도 돼요?"},{"s":"n","t":"두더지가 웃었다. 「먹으라고 만든 거죠.」 모카는 한입 먹었다. 그리고 눈이 커졌다."},{"s":"moka","x":"p1","t":"박자가 나요. 입안에서 박자가 나요."},{"s":"n","t":"모카는 잠시 씹다가, 갑자기 손으로 테이블을 두드렸다. 탁. 탁탁. 탁."},{"s":"moka","x":"p2","t":"이거 후렴으로 쓸 수 있어요."},{"s":"yeon","x":"happy","t":"너 진짜 래퍼 맞구나. 먹으면서도 곡 생각하네."},{"s":"moka","x":"p2","t":"이건 영감이에요."},{"s":"n","t":"말놀이 골목의 붉은 여우가 다가왔다. 「꽃돼지 친구.」 연이의 눈썹이 스윽 올라갔다. 여우는 바로 고개를 숙였다. 「아, 미안. 연이.」"},{"s":"yeon","x":"talk","t":"좋아. 빠른 수정 마음에 들어."},{"s":"n","t":"여우는 웃으며 작은 사탕 주머니를 건넸다. 「이건 보컬 사탕이야. 먹으면 잠깐 목이 맑아져.」"},{"s":"yeon","x":"talk","t":"혹시 먹으면 다시 무대 올라가야 하는 건 아니죠?"},{"s":"n","t":"초록 앵무새가 옆에서 말했다. 「아니. 하지만 노래방 가고 싶어질 수는 있어.」"},{"s":"yeon","x":"talk","t":"위험하네."},{"s":"yeon","x":"grin","t":"부작용 있는 아이템은 원래 고객센터 신고감인데. 근데 이 세계, 고객센터가 어디 붙어 있긴 한 거야?"},{"s":"n","r":{"who":"neo"},"t":"네오가 옆에서 조용히 말했다."},{"s":"neo","x":"talk","t":"받아둬라. 도움이 될 수 있다."},{"s":"n","t":"연이는 사탕 주머니를 받아 들었다."},{"s":"yeon","x":"talk","t":"네가 그렇게 말하니까 갑자기 아이템 같아."},{"s":"neo","x":"deadpan","t":"실제로도 그럴 수 있다."},{"s":"n","t":"모카가 노트에 적었다. [보컬 사탕: 목소리 회복 가능. 단, 노래 욕구 주의.]"},{"s":"yeon","x":"talk","t":"지금 뭐 해?"},{"s":"moka","x":"base","t":"기록이요. 앞으로도 이런 일이 있을 것 같아서요."},{"s":"n","t":"모카가 고개를 들었다. 아직 겁도 긴장도 있었지만, 처음 나타났을 때처럼 그저 꿈만 말하는 얼굴은 아니었다. 한 번 무대에 섰고, 한 번 자기 이름을 지킨 얼굴이었다."},{"s":"moka","x":"base","t":"연이님은 다음 섬으로 가는 거죠?"},{"s":"n","t":"연이는 빵을 먹다 멈췄다."},{"s":"yeon","x":"talk","t":"응."},{"s":"neo","x":"talk","t":"가야 한다. 아직 흩어진 글자가 남아 있다."},{"s":"moka","x":"moved","t":"그럼 저도……."},{"s":"n","t":"그때 무대 쪽에서 낮은 목소리가 들렸다. 「가기 전에 인사는 해야지.」 SOLV였다. DEST1NOVA 멤버들이 다가오고 있었다."},{"s":"n","t":"SOLV는 은빛 마이크를, BAMBI는 따뜻한 수프 컵을 들었다. LUNE은 기타를 등에 멘 채 코드를 튕겼고, RAVEN은 말없이 뒤따라왔다. 모카는 자리에서 벌떡 일어났다. 너무 급하게 일어나 팬케이크 접시가 흔들렸다."},{"s":"moka","x":"p3","t":"데, 데, 데……."},{"s":"yeon","x":"talk","t":"DEST1NOVA."},{"s":"moka","x":"p3","t":"맞아요. 그거요."},{"s":"n","t":"SOLV는 모카 앞에 섰다. 「좋은 첫 줄이었다.」"},{"s":"moka","x":"moved","t":"저…… 진짜요?"},{"s":"n","t":"「그래. 사라질 뻔했는데 지켰지.」 SOLV는 모카의 가사 노트를 보았다."},{"s":"moka","x":"moved","t":"혼자 지킨 건 아니에요."},{"s":"n","t":"「그래서 더 좋다. 무대는 혼자 찢는 게 아니라, 같이 버티는 거니까.」 모카의 눈에 눈물이 맺혔다.","fx":"heart"},{"s":"n","t":"LUNE이 기타를 튕기며 웃었다. 「우리 rookie 오늘 진짜 데뷔한 거 아냐?」"},{"s":"moka","x":"p1","t":"아니요! 저는 아직……."},{"s":"n","t":"BAMBI가 부드럽게 말했다. 「아직이라고 해도 괜찮아. 아직은 부끄러운 말이 아니라, 다음이 있다는 말이니까.」"},{"s":"moka","x":"moved","t":"다음이 있다……."},{"s":"n","t":"RAVEN이 조용히 말했다. 「연습해.」"},{"s":"moka","x":"p2","t":"네!"},{"s":"n","t":"RAVEN은 짧게 덧붙였다. 「도망치지 말고.」 모카의 눈빛이 단단해졌다."},{"s":"moka","x":"base","t":"네."},{"s":"yeon","x":"happy","t":"모카, 오늘 인생 멘토 다 만났네."},{"s":"moka","x":"moved","t":"저 오늘 죽어도 돼요."},{"s":"n","t":"연이와 네오가 동시에 말했다. 「안 돼.」"},{"s":"yeon","x":"talk","t":"너 아직 다음 줄 써야 하잖아."},{"s":"neo","x":"lecture","t":"그리고 기술 연습이 필요하다."},{"s":"moka","x":"moved","t":"네. 살게요."},{"s":"n","t":"BAMBI가 연이에게 수프 컵을 내밀었다. 「이건 너에게. 무대 뒤풀이 수프.」"},{"s":"n","t":"「식신·상관의 섬에는 있어.」 연이는 한입 마셨다. 처음에는 고소했고, 끝에는 살짝 매콤했다. 긴장했던 마음을 풀어주면서도, 다음 길로 갈 힘을 주는 맛이었다."},{"s":"yeon","x":"happy","t":"이건…… 쉬었다가 다시 가는 맛이네요."},{"s":"n","t":"BAMBI가 미소 지었다. 「맞아.」 LUNE은 작은 피크 하나를 내밀었다. 달빛 모양이었다. 「이건 선물.」"},{"s":"yeon","x":"talk","t":"나는 기타 못 치는데?"},{"s":"n","t":"「괜찮아. 틀린 박자를 살리고 싶을 때 써.」"},{"s":"n","t":"「있을지도?」"},{"s":"n","t":"LUNE은 웃었다. 「식신·상관의 섬 아이템은 대체로 마음 먹기에 따라 달라져.」"},{"s":"yeon","x":"happy","t":"되게 상관답다."},{"s":"n","t":"SOLV는 모카에게 은빛 링 하나를 건넸다. 「노바 링이다.」"},{"s":"n","t":"「데뷔 선물은 아니다. 숙제다.」"},{"s":"n","t":"「다음에 만날 때, 네 두 번째 줄을 들려줘라.」 모카의 손이 떨렸다. 하지만 이번에는 겁 때문이 아니었다."},{"s":"moka","x":"moved","t":"네."},{"s":"n","t":"그는 노트에 노바 링을 끼웠다. 달빛 아래서 은빛 링이 반짝였다.","fx":"heart"},{"s":"n","t":"RAVEN은 연이와 네오를 번갈아 보았다. 「둘 다 숨기는 게 많군.」"},{"s":"n","t":"RAVEN은 연이의 머리 위 꽃을 보았다. 「꽃 안쪽에 불과 물과 흙이 같이 있다.」 그다음 네오를 보았다. 「그리고 저쪽은 더 많다.」 네오의 귀가 아주 미세하게 움직였다."},{"s":"neo","x":"deadpan","t":"무대 뒤풀이 중에 할 이야기는 아니다."},{"s":"n","t":"SOLV도 네오를 바라봤다. 「사주 가디언.」 그 말에 모카가 다시 귀를 쫑긋했다."},{"s":"moka","x":"p1","t":"맞다. 저도 아직 궁금해요. 사주 가디언이라는 건 여기서도 처음 들어요."},{"s":"n","t":"BAMBI도 조용히 말했다. 「나도 오래 전설을 들었지만, 직접 본 건 처음이야.」 LUNE이 눈을 반짝였다. 「작은데 거대한 사자 그림자 나오는 것도 처음 봤고.」"},{"s":"n","t":"RAVEN은 짧게 말했다. 「봉인자도 네오를 알아봤다.」 공기가 잠깐 조용해졌다.","fx":"veil"},{"s":"n","t":"연이의 시선이 네오에게 화살처럼 꽂혔다. 네오는 세상에서 가장 태연한 표정을 골라 꺼내 썼다."},{"s":"neo","x":"deadpan","t":"우연이다."},{"s":"n","t":"연이, 모카, DEST1NOVA 멤버 전원이 동시에 그를 바라봤다."},{"s":"yeon","x":"talk","t":"그건 너무 무리야."},{"s":"n","t":"LUNE이 웃었다. 「거짓말도 리듬이 있어야 하는데, 방금은 박자가 안 맞았어.」 네오는 잠시 침묵했다. 그리고 고개를 돌렸다."},{"s":"neo","x":"talk","t":"아직 말할 때가 아니다."},{"s":"n","t":"SOLV는 네오를 한참 보더니 더 묻지 않았다. 「그럼 아직은 묻지 않지.」 그는 연이를 보았다. 「하지만 조심해라. 봉인자가 네오를 알아봤다면, 다음 섬에서도 그 이름이 반응할 수 있다.」"},{"s":"yeon","x":"think","t":"네오 이름이?","fx":"veil"},{"s":"n","t":"「아니.」 SOLV의 목소리가 낮아졌다. 「네오의 정체가.」 네오는 아무 말도 하지 않았다. 연이는 더 묻고 싶었지만 지금은 참았다. 식신·상관의 섬에서 배운 게 있었다."},{"s":"n","t":"말은 꺼내야 하지만, 모든 말을 한 번에 꺼낼 필요는 없었다. 초안이 있고, 다음 줄이 있고, 때가 있다."},{"s":"yeon","x":"talk","t":"다음에 꼭 물어볼 거야."},{"s":"neo","x":"deadpan","t":"그때도 답하지 않을 수 있다."},{"s":"yeon","x":"talk","t":"그럼 그다음에도 물어볼 거야."},{"s":"neo","x":"soft","t":"끈질기군."},{"s":"yeon","x":"happy","t":"내 장점이야."},{"s":"n","bg":"siksang3","t":"그때 광장 전체에 음식이 차려지기 시작했다. 뒤풀이가 열린 것이다."},{"s":"n","t":"길게 이어진 테이블 위에 달빛 크림빵, 구름솜 튀김, 노을빛 탕후루, 리듬 팬케이크, 마음 수프, 불꽃 라면, 보컬 사탕이 잔뜩 올라왔다."},{"s":"n","t":"멤버들의 이름을 딴 특별 음식도 있었다. SOLV의 은빛 후추 스테이크 꼬치, BAMBI의 따뜻한 허그 수프, LUNE의 랜덤 코드 쿠키, RAVEN의 그림자 초코 타르트. 연이는 테이블을 보고 멈춰 섰다. 짧은 앞발이 저절로 움찔했다."},{"s":"yeon","x":"happy","t":"여긴 천국인가?"},{"s":"neo","x":"deadpan","t":"적당히 먹어라."},{"s":"yeon","x":"talk","t":"이런 상황에서 적당히라는 말은 예의가 아니야."},{"s":"neo","x":"deadpan","t":"예의와 위장 용량은 별개의 문제다."},{"s":"n","t":"모카는 이미 리듬 팬케이크 앞에 앉아 있었다."},{"s":"moka","x":"p2","t":"이건 영감용으로 먹어야 해요."},{"s":"yeon","x":"talk","t":"먹는 핑계가 점점 전문적이네."},{"s":"moka","x":"base","t":"식신의 섬이니까요."},{"s":"n","t":"연이는 불꽃 라면 앞에 섰다. 가게 주인이 경고했다. 「이 라면은 자존심을 먹고 매워집니다.」"},{"s":"yeon","x":"talk","t":"그럼 난 안 먹어."},{"s":"n","t":"LUNE이 웃었다. 「왜?」"},{"s":"yeon","x":"talk","t":"내 자존심은 이미 오늘 무대에서 많이 소모됐어."},{"s":"n","t":"SOLV가 낮게 말했다. 「현명하군.」 BAMBI는 연이에게 허그 수프를 한 그릇 더 건넸다. 「너는 이쪽이 더 어울려.」"},{"s":"yeon","x":"happy","t":"감사합니다. 매운 자존심보다 따뜻한 위로가 좋네요."},{"s":"n","t":"RAVEN은 그림자 초코 타르트를 조용히 먹고 있었다. 연이는 궁금해서 물었다."},{"s":"yeon","x":"talk","t":"그거 맛있어요?"},{"s":"n","t":"RAVEN은 잠시 생각했다. 「달다.」"},{"s":"yeon","x":"talk","t":"끝?"},{"s":"n","t":"「깊다.」 연이는 타르트 한 조각을 받아 먹었다. 처음엔 진한 초콜릿, 그다음엔 살짝 쌉싸름, 끝엔 이상하게 조용한 달콤함이 남았다."},{"s":"yeon","x":"talk","t":"이거 RAVEN 같네요."},{"s":"n","t":"RAVEN은 고개를 끄덕였다. 「좋은 평가다.」 그렇게 그들은 한참을 먹고, 이야기하고, 웃었다.","fx":"heart"},{"s":"n","t":"연이는 오랜만에 정말 쉬는 것 같았다. 비겁의 섬에선 자기 자신과 싸웠고, 식신·상관의 섬에선 표현이 지워질 뻔했다. 그런데 지금은, 맛있는 음식을 먹고 있었다. 방금 만난 이들이 고맙다고 말해주고 있었다."},{"s":"n","t":"이것도 운명 회복의 일부일지도 몰랐다. 맛있는 걸 맛있다고 말하고, 고맙다고 인사하고, 같이 웃을 수 있는 시간.","fx":"heart"},{"s":"n","t":"그때 모카가 조심스럽게 입을 열었다."},{"s":"moka","x":"base","t":"연이님."},{"s":"yeon","x":"talk","t":"응?"},{"s":"moka","x":"moved","t":"저…… 같이 가도 돼요?"},{"s":"n","t":"연이는 수프를 마시다 멈췄다. 네오도 모카를 보았다. 모카는 노바 링이 달린 가사 노트를 품에 안고 있었다."},{"s":"moka","x":"base","t":"저 오늘 첫 줄을 썼어요. 근데 다음 줄은 여기만 보고는 못 쓸 것 같아요."},{"s":"moka","x":"base","t":"다른 섬도 보고 싶어요. 표현이 돈이 되면 어떻게 되는지, 마음이 지식이 되면 어떻게 되는지, 운명이 또 어떻게 망가져 있는지."},{"s":"moka","x":"moved","t":"그리고…… 저도 누군가의 다음 줄을 도와주고 싶어요."},{"s":"n","t":"네오는 바로 대답하지 않았다. 그는 모카를 바라봤다."},{"s":"neo","x":"talk","t":"앞으로의 길은 위험하다."},{"s":"moka","x":"base","t":"알아요."},{"s":"neo","x":"talk","t":"오늘처럼 무대가 있는 곳만 나오지 않는다. 도망치고 싶을 수도 있다."},{"s":"n","t":"모카는 손에 든 노트를 꽉 잡았다."},{"s":"moka","x":"base","t":"그때도 한 줄은 남겨볼게요."},{"s":"yeon","x":"happy","t":"좋은 대답인데?"},{"s":"n","t":"네오는 잠시 침묵했다. 그리고 말했다."},{"s":"neo","x":"soft","t":"따라와라."},{"s":"moka","x":"moved","t":"정말요?"},{"s":"neo","x":"deadpan","t":"두 번 말하지 않는다."},{"s":"n","t":"모카는 그대로 자리에서 벌떡 일어났다.","fx":"heart"},{"s":"moka","x":"p3","t":"저 동료 됐어요!"},{"s":"yeon","x":"cheer","t":"동료 등록 완료. 참고로 이 파티는 환불도 탈퇴도 안 되는 약관이야."},{"s":"n","t":"LUNE이 기타를 튕겼다. 「축하해, rookie!」 딩. BAMBI가 박수를 쳤다. 「잘 다녀와.」 SOLV는 짧게 말했다. 「다음 줄을 써라.」 RAVEN은 말했다. 「살아서.」"},{"s":"moka","x":"moved","t":"네!"},{"s":"yeon","x":"talk","t":"모카, 역할은 정했어?"},{"s":"moka","x":"p2","t":"비트 서포터 겸 기록 담당!"},{"s":"neo","x":"deadpan","t":"소리 감지와 기록 담당이다."},{"s":"moka","x":"p2","t":"소리 감지와 기록 담당, 별칭 비트 서포터!"},{"s":"yeon","x":"happy","t":"좋아. 있어 보여."},{"s":"n","bg":"siksang","t":"축제가 조금씩 마무리될 무렵, 연잎 배가 다시 강가에 나타났다. 배는 이전보다 조금 넓어진 것 같았다."},{"s":"n","t":"마치 새로운 동료가 생길 것을 알고 있었다는 듯이."},{"s":"yeon","x":"surprise","t":"어어— 넓어졌다고 신나서 뛰었다가 반대쪽 끝까지 주르륵 미끄러졌잖아. 짧은 다리는 브레이크가 부실하다니까."},{"s":"yeon","x":"talk","t":"이 배, 자동 확장 기능도 있어?"},{"s":"neo","x":"calm","t":"사주의 강은 필요한 만큼 길을 만든다."},{"s":"yeon","x":"happy","t":"오. 이번엔 좀 멋있다."},{"s":"neo","x":"deadpan","t":"멋있는 건 강이지 배가 아니다. 배는 그냥 잎이다."},{"s":"n","bg":"river","bgm":"riverEnter","t":"모카는 조심스럽게 연잎 배에 올랐다. 처음 타는 배라 그런지 살짝 비틀거렸다."},{"s":"yeon","x":"talk","t":"괜찮아?"},{"s":"moka","x":"base","t":"네. 생각보다 푹신하네요."},{"s":"yeon","x":"talk","t":"나 처음엔 여기서 돼지 된 걸 깨달았어."},{"s":"n","t":"DEST1NOVA 멤버들과 주민들이 강가에 모였다. 달빛 크림빵 가게 곰이 빵 바구니를 흔들었다."},{"s":"n","t":"말놀이 골목의 여우와 앵무새가 동시에 외쳤다. 「다음에도 말하러 와!」 아이들은 후렴을 불렀다. 「꺼내, 꺼내!」","fx":"heart"},{"s":"moka","x":"moved","t":"저 진짜 다음 줄 쓰고 올게요!"},{"s":"n","t":"SOLV는 손을 들었고, BAMBI는 따뜻하게 웃었다. LUNE은 기타로 짧은 작별 코드를 쳤다. 딩. RAVEN은 고개를 숙였다. 네오는 조용히 앞을 바라봤다. 연이는 강가의 모두를 바라봤다. 조금 전까지만 해도 모르는 이들이었다."},{"s":"n","fx":"veil","t":"이제는 작별이 아쉬운 이들이 되었다. 운명 세계는 여전히 낯설고 종종 등골이 서늘했지만, 이렇게 마음이 이어지는 순간도 있었다."},{"s":"n","t":"연잎 배가 천천히 움직였다. 식신·상관의 섬이 뒤로 멀어졌다."},{"s":"n","t":"연이는 가슴 안쪽의 [丁未]를 느꼈다. 작은 불. 따뜻한 흙. 그리고 그 위에 남은 노래 한 줄.","fx":"heart"},{"s":"n","t":"모카는 배 한쪽에 앉아 노트를 펼쳤다. 빈 페이지 위에 새 문장을 적었다. [첫 번째 동료가 된 날.]"},{"s":"yeon","x":"happy","t":"벌써 기록해?"},{"s":"moka","x":"base","t":"기록 안 하면 날아가요. 표현은 꺼내야 남으니까요."},{"s":"yeon","x":"talk","t":"맞네."},{"s":"n","t":"그때 강 앞쪽에 새로운 안개가 피어올랐다. 이번 안개는 황금빛이 아니었다. 차분하고 깊은 빛이었다."},{"s":"n","t":"마치 오래된 책장 사이로 새어 나오는 햇빛. 혹은 조용한 도서관 창가에 쌓인 먼지 빛.","fx":"veil"},{"s":"yeon","x":"talk","t":"저긴 어디야?"},{"s":"neo","x":"talk","t":"인성의 도서관이다."},{"s":"neo","x":"lecture","t":"배우고, 기억하고, 보호받고, 이해하는 힘."},{"s":"yeon","x":"think","t":"인성?"},{"s":"moka","x":"p1","t":"그럼 공부하는 섬인가요?"},{"s":"neo","x":"deadpan","t":"어느 정도는."},{"s":"yeon","x":"talk","t":"잠깐만. 나 방금까지 무대 뛰고 먹고 놀다가 왔는데 다음이 공부 섬이라고?"},{"s":"neo","x":"deadpan","t":"정확히는 지식과 기억의 섬이다."},{"s":"yeon","x":"talk","t":"그게 공부잖아."},{"s":"moka","x":"base","t":"저는 좋을지도 몰라요. 가사 쓰려면 많이 알아야 하니까."},{"s":"yeon","x":"talk","t":"너 동료 되자마자 모범생 포지션 잡는 거야?"},{"s":"moka","x":"base","t":"비트 서포터 겸 기록 담당이니까요."},{"s":"yeon","x":"talk","t":"아, 역할 몰입 빠르네."},{"s":"yeon","x":"think","t":"솔직히 나 시험 잘 본 적 없고, 벼락치기 성공한 적 없고…… 필기 빌려준 애 이름도 기억이 안 나. 기억의 섬인데 이래도 되나?"},{"s":"n","t":"네오는 인성의 도서관 쪽을 바라봤다. 그의 표정은 묘하게 진지했다.","tone":"desat"},{"s":"yeon","x":"talk","t":"왜 또 표정이 그래?"},{"s":"neo","x":"talk","t":"인성의 도서관은 조용해 보이지만 쉽지 않다."},{"s":"yeon","x":"talk","t":"또 위기 있어?"},{"s":"neo","x":"talk","t":"기억은 때로 가장 무거운 짐이 된다."},{"s":"n","t":"연이는 잠시 말문이 막혔다. 그 말은 어딘가 따뜻했지만, 동시에 등줄기를 서늘하게 훑고 지나갔다. 무엇을 기억하게 될까. 무엇을 배우게 될까. 연이는 가슴 안쪽의 글자들을 느꼈다. [乙亥] [丁未]. 자기 자리를 찾았고, 자기 목소리를 꺼냈다."},{"s":"n","t":"이제는 아마도, 자신이 왜 이곳에 왔는지를 조금 더 배워야 할 차례였다. 연잎 배는 조용히 강을 따라 흘렀다. 뒤에서는 식신·상관의 섬 노래가 희미하게 들려왔고, 앞에서는 인성의 도서관 안개가 천천히 열리고 있었다. 연이는 짧은 앞발을 가슴에 올렸다."},{"s":"yeon","x":"talk","t":"좋아. 이번엔 공부든 기억이든, 한번 해보자."},{"s":"n","t":"잠시 후, 작게 덧붙였다."},{"s":"yeon","x":"think","t":"근데 시험은 없었으면 좋겠다."},{"s":"n","t":"네오는 대답하지 않았다."},{"s":"yeon","x":"talk","t":"왜 대답 안 해?"},{"s":"n","t":"모카가 노트에 조용히 적었다. [인성의 도서관. 시험 있을 가능성 높음.]"},{"s":"yeon","x":"talk","t":"그런 거 기록하지 마!"},{"s":"n","t":"연잎 배는 세 사람을 태운 채, 인성의 도서관으로 향했다."},{"s":"sys","im":true,"t":"[丁未] 획득 — 식상(食傷)의 글자. 작은 불과 따뜻한 흙, 그 위에 남은 노래 한 줄. 표현하는 힘이 연이의 가슴에 새겨졌다."},{"s":"sys","im":true,"t":"다음 섬 · 인성(印星)의 섬 — 배우고, 기억하고, 보호받고, 이해하는 힘. 조용한 도서관의 빛 속에서, 가장 무거운 기억이 연이를 기다린다. (다음 화에 계속)"}]});

EPISODES.push({"no":"EP.14","tag":"제14화 · 숨을 세는 법","title":"숨을 세는 법","beats":[{"s":"n","bg":"river","bgm":"riverEnter","l":{"who":"yeon"},"c":{"who":"neo"},"r":{"who":"moka","x":"base"},"t":"연잎 배가 다시 사주의 강 위로 미끄러졌다. 식신·상관의 섬이 뒤로 멀어지며, 아직 축제 냄새가 배어 있는 바람이 뺨을 스쳤다."},{"s":"n","t":"연이의 가슴 안쪽에서 두 개의 기둥이 조용히 빛났다. 乙亥. 丁未. 되찾은 글자는 이제 넷이었다."},{"s":"moka","x":"p1","t":"와아……. 진짜 배 타고 다니는 거였네요. 저 이 섬 백 년 살면서 한 번도 안 나가봤는데."},{"s":"yeon","x":"happy","t":"백 년 동안 대기 줄만 섰다며."},{"s":"moka","x":"p3","t":"그 말 계속 하실 거예요?"},{"s":"yeon","t":"응. 재밌어서."},{"s":"n","t":"모카는 배 난간에 매달려 물을 들여다봤다. 강물 속에서 한자들이 물고기처럼 헤엄쳤다."},{"s":"moka","x":"base","t":"근데요, 저 진짜 따라가도 되는 거예요? 저는 사주 글자 회수 같은 거 잘 모르는데."},{"s":"yeon","t":"몰라도 돼. 나도 몰라."},{"s":"moka","x":"p3","t":"그게 더 불안한데요."},{"s":"n","t":"연이는 웃다가, 문득 이상한 걸 느꼈다. 아까부터 배 안이 너무 조용했다."},{"s":"n","t":"평소 같으면 벌써 세 번은 잔소리가 날아왔을 타이밍이었다."},{"s":"yeon","x":"talk","c":{"who":"neo"},"t":"네오."},{"s":"n","t":"네오는 뱃머리에 앉아 강 건너를 보고 있었다. 대답이 반 박자 늦었다."},{"s":"neo","t":"뭐지."},{"s":"yeon","t":"아까부터 한마디도 안 하잖아."},{"s":"neo","t":"할 말이 없었다."},{"s":"yeon","t":"너 할 말 없어도 하는 애야."},{"s":"n","t":"네오는 대답하지 않았다. 그의 갈기 끝이 아주 미세하게 흔들리고 있었다. 바람 때문이 아니었다."},{"s":"moka","x":"moved","t":"저기……. 네오님, 아까부터 숨소리가 좀 이상해요."},{"s":"yeon","x":"talk","t":"숨소리?"},{"s":"moka","t":"저 래퍼라서 숨소리는 좀 알거든요. 저건 들이켜는 소리가 아니라, 들이켠 척하는 소리예요."},{"s":"n","t":"연이의 등이 서늘해졌다. 무대에서 네오가 무릎을 꿇던 장면이 다시 떠올랐다."},{"s":"neo","t":"신경 쓸 것 없다. 곧 도착한다."},{"s":"n","t":"그리고 정말로, 안개 너머에서 섬이 나타났다."},{"s":"n","bg":"island","bgm":"stillLake","t":"이번 섬은 소리가 없었다."},{"s":"n","t":"식신·상관의 섬이 냄새와 음악으로 먼저 인사했다면, 이 섬은 아무것도 하지 않았다. 배가 선착장에 닿는 소리조차 물에 먹힌 것처럼 들리지 않았다."},{"s":"moka","x":"p3","t":"어……. 제 발소리가 안 나요."},{"s":"yeon","x":"talk","t":"나도. 바닥은 분명 딱딱한데."},{"s":"neo","t":"인성의 도서관이다."},{"s":"yeon","t":"인성?"},{"s":"neo","t":"받아들이고, 새기고, 기억하는 힘. 배움과 기록의 자리다."},{"s":"moka","t":"그럼 여기 사람들은 다 공부만 해요?"},{"s":"neo","t":"이 섬에는 사람이 거의 없다."},{"s":"n","bg":"islandIn","t":"섬 안쪽으로 들어서자 이유를 알 수 있었다. 이 섬은 통째로 하나의 서고였다."},{"s":"n","t":"끝이 보이지 않는 서가가 안개 속으로 솟아 있었다. 책장마다 책 대신 기억이 꽂혀 있었다. 어떤 것은 웃고 있었고, 어떤 것은 오래 울고 있었다."},{"s":"n","t":"지나갈 때마다 낮은 속삭임이 들렸다. 누군가의 오래된 하루가 조용히 말을 걸어왔다."},{"s":"yeon","x":"base","t":"…와."},{"s":"n","t":"그 감탄조차 소리가 되지 못하고 서가 사이로 빨려 들어갔다."},{"s":"moka","x":"moved","t":"여기서는 랩 못 하겠는데요."},{"s":"yeon","t":"드디어 조용해지겠네."},{"s":"moka","x":"angry","t":"그거 상처예요!"},{"s":"n","t":"모카가 소리쳤지만, 그 목소리도 두 걸음 앞에서 사라졌다. 모카는 자기 입을 만져보고는 시무룩해졌다."},{"s":"moka","x":"p3","t":"이 섬 저랑 상성 최악이에요."},{"s":"neo","t":"그렇겠지. 여기는 꺼내는 섬이 아니라 담는 섬이다."},{"s":"n","t":"네오가 앞장섰다. 세 걸음. 네 걸음."},{"s":"n","bgm":"gloom","t":"다섯 걸음째에서, 그가 무너졌다."},{"s":"n","im":true,"fx":"ink","t":"쿵. 소리를 삼키는 섬에서, 그 소리만은 똑똑히 들렸다."},{"s":"yeon","x":"talk","c":{"who":"neo"},"t":"네오!"},{"s":"n","t":"연이가 달려갔다. 짧은 다리로 최대한 빨리. 네오는 옆으로 쓰러진 채 얕게 숨을 몰아쉬고 있었다."},{"s":"n","t":"금빛 갈기가 색을 잃고 있었다. 태양 같던 빛이 지금은 오래된 놋쇠처럼 탁했다."},{"s":"moka","x":"moved","t":"네오님! 네오님!"},{"s":"neo","t":"…괜찮다."},{"s":"yeon","t":"괜찮은 애가 왜 넘어져."},{"s":"neo","t":"발이 걸렸다."},{"s":"yeon","x":"talk","t":"여긴 바닥이 평평해."},{"s":"neo","t":"…돌이 있었다."},{"s":"yeon","t":"없어."},{"s":"n","t":"연이는 네오 옆에 주저앉았다. 화를 내려고 했는데, 목소리가 먼저 떨렸다."},{"s":"yeon","t":"무대에서도 그랬잖아. 무릎 꿇었잖아. 나 그거 봤어."},{"s":"neo","t":"봤군."},{"s":"yeon","t":"보이게 넘어졌으면서 왜 못 본 척하래."},{"s":"n","t":"네오는 눈을 감았다. 짧은 침묵이 서가 사이를 채웠다."},{"s":"moka","x":"angry","t":"저기요, 네오님."},{"s":"n","t":"모카의 목소리가 낮았다. 처음 듣는 톤이었다."},{"s":"moka","t":"저 백 년 동안 대기 줄만 선 놈이라 아는 게 없어요. 근데 하나는 알아요."},{"s":"moka","x":"angry","t":"자기 혼자 다 하고 쓰러지는 사람 옆에 있으면, 남은 사람은 평생 그 장면만 기억해요."},{"s":"n","t":"네오가 눈을 떴다."},{"s":"moka","t":"저 그거 이미 한 번 겪었어요. 그러니까 두 번은 싫어요."},{"s":"n","t":"연이는 모카를 돌아봤다. 그 수달의 헤드폰 아래 눈이 젖어 있었다."},{"s":"neo","t":"…미안하다."},{"s":"yeon","x":"talk","t":"어, 방금."},{"s":"neo","t":"말하지 마라."},{"s":"yeon","t":"너 방금 사과했어."},{"s":"neo","t":"말하지 말라고 했다."},{"s":"n","t":"그래도 연이는 조금 웃었다. 사과할 줄 아는 걸 보니 아직 살아 있었다."},{"s":"n","t":"네오는 천천히 몸을 일으켰다. 그리고 서가 안쪽을 바라봤다."},{"s":"neo","t":"…어차피 이 섬에 온 이유가 그거다."},{"s":"yeon","t":"뭔데."},{"s":"neo","t":"내가 쓰는 힘의 이름을, 너희에게 알려주려고."},{"s":"n","bgm":"neo","t":"네오가 걷기 시작했다. 이번엔 아까보다 느렸지만, 방향은 분명했다."},{"s":"n","t":"서가는 안으로 들어갈수록 오래되었다. 종이 냄새가 흙냄새로 바뀌고, 흙냄새가 쇠 냄새로 바뀌었다."},{"s":"n","t":"그리고 가장 깊은 자리에, 다섯 색 실로 묶인 책 한 권이 서가 밖으로 반쯤 밀려 나와 있었다."},{"s":"n","t":"파란 실, 붉은 실, 노란 실, 흰 실, 검은 실. 다섯 가닥이 표지를 가로질러 묶고 있었다."},{"s":"yeon","x":"base","t":"이게 뭔데?"},{"s":"neo","t":"오행식보. 五行息譜."},{"s":"moka","x":"p3","t":"…식보요? 먹는 거요?"},{"s":"neo","t":"쉴 식(息)이다. 숨이라는 뜻이지."},{"s":"yeon","t":"숨의 악보라는 거야?"},{"s":"neo","t":"틀린 말은 아니군."},{"s":"n","t":"네오가 앞발을 대자 다섯 실이 스르르 풀렸다. 책이 저절로 펼쳐지며, 글자들이 공중으로 떠올랐다."},{"s":"sys","im":true,"t":"[오행식보 · 五行息譜] · 운명 세계의 존재는 제 일간(日干)의 기운을 숨으로 돌려, 형(形)으로 꺼낸다. 이를 오행의 호흡이라 한다."},{"s":"yeon","t":"일간이면……. 사주에서 나를 나타내는 글자?"},{"s":"neo","t":"그렇다. 네 일주는 乙亥. 그 앞 글자, 乙이 네 일간이다."},{"s":"yeon","t":"乙……. 나무?"},{"s":"neo","t":"음목(陰木). 큰 나무가 아니라 덩굴이다. 감고, 잇고, 기어이 자라는 쪽."},{"s":"n","t":"글자가 다시 흘렀다."},{"s":"sys","im":true,"t":"[제1칙] 숨은 제 일간에서만 나온다. 남의 기운은 흉내 낼 수 있어도 꺼낼 수 없다."},{"s":"sys","im":true,"t":"[제2칙] 상생은 합기(合氣)하고, 상극은 파훼(破)한다. 곁에 선 자를 살리기도, 베기도 한다."},{"s":"sys","im":true,"t":"[제3칙] 숨은 나눠 쓰는 것이다. 형을 뽑을수록 제 숨이 줄고, 숨이 다하면 몸이 먼저 무너진다."},{"s":"n","t":"세 번째 문장이 떠오른 순간, 서가 전체가 아주 조용해졌다."},{"s":"yeon","x":"talk","c":{"who":"neo"},"t":"…네오."},{"s":"neo","t":"말하지 마라."},{"s":"yeon","t":"이거 네 얘기잖아."},{"s":"neo","t":"말하지 말라고 했다."},{"s":"yeon","x":"talk","t":"무대에서 세 번 그었잖아! 세 번!"},{"s":"n","t":"연이의 목소리가 서가를 울렸다. 소리를 삼키던 섬이 그 한 마디만은 삼키지 못했다."},{"s":"n","t":"네오는 오래 말이 없었다. 그리고 아주 짧게 대답했다."},{"s":"neo","t":"그때 안 그었으면, 너희가 무너졌다."},{"s":"yeon","t":"…바보야."},{"s":"neo","t":"가디언이다."},{"s":"yeon","t":"바보 가디언."},{"s":"moka","x":"base","t":"저도 그렇게 생각해요."},{"s":"neo","t":"둘 다 조용히 해라."},{"s":"n","t":"네오가 몸을 돌렸다. 서가 사이에 좁은 공터가 있었다. 오래전 누군가가 여기서 똑같은 걸 배웠던 자리처럼 보였다."},{"s":"neo","t":"보여주겠다. 한 번만이다."},{"s":"yeon","x":"talk","t":"야, 숨 없다며!"},{"s":"neo","t":"한 번은 있다."},{"s":"n","t":"네오가 자세를 낮췄다. 그리고 숨을 들이켰다."},{"s":"n","t":"이번엔 연이도 똑똑히 들었다. 공기가 그의 몸 안으로 들어가, 갈비뼈 안쪽에서 한 바퀴를 돌고, 발끝까지 내려갔다가, 다시 어깨로 올라오는 소리."},{"s":"n","t":"금빛이 갈기 끝에서부터 발톱으로 흘러내렸다. 서릿발 같은 흰빛이었다."},{"s":"neo","skill":{"el":"metal","unit":"일의 형","name":"단금","han":"斷金"},"im":true,"fx":"metal","t":"금(金)의 호흡. 일의 형 — 단금."},{"s":"n","im":true,"fx":"metal","t":"소리는 나지 않았다. 다만 공터 맞은편 서가의 그림자가, 위에서 아래로 곧게 두 조각이 났다."},{"s":"n","t":"그림자만. 책장은 멀쩡했다."},{"s":"moka","x":"p3","t":"…어……? 뭐가 잘린 거예요?"},{"s":"neo","t":"그림자를 잘랐다."},{"s":"moka","t":"그림자를 어떻게 잘라요?"},{"s":"neo","t":"금은 형태를 정리하는 기운이다. 자를 것과 남길 것을 나눈다. 그러니 봉인도, 그림자도, 잘못 이어붙인 인연도 벨 수 있다."},{"s":"yeon","x":"base","t":"멋있는데 좀 무섭다."},{"s":"neo","t":"무서운 게 맞다."},{"s":"n","t":"네오가 앞발을 내렸다. 흰빛이 사그라들자, 그의 어깨가 눈에 띄게 내려갔다."},{"s":"yeon","x":"talk","t":"봐. 한 번에 저러잖아."},{"s":"neo","t":"그러니 다음은 너희 차례다."},{"s":"yeon","t":"…나?"},{"s":"neo","t":"乙木. 해봐라."},{"s":"n","bgm":"daily","t":"연이는 공터 한가운데에 섰다. 짧은 다리를 어깨너비로 벌리고, 앞발을 들었다."},{"s":"yeon","x":"talk","t":"어…… 어떻게 하는 건데?"},{"s":"neo","t":"숨을 들이켜라. 그리고 네 안의 乙을 찾아라."},{"s":"n","t":"연이는 눈을 감았다. 숨을 크게 들이켰다. 가슴 안쪽에서 乙이 반응했다. 아주 작게, 덩굴이 한 마디 뻗는 느낌."},{"s":"n","t":"그리고 거기서 멈췄다."},{"s":"n","t":"…아무 일도 일어나지 않았다."},{"s":"yeon","x":"base","t":"어라."},{"s":"n","t":"다시. 숨을 들이켜고, 뱉었다. 아무것도. 세 번째. 네 번째."},{"s":"n","t":"다섯 번째에 연이의 얼굴이 붉어졌다."},{"s":"moka","x":"p3","t":"저……. 힘내세요?"},{"s":"yeon","x":"talk","t":"그 응원 지금 제일 아파!"},{"s":"n","t":"연이는 앞발을 내리고 주저앉았다. 서가의 침묵이 유난히 크게 들렸다."},{"s":"yeon","t":"왜 안 되는 거야."},{"s":"n","t":"네오가 다가와 옆에 앉았다. 그리고 평소보다 훨씬 조용하게 말했다."},{"s":"neo","t":"제1칙을 다시 읽어라."},{"s":"yeon","t":"숨은 제 일간에서만 나온다……."},{"s":"neo","t":"그 앞에 숨은 조건이 있다. 제 일간을, 제가 알고 있어야 한다."},{"s":"yeon","t":"나 알아. 乙亥잖아. 되찾았잖아."},{"s":"neo","t":"글자는 되찾았지."},{"s":"n","t":"네오는 연이의 가슴께를 눈으로 가리켰다."},{"s":"neo","t":"하지만 너는 아직 그 글자를 읽지 못한다. 되찾은 것과 읽는 것은 다르다."},{"s":"yeon","t":"…무슨 소린지 모르겠어."},{"s":"neo","t":"乙이 무엇이냐고 물으면, 너는 뭐라고 답하지?"},{"s":"yeon","t":"음……. 나무? 덩굴?"},{"s":"neo","t":"그건 책의 답이다. 네 답이 아니야."},{"s":"n","t":"연이는 입을 다물었다. 반박할 말이 없었다."},{"s":"neo","t":"네 일간은 네가 어떤 사람인지에 대한 문장이다. 그 문장을 아직 네가 못 쓰고 있는 것뿐이다."},{"s":"yeon","t":"…그럼 언제 쓸 수 있는데."},{"s":"neo","t":"모른다."},{"s":"yeon","x":"talk","t":"야!"},{"s":"neo","t":"거짓말은 안 한다."},{"s":"n","t":"연이는 무릎에 얼굴을 묻었다. 처음으로, 이 세계에서 자기가 제일 쓸모없다는 생각이 들었다."},{"s":"moka","x":"moved","t":"저기……. 연이 님."},{"s":"yeon","t":"…왜."},{"s":"moka","t":"저도 백 년 동안 데뷔 못 했어요."},{"s":"yeon","t":"그 얘기 지금 하는 거 반칙 아니야?"},{"s":"moka","x":"p1","t":"근데 저 아직 안 접었잖아요."},{"s":"n","t":"연이가 고개를 들었다. 모카는 헤드폰을 목에 걸고, 노트를 꺼내 들고 있었다."},{"s":"moka","t":"저도 해볼래요. 제 일간, 뭐예요?"},{"s":"neo","t":"너는 병화(丙火)다. 큰불이지."},{"s":"moka","x":"p3","t":"불이요? 저 수달인데요?"},{"s":"yeon","x":"happy","t":"물에 사는 놈이 제일 뜨거웠네."},{"s":"moka","x":"p1","t":"그거 좋은데요. 가사로 쓸게요."},{"s":"neo","t":"집중해라."},{"s":"n","bgm":"neo2","t":"모카가 공터에 섰다. 눈을 감고, 숨을 들이켰다. 그리고 아무 일도 일어나지 않았다."},{"s":"moka","x":"p3","t":"어? 저도 안 되는데요."},{"s":"neo","t":"당연하다. 처음부터 되는 자는 없다."},{"s":"yeon","t":"방금 나한테는 왜 그렇게 안 말했어?"},{"s":"neo","t":"…실수했다."},{"s":"yeon","t":"또 사과했어."},{"s":"neo","t":"안 했다."},{"s":"n","t":"모카는 열 번을 시도했다. 스무 번을 시도했다. 서른 번째에 이르자 헤드폰을 벗어 던졌다."},{"s":"moka","x":"angry","t":"아, 진짜! 왜 안 되는데!"},{"s":"n","t":"모카의 목소리가 서가를 때렸다."},{"s":"moka","x":"angry","t":"백 년 기다렸어! 대기 줄만 섰어! 겨우 첫 줄 하나 썼는데! 나 이제 진짜 하고 싶은 거 생겼는데!"},{"s":"n","t":"모카가 주먹을 쥐었다. 노트가 구겨졌다."},{"s":"moka","x":"angry","t":"저 사람들 또 무너지는 거 보기 싫다고!"},{"s":"n","im":true,"fx":"fire","t":"팟."},{"s":"n","fx":"fire","t":"모카의 발밑에서 불이 붙었다."},{"s":"moka","skill":{"el":"fire","unit":"일의 박","name":"불씨","han":"火種"},"x":"p2","im":true,"fx":"fire","t":"화(火)의 호흡. 일의 박 — 불씨!"},{"s":"n","im":true,"fx":"fire","t":"주홍빛이 확 번졌다. 모카를 중심으로 원이 그려지고, 잔불이 서가 사이로 흩어졌다."},{"s":"moka","x":"p3","t":"…어? 어어어?!"},{"s":"neo","t":"멈춰라."},{"s":"moka","t":"어떻게요!"},{"s":"neo","t":"숨을 세라. 넷에 들이켜고 넷에 뱉어라."},{"s":"moka","x":"p3","t":"저 랩할 때 숨 안 세는데요!"},{"s":"yeon","x":"talk","t":"지금 세!"},{"s":"n","fx":"fire","t":"불이 서가 쪽으로 기울었다. 종이 냄새가 순식간에 마른 냄새로 바뀌었다."},{"s":"n","t":"기억이 꽂힌 책장이었다. 누군가의 하루가, 누군가의 첫사랑이, 누군가의 마지막 인사가 꽂혀 있는 책장."},{"s":"moka","x":"moved","t":"안 돼. 안 돼요, 저거 태우면 안 돼요!"},{"s":"n","t":"모카가 당황할수록 불이 커졌다. 화(火)는 마음을 그대로 받아 쓰는 기운이었다."},{"s":"neo","t":"연이."},{"s":"yeon","x":"talk","t":"어!"},{"s":"neo","t":"목생화(木生火)다. 나무는 불을 키우지만, 뿌리 없는 불은 나무가 붙잡는다."},{"s":"yeon","t":"그게 무슨 말이야!"},{"s":"neo","t":"가서 받쳐라. 지금."},{"s":"n","t":"연이는 생각할 틈이 없었다. 그냥 뛰었다. 짧은 다리로, 불 한가운데로."},{"s":"moka","x":"moved","t":"오지 마요! 뜨거워요!"},{"s":"yeon","x":"talk","t":"뜨거우면 네가 무섭겠지!"},{"s":"n","t":"연이가 모카의 손을 잡았다. 뜨거웠다. 정말 뜨거웠다. 그런데 놓고 싶지 않았다."},{"s":"yeon","x":"talk","t":"모카. 너 지금 뭐가 제일 무서워?"},{"s":"moka","x":"moved","t":"…이거 못 멈춰서, 다 태워버릴까 봐요."},{"s":"yeon","t":"그럼 그거 붙잡을게. 내가."},{"s":"n","t":"그 순간이었다."},{"s":"n","t":"연이의 가슴 안에서 乙이 움직였다. 아까처럼 한 마디가 아니었다. 이번엔 손끝까지 흘러 내려왔다."},{"s":"n","t":"연이는 그제야 알았다. 자기 일간이 무엇인지."},{"s":"yeon","t":"…아."},{"s":"n","t":"덩굴은 혼자 서는 나무가 아니다. 덩굴은 반드시 무언가를 붙잡아야 자라는 나무다."},{"s":"n","t":"혼자서는 한 뼘도 못 서면서, 붙잡을 것만 있으면 담벼락도 넘는 나무."},{"s":"yeon","t":"나, 혼자서는 아무것도 못 하는 애였어."},{"s":"n","t":"연이는 웃었다. 처음으로, 그게 부끄럽지 않았다."},{"s":"yeon","x":"talk","t":"근데 붙잡을 게 있으면 되게 멀리 가."},{"s":"n","im":true,"fx":"wood","t":"연이가 숨을 들이켰다. 넷에 들이키고, 넷에 뱉었다."},{"s":"yeon","skill":{"el":"wood","unit":"일의 결","name":"움","han":"萌"},"x":"talk","im":true,"fx":"wood","t":"목(木)의 호흡. 일의 결 — 움."},{"s":"n","im":true,"fx":"wood","t":"청록빛 덩굴이 연이의 앞발에서 뻗어 나왔다. 서가를 향하던 불길을 감아 올리고, 다시 모카의 발밑으로 끌어내렸다."},{"s":"n","fx":"fuse","t":"불은 꺼지지 않았다. 대신 모여들었다."},{"s":"n","im":true,"fx":"fuse","t":"덩굴이 감은 자리마다 불이 더 밝아졌다. 흩어지던 잔불이 하나의 심지로 모이며, 주홍과 청록이 서로를 밀어내지 않고 겹쳤다."},{"s":"sys","im":true,"t":"[합기 성립] · 木生火 — 목이 화를 살린다."},{"s":"moka","x":"p1","t":"…뜨거운데, 안 무서워요."},{"s":"yeon","x":"happy","t":"그치? 나도."},{"s":"n","t":"불길이 천천히 잦아들었다. 모카의 발밑에 손바닥만 한 불씨 하나만 남아, 조용히 타올랐다."},{"s":"moka","x":"moved","t":"…이거, 제 거예요?"},{"s":"neo","t":"그렇다. 크기가 아니라 남아 있는 게 중요하다."},{"s":"n","t":"모카는 그 작은 불을 한참 들여다봤다. 그리고 노트에 뭔가를 적었다. 이번엔 첫 줄이 아니라 두 번째 줄이었다."},{"s":"yeon","x":"happy","c":{"who":"neo"},"t":"야, 네오. 나 했어. 봤지?"},{"s":"neo","t":"봤다."},{"s":"yeon","t":"칭찬해."},{"s":"neo","t":"…나쁘지 않았다."},{"s":"yeon","x":"happy","t":"그거 너 최고 칭찬이지."},{"s":"neo","t":"해석이 빠르군."},{"s":"n","t":"연이는 신이 나서 덩굴을 한 번 더 뻗어봤다. 이번엔 서가 기둥을 감았다."},{"s":"yeon","x":"talk","t":"봐봐. 이거 잡고 올라가면 위층도 갈 수 있겠는데?"},{"s":"neo","t":"기둥은 놓아라. 오래된 서가다."},{"s":"yeon","t":"조금만."},{"s":"n","bgm":"gloom2","t":"그때, 서가 위쪽에서 뭔가가 무너지는 소리가 났다."},{"s":"n","t":"연이가 감은 기둥이 아니었다. 훨씬 위, 안개에 잠긴 층에서였다."},{"s":"n","im":true,"t":"오래된 책장 하나가 통째로 기울었다. 그리고 연이의 머리 위로 떨어졌다."},{"s":"moka","x":"angry","t":"연이 님!"},{"s":"n","t":"연이는 올려다봤다. 몸이 굳었다. 덩굴을 뻗을 생각도 나지 않았다."},{"s":"n","t":"네오가 움직였다. 생각보다 몸이 먼저 나간 얼굴이었다."},{"s":"n","im":true,"fx":"metal","t":"흰빛이 번졌다. 떨어지던 책장이 공중에서 두 조각으로 갈라져, 연이의 양옆으로 비껴 떨어졌다."},{"s":"n","t":"연이는 무사했다."},{"s":"n","t":"…거의."},{"s":"n","im":true,"fx":"metal","t":"연이의 앞발 위, 방금 뻗어 있던 청록빛 덩굴이 함께 잘려 있었다."},{"s":"n","t":"그리고 그 아래 앞발에, 가느다란 선 하나가 그어져 있었다. 피가 배어 나왔다."},{"s":"yeon","x":"base","t":"…어."},{"s":"n","t":"아프지는 않았다. 너무 정확하게 잘려서, 아픔이 늦게 왔다."},{"s":"moka","x":"moved","t":"연이 님! 피, 피 나요!"},{"s":"n","t":"네오가 그 자리에 그대로 멈춰 서 있었다."},{"s":"n","t":"연이는 네오를 봤다. 그리고 처음 보는 얼굴을 봤다."},{"s":"n","im":true,"t":"네오는 겁에 질려 있었다."},{"s":"yeon","x":"talk","t":"…네오?"},{"s":"n","t":"대답이 없었다."},{"s":"yeon","t":"야, 나 괜찮아. 이거 긁힌 거야. 진짜."},{"s":"neo","t":"…금극목(金克木)."},{"s":"yeon","t":"뭐?"},{"s":"neo","t":"금은 나무를 벤다."},{"s":"n","t":"네오의 목소리가 아주 낮았다. 스스로에게 하는 말 같았다."},{"s":"neo","t":"제2칙이다. 상생은 살리고, 상극은 벤다. 내가 형을 뽑는 자리에 네가 있으면……."},{"s":"n","t":"그는 말을 끝맺지 못했다."},{"s":"yeon","t":"…내가 베인다고?"},{"s":"neo","t":"그렇다."},{"s":"n","t":"서가가 조용했다. 이 섬은 소리를 삼키는 섬인데, 이번 침묵은 섬 탓이 아니었다."},{"s":"yeon","x":"base","t":"근데 너 방금 나 살렸잖아."},{"s":"neo","t":"살리려고 벴다."},{"s":"yeon","t":"…"},{"s":"neo","t":"앞으로도 그럴 거다. 그게 제일 문제다."},{"s":"n","t":"연이는 뭐라고 말해야 할지 몰랐다."},{"s":"n","t":"이 세계에 온 뒤로 네오는 늘 답을 알고 있었다. 답을 모를 때조차, 모른다고 단단하게 말했다."},{"s":"n","t":"그런데 지금은 아니었다. 지금 네오는 자기 발톱을 내려다보고 있었다. 방금 처음 본 물건처럼."},{"s":"moka","x":"moved","t":"…네오님."},{"s":"neo","t":"거리를 둬라. 내가 형을 뽑을 때는, 반드시."},{"s":"yeon","x":"talk","t":"싫어."},{"s":"neo","t":"연이."},{"s":"yeon","t":"싫다고. 나 덩굴이야."},{"s":"n","t":"연이는 피가 배어 나온 앞발을 들어 보였다."},{"s":"yeon","t":"덩굴은 붙잡아야 자라. 떨어져 있으면 그냥 바닥에 눕는 풀이야."},{"s":"neo","t":"…
