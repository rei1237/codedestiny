그러다 잘린다."},{"s":"yeon","x":"talk","t":"잘리면 또 자라. 그거 나무의 특기야."},{"s":"n","t":"네오는 오랫동안 연이를 바라봤다. 무슨 말을 하려다가, 삼켰다."},{"s":"n","t":"연이는 그가 삼킨 말이 궁금했다. 하지만 묻지 않았다. 지금은 아니었다."},{"s":"n","bgm":"crisis","t":"그때, 발밑이 젖었다."},{"s":"yeon","x":"base","t":"…어?"},{"s":"n","t":"서고 바닥에 물이 고여 있었다. 언제부터인지 알 수 없었다. 소리가 나지 않는 섬이라, 물이 차오르는 소리도 들리지 않았던 것이다."},{"s":"n","fx":"water","t":"검은 물이었다."},{"s":"neo","im":true,"t":"물러서라. 전부."},{"s":"n","bg":"siksangCrisis","tone":"dark","fx":"water","t":"검은 물이 서가를 타고 올랐다. 물이 닿은 책장부터 글자가 지워졌다. 기억이 번지고, 풀리고, 사라졌다."},{"s":"n","t":"울고 있던 기억도, 웃고 있던 기억도 똑같이 회색이 되었다."},{"s":"moka","x":"angry","t":"저거 뭐예요!"},{"s":"neo","t":"수(水)의 호흡이다."},{"s":"yeon","x":"talk","t":"저것도 호흡이야?"},{"s":"neo","t":"오행은 다섯이다. 우리 쪽에만 있을 리가 없지."},{"s":"sys","im":true,"t":"[水息 · 침식] · 스민다. 삼킨다. 지운다."},{"s":"n","t":"검은 물속에서 형체가 일어섰다. 사람도 짐승도 아니었다. 물이 사람 모양을 흉내 낸 것에 가까웠다."},{"s":"n","t":"그것은 얼굴이 있어야 할 자리에 아무것도 없었다. 다만, 아주 오래 젖어 있던 것 같은 인상이었다."},{"s":"neo","t":"연이. 모카. 저건 베어도 다시 이어진다."},{"s":"yeon","t":"그럼 어떡해!"},{"s":"neo","t":"물은 금을 무디게 하고, 불을 끄고, 나무를 키운다. 저건 우리 셋을 전부 알고 온 거다."},{"s":"moka","x":"p3","t":"그건 진짜 최악인데요!"},{"s":"n","fx":"water","t":"검은 물이 밀려왔다. 모카가 반사적으로 불을 붙였다."},{"s":"n","im":true,"fx":"water","t":"치익. 불이 꺼졌다. 수극화(水克火). 모카가 뒤로 밀려났다."},{"s":"moka","x":"moved","t":"으악!"},{"s":"n","fx":"metal","t":"네오가 그었다. 물이 두 조각 났다가, 곧바로 다시 붙었다."},{"s":"neo","t":"…역시."},{"s":"n","t":"네오의 숨이 짧아졌다. 세 번째 형은 없을 것 같았다."},{"s":"n","t":"연이는 생각했다. 아주 빠르게."},{"s":"n","t":"물은 금을 무디게 하고, 불을 끄고, 나무를 키운다."},{"s":"yeon","x":"talk","im":true,"t":"…나무를 키운다고?"},{"s":"n","t":"연이가 앞으로 나섰다."},{"s":"neo","t":"연이! 물러서라!"},{"s":"yeon","x":"talk","t":"수생목(水生木)이잖아! 저거 나한테는 밥이야!"},{"s":"neo","t":"…뭐?"},{"s":"yeon","x":"talk","im":true,"fx":"wood","t":"목의 호흡. 일의 결 — 움!"},{"s":"n","im":true,"fx":"wood","t":"연이가 검은 물 한가운데로 덩굴을 뻗었다. 물을 베는 게 아니라, 마시는 방식이었다."},{"s":"n","fx":"wood","t":"덩굴이 검은 물을 빨아들이며 굵어졌다. 청록빛이 점점 짙어지고, 물의 형체가 조금씩 줄어들었다."},{"s":"n","t":"하지만 검은 물은 기억을 지우는 물이었다."},{"s":"n","im":true,"tone":"dark","t":"연이의 눈앞이 흐려졌다. 모카의 이름이 잠깐 떠오르지 않았다."},{"s":"yeon","x":"base","t":"…어? 어……. 너 이름이……."},{"s":"moka","x":"angry","t":"모카요! 모카! 백 년째 무명인 그 모카요!"},{"s":"yeon","t":"아, 맞다. 미안."},{"s":"neo","t":"연이! 그건 마시면 안 되는 물이다!"},{"s":"yeon","x":"talk","t":"근데 이거 놓으면 서고 다 지워져!"},{"s":"n","t":"연이의 덩굴이 떨렸다. 감당할 수 있는 양을 넘고 있었다."},{"s":"n","t":"그때 모카가 앞으로 뛰었다."},{"s":"moka","x":"p1","t":"연이 님! 아까 뭐라 그랬어요!"},{"s":"yeon","t":"뭐!"},{"s":"moka","x":"p2","t":"붙잡을 게 있으면 멀리 간다면서요!"},{"s":"n","t":"모카가 연이의 등에 손을 얹었다."},{"s":"moka","skill":{"el":"fire","unit":"일의 박","name":"불씨","han":"火種"},"x":"p2","im":true,"fx":"fire","t":"화의 호흡. 일의 박 — 불씨!"},{"s":"n","im":true,"fx":"fuse","t":"모카의 불이 연이의 덩굴을 타고 올랐다. 젖은 덩굴은 타지 않았다. 대신 뜨거워졌다."},{"s":"n","fx":"fuse","t":"덩굴이 빨아들인 검은 물이, 덩굴 안에서 끓기 시작했다."},{"s":"sys","im":true,"t":"[합기] · 木生火 — 물을 머금은 나무를 불이 끓인다."},{"s":"n","im":true,"fx":"fire","t":"검은 물이 김이 되어 빠져나갔다. 지워졌던 글자들이 김 속에서 잠깐씩 다시 보였다."},{"s":"n","t":"물의 형체가 반쯤 줄어들었다. 그것이 처음으로 움직임을 멈췄다."},{"s":"neo","t":"…지금이다."},{"s":"n","t":"네오가 숨을 들이켰다. 아주 길게. 연이는 그 소리를 듣고 바로 알았다. 마지막 숨이었다."},{"s":"yeon","x":"talk","t":"네오, 하지 마! 너 숨 없잖아!"},{"s":"neo","t":"연이. 뒤로."},{"s":"yeon","t":"싫다고 했잖아!"},{"s":"neo","t":"…그럼 붙잡아라."},{"s":"yeon","x":"base","t":"…어?"},{"s":"neo","t":"덩굴은 붙잡아야 자란다며. 나도 그렇다."},{"s":"n","t":"연이의 심장이 한 박자 크게 뛰었다."},{"s":"n","fx":"wood","t":"연이는 덩굴을 뻗어 네오의 앞다리를 감았다. 꽉."},{"s":"n","t":"이번엔 잘리지 않았다. 네오가 그 방향을 피해 몸을 틀었기 때문이다."},{"s":"neo","skill":{"el":"metal","unit":"일의 형","name":"단금","han":"斷金"},"im":true,"fx":"metal","t":"금의 호흡. 일의 형 — 단금."},{"s":"n","bg":"siksangBattle","bgm":"crisis2","im":true,"fx":"metal","t":"흰빛이 끓어오른 물의 형체를 세로로 갈랐다. 이번엔 다시 붙지 않았다. 끓어서 이을 물이 남아 있지 않았다."},{"s":"n","im":true,"fx":"burst","t":"검은 물이 무너져 내렸다. 바닥으로 흩어지며, 서가 아래로 조용히 빠져나갔다."},{"s":"n","t":"물이 빠진 자리마다 지워졌던 글자들이 천천히 돌아왔다. 전부는 아니었다. 하지만 대부분이었다."},{"s":"sys","im":true,"t":"[水息 · 침식 격퇴] · [기억 서고 일부 손실]"},{"s":"n","bgm":"stillLake","t":"네오가 주저앉았다. 이번엔 숨기지도 않았다."},{"s":"yeon","x":"talk","c":{"who":"neo"},"t":"네오!"},{"s":"n","t":
