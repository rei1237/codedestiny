"t":"음식 냄새와 음악, 장난과 박수가 섬 전체를 가득 채웠다."},{"s":"n","t":"이 섬은 자신을 밖으로 꺼내는 섬이었다. 좋으면 좋다고 말하고, 틀리면 틀린 대로 다시 해보는 섬."},{"s":"yeon","t":"(앞서 뛰는 작은 사자의 등을 보며) 네오 정체는… 나중에 꼭 다시 물어봐야지."},{"s":"n","t":"아직 위기는 없었다. 아직은. 지금 이 순간만큼은, 정말로 축제였다."},{"s":"sys","im":true,"t":"식신·상관의 섬 · 동료 모카 합류. 다음 무대: DEST1NOVA 전야제."}]});
EPISODES.push({"no":"EP.08","tag":"제8화 · 노바 전야제","title":"노바 전야제","beats":[{"s":"n","bg":"siksangNight","bgm":"daily","l":{"who":"yeon"},"c":{"who":"moka","x":"p1"},"r":{"who":"neo"},"t":"모카는 달렸다. 정확히는 달리는 척하면서, 세 걸음마다 뒤를 돌아봤다."},{"s":"moka","x":"p1","t":"빨리요! 늦으면 사전 이벤트 다 끝난다니까요!"},{"s":"n","t":"연이는 짧은 다리로 열심히 따라갔다. 통딩. 통딩. 통딩. 식신·상관의 섬 바닥은 밟을 때마다 리듬이 튀었다."},{"s":"yeon","x":"talk","t":"네오. 나 지금 진지하게 뛰는 중인데, 발소리가 너무 귀여워."},{"s":"n","t":"네오는 뛰지도 않으면서 옆에서 연이를 따라잡고 있었다."},{"s":"neo","t":"네 몸과 섬의 기운이 잘 어울린다는 뜻이다."},{"s":"yeon","t":"그 말 은근 기분 나빠. 나는 긴박하고 싶은데 바닥이 자꾸 통딩거리잖아."},{"s":"moka","x":"happy","t":"괜찮아요! 식신·상관의 섬에서는 귀여운 것도 엄연한 장르예요!"},{"s":"yeon","t":"그거 위로야 추가 공격이야. 경계가 애매하네."},{"s":"n","t":"그렇게 커브 하나를 돌자마자, 노바 스테이지 전야제가 눈앞에 확 펼쳐졌다. 연이는 걸음을 멈췄다. 발밑의 통딩 소리마저 멎었다."},{"s":"yeon","t":"와."},{"s":"n","t":"노바 스테이지는 거대한 원형 광장이었다. 단순한 공연장이 아니라, 광장 전체가 하나의 축제로 숨 쉬고 있었다."},{"s":"n","t":"하늘엔 별 모양 조명이 떠 있었고, 그 사이로 색색의 천이 파도처럼 넘실댔다. 공중엔 작은 무대들이 떠다니며 춤과 냄비 박자를 쏟아냈다."},{"s":"n","t":"그리고 무엇보다, 냄새가 엄청났다. 달콤한 크림빵, 끓는 매콤 소스, 버터 녹은 옥수수, 반짝이며 굳는 과일 시럽, 그리고 어디선가 풍겨오는 따뜻한 수프."},{"s":"n","t":"연이는 앞발을 배에 얹었다."},{"s":"yeon","x":"talk","t":"여기 진짜 위험하다."},{"s":"n","t":"네오가 곧장 몸을 낮추고 자세를 잡았다."},{"s":"neo","t":"위험한 기운이 느껴지나."},{"s":"yeon","t":"아니. 다 먹고 싶어."},{"s":"n","t":"네오는 잡았던 자세를 조용히 풀고 도로 일어섰다."},{"s":"neo","t":"그런 위험인가."},{"s":"moka","x":"p2","t":"이게 바로 노바 스테이지 전야제예요! DEST1NOVA 본공연 전에 열리는, 식신·상관의 섬 최대 축제!"},{"s":"yeon","t":"공연 하나 앞두고 이렇게까지 해?"},{"s":"moka","x":"happy","t":"당연하죠! DEST1NOVA는 그냥 노래만 하는 그룹이 아니에요. 먹는 즐거움, 말하는 용기, 노래하는 마음, 춤추는 몸, 그 전부를 깨우는 그룹이라고요!"},{"s":"yeon","t":"팬심이 너무 강해서 해설이 살짝 종교 같아졌어."},{"s":"neo","t":"섬 중심부라 그런지 식상 기운이 가장 진하다. 표현 에너지가 순환하는 구조지."},{"s":"yeon","t":"그러니까 많이 먹고 많이 떠들고 많이 놀면 된다는 거지? 내 번역이 더 쉽네."},{"s":"n","t":"그때 모카가 연이 앞에 작은 종이 팔찌를 쓱 내밀었다."},{"s":"moka","x":"p1","t":"이거 차세요. 전야제 체험 팔찌요. 이걸 차면 네 개 멤버 구역을 다 돌 수 있어요."},{"s":"n","t":"연이는 앞발엔 손목이 없어 그냥 발목에 걸쳤다. 팔찌엔 네 칸이 있었다. 늑대. 판다. 토끼. 흑표범."},{"s":"moka","t":"SOLV 존, BAMBI 존, LUNE 존, RAVEN 존. 처음 온 팬들을 위한 입덕 코스죠."},{"s":"yeon","t":"입덕 코스까지 있어? 팬덤 운영 진짜 탄탄하네."},{"s":"moka","t":"참고로 DEST1NOVA 팬덤 이름은 OUR CODE예요. 운명 코드 속에서 함께 빛난다는 뜻이죠."},{"s":"n","t":"연이는 잠시 그 말을 곱씹었다."},{"s":"yeon","t":"어라. 좀 멋있는데?"},{"s":"moka","x":"p2","t":"그렇죠!"},{"s":"neo","t":"먼저 섬 중심 구조를 파악하는 편이 좋다."},{"s":"yeon","t":"그래. 멤버 구역 돌면서 파악하자."},{"s":"neo","t":"그건 덕질이다."},{"s":"yeon","t":"현장 조사야."},{"s":"moka","x":"p1","t":"덕질은 최고의 현장 조사입니다."},{"s":"n","t":"연이가 앞발로 모카를 가리켰다. 봐, 전문가가 그렇대. 네오는 포기한 듯 짧게 한숨을 쉬었다."},{"s":"sys","t":"[ 전야제 체험 팔찌 획득 ]\n[ 네 멤버 구역을 돌아 입덕 코스를 완성하라. ]"},{"s":"n","bg":"siksangA","c":{"who":"moka","x":"base"},"t":"첫 번째는 SOLV 존. 입구엔 은빛 늑대의 거대한 깃발이 걸려 있었고, 그 아래 이런 문장이 새겨져 있었다."},{"s":"sys","t":"[ 말은 칼이 될 수도 있고, 길이 될 수도 있다. ]"},{"s":"yeon","x":"talk","t":"오. 래퍼답네."},{"s":"n","t":"온통 어두운 은색과 검정. 바닥엔 랩 가사 같은 문장들이 빛줄기로 흘렀다. 방문객들이 자기만의 한 줄을 적으면, 그 문장이 은빛 늑대 그림자로 변해 짧게 울렸다."},{"s":"moka","t":"여긴 마음을 좀 정갈하게 하고 들어가야 해요."},{"s":"yeon","t":"나 아직 빵 봉투 들고 있는데, 이 상태로 들어가도 돼?"},{"s":"moka","x":"happy","t":"괜찮아요. SOLV 형도 야식 좋아한다는 소문 있어요."},{"s":"yeon","t":"갑자기 인간미 확 생기네."},{"s":"n","t":"부스 한가운데선 한 줄 랩 챌린지가 열리고 있었다. 다람쥐가 외쳤다. '오늘도 늦잠 잤지만, 그래도 출근은 했다!' 둥. 박수."},{"s":"n","t":"고슴도치가 이었다. '가시는 많아도 마음은 말랑합니다!' 둥. 더 큰 박수."},{"s":"yeon","x":"happy","t":"여기 뭐야, 되게 귀엽다."},{"s":"n","t":"모카가 조심스럽게 마이크 앞에 섰다. 손엔 낡은 가사 노트가 들려 있었다. 그가 숨을 들이켰다."},{"s":"moka","t":"나는 모카."},{"s":"n","t":"둥."},{"s":"moka","t":"아직 무명. 하지만 오늘도 줄 서는 중."},{"s":"n","t":"둥."},{"s":"moka","x":"p2","t":"언젠가 무대 앞이 아니라, 위로 가는 중."},{"s":"n","t":"마이크가 잠깐 조용해졌다. 그리고 은빛 늑대 그림자가 모카 뒤로 스윽 솟아올랐다."},{"s":"sys","im":true,"t":"[ 가능성 있음 ]"},{"s":"moka","x":"moved","t":"가, 가능성 있음?"},{"s":"yeon","x":"happy","t":"오! 시스템이 인정했네!"},{"s":"moka","x":"moved","t":"저 이거 평생 기억할래요."},{"s":"neo","t":"아직 가능성이다. 완성은 아니다."},{"s":"yeon","t":"오늘만큼은 입 좀 닫아."},{"s":"n","t":"네오는 순순히 입을 다물었다. 그때 SOLV 존 안쪽에서 낮은 목소리가 흘러나왔다. '가능성은 적어두고 끝내는 게 아니라, 다음 줄로 증명하는 거지.'"},{"s":"n","t":"모카가 그대로 굳었다. 연이가 고개를 돌리자, 은빛 늑대가 서 있었다. SOLV. 검은 재킷, 은빛으로 흐르는 목털, 목엔 마이크 모양 펜던트. 포스터보다 실물이 훨씬 셌다."},{"s":"yeon","x":"talk","t":"야. 네 최애 왔다."},{"s":"moka","x":"moved","t":"소, 소, 소……."},{"s":"n","t":"SOLV가 모카의 노트를 힐끗 봤다. '많이 썼군. 손때가 많다. 버리지 않았다는 뜻이지.'"},{"s":"n","t":"모카의 눈에서 결국 눈물이 툭 떨어졌다.","fx":"heart"},{"s":"moka","x":"moved","t":"감사합니다……."},{"s":"n","t":"SOLV의 시선이 연이에게 옮겨오더니 잠깐 멈칫했다. '꽃돼지.'"},{"s":"yeon","x":"talk","t":"여기도?"},{"s":"n","t":"'실례. 특이한 리듬이 있어서 봤다. 걸음에 박자가 있다.'"},{"s":"yeon","t":"이거 그냥 바닥이 지 마음대로 통딩거리는 건데."},{"s":"n","t":"SOLV의 입가가 아주 살짝 올라갔다. '그래도 네 박자다.' 그 말은 이상하게, 기분 나쁘지 않았다."},{"s":"n","t":"SOLV는 더 말하지 않고 은빛 문장들 속으로 사라졌다. 모카가 허공에 손을 뻗었다."},{"s":"moka","x":"moved","t":"가셨다……."},{"s":"yeon","t":"야. 살아 있어?"},{"s":"moka","t":"아마요."},{"s":"n","bgm":"room","bg":"siksangB","r":null,"c":{"who":"moka","x":"base"},"t":"SOLV 존을 나온 두 사람은 은빛 골목 끝, 조명이 낮게 깔린 벤치에 잠깐 걸터앉았다. 네오는 먹거리 구경을 핑계로 저만치 떨어졌다."},{"s":"n","t":"모카는 아직 젖은 노트를 앞발로 소중히 문질러 말리고 있었다. 페이지마다 지운 자국이 덧칠처럼 쌓여 있었다."},{"s":"yeon","t":"너 아까 그 노트. 얼마나 쓴 거야?"},{"s":"moka","t":"세는 걸 포기한 지 오래됐어요. 저 사실, 무대에 처음 선 날 완전 망했거든요."},{"s":"yeon","t":"망했어?"},{"s":"moka","t":"가사를 통째로 까먹었어요. 앞줄에서 누가 웃었고, 그 소리가 마이크로 들어와서 스피커로 나왔어요."},{"s":"n","t":"모카는 그때가 다시 보이는 듯 잠깐 눈을 감았다."},{"s":"moka","t":"그다음부터 사람들이 그러더라고요. 넌 무대 앞에서 응원봉 흔드는 게 어울린다고. 위는 아니라고."},{"s":"n","t":"연이는 아무 말 없이 다음 말을 기다렸다. 벤치 조명이 모카의 젖은 눈가에 얇게 걸렸다."},{"s":"moka","x":"base","t":"그래서 노트를 샀어요. 까먹지 않으려고. 근데 쓰다 보니까, 안 까먹으려고 쓰는 게 아니라 하고 싶은 말이 자꾸 생겨서 쓰게 되더라고요."},{"s":"yeon","t":"……그래서 아직도 줄 서는 중이구나."},{"s":"moka","x":"moved","t":"네. 무대 앞에 줄 서면서, 언젠가는 저 위에 선다고. 매일 스스로한테 라임 맞춰요."},{"s":"n","t":"연이는 문득 자기 앞발을 봤다. 사람이었을 땐 걸크러시 소리 듣고 싶어서, 정작 하고 싶은 말은 매번 삼켰던 게 떠올랐다."},{"s":"yeon","x":"talk","t":"나는 반대였어. 하고 싶은 말이 있어도, 멋없어 보일까 봐 자꾸 삼켰거든. 근데 너 보니까 알겠다. 삼킨 말은 라임이 안 붙어. 뱉어야 훅이 되는 거였어."},{"s":"n","t":"모카가 눈물을 훔치다 말고 픽 웃었다.","fx":"heart"},{"s":"moka","x":"moved","t":"그거 방금 좀 SOLV 형 같았어요."},{"s":"yeon","t":"어? 나 방금 입덕 성공한 사람 앞에서 랩 훔친 거야?"},{"s":"moka","x":"happy","t":"샘플링이라고 해두죠."},{"s":"n","t":"두 사람은 동시에 웃었다. 웃음이 벤치 조명 아래에서 통딩, 하고 튀는 것 같았다."},{"s":"yeon","x":"happy","t":"모카. 네가 위로 올라가는 날, 나 맨 앞줄에서 응원봉 부러지게 흔들어줄게."},{"s":"n","t":"모카가 노트를 가슴에 꽉 끌어안았다.","fx":"heart"},{"s":"moka","x":"moved","t":"그거…… 노트에 적어도 돼요?"},{"s":"yeon","t":"적어. 대신 라임 맞춰서."},{"s":"n","t":"모카는 그 자리에서 연필을 꺼내 무언가를 적었다. 지운 자국투성이 페이지 위에, 이번엔 지우지 않을 한 줄이 생겼다."},{"s":"n","t":"멀리서 네오가 옥수수를 하나 들고 돌아왔다. '…무슨 일이지.'"},{"s":"yeon","t":"우정 결성."},{"s":"neo","t":"그런 것도 결성하나."},{"s":"moka","x":"happy","t":"방금 했습니다."},{"s":"n","bg":"siksangC","bgm":"stillLake","r":{"who":"neo"},"c":{"who":"moka","x":"base"},"t":"두 번째는 BAMBI 존. SOLV 존이 날카롭고 어두운 리듬의 공간이었다면, 이곳은 완전히 달랐다. 따뜻하고 둥글었다. 크림색 천이 하늘에 걸리고, 곳곳에서 작은 수프 냄비가 김을 올렸다."},{"s":"sys","t":"[ 노래는 배고픈 마음을 데우는 수프 같은 것. ]"},{"s":"yeon","x":"talk","t":"여긴 들어오자마자 위로받는 느낌이네."},{"s":"moka","t":"BAMBI 님은 메인 보컬이에요. 듣고 있으면 내가 조금 괜찮은 존재가 된 것 같아요."},{"s":"n","t":"BAMBI 존엔 마음 수프 부스가 있었다. 오늘의 기분을 말하면 그에 맞는 수프를 내주는 곳. 연이는 호기심에 줄을 섰다. 판다 직원이 물었다. '오늘의 기분은?'"},{"s":"yeon","t":"배고팠다가, 맛있어서 행복했다가, 갑자기 내가 왜 돼지인지 생각나서 좀 복잡해졌고, 방금 래퍼 늑대한테 박자 칭찬 들어서 애매하게 좋아졌어요."},{"s":"n","t":"직원은 침착하게 고개를 끄덕였다. '복합 감정이군요.'"},{"s":"yeon","t":"그걸 한 단어로요?"},{"s":"n","t":"직원이 작은 그릇을 내밀었다. '달빛 감자 수프입니다. 복잡하지만 따뜻한 분께 드립니다.'"},{"s":"n","t":"연이는 한 입 떠먹었다. 부드러운 감자 맛과 은은한 허브 향이 퍼지자, 마음속에 엉켜 있던 실이 한 매듭 스르르 풀렸다."},{"s":"yeon","x":"happy","t":"와."},{"s":"neo","t":"어떤가."},{"s":"yeon","t":"말하기 싫어. 혼자 느낄래. …응, 조금 감동."},{"s":"n","t":"그때 곁에서 부드러운 목소리가 들렸다. '감동은 천천히 먹어야 오래가요.' 하얀 판다가 웃고 있었다. BAMBI. 둥근 인상에 푸른 리본, 무대 위 사람다운 묘한 힘이 있는 눈빛."},{"s":"moka","x":"moved","t":"BAMBI 님……."},{"s":"n","t":"BAMBI가 웃었다. '아, SOLV 존에서 가능성 받은 그 친구죠? 노바 스테이지 소식은 빨라요.'"},{"s":"moka","t":"소문이…… 벌써……?"},{"s":"n","t":"'계속 써요. 목소리는 쓰다 보면 자기 온도를 찾아요.'"},{"s":"moka","x":"happy","t":"네!"},{"s":"n","t":"BAMBI의 시선이 연이에게 닿았다. '그리고 당신은. 먹을 때 표정이 아주 솔직하네요.'"},{"s":"yeon","t":"그게 칭찬인가요?"},{"s":"n","t":"'최고의 칭찬이에요. 맛있다고 느끼는 마음은, 좋은 노래의 시작이거든요.'"},{"s":"n","t":"연이는 수프 그릇을 내려다봤다. 식신. 먹고, 느끼고, 나누는 힘. BAMBI의 목소리가 그걸 그대로 품고 있는 것 같았다."},{"s":"n","bg":"siksangD","bgm":"daily","t":"세 번째는 LUNE 존. 멀리서부터 기타 소리가 들렸다. 딩. 딩딩. 딩. 천막들은 저마다 다른 방향으로 기울었고 조명도 제멋대로 반짝였다. 바닥엔 누군가 낙서한 코드들이 가득했다."},{"s":"sys","t":"[ 틀린 코드? 다음 박자에 살리면 돼. ]"},{"s":"yeon","x":"happy","t":"이거 좋은데."},{"s":"moka","x":"base","t":"LUNE 님은 실수를 무대로 바꾸는 천재예요."},{"s":"n","t":"LUNE 존에선 망한 멜로디 살리기 이벤트가 한창이었다. 돼지 아이가 삐익 소리치자, 기타와 드럼이 곧장 그걸 경쾌한 후렴으로 받아쳤다."},{"s":"yeon","x":"happy","t":"이거 재밌겠다."},{"s":"neo","t":"하지 마라. 네가 할 것 같아서."},{"s":"yeon","t":"정확하네."},{"s":"n","t":"연이는 결국 무대 위로 올라갔다. 마이크 앞에 서자 관객 몇이 기대 어린 눈으로 봤다. 연이는 잠깐 망설이다가 외쳤다."},{"s":"yeon","x":"talk","t":"꿀!"},{"s":"n","t":"정적. 그리고 기타가 바로 치고 들어왔다. 딩! 드럼이 받았다. 쿵짝. 신시사이저가 꿀 소리를 귀엽게 비틀었다. 꿀, 꿀, 꿀, 꿀딩!"},{"s":"n","t":"관객들이 폭소했다. 연이는 얼굴이 홍당무가 됐다."},{"s":"yeon","t":"아니, 이걸 살리네?"},{"s":"n","t":"그때 기타를 멘 토끼가 무대 위로 폴짝 뛰어올랐다. 긴 귀, 별 모양 피어싱, 장난기 가득한 눈. LUNE이었다. '좋은 소스였어! 귀엽고 짧고 기억에 남아.'"},{"s":"yeon","t":"내 흑역사를 샘플링하지 마."},{"s":"n","t":"LUNE이 기타를 튕기며 웃었다. '흑역사도 리듬 타면 훅이 돼.'"},{"s":"yeon","t":"그 말 좀 위험하게 설득력 있다."},{"s":"n","t":"LUNE이 네오를 발견하곤 눈을 반짝였다. '오. 작은 사자 친구도 해볼래?'"},{"s":"neo","t":"안 한다."},{"s":"yeon","x":"happy","t":"해봐. 가디언 샘플링."},{"s":"neo","t":"말도 안 되는 표현이다."},{"s":"n","t":"LUNE이 기타를 번쩍 들었다. '자, 포효 한 번!' 네오는 눈을 감고 참는 듯하더니, 아주 낮게 읊었다."},{"s":"neo","t":"나는 사주의 강을 지키는 가디언이다."},{"s":"n","t":"LUNE이 그 말을 듣자마자 기타를 후려쳤다. 딩딩딩! 신시사이저가 네오의 낮은 목소리를 리듬으로 바꿨다. 가-디-언, 가-디-언, 사주의 강 가-디-언!"},{"s":"n","t":"관객들이 환호했다. 네오의 얼굴이 굳었고, 연이는 배를 잡고 웃었다."},{"s":"yeon","x":"happy","t":"네오 테마곡 생겼어!"},{"s":"neo","t":"지워라."},{"s":"n","t":"LUNE이 씩 웃었다. '좋은데? 나중에 무대에서 써도 돼?'"},{"s":"neo","t":"절대 안 된다."},{"s":"n","t":"'생각해볼게!' 네오가 낮게 덧붙였다. 생각하지 마라."},{"s":"n","bg":"siksangNight","bgm":"stillLake","tone":"dark","c":{"who":"moka","x":"base"},"t":"네 번째는 RAVEN 존. 앞의 세 구역과 달리 조용했다. 하지만 비겁의 섬 같은 침묵이 아니라, 몸이 먼저 반응하게 만드는 긴장된 고요함이었다. 바닥은 검은 유리처럼 반짝였고 조명은 낮게 깔렸다."},{"s":"sys","t":"[ 몸은 말보다 먼저 진실을 말한다. ]"},{"s":"yeon","x":"talk","t":"여긴 분위기가 확 다르네."},{"s":"moka","t":"RAVEN 님 구역은 퍼포먼스 체험장이에요. 말보다 움직임이 중요해요."},{"s":"yeon","t":"나한테 제일 불리한 구역 같은데?"},{"s":"neo","t":"오히려 도움이 될 수 있다. 네 몸에 익숙해져야 하니까."},{"s":"yeon","t":"그 말 맞는데 듣기 싫다."},{"s":"n","t":"RAVEN 존에선 그림자 스텝이 진행 중이었다. 발을 디디면 그림자가 그 사람의 감정을 따라 움직였다. 기쁜 사람의 그림자는 튀어 오르고, 긴장한 사람의 그림자는 작아졌다."},{"s":"n","t":"연이가 조심스레 발을 디디자, 작은 꽃돼지 그림자가 나타났다. 그런데 그림자는 연이보다 훨씬 당당했다. 가슴을 쫙 펴고, 앞발을 척 올리고 있었다."},{"s":"yeon","t":"내 그림자가 나보다 자신감 있는데?"},{"s":"neo","t":"네 안의 가능성이겠지."},{"s":"yeon","t":"아니면 그림자가 과대평가 중이거나."},{"s":"n","t":"그때 검은 흑표범이 소리 없이 걸어 나왔다. RAVEN. 말이 많지 않은 타입이었지만, 발을 디딜 때마다 주변 공기가 스스로 정리되는 느낌이었다. 그가 연이의 그림자를 보고 짧게 말했다. '나쁘지 않다.'"},{"s":"yeon","t":"뭐가요?"},{"s":"n","t":"'넘어져도 다시 일어날 몸이다.'"},{"s":"yeon","t":"그게 칭찬이에요?"},{"s":"n","t":"RAVEN이 고개를 끄덕였다. '좋은 몸이다. 중심이 낮다. 잘 구르면 덜 다친다.'"},{"s":"yeon","t":"그건 좀 현실적인 장점이네요."},{"s":"n","t":"RAVEN이 조용히 말했다. '무대에서는 멋있는 것보다, 멈추지 않는 게 먼저다.'"},{"s":"n","t":"연이는 그 말을 마음속 깊이 담았다. 넘어져도 다시 일어날 몸. 오늘 들은 말 중에 제일 오래 남을 것 같았다."},{"s":"n","bgm":"daily","t":"네 구역을 다 돌자, 연이의 팔찌에 네 개의 빛이 차례로 켜졌다. 은빛 늑대. 하얀 판다. 달빛 토끼. 검은 흑표범."},{"s":"moka","x":"moved","t":"입덕 코스 완료예요."},{"s":"yeon","x":"happy","t":"이 정도면 나도 OUR CODE 임시 회원인가?"},{"s":"moka","x":"happy","t":"충분합니다."},{"s":"neo","t":"우리는 조사를 한 것이다."},{"s":"n","t":"연이와 모카가 동시에 말했다. 입덕한 거야. 네오는 대답하지 않았다."},{"s":"n","bgm":"stillLake","t":"그때 노바 스테이지 중앙에서 큰 종이 울렸다. 둥. 둥. 둥. 광장의 조명이 하나씩 꺼지고, 중앙 무대 위로 거대한 달 조명이 천천히 떠올랐다. 관객들이 밀물처럼 몰려들었다."},{"s":"moka","x":"moved","t":"본공연 시작이에요."},{"s":"n","t":"연이도 무대를 올려다봤다. 조금 전 직접 만난 네 명이, 이제 하나의 그룹으로 오를 시간이었다. SOLV의 말, BAMBI의 온기, LUNE의 자유, RAVEN의 몸짓. 그 전부가 하나로 합쳐지면 어떤 무대가 될까."},{"s":"yeon","x":"talk","t":"너도 기대하지?"},{"s":"neo","t":"공연의 기운을 관찰하는 중이다."},{"s":"yeon","t":"그게 기대야."},{"s":"neo","t":"아니다."},{"s":"n","im":true,"t":"그 순간 관객들이 목청껏 외쳤다. DEST1NOVA! DEST1NOVA! DEST1NOVA!"},{"s":"moka","x":"moved","t":"드디어……."},{"s":"n","bgm":"novaFlex","tone":"dark","t":"무대가 완전히 어두워졌다. 첫 번째 조명, 은빛. 두 번째, 따뜻한 흰빛. 세 번째, 달빛. 네 번째, 검은 별빛."},{"s":"n","im":true,"fx":"burst","t":"DEST1NOVA의 네 실루엣이 무대 위에 동시에 솟아올랐다. 광장 전체가 함성으로 터졌다."},{"s":"n","t":"음악이 쏟아졌다. 바닥이 통딩거리던 그 박자가, 이번엔 수만 명의 발밑에서 하나로 쿵쿵 울렸다."},{"s":"yeon","x":"happy","t":"뭐야 이거. 온몸이 떨려."},{"s":"neo","t":"이게 식상의 섬 중심 기운이다. 표현이 모여 하나로 터지는 순간."},{"s":"yeon","t":"네오. 너 지금 발 까딱거리고 있어."},{"s":"neo","t":"…리듬을 측정하는 중이다."},{"s":"yeon","t":"그게 떼창 직전이라는 거야."},{"s":"n","t":"SOLV의 랩이 은빛 칼처럼 날면, BAMBI의 목소리가 그 뒤를 수프처럼 데웠다. LUNE의 기타가 틈을 살렸고, RAVEN의 몸짓이 박자를 바닥까지 눌러 박았다."},{"s":"n","bgm":"novaSoda","t":"연이가 문득 옆을 봤다. 모카가 노트를 가슴에 안은 채 소리 없이 입을 벌리고 있었다. 노래를 따라 부르지 못했다. 목이 잠겨서였다. 대신 눈에서 무언가 계속 흘렀다."},{"s":"moka","x":"moved","t":"저기 위에……. 언젠가 저기 위에……."},{"s":"n","t":"연이는 아무 말 없이, 앞발로 모카의 손을 꾹 잡았다.","fx":"heart"},{"s":"yeon","x":"talk","t":"맨 앞줄에서 응원봉 부러지게 흔들어준다고 했지. 그 약속, 오늘부터 세는 거다."},{"s":"n","t":"모카가 고개를 세차게 끄덕였다. 눈물이 조명을 받아 별 조각처럼 튀었다.","fx":"heart"},{"s":"n","im":true,"t":"수만 개의 응원봉이 동시에 흔들렸다. 광장 전체가 OUR CODE의 떼창으로 하나가 됐다. 그 합창 속엔, 방금 팔찌를 다 채운 임시 회원 하나와, 아직 무명인 지망생 하나의 목소리도 섞여 있었다."},{"s":"n","t":"연이는 이 순간을 오래 기억하기로 했다. 배부르고, 시끄럽고, 조금 눈물 나는 밤이었다."},{"s":"n","bgm":"gloom","c":null,"r":null,"t":"전야제는 끝났다. 이제 진짜 무대가, 데뷔전이 시작되려 하고 있었다."},{"s":"n","tone":"dark","t":"그리고 아주 멀리, 아무도 올려다보지 않은 하늘 위에서."},{"s":"n","im":true,"fx":"ink","t":"검은 깃털 하나가, 천천히 떨어지고 있었다."},{"s":"n","t":"그 깃털은 함성에도, 조명에도, 달빛에도 반응하지 않았다. 오직 하나의 소리에만 귀를 기울이는 듯했다. 재능이 처음으로 인정받은, 어느 무명 지망생의 뛰는 심장 소리."},{"s":"sys","im":true,"t":"[ 다음 화 · 제9화 ]\n[ DEST1NOVA 데뷔전. 그리고 재능을 갉아먹는 그림자가 노바 스테이지에 내려앉는다. ]"}]});
EPISODES.push({"no":"EP.09","tag":"제9화 · 검은 깃털","title":"검은 깃털","beats":[{"s":"sys","bg":"siksang","bgm":"novaTitle","l":{"who":"yeon"},"c":{"who":"moka","x":"base"},"r":{"who":"neo"},"t":"제9화 · 검은 깃털","im":true},{"s":"n","t":"무대 위에 네 개의 실루엣이 섰다."},{"s":"n","t":"은빛. 하얀빛. 달빛. 그리고 검은 별빛."},{"s":"n","t":"관객석이 한순간에 폭발했다."},{"s":"n","t":"「DEST1NOVA!」 「DEST1NOVA!」 「OUR CODE!」"},{"s":"moka","x":"moved","t":"모카는 두 손으로 입을 막았다. 눈이 벌써 울기 직전이었다. 「진짜…… 진짜 시작해요.」"},{"s":"yeon","x":"talk","t":"「너 아직 첫 소절도 안 나왔거든.」"},{"s":"moka","x":"moved","t":"「그러니까 우는 거잖아요.」"},{"s":"n","t":"연이는 관객석의 열기를 온몸으로 받았다."},{"s":"n","t":"식신·상관의 섬 전체가 이 무대 하나를 향해 뛰는 것 같았다."},{"s":"n","t":"발밑의 별 타일이 함성에 맞춰 깜빡였고, 하늘의 달 조명이 천천히 돌았다."},{"s":"n","t":"음식 거리의 냄새도, 악기 골목의 리듬도, 말놀이 무대의 웃음도 전부 이 한 점으로 빨려들었다."},{"s":"yeon","t":"「섬이 통째로 심장 박동을 맞추고 있어. 이게 말이 되냐 꿀.」"},{"s":"neo","t":"「말은 안 된다. 그런데 되고 있다.」"},{"s":"n","bgm":"novaFlex","t":"가장 먼저 움직인 건 SOLV였다. 은빛 늑대가 마이크를 들어 올렸다."},{"s":"n","t":"아무 음악도 나오지 않았다. 그런데도 관객석이 조용해졌다."},{"s":"n","t":"SOLV가 숨을 들이켰다. 낮은 목소리가 무대 위로 깔렸다."},{"s":"n","t":"「말하지 못한 밤이 길어도, 숨은 아직 남아 있어.」"},{"s":"n","t":"「삼킨 문장 끝에서, 우리는 다시 이름을 불러.」"},{"s":"n","t":"베이스가 뒤늦게 깔렸다. 쿵. 심장처럼 낮고 깊은 소리."},{"s":"yeon","t":"「와…….」 연이는 저도 모르게 팔에 소름이 돋았다."},{"s":"yeon","t":"「아니 꽃돼지라 이걸 팔이라고 불러도 되나 싶은데, 아무튼 소름 돋았어.」"},{"s":"yeon","x":"talk","t":"「진짜 잘한다.」"},{"s":"moka","x":"moved","t":"모카가 눈물 고인 눈으로 고개를 끄덕였다. 「SOLV 형은 첫 줄부터 세계관을 열어요.」"},{"s":"yeon","t":"「그 말 팬심 과장인 줄 알았는데 좀 맞네.」"},{"s":"n","t":"두 번째로 BAMBI가 노래를 이었다. 하얀 판다의 목소리는 따뜻했다. 하지만 가볍지 않았다."},{"s":"n","t":"「너의 작은 숨도 들려, 무너진 하루 끝에도.」"},{"s":"n","t":"「네 마음이 식지 않았다면, 그건 아직 노래야.」"},{"s":"n","t":"무대 조명이 부드럽게 퍼졌다. 관객석 곳곳에서 숨을 삼키는 소리가 들렸다."},{"s":"n","t":"방금까지 떠들던 아이들도 조용해졌다. 노래가 사람을 조용하게 만든 게 아니었다. 마음 안쪽을 데우고 있었다."},{"s":"yeon","t":"연이는 자기도 모르게 가슴을 눌렀다."},{"s":"n","t":"[乙亥]가 조용히 흔들렸다. 작은 새싹과 깊은 물. 그 위로 아주 희미한 불씨가 튀었다."},{"s":"n","t":"아직 글자는 아니었다. 하지만 무언가가 반응하고 있었다."},{"s":"yeon","t":"「네오.」 연이가 낮게 말했다. 「나 안쪽에서 뭐가 따뜻해.」"},{"s":"neo","t":"네오는 무대에서 눈을 떼지 않았다. 「식상 기운이다. 아직은 자연스러운 반응이다.」"},{"s":"yeon","t":"「위험한 건 아니고?」"},{"s":"neo","t":"「아직은.」"},{"s":"yeon","t":"연이는 그 두 글자가 조금 걸렸다. 아직은, 이라니."},{"s":"n","t":"하지만 다음 순간, LUNE의 기타가 터져 나왔다. 딩!"},{"s":"n","t":"달빛 토끼가 무대 앞으로 뛰어나왔다. 기타를 어깨에 걸고 웃었다."},{"s":"n","t":"「틀린 코드도 살리면 후렴이지!」 관객들이 환호했다."},{"s":"n","t":"딩딩딩! 별빛 조명이 기타 줄을 따라 튀었다. 한 줄이 울릴 때마다 달 조명이 색을 바꿨다."},{"s":"n","t":"푸른빛. 분홍빛. 노란빛. 다시 달빛."},{"s":"yeon","x":"happy","t":"연이는 저도 모르게 몸을 흔들었다. 발밑이 통딩, 하고 반응했다."},{"s":"n","t":"그 소리에 주변 관객 몇이 웃었다. 연이는 바로 얼어붙었다."},{"s":"yeon","x":"talk","t":"「아, 내 바닥 효과음 왜 이렇게 튀어. 나만 8비트야.」"},{"s":"moka","x":"base","t":"「괜찮아요. 여기서는 관객도 무대의 일부예요.」"},{"s":"yeon","t":"「이 섬 논리 진짜 좋다. 나 여기 시민권 딸까 꿀.」"},{"s":"n","t":"마지막으로 RAVEN이 움직였다. 검은 흑표범은 말이 없었다."},{"s":"n","t":"그는 무대 뒤 그림자 속에서 한 걸음 나왔다. 쿵."},{"s":"n","t":"발끝이 바닥에 닿는 순간, 무대 전체의 그림자가 파도처럼 갈라졌다."},{"s":"n","t":"두 번째 걸음. 쿵. 조명들이 일제히 낮아졌다."},{"s":"n","t":"세 번째 걸음. 쿵. RAVEN의 몸이 회전했다. 말보다 빠른 춤이었다."},{"s":"n","t":"날카롭지만 부드러웠고, 조용하지만 강했다. 발끝이 지나간 자리마다 검은 별빛이 흩어졌다."},{"s":"yeon","t":"연이는 숨을 삼켰다. 「저건 진짜 말이 필요 없네.」"},{"s":"neo","t":"「몸도 표현이다.」"},{"s":"n","t":"무대가 완전히 열렸다. SOLV의 랩, BAMBI의 보컬, LUNE의 기타, RAVEN의 춤."},{"s":"n","t":"네 명의 기운이 하나로 섞이자, 노바 스테이지 전체가 빛나기 시작했다."},{"s":"n","t":"관객들이 손을 들었다. 「DEST1NOVA!」 「OUR CODE!」"},{"s":"n","t":"함성은 물결이 되어 무대 위로 밀려갔다."},{"s":"n","t":"모카는 가사 노트를 품에 안고 있었다. 그의 손이 떨렸다."},{"s":"yeon","x":"talk","t":"연이가 그걸 보고 물었다. 「괜찮아?」"},{"s":"moka","x":"moved","t":"「네.」 모카는 울 것 같은 얼굴로 웃었다. 「너무 좋아서 손이 떨려요.」"},{"s":"yeon","t":"「그건 인정.」"},{"s":"moka","x":"moved","t":"모카는 무대를 보며 중얼거렸다. 「나도 언젠가 저렇게…….」"},{"s":"n","t":"그 순간."},{"s":"n","t":"하늘에서 무언가가 떨어졌다. 아주 작았다."},{"s":"yeon","t":"연이는 처음엔 별가루인 줄 알았다."},{"s":"n","t":"노바 스테이지엔 워낙 많은 조명이 떠 있었고, 무대 연출도 화려했다. 반짝이는 게 떨어지는 건 이상하지 않았다."},{"s":"n","t":"하지만 그것은 반짝이지 않았다. 검었다."},{"s":"n","tone":"desat","t":"깃털이었다."},{"s":"n","t":"처음에는 아무 일도 일어나지 않는 것처럼 보였다."},{"s":"n","t":"SOLV는 마이크를 쥐고 있었다. BAMBI는 숨을 들이켰다."},{"s":"n","t":"LUNE은 기타 줄 위에 손가락을 올렸다. RAVEN은 다음 동작을 위해 몸을 낮췄다."},{"s":"n","t":"관객들은 함성을 준비하고 있었다."},{"s":"n","t":"그 짧은 순간, 식신·상관의 섬 전체가 다음 표현을 기다리고 있었다."},{"s":"n","t":"다음 랩. 다음 노래. 다음 코드. 다음 춤."},{"s":"n","t":"다음 웃음. 다음 박수. 다음 한입."},{"s":"n","bgm":"gloom","fx":"ink","t":"그때 검은 깃털이 바닥에 닿았다. 툭."},{"s":"n","t":"단지 깃털 하나가 떨어졌을 뿐인데, 그 소리는 섬 전체에 퍼졌다."},{"s":"n","t":"아니. 소리를 들은 게 아니었다. 느낀 것이었다."},{"s":"n","t":"세상의 바깥에서 거대한 손이 뻗어와, 이 섬의 모든 밖으로 나오는 것을 눌러버린 것처럼."},{"s":"n","t":"가장 먼저 사라진 것은 소리였다."},{"s":"n","t":"LUNE의 기타 줄이 떨렸다. 분명 줄은 움직였다. 하지만 소리는 나오지 않았다."},{"s":"n","tone":"desat","t":"다음은 색이었다. 무대 조명이 꺼진 게 아니었다. 조명은 여전히 켜져 있었다."},{"s":"n","t":"그런데 색이 빠졌다. 은빛은 회색이 되고, 달빛은 탁해지고, BAMBI의 흰빛은 종이처럼 창백해졌다."},{"s":"yeon","t":"연이는 숨을 삼켰다. 「뭐야…….」"},{"s":"n","t":"그 순간, 음식 거리의 냄새가 사라졌다."},{"s":"n","t":"방금까지 공기를 채우던 달빛 크림빵의 단내. 불꽃 라면의 매콤한 냄새. 구름솜 튀김의 고소한 냄새."},{"s":"n","t":"전부 끊겼다. 누군가 섬 전체의 코를 막아버린 것처럼."},{"s":"yeon","t":"연이는 손에 든 빵을 내려다봤다. 빵은 그대로였다. 따뜻해 보였다. 하지만 아무 냄새도 나지 않았다."},{"s":"yeon","t":"연이는 조심스럽게 한입 베어 물었다."},{"s":"yeon","t":"맛이 없었다. 달지도 않았다. 고소하지도 않았다. 그냥 씹히는 무언가였다."},{"s":"yeon","x":"talk","t":"연이의 얼굴이 굳었다. 「이건…… 너무한데. 빵한테 죄 없잖아.」"},{"s":"n","t":"그다음 사라진 것은 움직임이었다."},{"s":"n","t":"RAVEN의 발끝이 바닥에 닿았다. 하지만 다음 동작으로 이어지지 않았다."},{"s":"n","t":"춤이 멈춘 게 아니었다. 춤이 되기 전의 충동이 사라진 것 같았다. 몸이 어떻게 움직여야 하는지 잊은 것처럼."},{"s":"n","t":"RAVEN의 그림자가 바닥에 달라붙었다. 검은 늪처럼."},{"s":"n","t":"BAMBI는 입을 열었다. 노래가 나오지 않은 것보다 더 이상했다. 노래하려는 마음이 흐려졌다."},{"s":"n","t":"가슴에 차오르던 멜로디가, 누가 손으로 문질러 지운 것처럼 사라졌다. BAMBI의 눈이 흔들렸다."},{"s":"n","t":"LUNE은 기타를 다시 잡았다. 하지만 손가락이 다음 코드를 찾지 못했다."},{"s":"n","t":"틀린 게 아니었다. 실수도 아니었다. 그는 처음으로 다음 박자가 떠오르지 않는 얼굴이었다."},{"s":"n","t":"SOLV가 마이크를 들었다. 입술이 움직였다. 하지만 랩이 나오지 않았다."},{"s":"n","t":"소리만 막힌 게 아니었다. 단어가 사라졌다. 머릿속에서 라임이 끊겼다."},{"s":"n","t":"한 줄이 완성되기 직전, 보이지 않는 손이 종이를 찢어버리는 것처럼. SOLV의 눈빛이 차갑게 굳었다."},{"s":"moka","x":"angry","t":"모카가 품에 안고 있던 가사 노트를 펼쳤다. 「안 돼…….」"},{"s":"n","t":"노트 위의 글자들이 흐려지고 있었다. 지운 흔적도, 고친 문장도, 삐뚤빼뚤한 라임도. 전부 회색 먼지처럼 번졌다."},{"s":"moka","x":"angry","t":"모카가 떨리는 손으로 글자를 붙잡으려 했다. 하지만 글자는 손가락 사이로 빠져나갔다."},{"s":"moka","x":"angry","t":"「내 가사…….」 목소리가 갈라졌다. 「내가 쓴 줄들이…….」"},{"s":"n","t":"관객석도 변했다. 함성을 지르려던 이들은 입을 벌린 채 멈췄다."},{"s":"n","t":"손뼉을 치려던 손은 허공에서 멎었다. 웃으려던 아이의 얼굴에서 웃음이 사라졌다."},{"s":"n","t":"감동해 눈물을 흘리던 관객의 눈물도 멈췄다. 눈물방울이 뺨 위에서 그대로 굳었다."},{"s":"n","t":"슬픔도, 기쁨도, 환호도, 웃음도. 전부 밖으로 나오지 못했다."},{"s":"yeon","t":"연이는 그제야 깨달았다. 이건 침묵이 아니었다. 침묵보다 더 끔찍한 것이었다."},{"s":"yeon","t":"말을 못 하게 하는 게 아니었다. 표현 자체를 없애고 있었다."},{"s":"yeon","t":"좋아도 좋아할 수 없게. 아파도 아프다고 할 수 없게. 맛있어도 맛있다고 느끼지 못하게."},{"s":"yeon","t":"생각이 문장이 되기 전에. 마음이 노래가 되기 전에. 몸이 춤이 되기 전에. 전부 잘라내고 있었다."},{"s":"sys","bg":"siksangCrisis","bgm":"crisis","tone":"dark","t":"공중에 붉은 글자가 떠올랐다.  [표현 봉쇄 진행률: 21%]  [식신의 힘이 약해짐] · [상관의 힘 봉인]  [맛 / 냄새 / 색 / 리듬 / 언어 / 몸짓 출력 제한]","im":true},{"s":"n","t":"연이의 머리 위 꽃이 떨렸다. 가슴 안쪽의 [乙亥]가 차갑게 흔들렸다."},{"s":"neo","t":"「비겁의 섬에서 되찾은 네 자리마저…….」 네오의 눈이 좁아졌다. 「이 무표현 앞에서 움츠러들고 있다.」"},{"s":"n","fx":"ink","t":"그때 검은 깃털이 갈라졌다."},{"s":"n","r":{"who":"crow","x":"base"},"t":"그 안에서 검은 연미복을 입은 까마귀가 천천히 모습을 드러냈다."},{"s":"n","t":"붉은 눈. 긴 부리. 흰 장갑을 낀 손. 그 손에는 붉은 도장이 들려 있었다."},{"s":"n","t":"도장 면에는 검은 글자가 새겨져 있었다.  [封]"},{"s":"crow","x":"base","t":"까마귀는 조용히 무대를 둘러보았다. 목소리는 크지 않았다. 하지만 섬 전체에 박혔다. 「시끄럽군.」"},{"s":"crow","x":"base","t":"그는 SOLV를 보았다. 「말은 칼이 된다.」"},{"s":"crow","x":"base","t":"BAMBI를 보았다. 「노래는 마음을 흔든다.」"},{"s":"crow","x":"base","t":"LUNE을 보았다. 「틀을 깨는 소리는 질서를 어지럽힌다.」"},{"s":"crow","x":"base","t":"RAVEN을 보았다. 「몸짓은 숨겨야 할 진실을 드러낸다.」"},{"s":"crow","x":"base","t":"그리고 관객석을 보았다. 「웃음은 번지고, 박수는 선동하며, 감동은 통제를 무너뜨린다.」"},{"s":"crow","x":"alt","fx":"hands","t":"까마귀는 도장을 들어 올렸다. 「그러니, 막겠다.」"},{"s":"sys","fx":"ink","t":"무대 위에 거대한 붉은 문장이 떠올랐다.  [무표현]","im":true},{"s":"n","t":"그 글자가 나타나는 순간, 섬 전체의 공기가 납처럼 무거워졌다."},{"s":"n","t":"음식은 맛을 잃었다. 악기는 소리를 잃었다. 노트는 문장을 잃었다."},{"s":"n","t":"관객은 표정을 잃었다. 무대는 다음 장면을 잃었다."},{"s":"moka","x":"angry","t":"모카가 무릎을 꿇었다. 「이건…….」 목소리가 떨렸다. 「말을 못 하는 게 아니야.」"},{"s":"yeon","x":"talk","t":"연이는 이를 악물었다. 「응.」"},{"s":"yeon","t":"그녀는 무대 위의 까마귀를 노려봤다. 「아무것도 못 꺼내게 하는 거야.」"},{"s":"neo","c":{"who":"neo"},"t":"네오의 갈기가 금빛으로 타올랐다. 하지만 그 얼굴도 굳어 있었다. 「연이.」"},{"s":"yeon","t":"「왜.」"},{"s":"neo","t":"「이번 상대는 강하다.」"},{"s":"yeon","t":"「얼마나?」"},{"s":"neo","t":"네오는 무대 위에 떠오른 [무표현]을 바라봤다. 「식신·상관의 섬 자체를 꺼버릴 수 있을 정도로.」"},{"s":"sys","t":"공중의 숫자가 올라갔다.  [표현 봉쇄 진행률: 34%]"},{"s":"crow","x":"base","c":{"who":"moka","x":"angry"},"t":"까마귀가 다시 도장을 들었다. 「입을 닫아라.」"},{"s":"sys","fx":"claw","t":"붉은 도장이 하늘에 찍혔다.  [무언]"},{"s":"crow","x":"base","t":"「손을 멈춰라.」"},{"s":"sys","fx":"claw","t":"두 번째 도장.  [무작]"},{"s":"crow","x":"base","t":"「맛을 잊어라.」"},{"s":"sys","fx":"claw","t":"세 번째 도장.  [무미]"},{"s":"crow","x":"base","t":"「색을 지워라.」"},{"s":"sys","fx":"claw","t":"네 번째 도장.  [무색]"},{"s":"crow","x":"alt","fx":"hands","t":"마지막으로 까마귀는 도장을 높이 들었다. 「꿈을 꺼라.」"},{"s":"sys","bgm":"crisis2","fx":"ink","t":"하늘 전체에 거대한 봉인진이 펼쳐졌다.  [절대표현봉인]","im":true},{"s":"yeon","t":"연이는 숨을 멈췄다. 그것은 침묵보다 거대했다. 어둠보다 차가웠다."},{"s":"n","t":"이 섬의 모든 존재에게서 나를 밖으로 꺼내는 힘을 빼앗아가는 법칙 같았다."},{"s":"moka","x":"moved","t":"모카의 가사 노트에서 마지막 글자가 흐려졌다. 「연이…….」"},{"s":"moka","x":"moved","t":"모카가 간신히 말했다. 「제 머릿속에서 다음 줄이 사라지고 있어요.」"},{"s":"yeon","t":"연이는 그 말을 듣는 순간, 가슴 안쪽에서 작은 불씨가 튀는 것을 느꼈다."},{"s":"yeon","t":"아직 작았다. 아직 이름도 없었다. 하지만 분명히 있었다."},{"s":"yeon","t":"말이 되기 전의 숨. 노래가 되기 전의 떨림. 꺼지지 않으려는 아주 작은 불."},{"s":"neo","c":{"who":"neo"},"t":"네오가 낮게 말했다. 「식상의 글자가 반응하고 있다.」"},{"s":"yeon","t":"연이는 가슴을 눌렀다. 「이번 글자…….」"},{"s":"n","fx":"burst","t":"불씨가 아주 희미하게 모습을 드러냈다.  [丁]"},{"s":"n","t":"그러나 그 아래에는 갈라진 흙빛도 함께 있었다.  [未]"},{"s":"neo","t":"「丁未다.」"},{"s":"yeon","c":{"who":"moka","x":"moved"},"t":"연이는 무대 위를 바라봤다. 까마귀의 절대표현봉인이 점점 내려오고 있었다."},{"s":"yeon","t":"만약 저게 완전히 닿으면. 이 섬은 조용해지는 정도가 아닐 것이다."},{"s":"n","t":"맛없는 음식. 색 없는 조명. 가사 없는 노트. 움직이지 않는 몸. 웃지 못하는 관객."},{"s":"n","t":"그리고 다시는 무대가 되지 못하는 무대. 그런 섬이 될 것이다."},{"s":"yeon","t":"연이는 앞발에 힘을 줬다. 손가락은 없었다. 하지만 힘은 들어갔다."},{"s":"yeon","x":"talk","t":"「네오.」"},{"s":"neo","c":{"who":"neo"},"t":"「말해라.」"},{"s":"yeon","t":"「이번엔 그냥 말하면 안 되겠지?」"},{"s":"neo","t":"「그래.」 네오가 낮게 대답했다. 「이번엔 네가 직접 표현해야 한다.」"},{"s":"yeon","c":{"who":"moka","x":"moved"},"t":"연이는 무대 위를 바라봤다. DEST1NOVA가 멈춰 있었다. 모카가 떨고 있었다."},{"s":"yeon","t":"관객들이 색을 잃어가고 있었다. 생명력 넘치던 섬이 죽어가고 있었다."},{"s":"yeon","t":"연이는 짧게 숨을 들이켰다. 무서웠다. 하지만 그보다 더 화가 났다."},{"s":"yeon","x":"talk","t":"「좋아.」 그녀가 말했다. 「꽃돼지든 뭐든.」"},{"s":"yeon","x":"happy","fx":"burst","t":"머리 위 꽃이 붉게 흔들렸다. 「내가 먼저 꺼내볼게.」"},{"s":"crow","x":"base","t":"까마귀의 붉은 눈이 연이를 향했다. 「작은 생물이군.」"},{"s":"yeon","x":"talk","t":"연이는 그를 노려봤다. 「다들 진짜 첫인사 좀 고쳐라. 대본이라도 돌리냐.」"},{"s":"crow","x":"alt","fx":"hands","t":"까마귀가 도장을 그녀에게 겨누었다. 「너도 곧 아무것도 표현하지 못하게 될 것이다.」"},{"s":"n","tone":"dark","t":"[절대표현봉인]이 천천히 내려왔다. 식신·상관의 섬 전체가 숨을 죽였다."},{"s":"n","t":"연이의 가슴 안쪽에서 [丁未]가 꺼질 듯 흔들렸다."},{"s":"n","t":"그리고 다음 순간."},{"s":"yeon","x":"talk","t":"연이는 무대 쪽으로 한 걸음 내디뎠다."},{"s":"sys","t":"제9화 · 검은 깃털 — 끝  다음 화: 꺼지지 않는 불씨 [丁未]. 표현을 빼앗긴 섬에서, 연이는 처음으로 자기 손으로 무언가를 꺼내려 한다.","im":true}]});
EPISODES.push({"no":"EP.10","tag":"제10화 · 데뷔전","title":"데뷔전","beats":[{"s":"sys","bg":"siksang","bgm":"gloom","l":{"who":"yeon"},"c":{"who":"moka","x":"base"},"r":{"who":"neo"},"t":"제10화 · 데뷔전 — 식신·상관의 섬. 소리도 맛도 색도 사라지기 시작한 무대 앞에서.","im":true},{"s":"n","t":"검은 봉인진이 하늘을 덮었다. 섬 밖으로 새어나가려는 모든 것을 손바닥으로 눌러버리는 진이었다. 노래도 기타 소리도 관객의 박수도 허공 중간에서 멈췄다.","tone":"dark"},{"s":"yeon","x":"talk","t":"뭐야 이거. 시끌시끌하던 섬이 갑자기 음소거 눌린 것처럼 됐잖아. 크림빵은 저렇게 따끈해 보이는데 코가 냄새를 못 잡아."},{"s":"n","t":"연이는 달빛 크림빵을 한입 베어 물었다. 단맛도 고소함도 따뜻함도 없었다. 그냥 씹히는 무언가였다."},{"s":"yeon","t":"…이건 좀 너무하잖아. 말끝을 누가 손으로 눌러버리는 것 같아."},{"s":"moka","x":"moved","t":"연이님… 제 가사 노트도 이상해요. 이거 제가 쓴 건데. 틀려도, 별로여도, 제가 쓴 건데요…."},{"s":"n","t":"방금까지 삐뚤빼뚤 살아 있던 라임들이 회색 먼지처럼 번졌다. 먹고 만들고 말하고 노는 섬이, 아무것도 표현 못 하는 회색 방으로 굳어가고 있었다."},{"s":"yeon","t":"야, 그 노트 나 절대 못 뺏기게 할게. 알겠지."},{"s":"neo","t":"연이. 까마귀는 목소리만 봉하는 게 아니다. 식상 전체를 막고 있다."},{"s":"yeon","x":"talk","t":"식상 전체? 말하는 것도, 먹는 것도, 노는 것도, 만드는 것도 전부?"},{"s":"neo","t":"그래. 표현이라는 출구 자체를 눌렀다. 이번엔 소리 한번 지르는 걸로는 부족하다."},{"s":"n","t":"네오의 갈기가 금빛으로 타올랐다. 회색이 내려앉은 섬에서 그 빛만 유일하게 색을 가지고 있었다. 봉인진 위로 다섯 글자가 무겁게 새겨졌다.","tone":"dark"},{"s":"sys","t":"[무언] [무작] [무미] [무색] [무동] — 말 없음. 만듦 없음. 맛 없음. 색 없음. 움직임 없음.","im":true},{"s":"yeon","t":"이름부터 벌써 재미없다. 노잼 다섯 글자가 섬을 깔고 앉았어."},{"s":"n","bg":"siksangCrisis","bgm":"crisis","c":{"who":"moka","x":"base"},"r":{"who":"crow","x":"base"},"t":"무대 중앙에 까마귀가 서 있었다. 검은 연미복, 붉은 눈, 흰 장갑. 그리고 손에 든 붉은 도장.","tone":"dark"},{"s":"crow","t":"표현은 혼란이다."},{"s":"n","t":"목소리는 작았다. 그런데도 모두의 마음 위로 무겁게 내려앉았다."},{"s":"crow","x":"alt","t":"말하지 않으면 다투지 않는다. 만들지 않으면 실패하지 않는다. 맛을 모르면 탐하지 않고, 색을 지우면 비교하지 않는다."},{"s":"n","t":"[무언]과 [무작]이 짙어지고, 공기가 회색 물처럼 무거워졌다."},{"s":"crow","t":"몸을 멈추면 질서가 유지된다. 그러니 이 섬은 조용해져야 한다."},{"s":"n","fx":"ink","t":"까마귀가 도장을 천천히 들어 올렸다. 그 말이 끝나자 DEST1NOVA 멤버들의 몸이 다시 굳어갔다. SOLV는 가사를, LUNE은 다음 코드를, RAVEN은 다음 발걸음을 잃었다.","tone":"dark"},{"s":"moka","x":"moved","t":"내 다음 줄이… 안 떠올라요."},{"s":"n","t":"모카가 노트를 끌어안고 무릎을 꿇었다. 무릎이 바닥에 닿는 소리조차 회색에 먹혔다."},{"s":"yeon","t":"모카."},{"s":"moka","t":"아무것도 생각이 안 나요. 방금까지 있었는데. 다음 줄이, 다음 박자가, 다음 말이 전부 사라졌어요."},{"s":"n","t":"그 말은 연이의 가슴을 정확히 찔렀다. 비겁의 섬 거울 속 자기가 했던 말이 다른 얼굴로 돌아온 것 같았다.","tone":"dark"},{"s":"yeon","x":"talk","t":"네 자리는 없어, 네가 못 하면 내가 할게. 그땐 그랬는데, 이번엔 네 목소리는 없어로 바뀌었네."},{"s":"yeon","t":"아니. 사라진 거 아니야. 지금 못 보게 막힌 거지. 없어진 게 아니라 가려진 거."},{"s":"n","t":"연이는 모카의 노트를 앞발로 툭 건드렸다. 회색으로 번진 글자들이 손끝에서 희미하게 떨렸다."},{"s":"yeon","t":"네가 쓴 줄은 안 없어져. 망한 줄도, 이상한 라임도, 지운 흔적도, 다시 쓴 것도 전부 네 거야."},{"s":"n","fx":"burst","t":"그 순간 연이의 가슴 안쪽에서 따뜻한 불씨가 움직였다. 작은 붉은 불 하나와, 그 아래 갈라진 흙빛 하나가 함께 떠올랐다."},{"s":"sys","t":"[丁] 작은 불 · [未] 그 불을 받치는 땅 — 丁未. 이번 화의 글자.","im":true},{"s":"neo","t":"정미가 반응한다. 丁은 작은 불씨다. 말, 노래, 창작, 표현의 불."},{"s":"yeon","t":"그럼 未는?"},{"s":"neo","t":"그 불이 꺼지지 않게 받치는 땅이다. 식신은 그냥 말하는 힘이 아니야. 먹고, 만들고, 기르고, 남기는 힘이다."},{"s":"n","t":"연이는 천천히 이해했다. 불씨만 있으면 번쩍 타오르지만 금방 꺼진다. 오래 남으려면 바닥이 필요했다."},{"s":"yeon","x":"talk","t":"무대. 몸. 노트. 연습. 만든 것. 남겨진 것. …그게 未구나."},{"s":"neo","t":"이해가 빠르군. 드물게."},{"s":"yeon","t":"방금 그거 칭찬 맞지? 사자 화법은 늘 모호해서 원."},{"s":"yeon","t":"모카. 노트 펴."},{"s":"moka","t":"지금요? 근데 글자가 흐려지고…."},{"s":"yeon","t":"그래도 펴."},{"s":"n","t":"모카가 떨리는 손으로 노트를 펼쳤다. 글자는 거의 회색이었지만, 지운 줄도 덧쓴 단어도 손때 묻은 모서리도 완전히 사라지진 않았다."},{"s":"yeon","t":"네 노트는 그냥 노트가 아니야. 네 목소리가 뿌리내린 땅이야."},{"s":"n","fx":"burst","t":"그 말에 모카의 손이 멈췄다. 노트 아래에서 아주 작은 흙빛이 피어올랐다. 未의 기운이었다."},{"s":"neo","t":"좋다. 아직 살아 있다."},{"s":"crow","x":"base","t":"쓸모없는 초안이다. 지워주마."},{"s":"n","fx":"ink","t":"까마귀가 도장을 들어 올렸다. 허공에 붉은 글자 [폐기]가 찍혀 모카의 노트로 날아왔다. 모카가 눈을 질끈 감았다.","tone":"dark"},{"s":"yeon","x":"talk","t":"그 말, 안 받을게!"},{"s":"n","fx":"burst","t":"가슴 안쪽의 [丁]이 튀었다. 작은 불꽃이 허공을 갈랐다. 치익 — [폐기]의 한 획이 탔다."},{"s":"crow","t":"불씨가 있군."},{"s":"yeon","t":"…있네."},{"s":"n","t":"연이도 놀랐다. 방금 말이 밖으로 나오자 불씨가 따라 나갔다."},{"s":"neo","t":"그게 丁이다. 표현이 불씨가 되는 것."},{"s":"yeon","x":"talk","t":"말이 진짜 불이 된다고? 무섭기도 한데 좀 짜릿한데. 그럼 한 번 더. 초안도 버릴 게 아니야."},{"s":"n","fx":"burst","t":"치익. [폐기]의 두 번째 획이 탔다."},{"s":"yeon","t":"틀린 줄도 연습한 흔적이고. 지운 문장도 다시 쓰려고 남긴 자리야."},{"s":"n","fx":"burst","t":"쨍! [폐기]가 깨졌다. 모카의 노트가 다시 빛나며 몇 줄이 선명하게 돌아왔다."},{"s":"moka","x":"moved","t":"돌아왔어요…!"},{"s":"yeon","t":"다 돌아온 건 아니야. 그러니까 더 만들어야 해."},{"s":"moka","x":"base","t":"어떻게요?"},{"s":"n","bg":"siksangNight","bgm":"crisis2","t":"검은 봉인 아래 조명이 흐려졌다. 무대 위 DEST1NOVA는 움직이려 했지만 표현의 경로가 막혀 있었다. 섬 전체가 다음 표현을 기다렸다.","tone":"dark"},{"s":"yeon","t":"무대. 무대 위에서 해야 해."},{"s":"moka","t":"뭘요?"},{"s":"yeon","t":"노래."},{"s":"n","t":"모카가 얼어붙었다. 노트를 쥔 손가락이 딱 멈췄다."},{"s":"moka","t":"누가요?"},{"s":"yeon","t":"…나랑 너."},{"s":"moka","x":"base","t":"…네?"},{"s":"yeon","x":"talk","t":"나도 믿기 싫어. 이 비주얼로 아이돌 비슷한 걸 하게 될 줄은 나도 몰랐다고."},{"s":"n","t":"연이는 자기 몸을 내려다봤다. 분홍빛 꽃돼지, 짧은 앞발, 동그란 배, 머리 위 꽃."},{"s":"moka","t":"저도 아직 데뷔 전인데요."},{"s":"yeon","t":"나도 데뷔 전이야."},{"s":"moka","t":"연이님은 아예 아이돌 지망도 아니잖아요."},{"s":"yeon","t":"그러니까 더 큰일이지."},{"s":"n","t":"심각한 상황인데 조합이 너무 말이 안 됐다. 무명 수달 래퍼, 꽃돼지 임시 보컬, 그리고 갈기 달린 가디언."},{"s":"yeon","t":"너도 같이 해야 하는 거 아니야?"},{"s":"neo","t":"나는 하지 않는다. 나는 가디언이다."},{"s":"yeon","t":"그 대사 진짜 많이 우려먹는다. 사골이야 사골."},{"s":"neo","t":"나는 길을 열겠다."},{"s":"yeon","t":"무대에는 안 올라오겠다는 거지?"},{"s":"neo","t":"필요하면 오른다."},{"s":"yeon","t":"아. 결국 오른다는 뜻이네. 츤데레 사자."},{"s":"moka","t":"근데 노래를 어떻게 만들어요? 저 랩은 조금 하는데, 아이돌 노래는…."},{"s":"n","t":"그때 아주 작은 소리가 들렸다. 딩. LUNE이 아직 말은 못 한 채, 기타 줄 하나를 약하게 튕겼다. 소리는 금방 사라졌지만 분명히 방향을 가리켰다."},{"s":"neo","t":"다음 박자다. 저 눈빛이 말하고 있다. 틀려도 살려라."},{"s":"n","t":"BAMBI가 입모양으로 그렸다. 숨. 처음은 숨. SOLV는 마이크를 모카 쪽으로 기울였다. 첫 줄. RAVEN의 발끝은 바닥에 작은 원을 그렸다. 무대의 중심."},{"s":"neo","t":"그들이 길을 알려주고 있다."},{"s":"yeon","x":"talk","t":"첫 줄. 숨. 다음 박자. 무대의 중심. …다 받았어."},{"s":"n","t":"모카가 노트를 봤다. 흐려진 글자들 사이에서 한 줄만 또렷하게 남아 있었다."},{"s":"sys","t":"[나는 모카, 아직 무명.]"},{"s":"moka","x":"base","t":"맨날 이 줄만 남네요."},{"s":"yeon","t":"그럼 그게 시작인가 보지. 후렴은 내가 낼게."},{"s":"n","t":"연이는 잠깐 생각했다. 아이돌처럼 노래해야 한다면, 멋진 말보다 모두가 따라 할 수 있는 말이어야 했다. 식신·상관의 섬에서 배운 건 하나였다. 사라지기 전에 꺼내기."},{"s":"yeon","x":"talk","t":"꺼내. 말도, 마음도, 박자도, 맛도. 꺼내서 무대 위에 세우는 거야."},{"s":"n","fx":"burst","t":"모카가 노트에 빠르게 적기 시작했지만 글자가 자꾸 흐려졌다. [무작]의 봉인이 노트를 누르고 있었다."},{"s":"moka","x":"angry","t":"글씨가 안 남아요."},{"s":"yeon","t":"그럼 말로 해."},{"s":"moka","t":"말이 막히면요?"},{"s":"yeon","t":"박자로 해."},{"s":"moka","t":"박자가 막히면요?"},{"s":"yeon","t":"…그럼 몸으로 해."},{"s":"moka","x":"base","t":"연이님, 지금 되게 상관의 섬 주민 같았어요."},{"s":"yeon","t":"칭찬이지?"},{"s":"moka","t":"네. 약간 무모한 칭찬이요."},{"s":"n","t":"연이는 앞으로 걸어갔다. 무대와 관객석 사이에 검은 선이 그어져 있었다.","tone":"dark"},{"s":"sys","t":"[무대 접근 금지]"},{"s":"n","fx":"ink","t":"연이가 앞발을 선 위에 올렸다. 찌릿. 표현을 막는 기운이 몸을 타고 올라왔다. 순간 머릿속이 하얘졌다."},{"s":"yeon","t":"내가 왜 올라가야 하지. 이 꼴로 무대에? …웃기잖아."},{"s":"n","t":"그때 모카가 옆에 섰다. 그도 떨고 있었지만 도망치지 않았다."},{"s":"moka","t":"같이 가요."},{"s":"yeon","t":"너 무섭지?"},{"s":"moka","t":"네."},{"s":"yeon","t":"나도. 그래도 가자."},{"s":"n","r":{"who":"neo"},"fx":"claw","t":"그때 네오가 그들 앞에 섰다. 금빛 발톱이 검은 선을 향해 휘둘러졌다. 쨍! [무대 접근 금지]에 금이 갔지만, 완전히 깨지지는 않았다."},{"s":"crow","x":"base","r":{"who":"crow","x":"base"},"t":"힘으로는 무대에 오를 수 없다."},{"s":"neo","t":"알고 있다. 마지막은 너희가 해야 한다."},{"s":"n","t":"모카가 숨을 들이켰다. 검은 선 앞에서 그는 노트를 펼치지 않고, 대신 가슴에 손을 얹었다."},{"s":"moka","t":"나는 모카."},{"s":"n","t":"선이 흔들렸다."},{"s":"moka","t":"아직 무명."},{"s":"n","t":"금이 조금 더 커졌다."},{"s":"moka","x":"moved","t":"그래도 오늘. 내 첫 줄은 내가 써."},{"s":"n","fx":"burst","t":"쨍. 선이 절반 갈라졌다."},{"s":"n","t":"이번엔 연이 차례였다. 마이크도 없고 노래도 할 줄 몰랐다. 그런데 이상하게 가슴 안쪽에서 멜로디 하나가 떠올랐다. BAMBI가 준 숨, LUNE이 준 박자, SOLV가 준 첫 줄, RAVEN이 준 중심. 그리고 모카의 떨리는 목소리."},{"s":"n","bgm":"novaTitle","t":"연이는 눈을 감았다. 처음 나온 소리는 작았다."},{"s":"yeon","t":"꺼내."},{"s":"n","t":"검은 선이 멈칫했다. 연이는 다시, 이번엔 조금 선율을 얹었다."},{"s":"yeon","x":"talk","t":"숨겨둔 마음도 꺼내."},{"s":"n","fx":"burst","t":"그 순간 [丁]의 불씨가 작게 빛났다. 모카가 박자를 얹었다."},{"s":"moka","x":"p1","t":"꺼내, 꺼내, 막힌 말도 다시 꺼내."},{"s":"yeon","t":"맛을 잃은 하루에도, 작은 불을 켜."},{"s":"moka","x":"moved","t":"후렴…!"},{"s":"n","fx":"burst","t":"잘 나온 노래도, 전문적인 보컬도 아니었다. 하지만 사라지지 않고 세계 밖으로 나갔다. [무대 접근 금지]가 크게 갈라졌다."},{"s":"n","fx":"burst","bg":"siksangBattle","t":"쨍그랑! 검은 선이 깨졌다. 연이와 모카는 동시에 무대 위로 한 걸음 내디뎠다. 무대 바닥에 흙빛 원이 생기고, 그 위에 작은 붉은 불꽃이 피어났다."},{"s":"sys","t":"[未] 무대의 흙 · [丁] 그 위의 불 — 정미, 무대에 서다." ","t":"쨍! [무가치]가 갈라졌다. 연이의 [丁] 불씨가 다시 피어났고, [未]의 흙빛 무대가 더 넓어졌다."},{"s":"n","t":"관객석에서 박수가 들렸다. 짝. 아주 작았지만 진짜 박수였다. 짝, 짝. 색이 돌아오고 음식 냄새가 살아났다. LUNE의 기타 줄이 떨렸다. 딩."},{"s":"yeon","x":"happy","t":"박수…."},{"s":"crow","x":"base","t":"불완전한 것들이…."},{"s":"n","t":"까마귀의 표정이 처음으로 일그러졌다. 붉은 눈이 흔들렸다.","tone":"dark"},{"s":"yeon","x":"talk","t":"한 번 더."},{"s":"moka","x":"p2","t":"네."},{"s":"n","bgm":"novaRider","t":"둘은 동시에 숨을 들이켰다. 흐려졌던 조명 위로 붉은 기운이 번지기 시작했다."},{"s":"yeon","t":"꺼내, 꺼내, 숨겨둔 마음도 꺼내."},{"s":"moka","x":"p3","t":"작아도 내 목소리, 흔들려도 내 story."},{"s":"yeon","t":"맛을 잃은 밤에도, 작은 불을 켜."},{"s":"moka","x":"p1","t":"말라버린 무대 위, 내 첫 줄을 세워."},{"s":"n","fx":"burst","t":"둘의 목소리가 겹쳤다. 전문적이지는 않았지만 살아 있었다. 무대 위에 붉고 따뜻한 원이 펼쳐지며 두 글자가 다시 떠올랐다.","im":true},{"s":"neo","t":"[丁未]다. 丁은 연이의 목소리 끝에서 피어나고, 未는 모카의 노트와 무대 바닥에서 받치고 있다. 식신이 처음으로 깨어나고 있다."},{"s":"neo","t":"연이. 계속해라. 멈추면 꺼진다."},{"s":"n","t":"까마귀는 다시 도장을 들고 있었다. 봉인진은 아직 절반 가까이 내려온 상태였다.","tone":"dark"},{"s":"crow","x":"alt","t":"다음에는 완전히 지워주마."},{"s":"sys","t":"[표현 봉쇄 진행률: 52%]","im":true},{"s":"n","t":"위기는 끝나지 않았다. 오히려 이제부터 시작이었다. 하지만 연이는 더 이상 무대 아래에 있지 않았고, 모카도 더 이상 관객이 아니었다. 둘은 불완전한 노래와 랩으로, 그러나 분명 자기 목소리로 무대 위에 있었다."},{"s":"yeon","x":"happy","t":"모카. 우리 지금 아이돌 같아?"},{"s":"moka","x":"base","t":"솔직히 아직은 축제 장기자랑에 가까운데요."},{"s":"yeon","t":"정확해서 아프네."},{"s":"moka","x":"moved","t":"근데 후렴은 조금 아이돌 같아요."},{"s":"yeon","t":"좋아. 데뷔전 1절은 통과라 치자."},{"s":"n","t":"연이는 곁눈으로 네오를 봤다. 아까부터 까마귀를 응시하는 네오의 눈이 평소보다 차갑게 가라앉아 있었다."},{"s":"yeon","t":"네오. 저 까마귀 말이야. 왜 하필 만드는 걸 이렇게 싫어하는 거야?"},{"s":"neo","t":"저건 그냥 훼방꾼이 아니다. 저 도장, 밥그릇을 엎는 손이다."},{"s":"yeon","t":"밥그릇을 엎어? 무슨 소리야."},{"s":"neo","t":"편인. 그리고 도식. 밥그릇을 엎는 별, 재능을 갉아먹는 그림자."},{"s":"crow","x":"base","t":"…눈치가 빠른 사자로군."},{"s":"n","t":"까마귀가 처음으로 이름을 인정하듯 붉은 눈을 가늘게 접었다.","tone":"dark"},{"s":"crow","t":"식신은 밥을 짓는 별. 나는 그 밥그릇을 엎는 별. 우리는 처음부터 상극이다."},{"s":"yeon","t":"밥그릇을 엎어? 여긴 먹는 섬이라고. 내 앞에서 밥 얘기 잘못 꺼냈어."},{"s":"neo","t":"연이. 도식은 재능이 가장 빛나기 직전에 그것을 엎는다. 데뷔 직전, 완성 직전, 무대에 오르기 직전. 정확히 지금 같은 순간을 노린다."},{"s":"yeon","x":"talk","t":"…그래서 하필 데뷔전에 나타났구나."},{"s":"n","t":"연이는 무대 바닥의 [丁未]를 내려다봤다. 밥그릇을 엎으려는 별 앞에서, 작은 불과 그것을 받치는 흙은 여전히 꺼지지 않고 있었다."},{"s":"yeon","t":"모카. 남은 절반, 끝까지 가보자. 이 밥그릇, 절대 안 내줘."},{"s":"moka","x":"p2","t":"네. 오늘 우리 데뷔전, 끝까지 세워요."},{"s":"n","fx":"burst","t":"연이가 마이크 앞으로 한 걸음 다가갔다. 모카가 옆에 섰다. 작은 불씨가 무대 위에서 꺼지지 않기 위해 다시 타오르기 시작했다.","im":true},{"s":"sys","bgm":"gloom","t":"제10화 끝 · 데뷔전(前) — 까마귀의 정체는 편인·도식, 밥그릇을 엎는 별. 봉쇄율 52%, 무대는 이제 후반전으로.","im":true}]});
EPISODES.push({"no":"EP.11","tag":"제11화 · 재능을 먹는 그림자","title":"재능을 먹는 그림자","beats":[{"s":"sys","bg":"siksangCrisis","bgm":"crisis","l":{"who":"yeon","x":"talk"},"c":{"who":"moka","x":"p1"},"r":{"who":"crow","x":"alt"},"t":"제11화 · 식신·상관의 섬 — 회색으로 굳어가는 무대 위. 표현 봉쇄 진행률 61%.","im":true},{"s":"n","t":"꺼내, 꺼내, 숨겨둔 마음도 꺼내. 연이의 목소리가 무대 위로 퍼졌다. 잘 다듬어진 소리는 아니었다. 살짝 떨렸고, 숨도 모자랐다. 무엇보다 노래하는 본인이 제일 당황하고 있었다."},{"s":"yeon","t":"(왜 하필 클라이맥스에서 숨이 딸리냐고… 폐활량아 정신 차려.)"},{"s":"n","t":"하지만 사라지지는 않았다. 떨리는 채로, 그 소리는 무대 위에 남았다."},{"s":"moka","x":"base","t":"작아도 내 목소리, 흔들려도 내 story. yo, 연이 위에 나 얹는다."},{"s":"n","t":"모카가 그 위에 랩을 얹었다. 둘의 목소리가 처음으로 겹쳤다. 전문적이지도 완벽하지도 않았지만 살아 있었고, 그 불완전한 목소리가 회색 무대에 작은 틈을 냈다."},{"s":"n","t":"굳어가던 조명에 희미한 색이 한 방울 번지고, 달빛 크림빵 가게에서 약한 단 냄새가 피어올랐다."},{"s":"yeon","x":"talk","t":"봐! 봐봐, 색 돌아온다! 우리 되고 있어!"},{"s":"n","t":"관객석 앞줄의 아이가 손뼉을 치려 했다. 하지만 소리는 나지 않았다. 두 손이 닿기 직전, 보이지 않는 벽에 막힌 듯 떨었다."},{"s":"yeon","t":"…박수도 못 치게 막는 거야?"},{"s":"n","t":"연이는 이를 악물었다. 목 안에서 조금 전의 노래가 식어갔다."},{"s":"neo","t":"박수는 소리가 아니라 반응이다. …저 봉인은 반응 자체를 누르고 있다."},{"s":"n","t":"무대 아래 네오의 목소리가 낮게 올라왔다. 무대 위 하늘엔 아직 검은 글자들이 떠 있었다."},{"s":"sys","t":"[무언] [무작] [무미] [무색] [무동] — 말 없음. 만듦 없음. 맛 없음. 색 없음. 움직임 없음.","im":true},{"s":"neo","t":"식신·상관의 섬에서 밖으로 나오려는 모든 것이, 저 다섯 글자에 눌리고 있다."},{"s":"n","t":"모카는 노트를 품에 안고 있었다. 글자들은 조금 돌아왔지만, 여전히 흐릿했다."},{"s":"moka","x":"p2","t":"완성 전이라도 난 여기 있어, 초안이어도 난 안 지워. 내가 쓴 줄 위에 내가 서."},{"s":"n","t":"그 순간 무대 위 흙빛 원이 조금 넓어졌다. 따뜻한 흙빛이 바닥에 번졌다."},{"s":"sys","t":"[未] — 정미(丁未)의 땅이 깨어난다. 작은 불이 설 자리.","im":true},{"s":"n","t":"연이의 가슴 안쪽에서 작은 불씨가 뛰었다."},{"s":"neo","t":"계속해라. 丁이 未 위에 서기 시작했다."},{"s":"yeon","t":"그럼 되는 거야? 이대로 밀면 이기는 거야?"},{"s":"neo","t":"…아직은."},{"s":"yeon","t":"'아직은'이라는 말 진짜 싫다니까. 사자야 너 그 단어 너무 좋아해."},{"s":"n","t":"그때, 무대 중앙 위의 그림자가 웃었다. 검은 연미복, 붉은 도장을 쥔 손은 하얗고 차가웠다."},{"s":"crow","x":"base","t":"불완전한 표현. 정리되지 않은 말. 훈련되지 않은 목소리. 가치가 검증되지 않은 무대."},{"s":"n","t":"쾅, 쾅, 쾅. 세 글자가 하늘에 못처럼 박혔다."},{"s":"sys","t":"[불완전] [미숙] [무가치]","im":true},{"s":"n","t":"무대 위 공기가 더 무거워졌다. 모카의 노트가 다시 흐려지고, 관객석의 손끝도 멈췄다."},{"s":"crow","t":"표현은… 완성된 자에게만 허락되어야 한다."},{"s":"n","t":"연이는 눈을 크게 떴다. 그 말은 단순히 입을 막는 말보다 더 위험했다."},{"s":"yeon","x":"talk","t":"(노래하지 말라는 게 아니야. …잘할 때까지 하지 말라는 거잖아. 완벽해질 때까지, 검증될 때까지, 그 전엔 조용히 있으라는 말.)"},{"s":"moka","x":"base","t":"완성된 자에게만…… 그럼 저는……."},{"s":"n","t":"모카의 얼굴이 창백해졌다. 노트를 쥔 손이 떨렸다."},{"s":"crow","t":"너는 아직 아니다."},{"s":"n","t":"까마귀의 말은 정확히 모카의 약한 곳을 찔렀다. 아직 무명, 아직 데뷔 전, 아직 무대 위에 설 자격이 없다는 말."},{"s":"n","t":"모카의 노트에서 글자가 사라지기 시작했다. 흐려지는 게 아니라, 처음부터 없었던 것처럼 비어갔다."},{"s":"moka","x":"moved","t":"안 돼……."},{"s":"yeon","x":"talk","t":"모카!"},{"s":"n","t":"연이는 급히 그의 노트를 붙잡았다. 노트 한 장이 완전히 하얗게 변했다. 원래 모카가 백 번 넘게 고친 후렴이 적혀 있던 자리엔, 이제 아무것도 없었다."},{"s":"moka","t":"저…… 이거 기억 안 나요. 분명 썼는데."},{"s":"yeon","t":"뭐?"},{"s":"moka","t":"어떤 라임이었는지, 어떤 박자였는지, 왜 고쳤는지…… 하나도 기억이 안 나요."},{"s":"crow","t":"미완성은… 보존할 가치가 없다."},{"s":"n","fx":"ink","t":"그가 도장을 다시 찍었다. 붉은 글자가 노트 위로 내려왔다."},{"s":"sys","t":"[백지화]","im":true},{"s":"n","t":"백지화는 멈추지 않았다. 첫 줄, 두 번째 줄, 지운 흔적, 낙서, 연습한 라임— 모카가 혼자 밤새 썼던 모든 초안들이 하얗게 지워졌다."},{"s":"moka","x":"moved","t":"내가…… 썼던 건데."},{"s":"n","t":"모카의 눈에서 눈물이 떨어져 흰 페이지에 번졌다. 그마저 곧 마르며, 자국도 없이 사라졌다."},{"s":"n","t":"그 순간, 무대 아래 네오의 눈이 크게 흔들렸다. 그는 도장과 노트와 무대 바닥의 정미를 번갈아 보았다."},{"s":"neo","t":"저 스킬은……."},{"s":"n","t":"처음으로 네오의 목소리에 당황이 섞였다. 갈기가 낮게 타올랐다."},{"s":"yeon","x":"talk","t":"왜? 사자야, 너 지금 표정 왜 그래?"},{"s":"neo","t":"편인도식(偏印倒食)……?!"},{"s":"yeon","t":"뭐? 그거 무슨 신기술 이름이야? 발음도 어려워."},{"s":"moka","x":"base","t":"그, 그게 뭔데요?"},{"s":"neo","t":"식신은 먹고, 만들고, 표현하고, 결과로 남기는 힘이다. 이 섬의 밥줄이지."},{"s":"neo","t":"그런데 편인이 지나치게 강하면… 그 식신을 잡아먹는다."},{"s":"yeon","t":"잡아…먹어? 밥그릇을 통째로?"},{"s":"neo","t":"생각이 너무 많아져서 만들지 못하고, 평가가 너무 앞서서 말하지 못하고, 완벽해야 한다는 압박이 초안을 죽인다. 그게 편인도식이다."},{"s":"n","t":"연이는 까마귀를 보았다. 까마귀는 조용히 웃고 있었다."},{"s":"yeon","x":"talk","t":"…처음부터 입을 막으려던 게 아니었구나. 말이 나오기 전에, 아예 죽이는 거였어."},{"s":"neo","t":"정확하다. 식신의 밥그릇을 엎는 기술. 이 섬엔 최악의 상성이다."},{"s":"crow","x":"alt","t":"정확하군, 가디언."},{"s":"n","t":"까마귀의 붉은 눈이 네오를 스쳤다. 그 호칭에 모카의 눈이 흔들렸다."},{"s":"moka","t":"가디언……? 네오 씨가?"},{"s":"n","t":"모카의 노트가 다시 하얗게 변했다. 이번엔 몇 장이 동시에 지워졌다."},{"s":"moka","x":"moved","t":"그만…… 제발 그만……."},{"s":"crow","t":"미완성은 불안이다. 불안은 혼란이다. 혼란은… 침묵으로 다스려야 한다."},{"s":"n","fx":"ink","t":"쾅, 쾅, 쾅. 세 글자가 모카의 노트와 무대 위의 未를 동시에 짓눌렀다."},{"s":"sys","t":"[삭제] [검열] [무표현]","im":true},{"s":"n","t":"무대 바닥의 흙빛 원에 금이 갔다. 연이의 가슴 안쪽 丁도 작아졌다. 불이 설 땅이 말라갔다."},{"s":"neo","t":"위험하다."},{"s":"yeon","x":"talk","t":"왜! 뭐가 위험한데!"},{"s":"neo","t":"丁은 작은 불씨, 未는 그 불씨가 남을 땅이다. 그런데 저자가 未를 백지화하고 있다."},{"s":"yeon","t":"그러면?"},{"s":"neo","t":"불이 떠 있어도… 오래 못 간다. 땅이 사라지면 불도 꺼진다."},{"s":"n","t":"연이는 하얗게 변해가는 페이지를 봤다. 그건 가사 몇 줄이 아니라, 모카가 포기하지 않았던 시간들이었다. 도저히 참을 수 없었다."},{"s":"yeon","t":"야."},{"s":"n","t":"까마귀의 눈이 연이를 향했다. 연이는 앞발을 무대 바닥에 디뎠다."},{"s":"yeon","t":"미완성은 가치가 없다고?"},{"s":"crow","x":"base","t":"그렇다. 세상은… 완성된 것만 기억한다."},{"s":"yeon","t":"그럼 처음은? 처음 쓴 문장, 처음 부른 노래, 처음 틀린 박자."},{"s":"n","t":"연이는 한 걸음 앞으로 나아가, 짧은 다리로 흙빛 원을 밟았다."},{"s":"yeon","t":"처음부터 완성된 게, 세상에 어디 있는데?"},{"s":"n","fx":"claw","t":"丁의 불꽃이 튀었다. 하지만 [무가치]가 눌렀다. 불꽃은 커지다 다시 작아졌다."},{"s":"crow","x":"alt","t":"불완전한 말은 상처를, 불완전한 창작은 실패를, 불완전한 무대는… 조롱을 만든다."},{"s":"n","t":"검은 말풍선들이 다시 관객석 위로 떠올랐다."},{"s":"sys","t":"[못한다.] [어설프다.] [민망하다.] [그만해.] [준비하고 나와.]","im":true},{"s":"n","t":"관객들은 그 말풍선을 볼 수 있었지만 반응할 수 없었다. 응원하고 싶은데 손이 안 움직이는 눈빛, 외치고 싶은데 목이 굳은 눈빛만 흔들렸다. 완전한 정적보다 더 절망적이었다."},{"s":"n","t":"연이의 목도 답답해졌다. 조금 전까지 작게나마 노래가 나왔는데, 이번엔 입을 열수록 부끄러움이 먼저 올라왔다."},{"s":"yeon","x":"talk","t":"(내가 뭘 안다고 노래해? 무슨 아이돌이라고… 꽃돼지 상태로? 민망하게?)"},{"s":"n","t":"까마귀의 봉인은 소리를 막는 게 아니라, 스스로 표현을 부끄러워하게 만들고 있었다. 밖에서 막는 게 아니라, 안에서 스스로 지우게 하는 것. 그것이 편인도식의 진짜 얼굴이었다."},{"s":"yeon","t":"진짜…… 악질이네."},{"s":"n","t":"목소리가 겨우 나왔다. 사포에 긁힌 것 같았다."},{"s":"moka","x":"moved","t":"연이…… 저, 다음 줄이 안 나와요."},{"s":"n","t":"그 말이 너무 작았다. 다음 줄이 안 나온다는 건, 식신·상관의 섬에서 가장 무서운 말이었다."},{"s":"n","t":"연이는 모카의 눈을 봤다. 두려움 아래 더 깊은 곳에 상실감이 있었다. 무대가 무서운 게 아니라, 자기 안에 있던 말이 사라지는 것이 무서운 것이다."},{"s":"yeon","x":"talk","t":"모카. 남아 있는 줄, 있어?"},{"s":"n","t":"모카는 떨리는 손으로 노트를 넘겼다. 거의 모든 페이지가 하얗게 비어 있었다. 그러다 마지막 부분에서, 아주 희미한 한 줄이 남아 있었다."},{"s":"sys","t":"[나는 모카.]","im":true},{"s":"moka","t":"이것밖에……. 이거 하나 남았어요."},{"s":"yeon","t":"…그거면 돼. 그거, 처음 줄이잖아."},{"s":"moka","t":"네?"},{"s":"n","t":"연이는 목이 조여오는 걸 느끼면서도 말했다."},{"s":"yeon","t":"네가 누군지 남아 있으면, 다음 줄은 다시 쓸 수 있어."},{"s":"n","t":"모카의 손이 노트를 더 세게 붙잡았다."},{"s":"crow","x":"base","t":"그 한 줄로… 무엇을 할 수 있지?"},{"s":"n","t":"연이는 대답하려 했다. 하지만 [무언]이 목을 조였다. 목 안이 종이처럼 말랐다."},{"s":"yeon","x":"talk","t":"아……."},{"s":"sys","bg":"siksangNight","bgm":"gloom","tone":"dark","t":"[표현 봉쇄 진행률: 68%]","im":true},{"s":"n","t":"공중의 숫자가 올라갔다. 봉인진이 더 낮게 내려앉고, 달빛 크림빵은 완전히 회색이 됐다."},{"s":"n","t":"LUNE의 기타 줄이 투명해지고, BAMBI의 목소리는 목에 갇히고, SOLV의 마이크엔 검은 금이 갔다. DEST1NOVA조차 다시 멈추고 있었다."},{"s":"moka","x":"moved","t":"제가…… 해야 해요? 저 혼자?"},{"s":"n","t":"연이는 대답하고 싶었다. 하지만 목소리가 나오지 않았다. 답답함이 명치까지 차올랐다."},{"s":"n","t":"무대 아래에서 네오가 한 걸음 움직였다. 하지만 무대 위로는 오르지 않았다."},{"s":"n","t":"이 무대만큼은 연이와 모카가 직접 표현해야 한다는 걸 알고 있었다. 그가 대신 나서면 정미는 끝내 깨어나지 않는다. 그래서 참고 있었다. 하지만 상황은 점점 나빠지고 있었다."},{"s":"sys","tone":"dark","t":"[표현 봉쇄 진행률: 72%]","im":true},{"s":"crow","x":"alt","t":"이제, 마지막으로 남은 이름도 지우겠다."},{"s":"n","t":"붉은 도장이 모카의 노트를 향했다."},{"s":"sys","t":"[무명]","im":true},{"s":"n","t":"그 글자가 노트에 닿으면— 마지막 한 줄, [나는 모카.] 그마저 사라진다."},{"s":"moka","x":"moved","t":"안 돼……!"},{"s":"n","fx":"hands","t":"연이는 몸을 움직이려 했다. 하지만 [무동]이 짧은 다리를 무대 바닥에 못 박았다."},{"s":"n","t":"[무언]은 목을, [무작]은 앞발을, [무미]는 가슴 속 식신 감각을, [무색]은 정미의 불꽃마저 흐리게 만들었다."},{"s":"yeon","x":"talk","t":"(움직여… 움직이라고, 이 짧은 다리야…!)"},{"s":"n","fx":"ink","t":"모카의 노트 위로 [무명]이 천천히 내려왔다. 모카는 눈을 질끈 감았다."},{"s":"moka","t":"나는……. 나는……."},{"s":"n","t":"하지만 다음 말이 나오지 않았다."},{"s":"crow","t":"그래. 너는… 아무도 아니다."},{"s":"n","tone":"dark","t":"[무명]이 마지막 한 줄에 닿기 직전—"},{"s":"sys","bgm":"crisis2","t":"쨍—! 금빛이 무대 아래에서 터졌다.","im":true},{"s":"n","fx":"burst","tone":"desat","t":"[무명]의 글자가 허공에서 멈췄다. 까마귀의 붉은 눈이 처음으로 크게 흔들렸다."},{"s":"n","c":{"who":"neo"},"t":"무대 아래, 네오가 서 있었다. 작은 사자의 갈기가 조용히 타올랐다. 장난기도 귀찮음도 사라진 눈은 낮고 깊었다. 사주의 강처럼."},{"s":"yeon","x":"talk","t":"네오……?"},{"s":"n","t":"네오는 그녀를 보지 않았다. 시선은 까마귀에게 고정되어 있었다."},{"s":"neo","t":"여기까지다."},{"s":"crow","x":"base","t":"…가디언."},{"s":"moka","t":"진짜…… 가디언……?"},{"s":"n","fx":"burst","t":"네오의 발밑에 금빛 문양이 퍼졌다. 비겁의 섬에서 봤던 것보다 훨씬 크고 오래된 문양이었다."},{"s":"n","t":"사주의 강을 떠다니던 간지의 글자들이 한순간 네오의 발밑으로 모였다. 갑자, 을축, 병인, 정묘— 수많은 글자들이 금빛 원을 이루었다."},{"s":"neo","t":"나는 원래, 무대에 설 존재가 아니다. 표현은 너희가 해야 한다. 나는 길을 열 뿐이다."},{"s":"n","fx":"claw","t":"그는 한 걸음 무대 위로 올라섰다. [무동]이 묶으려 했지만, 금빛 발톱이 바닥을 그었다. 쨍— 봉인이 갈라졌다."},{"s":"neo","t":"하지만. 길조차 닫히면… 이야기가 다르다."},{"s":"n","t":"무대 전체가 금빛으로 흔들렸다. 까마귀의 얼굴이 굳었다."},{"s":"crow","x":"alt","t":"너는… 나서면 안 된다."},{"s":"neo","t":"나도 알고 있다."},{"s":"n","t":"그 말은 이상했다. 마치 네오가 나서는 것 자체가, 어떤 규칙을 건드리는 일인 것처럼 들렸다."},{"s":"yeon","x":"talk","t":"네오, 너…… 대체 뭘 대가로 나선 거야?"},{"s":"n","t":"네오는 아주 짧게 그녀를 돌아봤다. 눈빛이 평소보다 훨씬 진지했다."},{"s":"neo","t":"어쩔 수 없군. 이번 한 번만이다."},{"s":"n","fx":"burst","t":"네오가 무대 중앙으로 걸어 나왔다. 그 뒤로 아주 짧은 순간, 달 조명보다 큰 사자의 그림자가 일어섰다. 갈기는 태양처럼 타올랐고, 눈동자는 오래된 별처럼 빛났다."},{"s":"n","t":"관객들은 박수도 환호도 못 했다. 하지만 모두의 눈빛이 흔들렸다. 그 눈빛만은 아직 지워지지 않았다."},{"s":"moka","x":"base","t":"저게…… 진짜 사자였어……."},{"s":"crow","x":"base","t":"네가 왜 아직……."},{"s":"n","t":"까마귀의 손이 떨렸다. 그 말은 끝나지 않았다."},{"s":"n","fx":"claw","t":"네오가 앞발을 들어 올렸다. 금빛 발톱 끝에 사주의 글자들이 모였다."},{"s":"neo","t":"사주성광(四柱星光)."},{"s":"n","fx":"burst","t":"작은 칼날이 아니었다. 무대 전체를 가르는 금빛 선. 닫힌 길을 다시 여는 빛."},{"s":"neo","t":"연이. 모카."},{"s":"n","t":"연이는 간신히, 모카는 떨리는 눈으로 고개를 들었다."},{"s":"neo","t":"내가 봉인을 잠시 가른다. 그 사이— 너희가 다시 꺼내라."},{"s":"n","fx":"burst","tone":"desat","t":"금빛이 폭발했다. [무언]에 금이 가고, [무명]이 흔들리고, 꺼질 듯한 丁未가 다시 작게 빛났다."},{"s":"yeon","x":"talk","t":"목이…… 목이 트인다!"},{"s":"n","t":"연이는 크게 숨을 들이켰다. 종이처럼 말랐던 목에 다시 공기가 돌았다. 하지만 그 순간 깨달았다. 목이 열려도, 무엇을 꺼내야 할지 모르면 소용없다는 것을."},{"s":"neo","t":"길은 열었다. 오래 못 간다. 저 도식을 이기는 건, 내 발톱이 아니야."},{"s":"yeon","t":"그럼 뭔데! 뭘로 이겨!"},{"s":"neo","t":"생각해라, 연이. 저자는 '완성'을 무기로 쓴다. 완성되지 않은 건 전부 지운다."},{"s":"neo","t":"그렇다면— 저자가 절대 못 지우는 건 뭐지?"},{"s":"n","t":"연이의 머릿속에서, 조금 전 자기가 뱉은 말이 되돌아왔다. 처음부터 완성된 게 어디 있느냐던 그 말."},{"s":"yeon","x":"talk","t":"…초안."},{"s":"neo","t":"계속해라."},{"s":"yeon","t":"완성은 지울 수 있어. 근데 초안은— 지워도 또 써지잖아. 진심은, 몇 번이든 다시 나오잖아."},{"s":"n","t":"연이의 가슴 안쪽에서 丁의 불씨가 탁, 하고 다시 뛰었다."},{"s":"neo","t":"그게 식상(食傷)이다. 잘 다듬은 결과물이 아니라, 안에서 밖으로 나오려는 힘 자체."},{"s":"neo","t":"편인도식은 '완성'을 심판한다. 하지만 심판할 수 없는 게 하나 있다. 처음 꺼내는 진심."},{"s":"yeon","x":"talk","t":"그러니까 우리가 잘해서 이기는 게 아니라— 부끄러운 채로, 어설픈 채로, 그냥 꺼내버리면 되는 거야?"},{"s":"neo","t":"그래. 완벽하게 부르지 마라. 진심으로 불러라. 그게 저 봉인을 깨는 유일한 카운터다."},{"s":"n","t":"연이는 모카를 돌아봤다. 노트를 끌어안은 채였지만, 눈빛이 조금 달라져 있었다."},{"s":"moka","x":"base","t":"…연이. 방금 그 말, 나 라임 떠올랐어요."},{"s":"yeon","t":"뭔데?"},{"s":"moka","t":"초안이어도 진심이면, 지워져도 진심이면— yo, 미완성이 우리 무기라면."},{"s":"n","t":"모카의 흐릿하던 노트 위에, 방금 뱉은 그 한 줄이 스스로 새겨졌다. 지워지지 않는 진한 글씨로."},{"s":"sys","t":"[나는 모카.] 아래에 새 줄이 돋았다. — 초안이어도, 진심.","im":true},{"s":"crow","x":"alt","fx":"ink","t":"…무엇을 쓰든 소용없다. 완성되지 않으면, 나는 전부 지운다."},{"s":"yeon","x":"talk","t":"그래, 지워. 근데 우린 또 쓸 거야. 니가 지우는 속도보다, 우리가 진심 꺼내는 속도가 더 빠를걸?"},{"s":"n","t":"연이의 목소리가, 처음으로 떨리지 않았다. 부끄러움은 아직 남았지만, 그걸 그냥 안고 소리를 냈다."},{"s":"n","fx":"burst","t":"무대 바닥의 흙빛 원이, 이번엔 갈라지지 않고 넓어졌다. 丁이 未 위에 단단히 발을 디뎠다."},{"s":"neo","t":"…불이 땅을 잡았다. 이제 봉인이 아니라, 너희가 진행률을 밀 차례다."},{"s":"sys","bgm":"crisis2","t":"[표현 봉쇄 진행률: 72% → 역전 시작] — 식상 반격, 개방.","im":true},{"s":"n","t":"까마귀의 그림자가 처음으로 뒤로 한 발 물러났다. 붉은 도장을 쥔 손이 미세하게 떨렸다."},{"s":"crow","x":"base","t":"…재능을 먹는 그림자에게, 겁도 없이."},{"s":"yeon","x":"happy","t":"겁? 나 이미 꽃돼지야. 더 부끄러울 것도 없어. 자, 모카— 처음부터 다시 가자."},{"s":"n","t":"네오의 발톱이 무대 중앙에 금빛 선을 그어, 봉인 아래로 좁은 무대 하나를 열어놓았다."},{"s":"neo","t":"딱 한 곡 분량이다. 이 안에서 다 꺼내라. 남기지 말고."},{"s":"n","t":"연이는 크게 숨을 들이켰다. 모카는 노트를 펼쳤다. 두 사람의 눈이, 오랜만에 같은 곳을 봤다."},{"s":"n","t":"식신·상관의 섬, 최후의 무대가 열리기 직전이었다. 완성이 아니라, 진심으로 여는 무대가."},{"s":"sys","t":"다음 화 · 제12화 — 최후의 무대. 초안이어도, 어설퍼도, 끝까지 꺼내라.","im":true}]});
EPISODES.push({"no":"EP.12","tag":"제12화 · 첫 줄의 무대","title":"첫 줄의 무대","beats":[{"s":"n","bg":"siksangBattle","bgm":"crisis2","l":{"who":"yeon"},"c":{"who":"neo"},"r":{"who":"crow","x":"alt"},"t":"금빛이 무대를 갈랐다. 네오의 발톱 끝에서 뻗어나간 빛이, 무대를 뒤덮은 검은 봉인들을 한순간에 밀어냈다.","im":true,"fx":"claw"},{"s":"n","t":"[무언]. [무작]. [무미]. [무색]. [무동]. 그리고 까마귀가 찍어놓은 편인도식의 붉은 도장들. 그 모든 글자에 금이 갔다."},{"s":"n","t":"쨍. 쨍. 쨍. 완전히 깨진 건 아니었다. 찢어진 틈이 생겼을 뿐이었다.","fx":"burst"},{"s":"n","t":"네오의 갈기가 금빛으로 타올랐다. 그 작은 몸 뒤로, 무대를 통째로 덮을 만큼 거대한 사자의 그림자가 떠올라 있었다.","im":true},{"s":"n","t":"갈기는 태양처럼 타올랐고, 눈동자는 오래된 별처럼 빛났다."},{"s":"moka","c":{"who":"moka","x":"moved"},"t":"저게…… 진짜 네오님이에요?"},{"s":"n","t":"연이는 말없이 네오를 바라봤다. 평소의 딱딱하고 건방진 작은 사자가 아니었다. 사주의 강이 잠깐 몸을 빌려 무대에 선 것 같았다."},{"s":"crow","r":{"who":"crow","x":"alt"},"t":"너는 나서면 안 된다."},{"s":"neo","c":{"who":"neo"},"t":"나도 알고 있다."},{"s":"n","t":"네오는 이를 악물고 금빛 발톱을 더 깊게 내리그었다. 무대 위에 닫혀 있던 길이 갈라졌다.","fx":"claw"},{"s":"neo","t":"그러니 오래 버티지 않는다."},{"s":"n","t":"공중에 금빛 문장이 떠올랐다. [표현 경로 임시 개방]. [제한 시간: 3분].","im":true},{"s":"yeon","t":"3분?"},{"s":"neo","t":"그 안에 해라."},{"s":"yeon","t":"뭘?"},{"s":"neo","t":"너희가 하려던 것. 표현해라."},{"s":"n","t":"그 말이 떨어지자, 연이의 목을 조이던 [무언]에 금이 갔다. 모카의 노트를 덮던 [무명]도 잠깐 멈췄고, 사라져가던 마지막 한 줄이 희미하게 살아났다."},{"s":"n","t":"[나는 모카.]"},{"s":"moka","c":{"who":"moka","x":"base"},"t":"남아 있어…… 안 지워졌어."},{"s":"n","t":"연이는 가슴 안쪽을 느꼈다. 꺼질 듯 흔들리던 [丁]의 불씨가 다시 살아났고, 그 아래 [未]의 흙빛이 천천히 무대 바닥을 붙잡았다."},{"s":"n","t":"정미. 丁未. 불씨와, 그 불씨가 설 자리."},{"s":"neo","t":"연이. 모카. 편인도식은 생각과 평가로 식신을 먹어치우는 힘이다."},{"s":"n","t":"까마귀의 도장이 다시 붉게 빛났다. [검열]. [삭제]. [완벽].","fx":"claw"},{"s":"neo","t":"잘하려고 하면 잡아먹힌다."},{"s":"moka","x":"base","t":"그럼 어떻게 해야 해요?"},{"s":"neo","t":"꺼내라."},{"s":"yeon","t":"들었지? 일단 꺼내."},{"s":"n","t":"무대 위는 아직 반쯤 회색이었다. 관객은 박수를 치지 못했고, 함성도 나오지 않았다.","tone":"desat"},{"s":"n","t":"하지만 눈빛은 돌아오고 있었다. 응원하고 싶은데 손이 안 움직이는 눈빛. 맛과 색과 박자를 잃은 채, 누군가 다시 시작해주기를 기다리는 눈빛."},{"s":"n","t":"모카는 그 눈빛을 보았다. 그리고 조용히 입을 열었다."},{"s":"moka","x":"p1","t":"나는 모카."},{"s":"n","t":"그 한 줄은 랩이라기보다 자기소개에 가까웠다. 하지만 사라지지 않았다. 노트 위 글자가 더 선명해졌다."},{"s":"moka","t":"나는 모카."},{"s":"n","t":"연이가 옆에서 숨을 들이켰다. 그리고 선율을 얹었다."},{"s":"yeon","x":"talk","t":"꺼내, 꺼내, 숨겨둔 마음을 꺼내."},{"s":"n","t":"목소리는 여전히 조금 떨렸다. 하지만 이번엔 피하지 않았다."},{"s":"moka","x":"p2","t":"나는 모카, 아직 무명, 그래도 이름은 안 지워. 첫 줄 하나 남았다면, 다음 줄은 다시 써."},{"s":"n","t":"그 순간 [未]의 흙빛이 무대 바닥에 퍼졌다. 모카의 노트에서 글자 하나가 떨어져, 흙 알갱이가 되어 무대에 내려앉았다. 또 하나. 또 하나.","fx":"burst"},{"s":"n","t":"지워졌던 흔적이 돌아오지는 않았다. 대신 새로 쓴 글자들이 바닥에 쌓이기 시작했다. 미완성의 흙. 초안의 땅."},{"s":"n","t":"그 위에 연이의 [丁] 불씨가 내려앉았다. 작은 불꽃이 흔들렸지만 꺼지지 않았다."},{"s":"crow","x":"base","t":"쾅. 미숙."},{"s":"n","t":"붉은 글자 [미숙]이 둘을 향해 날아왔다. 연이는 마이크를 앞발로 꽉 눌렀다.","fx":"claw"},{"s":"yeon","x":"talk","t":"미숙한 거 맞아."},{"s":"n","t":"[미숙]이 멈칫했다. 연이는 고개를 들었다."},{"s":"yeon","t":"근데 미숙해서 지금 하는 거야. 안 하면 계속 미숙하니까."},{"s":"n","t":"불씨가 커졌다. [미숙]의 한 획이 불탔다. 치익.","fx":"burst"},{"s":"moka","x":"p3","t":"틀린 박자 위에 다시, 흔들린 숨 위에 다시, 오늘 못하면 내일도 해, 그래도 첫 줄은 여기 남기."},{"s":"n","t":"[미숙]이 갈라졌다. 그 순간 무대 끝, 기타를 안은 LUNE의 손가락이 움직였다. 줄 하나가 떨렸다. 딩. 정말 작은 소리였다."},{"s":"n","t":"LUNE의 눈이 번쩍 뜨였다. 그는 자신의 손을 내려다보고 웃었다. 입은 아직 자유롭지 않았지만, 눈빛만은 분명히 말하고 있었다. 살렸다."},{"s":"n","t":"LUNE이 다시 튕겼다. 딩. 틀린 코드였을지도 모른다. 하지만 그는 그것을 바로 다음 박자로 바꿨다. 딩딩. 딩. 멜로디가 생겼다."},{"s":"moka","x":"moved","t":"LUNE 님……!"},{"s":"yeon","x":"talk","t":"꺼내, 꺼내, 작은 소리도 꺼내."},{"s":"n","t":"곡이 아주 조금 아이돌 노래처럼 변했다. 관객들의 손끝이 떨렸다. 아직 박수는 못 쳤지만, 손가락 끝에 색이 돌아왔다.","fx":"heart"},{"s":"crow","x":"alt","t":"소용없다. 무미."},{"s":"n","t":"까마귀가 다시 도장을 찍었다. 음식 거리의 냄새가 죽어갔다. 달빛 크림빵은 회색이 되었고, 수프는 김을 잃었다.","tone":"desat","fx":"claw"},{"s":"n","t":"보컬 BAMBI의 눈동자가 흔들렸다. 그녀는 아직 노래하지 못했다."},{"s":"yeon","t":"BAMBI! 맛이 사라지는 거, 나 진짜 싫어!"},{"s":"n","t":"까마귀가 순간 멈칫했다. 연이는 아주 진지했다."},{"s":"yeon","t":"먹어도 아무 맛이 안 나는 건, 마음이 아무것도 못 느끼는 거랑 똑같잖아. 맛있으면 맛있다고 해야지."},{"s":"moka","x":"p1","t":"한입 먹고 살아나는 맛, 숨 막힌 날에 필요한 밥, 말 못 해도 몸은 알아, 따뜻한 건 마음을 살려."},{"s":"n","t":"그 순간 BAMBI가 숨을 들이켰다. 목을 감싸던 검은 봉인에 금이 갔다. 쨍.","fx":"burst"},{"s":"n","t":"BAMBI의 첫 음은 노래라기보다 숨이었다. 아……. 하지만 그 숨에 온기가 있었다. 회색으로 굳었던 크림빵에서 다시 희미한 냄새가 났다."},{"s":"n","t":"BAMBI가 눈을 감고 노래했다. 괜찮아, 처음 숨도 노래가 돼. 맛을 잃은 마음에도, 따뜻한 빛은 돌아와."},{"s":"n","t":"[무미]가 갈라졌다. 크림빵의 단 냄새가 돌아왔다. 구름솜 튀김이 다시 고소해졌다. 수프에 김이 올랐다.","fx":"burst"},{"s":"yeon","x":"happy","t":"아, 돌아왔다."},{"s":"n","t":"그 한마디에 [丁未]가 더 선명해졌다.","fx":"heart"},{"s":"crow","x":"alt","t":"식신이……."},{"s":"neo","c":{"who":"neo"},"t":"그래. 만들고 먹이고 살리는 힘이다."},{"s":"crow","t":"네가 길을 열었군."},{"s":"neo","t":"길은 열었을 뿐이다. 걷는 건 저들이다."},{"s":"n","t":"그 말에 연이의 가슴이 뜨거워졌다. 모카도 노트를 더 세게 잡았다. 노트의 글자들이 빠르게 되살아나고 있었다."},{"s":"n","t":"예전 문장이 그대로 돌아오는 건 아니었다. 새로운 줄이 생기고 있었다. 지금 무대 위에서. 바로 이 순간."},{"s":"n","t":"래퍼 SOLV가 마이크를 들어 올렸다. 그의 마이크에는 아직 검은 금이 있었다."},{"s":"crow","c":{"who":"crow","x":"alt"},"t":"무언."},{"s":"n","t":"까마귀가 바로 도장을 찍었다. SOLV의 입술이 다시 막히려 했다.","fx":"claw"},{"s":"moka","l":{"who":"yeon"},"c":{"who":"moka","x":"angry"},"r":{"who":"crow","x":"alt"},"t":"아니! SOLV 형의 말은 길이랬어!"},{"s":"n","t":"모카의 노트에서 은빛 글자가 떠올랐다. 그가 처음 SOLV 존에서 들은 문장. [말은 칼이 될 수도 있고, 길이 될 수도 있다.]"},{"s":"moka","t":"그럼 지금은 길이야!"},{"s":"yeon","x":"talk","t":"꺼내, 꺼내, 막힌 길도 다시 꺼내."},{"s":"moka","x":"p2","t":"닫힌 문 위에 첫 글자, 막힌 목 위에 내 박자, 무명이라도 말할 수 있어, 내 이름으로 길을 그어."},{"s":"n","t":"그 순간 SOLV의 눈빛이 번쩍였다. 마이크의 검은 금이 깨졌다. 쨍!","fx":"burst"},{"s":"n","t":"SOLV의 랩이 무대를 갈랐다. First line, break the frame, 이름 없는 밤도 make a name, 삼킨 말이 길이 될 때, 무대는 다시 숨을 쉬네."},{"s":"n","t":"관객석의 눈빛이 살아났다. 함성은 아직이었지만 입술들이 움직였다. 소리 없는 외침. 그 움직임만으로도 무대가 더 밝아졌다.","fx":"heart"},{"s":"crow","x":"alt","t":"무동."},{"s":"n","t":"까마귀가 다급히 도장을 찍었다. 댄서 RAVEN의 발이 다시 바닥에 묶였다. 이번엔 더 강했다. 그림자가 검은 사슬처럼 발목을 감았다.","tone":"dark","fx":"claw"},{"s":"crow","t":"몸짓은 말보다 위험하다. 몸은 거짓말을 하지 못하니까."},{"s":"n","t":"그 말과 함께 RAVEN의 그림자가 완전히 굳었다."},{"s":"yeon","t":"RAVEN까지 막히면……."},{"s":"neo","c":{"who":"neo"},"r":{"who":"crow","x":"alt"},"t":"무대의 몸이 닫힌다."},{"s":"n","t":"연이는 자기 몸을 내려다봤다. 짧은 다리. 둥근 몸. 꽃돼지. 방금 전까지 가장 민망했던 몸."},{"s":"n","t":"하지만 RAVEN 존에서 들은 말이 떠올랐다. 무대에서는 멋있는 것보다 멈추지 않는 게 먼저다."},{"s":"n","t":"연이는 이를 악물고 움직였다. 짧은 다리로 한 걸음. 통. 바닥이 반응했다. 다시 한 걸음. 딩.","fx":"burst"},{"s":"n","t":"흔들리는 몸. 어설픈 박자. 아이돌 댄스라기엔 너무 귀여운 움직임. 하지만 멈추지 않았다."},{"s":"yeon","x":"talk","t":"몸도 말한다며. 그럼 내 몸도 말하게 해볼게."},{"s":"n","t":"그녀는 앞발을 들어 올렸다. 통. 딩. 통. 딩. 식신·상관의 섬 바닥이 다시 반응했다. 처음 이 섬에 도착했을 때처럼. 통딩통딩.","fx":"burst"},{"s":"moka","l":{"who":"yeon"},"c":{"who":"moka","x":"p3"},"t":"통딩, 통딩, 꽃돼지 step in, 짧은 다리라도 멈추지 않지!"},{"s":"yeon","x":"talk","t":"너 방금 꽃돼지 스텝이라고 했어?"},{"s":"moka","x":"base","t":"죄송해요! 라임 때문에!"},{"s":"yeon","t":"나중에 이야기하자!"},{"s":"n","t":"하지만 박자는 살아났다. LUNE이 기타로 그 리듬을 받았고, BAMBI가 숨을 얹었고, SOLV가 랩으로 밀었다. 그리고 RAVEN의 그림자가 흔들렸다.","fx":"burst"},{"s":"n","t":"RAVEN이 천천히 고개를 들었다. 발끝이 바닥에서 떨어졌다. 쿵. 첫 박자. 쿵. 두 번째. 그리고 세 번째."},{"s":"n","t":"RAVEN의 몸이 회전했다. 검은 사슬이 꽃잎처럼 흩어졌다. 그가 무대 중앙을 가로질렀다. 그의 춤은 분명히 외치고 있었다. 나는 아직 움직인다.","fx":"vortex"},{"s":"n","t":"[무동]이 깨졌다. 쨍그랑! 네 명이 돌아왔다. SOLV. BAMBI. LUNE. RAVEN. DEST1NOVA가 다시 완성됐다.","im":true,"fx":"burst"},{"s":"n","t":"그 중심에는 연이와 모카의 어설픈 후렴이 있었다. 어설퍼서 시작된 노래. 미완성이라서 살아남은 무대."},{"s":"crow","c":{"who":"crow","x":"alt"},"t":"불완전한 것들이…… 어떻게……."},{"s":"yeon","t":"계속하니까."},{"s":"n","t":"모카가 노트를 펼쳤다. 이제 노트는 하얗지 않았다. 새로운 가사로 가득 차고 있었다."},{"s":"moka","l":{"who":"moka","x":"p1"},"r":null,"c":{"who":"crow","x":"alt"},"t":"망해도 다시 쓰고, 틀려도 다시 부르고, 막혀도 다시 두드리면, 처음은 결국 길이 돼."},{"s":"n","t":"그 순간 무대 위에 거대한 글자가 떠올랐다. [丁未]. 이제 흔들리지 않았다.","im":true,"fx":"heart"},{"s":"n","t":"丁의 불꽃은 작지만 선명했고, 未의 흙은 따뜻하고 단단했다. 작은 불이 흙 위에 서자, 무대 전체가 하나의 촛불처럼 빛났다."},{"s":"n","t":"무대 아래에서 네오가 무릎을 살짝 굽혔다. 금빛 틈을 유지하느라 힘이 빠진 듯했다."},{"s":"yeon","l":{"who":"yeon","x":"talk"},"t":"네오!"},{"s":"n","t":"까마귀는 마지막으로 도장을 높이 들었다. 붉은 도장이 아니라, 이제는 먹구름 같은 검은 도장이었다. 그 위에 글자가 떠올랐다. [편인도식].","tone":"dark"},{"s":"crow","c":{"who":"crow","x":"alt"},"t":"생각이 창작을 삼키고, 평가가 목소리를 삼키며, 두려움이 무대를 삼킨다."},{"s":"n","t":"검은 도장이 하늘에 찍혔다. [완성되지 않은 모든 표현을 삭제한다.] 거대한 검은 문장이 내려왔다. 아까와는 비교도 되지 않는 압력.","im":true,"tone":"dark","fx":"claw"},{"s":"n","t":"연이의 [丁未]가 흔들렸다. 모카의 노트가 다시 떨렸다. DEST1NOVA의 악기와 목소리와 몸도 동시에 눌렸다."},{"s":"crow","x":"alt","t":"완벽하지 않으면 사라져라!"},{"s":"n","t":"그 말에 무대 전체가 굳었다. 완벽하지 않으면. 그 문장이 너무 무거웠다.","tone":"desat"},{"s":"n","t":"모카의 랩도, 연이의 노래도, LUNE의 기타도, BAMBI의 숨도, SOLV의 첫 줄도, RAVEN의 발끝도, 모두 조금씩 흔들렸다."},{"s":"n","t":"세상에 완벽한 표현은 없었다. 그렇다면 전부 사라져야 하는가. 그 질문이 무대를 짓눌렀다. 연이는 숨을 삼켰지만 정답이 떠오르지 않았다."},{"s":"n","t":"그때, SOLV가 낮게 말했다. 완벽하지 않아도."},{"s":"n","t":"BAMBI가 이어 불렀다. 따뜻할 수 있어."},{"s":"n","t":"LUNE이 기타를 튕겼다. 틀려도."},{"s":"n","t":"RAVEN이 발을 디뎠다. 쿵. 움직일 수 있다."},{"s":"moka","x":"moved","t":"무명이어도."},{"s":"yeon","x":"talk","t":"나일 수 있어."},{"s":"n","bgm":"novaFlame","t":"그 순간 모두의 기운이 하나로 이어졌다. DEST1NOVA의 무대, 모카의 첫 줄, 연이의 정미, 네오가 열어둔 금빛 길. 전부 한곳에 모였다.","im":true,"fx":"heart"},{"s":"yeon","x":"talk","t":"다 같이."},{"s":"n","c":{"who":"neo"},"r":{"who":"crow","x":"alt"},"t":"네오가 금빛 틈을 마지막으로 넓혔다. 그리고 모두가 동시에 시작했다.","fx":"claw"},{"s":"n","t":"꺼내, 꺼내, 숨겨둔 마음을 꺼내. SOLV의 랩이 들어왔다. 완벽 전의 first line, 흔들려도 still shine."},{"s":"n","t":"BAMBI의 노래가 덮었다. 작은 숨도 노래가 돼, 따뜻하면 살아 있어. LUNE의 기타가 틀을 부쉈다. 딩! 틀린 코드도 우리 거야!","fx":"burst"},{"s":"n","t":"RAVEN의 춤이 봉인의 선을 갈랐다. 쿵. 쿵. 쿵.","fx":"vortex"},{"s":"moka","l":{"who":"yeon"},"c":{"who":"moka","x":"p3"},"r":{"who":"crow","x":"alt"},"t":"나는 모카, 아직 무명, 그래도 내 이름 안 지워!"},{"s":"yeon","x":"talk","t":"맛을 잃은 밤에도, 작은 불을 켜."},{"s":"n","t":"그 순간 [丁未]가 완전히 빛났다. 작은 불이 흙 위에서 타올랐다. 그 불은 폭발하지 않았다. 대신 번졌다.","im":true,"fx":"heart"},{"s":"n","t":"무대에서 관객석으로. 관객석에서 음식 거리로. 음식 거리에서 말놀이 골목으로. 골목에서 섬 전체로."},{"s":"n","t":"맛이 돌아왔다. 색이 돌아왔다. 몸이 돌아왔다. 글자가 돌아왔다."},{"s":"n","t":"그리고 마침내. 관객들의 손이 서로 닿았다. 짝! 첫 번째 박수. 이번엔 막히지 않았다. 짝짝짝!","fx":"burst"},{"s":"n","t":"함성도 돌아왔다. DEST1NOVA! 모카! 연이! 네오!"},{"s":"n","t":"네오는 함성을 들을 여유도 없이 금빛 틈을 유지하고 있었다. 그러나 그의 입가가 아주 조금 올라갔다."},{"s":"n","t":"까마귀의 [편인도식] 문장이 무대 위에서 불타기 시작했다. 치익. 치이익. 완성되지 않은 모든 표현을 삭제한다. 그 문장이 [丁未]의 불에 타들어갔다.","fx":"burst"},{"s":"yeon","x":"talk","t":"삭제 안 돼."},{"s":"moka","x":"p1","t":"아직 쓰는 중이니까."},{"s":"n","t":"SOLV가 낮게 랩했다. 미완성이라서 다음 줄이 있고. BAMBI가 노래했다. 다음 줄이 있어서 살아 있어."},{"s":"n","t":"LUNE이 웃었다. 그리고 틀리면 또 살리면 돼! RAVEN이 발을 찍었다. 멈추지 않으면 무대다."},{"s":"n","t":"[편인도식]이 산산조각났다. 까마귀의 검은 도장이 깨졌다. 쨍그랑!","im":true,"fx":"burst"},{"s":"crow","x":"alt","t":"불완전한 것들이……. 왜 사라지지 않는 거지……."},{"s":"n","t":"까마귀가 뒷걸음질쳤다. 그의 연미복이 검은 깃털로 흩어지기 시작했다.","fx":"vortex"},{"s":"yeon","x":"talk","t":"완성하려고 계속하니까."},{"s":"crow","t":"계속……."},{"s":"n","t":"그의 몸이 무너졌다. 검은 깃털들이 무대 위로 흩어졌다. 하지만 이번엔 바닥에 닿기도 전에, 따뜻한 불빛에 녹아 사라졌다.","fx":"vortex"},{"s":"n","t":"마지막으로 작은 깃털 하나가 남았다. 그 깃털은 이상하게도 완전히 검지 않았다. 끝부분에 희미한 회색빛이 있었다."},{"s":"crow","x":"base","t":"표현은…… 두려운 것이다……."},{"s":"yeon","t":"응."},{"s":"n","t":"무대가 조용해졌다."},{"s":"yeon","t":"그래도 해야 해."},{"s":"n","r":null,"t":"그 순간 마지막 깃털도 사라졌다.","fx":"heart"},{"s":"sys","t":"[식신·상관의 섬 정화 완료] · [편인도식 봉인 해제]","im":true},{"s":"sys","t":"[사주 글자 회수] · [時柱: 丁未]"},{"s":"sys","t":"[표현의 힘 개방: 작은 불씨의 무대] · [식신: 미완성을 기르고 남기는 힘] · [상관: 막힌 틀을 깨고 밖으로 꺼내는 힘]"},{"s":"n","t":"연이는 그 글자를 바라봤다. 가슴 안쪽으로 [丁未]가 스며들었다. 따뜻했다. 작은 불과 단단한 흙.","fx":"heart"},{"s":"n","t":"말이 사라지지 않도록 붙잡는 힘. 초안이 작품이 되도록 기다리는 힘. 맛을 되찾고, 몸을 움직이고, 말을 꺼내는 힘."},{"s":"yeon","t":"정미……."},{"s":"n","t":"연이는 가슴을 눌렀다. 머리 위 꽃에 작은 붉은 불빛이 붙었고, 꽃 아래로 따뜻한 흙빛 무늬가 생겼다."},{"s":"n","c":{"who":"moka","x":"moved"},"t":"모카는 노트를 내려다봤다. 하얗게 지워졌던 페이지들은 돌아오지 않았다. 하지만 이상하게 슬프지만은 않았다."},{"s":"n","t":"그 빈 페이지 위에 새로운 첫 줄이 떠올라 있었다. [나는 모카.] 그리고 그 아래. [아직 쓰는 중.]"},{"s":"n","t":"모카는 그것을 보고 한참 울었다."},{"s":"yeon","t":"좋은 제목이네."},{"s":"moka","t":"그러게요."},{"s":"n","bgm":"stillLake","t":"그때 네오가 한쪽 무릎을 꿇었다. 아니, 정확히는 네 발 중 하나가 살짝 무너졌다."},{"s":"yeon","x":"talk","c":{"who":"neo"},"t":"네오!"},{"s":"n","t":"연이는 깜짝 놀라 달려갔다. 거대한 사자의 그림자는 이미 사라져 있었다. 다시 작은 사자. 아니, 갈기 달린 고양이처럼 보이는 네오가 앉아 있었다."},{"s":"yeon","t":"괜찮아?"},{"s":"neo","t":"괜찮다."},{"s":"yeon","t":"거짓말하지 마."},{"s":"neo","t":"가디언은 쉽게 쓰러지지 않는다."},{"s":"yeon","t":"그 말 하는 애들이 꼭 쓰러지던데?"},{"s":"moka","c":{"who":"moka","x":"base"},"t":"네오님…… 방금 그 모습은 뭐였어요?"},{"s":"yeon","c":{"who":"neo"},"t":"맞아. 너 아까 되게 컸어. 달 조명보다 컸는데 착각은 무리야."},{"s":"neo","t":"착각이다."},{"s":"moka","c":{"who":"moka","x":"base"},"t":"관객들도 다 봤어요."},{"s":"n","t":"네오는 잠시 침묵했다. 그리고 아주 담담하게 말했다."},{"s":"neo","c":{"who":"neo"},"t":"무대 연출이다."},{"s":"yeon","t":"거짓말."},{"s":"moka","c":{"who":"moka","x":"angry"},"t":"거짓말."},{"s":"n","t":"연이와 모카가 동시에 외쳤다. 네오는 시선을 피했다. 그때 관객석에서 함성이 터졌다. DEST1NOVA! 모카! 연이! 그리고 조금 뒤. 네오!"},{"s":"n","c":{"who":"neo"},"t":"네오의 귀가 다시 미세하게 움직였다. 연이는 그걸 놓치지 않았다."},{"s":"yeon","t":"좋아하지 마."},{"s":"neo","t":"안 했다. 무대 상황이 정리됐는지 확인한 것뿐이다."},{"s":"yeon","t":"귀로?"},{"s":"neo","t":"그렇다."},{"s":"n","t":"연이는 웃음을 터뜨렸다."},{"s":"n","bg":"siksang","t":"무대 위, DEST1NOVA 멤버들이 다가왔다. SOLV가 모카의 어깨를 두드렸다. 좋은 첫 줄이었다."},{"s":"moka","c":{"who":"moka","x":"moved"},"t":"저…… 진짜 괜찮았나요?"},{"s":"n","t":"SOLV가 말했다. 괜찮은 정도는 넘었다. 모카는 그대로 굳었다. LUNE이 기타를 들고 웃었다. 우리 후렴도 생겼잖아. 꺼내, 꺼내!"},{"s":"n","t":"BAMBI가 연이를 보며 말했다. 연이의 목소리도 좋았어. 떨렸지만, 그래서 더 진짜였어."},{"s":"yeon","x":"happy","c":{"who":"neo"},"t":"아이돌 칭찬은 부담이 크네."},{"s":"n","t":"RAVEN은 짧게 말했다. 무대 체질이다."},{"s":"yeon","x":"talk","t":"아니라니까요."},{"s":"neo","t":"관객 반응은 좋았다."},{"s":"yeon","t":"너도 즐겼잖아."},{"s":"neo","t":"임무 수행이었다."},{"s":"yeon","t":"거대한 사자 그림자까지 띄우는 임무 수행?"},{"s":"n","t":"네오는 대답하지 않았다. 대답하지 않는다는 건, 뭔가 있다는 뜻이었다. 연이는 마음속에 표시해두었다. 네오 정체 수상함. 매우 수상함."},{"s":"n","t":"하지만 지금은 추궁할 때가 아니었다. 음식 냄새가 돌아왔고, 조명은 색을 찾았고, 아이들은 웃었고, 관객들은 박수를 쳤다."},{"s":"n","t":"말놀이 골목에서는 벌써 방금 무대를 흉내 내고 있었다. 꺼내, 꺼내! 숨겨둔 마음을 꺼내!"},{"s":"moka","c":{"who":"moka","x":"base"},"t":"제 흑역사가 섬 전체 후렴이 됐어요."},{"s":"yeon","x":"happy","t":"축하해. 밈이 됐네."},{"s":"moka","t":"이거 좋은 거죠?"},{"s":"yeon","t":"대체로."},{"s":"n","c":{"who":"neo"},"t":"네오는 조용히 마지막 깃털이 사라진 자리를 바라보고 있었다. 그의 눈빛은 조금 어두웠다."},{"s":"yeon","x":"talk","t":"네오. 그 까마귀, 완전히 끝난 거야?"},{"s":"neo","t":"까마귀는 사라졌다."},{"s":"yeon","t":"그 말은, 흑막은 안 끝났다는 뜻이지?"},{"s":"n","t":"네오는 이번에도 바로 대답하지 않았다."},{"s":"yeon","t":"너 진짜 숨기는 거 많다."},{"s":"neo","t":"아직 말할 때가 아니다."},{"s":"yeon","t":"그 말 제일 수상한 거 알지?"},{"s":"neo","t":"알고 있다."},{"s":"n","t":"연이는 네오를 바라봤다. 이 작은 사자는 분명 뭔가를 알고 있었다. 사주의 강, 흩어진 글자, 봉인자들, 그리고 무대 위에서 드러난 거대한 사자의 그림자."},{"s":"n","t":"궁금한 건 많았다. 하지만 이 섬에서 배운 것도 있었다. 모든 말을 한 번에 꺼낼 필요는 없다는 것. 초안이 있고, 다음 줄이 있고, 언젠가 완성될 문장이 있다는 것."},{"s":"yeon","t":"다음 줄에서 물어볼게."},{"s":"neo","t":"무슨 뜻이지?"},{"s":"yeon","t":"지금은 넘어가 준다는 뜻이야. 근데 안 까먹을 거야."},{"s":"neo","t":"그럴 것 같았다."},{"s":"n","t":"무대 위 조명이 따뜻하게 내려왔다. 정미의 불씨가 연이의 가슴 안에서 조용히 타오르고 있었다.","fx":"heart"},{"s":"n","t":"식신·상관의 섬은 다시 소란스러워지고 있었다. 이번에는 그 소란이 조금 더 소중하게 느껴졌다."},{"s":"n","t":"말할 수 있다는 것. 만들 수 있다는 것. 맛있다고 웃을 수 있다는 것. 틀려도 다시 할 수 있다는 것. 그 모든 것이, 생각보다 쉽게 빼앗길 수 있는 것이었으니까."},{"s":"yeon","t":"꺼내라……. 좋은 주문이네."},{"s":"moka","x":"base","t":"우리 후렴이에요."},{"s":"yeon","x":"happy","t":"그래. 우리 후렴."},{"s":"n","bgm":"main","t":"그리고 그 순간, 식신·상관의 섬 하늘에 다시 음악이 올랐다. 이번엔 누구도 그것을 막지 않았다.","im":true},{"s":"sys","t":"제12화 · 첫 줄의 무대 — 끝. 다음 이야기, 곧."}]});
EPISODES.push({"no":"EP.13","tag":"제13화 · 맛있는 작별","title":"맛있는 작별","beats":[{"s":"n","bg":"siksang","bgm":"daily","l":{"who":"yeon"},"c":{"who":"moka","x":"base"},"r":null,"t":"식신·상관의 섬이 다시 시끄러워졌다. 전과 같은 시끄러움은 아니었다. 소리가 많다는 뜻이 아니라, 돌아온 소리라는 뜻이었다."},{"s":"n","t":"잃어버릴 뻔했다가 다시 찾은 웃음. 막힐 뻔했다가 다시 터진 박수. 사라질 뻔했다가 다시 살아난 노래."},{"s":"n","t":"회색으로 굳어가던 거리에 색이 돌아왔고, 냄새를 잃었던 음식들이 다시 김을 피워 올렸다.","fx":"heart"},{"s":"n","t":"달빛 크림빵은 다시 부풀었고, 구름솜 튀김은 다시 바삭한 향을 냈다. 노을빛 탕후루가 반짝이며 굳었다. 리듬 팬케이크 가게 앞에는 아이들이 뒤집개를 들고 줄을 섰다. 「하나, 둘, 셋!」 휙. 팬케이크가 공중에서 한 바퀴 돌았다. 짝짝짝. 이번에는 박수가 제대로 났다."},{"s":"n","t":"봉인에 막혀 허공에서 멈추던 손들이, 이제는 서로 부딪히고 있었다. 그 소리 하나하나가 섬이 살아 있다는 증거처럼 들렸다. 연이는 무대 옆 계단에 앉아 있었다. 정확히는 앉으려다 다리가 짧아 그냥 털썩 내려앉은 상태였다."},{"s":"yeon","x":"talk","t":"나 진짜 무대 했네."},{"s":"n","t":"말로 꺼내자 다시 민망해졌다. 목덜미가 괜히 근질거렸다."},{"s":"moka","x":"moved","t":"저도요."},{"s":"yeon","x":"talk","t":"너는 래퍼니까 언젠가 했을 일이잖아."},{"s":"moka","x":"base","t":"연이님도 했잖아요."},{"s":"yeon","x":"talk","t":"나는 사고였어. 등 떠밀린 사고."},{"s":"moka","x":"base","t":"사고치고는 후렴이 너무 좋았어요."},{"s":"n","t":"멀리서 아이들이 뛰어다니며 외쳤다. 「꺼내, 꺼내!」 「숨겨둔 마음을 꺼내!」"},{"s":"yeon","t":"아…… 내 흑역사가 후렴이 됐다.","fx":"veil"},{"s":"moka","x":"base","t":"저도 제 첫 줄이 섬 전체에 퍼졌어요."},{"s":"n","t":"둘은 잠시 서로를 바라봤다. 그리고 동시에 웃었다. 부끄러운데 싫지는 않은, 이상한 감각이었다."},{"s":"yeon","x":"talk","t":"방금 전까진 표현이란 게 무섭고 민망하고, 평가받는 일이라고만 생각했거든."},{"s":"n","t":"그런데 막상 무대에서 꺼낸 말이 누군가의 입에 다시 불리는 걸 보니, 그건 조금 다른 감각이었다."},{"s":"n","t":"내가 낸 작은 소리가 다른 사람에게 닿는 것. 내 첫 줄이 누군가의 장난이 되고, 응원이 되고, 노래가 되는 것.","fx":"heart"},{"s":"n","t":"그게 조금 부끄럽고, 조금 따뜻했다. 그때 무대 아래쪽에서 주민들이 다가왔다. 달빛 크림빵 가게의 곰, 리듬 팬케이크 가게의 두더지, 말놀이 골목의 붉은 여우와 초록 앵무새. 그다음에는 악기 장인들, 음식 부스 주인들, 아이들, 관객들까지 하나둘 모여들었다."},{"s":"n","t":"연이는 그들을 보고 살짝 굳었다. 짧은 앞발이 계단 모서리를 꾹 쥐었다."},{"s":"yeon","x":"talk","t":"왜, 왜 다들 오시지?"},{"s":"moka","x":"base","t":"혹시 후렴 저작권 문제?"},{"s":"yeon","x":"talk","t":"그게 지금 제일 먼저 떠올라?"},{"s":"moka","x":"base","t":"제가 무명이라 권리에 민감해요."},{"s":"n","t":"달빛 크림빵 가게 곰이 앞으로 나왔다. 커다란 앞발에는 갓 구운 빵 바구니가 들려 있었다. 「고맙네.」"},{"s":"yeon","x":"talk","t":"네?"},{"s":"n","t":"「이 섬의 맛을 되찾아줘서.」 곰은 따뜻한 달빛 크림빵 하나를 내밀었다. 「아까 첫 입은 선물이었지. 이번 건 감사 인사일세.」"},{"s":"n","t":"연이는 조심스럽게 빵을 받았다. 따뜻했다. 이번에는 냄새도 났다.","fx":"heart"},{"s":"n","t":"달콤하고 고소하고, 아주 약간 짭짤한 별소금 향. 연이는 한입 베어 물었다. 순간 눈이 커졌다. 맛이 더 진했다. 크림이 부드럽게 퍼졌고, 그 안쪽에서 작은 불씨 같은 온기가 올라왔다."},{"s":"yeon","x":"happy","t":"와……."},{"s":"n","t":"곰이 웃었다. 「표현이 돌아오면 맛도 깊어지지.」"},{"s":"yeon","x":"talk","t":"이건 진짜 사과가 아니라 보상인데요."},{"s":"n","t":"「그렇게 받아도 좋네.」 옆에서 두더지가 리듬 팬케이크 접시를 내밀었다. 「이건 무대 축하 팬케이크예요.」 팬케이크 위에는 작은 글자가 시럽으로 적혀 있었다. [첫 줄 축하]"},{"s":"moka","x":"moved","t":"저…… 이거 먹어도 돼요?"},{"s":"n","t":"두더지가 웃었다. 「먹으라고 만든 거죠.」 모카는 한입 먹었다. 그리고 눈이 커졌다."},{"s":"moka","x":"p1","t":"박자가 나요. 입안에서 박자가 나요."},{"s":"n","t":"모카는 잠시 씹다가, 갑자기 손으로 테이블을 두드렸다. 탁. 탁탁. 탁."},{"s":"moka","x":"p2","t":"이거 후렴으로 쓸 수 있어요."},{"s":"yeon","x":"happy","t":"너 진짜 래퍼 맞구나. 먹으면서도 곡 생각하네."},{"s":"moka","x":"p2","t":"이건 영감이에요."},{"s":"n","t":"말놀이 골목의 붉은 여우가 다가왔다. 「꽃돼지 친구.」 연이의 눈썹이 스윽 올라갔다. 여우는 바로 고개를 숙였다. 「아, 미안. 연이.」"},{"s":"yeon","x":"talk","t":"좋아. 빠른 수정 마음에 들어."},{"s":"n","t":"여우는 웃으며 작은 사탕 주머니를 건넸다. 「이건 보컬 사탕이야. 먹으면 잠깐 목이 맑아져.」"},{"s":"yeon","x":"talk","t":"혹시 먹으면 다시 무대 올라가야 하는 건 아니죠?"},{"s":"n","t":"초록 앵무새가 옆에서 말했다. 「아니. 하지만 노래방 가고 싶어질 수는 있어.」"},{"s":"yeon","x":"talk","t":"위험하네."},{"s":"n","r":{"who":"neo"},"t":"네오가 옆에서 조용히 말했다."},{"s":"neo","t":"받아둬라. 도움이 될 수 있다."},{"s":"n","t":"연이는 사탕 주머니를 받아 들었다."},{"s":"yeon","x":"talk","t":"네가 그렇게 말하니까 갑자기 아이템 같아."},{"s":"neo","t":"실제로도 그럴 수 있다."},{"s":"n","t":"모카가 노트에 적었다. [보컬 사탕: 목소리 회복 가능. 단, 노래 욕구 주의.]"},{"s":"yeon","x":"talk","t":"지금 뭐 해?"},{"s":"moka","x":"base","t":"기록이요. 앞으로도 이런 일이 있을 것 같아서요."},{"s":"n","t":"모카가 고개를 들었다. 아직 겁도 긴장도 있었지만, 처음 나타났을 때처럼 그저 꿈만 말하는 얼굴은 아니었다. 한 번 무대에 섰고, 한 번 자기 이름을 지킨 얼굴이었다."},{"s":"moka","x":"base","t":"연이님은 다음 섬으로 가는 거죠?"},{"s":"n","t":"연이는 빵을 먹다 멈췄다."},{"s":"yeon","x":"talk","t":"응."},{"s":"neo","t":"가야 한다. 아직 흩어진 글자가 남아 있다."},{"s":"moka","x":"moved","t":"그럼 저도……."},{"s":"n","t":"그때 무대 쪽에서 낮은 목소리가 들렸다. 「가기 전에 인사는 해야지.」 SOLV였다. DEST1NOVA 멤버들이 다가오고 있었다."},{"s":"n","t":"SOLV는 은빛 마이크를, BAMBI는 따뜻한 수프 컵을 들었다. LUNE은 기타를 등에 멘 채 코드를 튕겼고, RAVEN은 말없이 뒤따라왔다. 모카는 자리에서 벌떡 일어났다. 너무 급하게 일어나 팬케이크 접시가 흔들렸다."},{"s":"moka","x":"p3","t":"데, 데, 데……."},{"s":"yeon","x":"talk","t":"DEST1NOVA."},{"s":"moka","x":"p3","t":"맞아요. 그거요."},{"s":"n","t":"SOLV는 모카 앞에 섰다. 「좋은 첫 줄이었다.」"},{"s":"moka","x":"moved","t":"저…… 진짜요?"},{"s":"n","t":"「그래. 사라질 뻔했는데 지켰지.」 SOLV는 모카의 가사 노트를 보았다."},{"s":"moka","x":"moved","t":"혼자 지킨 건 아니에요."},{"s":"n","t":"「그래서 더 좋다. 무대는 혼자 찢는 게 아니라, 같이 버티는 거니까.」 모카의 눈에 눈물이 맺혔다.","fx":"heart"},{"s":"n","t":"LUNE이 기타를 튕기며 웃었다. 「우리 rookie 오늘 진짜 데뷔한 거 아냐?」"},{"s":"moka","x":"p1","t":"아니요! 저는 아직……."},{"s":"n","t":"BAMBI가 부드럽게 말했다. 「아직이라고 해도 괜찮아. 아직은 부끄러운 말이 아니라, 다음이 있다는 말이니까.」"},{"s":"moka","x":"moved","t":"다음이 있다……."},{"s":"n","t":"RAVEN이 조용히 말했다. 「연습해.」"},{"s":"moka","x":"p2","t":"네!"},{"s":"n","t":"RAVEN은 짧게 덧붙였다. 「도망치지 말고.」 모카의 눈빛이 단단해졌다."},{"s":"moka","x":"base","t":"네."},{"s":"yeon","x":"happy","t":"모카, 오늘 인생 멘토 다 만났네."},{"s":"moka","x":"moved","t":"저 오늘 죽어도 돼요."},{"s":"n","t":"연이와 네오가 동시에 말했다. 「안 돼.」"},{"s":"yeon","x":"talk","t":"너 아직 다음 줄 써야 하잖아."},{"s":"neo","t":"그리고 기술 연습이 필요하다."},{"s":"moka","x":"moved","t":"네. 살게요."},{"s":"n","t":"BAMBI가 연이에게 수프 컵을 내밀었다. 「이건 너에게. 무대 뒤풀이 수프.」"},{"s":"n","t":"「식신·상관의 섬에는 있어.」 연이는 한입 마셨다. 처음에는 고소했고, 끝에는 살짝 매콤했다. 긴장했던 마음을 풀어주면서도, 다음 길로 갈 힘을 주는 맛이었다."},{"s":"yeon","x":"happy","t":"이건…… 쉬었다가 다시 가는 맛이네요."},{"s":"n","t":"BAMBI가 미소 지었다. 「맞아.」 LUNE은 작은 피크 하나를 내밀었다. 달빛 모양이었다. 「이건 선물.」"},{"s":"yeon","x":"talk","t":"나는 기타 못 치는데?"},{"s":"n","t":"「괜찮아. 틀린 박자를 살리고 싶을 때 써.」"},{"s":"n","t":"「있을지도?」"},{"s":"n","t":"LUNE은 웃었다. 「식신·상관의 섬 아이템은 대체로 마음 먹기에 따라 달라져.」"},{"s":"yeon","x":"happy","t":"되게 상관답다."},{"s":"n","t":"SOLV는 모카에게 은빛 링 하나를 건넸다. 「노바 링이다.」"},{"s":"n","t":"「데뷔 선물은 아니다. 숙제다.」"},{"s":"n","t":"「다음에 만날 때, 네 두 번째 줄을 들려줘라.」 모카의 손이 떨렸다. 하지만 이번에는 겁 때문이 아니었다."},{"s":"moka","x":"moved","t":"네."},{"s":"n","t":"그는 노트에 노바 링을 끼웠다. 달빛 아래서 은빛 링이 반짝였다.","fx":"heart"},{"s":"n","t":"RAVEN은 연이와 네오를 번갈아 보았다. 「둘 다 숨기는 게 많군.」"},{"s":"n","t":"RAVEN은 연이의 머리 위 꽃을 보았다. 「꽃 안쪽에 불과 물과 흙이 같이 있다.」 그다음 네오를 보았다. 「그리고 저쪽은 더 많다.」 네오의 귀가 아주 미세하게 움직였다."},{"s":"neo","t":"무대 뒤풀이 중에 할 이야기는 아니다."},{"s":"n","t":"SOLV도 네오를 바라봤다. 「사주 가디언.」 그 말에 모카가 다시 귀를 쫑긋했다."},{"s":"moka","x":"p1","t":"맞다. 저도 아직 궁금해요. 사주 가디언이라는 건 여기서도 처음 들어요."},{"s":"n","t":"BAMBI도 조용히 말했다. 「나도 오래 전설을 들었지만, 직접 본 건 처음이야.」 LUNE이 눈을 반짝였다. 「작은데 거대한 사자 그림자 나오는 것도 처음 봤고.」"},{"s":"n","t":"RAVEN은 짧게 말했다. 「봉인자도 네오를 알아봤다.」 공기가 잠깐 조용해졌다.","fx":"veil"},{"s":"n","t":"연이의 시선이 네오에게 꽂혔다. 네오는 매우 태연한 척했다."},{"s":"neo","t":"우연이다."},{"s":"n","t":"연이, 모카, DEST1NOVA 멤버 전원이 동시에 그를 바라봤다."},{"s":"yeon","x":"talk","t":"그건 너무 무리야."},{"s":"n","t":"LUNE이 웃었다. 「거짓말도 리듬이 있어야 하는데, 방금은 박자가 안 맞았어.」 네오는 잠시 침묵했다. 그리고 고개를 돌렸다."},{"s":"neo","t":"아직 말할 때가 아니다."},{"s":"n","t":"SOLV는 네오를 한참 보더니 더 묻지 않았다. 「그럼 아직은 묻지 않지.」 그는 연이를 보았다. 「하지만 조심해라. 봉인자가 네오를 알아봤다면, 다음 섬에서도 그 이름이 반응할 수 있다.」"},{"s":"yeon","t":"네오 이름이?","fx":"veil"},{"s":"n","t":"「아니.」 SOLV의 목소리가 낮아졌다. 「네오의 정체가.」 네오는 아무 말도 하지 않았다. 연이는 더 묻고 싶었지만 지금은 참았다. 식신·상관의 섬에서 배운 게 있었다."},{"s":"n","t":"말은 꺼내야 하지만, 모든 말을 한 번에 꺼낼 필요는 없었다. 초안이 있고, 다음 줄이 있고, 때가 있다."},{"s":"yeon","x":"talk","t":"다음에 꼭 물어볼 거야."},{"s":"neo","t":"그때도 답하지 않을 수 있다."},{"s":"yeon","x":"talk","t":"그럼 그다음에도 물어볼 거야."},{"s":"neo","t":"끈질기군."},{"s":"yeon","x":"happy","t":"내 장점이야."},{"s":"n","bg":"siksang3","t":"그때 광장 전체에 음식이 차려지기 시작했다. 뒤풀이가 열린 것이다."},{"s":"n","t":"길게 이어진 테이블 위에 달빛 크림빵, 구름솜 튀김, 노을빛 탕후루, 리듬 팬케이크, 마음 수프, 불꽃 라면, 보컬 사탕이 잔뜩 올라왔다."},{"s":"n","t":"멤버들의 이름을 딴 특별 음식도 있었다. SOLV의 은빛 후추 스테이크 꼬치, BAMBI의 따뜻한 허그 수프, LUNE의 랜덤 코드 쿠키, RAVEN의 그림자 초코 타르트. 연이는 테이블을 보고 멈춰 섰다. 짧은 앞발이 저절로 움찔했다."},{"s":"yeon","x":"happy","t":"여긴 천국인가?"},{"s":"neo","t":"적당히 먹어라."},{"s":"yeon","x":"talk","t":"이런 상황에서 적당히라는 말은 예의가 아니야."},{"s":"n","t":"모카는 이미 리듬 팬케이크 앞에 앉아 있었다."},{"s":"moka","x":"p2","t":"이건 영감용으로 먹어야 해요."},{"s":"yeon","x":"talk","t":"먹는 핑계가 점점 전문적이네."},{"s":"moka","x":"base","t":"식신의 섬이니까요."},{"s":"n","t":"연이는 불꽃 라면 앞에 섰다. 가게 주인이 경고했다. 「이 라면은 자존심을 먹고 매워집니다.」"},{"s":"yeon","x":"talk","t":"그럼 난 안 먹어."},{"s":"n","t":"LUNE이 웃었다. 「왜?」"},{"s":"yeon","x":"talk","t":"내 자존심은 이미 오늘 무대에서 많이 소모됐어."},{"s":"n","t":"SOLV가 낮게 말했다. 「현명하군.」 BAMBI는 연이에게 허그 수프를 한 그릇 더 건넸다. 「너는 이쪽이 더 어울려.」"},{"s":"yeon","x":"happy","t":"감사합니다. 매운 자존심보다 따뜻한 위로가 좋네요."},{"s":"n","t":"RAVEN은 그림자 초코 타르트를 조용히 먹고 있었다. 연이는 궁금해서 물었다."},{"s":"yeon","x":"talk","t":"그거 맛있어요?"},{"s":"n","t":"RAVEN은 잠시 생각했다. 「달다.」"},{"s":"yeon","x":"talk","t":"끝?"},{"s":"n","t":"「깊다.」 연이는 타르트 한 조각을 받아 먹었다. 처음엔 진한 초콜릿, 그다음엔 살짝 쌉싸름, 끝엔 이상하게 조용한 달콤함이 남았다."},{"s":"yeon","x":"talk","t":"이거 RAVEN 같네요."},{"s":"n","t":"RAVEN은 고개를 끄덕였다. 「좋은 평가다.」 그렇게 그들은 한참을 먹고, 이야기하고, 웃었다.","fx":"heart"},{"s":"n","t":"연이는 오랜만에 정말 쉬는 것 같았다. 비겁의 섬에선 자기 자신과 싸웠고, 식신·상관의 섬에선 표현이 지워질 뻔했다. 그런데 지금은, 맛있는 음식을 먹고 있었다. 방금 만난 이들이 고맙다고 말해주고 있었다."},{"s":"n","t":"이것도 운명 회복의 일부일지도 몰랐다. 맛있는 걸 맛있다고 말하고, 고맙다고 인사하고, 같이 웃을 수 있는 시간.","fx":"heart"},{"s":"n","t":"그때 모카가 조심스럽게 입을 열었다."},{"s":"moka","x":"base","t":"연이님."},{"s":"yeon","x":"talk","t":"응?"},{"s":"moka","x":"moved","t":"저…… 같이 가도 돼요?"},{"s":"n","t":"연이는 수프를 마시다 멈췄다. 네오도 모카를 보았다. 모카는 노바 링이 달린 가사 노트를 품에 안고 있었다."},{"s":"moka","x":"base","t":"저 오늘 첫 줄을 썼어요. 근데 다음 줄은 여기만 보고는 못 쓸 것 같아요."},{"s":"moka","x":"base","t":"다른 섬도 보고 싶어요. 표현이 돈이 되면 어떻게 되는지, 마음이 지식이 되면 어떻게 되는지, 운명이 또 어떻게 망가져 있는지."},{"s":"moka","x":"moved","t":"그리고…… 저도 누군가의 다음 줄을 도와주고 싶어요."},{"s":"n","t":"네오는 바로 대답하지 않았다. 그는 모카를 바라봤다."},{"s":"neo","t":"앞으로의 길은 위험하다."},{"s":"moka","x":"base","t":"알아요."},{"s":"neo","t":"오늘처럼 무대가 있는 곳만 나오지 않는다. 도망치고 싶을 수도 있다."},{"s":"n","t":"모카는 손에 든 노트를 꽉 잡았다."},{"s":"moka","x":"base","t":"그때도 한 줄은 남겨볼게요."},{"s":"yeon","x":"happy","t":"좋은 대답인데?"},{"s":"n","t":"네오는 잠시 침묵했다. 그리고 말했다."},{"s":"neo","t":"따라와라."},{"s":"moka","x":"moved","t":"정말요?"},{"s":"neo","t":"두 번 말하지 않는다."},{"s":"n","t":"모카는 그대로 자리에서 벌떡 일어났다.","fx":"heart"},{"s":"moka","x":"p3","t":"저 동료 됐어요!"},{"s":"n","t":"LUNE이 기타를 튕겼다. 「축하해, rookie!」 딩. BAMBI가 박수를 쳤다. 「잘 다녀와.」 SOLV는 짧게 말했다. 「다음 줄을 써라.」 RAVEN은 말했다. 「살아서.」"},{"s":"moka","x":"moved","t":"네!"},{"s":"yeon","x":"talk","t":"모카, 역할은 정했어?"},{"s":"moka","x":"p2","t":"비트 서포터 겸 기록 담당!"},{"s":"neo","t":"소리 감지와 기록 담당이다."},{"s":"moka","x":"p2","t":"소리 감지와 기록 담당, 별칭 비트 서포터!"},{"s":"yeon","x":"happy","t":"좋아. 있어 보여."},{"s":"n","bg":"siksang","t":"축제가 조금씩 마무리될 무렵, 연잎 배가 다시 강가에 나타났다. 배는 이전보다 조금 넓어진 것 같았다."},{"s":"n","t":"마치 새로운 동료가 생길 것을 알고 있었다는 듯이."},{"s":"yeon","x":"talk","t":"이 배, 자동 확장 기능도 있어?"},{"s":"neo","t":"사주의 강은 필요한 만큼 길을 만든다."},{"s":"yeon","x":"happy","t":"오. 이번엔 좀 멋있다."},{"s":"n","bg":"river","bgm":"riverEnter","t":"모카는 조심스럽게 연잎 배에 올랐다. 처음 타는 배라 그런지 살짝 비틀거렸다."},{"s":"yeon","x":"talk","t":"괜찮아?"},{"s":"moka","x":"base","t":"네. 생각보다 푹신하네요."},{"s":"yeon","x":"talk","t":"나 처음엔 여기서 돼지 된 걸 깨달았어."},{"s":"n","t":"DEST1NOVA 멤버들과 주민들이 강가에 모였다. 달빛 크림빵 가게 곰이 빵 바구니를 흔들었다."},{"s":"n","t":"말놀이 골목의 여우와 앵무새가 동시에 외쳤다. 「다음에도 말하러 와!」 아이들은 후렴을 불렀다. 「꺼내, 꺼내!」","fx":"heart"},{"s":"moka","x":"moved","t":"저 진짜 다음 줄 쓰고 올게요!"},{"s":"n","t":"SOLV는 손을 들었고, BAMBI는 따뜻하게 웃었다. LUNE은 기타로 짧은 작별 코드를 쳤다. 딩. RAVEN은 고개를 숙였다. 네오는 조용히 앞을 바라봤다. 연이는 강가의 모두를 바라봤다. 조금 전까지만 해도 모르는 이들이었다."},{"s":"n","t":"이제는 작별이 아쉬운 이들이 되었다. 운명 세계는 무섭고 이상했지만, 이렇게 연결되는 순간도 있었다.","fx":"veil"},{"s":"n","t":"연잎 배가 천천히 움직였다. 식신·상관의 섬이 뒤로 멀어졌다."},{"s":"n","t":"연이는 가슴 안쪽의 [丁未]를 느꼈다. 작은 불. 따뜻한 흙. 그리고 그 위에 남은 노래 한 줄.","fx":"heart"},{"s":"n","t":"모카는 배 한쪽에 앉아 노트를 펼쳤다. 빈 페이지 위에 새 문장을 적었다. [첫 번째 동료가 된 날.]"},{"s":"yeon","x":"happy","t":"벌써 기록해?"},{"s":"moka","x":"base","t":"기록 안 하면 날아가요. 표현은 꺼내야 남으니까요."},{"s":"yeon","x":"talk","t":"맞네."},{"s":"n","t":"그때 강 앞쪽에 새로운 안개가 피어올랐다. 이번 안개는 황금빛이 아니었다. 차분하고 깊은 빛이었다."},{"s":"n","t":"마치 오래된 책장 사이로 새어 나오는 햇빛. 혹은 조용한 도서관 창가에 쌓인 먼지 빛.","fx":"veil"},{"s":"yeon","x":"talk","t":"저긴 어디야?"},{"s":"neo","t":"인성의 섬이다."},{"s":"neo","t":"배우고, 기억하고, 보호받고, 이해하는 힘."},{"s":"yeon","t":"인성?"},{"s":"moka","x":"p1","t":"그럼 공부하는 섬인가요?"},{"s":"neo","t":"어느 정도는."},{"s":"yeon","x":"talk","t":"잠깐만. 나 방금까지 무대 뛰고 먹고 놀다가 왔는데 다음이 공부 섬이라고?"},{"s":"neo","t":"정확히는 지식과 기억의 섬이다."},{"s":"yeon","x":"talk","t":"그게 공부잖아."},{"s":"moka","x":"base","t":"저는 좋을지도 몰라요. 가사 쓰려면 많이 알아야 하니까."},{"s":"yeon","x":"talk","t":"너 동료 되자마자 모범생 포지션 잡는 거야?"},{"s":"moka","x":"base","t":"비트 서포터 겸 기록 담당이니까요."},{"s":"yeon","x":"talk","t":"아, 역할 몰입 빠르네."},{"s":"n","t":"네오는 인성의 섬 쪽을 바라봤다. 그의 표정은 묘하게 진지했다.","tone":"desat"},{"s":"yeon","x":"talk","t":"왜 또 표정이 그래?"},{"s":"neo","t":"인성의 섬은 조용해 보이지만 쉽지 않다."},{"s":"yeon","x":"talk","t":"또 위기 있어?"},{"s":"neo","t":"기억은 때로 가장 무거운 짐이 된다."},{"s":"n","t":"연이는 잠시 말이 없어졌다. 그 말은 어딘가 따뜻했지만, 동시에 조금 무서웠다. 무엇을 기억하게 될까. 무엇을 배우게 될까. 연이는 가슴 안쪽의 글자들을 느꼈다. [乙亥] [丁未]. 자기 자리를 찾았고, 자기 목소리를 꺼냈다."},{"s":"n","t":"이제는 아마도, 자신이 왜 이곳에 왔는지를 조금 더 배워야 할 차례였다. 연잎 배는 조용히 강을 따라 흘렀다. 뒤에서는 식신·상관의 섬 노래가 희미하게 들려왔고, 앞에서는 인성의 섬 안개가 천천히 열리고 있었다. 연이는 짧은 앞발을 가슴에 올렸다."},{"s":"yeon","x":"talk","t":"좋아. 이번엔 공부든 기억이든, 한번 해보자."},{"s":"n","t":"잠시 후, 작게 덧붙였다."},{"s":"yeon","t":"근데 시험은 없었으면 좋겠다."},{"s":"n","t":"네오는 대답하지 않았다."},{"s":"yeon","x":"talk","t":"왜 대답 안 해?"},{"s":"n","t":"모카가 노트에 조용히 적었다. [인성의 섬. 시험 있을 가능성 높음.]"},{"s":"yeon","x":"talk","t":"그런 거 기록하지 마!"},{"s":"n","t":"연잎 배는 세 사람을 태운 채, 인성의 섬으로 향했다."},{"s":"sys","im":true,"t":"[丁未] 획득 — 식상(食傷)의 글자. 작은 불과 따뜻한 흙, 그 위에 남은 노래 한 줄. 표현하는 힘이 연이의 가슴에 새겨졌다."},{"s":"sys","im":true,"t":"다음 섬 · 인성(印星)의 섬 — 배우고, 기억하고, 보호받고, 이해하는 힘. 조용한 도서관의 빛 속에서, 가장 무거운 기억이 연이를 기다린다. (다음 화에 계속)"}]});
