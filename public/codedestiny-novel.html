 예고잖아."},{"s":"n","fx":"tarot","t":"그때 화면 위로, 타로 카드 한 장이 떠올랐다. 검은 배경에 달빛으로 된 문. 문 앞엔 작은 꽃 한 송이. 카드 아래엔 — [ THE DOOR ]."},{"s":"yeon","x":"fear","t":"타로에… 이런 카드가 있었나?"},{"s":"n","bg":"tarotDoor","fx":"veil","bgm":"crisis","t":"그 순간, 카드 속 문이 열렸다. 끼이이익 — 소리는 휴대폰이 아니라, 방 안에서 났다."},{"s":"n","c":{"who":"yeon","x":"fear"},"t":"침대 앞 허공에, 진짜 달빛 문이 세워져 있었다. 문틈 너머로, 낯선 밤하늘이 소용돌이쳤다."},{"s":"yeon","x":"fear","t":"이거… 지금 내 방 맞지?"},{"s":"n","t":"대답 대신, 문 안에서 카드들이 쏟아져 나왔다. 별, 달, 태양, 운명의 수레바퀴. 책상 위 과제물도, 뒤집힌 우산도, 반쯤 먹다 만 컵라면까지, 방 안을 빙글빙글 돌기 시작했다."},{"s":"sys","t":"[ 타로의 문 개방 ]  [ 운세 세계 접속 중 ]  [ 사주의 강 좌표 확인 ]"},{"s":"yeon","x":"angry","t":"닫아. 닫으라고! 강? 여긴 원룸인데!"},{"s":"sys","t":"[ 초기 아바타 변환 중 ]"},{"s":"n","t":"문 안쪽에서 빛이 터졌다. 연이는 끝까지 침대 헤드를 붙잡았다. 하지만 침대 헤드는, 생각보다 의리가 없었다. 뚝."},{"s":"yeon","x":"fear","t":"배신자!"},{"s":"n","fx":"suck","t":"연이는 그대로 — 타로의 문 안으로, 빨려 들어갔다."},{"s":"n","bg":"river","bgm":"crisis","t":"문 너머는 끝없는 밤이었다. 위도 밤, 아래도 밤. 별자리들이 강물처럼 흐르고, 수많은 타로 카드가 그녀 주변을 돌며 속삭였다. 선택. 추락. 시작. 변신."},{"s":"sys","t":"[ 운명 코드 접속 완료 ]  [ 손상된 운세 세계로 진입합니다. ]"},{"s":"yeon","x":"fear","t":"나는 동의한 적이—"},{"s":"n","fx":"transform","t":"말이 끝나기도 전에, 몸이 이상해졌다. 팔이 짧아지고, 다리가 짧아지고, 몸이 둥글어졌다. 머리 위에서, 뭔가가 피어났다."},{"s":"yeon","im":true,"t":"꿀아아아악!"},{"s":"n","bg":"river","bgm":"riverEnter","form":"pig","c":{"who":"yeon"},"t":"자기 목소리가 아니었다. 그리고 곧장, 별빛 강 위로 떨어졌다. 풍덩 — 가라앉지는 않았다. 통, 통통. 말랑한 몸이 강물 위에서 튕겼다."},{"s":"n","c":{"who":"yeon"},"t":"분홍빛 몸. 짧은 다리. 동그란 배. 꼬불꼬불한 꼬리. 머리 위에 핀, 작은 꽃 한 송이. 연이는 앞발을 들어 보았다. 너무 작고, 너무 통통했다."},{"s":"yeon","t":"나……"},{"s":"yeon","im":true,"t":"나 돼지 됐잖아아아아!"}]});
EPISODES.push({"no":"EP.01","tag":"제1화 · 꽃돼지가 되었다","title":"꽃돼지가 되었다","beats":[{"s":"n","bg":"campus","bgm":"daily","t":"7월의 캠퍼스는 찜통이었다. 스물세 살 연이는 남은 3분을 향해 전력으로 뛰었다. 그런데 정문 자동문이, 하필 그녀 앞에서만 열리지 않았다.","form":"human","c":{"who":"yeon"}},{"s":"yeon","t":"…나, 유령 됐나. 이번 학기 지각, 이미 두 번인데."},{"s":"n","t":"아침부터 조짐이 이상했다. 알람은 안 울렸고, 편의점 참치마요 삼각김밥은 까 보니 참치가 없었다. 그냥 밥이었다. 속이 텅 비어 있었다."},{"s":"yeon","t":"…이게 무슨 미니멀리즘이야."},{"s":"n","t":"카드는 계산대에서 세 번 튕겼고, 밤새 붙든 과제 파일은 열자마자 '파일이 손상되었습니다'로 떴다. 친구와의 약속마저, 서로 시간을 착각해 엎어졌다."},{"s":"n","bg":"room","bgm":"room","t":"자취방에 돌아온 건 자정 무렵. 젖은 양말을 벗어 아무 데나 던지며, 연이는 생각했다."},{"s":"yeon","t":"…왜 요즘, 나만 이렇게 꼬여.","c":{"who":"yeon","x":"disappoint"}},{"s":"n","t":"원래는 무너지지 않는 걸크러시가 되고 싶었는데. 요즘은 뭘 해도, 세상이 자기만 살짝 비껴서 걸어둔 것 같았다."},{"s":"n","bg":"roomNight","bgm":"gloom","t":"불을 끄고 누워 습관처럼 휴대폰을 켠 순간, 처음 보는 아이콘이 있었다. 타로 카드 모양의 앱. 이름은 흐릿하게 Code… 뭐라고 적혀 있었다. 설치한 기억은 없었다."},{"s":"yeon","t":"…이거 내가 깔았나? 광고 앱이네, 지워."},{"s":"n","t":"삭제를 눌렀다. 안 지워졌다. 다시 눌렀다. '정말 떠나시겠어요?' — 그 문구만 떴다."},{"s":"yeon","t":"떠나긴 뭘 떠나. 깔지도 않았는데."},{"s":"n","bg":"tarotDoor","bgm":"riverEnter","fx":"tarot","t":"홧김에 아이콘을 꾹 눌렀다. 그냥, 지우려던 거였다. 그런데 화면이 — 앱이 아니라, 문처럼 갈라졌다."},{"s":"yeon","im":true,"t":"어? 잠깐, 잠깐잠깐—!","c":{"who":"yeon","x":"fear"}},{"s":"n","fx":"suck","t":"손끝이 닿은 순간, 침대가 사라졌다. 천장이 사라졌다. 방 전체가 물처럼 아래로 빨려 내려갔다. 별빛 같은 글자들이 얼굴을 스쳐 갔다. 떨어지고, 또 떨어졌다."},{"s":"n","bg":"river","bgm":"riverEnter","fx":"transform","form":"pig","l":{"who":"yeon"},"im":true,"t":"낙하가 어느 순간 부드러워지고, 빛이 몸을 감쌌다. 팔이 짧아지고, 손가락이 뭉툭해졌다. 그리고 눈을 떴을 때 — 그녀는, 강 위에 뜬 커다란 연잎 배 한가운데 있었다.","c":null},{"s":"yeon","im":true,"t":"나 돼지 됐잖아아아아!"},{"s":"n","t":"비명이 밤하늘 같은 강 위로 길게 퍼졌다. 그러다 뚝, 끊겼다. 소리 지를 폐활량조차, 이 몸엔 얼마 남지 않았다."},{"s":"n","t":"연잎은 믿기 힘들 만큼 컸다. 웬만한 원룸 침대보다 넓었고, 가장자리엔 이슬이 조명처럼 맺혔다. 노도, 돛도, 엔진도 없었다. 그냥 거대한 연잎. 근데 떠 있었다. 심지어, 안정적으로."},{"s":"n","t":"연이는 한참 자기 몸을 내려다봤다. 짧은 앞발. 동그란 배. 꼬불꼬불한 꼬리. 머리 위에 핀 작은 꽃. 분홍빛 몸은 아무리 봐도, 인간의 것이 아니었다."},{"s":"yeon","t":"아니. …이 손으로, 과제는 어떻게 해."},{"s":"n","t":"그 순간, 말끝에 이상한 소리가 섞였다."},{"s":"yeon","t":"이거 진짜 말이 안 되잖아, 꿀."},{"s":"n","t":"연이는 그대로 굳었다."},{"s":"yeon","t":"……방금 뭐야."},{"s":"yeon","x":"talk","t":"안녕하세요. 저는, 인간입니다."},{"s":"n","t":"멀쩡했다. 연이는 아주 작게, 안도했다."},{"s":"yeon","t":"좋아. 말은 됨. 그나마 다행."},{"s":"n","t":"하지만 곧, 앞발을 다시 봤다."},{"s":"yeon","t":"…손가락이, 없어졌다."},{"s":"n","t":"조금 전까지 그녀는 자기 방에 있었다. 젖은 양말, 이상한 앱, 타로 문. 그리고 지금은 — 꽃 달린 돼지. 정확히는, 꽃돼지."},{"s":"n","t":"연이는 연잎 위에 털썩 주저앉았다. 말랑한 몸이 살짝 눌렸다 되돌아왔다. 그 감각이 너무 생생해서, 오히려 더 싫었다."},{"s":"yeon","t":"오케이. 알겠어. …이거, 꿈이야."},{"s":"n","t":"당연했다. 사람이 앱 하나 잘못 눌렀다고 꽃돼지가 되는 건, 아무리 요즘 세상이 이상해도 선을 넘었다."},{"s":"n","t":"연이는 앞발로 연잎 바닥을 톡톡 쳤다. 촉감이, 있었다."},{"s":"yeon","t":"…그래픽 좋네."},{"s":"n","t":"그녀는 아주 진지하게 결론 내렸다. 어제 새벽 세 시까지 한정 이벤트를 돌았으니, 이건 명백한 게임 후유증이라고."},{"s":"yeon","x":"talk","t":"상태창."},{"s":"n","t":"아무것도 뜨지 않았다."},{"s":"yeon","x":"talk","t":"메뉴. …인벤토리."},{"s":"n","t":"바람만 지나갔다. 연이는 눈을 가늘게 떴다."},{"s":"yeon","t":"…UI 불친절하네. 별점 하나."},{"s":"n","bgm":"neo","t":"그때, 연잎 끝에서 낮은 목소리가 들렸다."},{"s":"neo","c":{"who":"neo"},"t":"현실 부정이, 길군."},{"s":"n","t":"연이는 그대로 굳었다. 천천히 고개를 돌렸다. 연잎 끝에, 무언가가 앉아 있었다."},{"s":"n","t":"처음엔 흰 고양이인 줄 알았다. 몸집은 작고, 날렵하고, 꼬리도 길었다. 그런데 목덜미에 — 황금빛 갈기가 있었다. 고양이인데, 갈기가."},{"s":"yeon","t":"…너 뭐야."},{"s":"neo","t":"나는 네오."},{"s":"yeon","t":"고양이야?"},{"s":"neo","t":"아니다."},{"s":"yeon","t":"사자야?"},{"s":"neo","t":"굳이 말하자면, 사자에 더 가깝다."},{"s":"yeon","t":"근데 왜 이렇게 작아? 손바닥만 해."},{"s":"n","t":"네오의 눈썹이 꿈틀했다."},{"s":"neo","t":"…첫 만남부터, 무례하군."},{"s":"yeon","x":"talk","t":"나는 방금 이세계 끌려와서 돼지 됐어. 오늘만큼은, 무례할 권리 있다고 봐."},{"s":"n","t":"네오는 잠시 침묵했다."},{"s":"neo","t":"…그건, 인정한다."},{"s":"yeon","t":"너 NPC야?"},{"s":"neo","t":"아니다."},{"s":"yeon","t":"NPC들이 원래 다 그렇게 말해."},{"s":"neo","t":"나는 사주의 강을 지키는 가디언이다."},{"s":"yeon","t":"…설정 있는 NPC네."},{"s":"n","t":"연이는 머리 위 꽃을 앞발로 눌렀다. 꽃잎이 작게 흔들렸다. 촉감이 있었다. 너무 생생했다."},{"s":"yeon","t":"아. 디테일 미쳤다."},{"s":"neo","t":"아픈가."},{"s":"yeon","t":"아프진 않은데, 기분이 이상해."},{"s":"neo","t":"그럼 현실이다."},{"s":"yeon","t":"그 판정 너무 대충이잖아."},{"s":"n","t":"네오는 대답 대신 배 밖을 바라봤다. 연이도 따라 고개를 돌렸다. 그제야, 주변이 제대로 보였다."},{"s":"n","t":"강이었다. 하지만 평범한 강이 아니었다. 물은 검푸른 밤색, 물결마다 별빛이 부서졌고, 물속엔 낯선 한자들이 물고기처럼 헤엄쳤다. 갑자, 을축, 병인, 정묘 — 시험 범위에 나오면 바로 포기하고 싶은 글자들이었다."},{"s":"n","t":"멀리엔 안개, 그 너머로 기둥 같은 것들이 흐릿하게 서 있었다. 하늘엔 큰 달. 달빛은 이상하게 차갑지 않았다. 예뻤다. 말도 안 되게. …그래서 더 무서웠다."},{"s":"n","t":"꿈이면 깨면 된다. 게임이면 끄면 된다. 하지만 여긴, 끄는 법을 모르는 꿈 같았다."},{"s":"yeon","t":"…여기 어디야."},{"s":"neo","t":"사주의 강."},{"s":"yeon","t":"사주?"},{"s":"neo","t":"사람의 운명 코드가 흘러가는 곳이다."},{"s":"yeon","t":"응. 하나도 모르겠어."},{"s":"neo","t":"정상이다. 처음 온 인간은, 대부분 그렇다."},{"s":"yeon","t":"인간 아니게 됐는데."},{"s":"neo","t":"정확히는, 꽃돼지다."},{"s":"yeon","t":"그 단어, 들을수록 기분 나빠져."},{"s":"neo","t":"그냥 돼지보다는, 낫지 않나."},{"s":"yeon","t":"…그게 위로야?"},{"s":"neo","t":"객관적인 분석이다."},{"s":"n","t":"연이는 깊게 숨을 들이마셨다. 작은 콧김이 나왔다. 꿀꿀. 너무 귀여운 소리였다. 제 입에서 그런 소리가 났다는 사실에, 갑자기 화가 치밀었다."},{"s":"yeon","im":true,"t":"왜 하필 돼지냐고! …그리고 여기 어디야, 나 집에 갈래."},{"s":"neo","t":"쉽지 않다."},{"s":"yeon","t":"쉬운 답, 기대도 안 했어."},{"s":"n","t":"네오가 연잎 위를 천천히 걸었다. 발을 디딜 때마다 바닥이 작게 빛났다. 발끝엔 별 모양 문양. 그냥 이상한 소리만 하는 고양이는, 아닌 것 같았다."},{"s":"yeon","t":"네오. 니가 여기 담당자야?"},{"s":"neo","t":"비슷하다."},{"s":"yeon","x":"talk","t":"그럼 민원 넣을게. 사람이 앱 눌렀다고 돼지 되는 거, 과하지 않아?"},{"s":"neo","t":"나름 귀엽지 않나."},{"s":"yeon","t":"민원 추가. …그리고 내가 누른 건 앱이거든. Code 뭐시기 하는."},{"s":"n","t":"네오의 표정이 조금 굳었다."},{"s":"neo","t":"그건, 문이다."},{"s":"yeon","t":"앱처럼 생겼던데."},{"s":"neo","t":"요즘 인간이 누르기 좋은 형태로 나타났을 뿐이다. 네가 문을 여는 것보다, 앱을 더 잘 누를 테니까."},{"s":"n","t":"연이는 할 말을 잃었다. 맞는 말이라, 더 기분 나빴다."},{"s":"n","t":"그때, 배 아래 강물이 크게 흔들렸다. 첨벙. 연이는 반사적으로 몸을 낮췄다."},{"s":"yeon","t":"방금, 뭐야."},{"s":"n","t":"네오의 눈빛이 바뀌었다. 아까까진 귀찮은 고양이 같더니, 지금은 달랐다. 갈기 끝이 희미하게, 금빛으로 타올랐다."},{"s":"neo","t":"불운의 찌꺼기. …네 현실에서, 새어 나온 것들이다."},{"s":"yeon","t":"내… 현실?"},{"s":"n","t":"네오는 강물 위, 검은 먹물이 번지는 곳을 가리켰다. 그 검은 물은 지나가는 글자를 하나씩 삼켰다. 빛나던 한자들이 검게 변하고, 형태가 비틀렸다."},{"s":"neo","t":"요즘, 운이 계속 꼬였지."},{"s":"n","t":"안 울린 알람. 세 번 튕긴 카드. 속 없던 삼각김밥. 손상된 과제 파일. 엎어진 약속. 지워지지 않던 앱. — 연이는 순간, 말문이 막혔다."},{"s":"n","t":"전부 농담처럼 넘겼지만, 사실 마음 한구석에선 계속 신경 쓰였다. 왜 이렇게까지 꼬이지. 왜 나만 타이밍이 안 맞지. 왜 아무것도 아닌 일이, 매번 나를 비껴가듯 망가지지."},{"s":"yeon","t":"그게… 여기랑, 관련 있어?"},{"s":"neo","t":"네 운명 코드가 훼손됐다. 네 사주 글자가, 흩어졌다는 뜻이다."},{"s":"yeon","t":"내 사주를, 누가 건드렸다고? 왜. 거기 뭐가 있다고 굳이."},{"s":"neo","t":"그걸 알아내려면, 네 글자를 먼저 되찾아야 한다."},{"s":"n","bg":"hands","bgm":"crisis","fx":"hands","t":"네오가 말을 끝내기 전에, 강 아래에서 검은 손이 솟았다. 손이라기엔 너무 길고, 그림자라기엔 너무 선명한. 검은 물로 된 손이, 연잎 가장자리를 붙잡으려 했다."},{"s":"n","t":"연이는 얼어붙었다. 가슴이 철렁 내려앉았다. 방금까지 억지로 붙들던 농담이, 머릿속에서 싹 사라졌다. 저건 꿈의 장식이 아니었다. 무언가가, 자신을 잡으러 오고 있었다."},{"s":"yeon","t":"저거… 나한테 오는 거야?"},{"s":"neo","t":"그렇다."},{"s":"yeon","t":"왜."},{"s":"neo","t":"네가 표적이니까."},{"s":"yeon","im":true,"t":"그걸 왜 그렇게 차분하게 말해!"},{"s":"n","t":"검은 손이 배 위로 뻗어왔다. 연이는 물러나려 했지만, 몸이 아직 남의 것 같았다. 짧은 다리가 연잎 위에서 헛돌았다."},{"s":"yeon","t":"아니, 이 몸 조작감 왜 이렇게 구려!"},{"s":"n","fx":"burst","t":"검은 손이 연이를 붙잡으려는 순간 — 네오가 사라졌다. 아니, 사라진 것처럼 보였다. 금빛 선 하나가 공중을 갈랐다. 촤악. 검은 손이 반으로 갈라지고, 먹물 방울이 흩어졌다."},{"s":"n","t":"네오는 연잎 끝에 착지했다. 작은 몸이었다. 하지만 방금 그 움직임은, 조금도 작지 않았다."},{"s":"yeon","t":"…오."},{"s":"neo","im":true,"t":"이제 고양이라고 부르지 마라. 나는, 사자다."},{"s":"n","t":"연이는 잠시 고민했다."},{"s":"yeon","t":"…전투 고양이?"},{"s":"n","t":"네오의 눈이 가늘어졌다."},{"s":"neo","t":"그냥 네오라고 불러라."},{"s":"yeon","t":"알겠어, 네오."},{"s":"n","fx":"hands","t":"검은 손은 사라지지 않았다. 강 아래에서 더 많은 그림자가 올라왔다. 잘린 손들은 물속으로 녹아, 더 굵고 긴 형태로 다시 뭉쳤다."},{"s":"n","t":"네오가 연잎 바닥을 앞발로 쳤다. 툭. 가장자리에 투명한 물방울이 떠올라, 작은 방패처럼 둘러섰다. 검은 손이 방패를 긁었다. 끼이이익."},{"s":"yeon","t":"…소리 최악."},{"s":"neo","t":"오래는 못 버틴다."},{"s":"yeon","t":"그럼 어떡해."},{"s":"neo","t":"…네 머리 위 꽃은, 살아 있다."},{"s":"n","t":"연이가 머리 위 꽃을 만졌다. 꽃잎이 손끝에 닿았다. 그 순간, 꽃이 아주 약하게 빛났다. 따뜻했다. 아주 작지만, 분명히."},{"s":"yeon","t":"이건, 뭐야."},{"s":"neo","t":"네 일간의 흔적. 너 자신을 나타내는, 중심 글자다."},{"s":"n","t":"연이는 바로 이해를 포기했다."},{"s":"yeon","t":"좋아. 지금은 그냥, 내 꽃이 배터리라고 치자."},{"s":"neo","t":"비슷하지 않다."},{"s":"yeon","t":"내가 이해하기 쉽게 바꾼 거야."},{"s":"neo","t":"틀린 이해는, 위험하다."},{"s":"yeon","t":"너 설명, 꼭 교양 필수 교수님 같아."},{"s":"n","bgm":"neo","t":"검은 손들이 다시 다가왔다. 네오는 강 너머를 바라봤다. 안개 속에, 네 개의 빛이 떠올랐다."},{"s":"n","t":"하나는 날카롭고 푸른빛. 하나는 따뜻한 불빛처럼 흔들렸다. 하나는 황금빛으로 번쩍였다. 마지막 하나는, 오래된 책장처럼 부드럽게 빛났다."},{"s":"neo","t":"네 사주 글자는, 네 개의 섬에 흩어져 있다. 비겁의 섬. 식상의 섬. 재성의 섬. 인성의 섬."},{"s":"n","t":"연이는 네 개의 빛을 바라봤다. 꿈이라기엔 너무 선명하고, 게임이라기엔 너무 무서웠다. 그런데 이상하게도, 저 빛들이 자신을 부르는 것 같았다. 마음 깊은 곳이, 조용히 흔들렸다."},{"s":"yeon","t":"저걸 다 가야, 집에 갈 수 있다는 거지."},{"s":"neo","t":"그렇다."},{"s":"yeon","t":"중간에 환불은."},{"s":"neo","t":"없다."},{"s":"yeon","t":"문의 게시판은."},{"s":"neo","t":"없다."},{"s":"yeon","t":"고객센터는."},{"s":"neo","t":"…나름, 내가 있다."},{"s":"yeon","t":"…뭔가 엄청 불안한데."},{"s":"neo","t":"불만은, 접수하지 않는다."},{"s":"yeon","t":"최악의 고객센터네."},{"s":"n","fx":"hands","t":"그때 검은 손 하나가, 방패를 뚫고 들어왔다."},{"s":"yeon","t":"꿀악!"},{"s":"n","t":"연이는 바로 제 입을 막았다."},{"s":"yeon","t":"…방금 건, 놀라서 그런 거야."},{"s":"neo","t":"알고 있다."},{"s":"n","fx":"burst","t":"네오가 다시 뛰어올랐다. 발톱에 금빛 문양이 떠올랐다. — 사주성광. 앞발을 휘두르자, 별빛 칼날이 강물 위를 가르며 퍼졌다. 검은 손들이 한꺼번에 잘려 나갔다."},{"s":"n","bg":"river","bgm":"neo","t":"연잎 배가 앞으로 밀려났다. 강물이 길을 열듯 갈라졌다. 네오는 착지하자마자, 낮게 말했다."},{"s":"neo","t":"첫 목적지는, 비겁의 섬이다."},{"s":"yeon","t":"비겁?"},{"s":"neo","t":"너와 닮은 것들이, 있는 섬이다."},{"s":"yeon","t":"나랑 닮은 게, 또 있어?"},{"s":"neo","t":"많다. 친구, 경쟁자, 자존심, 질투 — 그리고, 용기."},{"s":"n","t":"연이는 말없이 안개 속 첫 번째 빛을 바라봤다. 그 빛은 아름답기보다, 유리처럼 날카로웠다. 가까이 가면, 베일 것 같았다."},{"s":"yeon","t":"…왜 하필 첫 섬부터, 느낌이 별로야."},{"s":"neo","t":"너 자신과 마주하는 일은, 원래 편하지 않다."},{"s":"yeon","t":"…또 명언처럼 말하네."},{"s":"neo","t":"사실이니까."},{"s":"n","tone":"dark","t":"연잎 배가 속도를 냈다. 뒤에선 검은 손들이 다시 강물을 찢고 올라왔다. 앞에선 안개가 짙어졌다. 그 너머로, 섬의 그림자가 조금씩 드러났다. 비겁의 섬."},{"s":"n","im":true,"t":"섬 주변엔 수많은 작은 거울 조각이 떠 있었다. 그 거울마다 — 무언가가, 비쳤다."}]});
EPISODES.push({"no":"EP.02","tag":"제2화 · 갈기 있는 고양이? 네오","title":"갈기 있는 고양이? 네오","beats":[{"s":"n","bg":"island","bgm":"neo","l":{"who":"yeon"},"c":{"who":"neo"},"t":"연잎 배가 비겁의 섬 선착장에 닿았다. 툭. 생각보다, 작은 소리였다."},{"s":"n","t":"등 뒤를 쫓던 검은 손들은 섬 앞에서 우뚝 멈췄다. 안개 밖에서 잠깐 꿈틀거리다, 강물 아래로 스르르 가라앉았다."},{"s":"n","t":"연이는 연잎 가장자리를 붙든 채 한참 숨을 골랐다. 손가락도 없는 짧은 앞발에, 힘이 잔뜩 들어가 있었다. 그래도 어떻게든, 붙잡고는 있었다."},{"s":"yeon","t":"살았다……."},{"s":"n","t":"말끝에 작은 콧김이 샜다. 꿀. 연이는 곧바로 제 입을 앞발로 틀어막았다."},{"s":"yeon","t":"아니. 방금 건 그냥 숨소리야. 돼지 소리 아님."},{"s":"n","t":"네오는 대답 대신, 선착장으로 사뿐히 뛰어내렸다. 작은 몸이 내려앉자, 검은 유리 바닥에 금빛 발자국이 잠깐 피었다 사라졌다."},{"s":"yeon","t":"와. 저기 효과음만 깔리면, 완전 게임인데."},{"s":"neo","t":"아직도 게임이라고 생각하나."},{"s":"yeon","t":"희망은 아직 안 버렸어. 로딩 화면 한 번만 떠 주면 바로 인정할게."},{"s":"neo","t":"현실 부정도 재능이라면, 제법 큰 재능이군."},{"s":"yeon","t":"칭찬으로 접수할게. 근데 너, 진짜 정체가 뭐냐. 갈기 달린 고양이야, 사이즈 줄인 사자야."},{"s":"neo","t":"…사자다."},{"s":"yeon","t":"근데 자꾸 고양이처럼 보인단 말이지."},{"s":"neo","t":"한 번만 더 말하면, 그 발자국 네 이마에 남겨 준다."},{"s":"n","t":"연이는 조심스럽게 연잎에서 내려오려 했다. 앞발을 먼저 딛고, 뒷다리를 옮기려는 순간—"},{"s":"yeon","t":"어, 어어?"},{"s":"n","fx":"burst","t":"짧은 다리가 통 말을 안 들었다. 연이는 그대로 선착장 바닥에 코를 박았다. 퍽."},{"s":"n","t":"아프진 않았다. 대신 자존심이, 조금 아팠다."},{"s":"neo","t":"착지는… 연습이 좀 필요하겠어."},{"s":"yeon","t":"분석하지 마."},{"s":"n","bg":"islandIn","t":"비겁의 섬은 조용했다. 풀도, 집도, 사람도 없었다. 대신 섬 전체가, 거울 조각으로 지어진 것 같았다."},{"s":"n","t":"바닥은 검은 유리처럼 반짝였고, 크고 작은 거울이 공중에 떠 있었다. 손바닥만 한 것도, 문짝만 한 것도 있었다. 거울마다 각도가 달랐다."},{"s":"n","t":"하늘을 비추는 거울. 강을 비추는 거울. 연잎 배를 비추는 거울. 그리고— 연이를 비추는 거울."},{"s":"n","r":{"who":"mirror","x":"pig"},"t":"연이는 가까운 거울 하나를 들여다봤다. 거기, 꽃돼지가 있었다. 분홍빛 몸. 머리에 얹힌 작은 꽃. 짧은 앞발."},{"s":"n","t":"너무 귀여웠다. 그래서, 마음에 안 들었다."},{"s":"yeon","t":"아직도 적응이 안 돼."},{"s":"n","t":"연이가 앞발을 들자, 거울 속 꽃돼지도 앞발을 들었다. 좌우만 반대로. 고개를 갸웃하니, 거울 속 녀석도 똑같이 갸웃했다."},{"s":"yeon","t":"야. 따라 하지 마."},{"s":"n","t":"당연히 거울 속 꽃돼지도 입만 뻐끔댔다. 소리는 나지 않았다. 어쩐지 그게 더 얄미웠다."},{"s":"n","t":"연이가 몸을 이리저리 돌리자 꼬리가 같이 살랑였다. 그게 또 귀여워서, 더 짜증이 났다."},{"s":"yeon","t":"아 진짜."},{"s":"neo","t":"왜 그러지."},{"s":"yeon","t":"나 원래 걸크러시가 추구민데. 하필 장르가 힐링 동물상으로 갈아엎혔잖아."},{"s":"neo","t":"…복잡한 감정이군."},{"s":"yeon","t":"넌 몰라. 어느 날 갑자기 외모 장르가 통째로 바뀐 사람 심정."},{"s":"neo","t":"나는 태어날 때부터 완성형이었다."},{"s":"yeon","t":"아, 예. 그러셔."},{"s":"n","bgm":"gloom","r":null,"t":"연이는 대충 넘기고 섬 안쪽으로 걸었다. 안으로 갈수록 거울 조각이 촘촘해졌다. 그런데— 이상했다."},{"s":"n","t":"어떤 거울은, 지금의 꽃돼지 연이를 비추지 않았다. 처음엔 잘못 본 줄 알았다. 연이는 멈춰 섰다."},{"s":"n","r":{"who":"mirror"},"t":"거울 속에는— 사람이 있었다."},{"s":"n","t":"젖은 머리. 헐렁한 후드티. 무릎 나온 트레이닝 바지. 침대에 던져 둔 충전기 케이블. 손에 쥔 휴대폰."},{"s":"n","t":"그리고 피곤한 얼굴로 화면을 내려다보는, 스물셋의 대학생. 연이였다. 원래의, 연이. 너무 익숙해서, 오히려 낯설었다."},{"s":"n","t":"연이는 천천히 거울 앞으로 다가갔다. 앞발이 바닥에 닿을 때마다, 탁, 탁, 작은 소리가 났다."},{"s":"n","t":"거울 속 연이는 침대에 앉아 있었다. 방금 전까지 현실에 있던, 그 모습 그대로. 머리는 대충 묶였고, 얼굴엔 지친 기색이 남아 있었다. 그래도 그건, 연이가 알던 자기 얼굴이었다."},{"s":"n","t":"사람의 손. 사람의 다리. 사람의 눈. 연이가 잃어버린 것들이, 거울 한 겹 너머에 전부 있었다."},{"s":"n","t":"연이는 제 앞발을 내려다봤다가, 다시 거울을 봤다. 가슴 한구석이, 이상하게 조여 왔다."},{"s":"yeon","t":"나…… 저렇게 생겼었지."},{"s":"n","t":"목소리가 생각보다 작게 나왔다. 목이, 잘 열리지 않았다."},{"s":"n","t":"잊고 있던 것들이 한꺼번에 돌아왔다. 손가락으로 화면을 밀어 넘기던 감각. 머리 묶을 때 손목에 걸리던 머리끈."},{"s":"n","t":"젖은 양말을 벗어 던지던 짜증. 날아간 과제 파일 앞에서의 허탈함. 그 사소한 전부가, 갑자기 아득히 멀어져 있었다."},{"s":"n","fx":"veil","t":"연이는 앞발을 들어 거울에 댔다. 차가웠다. 거울 속 연이도 손을 들었다. 사람 손바닥과 짧은 앞발이, 유리 한 겹을 사이에 두고 마주 닿았다."},{"s":"n","t":"그 순간, 연이는 이상하게 울컥했다. 돌아가고 싶었다. 정말로."},{"s":"n","t":"방금까진 집에 갈래, 를 반쯤 농담으로 말했는데. 지금은 달랐다. 그 말이, 갑자기 진짜가 되었다."},{"s":"yeon","t":"집에 가고 싶다. 내 방으로. 내 침대로. 내 손가락으로."},{"s":"yeon","t":"…네오."},{"s":"neo","t":"응."},{"s":"yeon","t":"저거…… 진짜 나야?"},{"s":"n","t":"네오가 거울을 보았다. 그의 표정도, 조금 진지해졌다."},{"s":"neo","t":"네 본래 모습이다."},{"s":"yeon","t":"그럼 저기로 들어가면, 돌아갈 수 있어?"},{"s":"neo","t":"아니다."},{"s":"n","t":"대답은 빠르고, 단호했다. 연이는 거울에서 눈을 떼지 못한 채 물었다."},{"s":"yeon","t":"…왜."},{"s":"neo","t":"비겁의 섬 거울은 출구가 아니다. 네가 잃어버린 자리들을 비추는 곳이지."},{"s":"yeon","t":"자리?"},{"s":"neo","t":"네가 너 자신이라 믿었던 자리. 남들이 보는 너. 네가 되고 싶었던 너. 그리고— 네가 밀려났다고 느낀 자리."},{"s":"n","t":"알 것 같은데, 알고 싶지 않은 말이었다. 그래서 더 싫었다."},{"s":"n","bgm":"crisis","t":"그때, 거울 속 연이가 움직였다. 연이는 숨을 멈췄다."},{"s":"n","t":"분명 방금까진 거울이 연이를 따라 하고 있었다. 그런데 지금은— 반대였다."},{"s":"n","t":"거울 속 인간 연이가, 연이와 다른 표정을 짓고 있었다. 조금 더 차분하게. 조금 더 똑바로 서서. 조금 더— 연이답지 않게, 자신 있게."},{"s":"geo","im":true,"t":"늦었네."},{"s":"n","t":"연이는 얼어붙었다."},{"s":"yeon","t":"……뭐?"},{"s":"geo","t":"너, 항상 늦잖아."},{"s":"n","t":"작은 말이었다. 그런데 손톱처럼 날카로웠다. 연이는 저도 모르게, 뒤로 한 걸음 물러났다."},{"s":"geo","t":"알람도 늦고. 답장도 늦고. 사과도 늦고. 기회도 늦고."},{"s":"n","fx":"ink","t":"거울 표면에, 가느다란 금이 하나 갔다."},{"s":"geo","t":"이번에도— 늦었어."},{"s":"n","t":"연이는 입술을 깨물었다."},{"s":"yeon","t":"너 뭐야."},{"s":"geo","t":"나? 연이."},{"s":"n","t":"그 대답이 제일 싫었다. 연이는 제 가슴을 앞발로 툭 쳤다."},{"s":"yeon","t":"연이는 나거든?"},{"s":"geo","t":"그래? 지금, 그 몸으로?"},{"s":"n","t":"순간 말문이 막혔다. 화는 나는데, 이상하게 바로 받아치지 못했다."},{"s":"n","t":"거울 속 연이가 너무 자연스러웠기 때문이다. 자기 방에 있던 모습. 자기 목소리. 자기 얼굴. 자기 표정."},{"s":"n","t":"만약 누가 둘 중 하나를 진짜 연이로 골라야 한다면— 분홍 꽃돼지일까. 아니면, 저 사람일까."},{"s":"neo","t":"조심해라."},{"s":"yeon","t":"저거 뭔데."},{"s":"neo","t":"비겁의 섬이 만든 반영이다. 너와 같은 얼굴을 한 경쟁자. 네 자리를 노리는, 또 다른 너."},{"s":"yeon","t":"그러니까 도플갱어네."},{"s":"neo","t":"쉽게 말하면 그렇다."},{"s":"yeon","t":"내 인생, 진짜 콘텐츠 하나 안 빠지고 다 나오네."},{"s":"geo","t":"여긴, 네 자리 없어."},{"s":"n","fx":"veil","t":"그 말이 섬 전체에 퍼졌다. 그러자 주변 거울들이 하나둘 빛나기 시작했다. 작은 거울마다, 다른 장면이 비쳤다."},{"s":"n","t":"강의실 맨 뒷자리. 누군가 먼저 앉아 있는 자리. 조별 과제 채팅방에 늦게 올라간 연이의 메시지. 읽히지 않은 답장."},{"s":"n","t":"면접 취소 문자. 제출 실패한 공모전 화면. 그리고 편의점 바닥에 떨어진, 삼각김밥 하나."},{"s":"yeon","t":"야, 삼각김밥은 빼라. 그건 너무 하찮잖아."},{"s":"n","t":"장난처럼 던졌지만, 목소리 끝이 조금 흔들렸다. 사소한 일들인데. 하나하나는 웃어넘길 수 있는 일들인데."},{"s":"n","t":"쌓이니까, 자꾸 밀려나는 느낌이었다. 제자리에서 조금씩 밀리고, 늦고, 놓치고— 결국 없는 사람이 되는 느낌."},{"s":"n","t":"그때, 가장 큰 거울 하나가 천천히 떠올랐다. 다른 거울과 달랐다. 검푸른 빛이 감돌고, 표면이 물처럼 흔들렸다."},{"s":"n","t":"그 안에 연이의 본래 모습이 서 있었다. 하지만 이번엔 방 안이 아니었다. 검은 강 위였다. 사람의 모습으로."},{"s":"n","t":"그 연이의 발밑엔, 아주 작은 새싹 하나가 돋아 있었다. 새싹 아래로는, 깊은 물결이 일렁였다."},{"s":"sys","t":"[ 乙亥 ]"},{"s":"n","t":"거울 가장자리에 떠오른 두 글자를, 연이는 가만히 바라봤다. 이상하게, 눈을 뗄 수 없었다."},{"s":"n","t":"을해. 처음 보는 글자처럼 낯설었는데, 아주 오래전부터 알던 이름 같았다. 가슴 안쪽이 작게 울렸다. 머리 위 꽃이, 희미하게 빛났다."},{"s":"neo","t":"찾았다."},{"s":"yeon","t":"뭘."},{"s":"neo","t":"네 일주. 네가 태어난 날의 기둥. 네 중심에 가장 가까운 글자."},{"s":"neo","im":true,"t":"을해일주."},{"s":"yeon","t":"을해일주……."},{"s":"n","t":"그 말을 입에 올리는 순간, 머리 위 꽃이 조금 더 밝게 빛났다. 거울 속 인간 연이도 그 빛을 보았다. 그리고 처음으로— 표정이 굳었다."},{"s":"geo","t":"안 돼."},{"s":"n","fx":"burst","t":"거울 속 연이가 손을 뻗었다. 거울 속 [乙亥] 글자가, 그녀 쪽으로 끌려가기 시작했다."},{"s":"neo","t":"연이, 막아라!"},{"s":"yeon","t":"어떻게!"},{"s":"neo","t":"네 이름을 붙잡아!"},{"s":"yeon","t":"그게 무슨 소리야! 좀 알아듣게 말하라고!"},{"s":"neo","t":"네 자리를, 뺏기지 말라는 뜻이다!"},{"s":"geo","t":"너는 지금, 네가 싫잖아."},{"s":"n","t":"연이는 멈칫했다."},{"s":"geo","t":"그 몸도 싫고. 여기 있는 것도 싫고. 운 나빠진 네 현실도, 싫고."},{"s":"n","fx":"ink","t":"거울 속 연이가 한 걸음 앞으로 나왔다. 거울 표면이, 물처럼 출렁였다."},{"s":"geo","im":true,"t":"그러니까— 내가 할게. 내가 진짜 연이야."},{"s":"n","t":"연이의 심장이 철렁 내려앉았다."},{"s":"geo","t":"네 대신, 내가 돌아갈게."},{"s":"n","t":"연이는 숨이 막혔다. 거울 속 자신은 너무 그럴듯했다. 인간의 모습. 익숙한 얼굴. 정상적인 손. 정상적인 목소리."},{"s":"n","t":"지금의 연이가 잃어버린 것들을— 저 애는, 전부 가지고 있었다."},{"s":"geo","t":"어차피 그 꼴로 돌아가 봐야, 아무도 널 너라고 안 믿을걸?"},{"s":"n","t":"그 말이 목에 걸렸다. 연이는 제 앞발을 내려다봤다. 분홍빛. 짧고 둥근. 귀여운데, 자기 같지 않은 몸."},{"s":"n","t":"잠깐이었다. 정말 잠깐. 저 애가 대신 돌아가면? 저게 나보다 낫다면?"},{"s":"n","t":"그런 생각을 했다는 사실이, 연이는 스스로에게 조금 충격이었다."},{"s":"neo","t":"너무 귀 기울여 듣지 마."},{"s":"yeon","t":"근데……."},{"s":"neo","t":"거울은, 네가 너를 싫어하는 그 틈을 파고든다."},{"s":"n","t":"네오가 연이 앞을 가로막고 섰다."},{"s":"neo","t":"비겁의 섬은 싸움의 섬이다. 하지만 상대는 남이 아니야. 네 자리를 뺏으려는, 또 다른 너다."},{"s":"geo","t":"말이 많네."},{"s":"n","fx":"claw","t":"거울 속 연이가 손가락을 튕겼다. 주변 거울 조각이 일제히 날아올랐다. 날카로운 유리가, 연이와 네오를 향해 쏟아졌다."},{"s":"neo","t":"뒤로!"},{"s":"n","fx":"burst","t":"네오의 갈기가 금빛으로 타올랐다. 그가 뛰어올라 공중에서 몸을 회전했다. 금빛 발톱이 유리 조각을 쳐 냈다. 쨍. 쨍. 쨍."},{"s":"n","t":"파편이 사방으로 흩어졌다. 네오는 착지하자마자, 다시 자세를 낮췄다."},{"s":"neo","t":"저 글자에서 눈 떼지 마!"},{"s":"n","t":"연이는 큰 거울을 노려봤다. 을해. 그 글자는 거울 속 인간 연이와, 지금의 꽃돼지 연이 사이에서 흔들렸다. 마치, 진짜 주인을 못 고르는 것처럼."},{"s":"yeon","t":"내 거라며."},{"s":"neo","t":"그래."},{"s":"yeon","t":"그럼 왜 쟤한테 가려고 하는데."},{"s":"neo","t":"네가, 너 자신을 부정하고 있으니까."},{"s":"n","t":"그 말에 연이는 숨을 멈췄다. 현실 부정. 꿈이라고 생각했다. 게임이라고 우겼다. 이세계 전이물이라고 밀어붙였다."},{"s":"n","t":"꽃돼지가 된 자신을, 계속 밀어냈다. 그럴 수밖에 없었다. 인정하기 싫었으니까. 무서웠으니까."},{"s":"n","t":"그리고 그 틈을— 거울 속 연이가, 야금야금 차지하고 있었다."},{"s":"yeon","t":"아…… 그런 식이야?"},{"s":"n","fx":"burst","t":"거울 속 연이가 다시 손을 뻗었다. [乙亥] 글자가 그녀 쪽으로 더 끌려갔다. 연이 머리 위 꽃이 위태롭게 흔들렸다."},{"s":"neo","t":"연이!"},{"s":"n","t":"연이는 눈을 감았다. 잠깐. 아주 잠깐만. 그리고 다시 떴다."},{"s":"n","t":"아직도 겁이 났다. 아직도 집에 가고 싶었다. 아직도 이 몸이 싫었다. 아직도, 이게 꿈이었으면 했다. 하지만."},{"s":"yeon","t":"야."},{"s":"n","t":"거울 속 연이가 그녀를 보았다. 연이는 제 앞발로 가슴을 툭 쳤다."},{"s":"yeon","t":"나도 지금 내 꼴, 하나도 마음에 안 들어."},{"s":"yeon","t":"손가락도 없고. 다리도 짧고. 놀라면 꿀 소리 나오고."},{"s":"n","t":"말끝에 정말 작게, 꿀, 하는 소리가 샜다."},{"s":"yeon","t":"…봐. 이것도 짜증 나."},{"s":"geo","t":"그러니까 내가—"},{"s":"yeon","t":"근데."},{"s":"n","t":"연이가 말을 끊었다. 머리 위 꽃이 다시 빛났다. 아직 약했지만, 아까보다 선명했다."},{"s":"yeon","im":true,"t":"그래도, 연이는 나야."},{"s":"n","t":"거울 속 연이의 표정이 굳었다."},{"s":"yeon","t":"지금 이 꼴이어도."},{"s":"n","t":"연이는 한 걸음 앞으로 나아갔다. 짧은 다리라 걸음은 크지 않았다. 하지만 분명, 앞으로였다."},{"s":"yeon","t":"내가 늦었어도."},{"s":"n","t":"또 한 걸음."},{"s":"yeon","t":"꼬였어도."},{"s":"n","t":"또 한 걸음."},{"s":"yeon","t":"운이 아주 제대로 망했어도."},{"s":"n","t":"연이는 마침내, 큰 거울 앞에 섰다."},{"s":"yeon","im":true,"t":"내 자리는, 내가 정해."},{"s":"n","fx":"ink","t":"그 순간, [乙亥] 글자가 크게 흔들렸다. 거울 속 인간 연이가, 이를 악물었다."},{"s":"geo","t":"아직 아니야. 너는 아직, 네가 뭔지도 몰라."},{"s":"n","fx":"burst","t":"거울 표면이 쩍 갈라졌다. 그 아래에서 검푸른 물이 흘러나왔다. 깊고, 차가운 물. 그 안에서, 아주 작은 초록빛 새싹이 올라왔다."},{"s":"neo","t":"乙."},{"s":"n","t":"새싹 아래로, 검푸른 물결이 감돌았다."},{"s":"neo","t":"亥."},{"s":"n","t":"을목. 해수. 작은 새싹과, 깊은 물. 거울 속 글자가, 완전히 제 모습을 드러냈다."},{"s":"sys","t":"[ 乙亥 ]"},{"s":"n","bgm":"crisis2","t":"그리고 그 순간. 거울 속 인간 연이가, 거울 밖으로 한 발을 내디뎠다."},{"s":"n","t":"연이는 얼어붙었다. 거울에서 걸어 나온 인간 연이가, 연이와 똑같은 얼굴로 웃었다."},{"s":"geo","t":"좋아. 그럼 증명해 봐."},{"s":"n","fx":"veil","t":"주변 거울들이 일제히 빛났다."},{"s":"geo","im":true,"t":"네가 진짜 연이라는 걸."},{"s":"n","t":"연이는, 자신과 똑같은 얼굴을 한 상대를 바라봤다. 아직 손에 들어온 건 없었다. 하지만 분명 알았다. 저 글자, 을해. 그건 자신이 되찾아야 할, 첫 번째 기둥이었다."},{"s":"neo","t":"물러서지 마라."},{"s":"n","t":"연이는 깊게 숨을 들이켰다. 머리 위 작은 꽃잎이, 바람에 흔들렸다."},{"s":"yeon","t":"응. 근데 하나만 말하자."},{"s":"n","t":"거울 속 연이가 고개를 기울였다. 연이가 눈을 가늘게 떴다."},{"s":"yeon","im":true,"t":"내 얼굴로, 그렇게 재수 없게 웃지 마."},{"s":"n","t":"거울 속 연이가, 웃음을 멈췄다."},{"s":"sys","t":"[ 비겁의 섬 · 첫 번째 시험 시작 ]"}]});
EPISODES.push({"no":"EP.03","tag":"제3화 · 본체 인증 실패","title":"본체 인증 실패","beats":[{"s":"n","bg":"islandIn","bgm":"gloom","l":{"who":"yeon"},"c":{"who":"neo"},"r":{"who":"mirror"},"t":"거울 회랑은 숨소리까지 되비추는 곳이었다. 연이의 짧은 콧숨이 사방 유리벽에 부딪혀 몇 겹으로 되돌아왔다."},{"s":"n","t":"맞은편에는 연이의 진짜 얼굴을 한 존재가 서 있었다. 젖은 앞머리, 낡은 후드티, 두 다리로 선 사람. 그게 웃었다."},{"s":"geo","t":"그럼 증명해봐."},{"s":"yeon","t":"…뭘."},{"s":"geo","t":"네가 진짜 연이라는 걸."},{"s":"n","bgm":"crisis","fx":"burst","t":"그 말이 끝나기 무섭게, 비겁의 섬 전체가 발밑에서 쿵, 하고 한 박자 내려앉았다."},{"s":"n","t":"공중에 떠 있던 수백 개의 거울이 일제히 뒤집혔다. 뒷면마다 파란 글자가 켜졌다."},{"s":"sys","im":true,"t":"[ 비겁의 섬 · 본시험 시작 ]"},{"s":"sys","t":"[ 본체 인증을 진행합니다. ]   [ 제한 시간 10:00 ]"},{"s":"n","t":"연이는 둥근 눈을 깜빡였다. 머리 위 꽃잎이 파란 불빛을 받아 서늘하게 물들었다."},{"s":"yeon","t":"뭐야. 갑자기 웬 본인 인증. 나 방금 로그인했는데."},{"s":"geo","t":"맞아. 네 인생 로그인 권한을 걸고."},{"s":"n","t":"연이의 앞발이 멈칫했다. 얼굴에서 능글맞은 웃음기가, 물 빠지듯 사라졌다."},{"s":"yeon","t":"…로그인 권한?"},{"s":"neo","t":"비겁의 섬은 네 '자리'를 시험한다. 여기서 자리를 빼앗기면, 현실로 돌아가는 권한까지 흔들린다."},{"s":"yeon","t":"잠깐. 그 말은—"},{"s":"yeon","t":"쟤가 나 대신 현실로 걸어 들어갈 수도 있다는 얘기야?"},{"s":"n","t":"네오는 대답하지 않았다. 흰 사자의 꼬리 끝만 딱, 한 번 멎었다. 그 침묵이 곧 대답이었다."},{"s":"geo","t":"이해 빠르네. 역시 내 머리야."},{"s":"n","t":"거울 속 연이가 두 손을 활짝 펼쳤다. 손가락 열 개, 마디마디 멀쩡한 손가락이었다. 젖은 머리, 후드티, 두 다리, 원래의 얼굴. 전부 연이가 잃어버린 것들이었다."},{"s":"n","t":"반면 연이는 꽃돼지였다. 짧은 앞발. 둥근 배. 정수리에 얹힌 작은 꽃 한 송이. 너무 귀엽고, 너무 불리했다."},{"s":"yeon","t":"와. 시작부터 스펙 차이 실화냐."},{"s":"geo","t":"억울하면 이기면 되지."},{"s":"yeon","t":"야, 내 얼굴로 그런 재수 없는 말 하지 마. 기분 이상해."},{"s":"geo","t":"그것도 네 말투인데?"},{"s":"yeon","t":"…내가 이렇게 얄밉게 말한다고?"},{"s":"geo","t":"응. 아주."},{"s":"yeon","t":"오케이. 자기 객관화 방금 강제 완료. 좀 상처인데."},{"s":"n","fx":"veil","t":"그때 거울 하나가 스르륵 내려와 연이 코앞에 멈췄다. 유리 표면에 문장이 떴다."},{"s":"sys","t":"[ 인증 항목 1 · 이름 ]"},{"s":"n","t":"쉬운 문제였다. 연이는 곧장 입을 뗐다."},{"s":"yeon","t":"연이."},{"s":"n","t":"거울이 삐빅, 하고 야박한 소리를 냈다."},{"s":"sys","t":"[ 불충분 ]"},{"s":"yeon","t":"…왜? 내 이름 내가 대는데 뭐가 불충분이야."},{"s":"geo","t":"이름은 나도 알거든."},{"s":"n","t":"거울 속 연이가, 똑같은 목소리로, 태연하게 따라 말했다."},{"s":"geo","t":"연이."},{"s":"n","t":"그러자 거울이 파랗게, 훨씬 밝게 빛났다."},{"s":"sys","t":"[ 후보자 2명 확인 ]   [ 본체 판별 불가 ]"},{"s":"yeon","t":"야, 네오. 이 시스템 보안 완전 허술한 거 아냐? 이름만 대면 통과면 나도 남 계정 털겠다."},{"s":"neo","t":"비겁은 '같은 기운'이다. 겉이 같은 것만으로는 구분되지 않아. 그래서 어려운 거다."},{"s":"yeon","t":"그런 중요한 걸 왜 이제 말해?"},{"s":"neo","t":"지금 알면 된다."},{"s":"yeon","t":"너 고객센터 열면 별점 1점이야. 응대가 너무 불친절해."},{"s":"n","bgm":"gloom","t":"두 번째 거울이 소리 없이 내려왔다. 유리 안쪽부터 서서히 밤 빛깔로 어두워졌다."},{"s":"sys","t":"[ 인증 항목 2 · 기억 ]"},{"s":"n","tone":"desat","t":"거울 속에 연이의 현실이 비쳤다. 아침 알람이 울리지 않던 날. 개찰구에서 버스 카드만 세 번 오류 나던 순간."},{"s":"n","tone":"desat","t":"제출 직전 과제 파일이 깨져, 커서만 깜빡이는 화면 앞에 멍하니 앉아 있던 밤. 보내려다 지운 메시지. 하루 종일 확인만 하던, 읽히지 않는 답장. 그리고 아무렇지 않은 척 웃던 얼굴."},{"s":"n","t":"연이는 입술을 다물었다. 장면 하나하나는 별것도 아니었다. 그런데 그게 한꺼번에 밀려오자, 가슴 안쪽 어딘가가 손으로 꾹 눌린 것처럼 답답해졌다."},{"s":"geo","t":"나는 늘 늦었어."},{"s":"sys","t":"[ 기억 일치 ]"},{"s":"geo","t":"말하고 싶을 땐 이미 늦었고, 붙잡고 싶을 땐 놓쳤고, 괜찮은 척하다가 혼자 방에서 무너졌지."},{"s":"sys","t":"[ 기억 일치 ]"},{"s":"n","t":"연이의 머리 위 꽃이, 바람도 없는데 희미하게 떨렸다."},{"s":"geo","t":"봤지? 나도 네 인생, 처음부터 끝까지 다 알아."},{"s":"n","t":"연이는 어금니를 지그시 물었다. 맞다. 저건 한 장면도 빠짐없이 자신의 기억이었다. 부정할 수가 없었다."},{"s":"n","t":"그런데 이상했다. 뭔가가 목에 걸린 생선 가시처럼 남았다."},{"s":"n","t":"거울 속 연이는 분명 그 기억들을 읊고 있었다. 하지만 그 안에서 아팠던 감정만, 쏙 빠져 있었다. 마치 남의 일을 깔끔하게 정리해 제출한, 각주까지 달린 감정 없는 보고서 같았다."},{"s":"yeon","t":"…맞아. 늦었어."},{"s":"n","t":"거울이 파르르 흔들렸다."},{"s":"yeon","t":"말해야 할 때 입 꾹 다문 적도 있고, 답장 기다리다 괜히 잠금화면만 백 번 켠 적도 있고, 아무렇지 않은 척 웃은 적도 많아."},{"s":"n","t":"연이는 짧은 앞발을, 둥근 가슴 위에 얹었다."},{"s":"yeon","im":true,"t":"근데 그때 나, 속으로는 하나도 안 괜찮았어."},{"s":"n","t":"거울 속 연이의 표정이, 아주 살짝 굳었다. 완벽했던 보고서에 처음으로 오타가 하나 난 것처럼."},{"s":"yeon","t":"웃긴 척한 것도 괜찮아서가 아니야. 안 웃으면 그 자리에서 진짜 울어버릴 것 같아서였어."},{"s":"n","fx":"veil","t":"거울이 눈부시게 빛났다."},{"s":"sys","t":"[ 감정 일치 ]   [ 본체 반응 감지 ]"},{"s":"n","t":"연이의 머리 위 꽃이, 조금 더 환하게 물들었다. 서늘하던 파란빛에 따뜻한 기가 한 겹 섞였다."},{"s":"geo","t":"…제법이네?"},{"s":"yeon","t":"나도 내 얘기 정도는 좀 알거든."},{"s":"geo","t":"그럼 다음도 맞혀봐. 이번 건 좀 아플 거야."},{"s":"n","bgm":"crisis","t":"세 번째 거울이 내려왔다. 다른 거울과 달리, 이건 아무것도 비추지 않는 척하다가 스르륵 상을 맺었다."},{"s":"sys","t":"[ 인증 항목 3 · 현재의 몸 ]"},{"s":"n","t":"거울 안에는 꽃돼지가 있었다. 분홍빛 몸. 정수리의 작은 꽃. 둥근 배. 짧은 다리. 연이 자신이었다."},{"s":"yeon","t":"아…. 이건 아직도 적응 안 된다."},{"s":"geo","t":"그럼 포기해. 편하게."},{"s":"yeon","t":"싫은데?"},{"s":"geo","t":"싫다며. 그 몸."},{"s":"yeon","t":"싫지. 솔직히 싫어. 손가락도 없고, 다리도 짤막하고, 놀라면 콧구멍에서 꿀 소리 나오고—"},{"s":"yeon","t":"내 인생 비주얼 밸런스 지금 완전 붕괴 났어. 그래프로 그리면 절벽이야."},{"s":"n","t":"말끝에 저도 모르게, 꿀, 하고 작은 콧김이 새어 나왔다. 연이는 눈을 질끈 감았다."},{"s":"yeon","t":"아 진짜. 방금 그거 카운트 안 하기다."},{"s":"geo","t":"봐. 너도 싫잖아. 이런 게 네 본체일 리 없잖아."},{"s":"yeon","t":"싫어."},{"s":"n","t":"연이는 순순히 인정했다. 그리고, 천천히 고개를 들었다. 파란 불빛 속에서 눈동자가 흔들리지 않았다."},{"s":"yeon","t":"근데 싫다고, 그게 내가 아닌 건 아니잖아."},{"s":"n","t":"거울 속 연이의 웃음이, 뚝 멈췄다. 연이는 거울에 비친 꽃돼지의 눈을 똑바로 마주 봤다."},{"s":"yeon","t":"이 모습 마음에 안 들어. 근데 지금 도망 안 가고 이 회랑에 서 있는 건, 나야."},{"s":"n","t":"머리 위 꽃이 스스로 빛을 냈다. 이번엔 거울이 준 빛이 아니었다."},{"s":"yeon","im":true,"t":"겁나도 버티는 것도 나고, 말도 안 되는 상황에서 끝까지 따지는 것도 나고, 네 말에 빡치는 것도 전부 나야."},{"s":"n","fx":"burst","t":"거울이 크게 요동쳤다. 유리 표면에 잔금이 쫙, 하고 번졌다."},{"s":"sys","im":true,"t":"[ 현재 인정 ]   [ 본체 반응 상승 ]"},{"s":"n","t":"연이의 앞발 바로 아래, 유리 바닥을 뚫고 초록빛 새싹 하나가 톡, 돋아났다. 손톱보다 작았다. 하지만 선명했다."},{"s":"neo","t":"잡아라. 지금."},{"s":"n","t":"연이는 생각보다 몸이 먼저 움직였다. 짧은 앞발을 뻗었다. 새싹이 발끝에 닿는 순간, 따뜻한 기운이 몸 안쪽으로 스며들었다."},{"s":"sys","im":true,"t":"[ 乙 ]"},{"s":"yeon","t":"이게… 뭐야."},{"s":"neo","t":"을목이다. 네 사주의 천간, 그 첫 글자."},{"s":"n","t":"초록빛 새싹이 연이의 앞발 위에서 가늘게 흔들렸다. 숨을 쉬듯이."},{"s":"neo","t":"작은 풀, 꽃, 덩굴. 강해 보이지 않아도 쉽게 죽지 않는다. 꺾이는 대신 휘고, 휜 다음 다시 자란다."},{"s":"n","t":"연이는 자기 앞발을 내려다봤다. 여전히 손가락은 없었다. 그런데 이상하게, 무언가를 꼭 쥔 감각이 남았다. 아주 작은 뿌리 하나. 작지만 살아 있는 것."},{"s":"n","fx":"ink","t":"거울 속 연이의 표정이, 얼음처럼 차갑게 굳었다."},{"s":"geo","t":"…안 돼."},{"s":"n","t":"그녀가 손을 뻗자, 흩어졌던 거울 조각들이 쇳가루처럼 다시 모였다. 이번엔 곡면이 아니라, 칼날처럼 날카롭게 벼려졌다."},{"s":"neo","t":"조심해라. 이제부터 겁재가 움직인다."},{"s":"yeon","t":"겁재? 그게 또 뭔데."},{"s":"neo","t":"나와 같은 기운. 하지만 내 것을 빼앗아 가는 힘. 형제 같은 얼굴을 하고, 내 몫을 나눠 가지려 든다."},{"s":"geo","t":"맞아. 네가 겨우 손에 넣은 그 새싹도— 내가 가져갈 수 있어."},{"s":"n","fx":"claw","t":"거울 속 연이 주변으로 수십 개의 칼날이 부챗살처럼 떠올랐다. 그리고 일제히 연이를 향해 쏟아졌다."},{"s":"n","fx":"burst","t":"네오가 튀어 올랐다. 금빛 발톱이 허공을 갈랐다. 쨍! 쨍! 쨍! 칼날이 흩어졌다. 하지만 곧바로 다시 모였다. 깨져도 다시 생기고, 베어도 다시 날아왔다. 끝이 없었다."},{"s":"yeon","t":"네오!"},{"s":"neo","t":"나는 길을 열 수는 있다! 하지만 네 글자를 대신 지켜줄 수는 없어!"},{"s":"n","t":"그 외침과 동시에, 거울 속 연이가 연이 쪽으로 손을 뻗었다. 앞발 안에 자리 잡은 [乙]의 기운이 흔들리기 시작했다. 마치 작은 새싹이 흙째 뽑히려는 것처럼."},{"s":"yeon","t":"야, 이거… 이거 빠져나가는데?!"},{"s":"neo","t":"겁재다! 네가 네 것을 네 것이라고 말하지 못하면, 그대로 빼앗긴다!"},{"s":"geo","t":"작은 풀 한 포기가, 뭐가 그렇게 대단한데?"},{"s":"n","t":"그 한마디에 [乙]의 빛이 눈에 띄게 약해졌다. 연이는 흔들리는 새싹을 내려다봤다."},{"s":"n","t":"밟히면 꺾일 것 같고, 바람 한 번에 날아갈 것 같은 작은 것. 그런데. 그런데도, 그 잎은 여전히 파르르 살아 있었다."},{"s":"yeon","t":"작아도 내 거야."},{"s":"n","t":"꺼져가던 [乙]의 빛이 다시 살아났다. 거울 속 연이의 눈썹이 꿈틀했다."},{"s":"yeon","im":true,"t":"약해 보여도 내 거라고. 네가 대단하다고 도장 찍어줘야 내 게 되는 것도 아니잖아."},{"s":"n","fx":"burst","t":"머리 위 꽃이 환하게 피어올랐다. 앞발 아래에서 초록 덩굴이 쭉쭉 뻗어 나갔다."},{"s":"n","t":"덩굴은 거울 조각 사이를 헤집더니, 날아오던 칼날들을 하나하나 휘감아 붙잡았다. 쨍그랑! 칼날들이 허공에서 그대로 멎었다."},{"s":"neo","t":"…좋다."},{"s":"yeon","t":"어? 나 방금 뭐 한 거야?"},{"s":"neo","t":"乙을 쓴 거다."},{"s":"yeon","t":"오, 나 스킬 생긴 거야? 나 이제 각성한 거야?"},{"s":"neo","t":"비슷하다."},{"s":"yeon","t":"이름 붙여도 돼? '새싹아 제발 버텨줘' 이런 거 생각했는데."},{"s":"neo","t":"지금은 안 된다. 그 이름은 나중에도 안 된다."},{"s":"yeon","t":"너 왜 그렇게 단호해. 작명 센스 존중 좀."},{"s":"n","t":"거울 속 연이가 어금니를 꽉 물었다. 여유롭던 얼굴에, 처음으로 초조함이 스쳤다."},{"s":"geo","t":"…아직 끝난 게 아니야."},{"s":"n","bgm":"gloom","t":"그녀가 손을 내리자, 마지막 거울이 스르르 앞으로 떠올랐다. 다른 거울과 달랐다."},{"s":"n","t":"그 안에는 검은 물이 가득 담겨 있었다. 이번엔 연이도 능청을 떨지 못했다."},{"s":"n","t":"물은 파문 하나 없이 너무 조용했다. 그런데 그 고요함이, 오히려 등골을 서늘하게 했다."},{"s":"neo","t":"乙만으로는, 을해가 완성되지 않는다."},{"s":"yeon","t":"…저게 亥야?"},{"s":"neo","t":"그래. 亥는 깊은 물이다. 한겨울의 물. 겉은 얼어붙은 듯 잠잠하지만, 안쪽엔 아주 많은 걸 품고 있어."},{"s":"n","t":"거울 속 검은 물이 천천히 흔들렸다. 그 안에서, 물속처럼 먹먹한 목소리가 새어 나왔다."},{"s":"sys","t":"[ …내려와. ]"},{"s":"n","t":"연이는 몸을 굳혔다. 아까 강가에서 덮치던 검은 손들과는 결이 달랐다. 밖에서 덮쳐오는 적이 아니라, 안쪽에서 조용히 부르는 무언가였다. 깊고, 차갑고, 자꾸만 외면하고 싶은 감정."},{"s":"geo","t":"거긴 못 들어가."},{"s":"yeon","t":"…왜."},{"s":"geo","t":"너, 깊어지는 거 싫어하잖아."},{"s":"n","t":"그 말에 연이는 곧바로 받아치지 못했다. 능청도, 밈도, 아무것도 나오지 않았다."},{"s":"geo","t":"생각이 많아지면 일부러 딴소리하고, 혼자 있으면 무너질까 봐 웃긴 척하고, 진짜 속상한 건 꼭 한참 늦게야 인정하지."},{"s":"geo","t":"그 물이, 처음부터 네 안에 있었어."},{"s":"n","tone":"desat","t":"검은 물속에 장면들이 떠올랐다. 답장을 기다리던 밤. 다 쓰고도 보내지 못한 긴 메시지. 괜찮은 척 알림을 끄고 닫아버린 채팅방. 불 꺼진 방, 혼자 침대에 누워 천장만 올려다보던 얼굴."},{"s":"n","t":"연이는 숨이 턱 막혔다. 그건 거울 속 연이의 어떤 말보다 아팠다. 전부 진짜였기 때문이다. 각색 하나 없이."},{"s":"neo","t":"乙은 찾았다. 하지만 亥를 외면하면, 을해일주는 완성되지 않아."},{"s":"yeon","t":"…그러면 어떻게 되는데."},{"s":"neo","t":"너는 네 중심을, 딱 반만 되찾게 된다. 반쪽짜리로 현실에 돌아가는 거다."},{"s":"n","t":"연이는 세 번째 거울을 바라봤다. 검은 물. 깊은 물. 그 바닥 어딘가에서, 두 번째 글자가 조용히 기다리고 있었다."},{"s":"n","t":"연이는 앞발에 힘을 줬다. 여전히 손가락은 없었다. 하지만 이제 조금은 알 것 같았다. 무언가를 붙잡는 건 손가락만으로 하는 게 아니라는 걸."},{"s":"geo","t":"못 가."},{"s":"yeon","t":"넌 왜 자꾸 못 한다는 말만 해?"},{"s":"geo","t":"네가 무서워하니까."},{"s":"yeon","t":"무서우면 못 하는 거야?"},{"s":"geo","t":"너는… 늘 그랬잖아."},{"s":"yeon","t":"내 얼굴로 그런 말 하지 말랬지."},{"s":"geo","t":"왜? 맞는 말이라서?"},{"s":"yeon","t":"아니. 맞는 말이라서 더 짜증 나."},{"s":"n","bgm":"crisis2","fx":"hands","t":"거울 속 연이가 손을 확 뻗었다. 세 번째 거울 속 검은 물이 테두리를 넘어 쏟아졌다. 쏴아아아! 순식간에 회랑 바닥을 뒤덮었다."},{"s":"n","t":"연이는 피하려 했지만 늦었다. 차가운 물이 짧은 앞발을 감싸며, 발목 위까지 순식간에 차올랐다."},{"s":"yeon","t":"네오!"},{"s":"n","fx":"burst","t":"네오가 뛰어올랐다. 발톱이 금빛으로 타올랐다. 검은 물을 세로로 갈랐다. 하지만 물은 갈라졌다가, 아무 일 없었다는 듯 다시 붙었다."},{"s":"neo","t":"이건 베는 게 통하지 않는다!"},{"s":"yeon","t":"그럼 대체 어떡하라고!"},{"s":"neo","t":"도망치지 마라!"},{"s":"yeon","t":"지금 안 도망치면 그냥 빠지는데?!"},{"s":"neo","t":"도망치면 더 깊어진다!"},{"s":"n","t":"거울 속 연이는 검은 물 위에 서 있었다. 발끝 하나 젖지 않은 채, 마른 신발로."},{"s":"geo","t":"맞아. 도망치면 더 깊어져. 네가 지금까지 늘 그랬던 것처럼."},{"s":"n","fx":"ink","t":"검은 물이 연이의 둥근 몸을 아래로 끌어당겼다. 연이는 발톱 없는 앞발을 바닥에 박았다. 하지만 몸이 작았고, 힘도 부족했다. 무서웠다. 개그로도 덮이지 않는, 진짜 무서움이었다."},{"s":"sys","t":"[ 내려와. 괜찮은 척하지 마. 묻어둔 마음을 봐. ]"},{"s":"n","t":"연이는 눈을 질끈 감았다. 그 순간, 앞발 안쪽에서 따뜻한 기운이 번졌다. 조금 전 손에 넣은 [乙]이었다. 작은 새싹의 온기."},{"s":"n","fx":"burst","t":"연이는 눈을 떴다. 앞발 아래에서 초록 덩굴 하나가 다시 자라났다. 그런데 덩굴은 검은 물을 밀어내지 않았다. 오히려 물속으로, 스스로 뿌리를 내렸다."},{"s":"neo","t":"그래, 그거다!"},{"s":"yeon","t":"이거 맞는 거야?! 나 지금 물속에 뿌리 박고 있는데?!"},{"s":"neo","t":"乙은 물을 피해서 자라는 게 아니다. 물을 받아 마시고 자란다!"},{"s":"yeon","t":"그런 사용설명서를 왜 이제 알려줘!"},{"s":"neo","t":"네가 이제야 나한테 보여줬으니까!"},{"s":"n","t":"덩굴은 가늘었다. 손끝으로 튕겨도 끊어질 것 같았다. 하지만 검은 물이 위에서 덮쳐도, 한 번 휘어졌다가 기어이 다시 고개를 들었다."},{"s":"n","t":"연이는 그 광경을 보며 숨을 삼켰다. 작았다. 약해 보였다. 그런데 살아 있었다. 꼭, 지금의 자기 자신처럼."},{"s":"geo","t":"멈춰."},{"s":"yeon","t":"싫어."},{"s":"n","t":"연이는 앞발을 더 단단히 디뎠다. 물살에 밀리는 몸을, 덩굴 뿌리가 아래에서 붙잡아 주었다."},{"s":"yeon","im":true,"t":"나 아직도 무서워. 근데 무섭다고 네가 내 이름 가져가는 건— 그게 더 싫어."},{"s":"n","fx":"ink","t":"검은 물이 크게 출렁였다. 세 번째 거울 속에서, 글자 하나가 물안개처럼 희미하게 떠올랐다."},{"s":"sys","t":"[ 亥 ]"},{"s":"n","t":"아직 멀었다. 손 뻗어 닿기엔 너무 깊었다. 하지만 분명히 보였다. 연이의 머리 위 꽃이 흔들렸다. [乙]의 새싹이, [亥]의 검은 물을 향해 조심스레 뿌리를 내리고 있었다."},{"s":"geo","t":"그만해!"},{"s":"n","t":"거울 속 연이가 처음으로 소리쳤다. 그 목소리엔 더 이상, 여유가 없었다."},{"s":"n","fx":"hands","t":"그 순간, 세 번째 거울 안쪽에서 거대한 물결이 일어섰다. 벽처럼 솟은 검은 물이 연이의 몸을 앞으로 확 끌어당겼다."},{"s":"neo","t":"날 잡아!"},{"s":"n","t":"네오가 달려와 연이의 앞발을 덥석 물었다. 아프진 않았다. 하지만 물의 힘이 너무 강했다. 흰 사자의 작은 몸까지 함께 끌려갔다."},{"s":"geo","t":"그럼— 직접 내려가 봐."},{"s":"n","fx":"vortex","t":"세 번째 거울이 문처럼 활짝 열렸다. 검은 물이 폭포처럼 쏟아졌다. 연이는 이를 악물고 버텼다. 하지만 결국, 몸이 통째로 앞으로 빨려 들어갔다."},{"s":"yeon","t":"꾸울아아아악!"},{"s":"n","t":"이번엔 연기가 아니었다. 개그 콧김이 아니라, 진짜로 놀라서 터져 나온 비명이었다."},{"s":"neo","t":"이름을 놓치지 마라! 乙을 붙잡아!"},{"s":"n","t":"연이는 앞발 안쪽의 따뜻한 기운을 있는 힘껏 움켜쥐었다. 손가락은 없었다. 그래도, 마음으로 꽉 붙잡았다."},{"s":"n","t":"빨려 들어가기 직전, 거울 밖에 선 인간 연이가 마지막으로 눈에 들어왔다. 그녀는 웃고 있었다. 하지만 그 웃음엔, 이제 여유가 남아 있지 않았다."},{"s":"geo","im":true,"t":"깊은 물속에서도— 네가 너라고 말할 수 있는지, 어디 한번 보자."},{"s":"n","fx":"suck","tone":"dark","t":"연이는 검은 물속으로, 끝없이 떨어졌다. 머리 위 꽃이 마지막으로 한 번, 환하게 빛났다."},{"s":"sys","im":true,"t":"[ 乙 ]"},{"s":"n","t":"그리고 어둠의 가장 깊은 곳에서, 지금껏 잠들어 있던 두 번째 글자가 조용히 눈을 떴다."},{"s":"sys","im":true,"t":"[ 亥 ]"},{"s":"sys","t":"[ 해수의 심연이 열리고 있었다. ]"}]});
EPISODES.push({"no":"EP.04","tag":"제4화 · 해수의 심연","title":"해수의 심연","beats":[{"s":"n","bg":"river","bgm":"gloom","tone":"dark","l":{"who":"yeon"},"c":null,"r":null,"t":"첨벙. 발끝이 수면을 뚫었다. 그리고 세상이 검게 접혔다."},{"s":"n","fx":"vortex","t":"차갑고, 검고, 끝이 없는 물이었다. 이상하게도 숨은 쉬어졌다. 그게 더 무서웠다. 연이는 떨어지는 게 아니라, 허공에 매달린 것처럼 아주 천천히 가라앉고 있었다."},{"s":"yeon","t":"몸은 깃털인데 마음은 왜 돌덩이야."},{"s":"n","t":"머리 위의 작은 꽃만 물속에서 유일하게 살아 있는 불빛처럼 빛났다. 연이는 앞발을 꽉 쥐려 했다. 역시 잘 안 됐지만, 발바닥 안쪽에 남은 따뜻한 기운은 또렷했다."},{"s":"yeon","t":"아까 그 새싹. 너는 아직 여기 있구나."},{"s":"sys","im":true,"t":"[ 乙 ]"},{"s":"yeon","t":"네오! 네오, 어디야!"},{"s":"n","t":"대답은 없었다. 검은 물결만 천천히, 아무 대답도 아닌 채로 움직였다."},{"s":"n","t":"위도 아래도 똑같이 어두웠다. 멀리서 오래된 기억 같은 빛들이 떠다녔다. 읽지 못한 메시지. 보내지 못한 문장. 삼켜버린 말. 울컥했지만 웃어넘긴 순간들."},{"s":"n","t":"그것들이 작은 물고기처럼 연이 곁을 스쳐 헤엄쳤다. 지느러미가 스칠 때마다 살갗이 서늘했다."},{"s":"yeon","t":"뭐야 여기…… 내 흑역사 통합 저장소 클라우드야?"},{"s":"yeon","t":"구독 해지 좀 하자. 무료 체험만 하고 싶었다고."},{"s":"n","t":"말끝에 작은 기포가 새어 올라갔다. 뽀글. 그런데 기포 안에 글자가 적혀 있었다."},{"s":"sys","t":"[ 괜찮아. ]"},{"s":"n","t":"그 기포는 위로 떠오르지 않았다. 오히려 무겁게, 검은 물 아래로 가라앉았다."},{"s":"yeon","t":"야, 괜찮아가 왜 밑으로 가. 괜찮으면 둥둥 떠야 하는 거 아냐?"},{"s":"n","t":"그때 대답처럼, 다른 기포들이 줄줄이 떠올랐다."},{"s":"sys","t":"[ 별일 아냐. ]   [ 나 진짜 괜찮아. ]   [ 신경 안 써. ]   [ ㅋㅋㅋ 괜찮다니까. ]"},{"s":"n","t":"연이는 얼굴을 굳혔다. 전부 자기가 했던 말이었다."},{"s":"n","t":"정확히는, 하나도 안 괜찮았던 날에만 골라 쓰던 말들이었다."},{"s":"n","fx":"vortex","t":"기포들이 하나둘 연이 몸에 달라붙었다. 그리고 갑자기, 추처럼 무거워졌다."},{"s":"yeon","t":"잠깐, 잠깐! 이거 왜 이래!"},{"s":"n","t":"짧은 네 다리가 물속에서 정신없이 발버둥 쳤다. 그런데도 몸은 한 뼘도 앞으로 안 갔다."},{"s":"yeon","t":"이 몸 진짜 완전체 하자품이네. 돼지가 수영을 못 하는 게 말이 돼?"},{"s":"n","t":"그 순간 머리 위 꽃이 파르르 빛났다. 앞발 안쪽에서 초록빛 덩굴이 뻗어 나왔다. 乙의 힘이었다."},{"s":"n","t":"덩굴은 물을 헤치며 뻗어나갔다. 하지만 검은 물은 너무 깊었다. 뻗다가, 멈췄다."},{"s":"n","t":"어디에 뿌리내려야 할지 모르는 것처럼, 덩굴 끝이 허공에서 휘청거렸다."},{"s":"geo","bgm":"crisis","r":{"who":"mirror"},"t":"그러니까, 말했잖아."},{"s":"n","t":"검은 물결을 가르고 거울 속 연이가 나타났다. 인간의 모습 그대로였다. 젖지도 않았고 머리카락 한 올 흐트러지지 않았다. 너무 멀쩡해서 오히려 소름이 돋았다."},{"s":"geo","t":"여긴 네가 못 들어오는 곳이라고."},{"s":"yeon","t":"너는 물속에서 어떻게 드라이 유지되냐? 방수 코팅이라도 했어?"},{"s":"geo","t":"나는 흔들리지 않으니까."},{"s":"yeon","t":"아, 진짜 재수 없어."},{"s":"geo","t":"그것도 네 말투인데."},{"s":"yeon","t":"…그 말 이제 저작권 등록함. 쓰지 마."},{"s":"n","t":"거울 속 연이는 물속을 걷듯 천천히 연이 주위를 돌았다. 발밑에서 검은 물이 잔잔히 갈라졌다."},{"s":"geo","t":"여긴 亥의 심연이야."},{"s":"yeon","t":"알아. 네오가 말해줬어."},{"s":"geo","t":"그럼 알아야지. 乙은 물이 있어야 사는 새싹이야. 그런데 네가 세상에서 제일 못 하는 게 뭔지 알아?"},{"s":"n","t":"연이는 대답하지 못했다. 입만 벌렸다가, 다물었다."},{"s":"geo","t":"깊어지는 거."},{"s":"n","fx":"veil","t":"거울 속 연이가 손끝을 튕기자, 검은 물속에 장면 하나가 필름처럼 떠올랐다."},{"s":"n","t":"침대에 누워 휴대폰을 든 연이. 답장이 오지 않는 채팅방. 썼다가 지우고, 또 썼다가 지운 문장 하나."},{"s":"sys","t":"[ 나 사실…… 조금 서운했어. ]"},{"s":"n","t":"그 문장은 전송되지 못했다. 커서 하나 남기고 지워진 뒤, 기포가 되어 아래로 가라앉았다. 연이의 목이 뻐근하게 잠겼다. 물이 아니라 그 문장 때문에 숨이 막혔다."},{"s":"yeon","t":"그만해."},{"s":"geo","t":"왜? 네 기억인데."},{"s":"n","fx":"veil","t":"또 다른 장면. 친구들 앞에서 활짝 웃는 연이."},{"s":"geo","t":"「아, 괜찮아. 나 그런 거 신경 안 써.」"},{"s":"n","t":"그렇게 말하고 돌아서던 옆얼굴. 입꼬리는 올라가 있었지만, 눈은 하나도 웃고 있지 않았다."},{"s":"n","fx":"veil","t":"다음 장면. 밤새 쓴 과제 파일이 통째로 날아간 새벽. 연이는 꺼진 커서를 보며 혼자 픽 웃었다."},{"s":"geo","t":"「와, 레전드. 내 인생 진짜 예능이다.」"},{"s":"n","t":"그리고 몇 초 뒤, 그 웃음이 조용히 지워졌다. 방 안에 자판 두드리는 소리도 멎었다."},{"s":"n","fx":"veil","t":"다음 장면. 면접이 취소됐다는 문자. 그걸 받고 친구에게 보낸 메시지."},{"s":"geo","t":"「ㅋㅋㅋ 나 오늘도 운빨 망함ㅋㅋ」"},{"s":"n","t":"하지만 그 아래, 끝내 전송 버튼을 못 누른 문장 하나가 회색으로 남아 있었다."},{"s":"sys","t":"[ 사실 좀 무서워. 계속 이렇게 안 풀릴까 봐. ]"},{"s":"n","t":"연이는 눈을 감았다. 가볍게 넘긴 줄 알았다. 웃어서 지나간 줄 알았다. 그런데 전부 여기 있었다. 검은 물 밑바닥에, 하나도 안 삭제된 채로 가라앉아 있었다."},{"s":"geo","t":"너는 항상 말끝을 웃음으로 틀어막아. 아프면 아프다고 하면 되는데, 꼭 드립부터 쳐."},{"s":"yeon","t":"…그게 그렇게 나쁜 거야?"},{"s":"geo","t":"나쁘진 않지. 재밌기까지 해."},{"s":"geo","t":"근데 네가, 네 마음을 한 번도 안 들어주잖아."},{"s":"n","fx":"hands","t":"그 말에 연이는 아무 말도 못 했다. 검은 물이 다시 무거워졌다. 기포들이 온몸에 들러붙었다."},{"s":"sys","t":"[ 괜찮아. ]   [ 별일 아냐. ]   [ 신경 안 써. ]   [ 나 원래 이래. ]"},{"s":"n","fx":"vortex","t":"기포 하나하나는 깃털처럼 가벼워 보였다. 그런데 붙을수록 무거웠다. 연이의 몸이 아래로, 아래로 끌려갔다."},{"s":"yeon","t":"야, 괜찮은 척 좀 했다고 이렇게 심해까지 끌고 가는 건 너무 오버 아니냐고!"},{"s":"geo","t":"괜찮은 척은 원래, 물에 제일 잘 가라앉아."},{"s":"yeon","t":"명언 만들지 마. 안 그래도 짜증 나는데 어록까지 만들지 말라고."},{"s":"n","t":"그때 멀리서, 수면 위에서 내려오는 것 같은 목소리가 아주 작게 들렸다."},{"s":"neo","t":"연이!"},{"s":"n","t":"검은 물 위쪽에 금빛이 아득하게 어른거렸다. 네오였다. 그는 물속에 들어오지 못하고 수면 위에서 발톱으로 물결을 긁어내리고만 있었다. 해수의 심연은 닫힌 물이라, 바깥의 힘은 이 안까지 쉽게 닿지 못했다."},{"s":"yeon","t":"네오! 나 지금 완전 물에 잠겼거든?! 지하 몇 층인지도 모르겠어!"},{"s":"neo","t":"물을 밀어내려고 하지 마라!"},{"s":"yeon","t":"그럼 뭐 어떡해! 물한테 앞으로 잘 부탁한다고 인사라도 해?!"},{"s":"neo","t":"乙은 물을 먹고 자라는 나무다!"},{"s":"yeon","t":"그 말 아까도 했잖아! 재방송 그만하고!"},{"s":"neo","t":"이번엔, 머리 말고 몸으로 이해해야 한다!"},{"s":"n","t":"검은 물이 여전히 연이를 아래로 끌어당겼다. 그 바닥에 거대한 문양이 어렴풋이 보였다. 둥글게 감기는 물결. 그 소용돌이 한가운데 숨어 있는 글자 하나."},{"s":"sys","im":true,"t":"[ 亥 ]"},{"s":"n","t":"해. 하지만 그 글자는 아직, 손이 닿지 않는 바닥에 있었다."},{"s":"geo","t":"못 가."},{"s":"yeon","t":"너 진짜 그 말밖에 못 하냐?"},{"s":"geo","t":"못 하니까 못 한다고 하지."},{"s":"yeon","t":"아, 내 얼굴로 팩폭 치니까 두 배로 킹받네."},{"s":"geo","t":"그럼 증명해."},{"s":"n","t":"거울 속 연이가 손을 뻗었다. 앞발 안에 쥔 [乙]의 빛이 촛불처럼 흔들렸다."},{"s":"geo","t":"네가 乙을 아무리 붙잡아도, 亥를 받아들이지 못하면 을해는 완성되지 않아."},{"s":"geo","t":"꽃은 물 없이 못 살아. 그런데 너는, 네 물을 싫어하잖아."},{"s":"yeon","t":"내 물?"},{"s":"geo","t":"네 깊은 마음. 네가 매번 커서만 깜빡이다 지워버린 그 문장들."},{"s":"n","fx":"veil","t":"검은 물속에 또 하나의 장면이 떠올랐다. 불 꺼진 방. 연이가 혼자 앉아, 아무 일도 없다는 듯 휴대폰을 만지작거리고 있었다. 그런데 화면은 꺼져 있었다."},{"s":"n","t":"그녀는 아무것도 보고 있지 않았다. 그냥 검은 액정에 비친 자기 얼굴만 멍하니 보고 있었다. 그 장면 속 연이는 단 한마디도 하지 않았다. 그 침묵이, 어떤 비명보다 아팠다."},{"s":"yeon","t":"나 저때……."},{"s":"n","t":"말이 목에 걸려 끝까지 나오지 않았다."},{"s":"geo","t":"외로웠지."},{"s":"n","t":"검은 물이 한 번 출렁였다."},{"s":"geo","t":"무서웠고."},{"s":"n","t":"또 한 번 출렁였다."},{"s":"geo","t":"근데 아무한테도, 단 한 명한테도 말 안 했지."},{"s":"n","fx":"vortex","t":"기포들이 한꺼번에 몰려와 연이를 통째로 감쌌다. 물이 목까지 차올랐다."},{"s":"sys","t":"[ 괜찮아. ]   [ 나 혼자 해도 돼. ]   [ 아무렇지 않아. ]   [ 원래 다 이런 거지. ]"},{"s":"n","t":"연이는 숨을 크게 들이켰다. 물속인데도 숨은 들어왔지만 가슴 한복판이 콱 막혔다. 그 답답함은 물의 무게가 아니었다. 오래 참아온 것의 무게였다."},{"s":"yeon","t":"…그래."},{"s":"n","t":"기포들이 뚝 멈췄다. 거울 속 연이도 돌던 걸음을 멈췄다. 연이는 천천히 고개를 들고 젖은 앞발로 가슴을 짚었다. 심장이 거기서 뛰고 있었다."},{"s":"yeon","bgm":"room","im":true,"t":"나 안 괜찮았어."},{"s":"n","fx":"veil","t":"그 말이 물결을 타고 동그랗게 퍼졌다. 그러자 기포 하나가 터졌다. 퐁."},{"s":"sys","t":"[ 괜찮아. ] …사라짐"},{"s":"yeon","t":"별일 아니라고 했는데. 나한테는, 진짜 별일이었어."},{"s":"n","t":"또 하나가 터졌다. 퐁."},{"s":"sys","t":"[ 별일 아냐. ] …사라짐"},{"s":"yeon","t":"신경 안 쓴다고 했는데. 사실 밤마다 그 생각만 했어."},{"s":"n","t":"퐁. 검은 물이, 아주 조금 가벼워졌다. 어깨를 누르던 무게가 한 겹 벗겨졌다."},{"s":"sys","t":"[ 신경 안 써. ] …사라짐"},{"s":"n","t":"연이는 눈을 감았다. 이 다음 한마디만은 하고 싶지 않았다. 입 밖에 내는 순간 진짜가 되어버릴 것 같아서. 그런데 삼키면, 영영 이 바닥에 남을 것 같아서. 연이는 눈을 떴다."},{"s":"yeon","im":true,"t":"무서웠어."},{"s":"n","fx":"veil","t":"그 순간 검은 물 전체가 크게 요동쳤다. 거울 속 연이가 처음으로, 표정을 잃었다."},{"s":"yeon","t":"계속 안 풀릴까 봐 무서웠고, 내가 뭔가 크게 잘못한 건가 싶어서 무서웠고,"},{"s":"yeon","t":"웃고 넘기면 진짜로 괜찮아질 줄 알았는데, 안 괜찮아서 더 무서웠어."},{"s":"n","fx":"burst","t":"기포들이 사방에서 터지기 시작했다. 퐁. 퐁. 퐁. 그때마다 물이 한 뼘씩 맑아졌다."},{"s":"n","t":"바닥에 잠겨 있던 [亥] 글자가, 흐린 유리를 닦아낸 것처럼 선명해졌다."},{"s":"geo","t":"그만해."},{"s":"yeon","t":"싫어."},{"s":"n","fx":"burst","t":"앞발 안쪽의 [乙]이 손난로처럼 따뜻하게 빛났다. 초록빛 덩굴이 다시 자라났다."},{"s":"n","t":"이번엔 물을 밀어내지 않았다. 도망치지도 않았다. 덩굴은 검은 물 아래로 천천히 뿌리를 내렸다. 그리고 아주 작게 파르르 떨었다. 마치, 물을 처음으로 마셔보는 것처럼."},{"s":"n","t":"연이는 그 감각을 온몸으로 느꼈다. 차가운 물이 전부 적은 아니었다. 그 안엔 외로움도, 무서움도, 끝내 못 보낸 말들도 있었다. 하지만 그건 자기를 죽이려는 물만은 아니었다. 그 물이 있었기에, 이 작은 새싹도 목을 축이며 자랄 수 있었다."},{"s":"neo","t":"그래. …그거다."},{"s":"neo","t":"亥는 너를 가라앉히는 물이 아니다. 네 뿌리를 몰래 숨겨둔 물이다."},{"s":"yeon","t":"내 뿌리……."},{"s":"n","t":"그 말이 이상하게도 명치 아래에 콕 박혔다. 그녀는 늘 밝은 척, 가벼운 척, 대수롭지 않은 척했다. 그런데 그 밑엔 늘 깊은 물이 고여 있었다. 귀찮고 무겁고 차가운 물. 그래도 그 안에, 뿌리가 있었다."},{"s":"n","t":"연이는 앞발을 쭉 뻗었다. [乙]의 덩굴이 바닥의 [亥]를 향해 곧게 뻗어갔다."},{"s":"geo","t":"안 돼! 네가 그걸 받아들이면—"},{"s":"yeon","t":"내가 너보다 더 진짜 같아지나?"},{"s":"n","t":"거울 속 연이가 입을 다물었다. 연이는 그 침묵을 보고 피식 웃었다."},{"s":"yeon","t":"오케이. 반응 없는 거 보니 정답이네."},{"s":"n","fx":"burst","t":"덩굴 끝이 [亥]에 닿았다. 그 순간 검은 물속에서 거대한 파문이 원을 그리며 퍼졌다."},{"s":"n","t":"차가운 물이 연이를 감쌌다. 그런데 이번엔 끌어내리지 않았다. 오히려 두 손처럼 그녀를 받쳐 올렸다."},{"s":"n","bg":"river","fx":"veil","t":"[亥] 글자가 천천히 떠올랐다. 검은 물이 깊은 밤바다 남색으로 물들었다. 그 속에서 작은 별빛들이 하나둘 켜졌다."},{"s":"yeon","t":"…예쁘다."},{"s":"n","t":"처음으로 그렇게 생각했다. 무섭기만 하던 물이 조금 다르게 보였다. 차갑지만 맑았고, 어둡지만 비어 있지 않았다. 그 안엔 기억이, 감정이, 상처가, 그리고 끝까지 살아남은 마음이 가득했다."},{"s":"n","fx":"burst","t":"연이의 머리 위 꽃이 활짝 피어났다. 두 글자가 그녀 앞에 나란히 떠서 빛났다."},{"s":"sys","im":true,"t":"[ 乙 ]     [ 亥 ]"},{"s":"yeon","t":"…을해일주."},{"s":"n","t":"그 말이 떨어지자 두 글자가 하나의 빛으로 이어졌다. 초록 새싹이 깊은 물 위에 뿌리를 내렸다."},{"s":"n","t":"그리고 작은 꽃이 피었다. 검은 심연 한복판에서. 말도 안 되게 작지만, 분명히 살아 있는 꽃이었다."},{"s":"n","t":"연이는 그 꽃을 보며 숨을 멈췄다. 그건 꼭 자기 같았다. 아직 약하고, 아직 작고, 아직도 많이 무섭지만—그래도 살아 있는 것."},{"s":"n","bg":"islandIn","bgm":"neo","c":{"who":"neo"},"r":{"who":"mirror"},"fx":"burst","t":"위에서 네오의 목소리가 쏟아졌다. 금빛 발톱이 수면을 갈랐다. 빛이 폭포처럼 밀려들었다. 연이는 위로 떠올랐다. 이번엔 물이 끌어내리지 않고, 등을 밀어 올려주었다."},{"s":"geo","t":"네가 亥를 찾았다고, 다 끝난 줄 알아?"},{"s":"yeon","t":"끝은 아니겠지. 뭐, 그럴 줄 알았어."},{"s":"geo","t":"비겁의 섬은 아직 끝나지 않았어. 뿌리를 찾은 거랑, 네 자리를 지키는 건 완전히 다른 문제야."},{"s":"yeon","t":"그럼 올라가서 또 하면 되지. 나 이제 튜토리얼 좀 손에 익었거든."},{"s":"n","t":"큰소리치는 말끝에, 작은 콧김 소리가 새어 나왔다. 꿀."},{"s":"yeon","t":"…아, 이건 진짜 아직도 적응 안 돼."},{"s":"n","fx":"burst","t":"그 순간 빛이 터졌다. 쏴아아아! 연이는 해수의 심연을 뚫고 솟구쳐, 비겁의 섬 바닥 위로 데굴데굴 굴렀다. 물방울이 사방으로 튀었다."},{"s":"yeon","t":"아야…… 착지 점수 빵점이네."},{"s":"neo","t":"…살아는 있나?"},{"s":"n","t":"연이는 천천히 몸을 일으켰다. 머리 위 꽃이 아까와는 비교도 안 되게 선명하게 빛났다. 꽃 아래로 푸른 물결 문양이 잔잔히 감돌았다."},{"s":"neo","t":"乙亥가 연결됐다."},{"s":"sys","im":true,"t":"[ 乙亥 · 을해 ]"},{"s":"n","t":"그건 이제 단순한 글자 두 개가 아니었다. 작은 꽃과 깊은 물. 흔들리지만 죽지 않는 마음. 밝게 웃지만, 속 깊은 곳에 많은 걸 품은 자기 자신."},{"s":"yeon","t":"나 생각보다 되게 복잡한 타입이었네."},{"s":"neo","t":"이제야 알았나."},{"s":"yeon","t":"응. 근데 복잡하다고 해서, 저 가짜한테 내 자리 내줄 생각은 눈곱만큼도 없어."},{"s":"n","bgm":"crisis","fx":"veil","t":"그때 섬 전체의 거울들이 일제히 빛났다. 거울 속 연이가 물 밖으로 천천히 걸어 나왔다."},{"s":"n","t":"이번엔 공기가 달랐다. 발밑으로 검은 거울 조각들이 스르륵 모여들었다. 눈빛은 더 차가워졌고, 목소리는 더 낮게 가라앉았다."},{"s":"geo","t":"좋아. …그럼 이제, 진짜 시험을 시작하자."},{"s":"yeon","t":"뭐? 아직도 시험이 남았다고?"},{"s":"neo","t":"乙亥는 찾았다. 하지만 비겁의 섬은, 네가 그 글자를 지켜낼 수 있는지까지 확인하려 든다."},{"s":"n","fx":"vortex","t":"거울 속 연이가 손을 치켜들었다. 수많은 거울 조각이 그녀 뒤로 병풍처럼 떠올랐다. 조각마다 다른 연이의 얼굴이 비쳤다. 질투하는 연이. 포기하는 연이. 남과 비교하는 연이. 억지로 웃는 연이. 자기 자신조차 믿지 못하는 연이."},{"s":"geo","im":true,"t":"어서 와. 이번엔, 네가 이긴 줄 아는 저 너희들 전부랑 싸워야 하니까."},{"s":"n","t":"연이는 숨을 들이켰다. 조금 전까지였다면 겁부터 났을 것이다. 지금도 겁은 났다. 하지만 아까와 똑같은 겁은 아니었다. 앞발 안쪽엔 乙의 온기가, 가슴 깊은 곳엔 亥의 물이 고여 있었다."},{"s":"yeon","t":"오케이."},{"s":"n","t":"연이는 거울 속 자신을 똑바로 마주 봤다. 머리 위 꽃이 환하게 빛났다."},{"s":"yeon","im":true,"t":"나 방금 심연까지 다녀온 사람이거든? 멘탈 패치 한 번 크게 돌렸어."},{"s":"n","t":"거울 속 연이가, 소리 없이 웃었다."},{"s":"sys","im":true,"t":"[ 비겁의 섬 · 마지막 시험 시작 ]"}]});
EPISODES.push({"no":"EP.05","tag":"제5화 · 같은 나의 편","title":"같은 나의 편","beats":[{"s":"n","bg":"islandIn","bgm":"neo","l":{"who":"yeon"},"c":{"who":"neo"},"r":{"who":"mirror"},"t":"거울 회랑의 공기가 무겁게 가라앉았다. 해수 심연에서 겨우 젖은 몸을 말린 참이었다. 그런데 눈앞의 거울 속 연이가, 천천히 손을 들었다."},{"s":"n","fx":"veil","t":"수많은 거울 조각이 그녀 뒤로 떠올랐다. 조각마다 다른 연이의 얼굴이 비쳤다."},{"s":"n","t":"화를 내는 연이. 포기하는 연이. 남과 비교하는 연이. 괜찮은 척 웃는 연이. 아무것도 못 하겠다는 얼굴의 연이."},{"s":"n","t":"그리고 그런 자기들을 보다 질려버린 표정의, 또 다른 연이."},{"s":"yeon","t":"와. 나 생각보다 출시 버전 많네. 업데이트 좀 정리하지 그랬어."},{"s":"neo","t":"비겁의 섬, 마지막 시험이다."},{"s":"yeon","t":"시험 이름이라도 알려줘. 마음의 준비는 하고 죽자."},{"s":"n","im":true,"t":"그 순간, 회랑 한가운데 글자가 떠올랐다."},{"s":"sys","im":true,"t":"[ 비겁의 섬 · 최종 시험 ]\n[ 나와 같은 얼굴을 구분하라. ]\n[ 비견은 편으로 삼고, 겁재는 끊어내라. ]"},{"s":"yeon","t":"잠깐만. 튜토리얼 없이 갑자기 난이도 왜 이래?"},{"s":"neo","t":"비견은 너와 같은 기운으로, 너를 지탱한다. 겁재는 같은 기운으로, 네 것을 빼앗는다."},{"s":"yeon","t":"그러니까 나랑 얼굴 똑같은데, 하나는 내 편이고 하나는 내 자리 노리는 사기꾼이라는 거지?"},{"s":"neo","t":"…정확하다. 문제는, 둘 다 네 얼굴을 하고 있다는 거다."},{"s":"n","t":"연이는 거울 조각들을 훑었다. 다 자기 얼굴이었다. 다 자기 표정이었다. 목 안쪽이 바짝 말랐다. 대체 뭘 보고 구분하라는 건가."},{"s":"geo","t":"쉽지 않을걸?"},{"s":"n","fx":"veil","t":"거울 속 연이가 손가락을 가볍게 튕겼다. 딱."},{"s":"n","bgm":"crisis","t":"가장 먼저 앞으로 걸어 나온 건, 화난 얼굴의 연이였다. 팔짱을 끼고, 발끝으로 바닥을 톡톡 두드리며 노려봤다."},{"s":"n","t":"「넌 맨날 참다가, 엉뚱한 데서 뒤늦게 터지잖아.」"},{"s":"yeon","t":"야. 첫 대사를 팩폭으로 여는 건 반칙이지."},{"s":"n","t":"「싫으면 싫다고 그 자리에서 말하면 되는데. 꼭 괜찮은 척하다가, 집에 가서 혼자 이불 차지.」"},{"s":"yeon","t":"그만해. 나 방금 심연에서 물 잔뜩 먹고 나와서, 멘탈이 아직 촉촉하다고."},{"s":"n","t":"「그래서, 또 농담으로 덮으려고?」 연이는 입을 다물었다. 반박할 말이 목에 걸렸다."},{"s":"n","fx":"ink","t":"말문이 막힌 그 틈을 타, 화난 연이의 발밑에서 검은 거울 조각이 가시처럼 자라났다."},{"s":"neo","t":"조심해라. 저건 지금, 겁재로 기울고 있다."},{"s":"yeon","t":"쟨 내 편 아니었어? 방금까지 맞는 말만 했잖아."},{"s":"neo","t":"맞는 말로 너를 몰아붙여서, 네 자리를 대신 차지하려 한다. 그게 겁재다."},{"s":"n","fx":"claw","t":"화난 연이가 날카롭게 웃었다. 「그러니까 내가 대신 말해줄게. 어차피 넌 못 하니까.」"},{"s":"n","t":"그녀의 손끝에서 붉은 유리 조각이 화살처럼 날아왔다. 네오가 튀어 올라 앞을 가로막았다. 쨍!"},{"s":"neo","t":"연이! 정신 차려라!"},{"s":"yeon","t":"알았어, 알았다고!"},{"s":"n","t":"연이는 앞발을 땅에 단단히 디뎠다. 가슴 안쪽에서 [乙]의 기운이 미지근하게 차올랐다. 발밑에서 초록빛 덩굴이 돋았다."},{"s":"n","t":"하지만 화난 연이는 멈추지 않았다. 「넌 늘 늦어. 화내는 것도 늦고, 말하는 것도 늦고, 결정하는 것도 한 박자씩 늦어.」"},{"s":"n","tone":"desat","t":"연이는 이를 악물었다. 틀린 말이 아니라서, 더 아팠다. 명치가 뜨겁게 조여왔다."},{"s":"n","t":"그런데 이번만은, 돌아서서 도망치고 싶지 않았다."},{"s":"yeon","t":"…맞아. 나 늦게 터질 때 많아. 부정 안 해."},{"s":"n","t":"화난 연이의 눈이 흔들렸다. 예상 못 한 대답이었다는 듯이."},{"s":"yeon","t":"근데 네가 나 대신 터져주는 건, 싫어."},{"s":"n","t":"「…왜.」"},{"s":"yeon","t":"그건 내가 하는 말이 아니잖아. 목소리는 나오는데, 정작 내가 없잖아."},{"s":"n","t":"연이는 붉은 조각의 궤도로 한 걸음 파고들었다."},{"s":"yeon","im":true,"t":"화나는 건 안 나쁜 거야. 근데 내 입을 뺏어서 대신 소리치는 건, 그건 내 편 아니야."},{"s":"n","t":"붉은 유리 조각들이 허공에서 흔들리며 속도를 잃었다."},{"s":"yeon","t":"너는 내 편이 될 수 있어. 대신, 내가 사라지는 방식은 사절이야."},{"s":"n","t":"화난 연이의 표정이 굳었다. 발밑 검은 조각이 스르르 녹아 사라졌다. 붉은 빛이, 가시를 접듯 부드러워졌다."},{"s":"n","t":"「그럼… 참지만 마.」 화난 연이가 작게 중얼거렸다."},{"s":"yeon","t":"응. 대신 다음엔 이불 안 차게, 그 자리에서 말할게. 연습할게."},{"s":"n","fx":"veil","t":"화난 연이가 붉은 빛으로 흩어졌다. 그 빛은 연이 옆에, 작은 붉은 거울 조각이 되어 조용히 붙었다."},{"s":"neo","t":"비견으로 돌아섰다. 네 편이 하나 늘었다."},{"s":"yeon","t":"오. 나 방금 첫 포켓몬 잡은 거야? 몬스터볼 던진 느낌인데."},{"s":"neo","t":"…그런 식으로 이해하지 마라."},{"s":"yeon","t":"근데 그렇게 이해하니까 갑자기 할 만한데?"},{"s":"n","bgm":"gloom","tone":"desat","t":"다음으로 걸어 나온 건, 포기하는 얼굴의 연이였다. 아니, 걸어 나온 게 아니었다. 바닥에 주저앉은 채, 그냥 고개만 들었다. 눈빛이 텅 비어 있었다."},{"s":"n","t":"「안 해도 돼. 어차피 또 안 될 거잖아.」"},{"s":"n","t":"연이의 가슴이 툭, 한 뼘 내려앉았다. 그 목소리는 너무 익숙했다. 시작하기도 전에 이미 지쳐 있는 마음. 기대하면 더 아플까 봐, 미리 접어두던 밤들."},{"s":"n","t":"「너도 알잖아. 기대하면, 그만큼 피곤해져.」"},{"s":"yeon","t":"…응. 알아. 뼈저리게 알아."},{"s":"n","fx":"ink","t":"「그러니까 그냥 내려놔.」 그녀 주변으로 회색 거울 조각들이 스르르 떠올랐다. 조각마다, 연이가 포기했던 순간이 비쳤다."},{"s":"n","t":"제출 버튼 앞에서 닫아버린 지원서. 다 써놓고 지워버린 메시지. 아무것도 아닌 척, 화면을 엎어두던 새벽의 손끝."},{"s":"n","t":"「기대하지 않으면, 실망도 없어.」 그 말은 이상하게 달았다. 아프지 않게 해주겠다는 약속처럼 들렸다. 연이의 발끝이 잠깐 뒤로 밀렸다."},{"s":"n","t":"그때, 머리 위 꽃 아래로 푸른 물결이 감돌았다. [亥]의 기운이었다. 깊은 물. 가라앉아도 끝내 사라지지 않는 마음."},{"s":"yeon","t":"근데 나… 실망 안 하려고 미리 포기한 적, 진짜 많거든."},{"s":"n","t":"포기하는 연이가 천천히 고개를 들었다."},{"s":"yeon","t":"그때 편하긴 했어. 딱 그 순간만."},{"s":"n","t":"회색 조각들이 물결처럼 흔들렸다."},{"s":"yeon","t":"근데 해보고 망한 건 며칠 속상하고 끝나는데, 안 해보고 넘긴 건 몇 년을 따라오더라. 밤에 눕기만 하면 떠올라."},{"s":"n","t":"포기하는 연이의 표정이 일그러졌다. 「…그래도 무섭잖아.」"},{"s":"yeon","t":"응. 지금도 무서워. 앞발 떨려."},{"s":"yeon","t":"근데 무섭다는 이유로, 네가 내 선택을 대신 접는 건 싫어. 접을 거면 내 손으로 접을래."},{"s":"n","t":"회색 조각들이 하나둘, 힘을 잃고 떨어졌다. 「그럼… 정말 힘들 때는 어떡해.」"},{"s":"yeon","t":"그땐 쉬자."},{"s":"n","t":"「…포기하지 말고?」"},{"s":"yeon","t":"응. 쉬는 거랑 포기하는 거. 그거 이제부터 구분하자, 우리."},{"s":"n","fx":"veil","t":"포기하는 연이는 한참을 말없이 바라봤다. 그리고 천천히, 아주 천천히 고개를 끄덕였다. 회색빛이 은빛으로 갈아입었다. 작은 은색 조각이 연이 옆으로 날아와 붙었다."},{"s":"neo","t":"두 번째 비견이다."},{"s":"yeon","t":"이거 시험 맞아? 나 지금 유료 심리상담 받는 기분인데."},{"s":"neo","t":"비겁의 섬은, 네 안에 있는 같은 기운을 정리하는 곳이다."},{"s":"yeon","t":"그럼 서비스명 좀 순화해줘. 방금 거의 멘탈 헬스장 개인 PT였어. 회비도 안 냈는데."},{"s":"n","bgm":"crisis","t":"그때, 거울 속 연이가 박수를 쳤다. 짝. 짝. 짝. 느릿한 세 번."},{"s":"geo","t":"감동적이네. 눈물 나올 뻔했어."},{"s":"geo","t":"그런데 말이야. 정말 전부, 네 편이 될 수 있을 것 같아?"},{"s":"n","fx":"ink","t":"이번엔 수십 개의 거울 조각이 한꺼번에 앞으로 쏟아졌다. 비교하는 연이. 질투하는 연이. 억지로 웃는 연이. 자기 자신을 깎아내리는 연이."},{"s":"n","t":"「쟤는 잘하는데 넌 왜 못 해?」 「괜찮은 척해, 분위기 망치지 말고.」 「너는 원래 운이 없잖아.」 「기대하지 마.」 「괜히 나섰다가 더 창피해질걸.」"},{"s":"n","t":"목소리들이 사방에서 한꺼번에 쏟아졌다. 연이는 두 귀를 틀어막고 싶었다. 하지만 앞발이 뭉툭해서, 소리가 다 새어 들어왔다."},{"s":"yeon","t":"아, 진짜! 이거 완전 새벽 세 시 단체 채팅방 알림이잖아!"},{"s":"geo","t":"당연하지. 전부 너니까."},{"s":"n","fx":"ink","tone":"dark","t":"목소리들이 부풀며 커졌다. 「비교해.」 「숨겨.」 「포기해.」 「그냥 웃어넘겨.」 「네 자리 같은 건, 처음부터 없었어.」"},{"s":"n","t":"연이의 머리 위 꽃이 위태롭게 흔들렸다. [乙]의 초록빛이 흐려졌다. [亥]의 물결마저 검게 일렁였다."},{"s":"n","fx":"claw","t":"네오가 앞을 막아서며 조각들을 베어냈다. 쨍, 쨍, 쨍. 하지만 조각은 잘라내는 속도보다 빠르게 불어났다."},{"s":"neo","t":"연이! 하나씩 상대하지 마라! 그러다 파묻힌다!"},{"s":"yeon","t":"그럼 어떡하라고! 다 내 얼굴이라 어디부터 손대야 할지 모르겠어!"},{"s":"neo","t":"기준을 세워라!"},{"s":"yeon","t":"기준? 무슨 기준!"},{"s":"neo","t":"너를 지키는 목소리와, 너를 빼앗는 목소리. 그 하나로 갈라라!"},{"s":"n","t":"연이는 숨을 삼켰다. 지키는 목소리와, 빼앗는 목소리. 그 두 마디가 머릿속에서 자물쇠처럼 맞물렸다."},{"s":"n","t":"그 순간, 똑같아 보이던 거울 조각들이 조금씩 다르게 보이기 시작했다."},{"s":"n","t":"화난 연이는 사실, 말 좀 하라고 소리치고 있었다. 포기하는 연이는 사실, 좀 쉬어도 된다고 속삭이고 있었다."},{"s":"n","tone":"dark","t":"하지만 비교하는 연이는, 연이를 자꾸만 작게 오려냈다. 억지로 웃는 연이는, 연이를 그 자리에서 지워버렸다. 자기비하하는 연이는, 연이의 의자를 슬그머니 비워놓았다."},{"s":"n","t":"연이는 앞발을 땅에 콱 디뎠다."},{"s":"yeon","t":"오케이. 정리 들어간다."},{"s":"n","t":"머리 위 꽃이 다시 초록으로 밝아졌다."},{"s":"yeon","t":"너희 중에 나를 지키려는 애들은, 이쪽으로 붙어."},{"s":"n","t":"초록빛 덩굴이 연이의 오른쪽으로 길을 냈다. 붉은 조각과 은색 조각이 그 길가에 나란히 자리를 잡았다."},{"s":"yeon","t":"그리고 나를 자꾸 깎아먹는 애들은."},{"s":"n","t":"연이는 거울 속 연이를 정면으로 봤다."},{"s":"yeon","t":"거기, 그대로 있어."},{"s":"geo","t":"흐응. 네가 그걸 구분할 수 있을 것 같아?"},{"s":"yeon","t":"방금 대충 감 잡았어. 정답률 보장은 못 하지만."},{"s":"geo","t":"틀리면?"},{"s":"yeon","t":"틀리면 또 배우겠지. 나 원래 재수강 전문이야."},{"s":"yeon","im":true,"t":"나 완벽하게 고르는 사람 아니야. 근데 이제, 아무 목소리나 내 목소리라고 착각하진 않아."},{"s":"n","bgm":"crisis2","fx":"veil","t":"그 말과 함께, [乙亥]의 빛이 연이 앞에 떠올랐다. 초록빛 새싹이 깊은 물 위에 뿌리를 내렸다. 물은 어둡지만 맑았고, 새싹은 작지만 단단했다."},{"s":"n","t":"연이는 그 빛을 향해 앞발을 뻗었다."},{"s":"geo","t":"안 돼!"},{"s":"n","fx":"hands","tone":"dark","t":"거울 속 연이가 손을 휘두르자, 비교하는 연이·억지로 웃는 연이·자기비하하는 연이의 조각들이 한 덩어리로 뭉쳤다. 검은 유리로 된 거대한 손이 태어났다. 그 손이 [乙亥]를 통째로 움켜쥐려 했다."},{"s":"neo","t":"연이!"},{"s":"yeon","t":"알아, 봤어!"},{"s":"yeon","t":"새싹아, 버텨줘! 딱 삼 초만!"},{"s":"neo","t":"…그 이름으로 확정할 셈인가."},{"s":"yeon","t":"작명은 나중에! 지금은 급하다고!"},{"s":"n","fx":"burst","t":"초록빛 덩굴이 폭발하듯 뻗어 나갔다. 덩굴은 검은 유리 손을 칭칭 휘감았다. 하지만 손은 너무 컸다. 덩굴이 팽팽하게 당겨지며 끊어질 듯 삐걱였다."},{"s":"n","t":"연이의 몸이 뒤로 쭉 밀렸다. 앞발이 바닥을 긁었다."},{"s":"yeon","t":"으아, 힘 차이 실화냐! 밸런스 패치 좀 해!"},{"s":"geo","t":"봐. 결국 넌 약해. 늘 그랬어."},{"s":"yeon","t":"약한 거랑 지는 건, 완전 다른 얘기거든?"},{"s":"n","t":"그 순간 [亥]의 물이 움직였다. 깊은 물이 덩굴 밑동으로 흘러들어, 뿌리를 아래에서 받쳤다. 덩굴이 굵어지고, 초록빛에 푸른빛이 스몄다."},{"s":"neo","im":true,"t":"乙亥가 연결됐다! 지금이다, 연이!"},{"s":"n","t":"연이는 뻗은 앞발을 힘껏 내리쳤다."},{"s":"yeon","t":"내 자리에서, 나가!"},{"s":"n","fx":"claw","t":"덩굴이 검은 유리 손을 옥죄었다. 쨍. 손등에 실금이 갔다. 거울 속 연이의 얼굴이 처음으로 굳었다."},{"s":"yeon","t":"내가 흔들리는 거, 맞아! 인정해!"},{"s":"n","t":"쨍. 금이 거미줄처럼 번졌다."},{"s":"yeon","im":true,"t":"근데 내가 흔들린다고, 네가 나 대신 살아주는 건 아니잖아!"},{"s":"n","fx":"burst","t":"쨍그랑! 검은 유리 손이 산산이 부서졌다. 비교하는 연이, 억지로 웃는 연이, 자기비하하는 연이의 거울이 함께 깨졌다. 조각들은 검은 먼지가 되어 흩어졌다."},{"s":"n","t":"남은 것은 몇 조각뿐이었다. 화난 연이의 붉은 조각. 쉬어도 된다고 말하던 은색 조각. 그리고 방금 새로 태어난, 작은 푸른 조각."},{"s":"neo","t":"…잘했다. 진심이다."},{"s":"yeon","t":"나 방금, 진짜 잘한 거 맞지? 확인 사살 좀 해줘."},{"s":"neo","t":"그래. 잘했다."},{"s":"yeon","t":"오케이. 이 순간 저장 좀. 이런 각, 인생에서 자주 안 나와."},{"s":"n","t":"네오가 말없이 고개를 저었다. 그때, 회랑 한가운데 다시 문장이 떠올랐다."},{"s":"sys","t":"[ 비견 분류 완료 ]\n[ 겁재 정화 진행 중 ]\n[ 乙亥 일주 회수율 87% ]"},{"s":"yeon","t":"잠깐만. 왜 100%가 아니야? 나 방금 클리어했잖아!"},{"s":"n","tone":"dark","t":"거울 속 연이가 천천히 웃었다. 그녀는 아직 사라지지 않았다. 깨진 거울 조각 위에 태연히 서서, 연이를 내려다보고 있었다."},{"s":"geo","t":"당연하지."},{"s":"geo","im":true,"t":"마지막 겁재는, 나니까."},{"s":"n","bgm":"crisis2","fx":"ink","tone":"dark","t":"연이의 등줄기가 서늘해졌다. 거울 속 연이의 몸 뒤로, 검은 거울 날개가 활짝 펼쳐졌다. 그 깃털 하나하나에 얼굴이 비쳤다."},{"s":"n","t":"연이가 부러워했던 얼굴. 연이가 몰래 비교했던 사람들. 연이가 되고 싶었던 모습들. 그리고, 연이가 세상에서 가장 싫어했던 자기 얼굴들."},{"s":"geo","t":"네가 나를 이기려면, 나를 부수는 게 아니라."},{"s":"n","t":"그녀는 자기 가슴 한복판을 손끝으로 가리켰다."},{"s":"geo","im":true,"t":"나를, 네 안으로 도로 데려가야 해."},{"s":"yeon","t":"…뭐? 그게 무슨 소리야."},{"s":"geo","t":"나는 네가 버린 네 모습이니까. 나를 부숴 없애면, 네 일부도 같이 사라져."},{"s":"n","t":"연이는 반박할 말을 찾다가, 결국 잃었다. 옆을 보니 네오의 표정도 딱딱하게 굳어 있었다."},{"s":"neo","t":"연이."},{"s":"yeon","t":"…응."},{"s":"neo","t":"이게 진짜, 마지막 시험이다."},{"s":"n","t":"연이는 거울 속 자신을 마주 봤다. 인간의 얼굴. 흠 하나 없어 보이는 표정. 그리고 그 미소 안쪽에 웅크린, 빼앗는 힘. 겁재."},{"s":"yeon","t":"오케이. 요약하면… 이번 판이 최종 보스전이네."},{"s":"geo","t":"맞아. 이제야 눈치챘네."},{"s":"n","t":"섬 전체가 다시 크게 흔들렸다. 회랑 위로 마지막 문장이 떠올랐다."},{"s":"sys","im":true,"t":"[ 최종 겁재전 ]\n[ 거울 속의 나를 회수하라. ]"},{"s":"yeon","t":"회수라니. 말은 참 쉽게 한다."},{"s":"neo","t":"네가 도망치면, 저것이 네 자리를 통째로 빼앗는다."},{"s":"yeon","t":"그럼 걍 싸워서 부수면?"},{"s":"neo","t":"부수기만 하면, 너도 너의 일부를 잃는다."},{"s":"yeon","t":"그럼 대체 정답이 뭔데. 힌트 좀."},{"s":"neo","t":"…네 것으로 만들어라. 밀어내지 말고, 껴안아라."},{"s":"n","t":"연이는 거울 속 자신을 오래 바라봤다. 거울 속 연이도 똑같이 마주 봤다. 하나는 인간, 하나는 꽃돼지. 얼굴은 딴판인데, 눈빛만은 처음보다 조금 닮아 있었다."},{"s":"yeon","t":"진짜, 어렵게도 산다. 나라는 인간."},{"s":"geo","t":"…그러게 말이야."},{"s":"n","t":"이번 대답에는 비웃음이 없었다. 아주 잠깐. 정말 눈 깜짝할 사이. 같은 사람이 같은 피로를 나눠 지는, 그런 얼굴이었다."},{"s":"n","fx":"burst","tone":"dark","t":"그리고 다음 순간, 거울 속 연이가 검은 날개를 활짝 펼치며 연이를 향해 달려들었다."},{"s":"sys","im":true,"t":"[ 비겁의 섬 최종전 시작 ]"}]});
