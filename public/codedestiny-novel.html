<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Code Destiny Novel · 연이의 운명 노벨</title>
<style>
/* ============ RESET / TOKENS ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1026; --navy2:#141a37; --silver:#E8E4D9; --gold:#C9A227; --gold-soft:#e9c46a; --red:#8B1E2D; --red-bright:#e2323a;
  --pink:#f8bbdd; --lav:#b99cff;
  --ink:rgba(232,228,217,.92); --muted:rgba(232,228,217,.62);
  --glass:rgba(9,12,30,.72); --glass-strong:rgba(6,8,22,.86);
  --ease:cubic-bezier(.22,1,.36,1);
  /* 오행 호흡(五行息) 색 토큰 — 금/목/화/수/토 */
  --el-metal:#e6edf5; --el-metal-deep:#9fb4cc;
  --el-wood:#7fd6a2;  --el-wood-deep:#2f7d55;
  --el-fire:#ff7a45;  --el-fire-deep:#c2360f;
  --el-water:#4a5f8f; --el-water-deep:#101a33;
  --el-earth:#d9b382; --el-earth-deep:#8a6a3c;
  --serif:'Noto Serif KR','Nanum Myeongjo',"Apple SD Gothic Neo",serif;
  --sans:'Pretendard',system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
}
html,body{height:100%;background:#05060c;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0}
img{display:block;max-width:100%}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hidden{display:none!important}
.stageWrap{position:absolute;inset:0;overflow:hidden}

/* ============ STARFIELD (shared bg) ============ */
#nebula{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:var(--silver);opacity:.0;animation:twinkle linear infinite}
@keyframes twinkle{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.7;transform:translateY(-6px)}}
.moonGlow{position:absolute;width:60vmax;height:60vmax;left:50%;top:-24vmax;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(233,196,106,.10),rgba(185,156,255,.05) 40%,transparent 68%);pointer-events:none;z-index:0}

/* ============ ENTER OVERLAY (premium 달빛 다크) ============ */
#enter{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.2vh,30px);text-align:center;padding:6vh 20px;
  background:
    radial-gradient(120% 88% at 50% 6%,rgba(30,26,66,.5),transparent 46%),
    radial-gradient(92% 72% at 50% 30%,#111637,#0a0d24 56%,#05060c 100%),
    radial-gradient(78% 42% at 50% 120%,rgba(201,162,39,.16),transparent 60%)}
#enter::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(122% 122% at 50% 48%,transparent 56%,rgba(3,4,10,.72) 100%)}
#enter>*{position:relative;z-index:1}
#enter .brand{font-family:var(--serif);letter-spacing:.44em;color:var(--gold-soft);font-size:clamp(.66rem,1.8vw,.84rem);text-transform:uppercase;opacity:0;animation:rise .8s var(--ease) .15s both}
/* 달 — 발광 디스크 + 크레이터 + 궤도 링 + 궤도 별 */
.moonOrbit{position:relative;display:grid;place-items:center;width:clamp(148px,25vw,214px);aspect-ratio:1;opacity:0;animation:rise 1s var(--ease) .3s both}
.moonOrbit .ring{position:absolute;border-radius:50%;border:1px solid rgba(233,196,106,.2)}
.moonOrbit .ring1{width:78%;aspect-ratio:1;animation:spin 46s linear infinite}
.moonOrbit .ring1::before{content:"";position:absolute;top:-3px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:#fff7e0;box-shadow:0 0 10px rgba(255,247,224,.95)}
.moonOrbit .ring2{width:100%;aspect-ratio:1;border-style:dashed;border-color:rgba(185,156,255,.16);animation:spin 74s linear infinite reverse}
.moon{position:relative;width:52%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fff8e6,#f2d488 50%,#c9a227 100%);
  box-shadow:inset 0 0 0 1px rgba(255,247,224,.35),inset -10px -12px 26px rgba(120,86,20,.35),0 0 46px rgba(233,196,106,.55),0 0 104px rgba(233,196,106,.3),0 0 156px rgba(185,156,255,.14);
  animation:moonBreath 7s ease-in-out infinite}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 66% 60%,rgba(150,110,28,.28),transparent 22%),radial-gradient(circle at 32% 68%,rgba(150,110,28,.2),transparent 17%),radial-gradient(circle at 58% 30%,rgba(150,110,28,.16),transparent 13%)}
@keyframes moonBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
#enter h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.1rem,7.2vw,3.7rem);line-height:1.12;color:var(--silver);text-wrap:balance;
  text-shadow:0 0 34px rgba(233,196,106,.28),0 2px 30px rgba(0,0,0,.5);opacity:0;animation:rise .9s var(--ease) .5s both}
#enter h1 small{display:block;font-family:var(--serif);font-size:.4em;letter-spacing:.52em;color:rgba(232,228,217,.72);margin-top:1em;font-weight:400}
.enterDivider{display:flex;align-items:center;gap:14px;width:min(320px,68vw);opacity:0;animation:rise .8s var(--ease) .66s both}
.enterDivider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(233,196,106,.55),transparent)}
.enterDivider b{color:var(--gold);font-size:.78rem;opacity:.85;transform:translateY(-1px)}
#enterBtn{position:relative;overflow:hidden;margin-top:2px;padding:16px clamp(38px,7vw,48px);border-radius:999px;font-family:var(--serif);font-size:clamp(1rem,2.2vw,1.12rem);letter-spacing:.16em;color:#1a1206;
  background:linear-gradient(135deg,#fff6d8,#e9c46a 56%,#c9a227);
  box-shadow:0 16px 44px rgba(201,162,39,.36),0 0 0 1px rgba(255,247,224,.5) inset,0 0 0 6px rgba(233,196,106,.08);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease);opacity:0;animation:rise .8s var(--ease) .82s both}
#enterBtn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.55) 48%,transparent 64%);transform:translateX(-125%);animation:sheen 5s ease-in-out 1.6s infinite}
@keyframes sheen{0%,74%{transform:translateX(-125%)}88%,100%{transform:translateX(125%)}}
#enterBtn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 22px 58px rgba(201,162,39,.52),0 0 0 1px rgba(255,247,224,.6) inset,0 0 0 8px rgba(233,196,106,.12)}
#enterBtn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:4px}
#enter .hint{color:rgba(232,228,217,.6);font-size:clamp(.74rem,1.6vw,.82rem);letter-spacing:.06em;opacity:0;animation:rise .8s var(--ease) .98s both}
/* 진입 마스코트 꽃돼지 (우하단 — 연이의 따뜻함) */
#enterPig{position:absolute;right:clamp(14px,4vw,54px);bottom:clamp(12px,3.4vh,44px);z-index:2;width:clamp(96px,13vw,150px);aspect-ratio:1;pointer-events:none;opacity:0;animation:rise 1s var(--ease) 1.15s both}
#enterPig .epInner{position:absolute;inset:0;animation:pigFloat 6s ease-in-out infinite}
#enterPig .epGlow{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle at 50% 46%,rgba(248,187,221,.42),rgba(233,196,106,.2) 42%,transparent 68%);filter:blur(8px);animation:pigGlow 4.6s ease-in-out infinite}
#enterPig .epImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;transform:scale(1.12);filter:drop-shadow(0 10px 18px rgba(0,0,0,.4)) drop-shadow(0 0 14px rgba(248,187,221,.45))}
#enterPig .spark{position:absolute;color:#ffe9b1;opacity:0;pointer-events:none;text-shadow:0 0 8px rgba(255,233,177,.85);animation:sparkTwinkle 3s ease-in-out infinite}
@media (max-width:600px){#enterPig{right:8px;bottom:8px;width:clamp(76px,22vw,112px)}}

/* ============ MAIN SCREEN ============ */
#main{position:absolute;inset:0;z-index:20;opacity:0;transition:opacity .8s var(--ease)}
#main.on{opacity:1}
#mainHero{position:absolute;right:4vw;bottom:0;height:96vh;max-height:1000px;z-index:2;
  transform-origin:50% 100%;filter:drop-shadow(0 30px 60px rgba(0,0,0,.55));will-change:transform;
  -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 99%);mask-image:linear-gradient(to bottom,#000 72%,transparent 99%);
  animation:heroIn 1.2s var(--ease) both,breathe 6s ease-in-out 1.2s infinite}
/* 모바일 메인 히어로(연이 반신상).
   중앙 정렬을 transform:translateX(50%) 로 하면 안 된다 — #mainHero 에는 heroIn(fill:both)과
   breathe(무한)가 걸려 있고 둘 다 transform 을 애니메이트해서 정렬용 transform 을 덮어쓴다.
   그러면 right:50% 만 남아 이미지 오른쪽 끝이 화면 정중앙에 붙고 인물이 왼쪽으로 잘려나갔다.
   left/right/margin 으로 정렬하면 애니메이션과 충돌하지 않는다.
   mask 하단 컷도 96vh 기준 72% 라 64vh 인 모바일에서는 몸통을 먹어 완화한다. */
@media (max-width:760px){#mainHero{left:0;right:0;margin:0 auto;height:64vh;opacity:.82;
  -webkit-mask-image:linear-gradient(to bottom,#000 90%,transparent 100%);mask-image:linear-gradient(to bottom,#000 90%,transparent 100%)}}
@keyframes heroIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.008)}}
#mainVeil{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(70% 38% at 28% 120%,rgba(201,162,39,.1),transparent 60%),
    radial-gradient(120% 118% at 52% 48%,transparent 60%,rgba(3,4,10,.5) 100%),
    linear-gradient(180deg,rgba(5,6,12,.35) 0%,transparent 26%,transparent 55%,rgba(5,6,12,.6) 100%)}
#mainInner{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 min(9vw,120px)}
#mainInner .eyebrow{font-family:var(--serif);letter-spacing:.4em;text-transform:uppercase;color:var(--gold-soft);font-size:.8rem;
  opacity:0;animation:rise .7s var(--ease) .5s both}
#mainInner h2{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.08;color:var(--silver);margin:.24em 0 .1em;
  text-shadow:0 0 32px rgba(185,156,255,.2);opacity:0;animation:rise .8s var(--ease) .66s both}
#mainInner .tag{color:var(--muted);font-size:clamp(.92rem,2vw,1.06rem);max-width:26ch;line-height:1.7;opacity:0;animation:rise .8s var(--ease) .82s both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
#menu{margin-top:34px;display:flex;flex-direction:column;gap:2px;max-width:340px}
.menuItem{position:relative;display:flex;align-items:center;gap:14px;padding:13px 4px;font-family:var(--serif);font-size:clamp(1.05rem,2.4vw,1.35rem);
  color:var(--ink);opacity:0;animation:rise .6s var(--ease) both;text-align:left;transition:color .3s var(--ease),transform .4s var(--ease)}
.menuItem:nth-child(1){animation-delay:.98s}.menuItem:nth-child(2){animation-delay:1.06s}.menuItem:nth-child(3){animation-delay:1.14s}
.menuItem:nth-child(4){animation-delay:1.22s}.menuItem:nth-child(5){animation-delay:1.30s}
.menuItem .idx{font-size:.68em;color:var(--gold);opacity:.7;font-family:var(--sans);letter-spacing:.1em;min-width:2.2em}
.menuItem:hover{color:#fff;transform:translateX(6px)}
.menuItem .uline{position:absolute;left:4px;right:4px;bottom:6px;height:1.5px;overflow:visible}
.menuItem .uline line{stroke:var(--gold);stroke-width:1.6;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .5s var(--ease)}
.menuItem:hover .uline line{stroke-dashoffset:0}
.menuItem .sub{font-size:.62em;color:var(--muted);font-family:var(--sans);margin-left:auto;letter-spacing:.02em}
.menuItem--resume{color:var(--gold)}
.menuItem--resume .idx{opacity:1;color:var(--gold);min-width:auto;filter:drop-shadow(0 0 6px rgba(233,196,106,.5))}
.menuItem--resume .sub{color:var(--gold);opacity:.9}
.menuItem--resume .uline line{stroke-dashoffset:0;opacity:.55}

/* ── 요정 꽃돼지 (제목과 연이 반신상 사이 가운데 공백) ── */
#mainPig{position:absolute;left:42%;top:49%;transform:translate(-50%,-50%);z-index:4;
  width:clamp(160px,20vw,290px);aspect-ratio:1/1;cursor:pointer;-webkit-tap-highlight-color:transparent}
#mainPig .pigInner{position:absolute;inset:0;animation:pigFloat 5.2s ease-in-out infinite;will-change:transform;transition:transform .45s var(--ease)}
#mainPig:hover .pigInner,#mainPig:focus-visible .pigInner{transform:scale(1.07)}
#mainPig:focus-visible{outline:none}
#mainPig .pigGlow{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 46%,rgba(248,187,221,.55),rgba(233,196,106,.24) 40%,transparent 68%);
  filter:blur(8px);animation:pigGlow 4.2s ease-in-out infinite}
/* 단일 투명 컷(꽃돼지2) — 배경 없이 깔끔하게, 여백은 살짝 확대로 크롭 */
#mainPig .pigSprite{position:absolute;inset:0;background-repeat:no-repeat;background-size:contain;background-position:center;transform:scale(1.12);
  filter:drop-shadow(0 12px 22px rgba(0,0,0,.45)) drop-shadow(0 0 16px rgba(248,187,221,.5))}
#mainPig .pigRing{position:absolute;left:50%;bottom:2%;width:60%;height:10%;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(248,187,221,.4),transparent 70%);filter:blur(3px);animation:pigGlow 5.2s ease-in-out infinite}
#mainPig .pigBubble{position:absolute;top:2%;right:-6%;padding:7px 13px;border-radius:14px 14px 14px 4px;font-family:var(--serif);
  font-size:.82rem;font-weight:700;color:#3a1f5c;white-space:nowrap;
  background:linear-gradient(135deg,rgba(255,242,249,.96),rgba(248,220,235,.94));border:1px solid rgba(198,160,220,.75);
  box-shadow:0 8px 22px rgba(0,0,0,.28);opacity:0;transform:translateY(8px) scale(.9);
  transition:opacity .32s var(--ease),transform .32s var(--ease);pointer-events:none}
#mainPig:hover .pigBubble,#mainPig:focus-visible .pigBubble{opacity:1;transform:translateY(0) scale(1)}
#mainPig .spark{position:absolute;color:#ffe9b1;opacity:0;pointer-events:none;line-height:1;
  text-shadow:0 0 8px rgba(255,233,177,.85);animation:sparkTwinkle 3s ease-in-out infinite}
@keyframes pigFloat{0%,100%{transform:translateY(2px) rotate(-2.4deg)}50%{transform:translateY(-14px) rotate(2.4deg)}}
@keyframes pigGlow{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes sparkTwinkle{0%,100%{opacity:0;transform:scale(.35) rotate(0)}45%{opacity:1;transform:scale(1) rotate(80deg)}}
@media (max-width:760px){#mainPig{left:50%;top:auto;bottom:9%;transform:translateX(-50%);width:clamp(120px,34vw,180px);opacity:.94}}
@media (max-width:520px){#mainPig{display:none}}

/* ============ BGM TOGGLE ============ */
#bgmBtn{position:absolute;top:calc(env(safe-area-inset-top,0) + 16px);right:18px;z-index:70;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;background:rgba(9,12,30,.5);border:1px solid rgba(233,196,106,.28);backdrop-filter:blur(8px);
  transition:transform .35s var(--ease),border-color .35s}
#bgmBtn:hover{transform:scale(1.08);border-color:rgba(233,196,106,.6)}
#bgmBtn svg{width:22px;height:22px}
#bgmBtn .off{display:none}
#bgmBtn.muted .on{display:none}#bgmBtn.muted .off{display:block}
#bgmBtn.muted{border-color:rgba(232,228,217,.2)}

/* ============ PLAYER ============ */
#player{position:absolute;inset:0;z-index:30;background:#05060c;opacity:0;transition:opacity .6s var(--ease)}
#player.on{opacity:1}
/* L0 background */
.bgLayer{position:absolute;inset:0;z-index:0;overflow:hidden;background:#05060c}
.bgImg{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;opacity:0;transition:opacity 1s var(--ease),filter 1s var(--ease);
  will-change:transform,opacity;animation:kenburns 18s ease-in-out infinite alternate}
.bgImg.show{opacity:1}
.bgImg.dark{filter:brightness(.5) saturate(.7)}
.bgImg.desat{filter:brightness(.55) saturate(.3)}
@keyframes kenburns{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
.bgTint{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,6,12,.28),rgba(5,6,12,.05) 30%,rgba(5,6,12,.32) 72%,rgba(5,6,12,.72) 100%)}
/* L1 characters */
.charLayer{position:absolute;inset:0;z-index:2;pointer-events:none}
.char{position:absolute;bottom:0;height:82vh;max-height:820px;object-fit:contain;object-position:bottom;opacity:0;
  transition:opacity .55s var(--ease),transform .55s var(--ease),filter .55s var(--ease);will-change:transform,opacity,filter;
  -webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 99%);mask-image:linear-gradient(to bottom,#000 80%,transparent 99%)}
.char.show{opacity:1}
.char.slotL{left:2vw;transform:translateY(4%)}
.char.slotC{left:50%;transform:translateX(-50%) translateY(4%)}
.char.slotR{right:2vw;transform:translateY(4%)}
.char.dim{filter:brightness(.6) saturate(.85);transform:scale(.94) translateY(6%)}
.char.slotC.dim{transform:translateX(-50%) scale(.94) translateY(6%)}
.char.mirror{filter:brightness(.92) saturate(.84) hue-rotate(-8deg);transform:scaleX(-1) translateY(4%)}
.char.slotR.mirror{transform:scaleX(-1) translateY(4%)}
.char.mirror.dim{filter:brightness(.58) saturate(.7) hue-rotate(-8deg)}
/* 가짜 연이 = 운명 찻집 연이 4×2 스프라이트 시트에서 셀(col2,row0) 크롭(CSS 배경) */
.char.sheet{height:clamp(340px,62vh,660px);width:clamp(340px,62vh,660px);max-height:none;
  background-repeat:no-repeat;background-size:400% 200%;background-position:66.667% 0%;
  -webkit-mask-image:linear-gradient(to bottom,#000 76%,transparent 99%);mask-image:linear-gradient(to bottom,#000 76%,transparent 99%)}
.char.pig{height:52vh;max-height:520px}
/* 네오=흰 사자 4×4 표정 시트 → 셀(0,0) 크롭. 정사각 컨테이너 + 대화창 위로 부양.
   원본 도형이 명목 격자(313.5px)보다 살짝 커서 이웃 행이 비쳤다 → 크롭창을 300px(=1254/4.18)로 좁혀 프레임별로 맞춘다 */
.char.neo{width:clamp(250px,40vh,430px);height:clamp(250px,40vh,430px);max-height:none;bottom:clamp(150px,22vh,215px);
  background-repeat:no-repeat;background-size:418% 418%;background-position:2.306% 3.145%;
  -webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent 99%);mask-image:linear-gradient(to bottom,#000 88%,transparent 99%)}
/* 주인공 꽃돼지 — 대화창 위로 확실히 부양 + 형제(네오/미러) 위로 z-index + 밝게 유지(가림/dim으로 안 보이던 문제 수정) */
.char.pig:not(.mirror){left:clamp(12px,6vw,100px);right:auto;bottom:clamp(215px,28vh,300px);height:clamp(190px,32vh,340px);max-height:none;transform:none;z-index:4}
.char.pig:not(.mirror).dim{filter:brightness(.86) saturate(.94);transform:scale(.97)}
/* 꽃돼지 주인공 표정/포즈 시트(정규화 4×4 / 4×2) — 셀 비율 264:372 를 컨테이너에 그대로 물려야 도형이 안 늘어난다 */
.char.pig.pigsheet:not(.mirror){left:clamp(0px,4vw,72px);right:auto;bottom:clamp(188px,25vh,272px);
  width:clamp(245px,39vh,420px);height:auto;aspect-ratio:264/372;max-height:none;transform:none;z-index:4;
  background-repeat:no-repeat;background-size:400% 400%;
  -webkit-mask-image:linear-gradient(to bottom,#000 90%,transparent 100%);mask-image:linear-gradient(to bottom,#000 90%,transparent 100%)}
.char.pig.pigsheet:not(.mirror).dim{filter:brightness(.86) saturate(.94);transform:scale(.97)}
/* 초기 미러 = 거울에 비친 반전 꽃돼지(우측·반전, 좌상단 float 미적용) */
.char.mirror.pig{left:auto;right:2vw;bottom:0;height:clamp(220px,40vh,440px);max-height:none;z-index:1}
/* 모카(동료)·까마귀(빌런) 스프라이트 — 네오처럼 대화창 위로 부양 + height 캡(하반신 겹침 방지) */
.char.moka{height:clamp(210px,35vh,390px);max-height:none;bottom:clamp(175px,25vh,240px)}
.char.crow{height:clamp(220px,37vh,410px);max-height:none;bottom:clamp(175px,25vh,240px)}
/* 완결부 캐스트 — 시트(div)는 셀 비율을 그대로 물리고(도형 왜곡 방지), 단일컷(img)은 모카식 height 캡 */
.char.rab{width:clamp(210px,34vh,390px);height:auto;aspect-ratio:401/555;max-height:none;bottom:clamp(175px,25vh,240px);background-repeat:no-repeat}
.char.ln{width:clamp(140px,24vh,270px);height:auto;aspect-ratio:1/1;max-height:none;bottom:clamp(180px,26vh,250px);background-repeat:no-repeat}
.char.lns{width:clamp(180px,29vh,340px);height:auto;aspect-ratio:441/705;max-height:none;bottom:clamp(172px,24vh,235px);background-repeat:no-repeat}
.char.heal{height:clamp(230px,37vh,420px);max-height:none;bottom:clamp(175px,25vh,240px)}
.char.baek{height:clamp(190px,31vh,350px);max-height:none;bottom:clamp(175px,25vh,240px)}
.char.pje{height:clamp(280px,46vh,520px);max-height:none;bottom:clamp(150px,22vh,215px)}
.char.muTrue{height:clamp(260px,43vh,490px);max-height:none;bottom:clamp(160px,23vh,225px)}
/* 인간 네오(박병하) — 은발 미남 4×2 표정 시트 크롭(div 배경). 정체 공개 후 결말에 등장 */
.char.neoh{width:clamp(230px,38vh,430px);height:auto;aspect-ratio:362/543;max-height:none;bottom:clamp(158px,23vh,225px);background-repeat:no-repeat;background-size:400% 200%}
/* 모바일 캐릭터 폭 예산.
   원래는 캐릭터 크기가 vh(화면 높이)로만 정해지고 슬롯 여유는 vw(화면 폭)로 잡혀 있어서 단위가
   어긋났다. 게다가 clamp 하한(165~200px)이 있어 3인 장면의 폭 합계가 어떤 폰에서도 540px 밑으로
   내려가지 않았다 — 390×844 기준 필요 818px / 가용 421px 로 194% 초과라 겹침이 확정이었다.
   해결: 모든 크기에 min(…, 32vw) 상한을 걸어 폭을 화면 폭에 종속시키고 하한 clamp 를 없앤다.
   슬롯 앵커도 화면 밖으로 밀던 -4vw 를 0 으로 되돌린다. 수직 연출(bottom)은 그대로 둔다. */
@media (max-width:760px){.char{height:52vh;width:min(32vw,150px);object-fit:contain;object-position:bottom;bottom:clamp(200px,26vh,252px)}.char.pig{height:38vh}.char.slotL{left:0}.char.slotR{right:0}
  /* 모바일: 대화창(하단 min-height~130px + 패딩/세이프에어리어)이 캐릭터 하반신을 덮던 문제 수정.
     기본 .char 바닥을 대화창 위로 올리고(cast 클래스 없는 인간 연이 포함), 서있는 img 캐스트는 짧은 폰 방어용 px 하한 상향 + 발끝 페이드 마스크로 잔여 겹침을 자연 소멸시킨다. */
  .char.moka,.char.crow,.char.rab,.char.ln,.char.lns,.char.heal,.char.baek,.char.neoh{-webkit-mask-image:linear-gradient(to bottom,#000 90%,transparent 100%);mask-image:linear-gradient(to bottom,#000 90%,transparent 100%)}
  .char.pje,.char.muTrue{-webkit-mask-image:linear-gradient(to bottom,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,#000 93%,transparent 100%)}
  .char.neo{width:min(31vh,32vw);height:min(31vh,32vw);bottom:clamp(176px,21vh,214px);background-size:418% 418%;background-position:2.306% 3.145%}
  .char.sheet{height:min(38vh,32vw);width:min(38vh,32vw)}
  .char.neoh{height:min(33vh,34vw);bottom:clamp(198px,26vh,248px)}
  .char.moka{height:min(31vh,32vw);bottom:clamp(198px,26vh,248px)}.char.crow{height:min(33vh,32vw);bottom:clamp(198px,26vh,248px)}
  .char.mirror.pig{right:0;width:min(28vh,32vw);height:min(28vh,32vw);bottom:clamp(150px,20vh,190px)}
  .char.pig:not(.mirror){left:0;bottom:clamp(190px,26vh,232px);height:min(24vh,32vw)}
  .char.pig.pigsheet:not(.mirror){left:0;bottom:clamp(188px,24vh,222px);width:min(28vh,32vw);height:auto;aspect-ratio:264/372}
  .char.rab{width:min(28vh,32vw);bottom:clamp(198px,26vh,248px)}
  .char.ln{width:min(20vh,26vw);bottom:clamp(200px,26vh,250px)}
  .char.lns{width:min(24vh,30vw);bottom:clamp(198px,26vh,248px)}
  .char.heal{height:min(31vh,36vw);bottom:clamp(198px,26vh,248px)}
  .char.baek{height:min(27vh,33vw);bottom:clamp(198px,26vh,248px)}
  .char.pje{height:min(37vh,44vw);bottom:clamp(190px,24vh,240px)}
  .char.muTrue{height:min(35vh,42vw);bottom:clamp(190px,24vh,238px)}}
/* L2 effects */
.fxLayer{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
/* L3 dialogue */
.dlgWrap{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 clamp(12px,4vw,64px) calc(env(safe-area-inset-bottom,0) + clamp(14px,3vw,30px));
  display:flex;justify-content:center;pointer-events:none}
.dlg{pointer-events:auto;position:relative;width:min(960px,100%);min-height:170px;padding:26px clamp(20px,3vw,34px) 30px;cursor:pointer;
  border:1px solid rgba(233,196,106,.4);border-radius:24px 24px 24px 10px;backdrop-filter:blur(18px);word-break:keep-all;
  background:
    radial-gradient(circle at 92% 0%,rgba(185,156,255,.16),transparent 42%),
    radial-gradient(circle at 8% 100%,rgba(233,196,106,.10),transparent 46%),
    linear-gradient(135deg,rgba(232,228,217,.06),rgba(232,228,217,.02)),var(--glass-strong);
  box-shadow:0 28px 84px rgba(3,4,12,.6),0 0 42px rgba(185,156,255,.10),inset 0 1px 0 rgba(255,255,255,.14);
  transition:border-color .4s,box-shadow .4s,transform .18s var(--ease)}
.dlg::before{content:"";position:absolute;inset:9px;border:1px solid rgba(233,196,106,.14);border-radius:18px 18px 18px 6px;pointer-events:none}
.dlg .spk{display:inline-flex;align-items:center;gap:9px;margin-bottom:12px}
.dlg .spk i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.82rem;font-weight:800;color:#12081f;
  background:linear-gradient(135deg,#fff6d8,#e7c66a 58%,#f7a8c8);border:1px solid rgba(233,196,106,.5)}
.dlg .spk b{font-family:var(--serif);font-weight:800;font-size:1rem;color:var(--gold-soft);letter-spacing:.02em}
.dlg .body{font-family:var(--serif);font-size:clamp(1.02rem,1.5vw,1.16rem);line-height:1.84;color:var(--ink);white-space:pre-wrap;min-height:2.6em}
.dlg .caret{color:var(--gold-soft);opacity:.85;animation:caret .9s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.dlg .next{position:absolute;right:24px;bottom:14px;font-size:.76rem;font-weight:800;color:rgba(255,233,177,.9);opacity:0;transition:opacity .3s}
.dlg[data-done="true"] .next{opacity:1;animation:nextPulse 1.6s ease-in-out infinite}
@keyframes nextPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.dlg .leaf{position:absolute;right:18px;bottom:16px;width:20px;height:20px;opacity:.5}
.dlg[data-typing="true"] .leaf{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* speaker variants */
.dlg[data-spk="neo"]{border-color:rgba(185,34,43,.5)}
.dlg[data-spk="neo"] .spk i{background:rgba(116,18,29,.5);color:#fff5d7;border-radius:6px;border:1px solid rgba(226,50,58,.6);font-size:.62rem;letter-spacing:.08em;width:auto;padding:5px 8px;height:auto}
.dlg[data-spk="neo"] .spk b{color:#f5d487}
.dlg[data-spk="mu"]{border-color:rgba(90,90,120,.5);background:linear-gradient(135deg,rgba(20,18,34,.6),rgba(6,6,14,.9))}
.dlg[data-spk="mu"] .spk i{background:#0b0b16;color:#c9c6df;border:1px solid rgba(120,120,150,.5)}
.dlg[data-spk="mu"] .spk b{color:#bcb9d6}
.dlg[data-spk="mu"] .body{color:rgba(220,216,240,.9)}
.dlg[data-spk="geo"]{border-color:rgba(198,160,220,.55);background:linear-gradient(135deg,rgba(40,20,50,.6),rgba(10,8,20,.9))}
.dlg[data-spk="geo"] .spk i{background:linear-gradient(135deg,#e8d5f5,#c69ad0);color:#3a1f5c;border:1px solid rgba(198,160,220,.6)}
.dlg[data-spk="geo"] .spk b{color:#e6c7f0}
.dlg[data-spk="geo"] .body{color:rgba(232,220,245,.9)}
.dlg[data-spk="moka"]{border-color:rgba(255,170,90,.5);background:linear-gradient(135deg,rgba(60,34,14,.5),rgba(20,12,8,.85))}
.dlg[data-spk="moka"] .spk i{background:linear-gradient(135deg,#ffd8a8,#ff9f5a);color:#3a1e08;border-radius:8px;border:1px solid rgba(255,170,90,.6);font-size:.66rem;width:auto;padding:5px 8px;height:auto;letter-spacing:.02em}
.dlg[data-spk="moka"] .spk b{color:#ffcf9a}
.dlg[data-spk="crow"]{border-color:rgba(140,100,180,.55);background:linear-gradient(135deg,rgba(18,10,30,.7),rgba(4,2,10,.92))}
.dlg[data-spk="crow"] .spk i{background:#0a0614;color:#c9b6e0;border:1px solid rgba(150,110,190,.6);border-radius:6px}
.dlg[data-spk="crow"] .spk b{color:#c9a9e6}
.dlg[data-spk="crow"] .body{color:rgba(225,215,240,.9)}
/* 완결부 캐스트 말풍선 */
.dlg[data-spk="ln"]{border-color:rgba(255,170,200,.5)}
.dlg[data-spk="ln"] .spk i{background:linear-gradient(135deg,#ffd8e8,#ff9ec4);color:#5c1030;border-radius:8px;border:1px solid rgba(255,170,200,.6);font-size:.66rem;width:auto;padding:5px 8px;height:auto}
.dlg[data-spk="ln"] .spk b{color:#ffc6dd}
.dlg[data-spk="lns"]{border-color:rgba(240,180,170,.45)}
.dlg[data-spk="lns"] .spk i{background:#f8e3da;color:#6b2a1c;border-radius:8px;border:1px solid rgba(240,180,170,.55);font-size:.66rem;width:auto;padding:5px 8px;height:auto}
.dlg[data-spk="lns"] .spk b{color:#f2c9ba}
.dlg[data-spk="rab"]{border-color:rgba(130,115,225,.55);background:linear-gradient(135deg,rgba(16,12,40,.7),rgba(4,3,12,.92))}
.dlg[data-spk="rab"] .spk i{background:#14102e;color:#cfc6ff;border:1px solid rgba(150,130,235,.6);border-radius:6px}
.dlg[data-spk="rab"] .spk b{color:#b9a9ff}
.dlg[data-spk="rab"] .body{color:rgba(226,221,246,.92)}
.dlg[data-spk="baek"]{border-color:rgba(170,190,230,.5)}
.dlg[data-spk="baek"] .spk i{background:#eef3fa;color:#2c3c5c;border:1px solid rgba(170,190,230,.6);border-radius:6px}
.dlg[data-spk="baek"] .spk b{color:#cfdcf2}
.dlg[data-spk="pje"]{border-color:rgba(200,40,70,.55);background:linear-gradient(135deg,rgba(30,6,12,.72),rgba(8,2,5,.94))}
.dlg[data-spk="pje"] .spk i{background:#1a060c;color:#ff9eb0;border:1px solid rgba(220,60,90,.6);border-radius:6px}
.dlg[data-spk="pje"] .spk b{color:#ff8fa3}
.dlg[data-spk="pje"] .body{color:rgba(246,222,228,.92)}
.dlg[data-spk="n"] .spk,.dlg[data-spk="sys"] .spk{display:none}
.dlg[data-spk="n"] .body{color:rgba(232,228,217,.82);font-style:italic}
/* system callout */
.dlg[data-spk="sys"]{border-color:rgba(185,156,255,.4);background:linear-gradient(135deg,rgba(20,26,55,.7),rgba(8,10,26,.92))}
.dlg[data-spk="sys"] .body{font-family:var(--sans);letter-spacing:.02em;color:#dcd3ff;font-size:clamp(1rem,1.5vw,1.14rem);text-align:center;font-weight:600}
/* impact (팩폭/각성) */
.dlg.impact{border-color:rgba(226,50,58,.7);box-shadow:0 0 0 1px rgba(185,34,43,.4),0 22px 60px rgba(115,12,24,.5),0 28px 84px rgba(3,4,12,.6);animation:impactShake 2s ease-out both}
.dlg.impact .body{font-family:var(--serif);font-weight:800;font-size:clamp(1.12rem,1.9vw,1.42rem);letter-spacing:.01em;line-height:1.6;color:#ffe6c9}
@keyframes impactShake{0%{transform:translateX(0)}8%{transform:translateX(-5px)}16%{transform:translateX(5px)}24%{transform:translateX(-3px)}32%{transform:translateX(3px)}40%{transform:translateX(0)}100%{transform:translateX(0)}}

/* L4 controls */
#ctl{position:absolute;top:calc(env(safe-area-inset-top,0) + 14px);left:14px;z-index:8;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:min(64vw,600px)}
.cbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(9,12,30,.5);border:1px solid rgba(233,196,106,.24);
  backdrop-filter:blur(8px);color:var(--muted);position:relative;transition:color .3s,border-color .3s,background .3s;font-size:.68rem;font-weight:800;letter-spacing:.04em}
.cbtn:hover{color:#fff;border-color:rgba(233,196,106,.55)}
.cbtn.active{color:#1a1206;background:linear-gradient(135deg,#fff6d8,#e7c66a);border-color:transparent}
.cbtn .lbl{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--muted);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .25s;font-weight:600;letter-spacing:.06em}

#epTag{position:absolute;top:calc(env(safe-area-inset-top,0) + 18px);left:50%;transform:translateX(-50%);z-index:8;font-family:var(--serif);

#toBackBtn{position:absolute;bottom:calc(env(safe-area-inset-bottom,0) + 6px);left:50%;transform:translateX(-50%);z-index:8}

/* overlays: log / save / settings / chapter card */
.ov{position:absolute;inset:0;z-index:90;background:rgba(4,5,12,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s}
.ov.on{opacity:1;pointer-events:auto}
.ovCard{width:min(680px,100%);max-height:82vh;overflow:auto;background:linear-gradient(160deg,rgba(20,26,55,.9),rgba(8,10,26,.96));
  border:1px solid rgba(233,196,106,.28);border-radius:20px;padding:26px 26px 30px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.ovCard h3{font-family:var(--serif);color:var(--gold-soft);font-size:1.2rem;margin-bottom:16px;letter-spacing:.06em}
.logRow{padding:10px 0;border-bottom:1px solid rgba(233,196,106,.1);font-size:.92rem;line-height:1.7}
.logRow .who{color:var(--gold-soft);font-weight:800;margin-right:8px;font-family:var(--serif)}
.logRow.n .who{display:none}.logRow.n{color:var(--muted);font-style:italic}
.ovClose{margin-top:18px;display:inline-block;padding:11px 26px;border-radius:999px;background:linear-gradient(135deg,#fff6d8,#e7c66a);color:#1a1206;font-weight:700;letter-spacing:.06em}

.sw{width:52px;height:28px;border-radius:999px;background:rgba(232,228,217,.16);position:relative;transition:background .3s;flex:none}
.sw.on{background:linear-gradient(135deg,#e7c66a,#c9a227)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .3s var(--ease)}

.idxEpWrap{margin:7px 0;border:1px solid rgba(233,196,106,.14);border-radius:12px;overflow:hidden;background:rgba(16,22,50,.35)}

/* toast */
#toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);z-index:95;padding:11px 22px;border-radius:999px;
  background:rgba(9,12,30,.9);border:1px solid rgba(233,196,106,.4);color:var(--gold-soft);font-size:.86rem;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* effect keyframes */
@keyframes flash{0%{opacity:0}20%{opacity:.92}100%{opacity:0}}
@keyframes ringOut{from{transform:translate(-50%,-50%) scale(.1);opacity:.9}to{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes handRise{0%{transform:translateY(30%) scaleY(.6);opacity:0}30%{opacity:.95}100%{transform:translateY(-4%) scaleY(1);opacity:.9}}
@keyframes fingerTremble{0%,100%{transform:rotate(0)}50%{transform:rotate(1.4deg)}}
@keyframes shake6{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}}
@keyframes dashDraw{to{stroke-dashoffset:0}}
@keyframes inkOut{from{clip-path:circle(0% at 50% 60%)}to{clip-path:circle(150% at 50% 60%)}}
@keyframes veilDown{from{transform:translateY(-100%);opacity:0}30%{opacity:.7}to{transform:translateY(0);opacity:0}}
@keyframes heartEdge{0%,100%{box-shadow:inset 0 0 0 rgba(139,30,45,0)}50%{box-shadow:inset 0 0 120px 30px rgba(139,30,45,.5)}}
@keyframes dust{from{transform:translateY(-10px);opacity:0}20%{opacity:.6}to{transform:translateY(60vh);opacity:0}}
.shakeScreen{animation:shake6 .5s ease-in-out}
/* 변신 8프레임 시퀀스(사람→꽃돼지) + 스케일 팝 */
@keyframes morphFrames{0%{background-position:100% 100%}16%{background-position:66.66% 100%}33%{background-position:33.33% 100%}50%{background-position:0% 100%}66%{background-position:100% 0%}80%{background-position:66.66% 0%}90%{background-position:33.33% 0%}100%{background-position:0% 0%}}
@keyframes morphPop{0%{transform:translate(-50%,-50%) scale(.62) rotate(-6deg);opacity:0}18%{opacity:1}58%{transform:translate(-50%,-50%) scale(1.12) rotate(4deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:0}}
/* 빨려들어감 */
@keyframes suckIn{0%{transform:translateX(-50%) translateY(4%) scale(1) rotate(0);opacity:1}68%{opacity:1}100%{transform:translate(-42%,-46vh) scale(.05) rotate(660deg);opacity:0}}
@keyframes suckSpin{from{transform:translate(-50%,-50%) rotate(0) scale(1)}to{transform:translate(-50%,-50%) rotate(400deg) scale(.15)}}
.char.sucking{animation:suckIn 1.2s cubic-bezier(.5,0,.9,.55) forwards;transform-origin:58% 44%;z-index:4}

/* ===== 오행 호흡(五行息) — fx 키프레임 ===== */
@keyframes vineGrow{from{transform:scaleY(0);opacity:0}30%{opacity:.95}to{transform:scaleY(1);opacity:0}}
@keyframes leafUp{from{transform:translateY(20px) rotate(0);opacity:0}25%{opacity:.85}to{transform:translateY(-58vh) rotate(320deg);opacity:0}}
/* 완결부 기술 전용 이펙트 — 금선 그물·뿌리 균열·개찬 금문자·붉은 실·자미 성반 */
@keyframes lineWeave{0%{transform:scaleX(0);opacity:0}18%{opacity:.95}72%{transform:scaleX(1);opacity:.85}100%{transform:scaleX(1);opacity:0}}
@keyframes knotGlint{0%,100%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.15)}}
@keyframes rootCrack{0%{transform:scaleY(0);opacity:0}25%{opacity:.95}80%{transform:scaleY(1);opacity:.9}100%{transform:scaleY(1);opacity:0}}
@keyframes soilPulse{0%{opacity:0}30%{opacity:.75}100%{opacity:0}}
@keyframes glyphUp{0%{opacity:0;transform:translateY(14px) rotate(0)}25%{opacity:.95}100%{opacity:0;transform:translateY(-46px) rotate(8deg)}}
@keyframes penSweep{0%{transform:translateX(-115%)}100%{transform:translateX(115%)}}
@keyframes threadDraw{0%{transform:scaleX(0);opacity:0}22%{opacity:.95}78%{transform:scaleX(1);opacity:.9}100%{transform:scaleX(1);opacity:0}}
@keyframes threadHeart{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}40%{opacity:.95;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
@keyframes starPop{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.2)}70%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes constLine{0%{transform:scaleX(0);opacity:0}40%{opacity:.8}100%{transform:scaleX(1);opacity:0}}
@keyframes emberRise{from{transform:translateY(0) scale(1);opacity:0}20%{opacity:.9}to{transform:translateY(-52vh) scale(.3);opacity:0}}
@keyframes flameUp{from{transform:translateY(40%);opacity:0}35%{opacity:.85}to{transform:translateY(-10%);opacity:0}}
@keyframes floodUp{from{transform:translateY(100%);opacity:0}40%{transform:translateY(0);opacity:.92}70%{transform:translateY(0);opacity:.85}to{transform:translateY(100%);opacity:0}}
@keyframes frostGlint{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}

/* ===== 기술명 카드(技) ===== */
#skillCard{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;pointer-events:none;z-index:6}
.skWrap{position:relative;margin-right:8vw;display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:skIn .5s var(--ease) both, skOut .45s ease 1.25s both}
.skUnit{font-family:var(--serif);font-size:.92rem;letter-spacing:.32em;color:var(--skc);opacity:.9;
  text-shadow:0 0 14px var(--skg)}
.skName{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--serif);font-weight:700;
  font-size:clamp(2.4rem,8vmin,4.2rem);letter-spacing:.16em;line-height:1.1;color:#fff;
  padding:16px 12px;border-left:2px solid var(--skc);border-right:2px solid var(--skc);
  background:linear-gradient(180deg,transparent,var(--skbg) 45%,transparent);
  text-shadow:0 0 18px var(--skg),0 0 46px var(--skg),0 2px 4px rgba(0,0,0,.6)}
.skHan{font-family:var(--serif);font-size:.9rem;letter-spacing:.28em;color:var(--skc);opacity:.82}
.skSlash{position:absolute;inset:-14% -30%;background:linear-gradient(100deg,transparent 42%,var(--skg) 50%,transparent 58%);
  animation:sheenSlash .7s ease forwards;mix-blend-mode:screen}
@keyframes skIn{from{opacity:0;transform:translateX(28px) scale(.92)}to{opacity:1;transform:none}}
@keyframes skOut{to{opacity:0;transform:translateX(-14px) scale(1.04)}}
@keyframes sheenSlash{from{transform:translateX(-60%)}to{transform:translateX(60%);opacity:0}}
.skWrap.calm{animation:skIn .3s ease both, skOut .3s ease 1.3s both}
.skWrap.calm .skSlash{display:none}
@media (max-width:720px){.skWrap{margin-right:6vw}.skName{font-size:clamp(2rem,11vmin,3.2rem)}}

/* ===== 모바일 최적화 (세로) ===== */
@media (max-width:720px){
  #ctl{gap:6px;flex-wrap:nowrap;overflow-x:auto;max-width:calc(100vw - 64px);padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #ctl::-webkit-scrollbar{display:none}
  .cbtn{width:36px;height:36px;border-radius:10px;font-size:.6rem;flex:0 0 auto}
  .cbtn .lbl{display:none}
  #epTag{top:calc(env(safe-area-inset-top,0) + 58px);font-size:.74rem;letter-spacing:.1em;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dlg{min-height:130px;padding:18px 18px 24px;border-radius:20px 20px 20px 8px}
  .dlg .body{font-size:1rem;line-height:1.72}
  .dlg .next{right:16px;bottom:12px}
  .dlgWrap{padding-left:10px;padding-right:10px}
  #mainHero{opacity:.7}
  #mainInner{padding:0 7vw}
  .ovCard{padding:22px 18px 26px}
}
/* ===== 가로(낮은 높이) ===== */
@media (max-height:520px) and (orientation:landscape){
  .char{height:76vh;max-height:none}
  .char.pig{height:58vh}
  .dlg{min-height:104px;padding:13px 20px 16px}
  .dlg .body{font-size:.95rem;line-height:1.55;min-height:2em}
  #enter{gap:9px;padding:3vh 20px}
  .moonOrbit{width:clamp(84px,15vh,120px)}
  #enterPig{width:clamp(64px,11vh,96px);bottom:6px;right:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.12s!important}
  .bgImg{animation:none}
}

<script>
"use strict";
/* ============================================================

var MOKA={base:NOVEL+enc("모카 기본.png"),moved:NOVEL+enc("모카 감동.png"),angry:NOVEL+enc("모카 화남.png"),

/* audio (단일 인스턴스) */
var audio=new Audio();audio.loop=true;audio.preload="auto";audio.volume=0;
var fadeTimer=null,firstGesture=false;
/* 사주의 강 진입 트랙 재생 실패 시 순차 폴백(riverEnter→진입2→Still Lake) */
audio.addEventListener("error",function(){
  var fb=RIVER_FALLBACK[S.bgmKey];
  if(fb){if(window.console&&console.debug)console.debug("BGM fallback:",S.bgmKey,"→",fb);playTrack(fb);}
});
function playTrack(key,vol){
  if(!key)return; var url=TRK[key]||key;
  if(S.bgmKey===key&&!audio.paused)return;
  S.bgmKey=key;
  var target=(vol==null?0.55:vol);
  if(!S.bgmOn){audio.src=url;return;}
  crossTo(url,target);
}
function crossTo(url,target){
  clearInterval(fadeTimer);
  var startV=audio.volume,outSteps=12,i=0;
  fadeTimer=setInterval(function(){
    i++;audio.volume=Math.max(0,startV*(1-i/outSteps));
    if(i>=outSteps){
      clearInterval(fadeTimer);
      audio.src=url;var p=audio.play();if(p&&p.catch)p.catch(function(){});
      var j=0,inSteps=20;
      fadeTimer=setInterval(function(){j++;audio.volume=Math.min(target,target*(j/inSteps));if(j>=inSteps)clearInterval(fadeTimer);},50);
    }
  },40);
}
/* 첫 제스처: main BGM 4초 페이드인 */
function bgmFirstStart(){
  if(firstGesture)return;firstGesture=true;
  audio.src=TRK.main;audio.volume=0;
  if(S.bgmOn){var p=audio.play();if(p&&p.catch)p.catch(function(){});fadeInOver(0.5,4000);}
  S.bgmKey="main";
}
function fadeInOver(target,ms){
  clearInterval(fadeTimer);var steps=Math.round(ms/60),i=0;
  fadeTimer=setInterval(function(){i++;audio.volume=Math.min(target,target*(i/steps));if(i>=steps)clearInterval(fadeTimer);},60);
}
function setBgm(on){
  S.bgmOn=on;var b=document.getElementById("bgmBtn");b.classList.toggle("muted",!on);
  var sw=document.getElementById("setBgm");if(sw)sw.classList.toggle("on",on);
  if(on){if(!audio.src)audio.src=TRK[S.bgmKey]||TRK.main;var p=audio.play();if(p&&p.catch)p.catch(function(){});fadeInOver(S.screen==="player"?0.5:0.5,1200);}
  else{clearInterval(fadeTimer);audio.pause();audio.volume=0;}
}

function heroParallax(e){
  if(S.screen!=="main")return;
  var cx=window.innerWidth/2,cy=window.innerHeight/2;
  _tx=((e.clientX-cx)/cx)*8;_ty=((e.clientY-cy)/cy)*6;

}
function pxTick(){
  _px+=(_tx-_px)*0.06;_py+=(_ty-_py)*0.06;
  var mh=document.getElementById("mainHero");
  if(mh)mh.style.translate=_px.toFixed(2)+"px "+_py.toFixed(2)+"px";

function enterEpisode(ei,showCard){

    setTimeout(function(){cc.classList.remove("on");setTimeout(function(){cc.classList.add("hidden");},700);runBeat();},1600);

function curBeats(){return EPISODES[S.ep].beats;}

function runBeat(){
  var beats=curBeats();
  if(S.bi>=beats.length){nextEpisode();return;}
  var b=beats[S.bi];curBeat=b;
  // form
  if(b.form)S.form=b.form;
  // bgm
  if(b.bgm)playTrack(b.bgm);
  // background
  if(b.bg)setBg(b.bg,b.tone);
  // cast staging
  stageBeat(b);
  // effect
  if(b.fx)runFx(b.fx);
  // 기술명 카드(오행 호흡)
  if(b.skill)runSkill(b.skill);
  // dialogue
  showDialogue(b);
}

/* --- 임의 지점 점프(지속상태 무손실 복원): 목차/뒤로가기용 --- */
function hydrateTo(ep,bi){
  var eps=EPISODES[ep];if(!eps)return;
  if(bi<0)bi=0;
  var beats=eps.beats;if(bi>=beats.length)bi=beats.length-1;
  S.ep=ep;document.getElementById("epTag").textContent=eps.tag;
  hardClearSlots();S.curBg=null;S.active=null;
  S.form=(ep>=1&&ep<=26)?"pig":"human"; /* EP.26(=index 26)에서 인간화 — 그 화 시작은 꽃돼지, 이후 화는 인간 기본 */
  for(var i=0;i<=bi;i++){
    var b=beats[i];
    if(b.form)S.form=b.form;
    if(b.bg)setBg(b.bg,b.tone);
    if(b.bgm)playTrack(b.bgm);
    stageBeat(b);
  }
  S.bi=bi;curBeat=beats[bi];
  if(beats[bi].fx)runFx(beats[bi].fx);
  if(beats[bi].skill)runSkill(beats[bi].skill);
  showDialogue(beats[bi]);
}
function stepPrev(){
  if(S.typing){finishType();return;}
  if(S.bi>0)hydrateTo(S.ep,S.bi-1);
  else if(S.ep>0){var pe=S.ep-1;hydrateTo(pe,EPISODES[pe].beats.length-1);}
}
/* 목차 — 화(에피소드) 우선. 헤더=화 이동, "연출" 토글로 그 화 장면만 펼침(지연 렌더) */

      (tags.length?'<span class="idxTags">'+escapeHtml(tags.join(" · "))+'</span>':'');

/* --- background swap (crossfade A/B) --- */
function setBg(key,tone){

  var show=document.getElementById("bg"+S.bgSlot);

/* --- character staging --- */
var charLayer=document.getElementById("charLayer");
/* 화자 자동 표시 — 화자 캐릭터가 어느 슬롯에도 없으면 표준 슬롯에 자동 배치하고, 이미 있으면
   top-level b.x(표정)로 동기화. 엔진이 원래 읽지 않던 표정 데이터를 되살려 "대화 중 화자가
   안 보이는" 버그를 전 에피소드에서 근본 해결. n/sys/luna는 스프라이트 대상이 아니라 제외. */
var SLOT_PREF={yeon:["l","c","r"],neo:["c","r"],moka:["c","r"],crow:["r","c"],mirror:["r","c"],mu:["c","r"],
  ln:["r","c","l"],lns:["c","r"],rab:["r","c"],baek:["c","r"],pje:["c","r"]};
var EXPR_SYNC={yeon:1,neo:1,moka:1,crow:1,ln:1,lns:1,rab:1,baek:1,pje:1,mu:1}; /* 표정 변형이 있는 캐릭터만 표정 동기화(mirror=형태토글 제외. mu는 x 있을 때만 본모습 컷) */
function beatSpeakerWho(b){
  var s=b.s;
  if(s==="geo")return "mirror";
  if(s==="yeon"||s==="neo"||s==="mu"||s==="moka"||s==="crow"||s==="ln"||s==="lns"||s==="rab"||s==="baek"||s==="pje")return s;
  return null;
}
function slotOfWho(who){
  if(S.slotWho.l===who)return "l";
  if(S.slotWho.c===who)return "c";
  if(S.slotWho.r===who)return "r";
  return null;
}
function updateSlotExpr(slot,who,expr){ /* className/show를 안 건드리고 표정만 교체(깜빡임 방지) */
  var el=document.getElementById("char_"+slot);if(!el){setSlot(slot,who,expr);return;}
  var sp=spriteFor(who,expr,S.form);
  /* cls 변동(네오 사자↔인간 등 형태 전환) 시엔 전체 재생성 — 안 하면 인간 초상이 사자 정사각 박스에 찌그러짐 */
  var wantCls=("char "+slotMap[slot]+" "+(sp.cls||"")).replace(/\s+/g," ").trim();
  var curCls=el.className.replace(/\b(show|dim)\b/g,"").replace(/\s+/g," ").trim();
  if(curCls!==wantCls){setSlot(slot,who,expr);return;}
  if(sp.sheet&&el.tagName==="DIV"){el.style.backgroundImage="url('"+sp.url+"')";el.style.backgroundPosition=sp.pos||"";el.style.backgroundSize=sp.size||"";return;}
  if(!sp.sheet&&el.tagName==="IMG"){setImg(el,sp.url,svgData('<rect width="10" height="10" fill="none"/>',10,10));return;}
  setSlot(slot,who,expr); /* 시트↔img 전환 등 태그 불일치 시 전체 재생성 */
}
function autoStageSpeaker(b){
  var who=beatSpeakerWho(b);if(!who)return;
  var expr=b.x; /* top-level 표정(없을 수 있음) */
  var cur=slotOfWho(who);
  if(cur){if(expr!=null&&EXPR_SYNC[who])updateSlotExpr(cur,who,expr);return;}
  var pref=SLOT_PREF[who]||["c","r","l"];var target=null,i;
  for(i=0;i<pref.length;i++){if(!S.slotWho[pref[i]]){target=pref[i];break;}}          /* 빈 슬롯 우선 */
  if(!target){for(i=0;i<pref.length;i++){if(S.slotWho[pref[i]]!=="yeon"){target=pref[i];break;}}} /* 만석이면 연이 외 교체 */
  if(!target)target=pref[0];
  setSlot(target,who,expr);
}
function stageBeat(b){
  // b.l/b.c/b.r define slots; value {who,x} | null(clear) | undefined(keep)
  ["l","c","r"].forEach(function(slot){
    if(!(slot in b))return;
    var v=b[slot];
    if(v===null){removeSlot(slot);return;}
    setSlot(slot,v.who,v.x);
  });
  // active = speaker
  var spk=b.s;
  if(spk==="geo")S.active="mirror";
  else if(spk==="yeon"||spk==="neo"||spk==="mu"||spk==="moka"||spk==="crow"||spk==="ln"||spk==="lns"||spk==="rab"||spk==="baek"||spk==="pje")S.active=spk;
  autoStageSpeaker(b); // 화자가 슬롯에 없으면 자동 배치 + 표정 동기화(핵심 가시성 수정)
  updateActive();
}
var slotMap={l:"slotL",c:"slotC",r:"slotR"};
var _slotRm={}; /* 슬롯별 대기중 제거 타이머 — hydrateTo 재생 레이스 방지 */
function setSlot(slot,who,expr){
  if(_slotRm[slot]){clearTimeout(_slotRm[slot]);_slotRm[slot]=0;} /* 재배치 시 대기중 제거 취소(안 하면 목차·책갈피 점프에서 슬롯 캐릭터가 사라짐) */
  var id="char_"+slot;var el=document.getElementById(id);
  var sp=spriteFor(who,expr,S.form);
  var wantTag=sp.sheet?"DIV":"IMG"; // 시트 크롭은 background div, 그 외 <img>
  if(el&&el.tagName!==wantTag){if(el.parentNode)el.parentNode.removeChild(el);el=null;}
  if(!el){el=document.createElement(sp.sheet?"div":"img");el.id=id;charLayer.appendChild(el);}
  el.className="char "+slotMap[slot]+" "+(sp.cls||"");el.dataset.who=who;S.slotWho[slot]=who;
  if(sp.sheet){
    el.setAttribute("role","img");el.setAttribute("aria-label",who);
    el.style.backgroundImage="url('"+sp.url+"')";el.style.backgroundPosition=sp.pos||"";el.style.backgroundSize=sp.size||"";
  }else{
    el.alt=who;
    setImg(el,sp.url,svgData('<rect width="10" height="10" fill="none"/>',10,10));
  }
  requestAnimationFrame(function(){el.classList.add("show");});
}
function removeSlot(slot){S.slotWho[slot]=null;var el=document.getElementById("char_"+slot);if(el){el.classList.remove("show");_slotRm[slot]=setTimeout(function(){_slotRm[slot]=0;if(el.parentNode)el.parentNode.removeChild(el);},500);}}
function updateActive(){
  ["l","c","r"].forEach(function(slot){
    var el=document.getElementById("char_"+slot);if(!el)return;
    var isActive=(el.dataset.who===S.active);
    el.classList.toggle("dim",!isActive&&S.active!=null);
  });
}

/* --- dialogue + typewriter --- */
var ICON={yeon:"연",neo:"NEO",mu:"무",geo:"?",moka:"모카",crow:"까악",luna:"루나",n:"달",sys:"코드",
  ln:"루나",lns:"언니",rab:"청",baek:"백문",pje:"박"};
var NAME={yeon:"연이",neo:"네오",mu:"무성",geo:"거울 속 연이",moka:"모카",crow:"까마귀",luna:"루나블룸",n:"",sys:"",
  ln:"루나",lns:"루나 언니",rab:"청토끼",baek:"백문",pje:"박지은"};
function showDialogue(b){
  clearTimeout(typeTimer);
  var spk=b.s||"n";
  dlg.dataset.spk=spk;dlg.classList.toggle("impact",!!b.im);
  spkIcon.textContent=ICON[spk]||"달";spkName.textContent=NAME[spk]||"";
  fullText=b.t||"";shownLen=0;dlgBody.innerHTML="";

function typeStep(){
  if(shownLen>=fullText.length){finishType();return;}
  shownLen++;
  dlgBody.innerHTML=escapeHtml(fullText.slice(0,shownLen))+'<span class="caret">▌</span>';
  var sp=(curBeat&&curBeat.s==="neo")?Math.max(8,Math.min(S.speed,Math.floor(2600/Math.max(1,fullText.length)))):S.speed;
  typeTimer=setTimeout(typeStep,Math.max(4,sp));
}
function finishType(){
  clearTimeout(typeTimer);shownLen=fullText.length;dlgBody.textContent=fullText;
  dlg.dataset.typing="false";dlg.dataset.done="true";S.typing=false;
  if(S.auto)scheduleAuto();
  if(S.skip)setTimeout(doSkipStep,120);
}
function advance(){
  if(curBeat&&curBeat.end){backToMain();return;}
  if(S.typing){finishType();return;}
  S.bi++;runBeat();
}
function doSkipStep(){if(!S.skip)return;if(S.typing){finishType();}advance();}

var _skTimer=0;
function runSkill(sk){

  var host=document.getElementById("player");if(!host)return;
  var old=document.getElementById("skillCard");
  if(old&&old.parentNode)old.parentNode.removeChild(old);

  var hue=elHue(sk.el);
  var box=document.createElement("div");box.id="skillCard";
  var wrap=document.createElement("div");
  wrap.className="skWrap"+(S.reduce?" calm":"");
  wrap.style.cssText="--skc:"+hue.c+";--skg:"+hue.g+";--skbg:"+hue.bg;
  var html="";
  if(sk.unit)html+='<span class="skUnit">'+escapeHtml(sk.unit)+'</span>';
  html+='<span class="skName">'+escapeHtml(sk.name)+'</span>';
  if(sk.han)html+='<span class="skHan">'+escapeHtml(sk.han)+'</span>';

  wrap.innerHTML=html;
