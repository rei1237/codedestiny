<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>베다 점성술 (Beta)</title>
  <style>
    html,body{height:100%;margin:0;background:#050010}
    iframe{border:0;width:100%;height:100%}
  </style>
</head>
<body>
  <iframe id="vedicFrame" title="Vedic Beta"></iframe>
  <script>
    (function(){
      // Cache-bust the actual engine page to avoid stale parsed JS in some environments.
      var v = String(Date.now());
      var src = '/vedic-astrology.html?beta=1&v=' + encodeURIComponent(v);
      document.getElementById('vedicFrame').src = src;
    })();
  </script>
</body>
</html>
