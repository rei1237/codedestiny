<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Cute Animal Totem Cards</title>
  <desc id="desc">Dreamy pastel night background with three cute tarot style animal cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15133e"/>
      <stop offset="45%" stop-color="#42206c"/>
      <stop offset="100%" stop-color="#2f5b9a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#99ecff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#99ecff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#ffbde9" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffbde9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ff"/>
      <stop offset="100%" stop-color="#e9dcff"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#0f0b2e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <rect width="1200" height="780" fill="url(#glow1)"/>
  <rect width="1200" height="780" fill="url(#glow2)"/>

  <g opacity="0.85" fill="#fff0bf">
    <circle cx="130" cy="110" r="3"/>
    <circle cx="220" cy="170" r="2"/>
    <circle cx="320" cy="90" r="2.6"/>
    <circle cx="470" cy="140" r="2.2"/>
    <circle cx="610" cy="95" r="3"/>
    <circle cx="740" cy="170" r="2"/>
    <circle cx="860" cy="120" r="2.8"/>
    <circle cx="1000" cy="180" r="2"/>
    <circle cx="1080" cy="130" r="2.8"/>
  </g>

  <g transform="translate(195 190) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="390" rx="30" fill="url(#card)"/>
    <rect x="16" y="16" width="218" height="358" rx="24" fill="none" stroke="#8f72c2" stroke-opacity="0.5"/>
    <circle cx="125" cy="170" r="74" fill="#fff"/>
    <circle cx="92" cy="155" r="10" fill="#34274e"/>
    <circle cx="158" cy="155" r="10" fill="#34274e"/>
    <path d="M96 198 C112 219, 138 219, 154 198" fill="none" stroke="#5c3f84" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 103 L100 128 L84 70 Z" fill="#f4d3ff"/>
    <path d="M184 103 L150 128 L166 70 Z" fill="#f4d3ff"/>
    <text x="125" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#3e2e61">MOON CAT</text>
  </g>

  <g transform="translate(470 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="420" rx="32" fill="url(#card)"/>
    <rect x="16" y="16" width="228" height="388" rx="26" fill="none" stroke="#9a7ed0" stroke-opacity="0.56"/>
    <circle cx="130" cy="180" r="82" fill="#fff"/>
    <ellipse cx="95" cy="168" rx="11" ry="12" fill="#3b2c5f"/>
    <ellipse cx="165" cy="168" rx="11" ry="12" fill="#3b2c5f"/>
    <path d="M102 222 C118 244, 142 244, 158 222" fill="none" stroke="#6a4b95" stroke-width="9" stroke-linecap="round"/>
    <rect x="87" y="108" width="86" height="26" rx="12" fill="#ffe4f4"/>
    <text x="130" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#403165">AURORA BUNNY</text>
  </g>

  <g transform="translate(790 195) rotate(8)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="390" rx="30" fill="url(#card)"/>
    <rect x="16" y="16" width="218" height="358" rx="24" fill="none" stroke="#8f72c2" stroke-opacity="0.5"/>
    <circle cx="125" cy="170" r="74" fill="#fff"/>
    <circle cx="95" cy="158" r="10" fill="#372958"/>
    <circle cx="155" cy="158" r="10" fill="#372958"/>
    <path d="M100 198 C114 214, 136 214, 150 198" fill="none" stroke="#5f4487" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="88" cy="98" rx="24" ry="38" fill="#d8c6ff"/>
    <ellipse cx="162" cy="98" rx="24" ry="38" fill="#d8c6ff"/>
    <text x="125" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#3d2f62">STAR OWL</text>
  </g>

  <text x="600" y="715" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#fff6d8" letter-spacing="2">Dreamy Animal Totem</text>
</svg>
