<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 360" role="img" aria-label="도리이 개운문 부적">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2244"/>
      <stop offset="1" stop-color="#0f1530"/>
    </linearGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dd4b3d"/>
      <stop offset="1" stop-color="#a5251f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.24" r="0.2">
      <stop offset="0" stop-color="#ffe7a6"/>
      <stop offset="1" stop-color="#e9a348" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="260" height="360" rx="24" fill="url(#bg)"/>
  <rect x="12" y="12" width="236" height="336" rx="18" fill="none" stroke="#e3b365" stroke-opacity="0.9" stroke-width="2"/>
  <rect width="260" height="360" rx="24" fill="url(#sun)"/>

  <g opacity="0.32">
    <circle cx="46" cy="86" r="4" fill="#ffd28e"/>
    <circle cx="208" cy="70" r="5" fill="#ffd28e"/>
    <circle cx="74" cy="128" r="3" fill="#ffd28e"/>
    <circle cx="194" cy="138" r="3" fill="#ffd28e"/>
  </g>

  <g transform="translate(0 16)">
    <rect x="42" y="132" width="176" height="16" rx="6" fill="url(#torii)"/>
    <rect x="58" y="150" width="144" height="10" rx="4" fill="url(#torii)"/>
    <rect x="82" y="160" width="14" height="110" rx="4" fill="url(#torii)"/>
    <rect x="164" y="160" width="14" height="110" rx="4" fill="url(#torii)"/>
    <rect x="110" y="164" width="40" height="10" rx="4" fill="url(#torii)"/>
    <circle cx="130" cy="94" r="24" fill="#f7d697" fill-opacity="0.9"/>
    <circle cx="130" cy="94" r="16" fill="#f2bc67" fill-opacity="0.55"/>
  </g>

  <text x="130" y="314" text-anchor="middle" font-size="23" fill="#fce6bf" font-family="Noto Sans KR, sans-serif" font-weight="700">도리이 개운문</text>
  <text x="130" y="338" text-anchor="middle" font-size="13" fill="#f5ce8e" font-family="Noto Sans KR, sans-serif">행운 입구를 여는 상징</text>
</svg>
