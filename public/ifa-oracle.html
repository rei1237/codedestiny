.footer{text-align:center;margin-top:26px;font-size:10px;letter-spacing:2px;color:#8f7c5c;text-transform:uppercase}

function getContext(){
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
  return audioCtx;
}

function hitDrum(){
  try{
    const c=getContext();
    const t=c.currentTime;
    const o=c.createOscillator();
    const g=c.createGain();
    const f=c.createBiquadFilter();
    o.type="triangle";
    o.frequency.setValueAtTime(180+Math.random()*60,t);
    o.frequency.exponentialRampToValueAtTime(72,t+.22);
    f.type="lowpass";
    f.frequency.value=520;
    g.gain.setValueAtTime(.22,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.23);
    o.connect(f);f.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+.24);
  }catch(_e){}
}

function sacredBell(){
  try{
    const c=getContext();
    const t=c.currentTime;
    [392,523,659].forEach((hz,i)=>{
      const o=c.createOscillator();
      const g=c.createGain();
      o.type="sine";
      o.frequency.value=hz;
      g.gain.setValueAtTime(.16/(i+1),t);
      g.gain.exponentialRampToValueAtTime(.001,t+2.3);
      o.connect(g);g.connect(c.destination);
      o.start(t);o.stop(t+2.3);
    });
  }catch(_e){}
}

function startAmbience(){
  if(ambienceTimer)return;
  try{
    const c=getContext();
    let n=0;
    ambienceTimer=setInterval(()=>{
      const sr=c.sampleRate;
      const size=Math.floor(sr*.08);
      const b=c.createBuffer(1,size,sr);
      const d=b.getChannelData(0);
      for(let i=0;i<size;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(size*.26));
      const src=c.createBufferSource();
      const bp=c.createBiquadFilter();
      const g=c.createGain();
      src.buffer=b;
      bp.type="bandpass";
      bp.frequency.value=140+(n%6)*46;
      bp.Q.value=2.2;
      g.gain.value=.04;
      src.connect(bp);bp.connect(g);g.connect(c.destination);
      src.start();
      n++;
    },480);
  }catch(_e){}
}

function stopAmbience(){
  if(ambienceTimer){clearInterval(ambienceTimer);ambienceTimer=null;}
}

async function typeOracleText(text){
  const target=el("oracleBody");
  const runId=++typingRunId;
  target.textContent="";

  for(let i=0;i<text.length;i++){
    if(runId!==typingRunId)return;
    const ch=text[i];
    target.textContent+=ch;

    let delay=20+Math.floor(Math.random()*22);

    if(ch==="\n") delay=120+Math.floor(Math.random()*60);
    await wait(delay);
  }
}

    return `Àṣẹ. ${L.k} Méjì — 하나의 숨, 하나의 칼, 하나의 길이 열렸습니다.\n\n[신탁의 핵심]\n${L.m}\n${meta.emoji} ${L.cat[cat]}\n\n[정통 이파 분석]\n동일 오두 중첩은 의도가 분산되지 않았음을 뜻합니다. 바발라워의 관점에서 이는 질문과 운명의 축이 정렬된 상태입니다.\n해석 축: ${focus.axis}\n징조: ${focus.omen}\n\n[에너지 진단]\n양 기운 ${yang} / 음 기운 ${yin}\n${biasText}\n권장 타이밍: ${timeHint}\n\n[실천 지침]\n1) 오늘 해야 할 핵심 행동 1개만 확정\n2) 확인 가능한 증거(기록/수치/대화)를 남기기\n3) 밤에 결과 감정과 사건을 3줄로 봉인 기록\n\n[의식과 금기]\n의식: ${focus.ritual}\n금기: ${focus.taboo}\n\n요루바 속담: "${L.py}"\n해석: ${L.pm}\n\n받아들이십시오: ${L.la}\n내려놓으십시오: ${L.rl}\n\nOrunmila witnesses your oath. Ase.`;
  }
  return `Àṣẹ. ${L.k}와 ${R.k}가 교차해 ${meta.label}의 제단을 엽니다.\n\n[두 기둥 진단]\n왼기둥 ${L.k} (원인/뿌리): ${L.cat[cat]}\n오른기둥 ${R.k} (결과/표현): ${R.cat[cat]}\n\n[교차 해석]\n${L.k}는 ${L.la}로 문을 열고, ${R.k}는 ${R.e}의 방식으로 현실의 결론을 만들려 합니다.\n즉, '원인에서의 태도'와 '결과에서의 실행'이 서로 맞물릴 때 복이 커집니다.\n${focus.axis} 관점에서 보면, 지금의 운은 ${focus.omen} 패턴으로 움직입니다.\n\n[정통 이파식 세부 판독]\n1) 뿌리 판독: ${L.k}의 과제는 '${L.rl}'를 걷어내는 데 있습니다.\n2) 현상 판독: ${R.k}는 외부 사건을 통해 선택의 대가를 빠르게 보여줍니다.\n3) 합성 판독: 질문의 핵심을 한 줄로 고정하면 오차가 줄고 응답이 선명해집니다.\n\n[에너지 진단]\n왼기둥 양수 ${leftWeight} / 오른기둥 양수 ${rightWeight}\n총 양 기운 ${yang} / 음 기운 ${yin}\n${biasText}\n권장 타이밍: ${timeHint}\n\n[행동 처방]\n1) 지금 당장 실행할 행동 1개\n2) 24시간 내 검증할 증거 1개\n3) 7일간 반복할 루틴 1개\n\n[의식과 금기]\n의식: ${focus.ritual}\n금기: ${focus.taboo}\n\n요루바 속담: "${L.py}" / "${R.py}"\n해석: ${L.pm} / ${R.pm}\n\n결론: 질문의 뿌리를 지키되, 결과의 속도를 두려워하지 마십시오.\nOrunmila hears. Ase.`;
}

async function cast(){
  if(busy)return;
  busy=true;                       // 게이트 확인 전에 재진입 잠금(더블탭 무력화)
  const castBtn=el("castBtn");
  castBtn.disabled=true;            // 즉시 비활성화
  const gateOk=await ensureIfaCoinGate();
  if(!gateOk){
    busy=false;                     // 게이트 미통과 시 잠금·버튼 원복
    castBtn.disabled=false;
    setPhase("의식이 보류되었습니다 • 결제 권한 확인 후 다시 시도해 주세요");
    return;
  }
  startAmbience();
  el("opon").classList.add("spin");
  el("reveal").style.display="none";
  el("oracleBox").style.display="none";
  el("miniBtns").style.display="none";
  el("castField").style.opacity="1";

  setPhase(`${CATEGORY_META[selectedCategory].emoji} ${CATEGORY_META[selectedCategory].label}의 신탁을 부릅니다...`);
  vib([70,35,70,35,130]);

  bits=Array.from({length:8},()=>Math.random()<.5?0:1);

  for(let i=0;i<8;i++){
    await wait(210);
    hitDrum();
    vib(16);
    renderBit(i,bits[i]);
  }

  await wait(420);
  sacredBell();
  vib([100,45,170]);
  el("opon").classList.remove("spin");

  const L=bits[0]+bits[1]*2+bits[2]*4+bits[3]*8;
  const R=bits[4]+bits[5]*2+bits[6]*4+bits[7]*8;
  const left=O[L].n;
  const right=O[R].n;
  const name=(L===R)?`${left} Meji`:`${left} ${right}`;
  const num=L*16+R+1;

  buildPatternDisplay(bits);
  el("oduName").textContent=name;
  el("oduNum").textContent=`ODU ${num} / 256 · ${CATEGORY_META[selectedCategory].label}`;
  el("reveal").style.display="block";

  setPhase("오두가 계시되었습니다 • The Odu has been revealed");

  el("oracleBox").style.display="block";
  el("oracleBody").innerHTML='<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
  await wait(760);
  lastOracleText=getInterp(L,R,selectedCategory);
  await typeOracleText(lastOracleText);

  castBtn.textContent="다시 점치기 • Cast Again";
  castBtn.disabled=false;
  el("miniBtns").style.display="flex";
  busy=false;
}

function resetAll(){
  busy=false;
  stopAmbience();
  typingRunId++;
  lastOracleText="";
  setPhase("질문을 품고, 오리샤의 바람을 들으세요");
  el("castBtn").textContent="운명 확인하기 (3,000원) • Consult the Oracle";
  el("castBtn").disabled=false;
  el("reveal").style.display="none";
  el("oracleBox").style.display="none";
  el("miniBtns").style.display="none";
  el("opon").classList.remove("spin");
  initField();
}

function saveResult(){
  const odu=el("oduName").textContent || "Unknown";
  const num=el("oduNum").textContent || "";
  const body=lastOracleText || el("oracleBody").textContent || "";
  const cat=`${CATEGORY_META[selectedCategory].emoji} ${CATEGORY_META[selectedCategory].label}`;
  const txt=`IFA Oracle Reading\n${"=".repeat(36)}\n\nCategory: ${cat}\nOdu: ${odu}\n${num}\nBits: ${bits.join(" ")}\n\n${"-".repeat(36)}\n\n${body}\n\n${"-".repeat(36)}\nAse.`;
  if(navigator.share){
    navigator.share({title:`IFA - ${odu}`,text:txt}).catch(()=>download(odu,txt));
  }else{
    download(odu,txt);
  }
}

function download(name,content){
  const b=new Blob([content],{type:"text/plain;charset=utf-8"});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");
  a.href=u;
  a.download=`ifa-${name.replace(/\s+/g,"-").toLowerCase()}.txt`;
  a.click();
  URL.revokeObjectURL(u);
}

function initBackground(){
  const canvas=el("bgCanvas");
  const ctx=canvas.getContext("2d");
  const points=[];

  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();

  function spawn(){
    return {
      x:Math.random()*canvas.width,
      y:canvas.height+10,
      vx:(Math.random()-.5)*.26,
      vy:-(Math.random()*.45+.14),
      life:0,
      max:180+Math.random()*250,
      s:Math.random()<.2?2:1,
      a:.14+Math.random()*.25
    };
  }

  function frame(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(points.length<52)points.push(spawn());
    for(let i=points.length-1;i>=0;i--){
      const p=points[i];
      p.x+=p.vx;p.y+=p.vy;p.life++;
      const alpha=p.a*(1-p.life/p.max);
      if(p.life>=p.max){points.splice(i,1);continue;}
      ctx.fillStyle=`rgba(214,166,75,${alpha.toFixed(3)})`;
      ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
    }
    requestAnimationFrame(frame);
  }

  frame();
  window.addEventListener("resize",resize);
}

el("castBtn").addEventListener("click",cast);
el("resetBtn").addEventListener("click",resetAll);
el("saveBtn").addEventListener("click",saveResult);

initCategory();
initField();
initBackground();
</script>
