<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Samba mode circular app icon</title>
  <desc id="desc">Circular icon for Samba mode, using the existing Samba mode artwork inside a round frame.</desc>

  <!-- Outer background circle -->
  <circle cx="256" cy="256" r="256" fill="#050816"/>

  <!-- Inner clipped artwork -->
  <defs>
    <clipPath id="sambaCircleClip">
      <circle cx="256" cy="256" r="224" />
    </clipPath>
  </defs>

  <!-- Use the existing PNG artwork and crop it to a circle.
       The PNG must live next to this SVG as samba-mode-icon.png -->
  <g clip-path="url(#sambaCircleClip)">
    <image href="samba-mode-icon.png"
           x="0" y="0" width="512" height="512"
           preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Highlight ring -->
  <circle cx="256" cy="256" r="236"
          fill="none"
          stroke="#ffd700"
          stroke-width="14" />
  <circle cx="256" cy="256" r="248"
          fill="none"
          stroke="rgba(255,255,255,0.22)"
          stroke-width="6" />
</svg>
