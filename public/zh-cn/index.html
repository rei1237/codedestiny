.cd-user-card::after{content:'';position:absolute;bottom:-20%;left:15%;width:160px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(60,120,255,0.12),transparent 70%);pointer-events:none}
.cd-user-star{position:absolute;border-radius:50%;background:#fff;animation:cdStarBlink var(--dur,2s) ease-in-out var(--delay,0s) infinite;-webkit-animation:cdStarBlink var(--dur,2s) ease-in-out var(--delay,0s) infinite;opacity:0;will-change:transform,opacity;transform:translateZ(0);-webkit-transform:translateZ(0)}
@keyframes cdStarBlink{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1)}}
@-webkit-keyframes cdStarBlink{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1)}}
.cd-user-card__avatar{position:relative;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#d8b4fe,#8b5cf6 55%,#3b0764 100%);border:2px solid rgba(200,150,255,0.45);box-shadow:0 0 22px rgba(160,100,255,0.55),inset 0 2px 8px rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:cdAvatarGlow 3s ease-in-out infinite;-webkit-animation:cdAvatarGlow 3s ease-in-out infinite;will-change:box-shadow;transform:translateZ(0);-webkit-transform:translateZ(0)}@keyframes cdAvatarGlow{0%,100%{box-shadow:0 0 22px rgba(160,100,255,0.5),inset 0 2px 8px rgba(255,255,255,0.18)}50%{box-shadow:0 0 35px rgba(160,100,255,0.85),0 0 55px rgba(120,60,220,0.3),inset 0 2px 8px rgba(255,255,255,0.22)}}@-webkit-keyframes cdAvatarGlow{0%,100%{box-shadow:0 0 22px rgba(160,100,255,0.5),inset 0 2px 8px rgba(255,255,255,0.18)}50%{box-shadow:0 0 35px rgba(160,100,255,0.85),0 0 55px rgba(120,60,220,0.3),inset 0 2px 8px rgba(255,255,255,0.22)}}
.cd-user-card__avatar-ring{position:absolute;inset:-10px;border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,rgba(239,225,255,0.95) 0 14%,rgba(186,146,255,0.12) 14% 28%,rgba(204,170,255,0.9) 28% 38%,rgba(168,119,255,0.1) 38% 52%,rgba(235,212,255,0.88) 52% 65%,rgba(168,119,255,0.08) 65% 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px));box-shadow:0 0 12px rgba(185,136,255,0.55);animation:cdAvatarSpin 2.2s linear infinite;-webkit-animation:cdAvatarSpin 2.2s linear infinite;will-change:transform;transform:translateZ(0) rotate(0deg);-webkit-transform:translateZ(0) rotate(0deg)}
@keyframes cdAvatarSpin{from{transform:translateZ(0) rotate(0deg)}to{transform:translateZ(0) rotate(360deg)}}@-webkit-keyframes cdAvatarSpin{from{-webkit-transform:translateZ(0) rotate(0deg)}to{-webkit-transform:translateZ(0) rotate(360deg)}}
.cd-user-card__initial{font-size:1.5rem;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(255,255,255,0.7);line-height:1}
.cd-user-card__info{display:flex;flex-direction:column;gap:2px;align-items:center}
.cd-user-card__greeting{font-size:.75rem;color:rgba(190,160,255,0.72);font-weight:600;letter-spacing:.06em}
.cd-user-card__name{font-size:1.25rem;font-weight:900;background:linear-gradient(90deg,#e2d9ff,#c084fc,#f0abfc 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.01em;line-height:1.25}
.cd-user-card__tagline{font-size:.72rem;color:rgba(180,150,255,0.5);font-weight:500;margin-top:2px}
.cd-user-card__actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:12px;border-top:1px solid rgba(140,90,255,0.15);width:100%}
.golden-grain-badge{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;border-radius:999px;border:1px solid rgba(255,200,80,0.28);background:linear-gradient(135deg,rgba(18,8,42,0.96),rgba(30,12,60,0.96));box-shadow:0 8px 32px rgba(0,0,0,0.55),0 0 0 1px rgba(160,100,255,0.12),inset 0 1px 0 rgba(255,220,140,0.14);color:#f0e8ff;font-weight:700;font-size:.84rem;letter-spacing:.01em;z-index:4}
.golden-grain-badge__coin{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff9d6 0%,#ffd14d 46%,#c97a08 100%);border:1.5px solid rgba(255,215,0,0.45);box-shadow:0 0 14px rgba(255,200,50,0.5),inset 0 2px 6px rgba(255,255,200,0.6),0 4px 10px rgba(140,80,8,0.28)}
.golden-grain-badge__coin::before{content:'';width:14px;height:14px;border-radius:50%;border:2px solid rgba(120,60,5,0.4);box-shadow:inset 0 2px 4px rgba(255,250,200,0.6)}
.golden-grain-badge__coin::after{content:'';position:absolute;top:6px;left:7px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.75)}
.golden-grain-badge__value{display:flex;flex-direction:column;line-height:1.15;font-variant-numeric:tabular-nums}
.golden-grain-badge__label{font-size:.62rem;font-weight:700;color:rgba(255,210,110,0.88);letter-spacing:.04em}
.golden-grain-badge__balance{font-size:.85rem;font-weight:900;color:#f5e8ff;white-space:nowrap;text-shadow:0 0 8px rgba(200,160,255,0.35)}
.golden-grain-badge__charge{margin-left:4px;border:none;border-radius:999px;padding:7px 13px;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;font-size:.73rem;font-weight:900;letter-spacing:.02em;cursor:pointer;transition:transform .22s ease,filter .22s ease,box-shadow .22s ease;box-shadow:0 4px 16px rgba(124,58,237,0.48),inset 0 1px 0 rgba(255,255,255,0.18)}
.golden-grain-badge__charge:hover{transform:translateY(-1px) scale(1.04);filter:brightness(1.1);box-shadow:0 6px 22px rgba(168,85,247,0.6),inset 0 1px 0 rgba(255,255,255,0.18)}
.golden-grain-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:14px;z-index:100002;background:radial-gradient(circle at 20% 18%,rgba(255,205,131,.18) 0%,rgba(30,8,34,.74) 54%),rgba(23,8,29,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.golden-grain-modal--open{display:flex}
.golden-grain-modal__card{width:min(620px,96vw);max-height:calc(100vh - 28px);display:flex;flex-direction:column;border-radius:28px;padding:18px 14px 14px;border:1px solid rgba(255,203,147,0.72);background:linear-gradient(165deg,#fff9ef 0%,#ffe9cc 44%,#ffd8bd 100%);box-shadow:0 22px 68px rgba(43,5,29,0.38);position:relative;overflow:hidden}
.golden-grain-modal__card::before{content:'';position:absolute;inset:-40% auto auto -14%;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,222,155,0.54) 0%,rgba(255,222,155,0) 72%);pointer-events:none}
.golden-grain-modal__close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(160,64,21,0.24);background:rgba(255,255,255,0.84);color:#7f3606;font-size:1.2rem;font-weight:700;cursor:pointer;z-index:2}
.golden-grain-modal__head{position:relative;z-index:1;text-align:center;padding:4px 8px 8px}
.golden-grain-modal__title{margin:0 0 6px;font-size:1.38rem;font-weight:900;color:#6d2400;letter-spacing:-.01em}
.golden-grain-modal__subtitle{margin:0;font-size:.91rem;color:#8b4b24;line-height:1.45}
.golden-grain-piggy{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;display:block;overflow:hidden;background:radial-gradient(circle at 30% 25%,#fff2cb 0%,#ffd972 56%,#f6b126 100%);border:2px solid rgba(211,133,17,0.62);box-shadow:inset 0 3px 10px rgba(255,255,255,0.56),0 8px 20px rgba(155,95,15,0.25)}
.golden-grain-piggy__img{width:100%;height:100%;object-fit:cover;display:block}
.golden-grain-piggy.is-shaking{animation:piggyShake .56s ease}
@keyframes piggyShake{0%{transform:rotate(0deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}100%{transform:rotate(0deg)}}
.golden-grain-modal__scroll{overflow-y:auto;overflow-x:hidden;padding:8px 6px 8px 4px;margin-top:8px;max-height:min(50vh,430px);scrollbar-width:thin;scrollbar-color:rgba(194,116,30,.58) rgba(255,235,208,.52)}
.golden-grain-modal__scroll::-webkit-scrollbar{width:8px}
.golden-grain-modal__scroll::-webkit-scrollbar-track{background:rgba(255,235,208,.52);border-radius:999px}
.golden-grain-modal__scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ffbc72,#f58a42);border-radius:999px}
.golden-grain-packages{display:grid;gap:10px}
.golden-grain-package{position:relative;border:1px solid rgba(255,171,101,0.42);border-radius:16px;padding:13px 14px;background:rgba(255,255,255,0.92);cursor:pointer;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;box-shadow:0 2px 8px rgba(160,60,10,0.06)}

.golden-grain-package.is-selected{border-color:rgba(245,124,0,0.95);box-shadow:0 12px 22px rgba(238,137,21,0.24);transform:translateY(-1px) scale(1.01);background:linear-gradient(180deg,rgba(255,255,255,0.98),rgba(255,238,214,0.94))}

.golden-grain-package__name{font-weight:800;color:#742c16}
.golden-grain-package__coin{font-weight:900;color:#b85608;display:inline-flex;align-items:center;gap:3px}

.golden-grain-modal__cta{position:relative;z-index:1;margin-top:10px;padding:10px 4px 2px;background:linear-gradient(180deg,rgba(255,236,211,0) 0%,rgba(255,225,193,.88) 42%,rgba(255,217,182,.98) 100%)}
.golden-grain-modal__charge-btn{margin-top:0;width:100%;border:none;border-radius:14px;padding:14px;background:linear-gradient(135deg,#f94f84,#ff8436);color:#fff;font-size:.98rem;font-weight:900;letter-spacing:.02em;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 8px 20px rgba(210,60,90,0.24)}

.golden-grain-modal__notice{margin-top:10px;text-align:center;color:#9b5a23;font-weight:700;font-size:.78rem}

.cd-section-gate{position:relative;overflow:hidden;border-radius:inherit}
.cd-section-gate__body{filter:blur(6px) brightness(.92);pointer-events:none;user-select:none;transition:filter .35s}
.cd-section-gate--unlocked .cd-section-gate__body{filter:none;pointer-events:auto;user-select:auto}
.cd-section-gate__overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(180deg,rgba(5,2,18,.82) 0%,rgba(8,3,25,.92) 52%,rgba(6,2,20,.97) 100%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:32px 22px;text-align:center;border:1px solid rgba(160,100,255,.18)}
.cd-section-gate--unlocked .cd-section-gate__overlay{display:none}

.cd-section-gate__desc{font-size:.84rem;color:rgba(210,200,245,.85);line-height:1.58;margin:0;max-width:320px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.cd-section-gate__btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:14px 28px;background:linear-gradient(90deg,#ffd54f 0%,#ffaa00 50%,#ff8c00 100%);color:#1a0a3a;font-size:.92rem;font-weight:900;cursor:pointer;box-shadow:0 4px 22px rgba(255,160,0,.48),inset 0 1px 0 rgba(255,255,220,.38);transition:filter .2s,transform .2s;letter-spacing:.03em}

.cd-section-gate__badge{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 9px;border-radius:5px;background:rgba(14,8,2,.82);color:#fde68a;font-size:.68rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;border:1px solid rgba(250,204,21,.55);box-shadow:0 2px 10px rgba(0,0,0,.55)}.cd-section-gate__badge::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 33% 28%,#fffde0 0%,#ffd040 46%,#c97a08 100%);border:1.5px solid rgba(255,200,50,.55);box-shadow:0 0 7px rgba(255,195,40,.6),inset 0 1px 2px rgba(255,255,200,.6);flex-shrink:0}

  .cd-section-gate__body{filter:blur(8px) brightness(.88)}
  .cd-section-gate__title{font-size:1.05rem;max-width:280px}
  .cd-section-gate__desc{font-size:.8rem;max-width:260px;line-height:1.55}

}

    window.removeEventListener('touchstart', onIntent, true);
    window.removeEventListener('keydown', onIntent, true);
    window.removeEventListener('scroll', onIntent, true);
  }

  function scheduleInject(delayMs){
    if (loaded || delayedTimer) return;
    delayedTimer = window.setTimeout(function(){
      delayedTimer = 0;

      if (typeof idle === 'function') {

  }

  function onIntent(){

    scheduleInject(0);
  }

  window.addEventListener('pointerdown', onIntent, true);
  window.addEventListener('touchstart', onIntent, true);
  window.addEventListener('keydown', onIntent, true);

    var els=document.querySelectorAll(SEL);

      if(resumed)return;
      resumed=true;
      els.forEach(function(el){
        el.style.WebkitAnimationPlayState='running';

  function __cdSanitizeAuthUserCache(user) {

  function _cdCollectKnownUnlockKeys() {
    var map = Object.create(null);
    for (var i = 0; i < SECTION_GATE_KEYS.length; i += 1) {
      map[SECTION_GATE_KEYS[i].unlockKey] = true;
    }
    var sectionBtns = document.querySelectorAll('[data-action="unlockPremiumFeature"][data-unlock-key]');
    for (var s = 0; s < sectionBtns.length; s += 1) {

    }
    var tileBtns = document.querySelectorAll('[data-tile-lock-key]');
    for (var t = 0; t < tileBtns.length; t += 1) {
      var tk = tileBtns[t].getAttribute('data-tile-lock-key');
      if (tk) {
        var aliases = resolveTileLockAliasKeys(tk);
        for (var a = 0; a < aliases.length; a += 1) map[aliases[a]] = true;
      }
    }
    return map;
  }
  function _cdApplyUnlocksFromPaymentPayload(payload) {
    var known = _cdCollectKnownUnlockKeys();
    var changed = false;

    function applyKey(rawKey) {
      var k = String(rawKey || '').trim();
      if (!k || k === 'pig-coin-unlock') return;
      var aliases = resolveTileLockAliasKeys(k);
      for (var ai = 0; ai < aliases.length; ai += 1) {
        var ak = aliases[ai];
        if (known[ak] && unlockedFeatureMap[ak] !== true) {
          markUnlockKey(unlockedFeatureMap, ak);
          changed = true;
        }
      }
    }

    var directUnlocks = (payload && Array.isArray(payload.unlockedFeatures)) ? payload.unlockedFeatures : [];
    for (var du = 0; du < directUnlocks.length; du += 1) applyKey(directUnlocks[du]);

    var userUnlocks = (payload && payload.user && Array.isArray(payload.user.unlockedFeatures)) ? payload.user.unlockedFeatures : [];
    for (var uu = 0; uu < userUnlocks.length; uu += 1) applyKey(userUnlocks[uu]);

    var unlockMap = (payload && payload.unlockMap && typeof payload.unlockMap === 'object') ? payload.unlockMap : null;
    if (unlockMap) {
      var unlockMapKeys = Object.keys(unlockMap);
      for (var um = 0; um < unlockMapKeys.length; um += 1) {
        if (unlockMap[unlockMapKeys[um]] === true) applyKey(unlockMapKeys[um]);
      }
    }

    var histories = (payload && payload.pointHistories && Array.isArray(payload.pointHistories)) ? payload.pointHistories : [];
    for (var i = 0; i < histories.length; i += 1) {
      var h = histories[i] || {};
      if (String(h.kind || '') !== 'deduct') continue;
      applyKey(h.featureKey);
    }

    return changed;
  }

  function _cdReconcileSectionUnlocksFromServerPayload(payload) {
    var serverUnlockMap = Object.create(null);

    function collect(rawKey) {
      var key = String(rawKey || '').trim();
      if (!key) return;
      var aliases = resolveTileLockAliasKeys(key);
      for (var i = 0; i < aliases.length; i += 1) {
        serverUnlockMap[aliases[i]] = true;
      }
    }

    var directUnlocks = (payload && Array.isArray(payload.unlockedFeatures)) ? payload.unlockedFeatures : [];
    for (var du = 0; du < directUnlocks.length; du += 1) collect(directUnlocks[du]);

    var userUnlocks = (payload && payload.user && Array.isArray(payload.user.unlockedFeatures)) ? payload.user.unlockedFeatures : [];
    for (var uu = 0; uu < userUnlocks.length; uu += 1) collect(userUnlocks[uu]);

    var unlockMap = (payload && payload.unlockMap && typeof payload.unlockMap === 'object') ? payload.unlockMap : null;
    if (unlockMap) {
      var unlockKeys = Object.keys(unlockMap);
      for (var uk = 0; uk < unlockKeys.length; uk += 1) {
        if (unlockMap[unlockKeys[uk]] === true) collect(unlockKeys[uk]);
      }
    }

    var changed = false;
    for (var si = 0; si < SECTION_GATE_KEYS.length; si += 1) {
      var sectionKey = SECTION_GATE_KEYS[si].unlockKey;
      if (serverUnlockMap[sectionKey] === true) {
        if (unlockedFeatureMap[sectionKey] !== true) {
          markUnlockKey(unlockedFeatureMap, sectionKey);
          changed = true;
        }
      } else if (unlockedFeatureMap[sectionKey] === true) {
        delete unlockedFeatureMap[sectionKey];
        changed = true;
      }
    }

    return changed;
  }

      if (changed) {

        refreshUnlockButtons();
        if (typeof applySectionGates === 'function') applySectionGates();
      }
      return true;
    } catch (_e) {

  }

  async function fetchJsonWithAuth(path, init) {
    var token = await ensureAuthToken(false);
    if (!token) {
      return { ok: false, status: 401, payload: { message: '濡쒓렇?몄씠 ?꾩슂?⑸땲??', code: 'LOGIN_REQUIRED' } };
    }
    var headers = Object.assign({}, (init && init.headers) || {});
    headers.Authorization = 'Bearer ' + token;
    if (init && init.body && !headers['Content-Type']) {
      headers['Content-Type'] = 'application/json';
    }

    var requestInit = Object.assign({}, init || {}, {
      credentials: (init && init.credentials) || 'include',
      headers: headers,
    });

    var response = await fetch(getApiBaseUrl() + path, requestInit);
    var payload = {};
    try { payload = await response.json(); } catch (_e) {}

    if (response.status === 401) {
      var refreshedToken = await ensureAuthToken(true);
      if (refreshedToken) {
        var retryHeaders = Object.assign({}, (init && init.headers) || {});

function initFspSearch() {
  var input = document.getElementById('fsp-search');
  if (!input) return;
  input.addEventListener('input', function() {
    var q = (input.value || '').trim().toLowerCase();
    var cards = document.querySelectorAll('.fsp-card');
    var hasResult = false;
    cards.forEach(function(c) {
      var name = (c.getAttribute('data-name') || '').toLowerCase();
      var match = !q || name.indexOf(q) >= 0;
      c.style.display = match ? '' : 'none';
      if (match) hasResult = true;
    });
    var empty = document.getElementById('fsp-search-empty');
    if (empty) empty.style.display = (q && !hasResult) ? '' : 'none';
    /* 寃??以묒뿉???꾪꽣 踰꾪듉 ?꾩껜 ?좏깮 ?쒖꽦 */
    if (q) {
      document.querySelectorAll('.fsp-filter-btn').forEach(function(b) { b.classList.remove('fsp-filter--active'); });
      var allBtn = document.querySelector('.fsp-filter-btn[data-cat="all"]');
      if (allBtn) allBtn.classList.add('fsp-filter--active');

  });
}

function initFspGrid() {
  var grid = document.getElementById('fsp-grid');
  if (!grid) return;
  var detail = document.getElementById('fsp-detail');
  var closeBtn = document.getElementById('fsp-detail-close');
  var titleEl = document.getElementById('fsp-detail-title');

  grid.addEventListener('click', function(e) {
    var card = e.target.closest('.fsp-card');
    if (!card) return;
    var idx = parseInt(card.getAttribute('data-idx'));
    if (isNaN(idx)) return;
    grid.querySelectorAll('.fsp-card').forEach(function(c) { c.classList.remove('fsp-card--active'); });
    card.classList.add('fsp-card--active');
    if (detail) detail.style.display = '';
    if (titleEl && FAMOUS_DATA[idx]) titleEl.textContent = FAMOUS_DATA[idx].name + ' ?ъ＜?붿옄 遺꾩꽍';
    renderFamousCard(idx);
    if (detail) setTimeout(function() { detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
  });
  grid.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      var card = e.target.closest('.fsp-card');
      if (card) card.click();
    }
  });
  if (closeBtn) {
    closeBtn.addEventListener('click', function() {
      if (detail) detail.style.display = 'none';
      grid.querySelectorAll('.fsp-card').forEach(function(c) { c.classList.remove('fsp-card--active'); });
    });
  }
}

<script>
/* A4 pages are estimated from live font metrics so the page count follows actual UI font size. */
(function () {
  function px(value, fallback) {
    var num = parseFloat(value);
    return Number.isFinite(num) ? num : fallback;
  }

  function estimateA4Pages(charCount, sourceEl) {
    var styles = window.getComputedStyle(sourceEl || document.body);
    var fontSize = px(styles.fontSize, 16);
    var lineHeight = styles.lineHeight === 'normal' ? fontSize * 1.55 : px(styles.lineHeight, fontSize * 1.55);

    var mmToPx = 96 / 25.4;
    var printableWidth = (210 - 40) * mmToPx;
    var printableHeight = (297 - 50) * mmToPx;
    var avgCharWidth = fontSize * 0.94;

    var charsPerLine = Math.max(10, Math.floor(printableWidth / Math.max(1, avgCharWidth)));
    var linesPerPage = Math.max(10, Math.floor(printableHeight / Math.max(1, lineHeight)));
    var charsPerPage = Math.max(300, charsPerLine * linesPerPage);

    return Math.max(1, Math.ceil(charCount / charsPerPage));
  }

  function updateA4PageCount() {
    var nodes = document.querySelectorAll('.js-a4-page-count[data-char-count]');
    if (!nodes.length) return;

    nodes.forEach(function (node) {
      var charCount = parseInt(node.getAttribute('data-char-count'), 10);
      if (!Number.isFinite(charCount) || charCount <= 0) return;

      var sourceSelector = node.getAttribute('data-font-source');
      var sourceEl = sourceSelector ? document.querySelector(sourceSelector) : node.parentElement;
      var pages = estimateA4Pages(charCount, sourceEl || node);
      node.textContent = String(pages);
      node.setAttribute('title', '?꾩옱 ?붾㈃ 湲???ш린 湲곗? 理쒖냼 ' + pages + '??);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateA4PageCount);
  } else {
    updateA4PageCount();
  }

  window.addEventListener('resize', updateA4PageCount);
})();
</script>

      if (lbl) lbl.textContent = '?쫨 諛깆궗???덈컮 紐⑤뱶';

    }
    if (persist) {
      try { localStorage.setItem(NEO_KEY, isNeo ? 'neo' : 'pig'); } catch (_) {}

  }

  /* ??λ맂 ?곹깭 蹂듭썝 */
  var saved;
  try { saved = localStorage.getItem(NEO_KEY); } catch (_) {}
  var initNeo = saved === 'neo' || (saved === null && !!window.__INITIAL_THEME_NEO__);
  applyTheme(initNeo, false);

<script>

window.lazyOpenModal = function(tplId, modalId, openFn) {
  if (!document.getElementById(modalId)) {
    var tpl = document.getElementById(tplId);
    if (tpl && tpl.content) {
      document.body.appendChild(tpl.content.cloneNode(true));
    }
  }
  if (typeof openFn === "function") openFn();
};
